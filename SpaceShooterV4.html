<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>SPACE BLAST — Vertical (Remake)</title>
<style>
  :root { color-scheme: dark; --bg:#000; --fg:#fff; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:"Helvetica Neue", Helvetica, Arial, -apple-system, system-ui, sans-serif; overflow:hidden; }
  canvas { width:100vw; height:100vh; display:block; touch-action:none; image-rendering:pixelated; image-rendering:crisp-edges; }
  #hud { position:fixed; top:env(safe-area-inset-top,0); left:0; right:0; display:flex; align-items:center; gap:12px;
         padding:8px 12px; pointer-events:none; }
  #health { flex:1 1 auto; height:18px; border:2px solid #fff; background:#111; }
  #health > b { display:block; height:100%; width:100%; background:linear-gradient(90deg,#0f0,#7fff00); }
  #score { font-weight:900; font-size:clamp(18px,4vw,32px); }
  #overlay { position:fixed; inset:0; display:grid; place-items:center; background:rgba(0,0,0,0.85); }
  #overlay.hidden { display:none; }
  .title { font-weight:900; font-size:clamp(44px,9vw,100px); line-height:1; margin:0 0 10px; color:#fff; }
  .subtitle { color:#aaa; font-size:clamp(16px,4vw,24px); margin:0 0 20px; text-align:center; }
  .buttons { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .btn { appearance:none; border:2px solid #fff; background:#111; color:#fff; padding:12px 18px; font-weight:800; text-transform:uppercase; border-radius:8px; cursor:pointer; pointer-events:auto; }
  .bigscore { font-weight:900; font-size:72px; line-height:1; color:#fff; margin:0 0 24px; text-align:center; }
  .sr { position:absolute; width:1px; height:1px; margin:-1px; border:0; padding:0; clip:rect(0 0 0 0); overflow:hidden; }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="game" role="img" aria-label="Vertical pixel space shooter"></canvas>
<div id="hud" aria-hidden="true">
  <div id="health" aria-hidden="true"><b id="healthFill"></b></div>
  <div id="score">SCORE: <span id="scoreVal">0</span></div>
</div>
<div id="overlay"><div id="overlayContent"></div></div>
<div id="live" class="sr" aria-live="assertive"></div>

<script>
(() => {
  'use strict';

  // ===== Canvas / Resolution =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha:false });
  ctx.imageSmoothingEnabled = false;

  // Logical resolution tuned for crisp pixels on phones
  let W = 180, H = 320;
  let SCALE = 1;
  function resize() {
    const ww = window.innerWidth, wh = window.innerHeight;
    SCALE = Math.max(1, Math.floor(Math.min(ww / W, wh / H)));
    W = Math.round(ww / SCALE);
    H = Math.round(wh / SCALE);
    canvas.width = W; canvas.height = H;
    canvas.style.width = (W * SCALE) + 'px';
    canvas.style.height = (H * SCALE) + 'px';
  }
  window.addEventListener('resize', resize, { passive:true });
  resize();

  // ===== Random helpers =====
  const R = {
    r() { return Math.random(); },
    i(a,b) { return Math.floor(a + Math.random() * (b - a + 1)); },
    f(a,b) { return a + Math.random() * (b - a); },
    pick(a) { return a[(Math.random()*a.length)|0]; },
    chance(p) { return Math.random() < p; }
  };

  // ===== Audio (optional) =====
  let audioCtx = null, masterGain = null, soundOn = false;
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.25;
    masterGain.connect(audioCtx.destination);
  }
  function beep({ freq=440, type='square', dur=0.08, vol=0.6, slide=0, attack=0.005, decay=0.02 }) {
    if (!audioCtx || !soundOn) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq*slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(attack + decay, dur));
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  const SFX = {
    shoot: () => beep({ freq: R.i(420,520), type:'square', dur:0.06, vol:0.5, slide:0.4, attack:0.001 }),
    boom:  () => { beep({ freq:80, type:'sawtooth', dur:0.2, vol:0.8, slide:0.3, attack:0.001 }); beep({ freq:50, type:'triangle', dur:0.25, vol:0.6, slide:0.25, attack:0.001 }); },
    hit:   () => beep({ freq:180, type:'square', dur:0.07, vol:0.4 }),
    pow:   () => beep({ freq:720, type:'sine', dur:0.12, vol:0.6 })
  };

  // ===== Input (Safari-friendly) =====
  let pointerDown = false, pointerX = W/2;
  function setPointer(e) {
    const r = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    pointerX = Math.max(16, Math.min(W-16, (touch.clientX - r.left) / SCALE));
  }
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); setPointer(e); pointerDown = true; initAudio(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); }, { passive:false });
  window.addEventListener('pointermove', (e) => { if(pointerDown) setPointer(e); }, { passive:true });
  window.addEventListener('pointerup', () => { pointerDown = false; }, { passive:true });
  canvas.addEventListener('touchstart', (e) => { setPointer(e); pointerDown = true; initAudio(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); }, { passive:false });
  window.addEventListener('touchmove', (e) => { if(pointerDown) { setPointer(e); e.preventDefault(); } }, { passive:false });
  window.addEventListener('touchend', () => { pointerDown = false; }, { passive:true });

  // ===== Entities =====
  const bullets = [];
  const enemies = [];
  const orbs = [];
  const sparks = [];

  // Player
  const player = {
    x: W/2,
    y: H - 28,
    vx: 0,
    fireCd: 0,
    hp: 120,
    hpMax: 120,
    alive: true,
    score: 0,
    // permanent stacking
    pow: { rapid:0, spread:0, shield:0, mega:0, side:0 }
  };

  // ===== Drawing helpers =====
  function pRect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }
  function pCircle(x,y,r,c){ ctx.fillStyle=c; const rr=r|0; for(let dy=-rr; dy<=rr; dy++){ const lx=Math.floor(Math.sqrt(rr*rr - dy*dy)); ctx.fillRect((x-lx)|0,(y+dy)|0,(2*lx+1)|0,1);} }

  function drawShip(sx,sy){
    // Bigger ship, upward-facing
    pRect(sx-13, sy-10, 26, 20, '#0ff');
    pRect(sx-9,  sy-7,  18, 14, '#08c');
    pRect(sx-4,  sy-14,  8,  6, '#6cf'); // nose
    pRect(sx-3,  sy+10,  6,  4, '#ff0'); // engine
    pRect(sx-16, sy-4,   3,  8, '#0aa');
    pRect(sx+13, sy-4,   3,  8, '#0aa');
    if(player.pow.shield>0 && (frame&3)<2){ pCircle(sx, sy, 16, 'rgba(0,255,255,0.35)'); }
  }

  function drawEnemy(e){
    const body = (Math.floor(e.t/18)%2===0)?'#0f0':'#f33';
    const eye = '#fff';
    switch(e.kind){
      case 'blob': pCircle(e.x,e.y,18,body); pRect(e.x-6,e.y-3,12,6,eye); pRect(e.x-2,e.y-2,4,4,'#000'); break;
      case 'eye':  pCircle(e.x,e.y,16,body); pCircle(e.x,e.y,9,'#000'); pRect(e.x-3,e.y-3,6,6,eye); break;
      case 'crab': pRect(e.x-18,e.y-12,36,24,body); pRect(e.x-22,e.y-9,6,18,body); pRect(e.x+16,e.y-9,6,18,body); pRect(e.x-9,e.y-4,18,8,'#000'); pRect(e.x-3,e.y-3,6,6,eye); break;
      case 'ufo':  pRect(e.x-20,e.y-8,40,16,body); pRect(e.x-9,e.y-12,18,8,'#0a0'); pRect(e.x-3,e.y-14,6,3,eye); break;
    }
    if(e.flash>0 && (frame&1)===0){ pRect(e.x-22,e.y-18,44,36,'rgba(255,255,255,0.4)'); }
    const hw=28, hh=3, frac=Math.max(0,e.hp/e.maxhp);
    pRect(e.x-hw/2, e.y-22, hw, hh, '#222'); pRect(e.x-hw/2, e.y-22, hw*frac, hh, '#0f0');
  }

  function drawOrb(o){
    const base = o.type==='med' ? '#0f8' : (
      {rapid:'#0ff', spread:'#ff0', shield:'#6ff', heal:'#0f0', mega:'#f0f', side:'#f80'}[o.type] || '#fff'
    );
    pCircle(o.x,o.y,7,'rgba(255,255,255,0.10)');
    pCircle(o.x,o.y,6,'rgba(255,255,255,0.15)');
    pCircle(o.x,o.y,5,base);
    pCircle(o.x,o.y,3,'#fff');
  }

  // Starfield (vertical, with twinkle)
  let starsA=[], starsB=[];
  function initStars(){
    starsA = new Array(180).fill(0).map(()=>({x:R.i(0,W), y:R.i(0,H), s:0.5+R.r(), tw:R.i(0,60)}));
    starsB = new Array(120).fill(0).map(()=>({x:R.i(0,W), y:R.i(0,H), s:1+R.r(), tw:R.i(0,40)}));
  }
  initStars();
  function drawStars(){
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
    for(const st of starsA){
      st.y += 0.35*st.s; if(st.y>H+2){ st.y -= H+2; st.x = R.i(0,W); }
      st.tw=(st.tw+1)%60; const tw = st.tw<30?1:0;
      pRect(st.x, st.y, 1, 1+tw, '#666');
    }
    for(const st of starsB){
      st.y += 0.7*st.s; if(st.y>H+2){ st.y -= H+2; st.x = R.i(0,W); }
      st.tw=(st.tw+1)%40; const tw = st.tw<15?1:0;
      pRect(st.x, st.y, 1+tw, 2, '#aaa');
    }
  }

  // ===== Spawning =====
  function spawnBullet(x,y,vx,vy,life,color,r=3){ bullets.push({x,y,vx,vy,life,color,r}); }
  function difficulty(){ return 1 + Math.min(3, player.score/2000); } // slower ramp
  function spawnEnemy(){
    const x = R.i(22, W-22);
    const d = difficulty();
    const spd = R.f(0.35,0.7) * d;     // slower descent
    const hp  = Math.round(R.f(4,8) * d);
    const kind = R.pick(['blob','eye','crab','ufo']);
    enemies.push({ x, y: -24, vx: R.f(-0.15,0.15), vy: spd, t:0, hp, maxhp:hp, kind, flash:0 });
  }
  function spawnOrb(x,y){
    const type = R.pick(['rapid','spread','shield','heal','mega','side','med']); // med = health pack
    orbs.push({ x, y, vx: 0, vy: R.f(0.4,0.8), r:5, type, t:0 });
  }

  // ===== Game State / Loop =====
  let frame = 0;
  let spawnTimer = 20;
  let orbTimer = 160;
  let playing = false;
  let over = false;
  let rafId = 0;

  function update(){
    frame++;

    // Player control
    if(pointerDown){
      const dx = (pointerX - player.x);
      player.vx += dx * 0.12;
    }
    player.vx *= 0.8;
    player.x += player.vx;
    player.x = Math.max(18, Math.min(W-18, player.x));
    player.y = H-28;

    // Firing (no autofire when not held)
    if (pointerDown && player.alive){
      if (player.fireCd <= 0){
        const baseV = 2.6 + Math.min(3.2, player.pow.rapid*0.5); // slower baseline
        SFX.shoot();
        const megaShots = 1 + Math.min(3, player.pow.mega);
        for (let m=0;m<megaShots;m++){
          const off = (m - (megaShots-1)/2) * 2;
          spawnBullet(player.x+off, player.y-18, 0, -baseV, 50, '#fff', 3+Math.min(3, player.pow.mega));
        }
        const sides = Math.min(4, player.pow.side);
        for (let s=0;s<sides;s++){
          const xx = (s%2===0 ? -12 : 12) + (s>1 ? (s-1)*4 : 0);
          spawnBullet(player.x+xx, player.y-12, (xx>0?0.15:-0.15), -baseV*0.9, 48, '#ff8', 3);
        }
        const spread = player.pow.spread;
        for (let k=1; k<=spread; k++){
          const vx = 0.45 + k*0.2;
          spawnBullet(player.x, player.y-16, -vx, -baseV*0.95, 44, '#ff0', 2);
          spawnBullet(player.x, player.y-16, +vx, -baseV*0.95, 44, '#ff0', 2);
        }
        player.fireCd = Math.max(4, 12 - player.pow.rapid*2);
      } else {
        player.fireCd--;
      }
    } else {
      player.fireCd = Math.max(0, player.fireCd-1);
    }

    // Bullets
    for (let i=bullets.length-1; i>=0; i--){
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy;
      if (--b.life<=0 || b.y<-20 || b.x<-20 || b.x>W+20) bullets.splice(i,1);
    }

    // Enemies (no shooting)
    spawnTimer--;
    if (spawnTimer<=0){
      spawnEnemy();
      spawnTimer = Math.max(20, (R.i(30,60) / difficulty())|0); // slower spawn cadence
    }
    for (let i=enemies.length-1; i>=0; i--){
      const e = enemies[i];
      e.x += e.vx; e.y += e.vy; e.t++;
      if (e.x<18 || e.x>W-18) e.vx *= -1;
      if (e.y>H+24){ enemies.splice(i,1); continue; }
      e.flash = Math.max(0, e.flash-1);
    }

    // Collisions bullets vs enemies
    for (let i=enemies.length-1; i>=0; i--){
      const e = enemies[i], er=18;
      for (let j=bullets.length-1; j>=0; j--){
        const b = bullets[j];
        const dx = e.x - b.x, dy = e.y - b.y;
        if (dx*dx + dy*dy < (er + b.r)*(er + b.r)){
          bullets.splice(j,1);
          e.hp -= (1 + player.pow.mega);
          e.flash = 6;
          if (e.hp<=0){
            explode(e.x,e.y);
            player.score += Math.round(80 * difficulty());
            if (R.chance(0.72)) spawnOrb(e.x, e.y);
            enemies.splice(i,1);
            SFX.boom();
          } else {
            SFX.hit();
          }
          break;
        }
      }
    }

    // Collisions enemies with player
    if (player.alive){
      for (let i=enemies.length-1; i>=0; i--){
        const e = enemies[i];
        if (circleRect(e.x,e.y,18, player.x-18, player.y-14, 36, 28)){
          enemies.splice(i,1);
          explode(e.x,e.y);
          hurt(26);
        }
      }
    }

    // Orbs (homing)
    orbTimer--;
    if (orbTimer<=0){
      spawnOrb(R.i(24,W-24), -12);
      orbTimer = R.i(160, 240);
    }
    for (let i=orbs.length-1; i>=0; i--){
      const o = orbs[i];
      // gentle steering toward player
      const dx = player.x - o.x, dy = player.y - o.y;
      const dist = Math.hypot(dx,dy) || 1;
      const steer = 0.06;
      o.vx = (o.vx || 0) + (dx/dist)*steer;
      o.vy = (o.vy || 0.6) + (dy/dist)*steer;
      o.vx = Math.max(-2, Math.min(2, o.vx));
      o.vy = Math.max( 0.4, Math.min(2.0, o.vy));
      o.x += o.vx; o.y += o.vy;
      if (o.y>H+20){ orbs.splice(i,1); continue; }
      if (circleRect(o.x,o.y,o.r, player.x-18, player.y-14, 36, 28)){
        applyPower(o.type);
        orbs.splice(i,1);
        SFX.pow();
        player.score += 35;
      }
    }

    // Score & HUD
    if (player.alive) player.score++;
    const frac = Math.max(0, player.hp/player.hpMax);
    healthFill.style.width = (frac*100).toFixed(1)+'%';
    healthFill.style.background = frac>0.5 ? 'linear-gradient(90deg,#0f0,#7fff00)' :
                                frac>0.25 ? 'linear-gradient(90deg,#ff0,#ffa500)' :
                                            'linear-gradient(90deg,#f33,#f66)';
    scoreVal.textContent = player.score.toString();
  }

  function render(){
    drawStars();
    drawShip(player.x, player.y);
    for (const b of bullets) pCircle(b.x,b.y,b.r,b.color||'#fff');
    for (const e of enemies) drawEnemy(e);
    for (const o of orbs) drawOrb(o);
    drawSparks();
  }

  function loop(){ if(!playing) return; update(); updateSparks(); render(); rafId = requestAnimationFrame(loop); }

  // Particles
  function explode(x,y){
    for(let i=0;i<30;i++){ const a=Math.random()*Math.PI*2, s=Math.random()*2+0.5;
      sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:R.i(24,44)}); }
  }
  function updateSparks(){
    for (let i=sparks.length-1;i>=0;i--){
      const p=sparks[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=0.98; p.vy*=0.98; p.vy+=0.01;
      if(--p.life<=0) sparks.splice(i,1);
    }
  }
  function drawSparks(){ for(const p of sparks){ pRect(p.x,p.y,2,2, p.life>20?'#fff':'#ff0'); } }

  // Utils
  function circleRect(cx,cy,cr, rx,ry,rw,rh){
    const tx = Math.max(rx, Math.min(cx, rx+rw));
    const ty = Math.max(ry, Math.min(cy, ry+rh));
    const dx = cx - tx, dy = cy - ty;
    return dx*dx + dy*dy <= cr*cr;
  }
  function effectiveDamage(d){ const red=Math.min(0.8, player.pow.shield*0.10); return Math.max(1, Math.round(d*(1-red))); }
  function hurt(d){ player.hp -= effectiveDamage(d); SFX.hit(); if(player.hp<=0){ player.hp=0; player.alive=false; endGame(); } }

  function applyPower(type){
    switch(type){
      case 'rapid': player.pow.rapid++; break;
      case 'spread': player.pow.spread++; break;
      case 'shield': player.pow.shield++; break;
      case 'heal':   player.hp = Math.min(player.hpMax, player.hp+30); break;
      case 'mega':   player.pow.mega++; break;
      case 'side':   player.pow.side++; break;
      case 'med':    player.hp = Math.min(player.hpMax, player.hp+40); player.pow.shield++; break; // health pack: heal + shield
    }
  }

  // ===== Overlay =====
  const overlay = document.getElementById('overlay');
  const overlayContent = document.getElementById('overlayContent');
  function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
  function show(){ overlay.classList.remove('hidden'); }
  function hide(){ overlay.classList.add('hidden'); }
  function btn(t,fn){ const b=document.createElement('button'); b.className='btn'; b.textContent=t; b.addEventListener('click',fn); return b; }

  function showStart(){
    clear(overlayContent);
    const title = document.createElement('div'); title.className='title'; title.textContent='SPACE BLAST';
    const sub = document.createElement('div'); sub.className='subtitle'; sub.textContent='Hold to fire. Drag left/right at the bottom to fly.';
    const buttons = document.createElement('div'); buttons.className='buttons';
    const play = btn('Play', startGame);
    const sound = btn('Sound: Off', ()=>{ if(!audioCtx) initAudio(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); soundOn = !soundOn; sound.textContent = 'Sound: ' + (soundOn?'On':'Off'); });
    buttons.appendChild(play); buttons.appendChild(sound);
    overlayContent.appendChild(title); overlayContent.appendChild(sub); overlayContent.appendChild(buttons);
    show();
  }

  function showGameOver(){
    clear(overlayContent);
    const big = document.createElement('div'); big.className='bigscore'; big.style.fontFamily='Helvetica, Arial, sans-serif'; big.textContent = player.score.toString();
    const buttons = document.createElement('div'); buttons.className='buttons';
    const replay = btn('Replay', startGame);
    const share = btn('Share', shareScore);
    buttons.appendChild(replay); buttons.appendChild(share);
    overlayContent.appendChild(big); overlayContent.appendChild(buttons);
    show();
  }

  function shareScore(){
    const text = `SPACE BLAST — Score: ${player.score}`;
    if (navigator.share){ navigator.share({ text, title:'Space Blast Score' }).catch(()=>{}); }
    else if (navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>alert('Score copied!'), ()=>alert(text)); }
    else { alert(text); }
  }

  // ===== State control =====
  function startGame(){
    bullets.length=0; enemies.length=0; orbs.length=0; sparks.length=0;
    player.x=W/2; player.y=H-28; player.vx=0; player.hp=player.hpMax; player.alive=true; player.score=0;
    player.pow={ rapid:0, spread:0, shield:0, mega:0, side:0 };
    frame=0; spawnTimer=20; orbTimer=160; over=false; playing=true; hide(); loop();
  }
  function endGame(){ playing=false; cancelAnimationFrame(rafId); over=true; showGameOver(); }

  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden && playing){ playing=false; cancelAnimationFrame(rafId); }
    else if(!document.hidden && overlay.classList.contains('hidden') && !over){ playing=true; loop(); }
  }, { passive:true });

  // HUD refs
  const healthFill = document.getElementById('healthFill');
  const scoreVal   = document.getElementById('scoreVal');

  // Boot
  showStart();
  drawStars();
  ctx.fillStyle='#fff'; ctx.font='900 18px Helvetica, Arial, sans-serif'; ctx.fillText('Vertical remake ready.', 8, 24);
})();
</script>
</body>
</html>
