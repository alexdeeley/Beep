<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>One-Hand Moto — Auto & Ramps</title>
<style>
  html, body { margin:0; padding:0; background:#000; color:#fff; font-family: -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; overscroll-behavior:none; }
  #wrap { width:100vw; height:100svh; position:fixed; inset:0; display:flex; }
  canvas { flex:1; width:100vw; height:100%; display:block; touch-action:none; }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<div id="wrap">
  <canvas id="game" aria-label="Motorcycle side-scroller"></canvas>
</div>

<script>
(() => {
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d', { alpha:false, desynchronized:true });
  let W=0, H=0, DPR=1;

  function resize() {
    DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = Math.floor(document.getElementById('wrap').clientWidth);
    H = Math.floor(document.getElementById('wrap').clientHeight);
    cvs.width = Math.max(1, W * DPR);
    cvs.height = Math.max(1, H * DPR);
    cvs.style.width = W + 'px';
    cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

  // RNG
  let seed = 1337;
  function rand(){ seed ^= seed<<13; seed ^= seed>>>17; seed ^= seed<<5; return (seed>>>0)/0xffffffff; }
  function srand(s){ seed = s|0; }

  // Terrain
  function terrainY(x) {
    return H*0.68
      + Math.sin(x*0.004)*36
      + Math.sin(x*0.008 + 2)*22
      + Math.sin(x*0.0012 + 3)*100;
  }
  function slopeAt(x) { const e=1; return (terrainY(x+e)-terrainY(x-e))/(2*e); }

  // Game state
  const S = { running:true, last:0, camX:0, pressed:false };
  const bike = { x:60, y:0, vx:0, vy:0, a:0, av:0, on:false };

  // Colors
  const GROUND_FILL = '#B98A5A';
  const GROUND_EDGE = '#E0C09A';
  const RAMP_EDGE   = '#ffffff22';
  const RAMP_FILL   = '#ffe08a22';

  // Ramps (occasional)
  const ramps = [];
  function spawnRamps() {
    ramps.length = 0;
    let x = 800;
    while (x < 400000) {
      const len = 160 + Math.floor(rand()*120); // ramp length
      const h   = 40 + Math.floor(rand()*60);   // ramp height
      ramps.push({ start:x, end:x+len, height:h });
      x += 1200 + Math.floor(rand()*1400);
    }
  }

  // Draw
  function drawBg(cam) {
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
    function ridge(off, amp, base, rough, alpha){
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      for (let x=0; x<=W; x++){
        const wx = x + cam*0.2 + off;
        const y = base + Math.sin(wx*rough)*amp + Math.sin(wx*rough*0.33)*amp*0.5;
        x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath();
      ctx.fillStyle = '#0a0a0a'; ctx.fill();
      ctx.globalAlpha = 1;
    }
    ridge(0,20,H*0.35,0.01,1);
    ridge(900,28,H*0.48,0.013,0.9);
    ridge(1800,36,H*0.58,0.016,0.8);
  }

  function drawTerrain(cam){
    // Base ground
    ctx.beginPath();
    for (let x=0;x<=W;x++){
      const y = terrainY(x+cam);
      x===0 ? ctx.moveTo(0,y) : ctx.lineTo(x,y);
    }
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath();
    ctx.fillStyle = GROUND_FILL; ctx.fill();

    // Ramps overlay
    for (const r of ramps){
      const sx = r.start - cam, ex = r.end - cam;
      if (ex < -50 || sx > W+50) continue;
      // shape: triangle rising over the terrain
      const baseY_s = terrainY(r.start);
      const baseY_e = terrainY(r.end);
      const peakX = (sx+ex)/2, peakWX = (r.start+r.end)/2;
      const peakBaseY = terrainY(peakWX);
      const peakY = peakBaseY - r.height;
      ctx.beginPath();
      ctx.moveTo(sx, baseY_s);
      ctx.lineTo(peakX, peakY);
      ctx.lineTo(ex, baseY_e);
      ctx.lineTo(ex, H); ctx.lineTo(sx, H);
      ctx.closePath();
      ctx.fillStyle = RAMP_FILL; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle=RAMP_EDGE; ctx.stroke();
    }

    // Ground outline
    ctx.beginPath();
    for (let x=0;x<=W;x++){
      const y = Math.round(terrainY(x+cam)/2)*2;
      x===0 ? ctx.moveTo(0,y) : ctx.lineTo(x,y);
    }
    ctx.lineWidth=3; ctx.strokeStyle=GROUND_EDGE; ctx.stroke();
  }

  function drawBike(){
    const sx = bike.x - S.camX;
    const sy = bike.y;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(bike.a);
    ctx.fillStyle='#fff'; ctx.fillRect(-16,-7,32,14);
    function wh(x){ ctx.beginPath(); ctx.arc(x,12,9,0,Math.PI*2); ctx.fillStyle='#ddd'; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.stroke(); }
    wh(-18); wh(18);
    ctx.fillStyle='#eee'; ctx.fillRect(-5,-20,10,14); ctx.fillRect(-2,-28,12,7);
    ctx.restore();
  }

  // Physics tuned for heavier feel
  const GRAV=0.65, MAX=4.2, ACC=0.05, RAMP_BOOST=1.4, RAMP_SPEED_FACTOR=0.26, AIR_DRAG=0.0015;

  function step(dt){
    // Auto accelerate
    bike.vx += ACC;
    if (!S.pressed) bike.vx = Math.min(MAX, bike.vx);
    else bike.vx = Math.min(MAX*1.05, bike.vx); // tiny allowance while touching

    // Gravity
    bike.vy += GRAV;

    // Jump on tap (only if grounded)
    if (S.pressed && bike.on){
      bike.vy = -6.2;
      bike.on = false;
    }

    // Integrate
    bike.x += bike.vx * 2.4;
    bike.y += bike.vy;

    // Air drag
    if (!bike.on) bike.vx = Math.max(0, bike.vx - AIR_DRAG * dt);

    // Ramp detection: if crossing ramp end this frame, apply launch
    let onRamp = null;
    for (const r of ramps){
      if (bike.x >= r.start && bike.x <= r.end){ onRamp = r; break; }
    }
    // store previous in closure
    step.prevOnRamp = step.prevOnRamp || null;
    if (!onRamp && step.prevOnRamp){
      // just left a ramp
      const r = step.prevOnRamp;
      const launch = RAMP_BOOST + bike.vx * RAMP_SPEED_FACTOR;
      bike.vy -= launch;
    }
    step.prevOnRamp = onRamp;

    // Ground collision
    const gy = terrainY(bike.x);
    const sl = slopeAt(bike.x);
    if (bike.y >= gy){
      bike.y = gy; bike.vy = 0; bike.on = true;
      bike.a += (Math.atan2(sl,1) - bike.a) * 0.25;
    } else {
      bike.on=false;
      const diff = -bike.a * 0.5;
      bike.av += diff * 0.008;
      bike.av *= 0.94;
      bike.a += bike.av;
    }

    S.camX = bike.x - W*0.35;
  }

  function draw(){
    drawBg(S.camX);
    drawTerrain(S.camX);
    drawBike();
  }

  let raf=0;
  function loop(t){
    if (!S.running) return;
    if (!S.last) S.last = t;
    const dt = Math.min(32, t - S.last); S.last = t;
    step(dt); draw(); raf = requestAnimationFrame(loop);
  }

  function start(){
    srand((Date.now()&0xffff)^Math.floor(Math.random()*1e9));
    spawnRamps();
    S.running=true; S.last=0; S.camX=0; S.pressed=false;
    bike.x=60; bike.y=terrainY(bike.x); bike.vx=0.01; bike.vy=0; bike.a=0; bike.av=0; bike.on=true;
    resize(); draw(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  }

  // Pointer input: tap anywhere to jump
  cvs.addEventListener('pointerdown', (e)=>{ e.preventDefault(); S.pressed = true; }, {passive:false});
  window.addEventListener('pointerup',   (e)=>{ e.preventDefault(); S.pressed = false; }, {passive:false});
  window.addEventListener('pointercancel', (e)=>{ e.preventDefault(); S.pressed = false; }, {passive:false});

  // Start immediately, no text
  start();
})();</script>
</body>
</html>
