<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Art Studio</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
        }
    </style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


    <div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const ArtGenerator = () => {
    const [seed, setSeed] = useState('');
    const canvasRef = useRef(null);

    const seededRandom = (s) => {
        let seed = 0;
        for (let i = 0; i < s.length; i++) {
            seed = ((seed << 5) - seed) + s.charCodeAt(i);
            seed = seed & seed;
        }
        return () => {
            seed = (seed * 9301 + 49297) % 233280;
            return seed / 233280;
        };
    };

    const generateArt = (inputSeed) => {
        if (!inputSeed) return;
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;
        const rand = seededRandom(inputSeed);

        ctx.clearRect(0, 0, w, h);

        const palettes = [
            ['#1a1a2e', '#16213e', '#0f3460', '#533483', '#e94560'],
            ['#2d4059', '#ea5455', '#f07b3f', '#ffd460', '#decdc3'],
            ['#05668d', '#028090', '#00a896', '#02c39a', '#f0f3bd'],
            ['#351f39', '#726a95', '#a0c1b8', '#f4e8c1', '#ffffff'],
            ['#dd4132', '#9e1030', '#fe5f55', '#f0b67f', '#d6d1b1'],
            ['#264653', '#2a9d8f', '#e9c46a', '#f4a261', '#e76f51']
        ];

        const colors = palettes[Math.floor(rand() * palettes.length)];
        const grad = ctx.createLinearGradient(0,0,w,h);
        grad.addColorStop(0, colors[0]);
        grad.addColorStop(1, colors[1]);
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,w,h);

        for (let i = 0; i < 20; i++) {
            ctx.save();
            ctx.translate(rand()*w, rand()*h);
            ctx.rotate(rand()*Math.PI*2);
            ctx.globalAlpha = 0.3 + rand()*0.5;
            ctx.fillStyle = colors[Math.floor(rand()*colors.length)];
            ctx.beginPath();
            const sides = 3 + Math.floor(rand()*4);
            for (let j=0;j<sides;j++){
                const a = j/sides * Math.PI*2;
                const r = 50 + rand()*150;
                ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    };

    useEffect(() => {
        generateArt(seed);
    }, [seed]);

    const downloadArt = () => {
        const canvas = canvasRef.current;
        canvas.toBlob(blob => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `art-${seed || 'seed'}.png`;
            a.click();
        });
    };

    return (
        <div className="min-h-screen bg-black flex flex-col items-center justify-center p-6">
            <div className="w-full max-w-4xl">
                <input
                    value={seed}
                    onChange={e => setSeed(e.target.value)}
                    placeholder="enter seed"
                    className="w-full mb-4 px-4 py-3 bg-black text-white border border-white"
                />
                <div className="relative">
                    <canvas ref={canvasRef} width={800} height={600} className="w-full border border-white"/>
                    {seed && (
                        <button onClick={downloadArt} className="absolute bottom-4 right-4 text-white">
                            Download
                        </button>
                    )}
                </div>
            </div>
        </div>
    );
};

ReactDOM.render(<ArtGenerator />, document.getElementById('root'));
</script>
</body>
</html>
