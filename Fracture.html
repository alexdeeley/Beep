<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Fracture</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* deeley.org: back to the site menu */
#beep-back{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:50;width:40px;height:40px;border-radius:50%;background:#000;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font:400 26px/1 system-ui,sans-serif;padding-bottom:3px;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#beep-back:hover{border-color:#ff2bd6;color:#ff2bd6}
#lab .bar{padding-left:max(54px,calc(env(safe-area-inset-left) + 54px))}
@media(max-width:430px){#lab .bar{gap:5px;padding-right:6px}#lab .bar .logo{font-size:19px}#lab .bar #gen{padding:3px 5px;font-size:10px}#lab .bar button{padding-left:8px;padding-right:8px}}
:root{
  --bg:#000;--fg:#fff;--dim:#9a9a9a;--line:#2a2a2a;--panel:#0b0b0b;
  --pink:#ff2bd6;--purple:#9b4dff;--green:#b6ff00;--orange:#ff7a00;--cyan:#29e7ff;--red:#ff2b2b;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:'Space Grotesk','Helvetica Neue',Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:16px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:var(--mono);font-weight:800;font-size:15px;letter-spacing:.06em;color:var(--fg);background:#000;border:2px solid #fff;border-radius:0;min-height:48px;padding:0 14px;cursor:pointer;text-transform:uppercase;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .06s,background .12s,color .12s}
button:active{transform:scale(.96)}
button.on{background:var(--c,var(--green));border-color:var(--c,var(--green));color:#000}
button.ghost{border-color:#444;color:#ddd}
button:disabled{opacity:.35}
.hidden{display:none!important}
.screen{min-height:100vh;min-height:100dvh}

/* ---------- logo ---------- */
.logo{font-family:var(--sans);font-weight:700;letter-spacing:-.04em;position:relative;display:inline-block;line-height:.9}
.logo::before,.logo::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden;mix-blend-mode:screen}
.logo::before{color:var(--pink);animation:gl1 2.8s infinite steps(1)}
.logo::after{color:var(--green);animation:gl2 3.3s infinite steps(1)}
@keyframes gl1{0%,92%{transform:none;clip-path:inset(0 0 0 0);opacity:0}93%{opacity:1;transform:translate(-4px,1px);clip-path:inset(10% 0 55% 0)}95%{transform:translate(5px,-1px);clip-path:inset(60% 0 8% 0)}97%{opacity:0}}
@keyframes gl2{0%,88%{opacity:0}89%{opacity:1;transform:translate(4px,0);clip-path:inset(35% 0 35% 0)}91%{transform:translate(-3px,2px);clip-path:inset(0 0 75% 0)}93%{opacity:0}}

/* ---------- recorder ---------- */
#rec{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(24px + var(--sat)) 18px calc(24px + var(--sab));text-align:center}
#rec .logo{font-size:clamp(56px,16vw,120px)}
.tag{font-size:13px;letter-spacing:.32em;color:var(--dim)}
#recwave{width:min(720px,100%);height:140px;display:block;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#meter{width:min(720px,100%);height:10px;background:#141414;position:relative;overflow:hidden}
#meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--green),var(--orange) 70%,var(--red))}
#recbtn{width:200px;height:200px;border-radius:50%;border:0;padding:0;position:relative;background:transparent;min-height:0}
#recbtn svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#recbtn .core{position:absolute;inset:26px;border-radius:50%;background:var(--pink);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#000;box-shadow:0 0 50px rgba(255,43,214,.55);transition:all .2s}
#recbtn .core b{font-size:44px;font-family:var(--sans);letter-spacing:-.02em}
#recbtn .core span{font-size:14px;letter-spacing:.25em}
#recbtn.live .core{background:#000;color:var(--pink);border:4px solid var(--pink);border-radius:18%;inset:40px;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 80px rgba(255,43,214,.9)}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#recmsg{min-height:22px;color:var(--orange);font-size:15px;max-width:560px}
#remain{font-size:15px;letter-spacing:.2em;color:var(--dim)}

/* ---------- lab header ---------- */
#lab{padding-bottom:calc(40px + var(--sab))}
.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:var(--sat)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;max-width:1200px;margin:0 auto}
.bar .logo{font-size:28px;margin-right:auto}
.bar button{min-height:40px;font-size:13px;padding:0 10px}
#gen{font-size:12px;color:var(--green);border:1px solid var(--green);padding:3px 6px;letter-spacing:.1em}
.transport{display:grid;grid-template-columns:64px repeat(5,minmax(0,1fr));gap:8px;padding:0 10px 10px;max-width:1200px;margin:0 auto}
.transport button{min-height:58px;font-size:13px;padding:0 2px;line-height:1.05;letter-spacing:.02em;overflow:hidden;min-width:0}
#playbtn{font-size:30px;border-color:var(--green);color:var(--green)}
#playbtn.on{background:var(--green);color:#000}
#shufbtn{border-color:var(--pink);color:var(--pink);font-size:12px}
#madbtn{border-color:var(--orange);color:var(--orange)}
.transport small{display:block;font-size:9px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75;margin-top:2px}
#busy{position:absolute;right:12px;bottom:-3px;height:3px;width:0;background:var(--green);transition:width .2s}
#busy.on{width:60px;animation:busy 1s infinite linear}
@keyframes busy{0%{transform:translateX(-60px)}100%{transform:translateX(0)}}

/* ---------- viz & timeline ---------- */
.wrap{max-width:1200px;margin:0 auto}
#viz{width:100%;height:130px;display:block}
#tlwrap{position:relative;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#050505}
#tl{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:12px 10px 14px;scroll-behavior:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#444 #000}
#tl::-webkit-scrollbar{height:8px}#tl::-webkit-scrollbar-thumb{background:#444}
.blk{flex:0 0 auto;height:150px;position:relative;background:#0d0d0d;border:2px solid var(--c);display:flex;flex-direction:column;cursor:pointer;user-select:none;-webkit-user-select:none;overflow:hidden}
.blk.pat{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 6px,transparent 6px 12px)}
.blk .grip{height:30px;background:var(--c);color:#000;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-weight:800;font-size:15px;touch-action:none;cursor:grab}
.blk .grip i{font-style:normal;opacity:.6;letter-spacing:-2px}
.blk canvas{flex:1;width:100%;display:block;min-height:0}
.blk .meta{position:absolute;left:4px;right:4px;bottom:3px;display:flex;flex-wrap:wrap;gap:3px;font-size:11px;font-weight:700;pointer-events:none}
.blk .meta span{background:rgba(0,0,0,.8);padding:1px 4px;border:1px solid #333}
.blk .meta .p{color:var(--green);border-color:var(--green)}
.blk .badges{position:absolute;right:4px;top:34px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;pointer-events:none;font-size:11px;font-weight:800}
.blk .badges span{background:#000;padding:0 4px;border:1px solid #fff}
.blk .dur{position:absolute;left:5px;top:34px;font-size:11px;color:#ccc;pointer-events:none;font-weight:700}
.blk .st{position:absolute;left:5px;top:50px;width:8px;height:8px;border-radius:50%;background:var(--green)}
.blk .st.pending{background:var(--orange);animation:blink .5s infinite}
@keyframes blink{50%{opacity:.2}}
.blk .ph{position:absolute;top:30px;bottom:0;width:2px;background:#fff;box-shadow:0 0 10px #fff;left:0;display:none;pointer-events:none}
.blk.on .ph{display:block}
.blk.on{box-shadow:0 0 22px var(--c)}
.blk.sel{outline:3px solid #fff;outline-offset:2px}
.blk.muted{opacity:.4}
.blk.out{opacity:.25;filter:grayscale(1)}
.blk.hit{animation:hit .22s ease-out}
@keyframes hit{0%{transform:scale(1.07);filter:brightness(2.2)}100%{transform:none;filter:none}}
.blk.drag{opacity:.85;outline:3px dashed #fff;z-index:5}
.blk .prob{position:absolute;left:0;bottom:0;height:3px;background:var(--orange);pointer-events:none}

/* ---------- tabs & panels ---------- */
#tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;z-index:15;background:#000;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{border:0;border-bottom:3px solid transparent;min-height:50px;flex:1 0 auto;font-size:14px;color:#888;padding:0 14px}
#tabs button.on{background:#000;color:#fff;border-bottom-color:var(--tc,var(--pink))}
#panel{padding:14px 12px 30px}
.sec{margin:0 0 22px}
.sec h3{font-family:var(--sans);font-size:15px;letter-spacing:.24em;color:var(--dim);margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.grid button{min-height:54px;font-size:14px;line-height:1.1;padding:6px}
.big{min-height:76px!important;font-size:20px!important;width:100%}
.sl{display:grid;grid-template-columns:120px 1fr 72px;align-items:center;gap:10px;min-height:46px}
.sl label{font-size:13px;letter-spacing:.08em;color:#ccc;font-weight:700}
.sl output{font-size:14px;text-align:right;color:var(--c,var(--green));font-weight:800}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:linear-gradient(90deg,var(--c,var(--green)) var(--v,50%),#2c2c2c var(--v,50%))}
input[type=range]::-moz-range-track{height:6px;background:#2c2c2c}
input[type=range]::-moz-range-progress{height:6px;background:var(--c,var(--green))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;background:#fff;border:3px solid var(--c,var(--green));margin-top:-10px;border-radius:0}
input[type=range]::-moz-range-thumb{width:22px;height:22px;background:#fff;border:3px solid var(--c,var(--green));border-radius:0}
.sl.huge{grid-template-columns:1fr;gap:2px;min-height:auto}
.sl.huge label{font-family:var(--sans);font-size:22px;letter-spacing:.12em;color:#fff;display:flex;justify-content:space-between}
.sl.huge input{height:56px}
.sl.huge input::-webkit-slider-runnable-track{height:14px}
.sl.huge input::-webkit-slider-thumb{width:40px;height:40px;margin-top:-13px}
.hint{color:var(--dim);font-size:15px;line-height:1.5;padding:18px 4px}
.fxcard{border:2px solid var(--c);margin:0 0 10px;padding:0 10px 6px;background:#070707}
.fxcard.offc{opacity:.45}
.fxhead{display:flex;align-items:center;gap:6px;margin:0 -10px 6px;padding:0 0 0 10px;background:var(--c);color:#000}
.fxhead b{flex:1;font-size:15px;letter-spacing:.08em}
.fxhead button{min-height:42px;min-width:44px;padding:0 8px;border:0;border-left:2px solid #000;background:transparent;color:#000;font-size:15px}
.fxhead button.on{background:#000;color:var(--c)}
.ehead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ehead .n{font-family:var(--sans);font-size:54px;font-weight:700;line-height:.9;color:var(--c)}
.ehead .info{flex:1;font-size:13px;color:#ccc;line-height:1.5}
.ehead canvas{width:110px;height:44px}
.picker{border:2px dashed #555;padding:10px;margin:8px 0 14px}
.picker h4{margin:10px 0 6px;font-size:13px;letter-spacing:.2em}
.picker .grid button{min-height:48px;font-size:13px}
#mutlog{font-size:14px;line-height:1.7;color:#ccc;max-height:260px;overflow:auto;border-left:3px solid var(--pink);padding-left:10px}
#mutlog div:first-child{color:#fff}
.mode{min-height:86px!important;font-family:var(--sans)!important;font-size:19px!important;border-color:var(--c)!important;color:var(--c)}
.mode.on{background:var(--c)!important;color:#000!important}
.fav{display:flex;gap:6px;margin-bottom:6px}.fav button:first-child{flex:1;text-align:left}
input[type=text]{background:#000;color:#fff;border:2px solid #fff;font-family:var(--mono);font-size:16px;padding:0 12px;min-height:48px;width:100%;border-radius:0}
.plist{display:flex;flex-direction:column;gap:6px}
.plist .it{display:flex;gap:6px}.plist .it button:first-child{flex:1;text-align:left;text-transform:none}
.small{font-size:13px;color:var(--dim);line-height:1.5}
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);font-family:var(--sans);font-weight:700;font-size:clamp(30px,8vw,64px);letter-spacing:-.02em;color:#fff;text-shadow:3px 0 var(--pink),-3px 0 var(--green);pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;z-index:60;text-align:center;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + var(--sat)) 14px 20px;overflow:auto}
#modal .box{width:min(560px,100%);border:2px solid #fff;padding:16px;background:#000}
@media (min-width:900px){
  #panel{display:block;max-width:1200px;margin:0 auto}
  .transport{grid-template-columns:90px repeat(5,minmax(0,1fr))}
  .sl{grid-template-columns:150px 1fr 80px}
  #viz{height:170px}
}
@media (max-width:380px){.sl{grid-template-columns:96px 1fr 60px}.transport button{font-size:12px}}
@media (prefers-reduced-motion:reduce){.logo::before,.logo::after{animation:none}.blk.hit{animation:none}}
</style>
</head>

      <button id="madbtn">⚡ MAD<small>ONE BUTTON</small></button>
    </div>
    <div id="busy"></div>
  </div>
  <div class="wrap"><canvas id="viz"></canvas></div>
  <div id="tlwrap"><div id="tl"></div></div>
  <nav id="tabs" class="wrap"></nav>
  <div id="panel" class="wrap"></div>
</section>

<div id="toast"></div>
<div id="modal" class="hidden"><div class="box" id="modalbox"></div></div>

<script>
'use strict';
/* ============================================================
   FRACTURE — DSP CORE
   Pure-JS sample processing, FFT, analysis, chopping, effects
   ============================================================ */

// ---------- RNG ----------
function mulberry32(a) {
  a = a >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const newSeed = () => (Math.random() * 4294967295) >>> 0;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const ri = (rng, a, b) => Math.floor(a + rng() * (b - a + 1));
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];

// ---------- buffer helpers ----------
function hann(n) {
  const w = new Float32Array(n);
  for (let i = 0; i < n; i++) w[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (n - 1));
  return w;
}
const HANN = {};
function getHann(n) { return HANN[n] || (HANN[n] = hann(n)); }

function fadeEdges(x, sr, ms = 3, msOut) {
  const n = Math.min(Math.floor((sr * ms) / 1000), x.length >> 1);
  const m = Math.min(Math.floor((sr * (msOut == null ? ms : msOut)) / 1000), x.length >> 1);
  for (let i = 0; i < n; i++) x[i] *= i / n;
  for (let i = 0; i < m; i++) x[x.length - 1 - i] *= i / m;
  return x;
}
function concat(list) {
  let L = 0;
  for (const a of list) L += a.length;
  const out = new Float32Array(L);
  let o = 0;
  for (const a of list) { out.set(a, o); o += a.length; }
  return out;
}
function resample(x, rate) {
  // rate > 1 → shorter/higher
  const L = Math.max(1, Math.floor(x.length / rate));
  const out = new Float32Array(L);
  const n = x.length - 1;
  for (let i = 0; i < L; i++) {
    const p = i * rate, k = p | 0, f = p - k;
    const a = x[k] || 0, b = k + 1 <= n ? x[k + 1] : 0;
    out[i] = a + (b - a) * f;
  }
  return out;
}
function reverseArr(x) { const y = new Float32Array(x.length); for (let i = 0, n = x.length; i < n; i++) y[i] = x[n - 1 - i]; return y; }
function peakOf(x) { let p = 0; for (let i = 0; i < x.length; i++) { const a = Math.abs(x[i]); if (a > p) p = a; } return p; }
function rmsOf(x, a = 0, b = x.length) { let s = 0; for (let i = a; i < b; i++) s += x[i] * x[i]; return Math.sqrt(s / Math.max(1, b - a)); }
function capLen(x, sr, sec = 12) { const m = Math.floor(sr * sec); return x.length > m ? fadeEdges(x.slice(0, m), sr, 0, 20) : x; }

// ---------- FFT (radix-2, in place) ----------
function fft(re, im, inv) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (2 * Math.PI / len) * (inv ? 1 : -1);
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      const h = len >> 1;
      for (let j = 0; j < h; j++) {
        const ar = re[i + j + h], ai = im[i + j + h];
        const vr = ar * cr - ai * ci, vi = ar * ci + ai * cr;
        re[i + j + h] = re[i + j] - vr; im[i + j + h] = im[i + j] - vi;
        re[i + j] += vr; im[i + j] += vi;
        const ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr;
      }
    }
  }
  if (inv) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
}

// ---------- WSOLA time stretch + pitch ----------
function wsola(x, factor, sr) {
  if (Math.abs(factor - 1) < 0.001) return x.slice();
  const N = sr > 60000 ? 2048 : 1024;
  const Hs = N >> 2;
  const Ha = Hs / factor;
  const tol = Hs >> 1;
  const outLen = Math.max(N, Math.floor(x.length * factor));
  const out = new Float32Array(outLen + N);
  const ws = new Float32Array(outLen + N);
  const w = getHann(N);
  const L = x.length;
  let prev = 0;
  const cmp = N >> 2;
  for (let k = 0; ; k++) {
    const op = k * Hs;
    if (op >= outLen) break;
    let ip = Math.round(k * Ha);
    if (k > 0) {
      const nat = prev + Hs;
      let best = 0, bestC = -Infinity;
      for (let d = -tol; d <= tol; d += 4) {
        const c0 = ip + d;
        if (c0 < 0 || c0 + cmp >= L) continue;
        let c = 0;
        for (let i = 0; i < cmp; i += 2) c += x[c0 + i] * (x[nat + i] || 0);
        if (c > bestC) { bestC = c; best = d; }
      }
      ip = clamp(ip + best, 0, Math.max(0, L - 1));
    }
    prev = ip;
    for (let i = 0; i < N; i++) {
      const s = ip + i < L ? x[ip + i] : 0;
      out[op + i] += s * w[i];
      ws[op + i] += w[i];
    }
  }
  const y = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) y[i] = out[i] / Math.max(ws[i], 0.25);
  return y;
}
function pitchStretch(x, semis, stretch, sr) {
  const r = Math.pow(2, semis / 12);
  if (Math.abs(semis) < 0.01) return wsola(x, stretch, sr);
  const y = wsola(x, stretch * r, sr);
  return resample(y, r);
}

// ---------- ANALYSIS ----------
function analyze(x, sr) {
  const hop = 512, N = 1024;
  const frames = Math.max(1, Math.floor((x.length - N) / hop));
  const flux = new Float32Array(frames);
  const env = new Float32Array(frames);
  const re = new Float64Array(N), im = new Float64Array(N);
  let prev = new Float32Array(N / 2);
  const w = getHann(N);
  for (let f = 0; f < frames; f++) {
    const o = f * hop;
    let e = 0;
    for (let i = 0; i < N; i++) { const s = x[o + i] || 0; re[i] = s * w[i]; im[i] = 0; e += s * s; }
    env[f] = Math.sqrt(e / N);
    fft(re, im, false);
    let fl = 0;
    const cur = new Float32Array(N / 2);
    for (let i = 1; i < N / 2; i++) {
      const m = Math.log1p(10 * Math.hypot(re[i], im[i]));
      cur[i] = m;
      const d = m - prev[i];
      if (d > 0) fl += d;
    }
    flux[f] = fl;
    prev = cur;
  }
  // onset peak picking
  const onsets = [];
  const W = 8;
  let mx = 0;
  for (let i = 0; i < frames; i++) mx = Math.max(mx, flux[i]);
  const minGap = Math.floor((0.045 * sr) / hop);
  let last = -999;
  for (let i = 1; i < frames - 1; i++) {
    let s = 0, c = 0;
    for (let j = Math.max(0, i - W); j < Math.min(frames, i + W); j++) { s += flux[j]; c++; }
    const thr = (s / c) * 1.35 + mx * 0.04;
    if (flux[i] > thr && flux[i] >= flux[i - 1] && flux[i] >= flux[i + 1] && i - last >= minGap) {
      onsets.push({ t: i * hop, s: flux[i] / (mx || 1) });
      last = i;
    }
  }
  // phrases: silence gaps in smoothed envelope
  const sm = new Float32Array(frames);
  const k = 6;
  for (let i = 0; i < frames; i++) { let s = 0, c = 0; for (let j = Math.max(0, i - k); j <= Math.min(frames - 1, i + k); j++) { s += env[j]; c++; } sm[i] = s / c; }
  const sorted = Array.from(sm).sort((a, b) => a - b);
  const peakE = sorted[sorted.length - 1] || 1e-6;
  const floor = sorted[Math.floor(sorted.length * 0.15)] || 0;
  const thr = Math.max(floor * 1.6, peakE * 0.08);
  const phrases = [];
  let run = -1;
  const minRun = Math.floor((0.09 * sr) / hop);
  for (let i = 0; i <= frames; i++) {
    const q = i < frames && sm[i] < thr;
    if (q && run < 0) run = i;
    if (!q && run >= 0) {
      if (i - run >= minRun && run > 0 && i < frames) phrases.push({ t: Math.floor(((run + i) / 2) * hop), s: (i - run) / frames });
      run = -1;
    }
  }
  // energy dips (fallback for phrase)
  const dips = [];
  for (let i = 4; i < frames - 4; i++) {
    if (sm[i] < sm[i - 3] && sm[i] < sm[i + 3] && sm[i] <= sm[i - 1] && sm[i] <= sm[i + 1]) dips.push({ t: i * hop, s: 1 - sm[i] / peakE });
  }
  dips.sort((a, b) => b.s - a.s);
  return { onsets, phrases, dips, env, hop, flux };
}

function trimSilence(x, sr) {
  const thr = Math.max(0.003, peakOf(x) * 0.02);
  let a = 0, b = x.length - 1;
  while (a < b && Math.abs(x[a]) < thr) a++;
  while (b > a && Math.abs(x[b]) < thr) b--;
  const pad = Math.floor(sr * 0.02);
  a = Math.max(0, a - pad); b = Math.min(x.length, b + pad);
  if (b - a < sr * 0.05) return x;
  return fadeEdges(x.slice(a, b), sr, 2, 10);
}

function snapZero(x, i, sr) {
  const r = Math.floor(sr * 0.004);
  let best = i, bd = Infinity;
  for (let d = -r; d <= r; d++) {
    const j = i + d;
    if (j <= 0 || j >= x.length) continue;
    if ((x[j - 1] <= 0 && x[j] > 0) || (x[j - 1] >= 0 && x[j] < 0)) { if (Math.abs(d) < bd) { bd = Math.abs(d); best = j; } }
  }
  return best;
}

// ---------- CHOPPING ----------
// returns array of [start, end] sample ranges
function chop(alg, x, sr, A, N, rng) {
  const L = x.length;
  const minLen = Math.floor(sr * 0.012);
  const fromCuts = (cuts) => {
    cuts = cuts.map((c) => snapZero(x, clamp(Math.round(c), 1, L - 1), sr)).sort((a, b) => a - b);
    const out = [];
    let p = 0;
    for (const c of cuts) { if (c - p >= minLen) { out.push([p, c]); p = c; } }
    if (L - p >= minLen) out.push([p, L]); else if (out.length) out[out.length - 1][1] = L;
    return out.length ? out : [[0, L]];
  };
  const grid = (n) => { const c = []; for (let i = 1; i < n; i++) c.push((i * L) / n); return c; };
  const randomCuts = (n) => {
    const w = []; let s = 0;
    for (let i = 0; i < n; i++) { const v = Math.exp(rng() * 3.2); w.push(v); s += v; }
    const c = []; let acc = 0;
    for (let i = 0; i < n - 1; i++) { acc += w[i]; c.push((acc / s) * L); }
    return c;
  };
  const micro = (n) => {
    // weighted toward energetic regions
    const env = A.env, hop = A.hop;
    let tot = 0; const cdf = [];
    for (let i = 0; i < env.length; i++) { tot += env[i] * env[i] + 1e-6; cdf.push(tot); }
    const out = [];
    for (let i = 0; i < n; i++) {
      const len = Math.floor(sr * Math.exp(lerp(Math.log(0.01), Math.log(0.25), rng())));
      const r = rng() * tot; let lo = 0, hi = cdf.length - 1;
      while (lo < hi) { const m = (lo + hi) >> 1; if (cdf[m] < r) lo = m + 1; else hi = m; }
      let s = clamp(lo * hop + Math.floor((rng() - 0.5) * hop * 2), 0, Math.max(0, L - len));
      s = snapZero(x, s, sr);
      out.push([s, Math.min(L, s + len)]);
    }
    return out.sort((a, b) => a[0] - b[0]);
  };
  const transientCuts = (n) => {
    const on = A.onsets.slice().sort((a, b) => b.s - a.s);
    const chosen = [];
    const gap = Math.floor(sr * 0.03);
    for (const o of on) {
      if (chosen.length >= n - 1) break;
      if (o.t < gap || o.t > L - gap) continue;
      if (chosen.every((c) => Math.abs(c - o.t) > gap)) chosen.push(o.t - Math.floor(sr * 0.004));
    }
    if (chosen.length < n - 1) {
      // fill largest gaps with midpoints
      while (chosen.length < n - 1) {
        const all = [0, ...chosen.slice().sort((a, b) => a - b), L];
        let bi = 0, bg = 0;
        for (let i = 0; i < all.length - 1; i++) if (all[i + 1] - all[i] > bg) { bg = all[i + 1] - all[i]; bi = i; }
        if (bg < minLen * 2) break;
        chosen.push((all[bi] + all[bi + 1]) / 2);
      }
    }
    return chosen;
  };
  const phraseCuts = (n) => {
    let src = A.phrases.slice().sort((a, b) => b.s - a.s);
    let want = Math.min(n - 1, Math.max(1, src.length));
    if (!src.length) { src = A.dips.slice(); want = Math.min(n - 1, 7); }
    const gap = Math.floor(sr * 0.25);
    const chosen = [];
    for (const p of src) {
      if (chosen.length >= want) break;
      if (p.t < gap || p.t > L - gap) continue;
      if (chosen.every((c) => Math.abs(c - p.t) > gap)) chosen.push(p.t);
    }
    if (!chosen.length) return grid(Math.min(n, 4));
    return chosen;
  };
  switch (alg) {
    case 'grid': return fromCuts(grid(N));
    case 'random': return fromCuts(randomCuts(N));
    case 'micro': return micro(N);
    case 'transient': return fromCuts(transientCuts(N));
    case 'phrase': return fromCuts(phraseCuts(N));
    case 'chaos': default: {
      const cand = [...transientCuts(N), ...grid(N), ...randomCuts(N), ...A.phrases.map((p) => p.t)];
      for (let i = cand.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [cand[i], cand[j]] = [cand[j], cand[i]]; }
      let segs = fromCuts(cand.slice(0, N - 1));
      // carve some into micro-slices
      segs = segs.map(([a, b]) => {
        if (rng() < 0.3 && b - a > sr * 0.08) {
          const len = Math.floor(sr * lerp(0.01, 0.12, rng()));
          const s = a + Math.floor(rng() * (b - a - len));
          return [s, s + len];
        }
        return [a, b];
      });
      if (rng() < 0.5) segs.push(...micro(Math.max(1, Math.floor(N / 6))));
      return segs.sort((p, q) => p[0] - q[0]).slice(0, Math.max(N, 2));
    }
  }
}

// ---------- FRAGMENT FEATURES ----------
function features(x, s, e, A, sr) {
  const seg = x.subarray(s, e);
  let z = 0;
  for (let i = 1; i < seg.length; i++) if ((seg[i - 1] < 0) !== (seg[i] < 0)) z++;
  let ons = 0;
  for (const o of A.onsets) if (o.t >= s - sr * 0.01 && o.t < s + sr * 0.04) ons = Math.max(ons, o.s);
  let ph = 0;
  for (const p of A.phrases) if (Math.abs(p.t - s) < sr * 0.15) ph = 1;
  return { rms: rmsOf(seg), peak: peakOf(seg), zcr: z / Math.max(1, seg.length), onset: ons, phrase: ph };
}

function randParam(spec, rng, wild) {
  const [mn, mx, df, , lg] = spec;
  let v;
  if (wild >= 1) v = lg ? Math.exp(lerp(Math.log(mn), Math.log(mx), rng())) : lerp(mn, mx, rng());
  else if (lg) { const l = Math.log(df) + (rng() * 2 - 1) * wild * (Math.log(mx) - Math.log(mn)) * 0.6; v = Math.exp(l); }
  else v = df + (rng() * 2 - 1) * wild * (mx - mn) * 0.6;
  v = clamp(v, mn, mx);
  return mx - mn > 4 && !lg ? Math.round(v) : v;
}

const JSFX = {

  stutter(x, sr, p, rng) {

      btn('▲', () => { if (k > 0) { editUndo(); [f.fx[k - 1], f.fx[k]] = [f.fx[k], f.fx[k - 1]]; requestRender(f); renderPanel(); } }),
      btn('▼', () => { if (k < f.fx.length - 1) { editUndo(); [f.fx[k + 1], f.fx[k]] = [f.fx[k], f.fx[k + 1]]; requestRender(f); renderPanel(); } }),
      btn('🎲', () => { editUndo(); const r = mulberry32(newSeed()); for (const pk in def.p) e.p[pk] = randParam(def.p[pk], r, 1); f.seed = newSeed(); requestRender(f); renderPanel(); }),
      btn('✕', () => { editUndo(); f.fx.splice(k, 1); requestRender(f); renderPanel(); }));
    card.append(head);
    for (const pk in def.p) {
      const spec = def.p[pk];
      card.append(slider({ label: spec[3], min: spec[0], max: spec[1], step: spec[1] - spec[0] > 4 && !spec[4] ? 1 : 0.001, log: !!spec[4], val: e.p[pk], color: c, fmt: (v) => fmtParam(spec, v),
        onInput: (v) => { editUndo(); e.p[pk] = v; dRender(f); UI.lastPanel = Date.now(); } }));
    }
    fxs.append(card);
  });
  p.append(fxs);
}
function canvasDNA(seed, col) {
  const c = el('canvas'); c.width = 220; c.height = 88;
  const g = c.getContext('2d'); const r = mulberry32(seed);
  const cols = [col, '#fff', '#9b4dff', '#b6ff00', '#ff7a00'];
  let x = 0;
  while (x < 220) { const w = 2 + Math.floor(r() * 9); if (r() < 0.75) { g.fillStyle = cols[Math.floor(r() * cols.length)]; const h = 30 + r() * 58; g.fillRect(x, (88 - h) / 2, w - 1, h); } x += w; }
  return c;
}

/* ----- CHOP ----- */
const CHOPS = [['random', 'RANDOM', 'unpredictable lengths'], ['transient', 'TRANSIENT', 'cut at attacks & syllables'], ['grid', 'GRID', 'even divisions'], ['micro', 'MICRO', '10–250ms shards'], ['phrase', 'PHRASE', 'longer gestures'], ['chaos', 'CHAOS', 'all at once']];

  p.append(sec('GRID DIVISIONS', gd));
  p.append(el('div', { class: 'grid g2' },
    btn('↻ RE-CHOP', () => { pushUndo(); rechop(UI.carry !== false); toast('RE-CHOPPED'); }, '', 'border-color:var(--orange);color:var(--orange)'),
    tg(UI.carry !== false ? 'KEEP FX ON RE-CHOP' : 'CLEAN RE-CHOP', UI.carry !== false, () => { UI.carry = UI.carry === false; renderPanel(); }, 'var(--orange)')));
  p.append(el('div', { class: 'small', style: 'margin-top:12px' }, `${S.seq.length} FRAGMENTS · ${S.A ? S.A.onsets.length : 0} TRANSIENTS · ${S.A ? S.A.phrases.length : 0} PHRASE BREAKS DETECTED · SOURCE ${(S.src.length / S.sr).toFixed(2)}s`));
}

/* ----- ARRANGE ----- */

function doShuffle() {
  const opts = ['shuffle', 'rhythmic', 'ai', 'random', 'repeated', 'altfb', 'mirror', 'shuffle', 'everyother'];

/* ----- COMPOSE ----- */

}

      btn('RESET ODDS', () => { pushUndo(); for (const f of S.seq) { f.pp = 1; f.rp = 0; f.vp = 0; } refreshBlocks(); renderPanel(); }, 'ghost')),
    gslider('skipP', 'SKIP', 0, 1, 0.01, pct, { color: 'var(--orange)' }),
    gslider('repP', 'REPEAT', 0, 1, 0.01, pct, { color: 'var(--orange)' }),

}

/* ----- MUTATE ----- */
function pMut(p) {

  p.append(el('div', { class: 'small', style: 'margin:-8px 0 16px' }, 'FREEZE locks the composition: mutation pauses and chaos, drift and probabilities are bypassed until you thaw it.'));
  p.append(sec('MUTATION LOG', el('div', { id: 'mutlog', html: UI.mlog.map((x) => `<div>${x}</div>`).join('') || '<div style="color:#666">WAITING…</div>' })));
}

/* ----- MASTER ----- */
function pMaster(p) {
  p.append(sec('MASTER CHAOS', gslider('chaos', 'CHAOS', 0, 1, 0.01, pct, { huge: true, color: 'var(--red)' })));
  p.append(sec('MASTER',
    gslider('vol', 'VOLUME', 0, 1.2, 0.01, pct, { color: '#fff' }),
    gslider('dist', 'DISTORTION', 0, 1, 0.01, pct, { color: 'var(--orange)' }),

  ));

/* ----- EXPORT ----- */
function pOut(p) {
  p.append(sec('RENDER',
    slider({ label: 'LOOP PASSES', min: 1, max: 8, step: 1, val: UI.passes, color: 'var(--green)', fmt: (v) => '×' + v, onInput: (v) => (UI.passes = v) }),
    el('div', { class: 'grid g2', style: 'margin-top:8px' },
      tg(UI.clean ? 'CLEAN (NO CHAOS)' : 'WITH CHAOS & ODDS', !UI.clean, () => { UI.clean = !UI.clean; renderPanel(); }, 'var(--green)'),
      btn('⬇ RENDER WAV', () => doRender(), '', 'border-color:var(--green);color:#000;background:var(--green)'))));
  p.append(sec('AUDIO', el('div', { class: 'grid g2' },
    btn('⬇ ORIGINAL RECORDING', () => download(encodeWAV([S.orig], S.sr), `fracture-original-${stamp()}.wav`)),
    btn('⬇ CURRENT SOURCE (GEN ' + S.gen + ')', () => download(encodeWAV([S.src], S.sr), `fracture-gen${S.gen}-${stamp()}.wav`)),
    btn('⬇ SELECTED FRAGMENT', () => exportSelected()),
    btn('⬇ ALL FRAGMENTS (.ZIP)', () => exportFragments()),
  ), el('div', { class: 'small', style: 'margin-top:8px' }, 'Exports are 16-bit WAV — browsers have no built-in MP3 encoder. Fragment files include each fragment\'s own effects and tails.')));

}
const stamp = () => new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '');
async function doRender() {
  toast('RENDERING…');
  try {
    const b = await renderComposition({ passes: UI.passes, clean: UI.clean });
    download(bufToWav(b), `fracture-${stamp()}.wav`);
    toast(`WAV ${b.duration.toFixed(1)}s`);
  } catch (e) { console.error(e); toast('RENDER FAILED'); }
}
async function waitRenders() { let w = 0; while ((RQ.running || RQ.q.length) && w++ < 600) await new Promise((r) => setTimeout(r, 50)); }
async function exportSelected() {
  const f = findFrag(S.sel);
  if (!f) { toast('SELECT A FRAGMENT'); return; }
  await waitRenders();
  download(bufToWav(f.buf || rawBuf(f)), `fracture-frag${S.seq.indexOf(f) + 1}-${stamp()}.wav`);
}
async function exportFragments() {
  toast('PACKING…');
  await waitRenders();
  const files = [], seen = new Set();
  S.seq.forEach((f, i) => { if (seen.has(f.hash)) return; seen.add(f.hash); files.push({ name: `fragment-${String(i + 1).padStart(3, '0')}.wav`, data: bufToWav(f.buf || rawBuf(f)) }); });
  files.push({ name: 'original.wav', data: encodeWAV([S.orig], S.sr) });
  download(zipStore(files), `fracture-fragments-${stamp()}.zip`, 'application/zip');
  toast(files.length - 1 + ' FRAGMENTS');
}
function projectsUI(box, modal) {
  box.innerHTML = '';
  if (S.src && !modal) {
    const nm = el('input', { type: 'text', placeholder: 'PROJECT NAME', value: S.projectName || '' });
    box.append(nm, el('div', { class: 'grid g2', style: 'margin:8px 0 14px' },
      btn('SAVE PROJECT', async () => { try { await saveProject(nm.value.trim() || 'FRACTURE ' + new Date().toLocaleString()); toast('SAVED'); projectsUI(box, modal); } catch (e) { toast('SAVE FAILED'); console.error(e); } }, '', 'border-color:var(--green);color:var(--green)'),
      btn('SAVE AS NEW', async () => { S.projectId = null; try { await saveProject(nm.value.trim() || 'FRACTURE ' + new Date().toLocaleString()); toast('SAVED'); projectsUI(box, modal); } catch (e) { toast('SAVE FAILED'); } }),
      btn('⬇ EXPORT PROJECT FILE', () => exportProjectFile(nm.value.trim() || 'fracture')),
      btn('⬆ IMPORT PROJECT FILE', () => $('#projin').click())));
  } else box.append(el('div', { class: 'grid g2', style: 'margin-bottom:12px' }, btn('⬆ IMPORT PROJECT FILE', () => $('#projin').click())));
  const list = el('div', { class: 'plist' }, el('div', { class: 'small' }, 'LOADING…'));
  box.append(list);
  DB.all().then((all) => {
    list.innerHTML = '';
    all.sort((a, b) => b.date - a.date);
    if (!all.length) list.append(el('div', { class: 'small' }, 'NO SAVED PROJECTS ON THIS DEVICE.'));
    for (const d of all) list.append(el('div', { class: 'it' },
      btn(`${d.name} · ${(d.src.length / d.sr).toFixed(1)}s · ${d.seq.length} frags · ${new Date(d.date).toLocaleDateString()}`, () => { loadProjectData(d); closeModal(); enterLab(false); buildTimeline(); toast('LOADED'); }),
      btn('✕', async () => { await DB.del(d.id); projectsUI(box, modal); }, '', 'border-color:var(--red);color:var(--red)')));
  }).catch(() => { list.innerHTML = ''; list.append(el('div', { class: 'small' }, 'PROJECT STORAGE UNAVAILABLE IN THIS CONTEXT — USE EXPORT PROJECT FILE.')); });
}
function openModal() { const b = $('#modalbox'); b.innerHTML = ''; b.append(el('h3', { style: 'font-family:var(--sans);letter-spacing:.2em;margin:0 0 14px' }, 'PROJECTS')); const c = el('div'); b.append(c); projectsUI(c, true); b.append(el('div', { style: 'margin-top:14px' }, btn('CLOSE', closeModal, 'ghost'))); $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); }

/* ============================================================
   WIRING
   ============================================================ */
function init() {
  $('#recbtn').onclick = () => (UI.recState === 'live' ? finishRecording() : UI.recState === 'idle' ? startRecording() : null);
  $('#stopbtn').onclick = () => finishRecording();
  $('#rerec').onclick = () => startRecording();
  $('#origplay').onclick = () => toggleOrig();
  $('#enterlab').onclick = () => enterLab(false);
  $('#loadfile').onclick = () => $('#filein').click();
  $('#recproj').onclick = () => openModal();
  $('#modal').onclick = (e) => { if (e.target.id === 'modal') closeModal(); };
  $('#demo').onclick = () => { try { ensureCtx(); afterSource(prepareSource(demoSound())); } catch (e) { $('#recmsg').textContent = e.message; } };
  $('#filein').onchange = async (e) => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    $('#recmsg').textContent = 'DECODING…';
    try { ensureCtx(); const b = await decode(await file.arrayBuffer()); $('#recmsg').textContent = b.duration > MAXREC ? `Trimmed to the first ${MAXREC} seconds.` : ''; afterSource(prepareSource(toMono(b))); }
    catch (err) { $('#recmsg').textContent = 'Could not decode that file in this browser.'; }
  };
  $('#projin').onchange = async (e) => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    try { importProjectText(await file.text()); closeModal(); enterLab(false); toast('IMPORTED'); } catch (err) { toast('IMPORT FAILED'); console.error(err); }
  };
  $('#torec').onclick = () => showRec();
  $('#playbtn').onclick = () => (S.playing ? stop() : play());
  $('#shufbtn').onclick = () => doShuffle();
  $('#loopbtn').onclick = () => { G.loop = !G.loop; toast(G.loop ? 'LOOP FOREVER' : 'PLAY ONCE'); HOOK.globals(); if (UI.tab === 'loop') renderPanel(); };
  $('#undobtn').onclick = () => { undo(); if (['frag', 'arr', 'chop', 'loop'].includes(UI.tab)) renderPanel(); };
  $('#favbtn').onclick = () => saveFav();
  $('#madbtn').onclick = () => { madness(); if (!S.playing) play(); if (UI.tab !== 'frag') renderPanel(); };
  $('#renderbtn').onclick = () => doRender();
  const tl = $('#tl');
  ['pointerdown', 'wheel', 'touchstart', 'scroll'].forEach((ev) => tl.addEventListener(ev, (e) => { if (ev !== 'scroll' || !S.playing || e.isTrusted) UI.lastTl = Date.now(); }, { passive: true }));
  tl.addEventListener('scroll', () => {}, { passive: true });
  $('#panel').addEventListener('pointerdown', () => (UI.lastPanel = Date.now()));
  window.addEventListener('resize', () => { if (!$('#lab').classList.contains('hidden')) { sizeCanvas($('#viz')); VZ.peakKey = ''; $('#tabs').style.top = $('.top').offsetHeight + 'px'; } });
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
    if ($('#lab').classList.contains('hidden')) { if (e.code === 'Space') { e.preventDefault(); $('#recbtn').click(); } return; }
    if (e.code === 'Space') { e.preventDefault(); S.playing ? stop() : play(); }
    else if (e.key === 's') doShuffle();
    else if (e.key === 'z' || ((e.metaKey || e.ctrlKey) && e.key === 'z')) { e.preventDefault(); undo(); renderPanel(); }
    else if (e.key === 'm') { madness(); if (!S.playing) play(); }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.ctx && S.ctx.state === 'suspended') S.ctx.resume(); });
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) $('#recmsg').textContent = 'Microphone capture needs a secure page (https or localhost). You can still load a file or use the demo sound.';
  sizeCanvas($('#recwave'));
  requestAnimationFrame(frame);
}
init();
