<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Checkerburst – Safe iPhone Build</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; touch-action:none; }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>
<script>
(function(){
  // ----- Canvas (keep DPR=1 for iPhone stability) -----
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d'); // default options for compatibility
  let W=0, H=0;

  // ----- Soft-body blob -----
  const nodes = [];
  const CENTER = { x:()=>W*0.5, y:()=>H*0.5 };
  let BASE_R = 0;
  const POINTS = 48;
  const neighborK = 0.13, toCenterK = 0.065, damping = 0.90, pressure = 0.0018, jitter = 0.06;
  let TILE = 14;
  let grid = []; // cells inside circle {hx,hy,color}

  function resize(){
    W = Math.max(1, Math.floor(innerWidth));
    H = Math.max(1, Math.floor(innerHeight));
    canvas.width = W; canvas.height = H;
    BASE_R = Math.min(W, H) * 0.22;
    buildBlob();
    buildGrid();
  }
  addEventListener('resize', resize, {passive:true});
  resize();

  function buildBlob(){
    nodes.length = 0;
    for(let i=0;i<POINTS;i++){
      const a = (i/POINTS)*Math.PI*2;
      nodes.push({
        x: CENTER.x()+Math.cos(a)*BASE_R,
        y: CENTER.y()+Math.sin(a)*BASE_R,
        vx:0, vy:0, restAngle:a, restRadius:BASE_R
      });
    }
  }

  // ----- Input (touch + mouse) -----
  const pointer = {active:false, x:0, y:0, vx:0, vy:0, lx:0, ly:0, grabbed:-1};
  function setPointer(e){
    const r = canvas.getBoundingClientRect();
    let cx, cy;
    if(e.touches && e.touches[0]){ cx=e.touches[0].clientX - r.left; cy=e.touches[0].clientY - r.top; }
    else { cx=e.clientX - r.left; cy=e.clientY - r.top; }
    pointer.x = cx; pointer.y = cy;
  }
  function down(e){
    e.preventDefault();
    setPointer(e);
    pointer.active = true; pointer.lx = pointer.x; pointer.ly = pointer.y;
    // nearest node
    let best=-1, bestD=1e12;
    for(let i=0;i<nodes.length;i++){
      const n=nodes[i]; const dx=n.x-pointer.x, dy=n.y-pointer.y; const d=dx*dx+dy*dy;
      if(d<bestD){ bestD=d; best=i; }
    }
    pointer.grabbed = best;
    burst(pointer.x, pointer.y, 1.0);
  }
  function move(e){
    if(!pointer.active) return;
    e.preventDefault();
    setPointer(e);
    pointer.vx = pointer.x - pointer.lx; pointer.vy = pointer.y - pointer.ly;
    pointer.lx = pointer.x; pointer.ly = pointer.y;
    burst(pointer.x, pointer.y, 0.7);
  }
  function up(){ pointer.active=false; pointer.grabbed=-1; pointer.vx=pointer.vy=0; }
  canvas.addEventListener('touchstart', down, {passive:false});
  addEventListener('touchmove', move, {passive:false});
  addEventListener('touchend', up, {passive:true});
  canvas.addEventListener('mousedown', down, {passive:false});
  addEventListener('mousemove', move, {passive:false});
  addEventListener('mouseup', up, {passive:true});

  // ----- Pixel break-apart (particles) -----
  const particles = [];
  function buildGrid(){
    grid = [];
    TILE = Math.max(10, Math.round(Math.min(W,H)/48));
    const cx=CENTER.x(), cy=CENTER.y();
    const R = BASE_R * 1.1;
    const left = Math.floor((cx-R)/TILE)*TILE;
    const top  = Math.floor((cy-R)/TILE)*TILE;
    const right= Math.ceil((cx+R)/TILE)*TILE;
    const bot  = Math.ceil((cy+R)/TILE)*TILE;
    for(let y=top; y<=bot; y+=TILE){
      for(let x=left; x<=right; x+=TILE){
        const mx=x+TILE*0.5, my=y+TILE*0.5;
        const dx=mx-cx, dy=my-cy;
        if(dx*dx + dy*dy <= R*R){
          const isWhite = ((Math.floor(x/TILE)+Math.floor(y/TILE)) & 1) === 0;
          grid.push({hx:x, hy:y, color:isWhite ? '#fff' : '#111'});
        }
      }
    }
  }

  function burst(px, py, strength){
    const radius = BASE_R * 0.95;
    const speedBoost = Math.hypot(pointer.vx, pointer.vy) * 0.4;
    for(const cell of grid){
      const tx = cell.hx + TILE*0.5, ty = cell.hy + TILE*0.5;
      const dx = tx - px, dy = ty - py;
      const d = Math.hypot(dx, dy);
      if(d < radius){
        const dirx = dx/(d||1), diry = dy/(d||1);
        const tangx = -diry, tangy = dirx;
        const fall = (radius - d) / radius;
        const sp = (fall*6 + speedBoost) * strength;
        const scatter = (Math.random()-0.5)*0.9;
        particles.push({
          x:cell.hx, y:cell.hy,
          vx:dirx*sp + tangx*scatter*sp,
          vy:diry*sp + tangy*scatter*sp,
          hx:cell.hx, hy:cell.hy, color:cell.color, life:1
        });
      }
    }
  }

  function updateParticles(){
    const spring = 0.05, damp = 0.90;
    for(const p of particles){
      const dx = p.hx - p.x, dy = p.hy - p.y;
      p.vx += dx*spring; p.vy += dy*spring;
      p.vx *= damp; p.vy *= damp;
      p.x += p.vx; p.y += p.vy;
      p.life *= 0.985;
    }
    // prune calm ones
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      if (Math.abs(p.x-p.hx)+Math.abs(p.y-p.hy) < 0.5 && p.life < 0.25) particles.splice(i,1);
    }
  }

  // ----- Physics step -----
  function step(){
    const cx=CENTER.x(), cy=CENTER.y();
    for(let i=0;i<nodes.length;i++){
      const n = nodes[i];
      const prev = nodes[(i-1+nodes.length)%nodes.length];
      const next = nodes[(i+1)%nodes.length];
      n.vx += (prev.x-n.x)*neighborK + (next.x-n.x)*neighborK;
      n.vy += (prev.y-n.y)*neighborK + (next.y-n.y)*neighborK;
      const tx = cx + Math.cos(n.restAngle)*n.restRadius;
      const ty = cy + Math.sin(n.restAngle)*n.restRadius;
      n.vx += (tx-n.x)*toCenterK; n.vy += (ty-n.y)*toCenterK;
      const vx=n.x-cx, vy=n.y-cy, dist=Math.hypot(vx,vy)||1;
      n.vx += (vx/dist)*pressure*n.restRadius;
      n.vy += (vy/dist)*pressure*n.restRadius;
      n.vx += (Math.random()-0.5)*jitter; n.vy += (Math.random()-0.5)*jitter;
    }
    if(pointer.active && pointer.grabbed>=0){
      const n = nodes[pointer.grabbed];
      const pullK = 0.45;
      n.vx += (pointer.x-n.x)*pullK + pointer.vx*0.8;
      n.vy += (pointer.y-n.y)*pullK + pointer.vy*0.8;
      const influence=4;
      for(let o=1;o<=influence;o++){
        const f = Math.pow(1 - o/(influence+1), 2) * 0.35;
        const n1 = nodes[(pointer.grabbed+o)%nodes.length];
        const n2 = nodes[(pointer.grabbed-o+nodes.length)%nodes.length];
        n1.vx += (pointer.x-n1.x)*f; n1.vy += (pointer.y-n1.y)*f;
        n2.vx += (pointer.x-n2.x)*f; n2.vy += (pointer.y-n2.y)*f;
      }
    }
    for(const n of nodes){ n.vx*=damping; n.vy*=damping; n.x+=n.vx; n.y+=n.vy; }
    updateParticles();
  }

  // ----- Helpers -----
  function drawBlobPath(){
    ctx.beginPath();
    const len = nodes.length;
    for(let i=0;i<=len;i++){
      const p0 = nodes[(i-1+len)%len], p1 = nodes[i%len];
      const mx=(p0.x+p1.x)*0.5, my=(p0.y+p1.y)*0.5;
      if(i===0) ctx.moveTo(mx,my); else ctx.quadraticCurveTo(p0.x,p0.y,mx,my);
    }
    ctx.closePath();
  }
  function avgVel(){ let vx=0,vy=0; for(const n of nodes){ vx+=n.vx; vy+=n.vy; } const m=Math.hypot(vx,vy)||1; return {x:vx/m,y:vy/m}; }

  // ----- Render -----
  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);

    // Blob clipped area
    drawBlobPath();
    ctx.save();
    ctx.clip();

    // Checkerboard (stick to center space)
    const cx=CENTER.x(), cy=CENTER.y(), R = BASE_R*1.3;
    const left = cx - R, top = cy - R, right = cx + R, bottom = cy + R;
    for(let y = Math.floor(top/TILE)*TILE; y <= bottom; y += TILE){
      for(let x = Math.floor(left/TILE)*TILE; x <= right; x += TILE){
        const isWhite = ((Math.floor(x/TILE)+Math.floor(y/TILE)) & 1) === 0;
        ctx.fillStyle = isWhite ? '#fff' : '#111';
        ctx.fillRect(x, y, TILE, TILE);
      }
    }

    // Inner shading
    const shade = ctx.createRadialGradient(cx, cy+R*0.12, R*0.1, cx, cy+R*0.12, R);
    shade.addColorStop(0,'rgba(0,0,0,0)');
    shade.addColorStop(0.6,'rgba(0,0,0,0.10)');
    shade.addColorStop(1,'rgba(0,0,0,0.35)');
    ctx.fillStyle = shade;
    ctx.fillRect(cx-R, cy-R, R*2, R*2);

    // Moving specular highlight
    const vel = avgVel();
    const hx = cx - vel.x*R*0.3 - R*0.18;
    const hy = cy - vel.y*R*0.3 - R*0.22;
    const hgrad = ctx.createRadialGradient(hx, hy, 0, hx, hy, R*0.85);
    hgrad.addColorStop(0.0,'rgba(255,255,255,0.85)');
    hgrad.addColorStop(0.15,'rgba(255,255,255,0.45)');
    hgrad.addColorStop(0.5,'rgba(255,255,255,0.08)');
    hgrad.addColorStop(1.0,'rgba(255,255,255,0)');
    ctx.fillStyle = hgrad;
    ctx.fillRect(hx-R, hy-R, R*2, R*2);

    ctx.restore(); // end clip

    // Rim light
    drawBlobPath();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.stroke();

    // Particles over everything
    ctx.save();
    for(const p of particles){
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, TILE, TILE);
    }
    ctx.restore();
  }

  // ----- Main loop -----
  function loop(){ step(); render(); requestAnimationFrame(loop); }
  loop();
})();
</script>
</body>
</html>
