<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>time microscope</title>
<style>
  :root { --fg:#fff; --dim:#444; --mid:#888; --acc:#3ff; --bg:#000; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:var(--bg); color:var(--fg); overflow:hidden; }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display:flex; flex-direction:column;
    padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px)
             calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 16px);
    -webkit-user-select:none; user-select:none;
  }
  header { display:flex; align-items:center; height:36px; }
  #back { color:var(--mid); text-decoration:none; font-size:30px; line-height:1; padding:0 12px 0 0; }
  #readout { text-align:center; margin-top:4px; }
  #pct { font-size:clamp(56px, 18vw, 120px); font-weight:700; letter-spacing:-0.04em; line-height:1; font-variant-numeric:tabular-nums; }
  #sub { font-size:13px; color:var(--mid); margin-top:6px; letter-spacing:0.08em; font-variant-numeric:tabular-nums; }
  #stage { flex:1; position:relative; margin:14px 0 10px; touch-action:manipulation; cursor:pointer; min-height:120px; }
  #wave, #scope { position:absolute; left:0; width:100%; display:block; }
  #wave { top:0; height:72%; }
  #scope { bottom:0; height:24%; }
  #micBtn { position:absolute; left:50%; top:36%; transform:translate(-50%,-50%); z-index:2;
    font:inherit; font-size:16px; letter-spacing:0.06em; color:#000; background:#fff; border:none;
    border-radius:999px; padding:16px 28px; cursor:pointer; }
  #micBtn[hidden] { display:none; }
  #hint { position:absolute; left:0; right:0; top:36%; transform:translateY(-50%); text-align:center; font-size:14px; color:var(--mid); letter-spacing:0.06em; pointer-events:none; }
  .ctl { display:flex; align-items:center; gap:12px; height:44px; }
  .ctl label { width:52px; font-size:13px; color:var(--mid); letter-spacing:0.06em; }
  .ctl output { width:70px; text-align:right; font-size:13px; font-variant-numeric:tabular-nums; }
  input[type=range] { flex:1; -webkit-appearance:none; appearance:none; background:transparent; height:44px; }
  input[type=range]::-webkit-slider-runnable-track { height:2px; background:#555; }
  input[type=range]::-moz-range-track { height:2px; background:#555; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:var(--fg); margin-top:-11px; border:none; }
  input[type=range]::-moz-range-thumb { width:24px; height:24px; border-radius:50%; background:var(--fg); border:none; }
</style>
</head>
<body>
<header><a id="back" href="index.html" title="Back to deeley.org">‹</a></header>

<div id="readout">
  <div id="pct">100%</div>
  <div id="sub">speed</div>
</div>

<div id="stage">
  <canvas id="wave"></canvas>
  <canvas id="scope"></canvas>
  <button id="micBtn" type="button">enable microphone</button>
  <div id="hint" style="top:60%"></div>
</div>

<div class="ctl"><label for="echo">echo</label><input id="echo" type="range" min="0" max="100" value="0"><output id="echoV">off</output></div>
<div class="ctl"><label for="delay">delay</label><input id="delay" type="range" min="0" max="1000" value="642"><output id="delayV">300 ms</output></div>

<script>
(() => {
  const CLIP_SECONDS = 2;
  const SLOW_PER_SEC = 0.99;          // speed multiplies by this every second (100% → 99% → 98%…)
  const MIN_RATE = 0.01;              // floor: 1% speed
  const A = -Math.log(SLOW_PER_SEC);
  const RAMP_T = Math.log(MIN_RATE) / Math.log(SLOW_PER_SEC); // seconds to reach floor

  const $ = id => document.getElementById(id);
  const pctEl = $('pct'), subEl = $('sub'), hint = $('hint');
  const wave = $('wave'), scope = $('scope'), stage = $('stage');
  const wctx = wave.getContext('2d'), sctx = scope.getContext('2d');
  const echoIn = $('echo'), delayIn = $('delay'), echoV = $('echoV'), delayV = $('delayV');

  let ctx, bus, dry, delayNode, fb, tone, wet, comp, analyser, scopeData;
  let state = 'idle';                 // idle | recording | playing
  let recBuf = null, recIdx = 0, recStream = null, recNodes = [];
  let clip = null, source = null, t0 = 0;
  let peaks = null;                   // [min,max] per device-pixel column

  // ---------- slider mapping + persistence ----------
  const delayMs = v => 10 * Math.pow(200, v / 1000);          // 10 ms … 2000 ms
  try {
    const s = JSON.parse(localStorage.getItem('tm-settings') || '{}');
    if (s.echo != null) echoIn.value = s.echo;
    if (s.delay != null) delayIn.value = s.delay;
  } catch (e) {}
  function save() { try { localStorage.setItem('tm-settings', JSON.stringify({echo:echoIn.value, delay:delayIn.value})); } catch (e) {} }

  function applyFx() {
    const e = echoIn.value / 100, ms = delayMs(+delayIn.value);
    echoV.textContent = e === 0 ? 'off' : Math.round(e * 100) + '%';
    delayV.textContent = ms < 1000 ? Math.round(ms) + ' ms' : (ms / 1000).toFixed(2) + ' s';
    if (!ctx) return;
    const now = ctx.currentTime;
    wet.gain.setTargetAtTime(e, now, 0.03);
    fb.gain.setTargetAtTime(e * 0.88, now, 0.03);
    delayNode.delayTime.setTargetAtTime(ms / 1000, now, 0.05);
  }
  echoIn.addEventListener('input', () => { applyFx(); save(); });
  delayIn.addEventListener('input', () => { applyFx(); save(); });
  applyFx();

  // ---------- audio graph ----------
  function ensureCtx() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    bus = ctx.createGain();
    dry = ctx.createGain();
    delayNode = ctx.createDelay(2.5);
    fb = ctx.createGain(); fb.gain.value = 0;
    tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 5000;
    wet = ctx.createGain(); wet.gain.value = 0;
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -6; comp.ratio.value = 12; comp.attack.value = 0.003; comp.release.value = 0.2;
    analyser = ctx.createAnalyser(); analyser.fftSize = 2048;
    scopeData = new Float32Array(analyser.fftSize);

    bus.connect(dry); dry.connect(comp);
    bus.connect(delayNode);
    delayNode.connect(tone); tone.connect(fb); fb.connect(delayNode);   // feedback loop, darkening each repeat
    tone.connect(wet); wet.connect(comp);
    comp.connect(analyser); analyser.connect(ctx.destination);
    applyFx();
  }

  // ---------- recording ----------
  const WORKLET = `class R extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor('tm-rec',R)`;
  let workletReady = null;

  const micBtn = $('micBtn');
  let micReady = false;

  // Called straight from the button's click so the browser sees a real user gesture.
  function enableMic() {
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      hint.textContent = 'mic needs the page opened over https';
      return;
    }
    ensureCtx();
    ctx.resume();                                   // not awaited: keep getUserMedia inside the gesture
    micBtn.disabled = true;
    micBtn.textContent = 'asking…';
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } })
      .then(async stream => {
        recStream = stream;
        const mic = ctx.createMediaStreamSource(stream);
        const sink = ctx.createGain(); sink.gain.value = 0; sink.connect(ctx.destination);
        let node;
        try {
          if (!ctx.audioWorklet) throw 0;
          if (!workletReady) workletReady = ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], {type:'application/javascript'})));
          await workletReady;
          node = new AudioWorkletNode(ctx, 'tm-rec');
          node.port.onmessage = ev => take(ev.data);
        } catch (e) {
          node = ctx.createScriptProcessor(2048, 1, 1);
          node.onaudioprocess = ev => take(ev.inputBuffer.getChannelData(0));
        }
        mic.connect(node); node.connect(sink);
        recNodes = [mic, node, sink];
        micReady = true;
        micBtn.hidden = true;
        hint.style.top = '36%';
        hint.textContent = 'tap to record two seconds';
      })
      .catch(err => {
        micBtn.disabled = false;
        micBtn.textContent = 'try again';
        hint.textContent = err && err.name === 'NotAllowedError'
          ? 'mic blocked — allow it in browser settings'
          : 'mic error: ' + (err && (err.name || err.message) || err);
      });
  }
  micBtn.addEventListener('click', e => { e.stopPropagation(); enableMic(); });

  function record() {
    if (!micReady || state === 'recording') return;
    ctx.resume();
    stopPlayback();
    recBuf = new Float32Array(Math.round(ctx.sampleRate * CLIP_SECONDS));
    recIdx = 0; peaks = null;
    state = 'recording';
    hint.textContent = '';
  }

  function take(chunk) {
    if (state !== 'recording' || !recBuf) return;
    const n = Math.min(chunk.length, recBuf.length - recIdx);
    recBuf.set(chunk.subarray(0, n), recIdx);
    recIdx += n;
    if (recIdx >= recBuf.length) finishRecording();
  }

  function finishRecording() {
    state = 'processing';

    // gentle normalize so quiet recordings are audible and the waveform is readable
    let pk = 0;
    for (let i = 0; i < recBuf.length; i++) { const v = Math.abs(recBuf[i]); if (v > pk) pk = v; }
    const g = pk > 0 ? Math.min(0.9 / pk, 20) : 1;
    // short fades to avoid a click at the loop seam
    const fade = Math.round(ctx.sampleRate * 0.004);
    for (let i = 0; i < recBuf.length; i++) {
      let f = 1;
      if (i < fade) f = i / fade; else if (i > recBuf.length - fade) f = (recBuf.length - i) / fade;
      recBuf[i] *= g * f;
    }
    clip = ctx.createBuffer(1, recBuf.length, ctx.sampleRate);
    clip.copyToChannel ? clip.copyToChannel(recBuf, 0) : clip.getChannelData(0).set(recBuf);
    computePeaks();
    startPlayback();
  }

  // ---------- playback ----------
  function startPlayback() {
    source = ctx.createBufferSource();
    source.buffer = clip;
    source.loop = true;
    source.connect(bus);
    t0 = ctx.currentTime + 0.03;
    source.playbackRate.setValueAtTime(1, t0);
    source.playbackRate.exponentialRampToValueAtTime(MIN_RATE, t0 + RAMP_T);
    source.start(t0);
    state = 'playing';
    hint.textContent = '';
  }

  function stopPlayback() {
    if (source) { try { source.stop(); } catch (e) {} source.disconnect(); source = null; }
  }

  // speed and distance travelled through the clip (seconds of clip time), analytically
  function playState() {
    const lat = (ctx.outputLatency || 0) + (ctx.baseLatency || 0);
    const t = Math.max(0, ctx.currentTime - lat - t0);
    if (t < RAMP_T) return { rate: Math.exp(-A * t), dist: (1 - Math.exp(-A * t)) / A };
    return { rate: MIN_RATE, dist: (1 - MIN_RATE) / A + (t - RAMP_T) * MIN_RATE };
  }

  // ---------- drawing ----------
  function fit(c) {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const w = Math.round(c.clientWidth * dpr), h = Math.round(c.clientHeight * dpr);
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; return true; }
    return false;
  }

  function computePeaks(upTo) {
    const data = recBuf, cols = wave.width;
    if (!data || !cols) return;
    const end = upTo == null ? data.length : upTo;
    const per = data.length / cols;
    peaks = new Float32Array(cols * 2);
    for (let c = 0; c < cols; c++) {
      const a = Math.floor(c * per), b = Math.min(end, Math.floor((c + 1) * per));
      let lo = 0, hi = 0;
      for (let i = a; i < b; i++) { const v = data[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
      peaks[c * 2] = lo; peaks[c * 2 + 1] = hi;
    }
  }

  function drawWave(headFrac, recording) {
    const W = wave.width, H = wave.height, mid = H / 2;
    wctx.clearRect(0, 0, W, H);
    wctx.fillStyle = '#222';
    wctx.fillRect(0, mid, W, Math.max(1, H / 300));
    if (!peaks) return;
    const headCol = headFrac * W;
    const amp = mid * 0.95;
    for (let c = 0; c < W; c++) {
      const lo = peaks[c * 2], hi = peaks[c * 2 + 1];
      if (lo === 0 && hi === 0) continue;
      wctx.fillStyle = recording ? '#fff' : (c <= headCol ? '#fff' : '#4a4a4a');
      const y1 = mid - hi * amp, y2 = mid - lo * amp;
      wctx.fillRect(c, y1, 1, Math.max(1, y2 - y1));
    }
    // playhead / record head
    const lw = Math.max(2, W / 400);
    wctx.fillStyle = recording ? '#f33' : getComputedStyle(document.documentElement).getPropertyValue('--acc');
    wctx.shadowColor = wctx.fillStyle; wctx.shadowBlur = 12;
    wctx.fillRect(headCol - lw / 2, 0, lw, H);
    wctx.shadowBlur = 0;
  }

  function drawScope() {
    const W = scope.width, H = scope.height, mid = H / 2;
    sctx.clearRect(0, 0, W, H);
    if (!analyser) return;
    analyser.getFloatTimeDomainData(scopeData);
    sctx.strokeStyle = state === 'playing' ? '#3ff' : '#333';
    sctx.lineWidth = Math.max(1.5, W / 500);
    sctx.beginPath();
    const n = scopeData.length;
    for (let i = 0; i < n; i++) {
      const x = i / (n - 1) * W, y = mid - scopeData[i] * mid * 0.95;
      i ? sctx.lineTo(x, y) : sctx.moveTo(x, y);
    }
    sctx.stroke();
  }

  function fmtPct(r) {
    const p = r * 100;
    return (p >= 9.95 ? Math.round(p) : p.toFixed(1)) + '%';
  }

  function frame() {
    const resized = fit(wave) | fit(scope);
    if (resized && recBuf) computePeaks(state === 'recording' ? recIdx : undefined);

    if (state === 'recording') {
      computePeaks(recIdx);
      drawWave(recIdx / recBuf.length, true);
      pctEl.textContent = '100%';
      subEl.textContent = 'recording ' + (recIdx / ctx.sampleRate).toFixed(1) + ' / 2.0 s';
    } else if (state === 'playing') {
      const { rate, dist } = playState();
      const dur = clip.duration;
      drawWave((dist % dur) / dur, false);
      pctEl.textContent = fmtPct(rate);
      const loops = Math.floor(dist / dur) + 1;
      subEl.textContent = 'speed · ' + (1 / rate).toFixed(rate > 0.1 ? 2 : 1) + '× longer · pass ' + loops;
    } else {
      drawWave(0, false);
    }
    drawScope();
    requestAnimationFrame(frame);
  }

  stage.addEventListener('click', e => { if (e.target !== micBtn) record(); });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
