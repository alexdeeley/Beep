<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<title>Hypnotic Spirals</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;}
  #root{width:100%;height:100%;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useEffect, useRef } = React;

function HypnoticSpirals() {
  const canvasRef = useRef(null);
  const glRef = useRef(null);
  const audioContextRef = useRef(null);
  const analyserRef = useRef(null);
  const audioDataRef = useRef(new Uint8Array(128));

  const stateRef = useRef({
    time: 0,
    interactionForce: { x: 0, y: 0, strength: 0 },
    spiralCenters: [],
    zoomLevel: 1.0,
    rotationBias: 0,
    slowTime: false,
    slowTimeBlend: 0,
    trailPersistence: 0.97,
    mouseDown: false,
    mousePos: { x: 0, y: 0 },
    lastMousePos: { x: 0, y: 0 },
    lastTouchDist: 0,
    lastTouchAngle: 0,
    longPressTimer: null,
    pingPong: false,
    lastFrameTime: 0,
    qualityScale: 1.0,
    frameTimeSamples: [],
    colorMode: 0,
    modeTransition: 0,
    targetMode: 0,
    particles: [],
    audioEnabled: false,
    audioLevels: { bass: 0, mid: 0, treble: 0 }
  });

  useEffect(() => {
    const canvas = canvasRef.current;
    const gl = canvas.getContext('webgl', {
      antialias: false,
      alpha: false,
      preserveDrawingBuffer: false
    });

    if (!gl) return;
    glRef.current = gl;

    const state = stateRef.current;
    for (let i = 0; i < 200; i++) {
      state.particles.push({
        x: (Math.random() - 0.5) * 4,
        y: (Math.random() - 0.5) * 4,
        vx: (Math.random() - 0.5) * 0.1,
        vy: (Math.random() - 0.5) * 0.1,
        life: Math.random()
      });
    }

    const vertexShaderSource = `
      attribute vec2 a_position;
      varying vec2 v_uv;
      void main() {
        v_uv = a_position * 0.5 + 0.5;
        gl_Position = vec4(a_position, 0.0, 1.0);
      }
    `;

    const fragmentShaderSource = `
      precision highp float;
      varying vec2 v_uv;
      uniform float u_time;
      uniform vec2 u_resolution;
      uniform sampler2D u_feedback;
      uniform vec2 u_forcePos;
      uniform float u_forceStrength;
      uniform float u_zoom;
      uniform float u_rotation;
      uniform float u_trailPersist;
      uniform float u_slowBlend;
      uniform float u_colorMode;
      uniform float u_modeTransition;
      uniform vec3 u_audioLevels;
      uniform vec2 u_spiralCenters[10];
      uniform int u_numCenters;

      #define PI 3.14159265359
      #define TAU 6.28318530718

      float hash(vec2 p) {
        p = fract(p * vec2(443.897, 441.423));
        p += dot(p, p + 23.45);
        return fract(p.x * p.y);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }

      float fbm(vec2 p) {
        float value = 0.0;
        float amplitude = 0.5;
        for(int i = 0; i < 6; i++) {
          value += amplitude * noise(p);
          p *= 2.3;
          amplitude *= 0.5;
        }
        return value;
      }

      vec2 curl(vec2 p) {
        float eps = 0.01;
        float n1 = fbm(p + vec2(0.0, eps));
        float n2 = fbm(p - vec2(0.0, eps));
        float n3 = fbm(p + vec2(eps, 0.0));
        float n4 = fbm(p - vec2(eps, 0.0));
        return vec2(n1 - n2, n4 - n3) / (2.0 * eps);
      }

      float spiralLog(vec2 p, float phase, float freq, float tight) {
        float r = length(p);
        float a = atan(p.y, p.x);
        float spiral = a - log(r + 0.1) * tight + phase;
        return cos(spiral * freq) * 0.5 + 0.5;
      }

      float spiralArch(vec2 p, float phase, float freq) {
        float r = length(p);
        float a = atan(p.y, p.x);
        float spiral = a - r * 0.3 + phase;
        return cos(spiral * freq) * 0.5 + 0.5;
      }

      float spiralLituus(vec2 p, float phase, float freq) {
        float r = length(p);
        float a = atan(p.y, p.x);
        float spiral = a * a - r * 0.5 + phase;
        return cos(spiral * freq) * 0.5 + 0.5;
      }

      float spiralHyperbolic(vec2 p, float phase, float freq) {
        float r = length(p);
        float a = atan(p.y, p.x);
        float spiral = a * r - phase;
        return cos(spiral * freq) * 0.5 + 0.5;
      }

      float spiralFermat(vec2 p, float phase, float freq) {
        float r = length(p);
        float a = atan(p.y, p.x);
        float spiral = a - sqrt(r) * 2.0 + phase;
        return cos(spiral * freq) * 0.5 + 0.5;
      }

      vec3 palette1(float t) {
        vec3 a = vec3(0.5, 0.5, 0.5);
        vec3 b = vec3(0.5, 0.5, 0.5);
        vec3 c = vec3(1.0, 1.0, 1.0);
        vec3 d = vec3(0.0, 0.33, 0.67);
        return a + b * cos(TAU * (c * t + d));
      }

      vec3 palette2(float t) {
        vec3 a = vec3(0.5, 0.5, 0.5);
        vec3 b = vec3(0.5, 0.5, 0.5);
        vec3 c = vec3(1.0, 1.0, 0.5);
        vec3 d = vec3(0.8, 0.9, 0.3);
        return a + b * cos(TAU * (c * t + d));
      }

      vec3 palette3(float t) {
        vec3 a = vec3(0.5, 0.5, 0.5);
        vec3 b = vec3(0.5, 0.5, 0.5);
        vec3 c = vec3(2.0, 1.0, 0.0);
        vec3 d = vec3(0.5, 0.2, 0.25);
        return a + b * cos(TAU * (c * t + d));
      }

      vec3 palette4(float t) {
        vec3 a = vec3(0.5, 0.5, 0.5);
        vec3 b = vec3(0.5, 0.5, 0.5);
        vec3 c = vec3(1.0, 0.7, 0.4);
        vec3 d = vec3(0.0, 0.15, 0.2);
        return a + b * cos(TAU * (c * t + d));
      }

      void main() {
        vec2 uv = v_uv;
        vec2 coord = (uv - 0.5) * 2.0;
        coord.x *= u_resolution.x / u_resolution.y;
        coord *= u_zoom;

        float ca = cos(u_rotation);
        float sa = sin(u_rotation);
        coord = vec2(ca * coord.x - sa * coord.y, sa * coord.x + ca * coord.y);

        float audioWarp = u_audioLevels.x * 0.3 + u_audioLevels.y * 0.2;
        vec2 warp1 = curl(coord * (0.8 + audioWarp) + u_time * 0.05);
        vec2 warp2 = curl(coord * 1.3 - u_time * 0.07 + warp1 * 0.5);
        vec2 warp3 = curl(coord * 1.7 + u_time * 0.03 + warp2 * 0.3);
        vec2 warpedCoord = coord + warp1 * 0.3 + warp2 * 0.2 + warp3 * 0.15;

        vec2 toForce = coord - u_forcePos;
        float forceDist = length(toForce);
        float forceInfluence = exp(-forceDist * 2.0) * u_forceStrength;
        vec2 forceDir = normalize(toForce + 1e-6);
        warpedCoord += forceDir * forceInfluence * 0.5;
        warpedCoord += vec2(-forceDir.y, forceDir.x) * forceInfluence * 0.3;

        float breathe1 = sin(u_time * (0.3 + u_audioLevels.x * 0.2)) * 0.5 + 0.5;
        float breathe2 = cos(u_time * (0.23 + u_audioLevels.y * 0.15)) * 0.5 + 0.5;
        float breathe3 = sin(u_time * (0.17 + u_audioLevels.z * 0.1)) * 0.5 + 0.5;
        float breathe4 = cos(u_time * 0.19) * 0.5 + 0.5;
        float breathe5 = sin(u_time * 0.13) * 0.5 + 0.5;

        float spiral = 0.0;
        float totalWeight = 0.0;

        for(int i = 0; i < 10; i++) {
          if(i >= u_numCenters) break;
          vec2 center = u_spiralCenters[i];
          float dist = length(warpedCoord - center);
          float weight = exp(-dist * 0.5);
          float s = spiralLog(warpedCoord - center, u_time * 0.5, 8.0, 3.0);
          spiral += s * weight;
          totalWeight += weight;
        }

        float s1 = spiralLog(
          warpedCoord + vec2(sin(u_time * 0.1), cos(u_time * 0.13)) * 0.5,
          u_time * (0.5 + u_audioLevels.x * 0.5) + breathe1 * TAU,
          8.0 + breathe1 * 3.0 + u_audioLevels.y * 2.0,
          3.0 + breathe1
        );

        float s2 = spiralArch(
          warpedCoord + vec2(cos(u_time * 0.15), sin(u_time * 0.11)) * 0.7,
          u_time * 0.3 + breathe2 * TAU,
          6.0 + breathe2 * 4.0
        );

        float s3 = spiralLituus(
          warpedCoord + vec2(sin(u_time * 0.09), -cos(u_time * 0.14)) * 0.4,
          u_time * 0.7 + breathe3 * TAU,
          5.0 + breathe3 * 2.0
        );

        float s4 = spiralHyperbolic(
          warpedCoord + vec2(-sin(u_time * 0.12), cos(u_time * 0.16)) * 0.6,
          u_time * 0.4 + breathe4 * TAU,
          7.0 + breathe4 * 3.0
        );

        float s5 = spiralFermat(
          warpedCoord + vec2(cos(u_time * 0.08), -sin(u_time * 0.1)) * 0.5,
          u_time * 0.6 + breathe5 * TAU,
          9.0 + breathe5 * 2.0
        );

        float interference = s1 * s2 + s2 * s3 + s3 * s4 + s4 * s5 + s1 * s5;
        interference = pow(max(interference * 0.2, 0.0), 1.3);

        float microDetail = 0.0;
        for(int i = 0; i < 12; i++) {
          float fi = float(i);
          vec2 offset = vec2(
            cos(fi * 0.7 + u_time * 0.1),
            sin(fi * 0.8 - u_time * 0.12)
          ) * (0.3 + u_audioLevels.z * 0.2);
          float detail = spiralLog(
            warpedCoord * (2.0 + fi * 0.3) + offset,
            u_time * (0.8 + fi * 0.1),
            12.0 + fi * 2.0,
            4.0
          );
          microDetail += detail * (1.0 / 12.0);
        }

        if(totalWeight > 0.0) {
          spiral /= totalWeight;
          spiral = (s1 + s2 + s3 + s4 + s5) * 0.15 + interference * 0.25 + microDetail * 0.3 + spiral * 0.3;
        } else {
          spiral = (s1 + s2 + s3 + s4 + s5) * 0.2 + interference * 0.25 + microDetail * 0.35;
        }

        float phaseShift = sin(u_time * 0.4) * 0.15;
        vec3 color1, color2;

        color1.r = spiralLog(warpedCoord, u_time * 0.5 + phaseShift, 8.0, 3.0);
        color1.g = spiral;
        color1.b = spiralLog(warpedCoord, u_time * 0.5 - phaseShift, 8.0, 3.0);

        float paletteInput = spiral + u_time * 0.1 + length(warpedCoord) * 0.2;
        color2 = palette1(paletteInput);

        vec3 color = mix(color1, color2, smoothstep(0.0, 1.0, u_modeTransition));

        if(u_colorMode > 0.5 && u_colorMode < 1.5) {
          color = palette1(spiral + u_time * 0.1);
        } else if(u_colorMode > 1.5 && u_colorMode < 2.5) {
          color = palette2(spiral - u_time * 0.15 + interference * 0.5);
        } else if(u_colorMode > 2.5 && u_colorMode < 3.5) {
          color = palette3(spiral + u_time * 0.05 + fbm(warpedCoord) * 0.3);
        } else if(u_colorMode > 3.5) {
          color = palette4(microDetail + u_time * 0.2);
        }

        color += vec3(u_audioLevels.x, u_audioLevels.y, u_audioLevels.z) * 0.15;

        float bloomPhase = mod(u_time * 0.05, 1.0);
        float bloomTrigger = step(0.97, bloomPhase);
        float bloomIntensity = bloomTrigger * pow(1.0 - abs(bloomPhase - 0.985) / 0.015, 3.0);
        bloomIntensity += u_audioLevels.x * 0.3;
        float bloomDist = length(warpedCoord);
        float bloom = exp(-bloomDist * bloomDist * 2.0) * bloomIntensity * 0.4;
        color += bloom * vec3(1.0, 0.8, 0.6);

        vec4 feedbackColor = texture2D(u_feedback, uv);
        float persistence = mix(u_trailPersist, 0.99, u_slowBlend);
        color = mix(color, feedbackColor.rgb, persistence);

        color = pow(color, vec3(1.3));
        color = smoothstep(0.0, 1.0, color);

        float dither = (hash(uv * u_resolution + fract(u_time)) - 0.5) * 0.008;
        color += dither;

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    function createShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        return null;
      }
      return shader;
    }

    function createProgram(vertSource, fragSource) {
      const program = gl.createProgram();
      const vertShader = createShader(gl.VERTEX_SHADER, vertSource);
      const fragShader = createShader(gl.FRAGMENT_SHADER, fragSource);
      if (!vertShader || !fragShader) return null;
      gl.attachShader(program, vertShader);
      gl.attachShader(program, fragShader);
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error(gl.getProgramInfoLog(program));
        return null;
      }
      return program;
    }

    const program = createProgram(vertexShaderSource, fragmentShaderSource);
    if (!program) return;

    const quadBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

    const uniforms = {
      time: gl.getUniformLocation(program, 'u_time'),
      resolution: gl.getUniformLocation(program, 'u_resolution'),
      feedback: gl.getUniformLocation(program, 'u_feedback'),
      forcePos: gl.getUniformLocation(program, 'u_forcePos'),
      forceStrength: gl.getUniformLocation(program, 'u_forceStrength'),
      zoom: gl.getUniformLocation(program, 'u_zoom'),
      rotation: gl.getUniformLocation(program, 'u_rotation'),
      trailPersist: gl.getUniformLocation(program, 'u_trailPersist'),
      slowBlend: gl.getUniformLocation(program, 'u_slowBlend'),
      colorMode: gl.getUniformLocation(program, 'u_colorMode'),
      modeTransition: gl.getUniformLocation(program, 'u_modeTransition'),
      audioLevels: gl.getUniformLocation(program, 'u_audioLevels'),
      spiralCenters: gl.getUniformLocation(program, 'u_spiralCenters'),
      numCenters: gl.getUniformLocation(program, 'u_numCenters')
    };

    let fbA, fbB, texA, texB;

    function setupFramebuffers() {
      if (fbA) gl.deleteFramebuffer(fbA);
      if (fbB) gl.deleteFramebuffer(fbB);
      if (texA) gl.deleteTexture(texA);
      if (texB) gl.deleteTexture(texB);

      function makeTex() {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, canvas.width, canvas.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return tex;
      }

      texA = makeTex();
      texB = makeTex();

      fbA = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbA);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texA, 0);

      fbB = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbB);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texB, 0);

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const s = stateRef.current;
      canvas.width = Math.max(2, Math.floor(window.innerWidth * dpr * s.qualityScale));
      canvas.height = Math.max(2, Math.floor(window.innerHeight * dpr * s.qualityScale));
      gl.viewport(0, 0, canvas.width, canvas.height);
      setupFramebuffers();
    }

    resize();
    window.addEventListener('resize', resize);

    function getEventPos(e) {
      const rect = canvas.getBoundingClientRect();
      if (e.touches) {
        return Array.from(e.touches).map(t => ({
          x: ((t.clientX - rect.left) / rect.width - 0.5) * 2 * (canvas.width / canvas.height),
          y: -((t.clientY - rect.top) / rect.height - 0.5) * 2
        }));
      } else {
        return [{
          x: ((e.clientX - rect.left) / rect.width - 0.5) * 2 * (canvas.width / canvas.height),
          y: -((e.clientY - rect.top) / rect.height - 0.5) * 2
        }];
      }
    }

    let tapTimer = null;
    let tapCount = 0;

    function handleStart(e) {
      e.preventDefault();
      const positions = getEventPos(e);
      const s = stateRef.current;

      if (positions.length === 1) {
        s.mouseDown = true;
        s.mousePos = positions[0];
        s.lastMousePos = positions[0];

        tapCount++;
        if (tapCount === 1) {
          tapTimer = setTimeout(() => { tapCount = 0; }, 300);
        } else if (tapCount === 2) {
          clearTimeout(tapTimer);
          tapCount = 0;
          if (s.spiralCenters.length < 10) {
            s.spiralCenters.push({ x: positions[0].x / s.zoomLevel, y: positions[0].y / s.zoomLevel, age: 0 });
          }
        }

        clearTimeout(s.longPressTimer);
        s.longPressTimer = setTimeout(() => {
          s.slowTime = true;
          s.targetMode = (s.targetMode + 1) % 5;
        }, 500);
      } else if (positions.length === 2) {
        const dx = positions[1].x - positions[0].x;
        const dy = positions[1].y - positions[0].y;
        s.lastTouchDist = Math.sqrt(dx * dx + dy * dy);
        s.lastTouchAngle = Math.atan2(dy, dx);
      }
    }

    function handleMove(e) {
      e.preventDefault();
      const positions = getEventPos(e);
      const s = stateRef.current;

      if (positions.length === 1 && s.mouseDown) {
        s.lastMousePos = s.mousePos;
        s.mousePos = positions[0];

        const dx = s.mousePos.x - s.lastMousePos.x;
        const dy = s.mousePos.y - s.lastMousePos.y;
        const strength = Math.sqrt(dx * dx + dy * dy);
        s.interactionForce = { x: s.mousePos.x / s.zoomLevel, y: s.mousePos.y / s.zoomLevel, strength: strength * 8.0 };
      } else if (positions.length === 2) {
        const dx = positions[1].x - positions[0].x;
        const dy = positions[1].y - positions[0].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const angle = Math.atan2(dy, dx);

        if (s.lastTouchDist > 0) {
          const zoomDelta = dist / s.lastTouchDist;
          s.zoomLevel *= zoomDelta;
          s.zoomLevel = Math.max(0.3, Math.min(4.0, s.zoomLevel));
        }
        s.lastTouchDist = dist;

        if (s.lastTouchAngle !== 0) {
          const angleDelta = angle - s.lastTouchAngle;
          s.rotationBias += angleDelta * 0.8;
        }
        s.lastTouchAngle = angle;
      }
    }

    function handleEnd(e) {
      e.preventDefault();
      const s = stateRef.current;
      s.mouseDown = false;
      s.lastTouchDist = 0;
      s.lastTouchAngle = 0;
      clearTimeout(s.longPressTimer);
      s.slowTime = false;
    }

    function handleWheel(e) {
      e.preventDefault();
      const s = stateRef.current;
      const delta = e.deltaY * 0.002;
      s.zoomLevel *= Math.exp(-delta);
      s.zoomLevel = Math.max(0.3, Math.min(4.0, s.zoomLevel));
    }

    canvas.addEventListener('touchstart', handleStart, { passive: false });
    canvas.addEventListener('touchmove', handleMove, { passive: false });
    canvas.addEventListener('touchend', handleEnd, { passive: false });
    canvas.addEventListener('touchcancel', handleEnd, { passive: false });
    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('wheel', handleWheel, { passive: false });
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    function toggleAudio() {
      const s = stateRef.current;
      if (!s.audioEnabled) {
        if (!audioContextRef.current) {
          audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
          analyserRef.current = audioContextRef.current.createAnalyser();
          analyserRef.current.fftSize = 256;

          navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
              const source = audioContextRef.current.createMediaStreamSource(stream);
              source.connect(analyserRef.current);
              s.audioEnabled = true;
            })
            .catch(err => console.error('Audio access denied:', err));
        } else {
          s.audioEnabled = true;
        }
      } else {
        s.audioEnabled = false;
      }
    }

    function handleKeyPress(e) {
      const s = stateRef.current;
      if (e.key === 'c' || e.key === 'C') s.targetMode = (s.targetMode + 1) % 5;
      else if (e.key === 'r' || e.key === 'R') s.spiralCenters = [];
      else if (e.key === 'a' || e.key === 'A') toggleAudio();
    }
    window.addEventListener('keydown', handleKeyPress);

    let animationId;

    function render() {
      const s = stateRef.current;
      const now = performance.now();
      const dt = Math.min((now - s.lastFrameTime) / 1000, 0.1) || 0.016;
      s.lastFrameTime = now;

      const frameTime = dt * 1000;
      s.frameTimeSamples.push(frameTime);
      if (s.frameTimeSamples.length > 120) s.frameTimeSamples.shift();

      const avgFrameTime = s.frameTimeSamples.reduce((a, b) => a + b, 0) / s.frameTimeSamples.length;
      const TARGET = 16.67;

      if (avgFrameTime > TARGET * 1.3 && s.qualityScale > 0.4) {
        s.qualityScale *= 0.99;
        if (s.frameTimeSamples.length === 120) resize();
      } else if (avgFrameTime < TARGET * 0.7 && s.qualityScale < 1.0) {
        s.qualityScale *= 1.005;
        s.qualityScale = Math.min(1.0, s.qualityScale);
        if (s.frameTimeSamples.length === 120) resize();
      }

      if (s.audioEnabled && analyserRef.current) {
        analyserRef.current.getByteFrequencyData(audioDataRef.current);
        const data = audioDataRef.current;
        const bass = Array.from(data.slice(0, 10)).reduce((a, b) => a + b, 0) / 10 / 255;
        const mid = Array.from(data.slice(10, 50)).reduce((a, b) => a + b, 0) / 40 / 255;
        const treble = Array.from(data.slice(50, 128)).reduce((a, b) => a + b, 0) / 78 / 255;
        s.audioLevels = { bass, mid, treble };
      }

      const timeScale = s.slowTime ? 0.15 : 1.0;
      s.slowTimeBlend += ((s.slowTime ? 1 : 0) - s.slowTimeBlend) * dt * 4.0;
      s.time += dt * timeScale;

      if (s.targetMode !== s.colorMode) {
        s.modeTransition += dt * 2.0;
        if (s.modeTransition >= 1.0) {
          s.colorMode = s.targetMode;
          s.modeTransition = 0.0;
        }
      } else {
        s.modeTransition = 0.0;
      }

      s.interactionForce.strength *= Math.exp(-dt * 6.0);

      s.spiralCenters = s.spiralCenters.filter(c => (c.age += dt) < 10.0);

      if (Math.random() < dt * 0.05 && s.spiralCenters.length < 5) {
        s.spiralCenters.push({ x: (Math.random() - 0.5) * 3, y: (Math.random() - 0.5) * 3, age: 0 });
      }

      s.trailPersistence = 0.97 + s.slowTimeBlend * 0.025 - s.audioLevels.bass * 0.02;

      const readTex = s.pingPong ? texB : texA;
      const writeFB = s.pingPong ? fbA : fbB;

      gl.bindFramebuffer(gl.FRAMEBUFFER, writeFB);
      gl.useProgram(program);

      const posLoc = gl.getAttribLocation(program, 'a_position');
      gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
      gl.enableVertexAttribArray(posLoc);
      gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(uniforms.time, s.time);
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform2f(uniforms.forcePos, s.interactionForce.x, s.interactionForce.y);
      gl.uniform1f(uniforms.forceStrength, s.interactionForce.strength);
      gl.uniform1f(uniforms.zoom, s.zoomLevel);
      gl.uniform1f(uniforms.rotation, s.rotationBias);
      gl.uniform1f(uniforms.trailPersist, s.trailPersistence);
      gl.uniform1f(uniforms.slowBlend, s.slowTimeBlend);
      gl.uniform1f(uniforms.colorMode, s.colorMode);
      gl.uniform1f(uniforms.modeTransition, s.modeTransition);
      gl.uniform3f(uniforms.audioLevels, s.audioLevels.bass, s.audioLevels.mid, s.audioLevels.treble);

      const centersArray = new Float32Array(20);
      const count = Math.min(s.spiralCenters.length, 10);
      for (let i = 0; i < count; i++) {
        centersArray[i * 2] = s.spiralCenters[i].x;
        centersArray[i * 2 + 1] = s.spiralCenters[i].y;
      }
      gl.uniform2fv(uniforms.spiralCenters, centersArray);
      gl.uniform1i(uniforms.numCenters, count);

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, readTex);
      gl.uniform1i(uniforms.feedback, 0);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      s.pingPong = !s.pingPong;

      animationId = requestAnimationFrame(render);
    }

    stateRef.current.lastFrameTime = performance.now();
    render();

    return () => {
      cancelAnimationFrame(animationId);
      window.removeEventListener('resize', resize);
      window.removeEventListener('keydown', handleKeyPress);
      canvas.removeEventListener('touchstart', handleStart);
      canvas.removeEventListener('touchmove', handleMove);
      canvas.removeEventListener('touchend', handleEnd);
      canvas.removeEventListener('touchcancel', handleEnd);
      canvas.removeEventListener('mousedown', handleStart);
      canvas.removeEventListener('mousemove', handleMove);
      canvas.removeEventListener('mouseup', handleEnd);
      canvas.removeEventListener('wheel', handleWheel);
    };
  }, []);

  return (
    <div style={{ width: '100%', height: '100vh', background: '#000', margin: 0, padding: 0, overflow: 'hidden', position: 'relative' }}>
      <canvas ref={canvasRef} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<HypnoticSpirals />);
</script>
</body>
</html>
