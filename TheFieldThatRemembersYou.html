<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Field That Remembers You</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  overflow: hidden;
  touch-action: none;
}
canvas {
  display: block;
}
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>

<script>
/*
THE FIELD THAT REMEMBERS YOU
Pure line-based generative field
No UI. No reset. No instructions.
You interfere. It adapts.
*/

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let W, H, DPR;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize", resize);
resize();

const LINE_COUNT = 2400;
const SPEED = 0.35;
const MEMORY = 0.94;

let lines = [];
let flow = [];

for(let i=0;i<LINE_COUNT;i++){
  lines.push({
    x: Math.random()*W,
    y: Math.random()*H,
    vx: Math.cos(Math.random()*Math.PI*2),
    vy: Math.sin(Math.random()*Math.PI*2),
    bend: Math.random()*0.5,
    life: Math.random()*1000
  });
}

let touches = [];

canvas.addEventListener("pointerdown", e=>{
  touches.push({x:e.clientX,y:e.clientY,str:1});
});
canvas.addEventListener("pointermove", e=>{
  touches.forEach(t=>{
    t.x = e.clientX;
    t.y = e.clientY;
  });
});
canvas.addEventListener("pointerup", ()=>touches=[]);
canvas.addEventListener("pointercancel", ()=>touches=[]);

function step(){
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 0.6;

  ctx.beginPath();

  for(let l of lines){
    let ox = l.x;
    let oy = l.y;

    let ax = 0;
    let ay = 0;

    for(let t of touches){
      let dx = l.x - t.x;
      let dy = l.y - t.y;
      let d = Math.sqrt(dx*dx+dy*dy)+0.001;
      let f = Math.min(120/d, 6);
      ax += dx/d * f;
      ay += dy/d * f;
    }

    let angle = Math.sin(l.life*0.002 + l.bend)*0.6;
    let cos = Math.cos(angle);
    let sin = Math.sin(angle);

    let nvx = l.vx * cos - l.vy * sin + ax*0.01;
    let nvy = l.vx * sin + l.vy * cos + ay*0.01;

    l.vx = l.vx * MEMORY + nvx * (1-MEMORY);
    l.vy = l.vy * MEMORY + nvy * (1-MEMORY);

    l.x += l.vx * SPEED;
    l.y += l.vy * SPEED;

    if(l.x<0) l.x+=W;
    if(l.x>W) l.x-=W;
    if(l.y<0) l.y+=H;
    if(l.y>H) l.y-=H;

    ctx.moveTo(ox, oy);
    ctx.lineTo(l.x, l.y);

    l.life++;
    l.bend += (Math.abs(ax)+Math.abs(ay))*0.0005;
  }

  ctx.stroke();
  requestAnimationFrame(step);
}

ctx.fillStyle="#000";
ctx.fillRect(0,0,W,H);
step();
</script>
</body>
</html>
