<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Castle Maze</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;overscroll-behavior:none;
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-text-size-adjust:100%}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#probe{position:fixed;left:0;bottom:0;width:1px;height:var(--sab);pointer-events:none;visibility:hidden}
/* splash */
#sSplash{justify-content:center;gap:18px;background:#000;cursor:pointer;transition:opacity .45s}
#sSplash.out{opacity:0}
#sSplash img{display:block;width:100%;max-width:min(960px,calc((100vh - 170px) * 1.339));height:auto;border-radius:18px;
  box-shadow:0 0 50px #4af3,0 10px 40px #000;animation:spIn .9s cubic-bezier(.2,1.2,.4,1) both}
#sSplash .tap{animation:tapP 1.4s ease-in-out infinite;min-width:240px}
@keyframes spIn{from{opacity:0;transform:scale(.92)}}
@keyframes tapP{50%{transform:scale(1.06);box-shadow:0 0 28px #fff8}}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:none;align-items:center;gap:8px;
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 8px calc(var(--sal) + 10px);pointer-events:none}
#hud.on{display:flex}
#hudLvl{flex:1;min-width:0;line-height:1.1}
#hudLvl b{display:block;font-size:12px;letter-spacing:.14em;opacity:.7;font-weight:800}
#hudLvl span{display:block;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:#fff;color:#000;border-radius:999px;padding:7px 12px;font-weight:900;font-size:16px;white-space:nowrap}
#hudKeys{display:flex;gap:3px;font-size:20px}
#hudKeys i{font-style:normal;border-bottom:4px solid;line-height:1.1}
.ib{pointer-events:auto;width:46px;height:46px;flex:0 0 46px;border-radius:14px;border:3px solid #fff;background:#000;color:#fff;
  font-size:22px;font-weight:900;display:grid;place-items:center;cursor:pointer;padding:0}
.ib:active{transform:scale(.92)}
/* Screens */
.screen{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;overflow-y:auto;touch-action:pan-y;
  -webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 22px) calc(var(--sar) + 18px) calc(var(--sab) + 26px) calc(var(--sal) + 18px);
  background:#000 radial-gradient(circle at 50% 0%,#1d1d2e 0,#000 70%)}
.screen.on{display:flex}
.screen.ov{background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);justify-content:center}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:stretch;gap:14px}
h1{margin:0;text-align:center;font-size:clamp(44px,14vw,72px);line-height:.92;font-weight:1000;letter-spacing:.02em;
  text-shadow:0 6px 0 #555,0 10px 24px #000}
h2{margin:0 0 4px;text-align:center;font-size:30px;font-weight:1000;letter-spacing:.04em}
.sub{text-align:center;opacity:.75;font-weight:700;margin:0}
.btn{appearance:none;border:4px solid #fff;background:#fff;color:#000;border-radius:20px;min-height:64px;padding:12px 18px;
  font:inherit;font-size:22px;font-weight:1000;letter-spacing:.06em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.alt{background:#000;color:#fff}
.btn.sm{min-height:52px;font-size:18px}
.btn:active{transform:scale(.97)}
.castle{font-size:64px;text-align:center;filter:drop-shadow(0 0 18px #fff6)}
.checker{height:18px;border-radius:6px;background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/18px 18px;border:2px solid #fff}
.row{display:flex;gap:10px}.row>*{flex:1}
/* character */
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}
.ch{aspect-ratio:1;border-radius:22px;border:4px solid #444;background:#111;font-size:46px;display:grid;place-items:center;cursor:pointer}
.ch.sel{border-color:#fff;background:#222;box-shadow:0 0 0 4px #000,0 0 22px #fffa}
/* levels */
.levels{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lv{position:relative;border-radius:20px;border:4px solid #fff;min-height:118px;padding:10px 12px;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#fff;font:inherit}
.lv .n{font-size:30px;font-weight:1000;line-height:1}
.lv .ic{position:absolute;right:8px;top:6px;font-size:34px}
.lv .nm{font-weight:900;font-size:15px;line-height:1.1;text-shadow:0 1px 3px #000}
.lv .st{font-weight:900;font-size:14px;background:#000a;border-radius:999px;padding:3px 8px;align-self:flex-start}
.lv.lock{filter:grayscale(1) brightness(.45);cursor:default;border-color:#666}
.lv.lock .ic{font-size:30px}
.lv .done{position:absolute;right:10px;bottom:8px;font-size:22px}
/* collections */
.card{border:4px solid #fff;border-radius:22px;padding:16px;background:#0a0a0a}
.big{font-size:44px;font-weight:1000;text-align:center;line-height:1}
.bar{height:16px;border-radius:999px;border:3px solid #fff;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff6fb5,#b26bff)}
.sisters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sis{border-radius:18px;border:3px solid #333;padding:10px 4px;text-align:center;font-weight:900;font-size:13px}
.sis .u{font-size:44px;display:block;margin-bottom:4px}
.sis.no .u{filter:grayscale(1) brightness(.25)}
.toggle{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:18px;padding:8px 0}
.sw{width:64px;height:36px;border-radius:999px;border:3px solid #fff;background:#000;position:relative;cursor:pointer;flex:0 0 64px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:#2ecc71}.sw.on::after{left:31px}
.dev{font:12px ui-monospace,monospace;opacity:.8;white-space:pre-wrap}
/* win */
.winbig{font-size:64px;text-align:center;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) scale(1.05)}}
.rain{background:linear-gradient(90deg,#ff5f6d,#ffc371,#47e891,#3fc5ff,#b26bff,#ff6fb5);-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:300% 100%;animation:sh 2s linear infinite}
@keyframes sh{to{background-position:300% 0}}
.parade{font-size:54px;text-align:center;letter-spacing:6px}
.parade span{display:inline-block;animation:bob 1s ease-in-out infinite}
.parade span:nth-child(2){animation-delay:.15s}.parade span:nth-child(3){animation-delay:.3s}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 74px);transform:translateX(-50%);z-index:8;background:#fff;color:#000;
  font-weight:1000;padding:10px 18px;border-radius:999px;font-size:17px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>

  <div id="hudKeys"></div>
  <div class="pill" id="hudStars">⭐ 0/10</div>
  <button class="ib" id="bRestart" aria-label="Restart level">↺</button>

function partner(ch){const n=+ch;return String(n%2?n+1:n-1)}

function parseLevel(L){
  const H=L.map.length,W=L.map[0].length;
  const g=L.map.map(r=>r.split(''));
  const P={W,H,g,stars:[],keys:[],sister:null,start:null,exits:[],portals:{},hazards:[],markers:[],switches:[]};
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const ch=g[r][c];
    if(ch==='S'){P.start={r,c};g[r][c]='.'}
    else if(ch==='*'){P.stars.push({r,c});g[r][c]='.'}
    else if(ch==='a'||ch==='b'||ch==='c'){P.keys.push({r,c,k:ch});g[r][c]='.'}
    else if(ch==='U'){P.sister={r,c};g[r][c]='.'}
    else if(ch==='M'){P.markers.push({r,c});g[r][c]='.'}
    else if(ch==='z'||ch==='Z'){
      const ax=ch==='z'?'x':'y';
      let lo=ax==='x'?c:r,hi=lo;
      const at=v=>ax==='x'?g[r][v]:(g[v]?g[v][c]:'#');
      while(at(lo-1)!==undefined&&at(lo-1)!=='#')lo--;
      while(at(hi+1)!==undefined&&at(hi+1)!=='#')hi++;
      P.hazards.push({r,c,ax,lo,hi});g[r][c]='.';
    }
    else if(ch==='E')P.exits.push({r,c});
    else if(/[1-8]/.test(ch))P.portals[ch]={r,c};
    else if(ch==='x')P.switches.push({r,c});
  }
  return P;
}

// Solvability check: reachability with keys/switches/portals/one-ways, plus no soft-locks.
function validateLevel(L){
  const P=parseLevel(L),out=[],{W,H,g}=P;
  if(L.map.some(r=>r.length!==W))out.push('ragged rows');
  if(P.stars.length!==10)out.push('stars='+P.stars.length);
  if(!P.start)return out.concat('no start');
  if(!P.exits.length)out.push('no exit');
  for(const d in P.portals)if(!P.portals[partner(d)])out.push('portal '+d+' has no partner');
  let keys=new Set(),sw=false;
  const pass=ch=>ch!=='#'&&!('ABC'.includes(ch)&&!keys.has(ch.toLowerCase()))&&!(ch==='X'&&!sw);
  function bfs(sr,sc){
    const seen=new Set([sr+','+sc]),q=[[sr,sc]];
    while(q.length){
      const[r,c]=q.shift();
      for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){
        let nr=r+dr,nc=c+dc;
        if(nr<0||nc<0||nr>=H||nc>=W)continue;
        const ch=g[nr][nc];
        if(!pass(ch))continue;
        if((ch==='>'&&dc<0)||(ch==='<'&&dc>0)||(ch==='v'&&dr<0)||(ch==='^'&&dr>0))continue;
        if(/[1-8]/.test(ch)){const p=P.portals[partner(ch)];if(!p)continue;nr=p.r;nc=p.c}
        const k=nr+','+nc;if(seen.has(k))continue;seen.add(k);q.push([nr,nc]);
      }
    }
    return seen;
  }
  let seen;
  for(let it=0;it<12;it++){
    seen=bfs(P.start.r,P.start.c);let ch=false;
    for(const k of P.keys)if(seen.has(k.r+','+k.c)&&!keys.has(k.k)){keys.add(k.k);ch=true}
    if(!sw&&P.switches.some(s=>seen.has(s.r+','+s.c))){sw=true;ch=true}
    if(!ch)break;
  }
  const has=o=>seen.has(o.r+','+o.c);
  if(!P.exits.some(has))out.push('exit unreachable');
  P.stars.forEach(s=>{if(!has(s))out.push('star unreachable '+s.r+','+s.c)});
  if(P.sister&&!has(P.sister))out.push('sister unreachable');
  for(const k of seen){const[r,c]=k.split(',').map(Number);if(!P.exits.some(e=>bfs(r,c).has(e.r+','+e.c))){out.push('soft-lock at '+k);break}}
  return out;
}

function cellAt(r,c){return(r<0||c<0||r>=G.P.H||c>=G.P.W)?'#':G.P.g[r][c]}

function openDoor(id,k){G.doors.set(id,G.t);SFX.door();buzz(15);toast('🔓 Door opened!')}
function solidFor(r,c,dx,dy){
  const ch=cellAt(r,c);
  if(ch==='#')return true;
  if(ch==='A'||ch==='B'||ch==='C'){
    const id=r+','+c;if(G.doors.has(id))return false;
    const k=ch.toLowerCase();
    if(G.keys[k]){openDoor(id,k);return false}
    if(!G.bump||G.bump.id!==id||G.t-G.bump.t>.8){G.bump={id,t:G.t};SFX.locked();toast('🔒 Find the '+(k==='a'?'gold':k==='b'?'blue':'pink')+' key!')}
    return true;
  }
  if(ch==='X')return !G.sw;
  if(ch==='>')return dx<0&&G.x>c+.5;
  if(ch==='<')return dx>0&&G.x<c+.5;
  if(ch==='v')return dy<0&&G.y>r+.5;
  if(ch==='^')return dy>0&&G.y<r+.5;
  return false;
}
function hitAt(nx,ny,dx,dy){
  const x0=Math.floor(nx-PH),x1=Math.floor(nx+PH-1e-9),y0=Math.floor(ny-PH),y1=Math.floor(ny+PH-1e-9);
  for(let r=y0;r<=y1;r++)for(let c=x0;c<=x1;c++)if(solidFor(r,c,dx,dy))return{r,c};
  return null;
}
function moveX(d,assist=true){
  if(!d)return;
  const nx=G.x+d,h=hitAt(nx,G.y,d,0);
  if(!h){G.x=nx;return}
  G.x=d>0?Math.max(G.x,Math.min(nx,h.c-PH-1e-6)):Math.min(G.x,Math.max(nx,h.c+1+PH+1e-6));
  if(!assist)return;
  // corner assist: slide toward the nearest opening so turns into corridors feel easy
  const base=Math.floor(G.y)+.5;
  for(const cy of [base,base+(G.y>base?1:-1)]){
    const off=cy-G.y;
    if(Math.abs(off)<.62&&Math.abs(off)>.005&&!hitAt(G.x+Math.sign(d)*.02,cy,d,0)){
      moveY(Math.sign(off)*Math.min(Math.abs(off),Math.abs(d)*1.1),false);break;
    }
  }
}
function moveY(d,assist=true){
  if(!d)return;
  const ny=G.y+d,h=hitAt(G.x,ny,0,d);
  if(!h){G.y=ny;return}
  G.y=d>0?Math.max(G.y,Math.min(ny,h.r-PH-1e-6)):Math.min(G.y,Math.max(ny,h.r+1+PH+1e-6));
  if(!assist)return;
  const base=Math.floor(G.x)+.5;
  for(const cx of [base,base+(G.x>base?1:-1)]){
    const off=cx-G.x;
    if(Math.abs(off)<.62&&Math.abs(off)>.005&&!hitAt(cx,G.y+Math.sign(d)*.02,0,d)){
      moveX(Math.sign(off)*Math.min(Math.abs(off),Math.abs(d)*1.1),false);break;
    }
  }
}
function movePlayer(dx,dy){
  if(!G||G.won||paused)return;
  const n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/.06));
  for(let i=0;i<n;i++){
    moveX(dx/n);moveY(dy/n);
    if(triggers())break;
  }
}

function burst(x,y,n,opt={}){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=(opt.speed||2.2)*(.4+Math.random());
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(opt.up||0),life:opt.life||.7,max:opt.life||.7,
      col:opt.cols?opt.cols[i%opt.cols.length]:'#fff',ch:opt.ch?opt.ch[i%opt.ch.length]:null,sz:opt.sz||.09,g:opt.g||0});
  }
}

function triggers(){

function hazardSolid(r,c){
  const ch=cellAt(r,c);
  if(ch==='#'||ch==='h')return true;

  if(ch==='X')return!G.sw;
  return false;
}
function hit(){
  G.hitT=1.1;SFX.hit();buzz([30,40,30]);burst(G.x,G.y,14,{cols:['#f33','#fff']});
  G.x=G.check.x;G.y=G.check.y;drag.on=false;toast('🏹 Ouch! Watch the arrows');
}
function update(dt){
  G.t+=dt;
  const sp=G.L.speed||2.3;
  for(const h of G.haz){
    if(G.traps)continue;
    const step=h.d*sp*dt;
    if(h.ax==='x'){const nx=h.x+step,lead=Math.floor(nx+h.d*.3);if(hazardSolid(Math.floor(h.y),lead))h.d*=-1;else h.x=nx}
    else{const ny=h.y+step,lead=Math.floor(ny+h.d*.3);if(hazardSolid(lead,Math.floor(h.x)))h.d*=-1;else h.y=ny}
    if(!G.won&&G.hitT<=0&&Math.abs(h.x-G.x)<.5&&Math.abs(h.y-G.y)<.42+(h.ax==='y'?.08:0)&&Math.hypot(h.x-G.x,h.y-G.y)<.58)hit();
  }
  if(G.hitT>0)G.hitT-=dt;
  // checkpoint whenever the player stands clear of every arrow lane
  G.checkT+=dt;
  if(G.checkT>.35&&G.hitT<=0&&!G.lock){
    G.checkT=0;
    const safe=G.traps||G.haz.every(h=>h.ax==='x'?(Math.abs(G.y-(h.r+.5))>.95||G.x<h.lo-.5||G.x>h.hi+1.5):(Math.abs(G.x-(h.c+.5))>.95||G.y<h.lo-.5||G.y>h.hi+1.5));
    if(safe)G.check={x:G.x,y:G.y};
  }
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy=p.vy*.96+p.g*dt;p.life-=dt}
  G.parts=G.parts.filter(p=>p.life>0);
  if(G.won&&G.t-G.winT<.9&&Math.random()<.5)burst(G.x+(Math.random()-.5)*4,G.y-2,2,{cols:['#ff5f6d','#ffc371','#47e891','#3fc5ff','#b26bff','#fff'],g:6,speed:1.5,life:1.4,sz:.12});
}

function win(){
  if(G.won)return;
  G.won=true;G.winT=G.t;drag.on=false;
  const i=G.i,n=G.got.size;
  save.best[i]=Math.max(save.best[i]|0,n);save.completed[i]=true;save.unlocked=Math.max(save.unlocked,Math.min(10,i+2));persist();

  burst(G.x,G.y,10,{ch:['⭐','🎉','✨'],sz:.5,speed:3,life:1.2});
  setTimeout(showWin,1100);

function layout(){

  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);cv.style.width=vw+'px';cv.style.height=vh+'px';

  // secret passages
  for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(P.g[r][c]==='h'){
    if(G.disc.has(r+','+c)){ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(c,r,1,1);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=.04;ctx.setLineDash([.1,.1]);ctx.strokeRect(c+.04,r+.04,.92,.92);ctx.setLineDash([])}
    else{ctx.fillStyle='#fff';ctx.fillRect(c-.01,r-.01,1.02,1.02);if(!hc){ctx.strokeStyle='rgba(120,120,140,.35)';ctx.lineWidth=.03;ctx.beginPath();ctx.moveTo(c+.3,r+.2);ctx.lineTo(c+.45,r+.45);ctx.lineTo(c+.38,r+.62);ctx.moveTo(c+.45,r+.45);ctx.lineTo(c+.65,r+.55);ctx.stroke()}}
  }
  // doors and gates
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const ch=P.g[r][c];
    if('ABC'.includes(ch)){
      const id=r+','+c,ot=G.doors.get(id);let a=1,s=1;
      if(ot!==undefined){const k=(t-ot)/.45;if(k>=1)continue;a=1-k;s=1-k*.6}
      let sh=0;if(G.bump&&G.bump.id===id&&t-G.bump.t<.35)sh=Math.sin(t*80)*.06;
      ctx.save();ctx.globalAlpha=a;ctx.translate(c+.5+sh,r+.5);ctx.scale(s,s);
      ctx.fillStyle=KEYCOL[ch.toLowerCase()];ctx.fillRect(-.5,-.5,1,1);
      ctx.strokeStyle='#fff';ctx.lineWidth=.1;ctx.strokeRect(-.44,-.44,.88,.88);
      ctx.restore();em('🔒',c+.5+sh,r+.5,.62,a);
    }else if(ch==='X'){
      let a=1;if(G.sw){const k=(t-G.swT)/.6;if(k>=1)continue;a=1-k}
      ctx.save();ctx.globalAlpha=a;ctx.fillStyle=hc?'#888':(th.gate||'rgba(150,90,255,.9)');ctx.fillRect(c,r,1,1);
      ctx.fillStyle='#fff';const off=G.sw?(t-G.swT)*1.2:0;for(let k=0;k<4;k++)ctx.fillRect(c+.08+k*.26,r-off,.1,1);ctx.restore();
    }
  }
  // collectibles
  P.stars.forEach((s,i)=>{if(!G.got.has(i))em('⭐',s.c+.5,s.r+.5+Math.sin(t*3+i)*.05,.72)});
  P.keys.forEach((k,i)=>{if(!G.keyGot.has(i)){glow(k.c+.5,k.r+.5,.75,KEYCOL[k.k]+'aa');em('🔑',k.c+.5,k.r+.5+Math.sin(t*2.5)*.05,.72)}});
  P.markers.forEach(m=>em(G.L.marker||'✨',m.c+.5,m.r+.5,.82));
  if(P.sister){
    const si=G.L.sister,S=P.sister,col=SIS[si].col,x=S.c+.5,y=S.r+.5;
    if(!save.sisters[si]){
      glow(x,y,1.1,col+'aa');
      for(let k=0;k<6;k++){const a=t*2+k*Math.PI/3;ctx.fillStyle=k%2?'#fff':col;ctx.beginPath();ctx.arc(x+Math.cos(a)*.42,y+Math.sin(a)*.42,.05,0,7);ctx.fill()}
      em('🦄',x,y+Math.sin(t*2)*.05,.85);
    }else if(!G.sis)em('🦄',x,y,.6,.18);
  }
  // exit flag
  if(P.exits.length){const e=P.exits[0];em('🏁',e.c+.5,e.r+.5-.15+Math.sin(t*3)*.06,.55)}
  // hazards
  for(const h of G.haz){
    const dir=h.ax==='x'?(h.d>0?0:Math.PI):(h.d>0?Math.PI/2:-Math.PI/2);
    if(G.traps){ctx.globalAlpha=.25;arrowShape(h.x,h.y,dir,.75,'#aaa');ctx.globalAlpha=1;continue}
    glow(h.x,h.y,.6,'rgba(255,40,40,.45)');arrowShape(h.x,h.y,dir,.8,'#ff3b3b');
  }
  // player
  const blink=G.hitT>0&&Math.floor(G.hitT*12)%2===0;
  if(!blink){
    glow(G.x,G.y,.85,G.hitT>0?'rgba(255,60,60,.5)':'rgba(255,255,255,.28)');
    ctx.strokeStyle=hc?'#ff0':'rgba(255,255,255,.75)';ctx.lineWidth=.06;ctx.beginPath();ctx.arc(G.x,G.y,.47,0,7);ctx.stroke();
    em(save.char,G.x,G.y,.92);
  }
  // particles
  for(const p of G.parts){
    const a=Math.max(0,p.life/p.max);
    if(p.ch)em(p.ch,p.x,p.y,p.sz,a);else{ctx.globalAlpha=a;ctx.fillStyle=p.col;ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);ctx.globalAlpha=1}
  }
  ctx.restore();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G&&!paused)update(dt);
  render();requestAnimationFrame(loop);
}

// ───────────────────────── INPUT ─────────────────────────
cv.addEventListener('pointerdown',e=>{
  if(!G||paused||G.won)return;
  ac();drag.on=true;drag.id=e.pointerId;drag.x=e.clientX;drag.y=e.clientY;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  if(!drag.on||e.pointerId!==drag.id)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of (evs.length?evs:[e])){
    const dsx=ev.clientX-drag.x,dsy=ev.clientY-drag.y;drag.x=ev.clientX;drag.y=ev.clientY;
    if(!drag.on)break;
    if(rot)movePlayer(dsy/cs,-dsx/cs);else movePlayer(dsx/cs,dsy/cs);
  }
  e.preventDefault();
});
const endDrag=e=>{if(e.pointerId===drag.id)drag.on=false};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);cv.addEventListener('lostpointercapture',endDrag);
document.addEventListener('touchmove',e=>{if(G&&!paused&&!e.target.closest('.screen'))e.preventDefault()},{passive:false});
['gesturestart','gesturechange','dblclick','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
window.addEventListener('resize',()=>{layout()});
window.addEventListener('orientationchange',()=>setTimeout(layout,250));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.won&&!paused)pause()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&G&&!G.won){paused?resume():pause()}});

// ───────────────────────── UI ─────────────────────────
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
}
function toMenu(){G=null;paused=false;$('#hud').classList.remove('on');$('#mCharE').textContent=save.char;showScreen('sMenu')}
function updHud(){
  if(!G)return;
  $('#hudNum').textContent='LEVEL '+(G.i+1);$('#hudName').textContent=G.L.name;
  $('#hudStars').textContent='⭐ '+G.got.size+'/10';
  $('#hudKeys').innerHTML=Object.keys(G.keys).map(k=>`<i style="border-color:${KEYCOL[k]}">🔑</i>`).join('');
}
function pause(){if(!G||G.won)return;paused=true;drag.on=false;syncToggles();showScreen('sPause')}
function resume(){paused=false;showScreen(null)}

function play(){
  if(!save.chosen){buildChars(true);showScreen('sChars');return}
  const n=unlockedCount();
  for(let i=0;i<n;i++)if(!save.completed[i]){startLevel(i);return}
  buildLevels();showScreen('sLevels');
}
let charThenPlay=false;
function buildChars(thenPlay){
  charThenPlay=thenPlay;
  $('#charGrid').innerHTML=CHARS.map(c=>`<button class="ch${c===save.char?' sel':''}" data-c="${c}">${c}</button>`).join('');
}
$('#charGrid').addEventListener('click',e=>{
  const b=e.target.closest('.ch');if(!b)return;
  save.char=b.dataset.c;save.chosen=true;persist();
  document.querySelectorAll('.ch').forEach(x=>x.classList.toggle('sel',x===b));tone(660+CHARS.indexOf(save.char)*60,.12,'triangle',.1);
});
$('#cGo').onclick=()=>{save.chosen=true;persist();if(charThenPlay)play();else toMenu()};
$('#cBack').onclick=toMenu;

const LVBG=['linear-gradient(135deg,#222,#000)','linear-gradient(135deg,#2f7a3a,#123d1a)','linear-gradient(135deg,#7a2f55,#2a1450)',
  'linear-gradient(135deg,#0c1a4a,#02030b)','linear-gradient(135deg,#1d3c8a,#081028)','linear-gradient(135deg,#a8306f,#2a0b38)',
  'linear-gradient(135deg,#8a1414,#160808)','linear-gradient(135deg,#9a7414,#1a1206)','repeating-linear-gradient(45deg,#000 0 10px,#222 10px 20px)',
  'linear-gradient(135deg,#ff3df2,#3fc5ff,#47e891)'];
function buildLevels(){
  const n=unlockedCount();
  $('#lvGrid').innerHTML=LEVELS.map((L,i)=>{
    const lock=i>=n,b=save.best[i]|0;
    return`<button class="lv${lock?' lock':''}" data-i="${i}" style="background:${LVBG[i]}">
      <span class="ic">${lock?'🔒':L.icon}</span><span class="n">${i+1}</span>
      <span class="nm">${L.name}</span><span class="st">⭐ ${b}/10</span>${save.completed[i]?'<span class="done">✅</span>':''}</button>`;
  }).join('');
}
$('#lvGrid').addEventListener('click',e=>{const b=e.target.closest('.lv');if(!b||b.classList.contains('lock'))return;startLevel(+b.dataset.i)});
$('#lBack').onclick=()=>{if(G&&paused){showScreen('sPause')}else toMenu()};

function buildCollect(){
  const n=totalStars();
  $('#colStars').textContent='⭐ '+n+' / 100';$('#colBar').style.width=n+'%';
  $('#colSis').innerHTML=SIS.map((s,i)=>`<div class="sis${save.sisters[i]?'':' no'}" style="border-color:${save.sisters[i]?s.col:'#333'};${save.sisters[i]?`box-shadow:0 0 18px ${s.col}88`:''}">
    <span class="u" style="${save.sisters[i]?`filter:drop-shadow(0 0 10px ${s.col})`:''}">🦄</span>${save.sisters[i]?s.name.toUpperCase():'???'}</div>`).join('');
  syncToggles();
  $('#devInfo').textContent=DEV?'DEV MODE · all levels unlocked\n'+VALID.map((v,i)=>'L'+(i+1)+': '+(v.length?v.join('; '):'OK')).join('\n'):'';
}
function syncToggles(){['#tHC','#pHC'].forEach(s=>$(s).classList.toggle('on',save.hc));['#tSnd','#pSnd'].forEach(s=>$(s).classList.toggle('on',save.sound))}
['#tHC','#pHC'].forEach(s=>$(s).onclick=()=>{save.hc=!save.hc;persist();syncToggles()});
['#tSnd','#pSnd'].forEach(s=>$(s).onclick=()=>{save.sound=!save.sound;persist();syncToggles();if(save.sound)SFX.star()});
$('#bReset').onclick=()=>{
  if(!confirm('Reset all progress? Stars, levels and unicorn sisters will be cleared.'))return;
  const keep={char:save.char,hc:save.hc,sound:save.sound};
  try{localStorage.removeItem(SKEY)}catch(e){}
  save=load();Object.assign(save,keep);persist();buildCollect();toast('Progress reset');
};
$('#colBack').onclick=toMenu;

$('#mPlay').onclick=()=>{ac();play()};
$('#mChar').onclick=()=>{buildChars(false);showScreen('sChars')};
$('#mLevels').onclick=()=>{buildLevels();showScreen('sLevels')};
$('#mCollect').onclick=()=>{buildCollect();showScreen('sCollect')};
$('#bPause').onclick=pause;
$('#bRestart').onclick=()=>{if(G&&!G.won)startLevel(G.i)};
$('#pResume').onclick=resume;
$('#pRestart').onclick=()=>startLevel(G.i);
$('#pLevels').onclick=()=>{buildLevels();showScreen('sLevels')};
$('#pMenu').onclick=toMenu;

function showWin(){
  if(!G||!G.won)return;
  const i=G.i,n=G.got.size,best=save.best[i]|0,final=i===9,all=save.sisters.every(Boolean);
  let h='';
  if(final&&all){
    h+=`<div class="parade"><span>🦄</span><span>🦄</span><span>🦄</span></div>
      <h2 class="rain" style="font-size:34px">THE SISTERS ARE FREE!</h2>
      <p class="sub">You escaped the castle with all three unicorn sisters. Legendary!</p>`;
  }else if(final){
    h+=`<div class="winbig">🏰</div><h2>YOU ESCAPED<br>THE CASTLE!</h2>
      <p class="sub">${save.sisters.filter(Boolean).length} of 3 unicorn sisters found. Some are still hiding behind secret walls…</p>`;
  }else{
    h+=`<div class="winbig">${n===10?'🌟':'🎉'}</div><h2>LEVEL ${i+1} DONE!</h2>`;
  }
  h+=`<div class="card"><div class="big">⭐ ${n} / 10</div>
    <p class="sub" style="margin-top:8px">${n===10?'Every star found!':best>n?'Best: '+best+' / 10':'Explore dead ends for more stars'}</p></div>`;
  if(G.sis)h+=`<div class="card" style="border-color:${SIS[G.L.sister].col};text-align:center;font-weight:900">🦄 ${SIS[G.L.sister].name.toUpperCase()} SISTER RESCUED!</div>`;
  h+=final?`<button class="btn" id="wMenu">🏆 COLLECTIONS</button>`:`<button class="btn" id="wNext">NEXT LEVEL ▶</button>`;
  h+=`<div class="row"><button class="btn alt sm" id="wAgain">↺ AGAIN</button><button class="btn alt sm" id="wLevels">LEVELS</button></div>`;
  $('#winBody').innerHTML=h;showScreen('sWin');
  if(final&&all)SFX.sis();
  const nx=$('#wNext');if(nx)nx.onclick=()=>startLevel(i+1);
  const wm=$('#wMenu');if(wm)wm.onclick=()=>{G=null;$('#hud').classList.remove('on');buildCollect();showScreen('sCollect')};
  $('#wAgain').onclick=()=>startLevel(i);
  $('#wLevels').onclick=()=>{G=null;$('#hud').classList.remove('on');buildLevels();showScreen('sLevels')};
}

// ───────────────────────── BOOT ─────────────────────────
function showSplash(){
  G=null;$('#hud').classList.remove('on');showScreen('sSplash');
  const sp=$('#sSplash');let done=false;
  sp.onclick=()=>{if(done)return;done=true;ac();SFX.win();buzz(20);sp.classList.add('out');
    setTimeout(()=>{sp.classList.remove('out');toMenu()},450)};
}
layout();showSplash();requestAnimationFrame(loop);
window.castleMaze={validate:()=>VALID,reset:()=>{localStorage.removeItem(SKEY);location.reload()},unlockAll:()=>{save.unlocked=10;persist();toast('All levels unlocked')}};
})();
