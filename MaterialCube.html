<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Material Cube (Gyro + Swipe)</title>
<style>
  :root { --bg:#000; }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;}
  canvas{display:block;width:100vw;height:100vh;}
  #gate{position:fixed; inset:0; background:#000; z-index:5;}
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="cv"></canvas>
<div id="gate"></div>
<script>
(()=>{
  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d', {alpha:false});
  let W=0,H=0,DPR=Math.max(1,devicePixelRatio||1);
  function resize(){ W=Math.floor(innerWidth*DPR); H=Math.floor(innerHeight*DPR); canvas.width=W; canvas.height=H; }
  addEventListener('resize', resize, {passive:true}); resize();

  // ---- Math / 3D ----
  const TAU=Math.PI*2;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;
  function rotMat(rx,ry,rz){
    const sx=Math.sin(rx), cx=Math.cos(rx);
    const sy=Math.sin(ry), cy=Math.cos(ry);
    const sz=Math.sin(rz), cz=Math.cos(rz);
    return [
      cy*cz, cz*sx*sy - cx*sz, sx*sz + cx*cz*sy,
      cy*sz, cx*cz + sx*sy*sz, cx*sy*sz - cz*sx,
      -sy,   cy*sx,            cx*cy
    ];
  }
  const mul = (m,[x,y,z]) => [ m[0]*x + m[1]*y + m[2]*z, m[3]*x + m[4]*y + m[5]*z, m[6]*x + m[7]*y + m[8]*z ];
  function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
  function cross(a,b){return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];}
  function norm(v){const d=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/d,v[1]/d,v[2]/d];}
  function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
  function project([x,y,z]){ const f=560*DPR; const Z=z+4.0; const s=f/Z; return [x*s, y*s, Z]; }

  // --- Cube mesh ---
  function buildCube(s=1.8){
    const h=s/2;
    const V=[
      [-h,-h,-h],[ h,-h,-h],[ h, h,-h],[-h, h,-h], // back
      [-h,-h, h],[ h,-h, h],[ h, h, h],[-h, h, h]  // front
    ];
    const F=[
      [0,1,2,3], // back
      [4,5,6,7], // front
      [0,1,5,4], // bottom
      [2,3,7,6], // top
      [1,2,6,5], // right
      [0,3,7,4], // left
    ];
    return {V,F};
  }
  let mesh = buildCube();

  // ---- Controls: motion + swipe inertia ----
  let rx=0, ry=0, rz=0;
  let baseRX=0, baseRY=0, baseRZ=0;
  let sx=0, sy=0, sz=0;
  let wx=0, wy=0, wz=0;
  const DAMP = 0.988;
  const MAX_W = 0.09;
  let motionActive=false;

  function onOrientation(e){
    const beta = e.beta ?? 0, gamma = e.gamma ?? 0, alpha = e.alpha ?? 0;
    baseRX = clamp(beta,-85,85) * Math.PI/180 * 0.9;
    baseRY = clamp(gamma,-75,75) * Math.PI/180 * 1.0;
    const a = ((alpha+540)%360)-180;
    baseRZ = clamp(a,-90,90) * Math.PI/180 * 0.35;
    motionActive = true;
  }
  async function unlock(){
    try{
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function'){
        try{ await DeviceOrientationEvent.requestPermission(); }catch(e){}
      }
      if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function'){
        try{ await DeviceMotionEvent.requestPermission(); }catch(e){}
      }
    } finally {
      window.addEventListener('deviceorientation', onOrientation, true);
      gate.remove();
    }
  }
  const gate = document.getElementById('gate');
  gate.addEventListener('pointerdown', unlock, {passive:true});

  let dragging=false, last={x:0,y:0}, lastT=0;
  function pd(e){ dragging=true; const p=e.touches?e.touches[0]:e; last.x=p.clientX; last.y=p.clientY; lastT=performance.now(); }
  function pm(e){
    if(!dragging) return;
    const p=e.touches?e.touches[0]:e;
    const t=performance.now(), dt=Math.max(1, t-lastT);
    const dx=(p.clientX-last.x), dy=(p.clientY-last.y);
    const k = 0.003;
    wy = clamp(wy + dx * k, -MAX_W, MAX_W);
    wx = clamp(wx + dy * k, -MAX_W, MAX_W);
    last.x=p.clientX; last.y=p.clientY; lastT=t;
  }
  function pu(){ dragging=false; }
  addEventListener('pointerdown', pd, {passive:true});
  addEventListener('pointermove', pm, {passive:true});
  addEventListener('pointerup', pu, {passive:true});
  addEventListener('pointercancel', pu, {passive:true});

  // ---- Procedural textures ----
  function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
  function perlin(ctx,w,h,scale=80,oct=3){
    // simple value noise
    const g=[]; const cols=Math.ceil(w/scale)+2, rows=Math.ceil(h/scale)+2;
    for(let y=0;y<rows;y++){ g[y]=[]; for(let x=0;x<cols;x++){ g[y][x]=Math.random(); } }
    const img=ctx.createImageData(w,h); const d=img.data;
    function smooth(t){ return t*t*(3-2*t); }
    for(let y=0;y<h;y++){
      const gy=y/scale; const y0=Math.floor(gy), v= smooth(gy-y0);
      for(let x=0;x<w;x++){
        const gx=x/scale; const x0=Math.floor(gx), u= smooth(gx-x0);
        const a=g[y0][x0], b=g[y0][x0+1], c=g[y0+1][x0], d0=g[y0+1][x0+1];
        const val = lerp(lerp(a,b,u), lerp(c,d0,u), v);
        const idx=(y*w+x)*4; const gval=Math.floor(val*255);
        d[idx]=d[idx+1]=d[idx+2]=gval; d[idx+3]=255;
      }
    }
    ctx.putImageData(img,0,0);
  }

  function tex_fuzzyIce(size=256){
    const c=makeCanvas(size,size), g=c.getContext('2d');
    g.fillStyle = '#cfe9ff'; g.fillRect(0,0,size,size);
    perlin(g,size,size, 40, 3);
    g.globalCompositeOperation='overlay';
    g.fillStyle='#e8f6ff'; g.fillRect(0,0,size,size);
    g.globalCompositeOperation='multiply';
    g.fillStyle='#a8c9e0aa'; g.fillRect(0,0,size,size);
    return c;
  }
  function tex_wood(size=256){
    const c=makeCanvas(size,size), g=c.getContext('2d');
    g.fillStyle='#4a2e14'; g.fillRect(0,0,size,size);
    // rings
    for(let y=0;y<size;y++){
      for(let x=0;x<size;x++){
        const dx=x-size/2, dy=y-size/2;
        const r=Math.sqrt(dx*dx+dy*dy);
        const v = (Math.sin(r*0.15 + Math.sin(y*0.05)*0.6)+1)/2;
        const col = Math.floor(lerp(60,120,v));
        g.fillStyle = `rgb(${col+60},${col},${col-10})`;
        g.fillRect(x,y,1,1);
      }
    }
    // fine grain
    g.globalAlpha=0.15;
    for(let i=0;i<6000;i++){
      g.fillStyle='rgba(0,0,0,0.4)';
      g.fillRect(Math.random()*size, Math.random()*size, 1, 1);
    }
    return c;
  }
  function tex_chipped(size=256){
    const c=makeCanvas(size,size), g=c.getContext('2d');
    g.fillStyle='#666'; g.fillRect(0,0,size,size);
    // paint base
    g.fillStyle='#b0b0b0'; g.globalAlpha=0.9; g.fillRect(0,0,size,size);
    // chips
    g.globalAlpha=1;
    for(let i=0;i<800;i++){
      const x=Math.random()*size, y=Math.random()*size, r=Math.random()*3+0.5;
      g.fillStyle = Math.random()<0.5 ? '#333' : '#ddd';
      g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
    }
    // scratches
    g.strokeStyle='rgba(255,255,255,0.2)'; g.lineWidth=1;
    for(let i=0;i<60;i++){
      g.beginPath();
      const x=Math.random()*size, y=Math.random()*size;
      g.moveTo(x,y); g.lineTo(x+Math.random()*20-10, y+Math.random()*20-10); g.stroke();
    }
    return c;
  }
  function tex_oily(size=256){
    const c=makeCanvas(size,size), g=c.getContext('2d');
    for(let y=0;y<size;y++){
      const t=y/size;
      const hue = (200 + 160*Math.sin(t*10))%360;
      g.fillStyle = `hsl(${hue} 90% ${lerp(30,70, (Math.sin(t*20)+1)/2)}%)`;
      g.fillRect(0,y,size,1);
    }
    // swirl overlay
    g.globalCompositeOperation='overlay';
    for(let i=0;i<2000;i++){
      g.fillStyle=`hsla(${(i*7)%360} 100% 60% / 0.15)`;
      g.beginPath();
      const x=Math.random()*size, y=Math.random()*size, r=1+Math.random()*2;
      g.arc(x,y,r,0,TAU); g.fill();
    }
    return c;
  }
  function tex_metalLiquid(size=256){
    const c=makeCanvas(size,size), g=c.getContext('2d');
    // vertical bright horizon band
    for(let y=0;y<size;y++){
      const yy = (y/size - 0.5);
      const v = Math.exp(-Math.pow(yy/0.12,2))*1.5 + Math.exp(-Math.pow((yy-0.35)/0.3,2))*0.4 + Math.exp(-Math.pow((yy+0.35)/0.3,2))*0.4;
      const col = Math.floor(lerp(40,255, Math.min(1,v)));
      g.fillStyle = `rgb(${col},${col},${col})`;
      g.fillRect(0,y,size,1);
    }
    // ripples
    g.globalAlpha=0.2;
    g.fillStyle='#fff';
    for(let i=0;i<400;i++){
      g.beginPath();
      const x=Math.random()*size, y=Math.random()*size, w=10+Math.random()*40, h=2+Math.random()*6;
      g.ellipse(x,y,w,h, Math.random()*Math.PI, 0, TAU); g.fill();
    }
    return c;
  }
  const MATERIALS = [
    {name:'chrome',     tex: tex_metalLiquid},
    {name:'oily',       tex: tex_oily},
    {name:'fuzzyIce',   tex: tex_fuzzyIce},
    {name:'chipped',    tex: tex_chipped},
    {name:'wood',       tex: tex_wood},
    {name:'metalLiquid',tex: tex_metalLiquid}
  ];
  let matIndex = 0;
  let texCache = new Map();
  function getTex(idx){
    if (!texCache.has(idx)){
      texCache.set(idx, MATERIALS[idx].tex(256));
    }
    return texCache.get(idx);
  }
  setInterval(()=>{ matIndex = (matIndex+1)%MATERIALS.length; }, 6000);
  // double-tap to advance immediately
  let lastTap=0;
  addEventListener('pointerdown', e=>{
    const t=performance.now();
    if (t-lastTap<300){ matIndex=(matIndex+1)%MATERIALS.length; }
    lastTap=t;
  }, {passive:true});

  // --- Shading helpers ---
  const view = [0,0,1];
  const light = norm([0.6,0.55,0.7]);
  function faceShade(n, baseColor){
    // lambert
    const nl = Math.max(0, dot(n, light));
    // Fresnel rim
    const nv = Math.abs(dot(n, view));
    const fres = 0.1 + Math.pow(1-nv, 3) * 0.6;
    // combine as multiplier
    const m = 0.35 + nl*0.65 + fres*0.2;
    return m;
  }

  // --- Render ---
  function render(){
    // inertia
    sx += wx; sy += wy; sz += wz;
    wx *= DAMP; wy *= DAMP; wz *= DAMP;
    if (!motionActive){ baseRX += 0.0027; baseRY += 0.002; }

    const RX = baseRX + sx, RY = baseRY + sy, RZ = baseRZ + sz;
    rx += (RX - rx) * 0.12; ry += (RY - ry) * 0.12; rz += (RZ - rz) * 0.12;

    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.translate(W/2, H/2);

    const R = rotMat(rx,ry,rz);
    const TV = mesh.V.map(v => project(mul(R, v)));
    const faces = mesh.F.map(ids => {
      const v0=mul(R, mesh.V[ids[0]]), v1=mul(R, mesh.V[ids[1]]), v2=mul(R, mesh.V[ids[2]]);
      const n = norm(cross(sub(v1,v0), sub(v2,v0)));
      const depth = (v0[2]+v1[2]+v2[2])/3;
      const P = ids.map(i => TV[i]);
      return {P, n, depth};
    });
    faces.sort((a,b)=> b.depth - a.depth);

    // texture
    const tex = getTex(matIndex);
    const pat = ctx.createPattern(tex, 'repeat');

    // draw
    for(const f of faces){
      const P=f.P, n=f.n;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(P[0][0], P[0][1]);
      for(let k=1;k<P.length;k++) ctx.lineTo(P[k][0], P[k][1]);
      ctx.closePath();
      ctx.clip();

      // Orient texture differently per face for variety
      const ang = Math.atan2(n[1], n[0]);
      ctx.translate((P[0][0]+P[2][0])/2, (P[0][1]+P[2][1])/2);
      ctx.rotate(ang);
      ctx.scale(DPR, DPR);
      ctx.translate(-W/(2*DPR), -H/(2*DPR));

      ctx.fillStyle = pat;
      ctx.globalAlpha = 1.0;
      ctx.fillRect(0,0,W,H);

      ctx.restore();

      // lighting overlay for smoothness
      const m = faceShade(n);
      ctx.beginPath();
      ctx.moveTo(P[0][0], P[0][1]); for(let k=1;k<P.length;k++) ctx.lineTo(P[k][0], P[k][1]);
      ctx.closePath();
      ctx.fillStyle = `rgba(255,255,255,${0.25*m})`;
      ctx.fill();

      // crisp edge line (very subtle to keep faces smooth)
      ctx.lineWidth = 1.0 * DPR;
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.stroke();
    }

    ctx.restore();
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
