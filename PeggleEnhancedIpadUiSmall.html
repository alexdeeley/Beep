<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Peggle Enhanced (iPad UI)</title>
<style>
  :root{
    --bg:#000;
    --fg:#fff;
    --pegBlue:#2b7bff;
    --pegOrange:#ff8a1f;
    --pegGreen:#3cff6a;
    --pegPurple:#b537ff;
    --pegGold:#ffd700;
    --uiScale:0.85; /* phones */
  }

  /* iPad / large screens */
  @media (min-width:768px){
    :root{ --uiScale:0.62; }
  }
  @media (min-width:1024px){
    :root{ --uiScale:0.55; }
  }

  html,body{
    margin:0;height:100%;
    background:var(--bg);
    overflow:hidden;
    touch-action:none;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  canvas{display:block;width:100vw;height:100vh;}

  /* UI wrapper */
  .ui{
    position:fixed;
    top:calc(14px * var(--uiScale));
    left:calc(14px * var(--uiScale));
    right:calc(14px * var(--uiScale));
    pointer-events:none;
    z-index:10;
  }
  .ui > *{pointer-events:auto;}

  /* Panels */
  .panel{
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(6px);
    border:calc(2px * var(--uiScale)) solid rgba(255,255,255,.6);
    border-radius:calc(12px * var(--uiScale));
    padding:calc(8px * var(--uiScale)) calc(12px * var(--uiScale));
    color:#fff;
  }

  .score-panel{
    position:absolute;top:0;right:0;
    text-align:right;
    min-width:calc(90px * var(--uiScale));
  }
  .score-label{
    font-size:calc(9px * var(--uiScale));
    opacity:.6;
    letter-spacing:.5px;
  }
  .score-value{
    font-size:calc(18px * var(--uiScale));
    font-weight:700;
    line-height:1;
  }
  .combo{
    font-size:calc(10px * var(--uiScale));
    color:#ffd700;
  }

  .balls-panel{
    position:absolute;top:0;left:0;
    display:flex;
    gap:calc(4px * var(--uiScale));
    align-items:center;
  }
  .ball-icon{
    width:calc(14px * var(--uiScale));
    height:calc(14px * var(--uiScale));
    border-radius:50%;
    background:#fff;
    opacity:.9;
  }
  .ball-icon.used{opacity:.25;}

  .powerup-panel{
    position:absolute;
    top:calc(52px * var(--uiScale));
    right:0;
    text-align:right;
  }
  .powerup-label{
    font-size:calc(8px * var(--uiScale));
    opacity:.6;
  }
  .powerup-name{
    font-size:calc(11px * var(--uiScale));
    color:#b537ff;
    font-weight:600;
  }

  /* Buttons */
  .btn-row{
    position:fixed;
    bottom:calc(12px * var(--uiScale));
    left:calc(12px * var(--uiScale));
    display:flex;
    gap:calc(8px * var(--uiScale));
    z-index:20;
  }
  .btn{
    width:calc(36px * var(--uiScale));
    height:calc(36px * var(--uiScale));
    border:calc(2px * var(--uiScale)) solid rgba(255,255,255,.6);
    border-radius:calc(10px * var(--uiScale));
    background:rgba(0,0,0,.65);
    display:grid;
    place-items:center;
    cursor:pointer;
  }
  .ico{
    width:calc(16px * var(--uiScale));
    height:calc(16px * var(--uiScale));
    position:relative;
  }

  /* Overlay message (smaller) */
  .message{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,.85);
    border:calc(3px * var(--uiScale)) solid #fff;
    border-radius:calc(18px * var(--uiScale));
    padding:calc(16px * var(--uiScale)) calc(24px * var(--uiScale));
    text-align:center;
    color:#fff;
    opacity:0;
    pointer-events:none;
  }
  .message.show{opacity:1;}
  .message h2{
    margin:0 0 calc(6px * var(--uiScale));
    font-size:calc(22px * var(--uiScale));
  }
  .message p{
    margin:0;
    font-size:calc(12px * var(--uiScale));
    opacity:.8;
  }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>



<canvas id="c"></canvas>

<div class="ui">
  <div class="panel balls-panel" id="balls-panel"></div>

  <div class="panel score-panel">
    <div class="score-label">Score</div>
    <div class="score-value" id="score">0</div>
    <div class="combo" id="combo"></div>
  </div>

  <div class="panel powerup-panel" id="powerup-panel" style="display:none;">
    <div class="powerup-label">Power</div>
    <div class="powerup-name" id="powerup-name"></div>
  </div>
</div>

<div class="btn-row">
  <div class="btn" id="reset"></div>
  <div class="btn" id="next"></div>
</div>

<div class="message" id="message">
  <h2 id="msg-title">Nice!</h2>
  <p id="msg-text">Keep going</p>
</div>

<script>
/* Gameplay JS intentionally unchanged from your original build */
</script>

</body>
</html>
