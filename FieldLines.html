<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Field Lines</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }
  body {
    cursor: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
const SPEED = 2.8;
let fields = [];

const FIELD_RADIUS = 180;
const FIELD_STRENGTH = 80;
const FIELD_LIFETIME = 30000;

// Per-column offsets
let colOffsets = [];

function getCELL() {
  return W / 20;
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  colOffsets = new Array(22).fill(0);
}

function addField(x, y) {
  fields.push({
    x,
    y,
    radius: FIELD_RADIUS,
    strength: FIELD_STRENGTH,
    born: performance.now()
  });
}

function getDisplacement(wx, wy) {
  let dy = 0;
  const now = performance.now();

  for (const f of fields) {
    const age = now - f.born;
    const lifetime = f.field_lifetime_override || FIELD_LIFETIME;
    const life = Math.max(0, 1 - age / lifetime);

    if (life <= 0) continue;

    const dx = wx - f.x;
    const ddy = wy - f.y;
    const dist = Math.sqrt(dx * dx + ddy * ddy);

    if (dist < f.radius) {
      const t = 1 - dist / f.radius;
      const push = f.strength * t * t * (3 - 2 * t) * life;
      const angle = Math.atan2(ddy, dx);
      dy += Math.sin(angle) * push;
    }
  }

  return dy;
}

let last = 0;

function draw(ts) {
  if (!last) last = ts;
  const dt = Math.min(ts - last, 32);
  last = ts;

  const now = performance.now();
  fields = fields.filter(f => now - f.born < FIELD_LIFETIME);

  const CELL = getCELL();
  const centerCol = 10;
  const cols = 22;

  for (let col = 0; col < cols; col++) {
    const distFromCenter = Math.abs((col - 1) - centerCol);
    const speedMult = Math.pow(0.99, distFromCenter);
    colOffsets[col] -= SPEED * speedMult * (dt / 16.667);

    if (colOffsets[col] <= -CELL * 2) {
      colOffsets[col] += CELL * 2;
    }
  }

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);

  const rows = Math.ceil(H / CELL) + 6;

  for (let ci = 0; ci < cols; ci++) {
    const col = ci - 1;
    const colOff = colOffsets[ci];

    for (let row = -3; row < rows; row++) {
      const parity = (row + col) % 2;
      const isBlack = ((parity % 2) + 2) % 2 === 0;

      const bx = col * CELL;
      const by = row * CELL + colOff;

      const corners = [
        [bx, by],
        [bx + CELL, by],
        [bx + CELL, by + CELL],
        [bx, by + CELL]
      ];

      const pts = corners.map(([cx, cy]) => {
        const dy = getDisplacement(cx, cy);
        return [cx, cy + dy];
      });

      ctx.fillStyle = isBlack ? "#111111" : "#ffffff";
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      ctx.lineTo(pts[1][0], pts[1][1]);
      ctx.lineTo(pts[2][0], pts[2][1]);
      ctx.lineTo(pts[3][0], pts[3][1]);
      ctx.closePath();
      ctx.fill();
    }
  }

  requestAnimationFrame(draw);
}

function handleStart(x, y) {
  addField(x, y);
}

function handleMove(x, y) {
  if (Math.random() < 0.25) {
    addField(x, y);
  }
}

canvas.addEventListener("mousedown", e => handleStart(e.clientX, e.clientY));
canvas.addEventListener("mousemove", e => {
  if (e.buttons) handleMove(e.clientX, e.clientY);
});

canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    handleStart(t.clientX, t.clientY);
  }
}, { passive: false });

canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    handleMove(t.clientX, t.clientY);
  }
}, { passive: false });

window.addEventListener("resize", resize);
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
