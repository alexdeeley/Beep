<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Art Toy — Tennis Ball in Space</title>
<style>
  html,body{margin:0;height:100%;background:#000;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>
<script>
(function(){
  const cnv = document.getElementById('c');
  const ctx = cnv.getContext('2d', {alpha:false, desynchronized:true});
  let dpr = Math.min(2, window.devicePixelRatio||1);
  function fit(){
    dpr = Math.min(2, window.devicePixelRatio||1);
    const w = Math.floor(innerWidth*dpr), h = Math.floor(innerHeight*dpr);
    if (cnv.width!==w || cnv.height!==h){ cnv.width=w; cnv.height=h; }
  }
  addEventListener('resize', fit, {passive:true}); fit();

  // ---------- lightweight value-noise for nebula
  function RNG(seed){ let s = seed|0; return ()=>{ s = (s*1664525 + 1013904223)|0; return ((s>>>0)%1000000)/1000000; }; }
  const r1 = RNG(123456), r2 = RNG(987654);
  const neb = document.createElement('canvas');
  const nctx = neb.getContext('2d');
  function makeNebula(){
    const w = cnv.width, h = cnv.height;
    neb.width = w; neb.height = h;
    const img = nctx.createImageData(w,h);
    function noise2(x,y){
      const xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      function h(a,b){ const seed = (a*374761393 + b*668265263)|0; const rr = Math.sin(seed)*43758.5453; return rr - Math.floor(rr); }
      function lerp(a,b,t){ return a + (b-a)*t; }
      const v00 = h(xi,yi), v10 = h(xi+1,yi), v01 = h(xi,yi+1), v11 = h(xi+1,yi+1);
      const i1 = lerp(v00, v10, xf), i2 = lerp(v01, v11, xf);
      return lerp(i1, i2, yf);
    }
    for (let y=0;y<h;y++){
      for (let x=0;x<w;x++){
        const nx = x/w, ny = y/h;
        // layered noise for color channels
        let nA=0,nB=0,nC=0;
        let scale=1.5, amp=1.0;
        for (let o=0;o<5;o++){
          nA += noise2(nx*3.0*scale, ny*3.0*scale)*amp;
          nB += noise2(nx*2.7*scale + 50, ny*2.9*scale + 50)*amp;
          nC += noise2(nx*2.2*scale + 100, ny*2.5*scale + 100)*amp;
          scale *= 1.9; amp *= 0.55;
        }
        let r = Math.pow(nA, 2.2) * 255;
        let g = Math.pow(nB, 2.2) * 255;
        let b = Math.pow(nC, 2.2) * 255;
        // darken and add starry points
        const vign = 0.7 + 0.3*Math.hypot(nx-0.5, ny-0.5);
        r*=0.25/vign; g*=0.18/vign; b*=0.35/vign;
        // stars
        if (((x*73856093)^(y*19349663)) % 281 == 0){ const s = 180 + ((x^y)&75); r+=s; g+=s; b+=s; }
        const off=(y*w+x)*4;
        img.data[off] = Math.max(0, Math.min(255, r));
        img.data[off+1] = Math.max(0, Math.min(255, g));
        img.data[off+2] = Math.max(0, Math.min(255, b));
        img.data[off+3] = 255;
      }
    }
    nctx.putImageData(img,0,0);
  }
  makeNebula();

  // ---------- Tennis ball renderer (photoreal-ish)
  const ballSizeBase = Math.min(cnv.width, cnv.height) * 0.55;
  const ballTex = document.createElement('canvas');
  const bt = ballTex.getContext('2d');
  const texRes = 384; // internal resolution for sampling
  ballTex.width = texRes; ballTex.height = texRes;

  // parameters
  let angX=0.6, angY=0.4, angZ=0.0;
  let avX=0, avY=0, avZ=0; // angular velocity; no damping (space)
  const light = normalize([0.6, 0.8, 0.4]);

  function normalize(v){ const m = Math.hypot(v[0],v[1],v[2]) || 1; return [v[0]/m, v[1]/m, v[2]/m]; }
  function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
  function rotX(p,a){ const s=Math.sin(a), c=Math.cos(a); return [p[0], c*p[1]-s*p[2], s*p[1]+c*p[2]]; }
  function rotY(p,a){ const s=Math.sin(a), c=Math.cos(a); return [c*p[0]+s*p[2], p[1], -s*p[0]+c*p[2]]; }
  function rotZ(p,a){ const s=Math.sin(a), c=Math.cos(a); return [c*p[0]-s*p[1], s*p[0]+c*p[1], p[2]]; }

  // per-pixel render into ballTex given angles
  function renderBall(){
    const w=texRes, h=texRes;
    const img = bt.createImageData(w,h);
    const center = (w-1)/2, rad = w*0.48;
    function seamDist(n){
      // Two broad great-circle seams (approx): distance to plane normals
      const m1 = normalize([1,0,0]);
      const m2 = normalize([0,1,0]);
      // Offset normals to mimic tennis curve (slight bend via rotation)
      const bend = 0.6;
      const mm1 = rotZ(m1, bend);
      const mm2 = rotZ(m2, -bend);
      const d1 = Math.abs(dot(n, mm1));
      const d2 = Math.abs(dot(n, mm2));
      return Math.min(d1, d2);
    }
    function noise3(nx,ny,nz){
      // simple hash noise
      const s = Math.sin(nx*12.9898 + ny*78.233 + nz*37.719)*43758.5453;
      return s - Math.floor(s);
    }
    for (let y=0;y<h;y++){
      for (let x=0;x<w;x++){
        const dx = x - center, dy = y - center;
        const rr = Math.sqrt(dx*dx + dy*dy);
        const off = (y*w + x)*4;
        if (rr > rad){ img.data[off+3]=0; continue; }
        // map to sphere
        const nx = dx / rad, ny = dy / rad, nz = Math.sqrt(1 - (nx*nx + ny*ny));
        // rotate sphere
        let n = [nx, ny, nz];
        n = rotX(n, angX); n = rotY(n, angY); n = rotZ(n, angZ);
        // lighting (Lambert + rim)
        const lam = Math.max(0, dot(n, light));
        const rim = Math.pow(1 - Math.max(0,n[2]), 1.7);
        // felt base color (tennis optic yellow)
        let r=210, g=232, b=68;
        // felt noise
        const f = noise3(n[0]*20, n[1]*22, n[2]*24);
        r += (f-0.5)*18; g += (f-0.5)*22; b += (f-0.5)*10;
        // apply shading
        r = r*(0.35 + 0.65*lam) + 30*rim;
        g = g*(0.35 + 0.65*lam) + 30*rim;
        b = b*(0.35 + 0.65*lam) + 30*rim;
        // seam
        const sd = seamDist(n);
        if (sd < 0.035){
          const t = Math.pow((0.035 - sd)/0.035, 0.8);
          // white fuzzy seam with soft edges
          r = 255*(0.6+0.4*t) + r*(1-t)*0.2;
          g = 255*(0.6+0.4*t) + g*(1-t)*0.2;
          b = 255*(0.6+0.4*t) + b*(1-t)*0.2;
        }
        // slight speckle for fiber
        if (((x*928371 + y*123457) % 97)===0){ r-=30; g-=30; b-=30; }
        img.data[off] = Math.max(0, Math.min(255, r));
        img.data[off+1] = Math.max(0, Math.min(255, g));
        img.data[off+2] = Math.max(0, Math.min(255, b));
        img.data[off+3] = 255;
      }
    }
    bt.putImageData(img,0,0);
  }

  // interaction: swipe to set angular velocity (no damping)
  let dragging=false, lastX=0, lastY=0, lastT=performance.now();
  function setPtr(e){ const t=(e.touches&&e.touches[0])||e; lastX=t.clientX; lastY=t.clientY; lastT=performance.now(); }
  function fling(e){
    const t=(e.touches&&e.touches[0])||e;
    const now=performance.now();
    const dx = t.clientX - lastX, dy = t.clientY - lastY;
    const dt = Math.max(8, now - lastT);
    lastX = t.clientX; lastY = t.clientY; lastT = now;
    const gain = 0.0035; // stronger in space
    avY += -dx * gain;
    avX +=  dy * gain;
    avZ += (dx - dy) * gain * 0.25;
  }
  cnv.addEventListener('pointerdown', e=>{ dragging=true; setPtr(e); });
  cnv.addEventListener('pointermove', e=>{ if(dragging) fling(e); });
  addEventListener('pointerup', ()=>{ dragging=false; });
  cnv.addEventListener('touchstart', e=>{ dragging=true; setPtr(e); }, {passive:true});
  cnv.addEventListener('touchmove',  e=>{ if(dragging) fling(e); }, {passive:true});
  addEventListener('touchend', ()=>{ dragging=false; }, {passive:true});

  // animate
  function loop(){
    fit();
    // draw nebula background (slight parallax drift)
    const t = performance.now()*0.00005;
    ctx.drawImage(neb, Math.sin(t)*20, Math.cos(t*1.3)*20, cnv.width, cnv.height);
    // update rotation
    angX += avX; angY += avY; angZ += avZ; // no damping -> spins forever
    renderBall();
    // draw ball centered
    const size = Math.floor(Math.min(cnv.width, cnv.height)*0.58);
    const x = (cnv.width - size)/2, y = (cnv.height - size)/2;
    ctx.drawImage(ballTex, x, y, size, size);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
