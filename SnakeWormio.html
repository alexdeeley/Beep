<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>SNAKE! (Worm.io style)</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --accent: #7CFF6B;
    --accent2: #00E0FF;
    --danger: #ff3b30;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    touch-action: none; /* allow smooth dragging without scroll */
    overscroll-behavior: none;
  }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: none; background: var(--bg); }
  /* Splash + Game Over overlays */
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg);
  }
  h1.title {
    font-size: clamp(48px, 10vw, 120px);
    margin: 0 0 16px 0; letter-spacing: 2px;
    text-shadow: 0 0 16px rgba(255,255,255,0.15);
  }
  .subtitle { opacity: 0.8; font-size: clamp(14px, 2.5vw, 18px); }
  .big-icon-button {
    font-size: clamp(48px, 10vw, 96px);
    margin-top: 24px; cursor: pointer; user-select: none;
    filter: drop-shadow(0 0 8px rgba(124,255,107,0.25));
  }
  .controls {
    position: absolute; bottom: 20px; display: flex; gap: 28px; align-items: center;
  }
  .icon {
    font-size: clamp(40px, 8vw, 64px);
    cursor: pointer; user-select: none;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.15));
  }
  .scoreHUD {
    position: absolute; left: 16px; top: 10px;
    font-weight: 700; font-size: clamp(18px, 3.5vw, 28px);
    text-shadow: 0 0 10px rgba(255,255,255,0.1);
  }
  .giant {
    font-size: clamp(48px, 12vw, 140px); font-weight: 900; letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .hint {
    opacity: 0.7; margin-top: 8px; font-size: clamp(12px, 2.5vw, 16px);
    max-width: 90ch; text-align: center;
  }
  /* High contrast white-on-black preference already used globally */
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


  <div id="wrap">
    <div id="splash" class="overlay">
      <h1 class="title">SNAKE!</h1>
      <div class="subtitle">One‑handed, smooth, wraparound, gem‑eating fun.</div>
      <div class="big-icon-button" id="playBtn" aria-label="Play">▶️</div>
      <div class="hint">Drag your thumb anywhere to steer. Eat gems to grow. Don’t bite your tail.</div>
    </div>
    <canvas id="game" width="900" height="600"></canvas>
    <div class="scoreHUD" id="hudScore" aria-live="polite">Score: 0</div>

    <div id="gameOver" class="overlay" style="display:none;">
      <div class="giant" id="finalScore">Score: 0</div>
      <div class="controls">
        <div class="icon" id="replayBtn" title="Replay" aria-label="Replay">↻</div>
        <div class="icon" id="shareBtn" title="Share" aria-label="Share">📤</div>
      </div>
      <div class="hint">Tip: smoother turns = safer tail. Try smaller circular arcs.</div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1)); // limit DPR for perf
  const hudScore = document.getElementById('hudScore');

  // Resize canvas to full screen and keep internal resolution crisp
  function fit() {
    const w = window.innerWidth, h = window.innerHeight;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.floor(w * DPR);
    canvas.height = Math.floor(h * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', fit, {passive:true});
  fit();

  // Game objects
  const state = {
    running: false,
    score: 0,
    gems: [],
    particles: [],
    lastTime: 0,
  };

  // Worm (snake) with smooth, continuous movement
  const worm = {
    x: canvas.width / (2*DPR),
    y: canvas.height / (2*DPR),
    angle: -Math.PI/2,
    targetAngle: -Math.PI/2,
    speed: 180,           // pixels per second
    turnRate: 3.8,        // radians per second (max)
    radius: 10,           // visual radius
    length: 420,          // total body length (pixels)
    path: [],             // array of points {x,y} from head backward
    pathAccum: 0,         // distance accumulator for sampling path points
    sampleStep: 2.5,      // store a path point every N pixels
  };

  function resetGame() {
    state.running = true;
    state.score = 0;
    state.gems = [];
    state.particles = [];
    hudScore.textContent = 'Score: 0';

    worm.x = canvas.width / (2*DPR);
    worm.y = canvas.height / (2*DPR);
    worm.angle = -Math.PI/2;
    worm.targetAngle = worm.angle;
    worm.length = 420;
    worm.path = [{x: worm.x, y: worm.y}];
    worm.pathAccum = 0;

    // spawn initial gems
    for (let i = 0; i < 12; i++) spawnGem();
  }

  function spawnGem() {
    const margin = 24;
    const gx = margin + Math.random() * (canvas.width / DPR - margin * 2);
    const gy = margin + Math.random() * (canvas.height / DPR - margin * 2);
    const r = 7 + Math.random()*5;
    const hue = Math.floor(Math.random()*360);
    state.gems.push({x: gx, y: gy, r, hue});
  }

  // Input: steer toward pointer/finger with inertia (worm‑io style)
  const pointer = {active:false, x: worm.x, y: worm.y};
  function setPointer(x, y) {
    pointer.active = true; pointer.x = x; pointer.y = y;
  }
  function clearPointer(){ pointer.active = false; }

  // Mouse + touch handlers (one‑hand friendly anywhere)
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    setPointer(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointermove', e => {
    if (pointer.active) setPointer(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointerup', e => { clearPointer(); });
  canvas.addEventListener('pointercancel', e => { clearPointer(); });

  // Keyboard fallback: left/right to steer, up/down to nudge speed
  window.addEventListener('keydown', e => {
    if (!state.running) return;
    if (e.key === 'ArrowLeft') worm.targetAngle -= 0.35;
    if (e.key === 'ArrowRight') worm.targetAngle += 0.35;
    if (e.key === 'ArrowUp') worm.speed = Math.min(300, worm.speed + 10);
    if (e.key === 'ArrowDown') worm.speed = Math.max(120, worm.speed - 10);
  });

  function wrapPosition(obj) {
    const W = canvas.width / DPR, H = canvas.height / DPR;
    if (obj.x < 0) obj.x += W;
    if (obj.x > W) obj.x -= W;
    if (obj.y < 0) obj.y += H;
    if (obj.y > H) obj.y -= H;
  }

  function distance(ax, ay, bx, by) {
    const dx = ax - bx, dy = ay - by;
    return Math.hypot(dx, dy);
  }

  function update(dt) {
    // Target angle: if pointer active, head toward it
    if (pointer.active) {
      const dx = (pointer.x) - worm.x;
      const dy = (pointer.y) - worm.y;
      worm.targetAngle = Math.atan2(dy, dx);
    }
    // Smoothly rotate toward target with capped turn rate
    let da = ((worm.targetAngle - worm.angle + Math.PI*3) % (Math.PI*2)) - Math.PI; // shortest arc
    const maxTurn = worm.turnRate * dt;
    if (da > maxTurn) da = maxTurn;
    else if (da < -maxTurn) da = -maxTurn;
    worm.angle += da;

    // Move forward
    worm.x += Math.cos(worm.angle) * worm.speed * dt;
    worm.y += Math.sin(worm.angle) * worm.speed * dt;
    wrapPosition(worm);

    // Sample path
    const last = worm.path[0];
    const segd = distance(worm.x, worm.y, last.x, last.y);
    worm.pathAccum += segd;
    if (worm.pathAccum >= worm.sampleStep) {
      worm.path.unshift({x: worm.x, y: worm.y});
      worm.pathAccum = 0;
    }
    // Trim path to maintain total length
    let accum = 0;
    for (let i = 0; i < worm.path.length - 1; i++) {
      const a = worm.path[i], b = worm.path[i+1];
      accum += distance(a.x, a.y, b.x, b.y);
      if (accum > worm.length) {
        worm.path.length = i+2;
        break;
      }
    }

    // Collisions with self: check head vs path points a bit behind
    const head = {x: worm.x, y: worm.y};
    let selfHit = false;
    const skip = 12; // ignore first N points to avoid immediate self collision
    for (let i = skip; i < worm.path.length; i++) {
      const p = worm.path[i];
      if (distance(head.x, head.y, p.x, p.y) < worm.radius * 0.9) { selfHit = true; break; }
    }
    if (selfHit) {
      endGame();
      return;
    }

    // Gem pickups
    for (let i = state.gems.length - 1; i >= 0; i--) {
      const g = state.gems[i];
      if (distance(worm.x, worm.y, g.x, g.y) < worm.radius + g.r) {
        // pickup
        state.gems.splice(i, 1);
        // grow worm
        worm.length += 36;
        state.score += 1;
        hudScore.textContent = 'Score: ' + state.score;
        spawnGem();
        makeBurst(g.x, g.y, g.hue);
      }
    }

    // Particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= dt;
      p.vx *= 0.98; p.vy *= 0.98;
      wrapPosition(p);
      if (p.life <= 0) state.particles.splice(i, 1);
    }
  }

  function makeBurst(x, y, hue) {
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      const sp = 80 + Math.random()*140;
      state.particles.push({
        x, y,
        vx: Math.cos(a)*sp,
        vy: Math.sin(a)*sp,
        life: 0.6 + Math.random()*0.6,
        hue,
      });
    }
  }

  function draw() {
    const W = canvas.width / DPR, H = canvas.height / DPR;
    // Clear with slight fade for a classy motion trail
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,W,H);

    // Draw gems
    for (const g of state.gems) {
      const grd = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r*1.6);
      grd.addColorStop(0, `hsl(${g.hue} 90% 70%)`);
      grd.addColorStop(1, `hsla(${g.hue} 90% 50% / 0.1)`);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r, 0, Math.PI*2);
      ctx.fill();
      // sparkle
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(g.x - g.r*0.6, g.y);
      ctx.lineTo(g.x + g.r*0.6, g.y);
      ctx.moveTo(g.x, g.y - g.r*0.6);
      ctx.lineTo(g.x, g.y + g.r*0.6);
      ctx.stroke();
    }

    // Draw particles
    for (const p of state.particles) {
      ctx.fillStyle = `hsla(${p.hue} 90% 60% / ${Math.max(0,p.life)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, Math.PI*2); ctx.fill();
    }

    // Draw worm path as a smooth round-capped stroke
    if (worm.path.length > 1) {
      ctx.save();
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      const width = worm.radius*2;
      // subtle gradient for a modern neon edge
      const grad = ctx.createLinearGradient(worm.x-40, worm.y-40, worm.x+40, worm.y+40);
      grad.addColorStop(0, 'rgba(124,255,107,0.95)');   // lime
      grad.addColorStop(1, 'rgba(0,224,255,0.9)');      // cyan
      ctx.strokeStyle = grad;
      ctx.lineWidth = width;

      ctx.beginPath();
      ctx.moveTo(worm.path[0].x, worm.path[0].y);
      // draw through points; for extra smoothness, use quadratic between points
      for (let i = 1; i < worm.path.length - 1; i++) {
        const p0 = worm.path[i];
        const p1 = worm.path[i+1];
        const mx = (p0.x + p1.x) * 0.5;
        const my = (p0.y + p1.y) * 0.5;
        ctx.quadraticCurveTo(p0.x, p0.y, mx, my);
      }
      ctx.stroke();

      // draw bright head
      ctx.shadowColor = 'rgba(255,255,255,0.35)';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(worm.x, worm.y, worm.radius*0.9, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  function loop(ts) {
    if (!state.running) return;
    if (!state.lastTime) state.lastTime = ts;
    const dt = Math.min(0.035, (ts - state.lastTime) / 1000); // clamp
    state.lastTime = ts;

    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function endGame() {
    state.running = false;
    // Show game over overlay
    document.getElementById('finalScore').textContent = 'Score: ' + state.score;
    document.getElementById('gameOver').style.display = 'flex';
    canvas.style.display = 'none';
  }

  // Public controls
  function startGame() {
    document.getElementById('splash').style.display = 'none';
    document.getElementById('gameOver').style.display = 'none';
    canvas.style.display = 'block';
    state.lastTime = 0;
    resetGame();
    requestAnimationFrame(loop);
  }

  // Expose to buttons
  document.getElementById('playBtn').addEventListener('click', startGame);
  document.getElementById('replayBtn').addEventListener('click', startGame);
  document.getElementById('shareBtn').addEventListener('click', () => {
    const text = `Snakes! My score: ${state.score} 🐍 https://alexdeeley.neocities.org/snake.html`;
    if (navigator.share) {
      navigator.share({ text });
    } else {
      // Fallback: prompt to copy
      const ok = window.prompt('Copy and share:', text);
    }
  });

  // Start on any key (optional)
  window.addEventListener('keydown', (e) => {
    if (document.getElementById('splash').style.display !== 'none') startGame();
  });

  // Make initial pointer target center (neutral)
  pointer.x = worm.x; pointer.y = worm.y;
})();
</script>
</body>
</html>
