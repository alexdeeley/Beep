<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d3b24">
<title>Maisie's Magical Gemstone Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1740;--cream:#fff7ea;--pink:#ff6fb1;--pinkD:#e0418f;--lilac:#b69cff;--gold:#ffd23f;--leaf:#3f9e4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d3b24;font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
canvas#game{position:fixed;inset:0;display:block;image-rendering:pixelated}
.hidden{display:none!important}
.panel{background:var(--cream);border:5px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink)}
.btn{font:inherit;font-weight:700;font-size:clamp(22px,3.2vw,32px);color:var(--ink);background:var(--pink);border:5px solid var(--ink);border-radius:18px;padding:.4em 1.1em;box-shadow:0 6px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn.alt{background:#fff}.btn.gold{background:var(--gold)}.btn.small{font-size:22px;padding:.3em .9em}
.btn:focus-visible,.round:focus-visible{outline:5px solid #fff;outline-offset:3px}
#hud{position:fixed;inset:0;pointer-events:none}
#check{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));padding:10px 16px 12px;min-width:220px;pointer-events:auto}
#lvName{font-weight:700;font-size:20px;color:var(--pinkD);margin-bottom:4px;max-width:260px;line-height:1.15}
.row{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:600;line-height:1.35}
.row .ic{width:30px;text-align:center}.row .lab{flex:1}.row b{font-weight:700}
.row.done b::after{content:' ✓';color:#1f9c45}
#carry{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-width:250px}
#carry img{width:30px;height:auto;image-rendering:pixelated}
#topBtns{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:10px;pointer-events:auto}
.round{width:66px;height:66px;border-radius:50%;border:5px solid var(--ink);background:var(--cream);font-size:32px;box-shadow:0 5px 0 var(--ink);cursor:pointer;padding:0;touch-action:manipulation}
.round:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
#tip{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));background:var(--ink);color:#fff;font-size:clamp(20px,2.6vw,28px);font-weight:600;padding:10px 22px;border-radius:40px;max-width:min(560px,56vw);text-align:center;line-height:1.2;pointer-events:none}
#hintBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));animation:pulse 1.4s ease-in-out infinite;z-index:5}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--cream);border:5px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);font-size:clamp(24px,3.4vw,36px);font-weight:700;padding:12px 26px;text-align:center;pointer-events:none;animation:toastIn .35s ease-out;z-index:6;max-width:88vw}
@keyframes toastIn{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#banner{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;animation:bannerA 3.2s ease forwards;z-index:6}
#bNum{font-size:clamp(30px,5vw,54px);font-weight:700;color:var(--gold);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill}
#bName{font-size:clamp(40px,8vw,90px);font-weight:700;color:#fff;-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;line-height:1.05;padding:0 20px}
@keyframes bannerA{0%{opacity:0;transform:scale(.8)}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0}}
#pad{position:fixed;left:calc(18px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));width:190px;height:190px;border-radius:50%;background:rgba(255,247,234,.55);border:5px solid var(--ink);touch-action:none;z-index:4}
#knob{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:var(--pink);border:5px solid var(--ink);box-shadow:0 4px 0 var(--ink);pointer-events:none}
.ar{position:absolute;font-size:22px;color:var(--ink);pointer-events:none;font-weight:700}
.ar.u{left:50%;top:6px;transform:translateX(-50%)}.ar.d{left:50%;bottom:6px;transform:translateX(-50%)}.ar.l{left:10px;top:50%;transform:translateY(-50%)}.ar.r{right:10px;top:50%;transform:translateY(-50%)}
#act{position:fixed;right:calc(22px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));width:136px;height:136px;border-radius:50%;background:var(--gold);border:6px solid var(--ink);box-shadow:0 7px 0 var(--ink);font-size:60px;padding:0;touch-action:none;z-index:4;cursor:pointer}
#act.ready{animation:actP .8s ease-in-out infinite;background:#fff27a}
@keyframes actP{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#act:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink)}
#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(920px,95vw);display:flex;gap:16px;align-items:center;padding:14px 20px;z-index:8;cursor:pointer;animation:dIn .2s ease-out}
@keyframes dIn{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#portrait{width:104px;height:104px;flex:none;image-rendering:pixelated;background:#e9f7de;border:4px solid var(--ink);border-radius:14px}
.dtext{flex:1;min-width:0}
#dName{font-size:22px;font-weight:700;color:var(--pinkD)}
#dLine{font-size:clamp(24px,3.2vw,32px);font-weight:600;line-height:1.25;margin:4px 0}
#dMore{font-size:18px;opacity:.7;text-align:right}
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(43,23,64,0) 30%,rgba(43,23,64,.45) 100%);z-index:10;padding:20px}
.tbox{text-align:center}
#tName{margin:0;font-weight:700;font-size:clamp(38px,7.4vw,96px);line-height:1.02;letter-spacing:.01em;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill;filter:drop-shadow(0 8px 0 var(--ink))}
#tName span{display:block}#tName .a{color:#fff}#tName .b{color:var(--gold)}
.sub{font-size:clamp(20px,2.8vw,30px);font-weight:700;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;margin:14px 0 26px}
.tbtns{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
#modal{position:fixed;inset:0;background:rgba(43,23,64,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.mbox{width:min(760px,96vw);max-height:92vh;overflow:auto;padding:22px 26px;text-align:center;touch-action:pan-y}
.mbox h2{margin:0 0 8px;font-size:clamp(34px,5vw,56px);color:var(--pinkD);line-height:1.05}
.mbox h3{margin:18px 0 8px;font-size:28px;text-align:left}
.mbox p{font-size:clamp(22px,2.8vw,28px);font-weight:600;line-height:1.3;margin:8px 0}
.mbtns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.cell{background:#fff;border:4px solid var(--ink);border-radius:14px;padding:8px 4px;font-size:20px;font-weight:600;line-height:1.15}
.cell canvas,.cell img{display:block;margin:0 auto 4px;image-rendering:pixelated}
.cell.dim{opacity:.35}
.disc{text-align:left;font-size:22px;font-weight:600;margin:4px 0}
.how{text-align:left;font-size:clamp(20px,2.6vw,26px);font-weight:600;line-height:1.35}
.how div{margin:8px 0}
#fade{position:fixed;inset:0;background:#fff7ea;opacity:0;pointer-events:none;transition:opacity .45s;z-index:30}
@media (max-width:620px){#check{min-width:0;padding:8px 12px}.row{font-size:20px}#lvName{font-size:16px;max-width:170px}.round{width:56px;height:56px;font-size:26px}#pad{width:160px;height:160px}#knob{width:70px;height:70px;margin:-35px 0 0 -35px}#act{width:116px;height:116px;font-size:50px}#portrait{width:76px;height:76px}#tip{top:auto;bottom:calc(200px + env(safe-area-inset-bottom));max-width:90vw}}
@media (prefers-reduced-motion:reduce){#hintBtn,#act.ready{animation:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div id="check" class="panel">
    <div id="lvName"></div>
    <div class="row" id="rowF"><span class="ic">💬</span><span class="lab">Friends</span><b id="cF"></b></div>
    <div class="row" id="rowG"><span class="ic">💎</span><span class="lab">Gems</span><b id="cG"></b></div>
    <div class="row" id="rowR"><span class="ic">⭕</span><span class="lab">Ring</span><b id="cR"></b></div>
    <div id="carry"></div>
  </div>
  <div id="topBtns"><button class="round" id="bJournal" aria-label="Open journal">📖</button><button class="round" id="bSound" aria-label="Sound on or off">🔊</button></div>
</div>
<div id="tip" class="hidden"></div>
<button id="hintBtn" class="btn gold hidden">✨ Need a hint?</button>
<div id="toast" class="hidden"></div>
<div id="banner" class="hidden"><div id="bNum"></div><div id="bName"></div></div>
<div id="pad" class="hidden"><div id="knob"></div><span class="ar u">▲</span><span class="ar d">▼</span><span class="ar l">◀</span><span class="ar r">▶</span></div>
<button id="act" class="hidden" aria-label="Magic button">✨</button>
<div id="dialog" class="panel hidden"><canvas id="portrait" width="104" height="104"></canvas><div class="dtext"><div id="dName"></div><div id="dLine"></div><div id="dMore">Tap to continue ▶</div></div></div>
<div id="title">
  <div class="tbox">
    <h1 id="tName"><span class="a">MAISIE'S MAGICAL</span><span class="b">GEMSTONE ADVENTURE</span></h1>
    <p class="sub">Explore • Discover • Collect • Make Friends</p>
    <div class="tbtns"><button class="btn gold hidden" id="bCont">Continue</button><button class="btn" id="bStart">Start Adventure</button><button class="btn alt" id="bHow">How to Play</button></div>
  </div>
</div>
<div id="modal" class="hidden"><div class="panel mbox" id="mbox"></div></div>
<div id="fade"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('game'),ctx=cv.getContext('2d');
const INK='#2b1740';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hexRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function lighten(h,a){const[r,g,b]=hexRgb(h);return`rgb(${r+(255-r)*a|0},${g+(255-g)*a|0},${b+(255-b)*a|0})`}
function darken(h,a){const[r,g,b]=hexRgb(h);return`rgb(${r*(1-a)|0},${g*(1-a)|0},${b*(1-a)|0})`}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= AUDIO ================= */
const Snd={on:true,ac:null};
try{Snd.on=localStorage.getItem('maisie-sound')!=='off'}catch(e){}
function audioInit(){
  if(Snd.ac){if(Snd.ac.state==='suspended')Snd.ac.resume();return}
  try{Snd.ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  const a=Snd.ac;
  const comp=a.createDynamicsCompressor();comp.connect(a.destination);
  Snd.master=a.createGain();Snd.master.gain.value=Snd.on?.9:0;Snd.master.connect(comp);
  const len=a.sampleRate*2.6,ib=a.createBuffer(2,len,a.sampleRate);
  for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
  Snd.rev=a.createConvolver();Snd.rev.buffer=ib;const rg=a.createGain();rg.gain.value=.4;Snd.rev.connect(rg);rg.connect(Snd.master);
  Snd.music=a.createGain();Snd.music.gain.value=.55;Snd.music.connect(Snd.master);
  const ms=a.createGain();ms.gain.value=.5;Snd.music.connect(ms);ms.connect(Snd.rev);
  Snd.sfx=a.createGain();Snd.sfx.gain.value=.8;Snd.sfx.connect(Snd.master);
  const ss=a.createGain();ss.gain.value=.3;Snd.sfx.connect(ss);ss.connect(Snd.rev);
  const nb=a.createBuffer(1,a.sampleRate*2,a.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;Snd.noise=nb;
  // water ambience
  const ws=a.createBufferSource();ws.buffer=nb;ws.loop=true;const wf=a.createBiquadFilter();wf.type='bandpass';wf.frequency.value=900;wf.Q.value=.6;
  Snd.water=a.createGain();Snd.water.gain.value=0;ws.connect(wf);wf.connect(Snd.water);Snd.water.connect(Snd.master);ws.start();
  // soft forest air
  const fs=a.createBufferSource();fs.buffer=nb;fs.loop=true;fs.playbackRate.value=.7;const ff=a.createBiquadFilter();ff.type='lowpass';ff.frequency.value=380;
  const fg=a.createGain();fg.gain.value=.018;fs.connect(ff);ff.connect(fg);fg.connect(Snd.master);fs.start();
}
function setSound(on){Snd.on=on;try{localStorage.setItem('maisie-sound',on?'on':'off')}catch(e){}
  if(Snd.master)Snd.master.gain.setTargetAtTime(on?.9:0,Snd.ac.currentTime,.05);$('bSound').textContent=on?'🔊':'🔈'}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function note(freq,t,dur,type,vol,dest,attack){
  const a=Snd.ac;if(!a)return;attack=attack||.005;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+attack+dur);
  o.connect(g);g.connect(dest||Snd.sfx);o.start(t);o.stop(t+attack+dur+.05);return o;
}
function noiseHit(t,dur,type,freq,vol,Q){
  const a=Snd.ac;if(!a)return;const s=a.createBufferSource();s.buffer=Snd.noise;s.playbackRate.value=rnd(.8,1.2);
  const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=Q||1;const g=a.createGain();
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(Snd.sfx);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);
}
const now=()=>Snd.ac?Snd.ac.currentTime:0;
const SFX={
  step(k){if(!Snd.ac)return;const t=now();if(k==='bridge'){note(rnd(260,300),t,.05,'triangle',.05)}else if(k==='path'){noiseHit(t,.05,'bandpass',2400,.035,1.5)}else noiseHit(t,.06,'lowpass',900,.04)},
  chime(){const t=now();[0,4,7,12,16].forEach((s,i)=>{note(mtof(84+s),t+i*.07,.5,'sine',.13);note(mtof(96+s),t+i*.07,.2,'triangle',.03)})},
  talk(){const t=now();note(620,t,.07,'triangle',.08);note(840,t+.07,.09,'triangle',.07)},
  rustle(){const t=now();for(let i=0;i<4;i++)noiseHit(t+i*.06,.09,'bandpass',rnd(1800,3200),.09,2)},
  dig(){const t=now();noiseHit(t,.15,'lowpass',500,.2);noiseHit(t+.18,.15,'lowpass',420,.2)},
  pop(){const t=now();const o=note(400,t,.18,'sine',.14);if(o)o.frequency.exponentialRampToValueAtTime(1100,t+.15)},
  ring(i){const t=now();const s=[0,2,4,7,9,12,14,16,19];const m=72+s[i%9];note(mtof(m),t,1.6,'sine',.16);note(mtof(m+12),t,.8,'triangle',.04);note(mtof(m+19),t+.02,.4,'sine',.02)},
  activate(){const t=now();const o=note(220,t,2.2,'sine',.12,null,.3);if(o)o.frequency.exponentialRampToValueAtTime(880,t+1.8);
    [60,64,67,72,76,79,84].forEach((m,i)=>{note(mtof(m),t+.6+i*.12,2.4,'sine',.07);note(mtof(m+12),t+.6+i*.12,1,'triangle',.02)})},
  portal(){const t=now();if(!Snd.ac)return;const a=Snd.ac,s=a.createBufferSource();s.buffer=Snd.noise;const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=3;
    f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(2400,t+2);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+1);g.gain.exponentialRampToValueAtTime(.0001,t+2.4);
    s.connect(f);f.connect(g);g.connect(Snd.sfx);s.start(t);s.stop(t+2.5);note(mtof(48),t,2.2,'sine',.1,null,.6)},
  item(){const t=now();note(mtof(79),t,.2,'triangle',.1);note(mtof(84),t+.12,.4,'triangle',.1)},
  hint(){const t=now();for(let i=0;i<6;i++)note(mtof(88+i*2),t+i*.05,.3,'sine',.05)},
  bird(){const t=now()+rnd(0,.2);const n=2+(Math.random()*3|0),b=rnd(2200,3400);for(let i=0;i<n;i++){const o=note(b,t+i*.13,.08,'sine',.025);if(o)o.frequency.exponentialRampToValueAtTime(b*rnd(1.2,1.5),t+i*.13+.07)}},
  twinkle(){const t=now();note(mtof(96+[0,4,7,11][Math.random()*4|0]),t,.6,'sine',.025)},
  discover(){const t=now();[67,71,74,79].forEach((m,i)=>note(mtof(m),t+i*.09,.6,'triangle',.07))}
};
/* music */
const MUSIC=[
 {root:60,scale:[0,2,4,7,9],bpm:96,inst:'box',prog:[[0,4,7],[-3,0,4],[5,9,12],[7,11,14]]},
 {root:57,scale:[0,2,3,5,7,10],bpm:84,inst:'flute',prog:[[0,3,7],[-4,0,3],[-2,2,5],[-5,-2,2]]},
 {root:65,scale:[0,2,4,6,7,9,11],bpm:104,inst:'marimba',prog:[[0,4,7],[2,6,9],[4,7,11],[-5,-1,2]]},
 {root:62,scale:[0,2,3,5,7,9,10],bpm:80,inst:'harp',prog:[[0,3,7],[5,9,12],[0,3,7],[-2,2,5]]},
 {root:64,scale:[0,2,4,6,7,9,11],bpm:90,inst:'celesta',prog:[[0,4,7],[2,6,9],[-3,0,4],[-5,-1,2]]}
];
const Mus={lv:-1,next:0,step:0,mi:5};
function musicStart(li){Mus.lv=li;Mus.step=0;Mus.mi=5;if(Snd.ac)Mus.next=Snd.ac.currentTime+.3}
function instPlay(k,m,t,d){const f=mtof(m),D=Snd.music;
  if(k==='box'){note(f,t,.9,'sine',.11,D);note(f*2,t,.3,'sine',.035,D)}
  else if(k==='flute'){note(f,t,d*1.3,'sine',.08,D,.06);note(f*2,t,d*.6,'sine',.012,D,.06)}
  else if(k==='marimba'){note(f,t,.35,'sine',.13,D);note(f*4,t,.05,'sine',.025,D)}
  else if(k==='harp'){note(f,t,1.2,'triangle',.08,D);note(f*2,t,.4,'sine',.03,D)}
  else {note(f,t,1.3,'sine',.09,D);note(f*2,t,.6,'triangle',.03,D);note(f*3.01,t,.25,'sine',.015,D)}}
function musicTick(){
  if(!Snd.ac||Mus.lv<0)return;const M=MUSIC[Mus.lv],spb=60/M.bpm/2,a=Snd.ac;
  if(Mus.next<a.currentTime)Mus.next=a.currentTime+.05;
  while(Mus.next<a.currentTime+.25){
    const s=Mus.step,t=Mus.next,bar=s>>3,pos=s&7,ch=M.prog[(bar>>1)&3];
    if(s%16===0)ch.forEach(c=>{note(mtof(M.root+c-12),t,spb*15,'triangle',.018,Snd.music,.9);note(mtof(M.root+c-12)*1.004,t,spb*15,'sine',.015,Snd.music,.9)});
    if(pos===0||pos===4)note(mtof(M.root+ch[0]-24),t,spb*3.5,'sine',.07,Snd.music,.02);
    const quiet=(bar&7)===7;

function buildGround(Wd,R,clear,gemTile){

const K={l:0,r:0,u:0,d:0};
const Joy={active:false,x:0,y:0,id:null};
const Steer={active:false,sx:0,sy:0,id:null};
function inputVec(){let x=K.r-K.l,y=K.d-K.u;
  if(Joy.active){x+=Joy.x;y+=Joy.y}
  if(Steer.active){const wx=cam.x+(Steer.sx-VW/2)/ZOOM,wy=cam.y+(Steer.sy-VH/2)/ZOOM,dx=wx-P.x,dy=wy-(P.y-10),d=Math.hypot(dx,dy);if(d>8){const m=Math.min(1,d/30);x+=dx/d*m;y+=dy/d*m}}
  const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}return[x,y]}
function solidAt(px,py){const tx=Math.floor(px/TS),ty=Math.floor(py/TS);if(tx<0||ty<0||tx>=W.w||ty>=W.h)return true;return W.solid[ty*W.w+tx]===1}
function blocked(x,y){return solidAt(x-5,y-5)||solidAt(x+5,y-5)||solidAt(x-5,y-1)||solidAt(x+5,y-1)}
function tileAt(x,y){const tx=Math.floor(x/TS),ty=Math.floor(y/TS);if(tx<0||ty<0||tx>=W.w||ty>=W.h)return 0;return W.T[ty*W.w+tx]}
function clampCam(){const vw=VW/ZOOM,vh=VH/ZOOM,mw=W.w*TS,mh=W.h*TS;
  cam.x=mw>vw-16?clamp(cam.x,vw/2-8,mw-vw/2+8):mw/2;cam.y=mh>vh-16?clamp(cam.y,vh/2-8,mh-vh/2+8):mh/2}
function update(dt){
  G.t+=dt;if(!W)return;W.t+=dt;
  const canMove=mode==='play'&&!DQ&&!modalOpen();
  if(canMove){const[ix,iy]=inputVec(),k=1-Math.exp(-dt*12);P.vx=lerp(P.vx,ix*62,k);P.vy=lerp(P.vy,iy*62,k);
    if(blocked(P.x,P.y)){P.x+=P.vx*dt;P.y+=P.vy*dt}else{const nx=P.x+P.vx*dt;if(!blocked(nx,P.y))P.x=nx;else P.vx=0;const ny=P.y+P.vy*dt;if(!blocked(P.x,ny))P.y=ny;else P.vy=0}
    if(Math.abs(ix)>.15)P.face=ix>0?1:-1}
  else{P.vx*=.8;P.vy*=.8}
  const sp=Math.hypot(P.vx,P.vy);P.moving=sp>10&&canMove;
  if(P.moving){P.anim+=dt*sp/62;P.stepT-=dt;if(P.stepT<=0){P.stepT=.27;const t=tileAt(P.x,P.y-2);SFX.step(t===3?'bridge':t===1?'path':'grass')}
    P.sparkT-=dt;if(P.sparkT<=0){P.sparkT=.18;sparkle(P.x+P.face*rnd(4,12),P.y-rnd(6,26),['#ffb3d6','#d8c0ff','#b8e6ff','#fff3a8'][Math.random()*4|0])}}
  P.blinkT-=dt;if(P.blinkT<-.14)P.blinkT=rnd(2,5);if(P.hopT>0)P.hopT-=dt;
  if(mode==='play'){
    for(const g of W.gems)if(g.state==='shown'&&Math.hypot(g.x-P.x,g.y-P.y)<14){SFX.pop();flyGem(g,g.x,g.y-6,.35,10)}
    for(const it of W.items)if(!it.got&&Math.hypot(it.x-P.x,it.y-P.y)<14){it.got=true;S.cur.items.push(it.id);save();SFX.item();toast(`You found ${it.name}!`);burst(it.x,it.y-6,14,['#ffd23f','#fff','#ff6fb1'],40);progress();updateHUD()}
    W.near=DQ?null:nearestInteract();
    W.discT-=dt;if(W.discT<=0){W.discT=.4;checkDiscoveries()}
    if(!DQ&&!modalOpen()&&G.t-lastProgress>W.def.hintDelay&&hintTarget())$('hintBtn').classList.remove('hidden');
  }
  $('act').classList.toggle('ready',!!W.near||!!DQ);
  if(W.near){$('act').textContent=W.near.type==='char'?'💬':W.near.type==='ring'?'💎':'✨'}else $('act').textContent='✨';
  for(const g of W.gems)if(g.state==='fly'){g.ft+=dt;const e=Math.min(1,g.ft/g.fd),q=e<.5?2*e*e:1-2*(1-e)*(1-e);g.cx=lerp(g.fx,P.x,q);g.cy=lerp(g.fy,P.y-16,q)-Math.sin(Math.PI*e)*g.arc;if(Math.random()<.5)sparkle(g.cx,g.cy,'#fff');if(e>=1)collectGem(g)}

    const by=Math.round(Math.sin(G.t*3+e.ph)*1.5);shadow(e.x,e.y,8);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.4;ctx.drawImage(SPR.glowC.gold,e.x-10,e.y-20,20,20);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    drawSpr(SPR.gem[e.color],e.x,e.y-3+by);glint(e.x+4,e.y-12+by,e.ph,1.4);return}
  if(e.spr&&e.kind){shadow(e.x,e.y,8);drawSpr(e.spr,e.x,e.y-2+Math.round(Math.sin(G.t*3)*1));glint(e.x+3,e.y-9,0,1);return}
  if(e.spr)drawSpr(e.spr,e.x,e.y);
}
function drawChar(c){
  const fr=SPR.char[c.kind][((G.t+c.ph)%4)<.15?1:0];
  const fly=c.kind==='fairy'||c.kind==='bird'&&false;
  const bob=c.kind==='fairy'?Math.round(Math.sin(G.t*2.5+c.ph)*2)-4:Math.round(Math.sin(G.t*2+c.ph)*.6);
  if(W&&mode!=='title'){const d=P.x-c.x;if(Math.abs(d)>6)c.flip=d<0}
  shadow(c.x,c.y,fr.width*.55|0);
  if(c.kind==='fairy'){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.45;ctx.drawImage(SPR.glowC.lilac,c.x-16,c.y-30+bob,32,32);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';if(Math.random()<.05)sparkle(c.x+rnd(-6,6),c.y-10+bob,'#fff3a8')}
  drawSpr(fr,c.x,c.y+bob,c.flip);
  if(c.task&&c.task.item==='crown'&&S&&S.cur.delivered.includes(c.id))drawSpr(SPR.crown,c.x,c.y+bob-fr.height+6);
}
function drawPlayer(){
  const fr=P.moving?SPR.uniWalk[Math.floor(P.anim*5)%4]:SPR.uniIdle[P.blinkT<0?1:0];
  const hop=P.hopT>0?-Math.round(Math.sin((1-P.hopT/.45)*Math.PI)*8):0;
  const bob=P.moving?(Math.floor(P.anim*5)%2?-1:0):(Math.sin(G.t*2.2)>.6?-1:0);
  shadow(P.x,P.y,20);
  drawSpr(fr,P.x,P.y+hop+bob,P.face<0);
  if(mode!=='title'&&S)for(const it of W.items)if(it.got&&!W.chars.some(c=>c.task&&c.task.item===it.id&&S.cur.delivered.includes(c.id))){drawSpr(it.spr,P.x-P.face*6,P.y-30+hop+Math.round(Math.sin(G.t*4)*1.5));break}
}

/* ================= INPUT ================= */
const KEYMAP={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d'};
addEventListener('keydown',e=>{
  if(KEYMAP[e.code]){K[KEYMAP[e.code]]=1;e.preventDefault();audioInit();return}
  if(e.code==='Space'||e.code==='Enter'||e.code==='KeyE'){if(DQ){e.preventDefault();advanceDialog();return}if(modalOpen()||mode==='title')return;e.preventDefault();interact()}
  if(e.code==='KeyJ'&&mode==='play'&&!modalOpen()&&!DQ)openJournal();
  if(e.code==='Escape'&&modalOpen()&&$('mClose'))$('mClose').click();
});
addEventListener('keyup',e=>{if(KEYMAP[e.code])K[KEYMAP[e.code]]=0});
addEventListener('blur',()=>{K.l=K.r=K.u=K.d=0;Joy.active=false;Steer.active=false});
function showTouch(){if(isTouch)return;isTouch=true;if(mode==='play'){$('pad').classList.remove('hidden');$('act').classList.remove('hidden')}updateTip()}
addEventListener('touchstart',showTouch,{passive:true});
const pad=$('pad'),knob=$('knob');
function padMove(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(e.clientX-cx)/(r.width*.4),dy=(e.clientY-cy)/(r.height*.4);const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}
  Joy.x=Math.hypot(dx,dy)<.18?0:dx;Joy.y=Math.hypot(dx,dy)<.18?0:dy;knob.style.transform=`translate(${dx*r.width*.3}px,${dy*r.height*.3}px)`}
pad.addEventListener('pointerdown',e=>{audioInit();Joy.active=true;Joy.id=e.pointerId;pad.setPointerCapture(e.pointerId);padMove(e);e.preventDefault()});
pad.addEventListener('pointermove',e=>{if(Joy.active&&e.pointerId===Joy.id)padMove(e)});
const padUp=e=>{if(e.pointerId!==Joy.id)return;Joy.active=false;Joy.x=Joy.y=0;knob.style.transform=''};
pad.addEventListener('pointerup',padUp);pad.addEventListener('pointercancel',padUp);
$('act').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
$('dialog').addEventListener('pointerdown',e=>{e.preventDefault();audioInit();advanceDialog()});
cv.addEventListener('pointerdown',e=>{audioInit();if(e.pointerType==='touch')showTouch();
  if(DQ){advanceDialog();return}if(mode!=='play'||modalOpen())return;
  const wx=cam.x+(e.clientX-VW/2)/ZOOM,wy=cam.y+(e.clientY-VH/2)/ZOOM;
  if(W.near){const o=W.near.o,oy=W.near.type==='ring'?o.y:o.y-10;if(Math.hypot(wx-o.x,wy-oy)<26){interact();return}}
  Steer.active=true;Steer.id=e.pointerId;Steer.sx=e.clientX;Steer.sy=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(Steer.active&&e.pointerId===Steer.id){Steer.sx=e.clientX;Steer.sy=e.clientY}});
const stUp=e=>{if(e.pointerId===Steer.id)Steer.active=false};cv.addEventListener('pointerup',stUp);cv.addEventListener('pointercancel',stUp);
$('hintBtn').onclick=()=>giveHint();
$('bJournal').onclick=()=>{if(!DQ)openJournal()};
$('bSound').onclick=()=>{audioInit();setSound(!Snd.on)};
$('bHow').onclick=()=>{audioInit();openHow()};
$('bCont').onclick=()=>{audioInit();S=loadSave();if(!S)return;fadeTo(()=>{if(S.completed[S.level]&&S.level===LEVELS.length-1&&S.cur.placed.length===LEVELS[S.level].gems.length){loadLevel(S.level)}else loadLevel(S.level)})};
$('bStart').onclick=()=>{audioInit();const old=loadSave();
  const begin=()=>{S=newSave();if(old){S.totals=old.totals;S.friends=old.friends;S.disc=old.disc}save();fadeTo(()=>loadLevel(0))};
  if(old&&(old.level>0||old.cur.found.length||old.cur.talked.length))showModal(`<h2>Start a new adventure?</h2><p>This starts again from Level 1. Your journal will be kept.</p><div class="mbtns"><button class="btn alt" id="mClose">Go back</button><button class="btn gold" id="mYes">Start again</button></div>`,()=>{$('mClose').onclick=closeModal;$('mYes').onclick=()=>{closeModal();begin()}});
  else begin()};
document.addEventListener('visibilitychange',()=>{if(!Snd.ac)return;if(document.hidden)Snd.ac.suspend();else Snd.ac.resume()});
addEventListener('resize',resize);

/* ================= MAIN ================= */
let lastT=0;
function frame(ts){const dt=Math.min(.05,(ts-lastT)/1000||0);lastT=ts;update(dt);render();requestAnimationFrame(frame)}
resize();initSprites();setSound(Snd.on);titleScene();Mus.lv=0;requestAnimationFrame(frame);
</script>
</body>
