const FRAME_CACHE = {};
function boardFrame(L) {
  const k = L.id + '_' + S.settings.contrast; if (FRAME_CACHE[k]) return FRAME_CACHE[k];

}

  update(dt) {

    if (this.bump) for (let i = 0; i < this.bump.length; i++) if (this.bump[i]) this.bump[i] = Math.max(0, this.bump[i] - dt * 4);
    if (!this.busy && !this.ended && !this.tool && Game.top() === this) {
      this.idleT += dt;
      const th = this.id === 1 && !S.tipsSeen[1] ? 1.5 : 6;

cv.addEventListener('pointermove', e => { if (e.pointerId !== activePointer || Game.trans) return; const p = toLogical(e); const t = Game.top(); t.move && t.move(p.x, p.y); });
const endPtr = e => { if (e.pointerId !== activePointer) return; activePointer = null; if (Game.trans) return; const p = toLogical(e); Game.top().up(p.x, p.y); };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', e => { if (e.pointerId === activePointer) { activePointer = null; const t = Game.top(); t.pressed && (t.pressed.press = 0, t.pressed = null); t.drag = null; t.dragCell = null; } });
cv.addEventListener('wheel', e => { e.preventDefault(); const t = Game.top(); t.wheel && t.wheel(e.deltaY); }, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', resize);
window.addEventListener('keydown', e => { if (e.key === 'Escape') { const t = Game.top(); if (t instanceof Overlay) t.close(); else if (t instanceof PuzzleScene && !t.ended) Game.push(new PauseOv(t)); } });
document.addEventListener('visibilitychange', () => { if (document.hidden && AudioSys.ac) AudioSys.ac.suspend(); else if (AudioSys.ac) AudioSys.ac.resume(); });

function drawToasts(dt) {
  if (!Game.toasts.length) return;
  const t = Game.toasts[0]; t.t += dt;
  const k = t.t < .3 ? E.out(t.t / .3) : t.t > 2.4 ? 1 - E.in((t.t - 2.4) / .3) : 1;
  const y = Math.round(-30 + k * 34);
  panel(16, y, W - 32, 26, 'gold');
  ctx.drawImage(ICONS[t.icon] || ICONS.trophy, 22, y + 8);
  text(t.title, 36, y + 5, { c: '#8a4a1c', o: null }); text(t.sub, 36, y + 14, { c: '#c2287a', o: null });
  if (t.t > 2.7) Game.toasts.shift();
}
function drawTransition(dt) {
  const tr = Game.trans; if (!tr) return;
  tr.t += dt / .28;
  let k = tr.phase === 'out' ? tr.t : 1 - tr.t; k = clamp(k, 0, 1);
  // diamond pixel wipe (SNES style)
  const cs = 12; ctx.fillStyle = '#1c0a30';
  for (let y = 0; y < H; y += cs) for (let x = 0; x < W; x += cs) { const d = (Math.abs(x - W / 2) / W + Math.abs(y - H / 2) / H) * .6; const s = clamp((k * 1.6 - d) * 2.2, 0, 1) * cs * .75; if (s > 0) { const cx = x + cs / 2, cy = y + cs / 2; for (let j = -s; j <= s; j++) { const w = s - Math.abs(j); ctx.fillRect(Math.round(cx - w), Math.round(cy + j), Math.round(w * 2) || 1, 1); } } }
  if (tr.t >= 1) {
    if (tr.phase === 'out') { Tw.clear(); FX.clear(); Game.overlays = []; Game.scene = tr.next; Game.scene.enter && Game.scene.enter(); tr.phase = 'in'; tr.t = 0; }
    else Game.trans = null;
  }
}
let last = 0, errCount = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts; T += dt;
  try {
    Tw.update(dt * 1000 * TIME_SCALE);
    Music.tick();
    const sc = Game.scene;
    sc.update(dt);
    for (const o of Game.overlays) o.update(dt);
    FX.update(dt);
    ctx.save();
    if (Game.shake > 0) { ctx.translate(Math.round(rnd(-Game.shake, Game.shake)), Math.round(rnd(-Game.shake, Game.shake))); Game.shake = Math.max(0, Game.shake - dt * 18); }
    sc.draw();
    if (!Game.overlays.length) FX.draw();
    ctx.restore();
    for (const o of Game.overlays) o.draw();
    if (Game.overlays.length) FX.draw();
    if (Game.flash > 0) { ctx.globalAlpha = Game.flash * .6; rect(0, 0, W, H, '#ffffff'); ctx.globalAlpha = 1; Game.flash = Math.max(0, Game.flash - dt * 4); }
    drawToasts(dt);
    drawTransition(dt);
  } catch (err) {
    errCount++; if (errCount < 5) console.error(err);
  }
}
function boot() {
  loadSave(); applySettings();
  resize();
  buildArt();
  CLOUDS = [cloudSprite(30, 12, 1), cloudSprite(44, 15, 2), cloudSprite(22, 9, 3)];
  LOGO = makeLogo();
  buildMap(); buildKingdomBG();
  Game.scene = new TitleScene(); Game.scene.enter();
  document.getElementById('loading').style.display = 'none';
  requestAnimationFrame(frame);
}
window.MMA = { Game, get S() { return S; }, LEVELS, Board };
boot();

</script>
