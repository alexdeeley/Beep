<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Art Toy — Clay Cube (Colors, Drying)</title>
<style>
  html,body{margin:0;height:100%;background:#181716;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>
<script>
(function(){
  const cnv = document.getElementById('c');
  const ctx = cnv.getContext('2d', {alpha:false, desynchronized:true});
  ctx.imageSmoothingEnabled = false;
  let dpr = Math.min(2, window.devicePixelRatio||1);
  function fit(){
    dpr = Math.min(2, window.devicePixelRatio||1);
    const w = Math.floor(innerWidth*dpr), h = Math.floor(innerHeight*dpr);
    if (cnv.width!==w || cnv.height!==h){ cnv.width=w; cnv.height=h; }
  }
  addEventListener('resize', fit, {passive:true}); fit();

  // RNG
  function mulberry32(a){ return function(){ var t=a+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; } }
  let seed=(Math.random()*1e9)|0; let rng=mulberry32(seed);
  const R = { rnd(){return rng();}, range(a,b){return a+(b-a)*rng();}, choice(a){return a[(rng()*a.length)|0];} };

  // Colors: soft clay palette
  const PALETTES = [
    ['#c46b3a','#e1a15b','#7a4b3a','#d7b797','#b84e3c','#f2dcc3'],
    ['#ad7f5b','#d9c39b','#6b4f3f','#c9793d','#7f8c5b','#f1e6d0'],
    ['#cf6d6d','#e4a86a','#b4a574','#6a8a7a','#8d6db6','#efe2d3'],
  ];
  const PAL = R.choice(PALETTES);

  // 3D helpers
  function rotX(p,a){ const s=Math.sin(a), c=Math.cos(a); return [p[0], c*p[1]-s*p[2], s*p[1]+c*p[2]]; }
  function rotY(p,a){ const s=Math.sin(a), c=Math.cos(a); return [c*p[0]+s*p[2], p[1], -s*p[0]+c*p[2]]; }
  function rotZ(p,a){ const s=Math.sin(a), c=Math.cos(a); return [c*p[0]-s*p[1], s*p[0]+c*p[1], p[2]]; }
  function normalize(v){ const m=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/m,v[1]/m,v[2]/m]; }
  function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }

  // Cube voxels
  const GRID = 16; const HALF=1;
  let voxels=[]; // {x,y,z,s,n,c,alive}
  function buildCube(){
    voxels=[];
    const step=(2*HALF)/GRID, s=step*0.92;
    const faces=[
      [0,0,1],[0,0,-1],[0,1,0],[0,-1,0],[1,0,0],[-1,0,0]
    ];
    for(let i=0;i<=GRID;i++){
      for(let j=0;j<=GRID;j++){
        const u = -HALF + i*step;
        const v = -HALF + j*step;
        for (let f=0; f<6; f++){
          const nx=faces[f][0], ny=faces[f][1], nz=faces[f][2];
          const x = nx? (nx>0? HALF:-HALF): u;
          const y = ny? (ny>0? HALF:-HALF): (nx? v : (nz? v : u));
          const z = nz? (nz>0? HALF:-HALF): (nx? v : (ny? v : u));
          voxels.push({x,y,z,s, n:[nx,ny,nz], c:R.choice(PAL), alive:true});
        }
      }
    }
  }
  buildCube();

  // camera/projection
  const cam={dist:3.8,fov:1.2};
  function project(p3){
    const [x,y,z]=p3; const d=(z+cam.dist); const k=cam.fov/d;
    const sx = cnv.width*0.5 + x*k*cnv.height*0.5;
    const sy = cnv.height*0.5 - y*k*cnv.height*0.5;
    return [sx,sy,Math.max(0.0001,k)];
  }

  // physics & states
  let ang=[0.7,0.9,0.1], av=[0,0,0];
  const damping=0.992; // chunky clay has drag
  const light = normalize([0.4,0.9,0.3]);

  // ground plane (world y = -1.25)
  const GROUND_Y = -1.25;
  // pieces (clay blobs)
  let blobs=[]; // {x,y,z,vx,vy,vz,size,wet,rot}
  function spawnBlob(v,n=1){
    for(let k=0;k<n;k++){
      const jitter=0.12;
      const x=v.x + R.range(-jitter,jitter);
      const y=v.y + R.range(-jitter,jitter);
      const z=v.z + R.range(-jitter,jitter);
      const out = normalize([x,y,z]);
      const speed = R.range(0.01,0.03);
      const vx = out[0]*speed + R.range(-0.01,0.01);
      const vy = out[1]*speed + R.range(-0.01,0.01);
      const vz = out[2]*speed + R.range(-0.01,0.01);
      blobs.push({x,y,z,vx,vy,vz,size:R.range(0.09,0.15),wet:1.0,rot:R.range(0,Math.PI*2),col:v.c});
    }
  }

  // disintegration timing (total ~5min baseline)
  const totalTime = 5*60*1000;
  let t0=performance.now(); let liveCount=voxels.length;
  function progress(now){ return Math.min(1,(now-t0)/totalTime); }
  function peel(n){
    for(let r=0;r<n;r++){
      let idx, tries=0; do{ idx=(R.rnd()*voxels.length)|0; tries++; if(tries>2000) return; }while(!voxels[idx].alive);
      const v=voxels[idx]; v.alive=false; liveCount--;
      spawnBlob(v, 1 + (R.rnd()*2|0));
    }
  }

  // interaction
  let dragging=false,lastX=0,lastY=0;
  function setPtr(e){ const t=(e.touches&&e.touches[0])||e; lastX=t.clientX; lastY=t.clientY; }
  function fling(e){
    const t=(e.touches&&e.touches[0])||e;
    const dx=t.clientX-lastX, dy=t.clientY-lastY;
    lastX=t.clientX; lastY=t.clientY;
    const gain=0.002; av[1]+=-dx*gain; av[0]+=dy*gain; av[2]+=(dx-dy)*gain*0.2;
    if (Math.hypot(dx,dy)>8) peel(5 + (Math.hypot(dx,dy)/8|0)); // shake clay off
  }
  cnv.addEventListener('pointerdown', e=>{ dragging=true; setPtr(e); });
  cnv.addEventListener('pointermove', e=>{ if(dragging) fling(e); });
  addEventListener('pointerup', ()=>{ dragging=false; });
  cnv.addEventListener('touchstart', e=>{ dragging=true; setPtr(e); }, {passive:true});
  cnv.addEventListener('touchmove',  e=>{ if(dragging) fling(e); }, {passive:true});
  addEventListener('touchend', ()=>{ dragging=false; }, {passive:true});

  // helpers
  function shadeColor(hex, k){
    const n = parseInt(hex.slice(1),16);
    let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    r=Math.max(0,Math.min(255,Math.floor(r*k))); g=Math.max(0,Math.min(255,Math.floor(g*k))); b=Math.max(0,Math.min(255,Math.floor(b*k)));
    return `rgb(${r},${g},${b})`;
  }

  function loop(now){
    fit();
    const w=cnv.width,h=cnv.height;
    // warm background + ground
    const bg = ctx.createLinearGradient(0,0,0,h);
    bg.addColorStop(0,'#231f1d'); bg.addColorStop(1,'#151312');
    ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);

    // update rotation
    ang[0]+=av[0]; ang[1]+=av[1]; ang[2]+=av[2];
    av[0]*=damping; av[1]*=damping; av[2]*=damping;

    // schedule peeling based on time + spin
    const spinMag = Math.abs(av[0])+Math.abs(av[1])+Math.abs(av[2]);
    const prog = progress(now);
    const baseTarget = Math.floor(voxels.length*prog);
    const currentDead = voxels.length - liveCount;
    let toRemove = baseTarget - currentDead;
    toRemove += Math.min(80, Math.floor(spinMag*180));
    if (toRemove>0) peel(toRemove);

    // auto slow spin
    const ax=ang[0]+0.0005*now/16, ay=ang[1]+0.0004*now/16, az=ang[2]+0.0003*now/16;

    // update/draw blobs (physics with gravity & drying)
    // ground in screen space
    const groundProj = (p)=>{
      const d = (GROUND_Y + cam.dist);
      const k = cam.fov/d;
      return cnv.height*0.5 - GROUND_Y*k*cnv.height*0.5;
    };
    const gyScreen = groundProj();
    for (let i=0;i<blobs.length;i++){
      const b=blobs[i];
      // gravity in world Y
      b.vy -= 0.00025; // down
      b.vx *= 0.998; b.vy *= 0.998; b.vz *= 0.998;
      b.x += b.vx; b.y += b.vy; b.z += b.vz;
      // collide with ground plane
      if (b.y <= GROUND_Y){
        b.y = GROUND_Y;
        b.vy *= -0.2; // low bounce (clay)
        b.vx *= 0.85; b.vz *= 0.85;
        // squish on impact
        b.size *= 1.02;
        b.wet *= 0.97;
      }
      // dry over time
      b.wet *= 0.999;
    }
    // draw blobs (behind cube and also those on ground)
    for (const b of blobs){
      // project
      const pr = project([b.x,b.y,b.z]);
      const s = Math.max(1, b.size * pr[2] * h * 0.55);
      const moist = Math.max(0, Math.min(1, b.wet));
      // wetter -> brighter & saturated, dryer -> darker/gray
      const base = b.col;
      const k = 0.7 + 0.5*moist;
      ctx.fillStyle = shadeColor(base, k);
      // if on ground, draw flatten ellipse effect using rectangles for performance
      if (b.y <= GROUND_Y + 0.001){
        const squish = 1.4 - 0.6*moist;
        ctx.fillRect(pr[0]-s*squish/2, pr[1]-s*0.4/2, s*squish, s*0.4);
        // small darker rim
        ctx.fillStyle = shadeColor(base, 0.6);
        ctx.globalAlpha = 0.25*(1-moist);
        ctx.fillRect(pr[0]-s*squish/2, pr[1]-s*0.4/2, s*squish, 2);
        ctx.fillRect(pr[0]-s*squish/2, pr[1]+s*0.4/2-2, s*squish, 2);
        ctx.globalAlpha = 1;
      } else {
        ctx.fillRect(pr[0]-s/2, pr[1]-s/2, s, s);
      }
    }

    // draw live cube voxels (matte clay shading), back-to-front
    let drawList=[];
    for (const v of voxels){
      if (!v.alive) continue;
      let p=[v.x,v.y,v.z];
      p=rotX(p,ax); p=rotY(p,ay); p=rotZ(p,az);
      let n=[...v.n];
      n=rotX(n,ax); n=rotY(n,ay); n=rotZ(n,az);
      drawList.push({p:p,n:n,s:v.s,c:v.c});
    }
    drawList.sort((a,b)=> a.p[2]-b.p[2]);
    for (const it of drawList){
      const pr = project(it.p);
      const s = Math.max(1, it.s * pr[2] * h * 0.55);
      const l = Math.max(0.1, dot(normalize(it.n), light));
      // clay = soft diffuse shading
      const k = 0.9*l + 0.55;
      ctx.fillStyle = shadeColor(it.c, k);
      ctx.fillRect(pr[0]-s/2, pr[1]-s/2, s, s);
      // tiny dark edge for chunkiness
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.fillRect(pr[0]-s/2, pr[1]-s/2, s, 1);
      ctx.fillRect(pr[0]-s/2, pr[1]+s/2-1, s, 1);
      ctx.fillRect(pr[0]-s/2, pr[1]-s/2, 1, s);
      ctx.fillRect(pr[0]+s/2-1, pr[1]-s/2, 1, s);
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
