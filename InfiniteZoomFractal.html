<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Infinite Zoom Fractal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { margin: 0; background: #000; }
    canvas { touch-action: none; }
  </style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


  <div id="root"></div>

  <script type="text/babel">
    const { useRef, useEffect, useState } = React;

    const InfiniteZoomFractal = () => {
      const canvasRef = useRef(null);
      const [zoom, setZoom] = useState(1);
      const [offsetX, setOffsetX] = useState(0);
      const [offsetY, setOffsetY] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const [lastPos, setLastPos] = useState({ x: 0, y: 0 });

      const drawSierpinski = (ctx, x1, y1, x2, y2, x3, y3, depth) => {
        if (depth === 0) {
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.lineTo(x3, y3);
          ctx.closePath();
          ctx.fill();
          return;
        }

        const mx1 = (x1 + x2) / 2;
        const my1 = (y1 + y2) / 2;
        const mx2 = (x2 + x3) / 2;
        const my2 = (y2 + y3) / 2;
        const mx3 = (x3 + x1) / 2;
        const my3 = (y3 + y1) / 2;

        drawSierpinski(ctx, x1, y1, mx1, my1, mx3, my3, depth - 1);
        drawSierpinski(ctx, mx1, my1, x2, y2, mx2, my2, depth - 1);
        drawSierpinski(ctx, mx3, my3, mx2, my2, x3, y3, depth - 1);
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.translate(width / 2 + offsetX, height / 2 + offsetY);
        ctx.scale(zoom, zoom);
        ctx.translate(-width / 2, -height / 2);

        ctx.fillStyle = 'black';

        const depth = Math.min(Math.floor(Math.log2(zoom) + 5), 12);
        const size = 400;
        const centerX = width / 2;
        const centerY = height / 2 + 100;

        drawSierpinski(
          ctx,
          centerX, centerY - size,
          centerX - size * Math.sqrt(3) / 2, centerY + size / 2,
          centerX + size * Math.sqrt(3) / 2, centerY + size / 2,
          depth
        );

        ctx.restore();
      }, [zoom, offsetX, offsetY]);

      const handleWheel = (e) => {
        e.preventDefault();
        const delta = e.deltaY * -0.001;
        const newZoom = Math.max(0.5, Math.min(zoom * (1 + delta), 1000));
        setZoom(newZoom);
      };

      const handleMouseDown = (e) => {
        setIsDragging(true);
        setLastPos({ x: e.clientX, y: e.clientY });
      };

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastPos.x;
        const dy = e.clientY - lastPos.y;
        setOffsetX(prev => prev + dx);
        setOffsetY(prev => prev + dy);
        setLastPos({ x: e.clientX, y: e.clientY });
      };

      const handleMouseUp = () => setIsDragging(false);

      const handleZoomIn = () => setZoom(z => Math.min(z * 1.5, 1000));
      const handleZoomOut = () => setZoom(z => Math.max(z / 1.5, 0.5));
      const handleReset = () => { setZoom(1); setOffsetX(0); setOffsetY(0); };

      return (
        <div className="w-full h-screen bg-gray-900 flex flex-col items-center justify-center">
          <div className="mb-4 flex gap-4">
            <button onClick={handleZoomIn} className="px-4 py-2 bg-white text-black rounded">Zoom In</button>
            <button onClick={handleZoomOut} className="px-4 py-2 bg-white text-black rounded">Zoom Out</button>
            <button onClick={handleReset} className="px-4 py-2 bg-gray-600 text-white rounded">Reset</button>
          </div>
          <div className="text-white mb-2">
            Zoom: {zoom.toFixed(2)}x | Scroll to zoom, drag to pan
          </div>
          <canvas
            ref={canvasRef}
            width={800}
            height={600}
            onWheel={handleWheel}
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
            className="border-4 border-white cursor-move"
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<InfiniteZoomFractal />);
  </script>
</body>
</html>
