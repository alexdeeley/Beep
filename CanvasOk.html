<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Canvas Check</title>
<style>html,body{margin:0;background:#000;height:100%;touch-action:none}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>

<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');function fit(){c.width=innerWidth*devicePixelRatio; c.height=innerHeight*devicePixelRatio;} addEventListener('resize',fit); fit();
let stars=[...Array(300)].map((_,i)=>({x:Math.random()*c.width,y:Math.random()*c.height,z:Math.random()*1+0.2}));
function loop(t){x.fillStyle='#000';x.fillRect(0,0,c.width,c.height); for(const s of stars){s.x+= (s.z*0.3); if(s.x>c.width) s.x=0; x.fillStyle='rgba(255,255,255,'+(0.3+0.7*s.z)+')'; x.fillRect(s.x,s.y, 2*s.z,2*s.z);} requestAnimationFrame(loop);} requestAnimationFrame(loop);
</script>
</body></html>
