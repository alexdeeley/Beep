<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>T. rex Tag</title>
<style>
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; overscroll-behavior: none;
    background: #7ec850;
    font-family: 'Comic Sans MS', 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #game { display: block; position: fixed; inset: 0; touch-action: none; }

  #hud {
    position: fixed; left: 0; right: 0; top: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: calc(var(--safe-top) + 10px) 14px 0 54px; /* left padding clears the injected gallery back button */
    pointer-events: none; z-index: 5;
  }
  .pill {
    background: rgba(255,255,255,0.9);
    border: 3px solid #fff;
    border-radius: 999px;
    padding: 8px 16px;
    font-weight: bold;
    font-size: 22px;
    color: #444;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    display: flex; align-items: center; gap: 6px;
  }
  #heartsDisplay { color: #e0455a; }
  #starsDisplay { color: #d6a812; }

  #muteBtn {
    position: fixed; right: 14px; bottom: calc(var(--safe-bottom) + 14px);
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,0.9); border: 3px solid #fff;
    font-size: 24px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15); z-index: 6; cursor: pointer;
  }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    background: radial-gradient(circle at 50% 30%, #a3e6b0, #58b368 70%);
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: 54px; color: #2d6a2f; text-shadow: 3px 3px 0 #fff, 0 6px 10px rgba(0,0,0,0.15);
    margin: 0 0 6px 0; line-height: 1.05;
  }
  .subtitle { font-size: 20px; color: #2d6a2f; margin: 0 0 26px 0; max-width: 340px; font-weight: bold; }
  .bigBtn {
    font-family: inherit; font-size: 30px; font-weight: bold; color: #fff;
    background: linear-gradient(180deg, #ff9a3c, #f5730a);
    border: 5px solid #fff; border-radius: 50px;
    padding: 18px 46px; box-shadow: 0 8px 0 #c65502, 0 14px 20px rgba(0,0,0,0.2);
    cursor: pointer; transition: transform 0.08s;
    animation: pulseBtn 1.4s ease-in-out infinite;
  }
  .bigBtn:active { transform: translateY(6px); box-shadow: 0 2px 0 #c65502; }
  @keyframes pulseBtn { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  .emojiRow { font-size: 46px; margin-bottom: 10px; }
  .statLine { font-size: 22px; color: #2d6a2f; font-weight: bold; margin-bottom: 18px; }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="game"></canvas>

<div id="hud">
  <div class="pill" id="heartsDisplay">❤️ <span id="heartsCount">20</span></div>
  <div class="pill" id="starsDisplay">⭐ <span id="starsCount">0</span>/10</div>
</div>

<div id="muteBtn">🔊</div>

<div class="overlay" id="startScreen">
  <div class="emojiRow">🦖✨</div>
  <h1 class="title">T. rex Tag</h1>
  <p class="subtitle">Drag your finger to run! Hide in the glowing circles to find stars. Collect 10 stars to win — but watch out, more T. rexes join the chase!</p>
  <button class="bigBtn" id="startBtn">START</button>
</div>

<div class="overlay hidden" id="gameOverScreen">
  <div class="emojiRow">🦖💤</div>
  <h1 class="title" style="color:#a24b2d; text-shadow:3px 3px 0 #fff;">Oh no!</h1>
  <p class="statLine" id="goStat">The T. rex got you!</p>
  <button class="bigBtn" id="retryBtn">TRY AGAIN</button>
</div>

<div class="overlay hidden" id="winScreen">
  <div class="emojiRow">🏆🎉</div>
  <h1 class="title">You Win!</h1>
  <p class="statLine" id="winStat">You collected 10 stars!</p>
  <button class="bigBtn" id="playAgainBtn">PLAY AGAIN</button>
</div>

<script>
(function(){
  "use strict";

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const winScreen = document.getElementById('winScreen');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const heartsCountEl = document.getElementById('heartsCount');
  const starsCountEl = document.getElementById('starsCount');
  const muteBtn = document.getElementById('muteBtn');
  const goStat = document.getElementById('goStat');
  const winStat = document.getElementById('winStat');

  let W = 0, H = 0, DPR = 1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layoutWorld();
  }

  // ---------- World layout ----------
  const ZONE_DEFS = [
    { fx: 0.18, fy: 0.30 },
    { fx: 0.82, fy: 0.28 },
    { fx: 0.20, fy: 0.80 },
    { fx: 0.80, fy: 0.80 }
  ];
  const EGG_DEF = { fx: 0.5, fy: 0.14, fr: 0.15 };
  const ZONE_FR = 0.115;

  let safeZones = [];
  let eggGym = null;
  let TREES = [];
  let TWINKLES = [];

  function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2, y1-y2); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  function layoutWorld(){
    const m = Math.min(W, H);
    safeZones = ZONE_DEFS.map((z, i) => ({
      x: z.fx * W, y: z.fy * H, r: ZONE_FR * m, id: i, phase: i * 1.7
    }));
    eggGym = { x: EGG_DEF.fx * W, y: EGG_DEF.fy * H, r: EGG_DEF.fr * m };

    if (TREES.length === 0) {
      let attempts = 0;
      while (TREES.length < 9 && attempts < 200) {
        attempts++;
        const fx = 0.06 + Math.random() * 0.88;
        const fy = 0.06 + Math.random() * 0.88;
        let ok = true;
        const allZ = [...ZONE_DEFS, EGG_DEF];
        for (const z of allZ) {
          if (Math.hypot(fx - z.fx, fy - z.fy) < 0.16) { ok = false; break; }
        }
        if (ok) TREES.push({ fx, fy, s: 0.7 + Math.random() * 0.6 });
      }
    }
    if (TWINKLES.length === 0) {
      for (let i = 0; i < 36; i++) {
        TWINKLES.push({ fx: Math.random(), fy: Math.random(), phase: Math.random() * Math.PI * 2, spd: 1 + Math.random() * 1.5 });
      }
    }
  }

  // ---------- Audio ----------
  let audioCtx = null;
  let muted = false;
  let musicTimer = null;
  let melodyIndex = 0;

  function initAudio(){
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    scheduleMusic();
  }

  function playTone(freq, dur, type, vol, delay){
    if (!audioCtx || muted) return;
    type = type || 'sine'; vol = vol == null ? 0.15 : vol; delay = delay || 0;
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }

  function playFootstep(){
    playTone(90 + Math.random() * 25, 0.08, 'triangle', 0.07);
  }

  function playRoar(){
    if (!audioCtx || muted) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(240, t0);
    osc.frequency.exponentialRampToValueAtTime(65, t0 + 0.35);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(0.22, t0 + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + 0.42);
    playTone(520, 0.14, 'square', 0.1, 0.36);
    playTone(700, 0.12, 'square', 0.08, 0.46);
  }

  function playCollect(){
    [880, 1108, 1318].forEach((f, i) => playTone(f, 0.18, 'sine', 0.16, i * 0.05));
  }

  function playHatchCheer(){
    playTone(300, 0.08, 'square', 0.14);
    [660, 880, 990].forEach((f, i) => playTone(f, 0.15, 'triangle', 0.12, 0.08 + i * 0.06));
  }

  function playVictory(){
    [523, 659, 784, 1046, 1318].forEach((f, i) => playTone(f, 0.32, 'triangle', 0.18, i * 0.13));
  }

  function playGameOverSound(){
    [440, 392, 349, 294].forEach((f, i) => playTone(f, 0.32, 'sine', 0.14, i * 0.16));
  }

  const MELODY = [
    [523,0.3],[587,0.3],[659,0.3],[784,0.6],
    [659,0.3],[587,0.3],[523,0.3],[392,0.6],
    [440,0.3],[523,0.3],[587,0.3],[659,0.6],
    [587,0.3],[523,0.3],[440,0.3],[392,0.6]
  ];
  function scheduleMusic(){
    if (!audioCtx) return;
    const [freq, dur] = MELODY[melodyIndex % MELODY.length];
    playTone(freq, dur * 0.9, 'sine', 0.055);
    playTone(freq * 2, dur * 0.9, 'sine', 0.018);
    melodyIndex++;
    musicTimer = setTimeout(scheduleMusic, dur * 1000);
  }

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // ---------- Game state ----------
  let gameState = 'start'; // start | playing | win | gameover
  let elapsed = 0;
  let hearts = 20, starsCollected = 0;
  let screenFlash = 0;
  let addedRexThresholds = [];
  let lastHatchTime = -999;
  let allHatchedTime = null;

  const player = { x: 0, y: 0, r: 20, facing: 1, touching: false, lastFoot: 0, invincible: 0, bobPhase: 0 };
  let rexes = [];
  let stars = [];
  let eggs = [];
  let babyDinos = [];
  let particles = [];

  const BABY_COLORS = ['#ff8fb1', '#8fd3ff', '#c9a6ff', '#ffe08a', '#9be89b'];

  function pickBabyColor(){ return BABY_COLORS[Math.floor(Math.random() * BABY_COLORS.length)]; }

  function eggPos(egg){
    return {
      x: eggGym.x + Math.cos(egg.angle) * eggGym.r * 0.5,
      y: eggGym.y + Math.sin(egg.angle) * eggGym.r * 0.5
    };
  }

  function spawnRex(index){
    const corners = [
      { x: 40, y: 40 }, { x: W - 40, y: 40 },
      { x: 40, y: H - 40 }, { x: W - 40, y: H - 40 }
    ];
    const c = corners[index % corners.length];
    rexes.push({
      x: c.x, y: c.y, r: 27,
      speed: 92 + Math.random() * 18,
      wobblePhase: Math.random() * Math.PI * 2,
      wobbleFreq: 0.9 + Math.random() * 0.6,
      legPhase: Math.random() * 10,
      facing: 1, roar: 0
    });
  }

  function spawnStarInZone(zone){
    const ang = Math.random() * Math.PI * 2;
    const rad = Math.random() * (zone.r * 0.55);
    stars.push({
      x: zone.x + Math.cos(ang) * rad,
      y: zone.y + Math.sin(ang) * rad,
      r: 14, spin: 0, bobPhase: Math.random() * 10
    });
  }

  function ensureStars(){
    const remaining = 10 - starsCollected;
    const desired = Math.min(3, remaining);
    while (stars.length < desired) {
      const zone = safeZones[Math.floor(Math.random() * safeZones.length)];
      spawnStarInZone(zone);
    }
  }

  function initEggs(){
    eggs = [0,1,2,3].map(i => ({ angle: (i / 4) * Math.PI * 2 + 0.4, state: 'egg' }));
  }

  function spawnConfetti(x, y, count){
    const colors = ['#ff5e7e','#ffd23f','#5ec8ff','#7ee08c','#c98bff','#ff9d4d'];
    for (let i = 0; i < count; i++) {
      if (particles.length > 320) break;
      const ang = Math.random() * Math.PI * 2;
      const spd = 60 + Math.random() * 130;
      particles.push({
        x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 90,
        life: 1 + Math.random() * 0.7,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: 4 + Math.random() * 4,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 10
      });
    }
  }

  function updateParticles(dt){
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 220 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vrot * dt;
      p.life -= dt;
      if (p.life <= 0 || p.y > H + 40) particles.splice(i, 1);
    }
  }

  function drawParticles(){
    particles.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }

  function resetGame(){
    hearts = 20; starsCollected = 0; elapsed = 0;
    screenFlash = 0; addedRexThresholds = [];
    lastHatchTime = -999; allHatchedTime = null;
    player.x = W * 0.5; player.y = H * 0.55;
    player.invincible = 0; player.touching = false;
    rexes = []; spawnRex(0);
    stars = []; ensureStars();
    initEggs();
    babyDinos = [];
    particles = [];
    updateHUD();
  }

  function updateHUD(){
    heartsCountEl.textContent = Math.max(0, hearts);
    starsCountEl.textContent = starsCollected;
  }

  function onStarCollected(){
    starsCollected++; hearts++;
    playCollect();
    ensureStars();
    updateHUD();
    if ([3,6,9].includes(starsCollected) && !addedRexThresholds.includes(starsCollected)) {
      addedRexThresholds.push(starsCollected);
      spawnRex(rexes.length);
    }
    if (starsCollected >= 10) triggerWin();
  }

  function triggerWin(){
    gameState = 'win';
    playVictory();
    winStat.textContent = 'You collected 10 stars with ' + Math.max(0,hearts) + ' hearts to spare!';
    winScreen.classList.remove('hidden');
    for (let i = 0; i < 12; i++) spawnConfetti(Math.random() * W, -20, 12);
  }

  function triggerGameOver(){
    gameState = 'gameover';
    playGameOverSound();
    goStat.textContent = 'You made it to ' + starsCollected + ' star' + (starsCollected===1?'':'s') + '. Try again!';
    gameOverScreen.classList.remove('hidden');
  }

  // ---------- Input ----------
  function movePlayerTo(cx, cy){
    const rect = canvas.getBoundingClientRect();
    let x = cx - rect.left, y = cy - rect.top;
    x = clamp(x, player.r, W - player.r);
    y = clamp(y, player.r, H - player.r);
    const dx = x - player.x;
    if (dx < -1) player.facing = -1;
    else if (dx > 1) player.facing = 1;
    const moved = Math.hypot(dx, y - player.y);
    player.x = x; player.y = y;
    if (moved > 2) {
      const now = performance.now();
      if (now - player.lastFoot > 220) { playFootstep(); player.lastFoot = now; }
    }
  }

  canvas.addEventListener('pointerdown', e => {
    if (gameState !== 'playing') return;
    player.touching = true;
    movePlayerTo(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointermove', e => {
    if (gameState !== 'playing' || !player.touching) return;
    movePlayerTo(e.clientX, e.clientY);
  });
  window.addEventListener('pointerup', () => { player.touching = false; });
  window.addEventListener('pointercancel', () => { player.touching = false; });

  startBtn.addEventListener('click', () => {
    initAudio();
    resetGame();
    gameState = 'playing';
    startScreen.classList.add('hidden');
  });
  retryBtn.addEventListener('click', () => {
    resetGame();
    gameState = 'playing';
    gameOverScreen.classList.add('hidden');
  });
  playAgainBtn.addEventListener('click', () => {
    resetGame();
    gameState = 'playing';
    winScreen.classList.add('hidden');
  });

  // ---------- Update ----------
  function steerRex(rex, dt){
    const dx = player.x - rex.x, dy = player.y - rex.y;
    const d = Math.hypot(dx, dy) || 1;
    let dirx = dx / d, diry = dy / d;

    rex.wobblePhase += dt * rex.wobbleFreq;
    const wob = Math.sin(rex.wobblePhase) * 0.3;
    const c = Math.cos(wob), s = Math.sin(wob);
    let wdx = dirx * c - diry * s;
    let wdy = dirx * s + diry * c;
    let vx = wdx * rex.speed, vy = wdy * rex.speed;

    const zones = [...safeZones, eggGym];
    for (const z of zones) {
      const nx = rex.x + vx * dt, ny = rex.y + vy * dt;
      const dz = Math.hypot(nx - z.x, ny - z.y);
      const minD = z.r + rex.r + 8;
      if (dz < minD) {
        const ox = rex.x - z.x, oy = rex.y - z.y;
        const od = Math.hypot(ox, oy) || 1;
        const nxo = ox / od, nyo = oy / od;
        let tx = -nyo, ty = nxo;
        if (tx * wdx + ty * wdy < 0) { tx = -tx; ty = -ty; }
        vx = tx * rex.speed; vy = ty * rex.speed;
      }
    }

    if (vx < -5) rex.facing = -1; else if (vx > 5) rex.facing = 1;
    rex.x = clamp(rex.x + vx * dt, rex.r, W - rex.r);
    rex.y = clamp(rex.y + vy * dt, rex.r, H - rex.r);
    rex.legPhase += dt * 9;
  }

  function update(dt){
    elapsed += dt;

    if (player.invincible > 0) player.invincible -= dt;
    if (screenFlash > 0) screenFlash -= dt * 2.2;
    player.bobPhase += dt * (player.touching ? 10 : 3);

    for (const rex of rexes) {
      steerRex(rex, dt);
      if (rex.roar > 0) rex.roar -= dt;
      if (player.invincible <= 0) {
        const d = dist(rex.x, rex.y, player.x, player.y);
        if (d < rex.r + player.r - 6) {
          hearts--;
          player.invincible = 1.5;
          screenFlash = 1;
          rex.roar = 0.4;
          playRoar();
          const ang = Math.atan2(player.y - rex.y, player.x - rex.x);
          player.x = clamp(player.x + Math.cos(ang) * 90, player.r, W - player.r);
          player.y = clamp(player.y + Math.sin(ang) * 90, player.r, H - player.r);
          updateHUD();
          if (hearts <= 0) { triggerGameOver(); return; }
        }
      }
    }

    for (let i = stars.length - 1; i >= 0; i--) {
      const st = stars[i];
      st.spin += dt * 2.2; st.bobPhase += dt * 3;
      if (dist(st.x, st.y, player.x, player.y) < st.r + player.r - 4) {
        stars.splice(i, 1);
        onStarCollected();
        if (gameState !== 'playing') return;
      }
    }
    ensureStars();

    const inEgg = dist(player.x, player.y, eggGym.x, eggGym.y) < eggGym.r;
    if (inEgg) {
      if (elapsed - lastHatchTime > 1.1) {
        const unhatched = eggs.find(e => e.state === 'egg');
        if (unhatched) {
          unhatched.state = 'hatched';
          lastHatchTime = elapsed;
          const pos = eggPos(unhatched);
          babyDinos.push({ x: pos.x, y: pos.y, phase: Math.random() * 10, color: pickBabyColor(), cheer: 1 });
          spawnConfetti(pos.x, pos.y, 14);
          playHatchCheer();
        }
      }
      babyDinos.forEach(b => b.cheer = 1);
    }
    babyDinos.forEach(b => { b.phase += dt * 4; if (b.cheer > 0) b.cheer -= dt * 0.6; });

    if (eggs.length && eggs.every(e => e.state === 'hatched')) {
      if (allHatchedTime === null) allHatchedTime = elapsed;
      if (elapsed - allHatchedTime > 16 && !inEgg) {
        eggs.forEach(e => e.state = 'egg');
        babyDinos = [];
        allHatchedTime = null;
      }
    } else {
      allHatchedTime = null;
    }

    if (gameState === 'win' && Math.random() < 0.35) {
      spawnConfetti(Math.random() * W, -20, 3);
    }

    updateParticles(dt);
  }

  // ---------- Drawing ----------
  function drawStarShape(x, y, outerR, innerR, rot, fill){
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? outerR : innerR;
      const a = (Math.PI / 5) * i - Math.PI / 2;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();
  }

  function drawBackground(){
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#8fdc6b');
    g.addColorStop(1, '#5fae43');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    TWINKLES.forEach(t => {
      const op = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(elapsed * t.spd + t.phase));
      ctx.globalAlpha = op;
      drawStarShape(t.fx * W, t.fy * H, 3.5, 1.5, t.phase, '#ffffff');
    });
    ctx.globalAlpha = 1;

    TREES.forEach(t => {
      const x = t.fx * W, y = t.fy * H, s = t.s;
      ctx.save();
      ctx.translate(x, y); ctx.scale(s, s);
      ctx.fillStyle = '#7a4a2b';
      ctx.fillRect(-6, -6, 12, 30);
      ctx.fillStyle = '#3f9142';
      ctx.beginPath(); ctx.arc(0, -30, 26, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4fae55';
      ctx.beginPath(); ctx.arc(-14, -18, 17, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(14, -18, 17, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }

  function drawSafeZones(){
    safeZones.forEach(z => {
      const pulse = 1 + 0.05 * Math.sin(elapsed * 2 + z.phase);
      const r = z.r * pulse;
      const grad = ctx.createRadialGradient(z.x, z.y, r * 0.2, z.x, z.y, r);
      grad.addColorStop(0, 'rgba(180,255,220,0.55)');
      grad.addColorStop(1, 'rgba(120,220,255,0.05)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(z.x, z.y, r, 0, Math.PI * 2); ctx.fill();

      ctx.setLineDash([10, 8]);
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(z.x, z.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);

      for (let i = 0; i < 5; i++) {
        const a = elapsed * 0.6 + i * (Math.PI * 2 / 5);
        const sx = z.x + Math.cos(a) * r * 0.92;
        const sy = z.y + Math.sin(a) * r * 0.92;
        drawStarShape(sx, sy, 5, 2, a, 'rgba(255,255,255,0.9)');
      }
    });
  }

  function drawEggGymFence(){
    const z = eggGym;
    ctx.save();
    const grad = ctx.createRadialGradient(z.x, z.y, z.r * 0.2, z.x, z.y, z.r);
    grad.addColorStop(0, 'rgba(255,214,240,0.55)');
    grad.addColorStop(1, 'rgba(255,214,240,0.05)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.fill();

    const postCount = 16;
    for (let i = 0; i < postCount; i++) {
      const a = (i / postCount) * Math.PI * 2;
      const px = z.x + Math.cos(a) * z.r;
      const py = z.y + Math.sin(a) * z.r;
      ctx.fillStyle = '#f6c9e0';
      ctx.fillRect(px - 3, py - 12, 6, 22);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(px, py - 12, 4, 0, Math.PI * 2); ctx.fill();
    }

    ctx.font = 'bold 20px "Comic Sans MS", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#a24b8a';
    ctx.fillText('🥚 Egg Gym 🥚', z.x, z.y - z.r - 14);
    ctx.restore();
  }

  function drawEggs(){
    eggs.forEach((egg, i) => {
      if (egg.state !== 'egg') return;
      const p = eggPos(egg);
      const wob = Math.sin(elapsed * 3 + i) * 0.08;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(wob);
      ctx.fillStyle = '#fff8ec';
      ctx.beginPath();
      ctx.ellipse(0, 0, 14, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd9ec';
      ctx.beginPath(); ctx.arc(-4, -4, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(5, 3, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(2, -8, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }

  function drawBabyDino(b){
    const bob = Math.sin(b.phase) * 3;
    const cheering = b.cheer > 0;
    ctx.save();
    ctx.translate(b.x, b.y + bob);
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.ellipse(0, 4, 12, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -10, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4, -12, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -12, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(-4, -12, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -12, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, -7, 3, 0, Math.PI); ctx.stroke();

    ctx.strokeStyle = b.color; ctx.lineWidth = 3; ctx.lineCap = 'round';
    const armAngle = cheering ? -2.2 : -0.5;
    ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(-9 + Math.cos(armAngle) * 8, Math.sin(armAngle) * 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(9 - Math.cos(armAngle) * 8, Math.sin(armAngle) * 8); ctx.stroke();
    ctx.restore();

    if (cheering) {
      ctx.save();
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.globalAlpha = Math.max(0, b.cheer);
      ctx.fillText('🎉', b.x, b.y + bob - 26);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  function drawStarsWorld(){
    stars.forEach(st => {
      const bob = Math.sin(st.bobPhase) * 4;
      drawStarShape(st.x, st.y + bob, st.r, st.r * 0.45, st.spin, '#ffe15a');
      ctx.save();
      ctx.globalAlpha = 0.5;
      drawStarShape(st.x, st.y + bob, st.r * 1.6, st.r * 0.7, -st.spin * 0.6, '#fff6c8');
      ctx.restore();
    });
  }

  function drawPlayer(){
    const bob = player.touching ? Math.sin(player.bobPhase) * 3 : Math.sin(player.bobPhase) * 1;
    const squish = player.touching ? 1 + Math.sin(player.bobPhase * 2) * 0.04 : 1;
    ctx.save();
    ctx.translate(player.x, player.y + bob);
    ctx.scale(player.facing, 1);

    if (player.invincible > 0 && Math.floor(elapsed * 12) % 2 === 0) {
      ctx.globalAlpha = 0.45;
    }

    ctx.fillStyle = '#5aa9e6';
    ctx.beginPath();
    ctx.ellipse(0, 10, 13 * squish, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#3f7d3d';
    ctx.fillRect(-15, -2, 8, 14);

    ctx.fillStyle = '#ffd8a8';
    ctx.beginPath(); ctx.arc(0, -8, 14, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#7a4a2b';
    ctx.beginPath(); ctx.arc(0, -16, 13, Math.PI, 0); ctx.fill();
    ctx.fillRect(-13, -18, 26, 6);

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(5, -9, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(6, -9, 2, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = '#c9791f'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(1, -3, 4, 0.2, Math.PI - 0.2); ctx.stroke();

    const legSwing = player.touching ? Math.sin(elapsed * 14) * 8 : 0;
    ctx.strokeStyle = '#5aa9e6'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-5, 18); ctx.lineTo(-5 + legSwing, 26); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5, 18); ctx.lineTo(5 - legSwing, 26); ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawRex(rex){
    const legSwing = Math.sin(rex.legPhase) * 12;
    ctx.save();
    ctx.translate(rex.x, rex.y);
    ctx.scale(rex.facing, 1);

    ctx.strokeStyle = '#4caf50'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-10, 10); ctx.lineTo(-10 + legSwing, 24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, 10); ctx.lineTo(6 - legSwing, 24); ctx.stroke();

    ctx.fillStyle = '#3fa14a';
    ctx.beginPath();
    ctx.moveTo(-22, 14);
    ctx.quadraticCurveTo(-34 + Math.sin(rex.legPhase * 0.8) * 4, 18, -30, -2);
    ctx.quadraticCurveTo(-24, -10, -16, -6);
    ctx.lineTo(-22, 14);
    ctx.fill();

    ctx.fillStyle = '#5fc768';
    ctx.beginPath();
    ctx.ellipse(0, 2, 24, 16, -0.15, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#bdf2c2';
    ctx.beginPath();
    ctx.ellipse(2, 8, 15, 8, -0.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#3fa14a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    const armSwing = Math.sin(rex.legPhase + 1.5) * 4;
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(16, 6 + armSwing); ctx.stroke();

    ctx.fillStyle = '#5fc768';
    ctx.beginPath();
    ctx.ellipse(22, -12, 15, 13, 0.1, 0, Math.PI * 2);
    ctx.fill();

    const mouthOpen = rex.roar > 0;
    ctx.fillStyle = mouthOpen ? '#c23b3b' : '#3fa14a';
    if (mouthOpen) {
      ctx.beginPath();
      ctx.moveTo(28, -6);
      ctx.lineTo(40, -2);
      ctx.lineTo(28, 6);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(29 + i * 3.5, -4 + i * 3);
        ctx.lineTo(31 + i * 3.5, -1 + i * 3);
        ctx.lineTo(29 + i * 3.5, 1 + i * 3);
        ctx.fill();
      }
    } else {
      ctx.beginPath();
      ctx.moveTo(30, -6);
      ctx.quadraticCurveTo(38, -2, 30, 3);
      ctx.quadraticCurveTo(34, -2, 30, -6);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(29, -3); ctx.lineTo(32, -1); ctx.lineTo(29, 1); ctx.fill();
    }

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(26, -17, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(27.5, -17, 2.3, 0, Math.PI * 2); ctx.fill();

    if (rex.roar > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(44 + i * 6, -2, 4 + i * 3, -0.5, 0.5);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function render(){
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawSafeZones();
    drawEggGymFence();
    drawEggs();
    babyDinos.forEach(drawBabyDino);
    drawStarsWorld();
    if (gameState !== 'start') drawPlayer();
    rexes.forEach(drawRex);
    drawParticles();

    if (screenFlash > 0) {
      ctx.fillStyle = 'rgba(255,70,70,' + (screenFlash * 0.32) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- Loop ----------
  let lastTime = 0;
  function loop(t){
    const dt = Math.min((t - lastTime) / 1000, 0.05) || 0;
    lastTime = t;
    if (gameState === 'playing' || gameState === 'win') {
      update(dt);
    }
    render();
    requestAnimationFrame(loop);
  }

  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  player.x = W * 0.5; player.y = H * 0.55;
  requestAnimationFrame(loop);
})();
</script>
</body>
