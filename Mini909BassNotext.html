<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>909</title>
<style>
  :root{--bg:#000;--fg:#fff;}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
  body{display:flex;align-items:stretch;justify-content:center;padding:10px}
  .app{width:min(980px,100%);border:3px solid var(--fg);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:10px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{width:56px;height:56px;border-radius:14px;border:2px solid var(--fg);background:#000;position:relative;touch-action:manipulation}
  .btn:active{transform:translateY(1px)}
  .btn.on{background:#fff}
  /* icon shapes (no text) */
  .play::before{content:"";position:absolute;left:22px;top:16px;width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent;border-left:18px solid #fff}
  .stop::before{content:"";position:absolute;left:18px;top:18px;width:20px;height:20px;background:#fff}
  .clear::before{content:"";position:absolute;left:18px;top:26px;width:20px;height:4px;background:#fff}
  .clear::after{content:"";position:absolute;left:18px;top:18px;width:20px;height:20px;border:2px solid #fff;border-bottom:0}
  .rand::before{content:"";position:absolute;inset:16px;border:2px solid #fff;border-radius:10px}
  .rand::after{content:"";position:absolute;left:18px;top:18px;width:20px;height:20px;border-left:2px solid #fff;border-top:2px solid #fff;transform:rotate(45deg);transform-origin:center}
  .slider{flex:1;min-width:180px;display:flex;gap:10px;align-items:center;border:2px solid var(--fg);border-radius:999px;padding:8px 12px}
  input[type=range]{width:100%;height:34px;accent-color:#fff}
  .grid{flex:1;overflow:auto;padding-bottom:6px}
  .row{display:grid;grid-template-columns:repeat(16,1fr);gap:6px;margin-bottom:8px}
  .step{height:44px;border:2px solid var(--fg);border-radius:12px;background:#000;position:relative;touch-action:manipulation}
  .step.on{background:#fff}
  .step.on::after{content:"";position:absolute;inset:9px;border-radius:9px;background:#000;opacity:0.16}
  .step.ph{outline:4px solid #fff;outline-offset:-4px}
  .step.ph.on{outline:4px solid #000;outline-offset:-4px;box-shadow: inset 0 0 0 3px #fff}
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


  <div class="app">
    <div class="bar">
      <button class="btn play" id="playBtn" aria-label="Play"></button>
      <button class="btn stop" id="stopBtn" aria-label="Stop"></button>
      <button class="btn clear" id="clearBtn" aria-label="Clear"></button>
      <button class="btn rand" id="randBtn" aria-label="Random"></button>
      <div class="slider"><input id="bpm" type="range" min="60" max="180" value="124" aria-label="BPM"></div>
      <div class="slider"><input id="swing" type="range" min="0" max="65" value="0" aria-label="Swing"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

<script>
(() => {
  // ---- Audio ----
  let ac=null, isPlaying=false, playStep=0, uiStep=-1, nextTime=0, timerId=null;
  const master={out:null, drum:null, bass:null};

  function ensureAudio(){
    if(ac) return;
    ac = new (window.AudioContext||window.webkitAudioContext)();
    master.out = ac.createGain(); master.out.gain.value=0.9; master.out.connect(ac.destination);
    master.drum = ac.createGain(); master.drum.gain.value=0.9; master.drum.connect(master.out);
    master.bass = ac.createGain(); master.bass.gain.value=0.9; master.bass.connect(master.out);
    const warm = ac.createOscillator(); const g = ac.createGain(); g.gain.value=0.00001;
    warm.connect(g).connect(master.out); warm.start(); warm.stop(ac.currentTime+0.02);
  }
  const now=()=>ac.currentTime;

  // ---- 909-ish drum synth (no samples) ----
  function kick(t){
    const o=ac.createOscillator(); o.type="sine";
    const g=ac.createGain();
    const hp=ac.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=800;
    const n=ac.createBufferSource();
    const buf=ac.createBuffer(1, Math.floor(ac.sampleRate*0.02), ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){ const x=i/d.length; d[i]=(Math.random()*2-1)*(1-x)*0.25; }
    n.buffer=buf;

    o.frequency.setValueAtTime(140,t);
    o.frequency.exponentialRampToValueAtTime(48,t+0.10);
    o.frequency.exponentialRampToValueAtTime(34,t+0.36);

    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.85,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);

    const gc=ac.createGain();
    gc.gain.setValueAtTime(0.0001,t);
    gc.gain.exponentialRampToValueAtTime(0.35,t+0.001);
    gc.gain.exponentialRampToValueAtTime(0.0001,t+0.03);

    o.connect(g).connect(master.drum);
    n.connect(hp).connect(gc).connect(master.drum);
    o.start(t); o.stop(t+0.7);
    n.start(t); n.stop(t+0.04);
  }

  function snare(t){
    const noise=ac.createBufferSource();
    const len=Math.floor(ac.sampleRate*0.25);
    const buf=ac.createBuffer(1,len,ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++){ const x=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-x,2.2); }
    noise.buffer=buf;

    const bp=ac.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1800; bp.Q.value=0.9;
    const hp=ac.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=900;

    const ng=ac.createGain();
    ng.gain.setValueAtTime(0.0001,t);
    ng.gain.exponentialRampToValueAtTime(0.55,t+0.002);
    ng.gain.exponentialRampToValueAtTime(0.0001,t+0.18);

    const o1=ac.createOscillator(); o1.type="sine"; o1.frequency.setValueAtTime(220,t);
    const o2=ac.createOscillator(); o2.type="triangle"; o2.frequency.setValueAtTime(330,t);
    const bg=ac.createGain();
    bg.gain.setValueAtTime(0.0001,t);
    bg.gain.exponentialRampToValueAtTime(0.35,t+0.002);
    bg.gain.exponentialRampToValueAtTime(0.0001,t+0.12);

    noise.connect(bp).connect(hp).connect(ng).connect(master.drum);
    o1.connect(bg).connect(master.drum); o2.connect(bg);

    noise.start(t); noise.stop(t+0.26);
    o1.start(t); o2.start(t); o1.stop(t+0.22); o2.stop(t+0.22);
  }

  function clap(t){
    [0,0.012,0.024,0.038].forEach((dt,idx)=>{
      const n=ac.createBufferSource();
      const len=Math.floor(ac.sampleRate*0.04);
      const buf=ac.createBuffer(1,len,ac.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<len;i++){ const x=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-x,1.8); }
      n.buffer=buf;

      const hp=ac.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=900;
      const g=ac.createGain();
      const at=t+dt;
      const peak=(idx<3?0.45:0.65);
      g.gain.setValueAtTime(0.0001,at);
      g.gain.exponentialRampToValueAtTime(peak,at+0.001);
      g.gain.exponentialRampToValueAtTime(0.0001,at+(idx<3?0.02:0.22));
      n.connect(hp).connect(g).connect(master.drum);
      n.start(at); n.stop(at+0.08);
    });
  }

  function hat(t, open=false){
    const freqs=[401,555,801,1107,1403,2003];
    const mix=ac.createGain(); mix.gain.value=0.25;
    freqs.forEach(f=>{
      const o=ac.createOscillator(); o.type="square"; o.frequency.value=f;
      o.connect(mix); o.start(t); o.stop(t+(open?0.35:0.08));
    });
    const hp=ac.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=7000;
    const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(open?0.33:0.26,t+0.001);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(open?0.32:0.06));
    mix.connect(hp).connect(g).connect(master.drum);
  }

  function rim(t){
    const o=ac.createOscillator(); o.type="square";
    const bp=ac.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1800; bp.Q.value=7;
    const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.25,t+0.001);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    o.frequency.setValueAtTime(520,t);
    o.frequency.exponentialRampToValueAtTime(180,t+0.05);
    o.connect(bp).connect(g).connect(master.drum);
    o.start(t); o.stop(t+0.08);
  }

  // ---- Bass ----
  const midiToHz = m => 440*Math.pow(2,(m-69)/12);
  function driveCurve(amount){
    const n=1024, curve=new Float32Array(n);
    const k=amount, deg=Math.PI/180;
    for(let i=0;i<n;i++){
      const x=(i*2/n)-1;
      curve[i]=(3+k)*x*20*deg/(Math.PI+k*Math.abs(x));
    }
    return curve;
  }
  const bassRootMidi = 48; // fixed (no UI text)
  function bass(t){
    const o1=ac.createOscillator(); o1.type="sawtooth";
    const o2=ac.createOscillator(); o2.type="square";
    const f=midiToHz(bassRootMidi);
    o1.frequency.setValueAtTime(f,t);
    o2.frequency.setValueAtTime(f*0.5,t);
    o1.frequency.exponentialRampToValueAtTime(f*0.985,t+0.03);
    o2.frequency.exponentialRampToValueAtTime((f*0.5)*0.985,t+0.03);

    const filt=ac.createBiquadFilter(); filt.type="lowpass";
    filt.frequency.setValueAtTime(420,t); filt.Q.setValueAtTime(0.9,t);

    const sh=ac.createWaveShaper(); sh.curve=driveCurve(220); sh.oversample="2x";
    const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.55,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);

    o1.connect(filt); o2.connect(filt);
    filt.connect(sh).connect(g).connect(master.bass);
    o1.start(t); o2.start(t);
    o1.stop(t+0.35); o2.stop(t+0.35);
  }

  // ---- Sequencer ----
  const tracks=[
    {id:"k", play:kick,   p:Array(16).fill(0)},
    {id:"s", play:snare,  p:Array(16).fill(0)},
    {id:"c", play:clap,   p:Array(16).fill(0)},
    {id:"h", play:(t)=>hat(t,false), p:Array(16).fill(0)},
    {id:"o", play:(t)=>hat(t,true),  p:Array(16).fill(0)},
    {id:"r", play:rim,    p:Array(16).fill(0)},
    {id:"b", play:(t)=>bass(t), p:Array(16).fill(0)},
  ];
  // default pattern
  [0,4,8,12].forEach(i=>tracks[0].p[i]=1);
  [4,12].forEach(i=>tracks[1].p[i]=1);
  [4,12].forEach(i=>tracks[2].p[i]=1);
  [0,2,4,6,8,10,12,14].forEach(i=>tracks[3].p[i]=1);
  [11].forEach(i=>tracks[4].p[i]=1);
  [2,6,10,14].forEach(i=>tracks[5].p[i]=1);
  [0,3,7,8,11,15].forEach(i=>tracks[6].p[i]=1);

  const grid=document.getElementById("grid");
  const stepEls = tracks.map(()=>Array(16));

  function build(){
    grid.innerHTML="";
    tracks.forEach((tr,ri)=>{
      const row=document.createElement("div");
      row.className="row";
      for(let s=0;s<16;s++){
        const el=document.createElement("div");
        el.className="step";
        el.addEventListener("pointerdown",(e)=>{
          e.preventDefault();
          tr.p[s]=tr.p[s]?0:1;
          el.classList.toggle("on",!!tr.p[s]);
          audition(tr);
        });
        stepEls[ri][s]=el;
        row.appendChild(el);
      }
      grid.appendChild(row);
    });
    repaint();
  }

  function repaint(){
    tracks.forEach((tr,ri)=>{
      for(let s=0;s<16;s++){
        const el=stepEls[ri][s];
        el.classList.toggle("on",!!tr.p[s]);
        el.classList.toggle("ph", s===uiStep);
      }
    });
  }
  function setPlayhead(s){
    uiStep=s;
    tracks.forEach((_,ri)=>{
      for(let i=0;i<16;i++) stepEls[ri][i].classList.toggle("ph", i===uiStep);
    });
  }

  function audition(tr){
    ensureAudio();
    if(ac.state==="suspended") ac.resume();
    tr.play(ac.currentTime+0.01);
  }

  function clearAll(){
    tracks.forEach(tr=>tr.p.fill(0));
    repaint();
  }
  function randomize(){
    const probs=[0.28,0.14,0.10,0.50,0.10,0.18,0.20];
    tracks.forEach((tr,ti)=>{
      for(let i=0;i<16;i++) tr.p[i]=(Math.random()<probs[ti])?1:0;
    });
    tracks[1].p[4]=1; tracks[1].p[12]=1;
    repaint();
  }

  function stepDur(){
    const bpm=parseFloat(document.getElementById("bpm").value);
    return (60/bpm)/4;
  }
  function swingOff(step){
    const sw=parseFloat(document.getElementById("swing").value)/100;
    return (sw>0 && step%2===1) ? stepDur()*sw*0.75 : 0;
  }
  function scheduleAt(t,s){
    tracks.forEach(tr=>{ if(tr.p[s]) tr.play(t); });
  }
  function scheduler(){
    const lookAhead=0.12;
    while(nextTime < now()+lookAhead){
      const s=playStep;
      scheduleAt(nextTime + swingOff(s), s);
      const when=nextTime-now();
      window.setTimeout(()=>{ if(isPlaying) setPlayhead(s); }, Math.max(0, when*1000));
      nextTime += stepDur();
      playStep = (playStep+1)%16;
    }
  }

  function start(){
    ensureAudio();
    if(ac.state==="suspended") ac.resume();
    isPlaying=true;
    playStep=0;
    nextTime=now()+0.05;
    timerId=setInterval(scheduler,25);
    setPlayhead(0);
  }
  function stop(){
    isPlaying=false;
    if(timerId) clearInterval(timerId);
    timerId=null;
    setPlayhead(-1);
  }

  // UI wiring (no visible text)
  const playBtn=document.getElementById("playBtn");
  const stopBtn=document.getElementById("stopBtn");
  const clearBtn=document.getElementById("clearBtn");
  const randBtn=document.getElementById("randBtn");

  playBtn.addEventListener("click",()=>{ if(!isPlaying) start(); });
  stopBtn.addEventListener("click",stop);
  clearBtn.addEventListener("click",clearAll);
  randBtn.addEventListener("click",randomize);

  // keyboard (optional)
  window.addEventListener("keydown",(e)=>{
    if(e.code==="Space"){ e.preventDefault(); isPlaying?stop():start(); }
    if(e.key.toLowerCase()==="c") clearAll();
    if(e.key.toLowerCase()==="r") randomize();
  },{passive:false});

  document.addEventListener("touchmove",(e)=>{ if(e.touches && e.touches.length===1) e.preventDefault(); },{passive:false});

  build();
})();
</script>
</body>
</html>
