<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>808 GLITCH DRUMS</title>
<style>
  :root{
    --bg:#000;
    --fg:#fff;
    --pad:12px;
    --gap:10px;
    --stroke:4px;
    --radius:14px;
    --seqStroke:3px;
    --seqRadius:10px;
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg);
    overflow:hidden;
    touch-action:none;
    position:fixed;
    color:var(--fg);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }

  /* Start */
  #start{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    z-index:10;
  }
  #playBtn{
    width:min(56vmin, 340px);
    aspect-ratio:1/1;
    border: calc(var(--stroke) * 2) solid var(--fg);
    border-radius: 26px;
    background: var(--bg);
    display:flex; align-items:center; justify-content:center;
    outline:none;
  }
  #playBtn:active{ transform:scale(0.995); }
  #playIcon{
    width:0; height:0;
    border-top: 52px solid transparent;
    border-bottom: 52px solid transparent;
    border-left: 86px solid var(--fg);
    transform: translateX(10px);
  }
  @media (max-width: 420px){
    #playIcon{
      border-top: 40px solid transparent;
      border-bottom: 40px solid transparent;
      border-left: 66px solid var(--fg);
      transform: translateX(8px);
    }
  }

  /* Main */
  #wrap{
    width:100vw; height:100vh;
    display:flex; flex-direction:column;
    gap:var(--gap);
    padding:var(--pad);
    opacity:0;
    pointer-events:none;
    transition: opacity 160ms linear;
  }
  #wrap.on{ opacity:1; pointer-events:auto; }

  /* Controls row */
  #controls{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--gap);
    flex: 0 0 auto;
  }
  .ctrl{
    border:var(--stroke) solid var(--fg);
    border-radius:var(--radius);
    background:var(--bg);
    position:relative;
    overflow:hidden;
    height: clamp(58px, 12vh, 120px);
    outline:none;
    padding: 10px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .ctrl:active{ transform:scale(0.995); }
  .ctrl .name{
    font-weight: 900;
    font-size: clamp(12px, 1.8vh, 16px);
    letter-spacing: 0.08em;
    opacity: 0.95;
  }
  .ctrl .bar{
    width:100%;
    height: 16px;
    border: 2px solid var(--fg);
    border-radius: 999px;
    overflow:hidden;
  }
  .ctrl .fill{
    height:100%;
    width:50%;
    background: var(--fg);
  }
  .ctrl::after{
    content:"";
    position:absolute; inset:0;
    opacity:0.10;
    mix-blend-mode:difference;
    pointer-events:none;
    background: repeating-linear-gradient(45deg, var(--fg) 0 2px, transparent 2px 12px);
  }
  .ctrl[data-param="bpm"]::after{ background: repeating-linear-gradient(90deg, var(--fg) 0 2px, transparent 2px 12px); }
  .ctrl[data-param="drive"]::after{ background: repeating-linear-gradient(20deg, var(--fg) 0 2px, transparent 2px 10px); }
  .ctrl[data-param="stut"]::after{ background: repeating-linear-gradient(0deg, var(--fg) 0 2px, transparent 2px 9px); }
  .ctrl[data-param="rate"]::after{ background: repeating-linear-gradient(135deg, var(--fg) 0 2px, transparent 2px 14px); }

  /* Buttons */
  #actions{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: var(--gap);
    flex: 0 0 auto;
  }
  .btn{
    border:var(--stroke) solid var(--fg);
    border-radius:var(--radius);
    background:var(--bg);
    color:var(--fg);
    font-weight: 900;
    font-size: clamp(14px, 2.2vh, 18px);
    letter-spacing: 0.06em;
    padding: 14px 10px;
    text-align:center;
    outline:none;
  }
  .btn:active{ transform:scale(0.995); }
  .btn.on{
    background: var(--fg);
    color: var(--bg);
  }

  /* Sequencer */
  #seq{
    flex: 1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .row{
    display:grid;
    grid-template-columns: repeat(16, 1fr);
    gap: 8px;
    flex: 1 1 0;
    position:relative;
  }
  .row::before{
    content:"";
    position:absolute; inset:-6px -6px -6px -6px;
    border-radius: 14px;
    opacity:0.055;
    pointer-events:none;
    mix-blend-mode:difference;
    background: repeating-linear-gradient(45deg, var(--fg) 0 2px, transparent 2px 14px);
  }
  .row[data-row="kick"]::before{ background: repeating-linear-gradient(0deg, var(--fg) 0 2px, transparent 2px 12px); }
  .row[data-row="deep"]::before{ background: repeating-linear-gradient(10deg, var(--fg) 0 2px, transparent 2px 16px); }
  .row[data-row="snare"]::before{ background: repeating-linear-gradient(90deg, var(--fg) 0 2px, transparent 2px 12px); }
  .row[data-row="ch"]::before{ background: repeating-linear-gradient(25deg, var(--fg) 0 2px, transparent 2px 12px); }
  .row[data-row="oh"]::before{ background: repeating-linear-gradient(155deg, var(--fg) 0 2px, transparent 2px 12px); }
  .row[data-row="clav"]::before{ background: repeating-linear-gradient(135deg, var(--fg) 0 2px, transparent 2px 12px); }

  .step{
    border:var(--seqStroke) solid var(--fg);
    border-radius:var(--seqRadius);
    background:var(--bg);
    position:relative;
    overflow:hidden;
    outline:none;
    min-height: clamp(36px, 7.4vh, 78px);
  }
  .step.on{ background:var(--fg); }
  .step.on::after{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(135deg, var(--bg) 0 2px, transparent 2px 10px);
    opacity:0.25;
    pointer-events:none;
  }
  .step.playing{ box-shadow: 0 0 0 3px var(--fg) inset; }

  /* Footer hint */
  #hint{
    flex: 0 0 auto;
    opacity: 0.75;
    font-size: 12px;
    letter-spacing: 0.02em;
    text-align:center;
  }
</style>
</head>
<body>
<!-- beep-back-button -->

<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


  <div id="start" aria-label="Start">
    <button id="playBtn" aria-label="Start Audio">
      <div id="playIcon" aria-hidden="true"></div>
    </button>
  </div>

  <div id="wrap" aria-label="808 Glitch Drums">
    <div id="controls" aria-label="Controls">
      <div class="ctrl" data-param="bpm"  role="button" aria-label="Tempo control">
        <div class="name">BPM</div>
        <div class="bar"><div class="fill"></div></div>
      </div>
      <div class="ctrl" data-param="drive" role="button" aria-label="Distortion control">
        <div class="name">DRIVE</div>
        <div class="bar"><div class="fill"></div></div>
      </div>
      <div class="ctrl" data-param="stut" role="button" aria-label="Stutter amount control">
        <div class="name">STUT</div>
        <div class="bar"><div class="fill"></div></div>
      </div>
      <div class="ctrl" data-param="rate" role="button" aria-label="Stutter rate control">
        <div class="name">RATE</div>
        <div class="bar"><div class="fill"></div></div>
      </div>
    </div>

    <div id="actions" aria-label="Actions">
      <button id="randBtn" class="btn" aria-label="Randomize pattern">RND</button>
      <button id="clearBtn" class="btn" aria-label="Clear pattern">CLR</button>
      <button id="runBtn" class="btn on" aria-label="Play pause">RUN</button>
    </div>

    <div id="seq" aria-label="Sequencer">
      <div class="row" data-row="kick" aria-label="Kick"></div>
      <div class="row" data-row="deep" aria-label="Deep Kick"></div>
      <div class="row" data-row="snare" aria-label="Snare"></div>
      <div class="row" data-row="ch" aria-label="Closed Hat"></div>
      <div class="row" data-row="oh" aria-label="Open Hat"></div>
      <div class="row" data-row="clav" aria-label="Clav"></div>
    </div>

    <div id="hint">tap steps • drag on controls • glitch = STUT + RATE</div>
  </div>

<script>
(() => {
  // ====== Basics ======
  const STEPS = 16;
  const ROWS = ["kick","deep","snare","ch","oh","clav"];
  const startScreen = document.getElementById("start");
  const playBtn = document.getElementById("playBtn");
  const wrap = document.getElementById("wrap");

  const ctrlEls = Array.from(document.querySelectorAll(".ctrl"));
  const randBtn = document.getElementById("randBtn");
  const clearBtn = document.getElementById("clearBtn");
  const runBtn = document.getElementById("runBtn");

  const clamp01 = (x)=>Math.max(0, Math.min(1, x));
  const expMap = (x,a=1.7)=>Math.pow(clamp01(x), a);

  const pat = Object.fromEntries(ROWS.map(r => [r, new Array(STEPS).fill(0)]));

  // Controls are 0..1
  const C = {
    bpm:  0.52, // 70..190
    drive:0.55, // waveshaper + crush
    stut: 0.25, // probability + intensity
    rate: 0.45  // stutter gate frequency
  };

  function bpmFromCtrl(){
    const v = expMap(C.bpm, 1.25);
    return 70 + v * 160; // 70..230
  }
  function stepDur(){
    return (60 / bpmFromCtrl()) / 4; // 16ths
  }

  function setCtrlFill(el, v){
    el.querySelector(".fill").style.width = (clamp01(v)*100).toFixed(1) + "%";
  }
  function refreshCtrlFills(){
    ctrlEls.forEach(el => setCtrlFill(el, C[el.dataset.param]));
  }

  // ====== Audio Graph ======
  let ctx = null;
  let masterGain, drumBus, preGain, shaper, crusher, comp, hp, lp, stutGate;
  let schedTimer = null;
  let stepIndex = 0;
  let nextStepTime = 0;
  let running = true;

  function makeShaperCurve(amount){
    const k = 1 + amount * 360;
    const n = 44100;
    const curve = new Float32Array(n);
    for(let i=0;i<n;i++){
      const x = (i*2/(n-1))-1;
      const y = (1+k)*x/(1+k*Math.abs(x));
      curve[i] = Math.tanh(y*(1.0 + amount*2.8));
    }
    return curve;
  }

  function createCrusher(){
    // Simple ScriptProcessor bitcrusher (good enough for iOS)
    const sp = ctx.createScriptProcessor(2048, 1, 1);
    let ph = 0, last = 0;
    sp.onaudioprocess = (e) => {
      const input = e.inputBuffer.getChannelData(0);
      const output = e.outputBuffer.getChannelData(0);
      const d = expMap(C.drive, 1.05);
      const bits = 16 - Math.floor(d * 12);    // 16..4
      const step = Math.pow(0.5, bits);
      const rateDiv = 1 + Math.floor(d * 70);  // 1..71
      for(let i=0;i<input.length;i++){
        ph++;
        if(ph >= rateDiv){
          ph = 0;
          last = Math.round(input[i] / step) * step;
        }
        output[i] = last;
      }
    };
    return sp;
  }

  function applyFX(immediate=false){
    if(!ctx) return;
    const t = ctx.currentTime;
    const d = expMap(C.drive, 1.12);

    const set = (param, v, tc=0.05) => {
      if(immediate) param.setValueAtTime(v, t);
      else param.setTargetAtTime(v, t, tc);
    };

    // Drive stack
    set(preGain.gain, 1.0 + d*18.0, 0.06);
    shaper.curve = makeShaperCurve(0.12 + d*0.92);

    // Comp becomes meaner
    comp.threshold.setTargetAtTime(-18 + d*-26, t, 0.06);
    comp.ratio.setTargetAtTime(6 + d*16, t, 0.06);

    // Tone slightly darkens with drive
    lp.frequency.setTargetAtTime(19000 - d*12000, t, 0.07);
    hp.frequency.setTargetAtTime(22 + d*180, t, 0.07);

    // Master
    set(masterGain.gain, 0.22 + d*0.55, 0.10);
  }

  function makeNoiseBuffer(seconds=0.3){
    const sr = ctx.sampleRate;
    const len = Math.floor(seconds * sr);
    const buf = ctx.createBuffer(1, len, sr);
    const data = buf.getChannelData(0);
    let rw = 0;
    for(let i=0;i<len;i++){
      const w = (Math.random()*2-1);
      rw = 0.995*rw + 0.005*(Math.random()*2-1);
      data[i] = 0.75*w + 0.55*rw;
    }
    return buf;
  }

  // ====== 808-ish Drum Synths ======
  function kick808(time, vel=1, deep=false){
    // 808 kick: sine drop + soft click, deep version has lower root + longer tail
    const root = deep ? 52 : 62;
    const end  = deep ? 33 : 38;
    const dropTime = deep ? 0.16 : 0.12;
    const tail = deep ? 0.55 : 0.32;

    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(root*2.4, time);
    o.frequency.exponentialRampToValueAtTime(root, time + 0.020);
    o.frequency.exponentialRampToValueAtTime(end, time + dropTime);

    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime((1.0 + (deep?0.25:0.0)) * vel, time + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, time + tail);

    o.connect(g); g.connect(drumBus);
    o.start(time); o.stop(time + tail + 0.03);

    // click
    const b = ctx.createBufferSource();
    b.buffer = makeNoiseBuffer(0.04);
    const hpf = ctx.createBiquadFilter();
    hpf.type = "highpass"; hpf.frequency.setValueAtTime(2500, time);
    const cg = ctx.createGain();
    cg.gain.setValueAtTime(0.0001, time);
    cg.gain.exponentialRampToValueAtTime((deep?0.10:0.18) * vel, time + 0.001);
    cg.gain.exponentialRampToValueAtTime(0.0001, time + 0.03);
    b.connect(hpf); hpf.connect(cg); cg.connect(drumBus);
    b.start(time); b.stop(time + 0.05);
  }

  function snare808(time, vel=1){
    // 808-ish: noise burst + short tone
    const b = ctx.createBufferSource();
    b.buffer = makeNoiseBuffer(0.35);

    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.setValueAtTime(1800, time); bp.Q.setValueAtTime(0.7, time);

    const hp2 = ctx.createBiquadFilter();
    hp2.type = "highpass"; hp2.frequency.setValueAtTime(700, time);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.85 * vel, time + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.20);

    b.connect(hp2); hp2.connect(bp); bp.connect(g); g.connect(drumBus);
    b.start(time); b.stop(time + 0.24);

    const o = ctx.createOscillator();
    const tg = ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(190, time);
    tg.gain.setValueAtTime(0.0001, time);
    tg.gain.exponentialRampToValueAtTime(0.22 * vel, time + 0.001);
    tg.gain.exponentialRampToValueAtTime(0.0001, time + 0.11);
    o.connect(tg); tg.connect(drumBus);
    o.start(time); o.stop(time + 0.14);
  }

  function hat(time, vel=1, open=false){
    // Noise hats: open has longer decay + slightly lower HPF
    const b = ctx.createBufferSource();
    b.buffer = makeNoiseBuffer(open ? 0.6 : 0.18);
    const hpf = ctx.createBiquadFilter();
    hpf.type = "highpass";
    hpf.frequency.setValueAtTime(open ? 5200 : 7200, time);

    const g = ctx.createGain();
    const a = open ? 0.004 : 0.001;
    const d = open ? 0.28 : 0.06;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime((open?0.50:0.40) * vel, time + a);
    g.gain.exponentialRampToValueAtTime(0.0001, time + d);

    b.connect(hpf); hpf.connect(g); g.connect(drumBus);
    b.start(time); b.stop(time + (open?0.35:0.10));
  }

  function clav(time, vel=1){
    // quick percussive "click" with bandpass
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    const bp = ctx.createBiquadFilter();
    const hp2 = ctx.createBiquadFilter();

    o.type = "square";
    o.frequency.setValueAtTime(420 + (Math.random()*2-1)*18, time);

    bp.type = "bandpass";
    bp.frequency.setValueAtTime(1400, time);
    bp.Q.setValueAtTime(1.4, time);

    hp2.type = "highpass";
    hp2.frequency.setValueAtTime(180, time);

    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.45 * vel, time + 0.0015);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.085);

    o.connect(bp); bp.connect(hp2); hp2.connect(g); g.connect(drumBus);
    o.start(time); o.stop(time + 0.12);
  }

  // ====== Glitch / Stutter ======
  function maybeStutterGate(baseTime){
    // Random little gate bursts on master bus
    const amt = clamp01(C.stut);
    if(amt <= 0.001) return;

    // Probability increases nonlinearly with amt
    const p = 0.10 + expMap(amt, 1.25) * 0.85; // 0.10..0.95
    if(Math.random() > p) return;

    const rateHz = 6 + expMap(C.rate, 1.2) * 32; // 6..38 Hz
    const burst = 0.04 + expMap(amt, 1.15) * 0.20; // 40..240ms
    const cycles = Math.max(2, Math.floor(burst * rateHz));

    const t0 = baseTime;
    const dt = 1 / rateHz;

    // Start from on, then rapid chops
    stutGate.gain.setValueAtTime(1.0, t0);
    for(let i=0;i<cycles;i++){
      const t = t0 + i*dt;
      const on = (Math.random() > (0.35 + amt*0.45)) ? 1.0 : 0.0;
      stutGate.gain.setValueAtTime(on, t);
    }
    stutGate.gain.setValueAtTime(1.0, t0 + cycles*dt + 0.002);
  }

  function maybeRetrigger(row, time){
    // Micro-retriggers on hits (gives 808 "glitch machine" feel)
    const amt = clamp01(C.stut);
    if(amt <= 0.001) return;
    const p = expMap(amt, 1.6) * 0.55; // 0..0.55
    if(Math.random() > p) return;

    const count = 1 + Math.floor(expMap(amt, 1.1) * 3); // 1..4 extra
    const spacing = stepDur() * (0.10 + expMap(C.rate,1.2)*0.18); // ~1/64..1/24
    for(let i=1;i<=count;i++){
      const tt = time + i*spacing;
      const vel = 0.55 / i;
      fireRow(row, tt, vel);
    }
  }

  function fireRow(row, time, vel=1){
    if(row==="kick") kick808(time, vel, false);
    else if(row==="deep") kick808(time, vel, true);
    else if(row==="snare") snare808(time, vel);
    else if(row==="ch") hat(time, vel, false);
    else if(row==="oh") hat(time, vel, true);
    else if(row==="clav") clav(time, vel);
  }

  // ====== Build / Start ======
  function buildAudio(){
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint:"interactive" });

    drumBus = ctx.createGain();
    drumBus.gain.value = 1.0;

    preGain = ctx.createGain();
    preGain.gain.value = 1.0;

    shaper = ctx.createWaveShaper();
    shaper.oversample = "4x";

    crusher = createCrusher();

    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -22;
    comp.knee.value = 24;
    comp.ratio.value = 10;
    comp.attack.value = 0.003;
    comp.release.value = 0.16;

    hp = ctx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 26;
    hp.Q.value = 0.7;

    lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 16000;
    lp.Q.value = 0.85;

    stutGate = ctx.createGain();
    stutGate.gain.value = 1.0;

    masterGain = ctx.createGain();
    masterGain.gain.value = 0.0001;

    // Routing: drumBus -> pre -> shaper -> crusher -> comp -> hp -> lp -> gate -> master -> out
    drumBus.connect(preGain);
    preGain.connect(shaper);
    shaper.connect(crusher);
    crusher.connect(comp);
    comp.connect(hp);
    hp.connect(lp);
    lp.connect(stutGate);
    stutGate.connect(masterGain);
    masterGain.connect(ctx.destination);

    applyFX(true);

    // Scheduler init
    stepIndex = 0;
    nextStepTime = ctx.currentTime + 0.06;
    running = true;
    runBtn.classList.add("on");
    runBtn.textContent = "RUN";

    startScheduler();

    // Default pattern (a tiny starter groove)
    pat.kick[0]=1; pat.kick[8]=1;
    pat.deep[12]=1;
    pat.snare[4]=1; pat.snare[12]=1;
    for(let i=0;i<STEPS;i+=2) pat.ch[i]=1;
    pat.oh[14]=1;
    pat.clav[2]=1; pat.clav[10]=1;

    refreshSeq();
  }

  // ====== Scheduler ======
  const lookAhead = 0.22;
  const timerInt = 20;

  function startScheduler(){
    if(schedTimer) clearInterval(schedTimer);
    schedTimer = setInterval(() => {
      if(!ctx || ctx.state !== "running") return;
      while(nextStepTime < ctx.currentTime + lookAhead){
        scheduleStep(stepIndex, nextStepTime);
        nextStepTime += stepDur();
        stepIndex = (stepIndex + 1) % STEPS;
      }
    }, timerInt);
  }

  function scheduleStep(ix, time){
    setPlayhead(ix);

    if(!running) return;

    // Gate burst around some steps for global glitch
    // Use the step boundary so it feels rhythmic.
    maybeStutterGate(time);

    // Fire voices
    for(const r of ROWS){
      if(pat[r][ix]){
        fireRow(r, time, 1.0);
        maybeRetrigger(r, time);
      }
    }
  }

  // ====== UI: Sequencer ======
  const stepEls = Object.fromEntries(ROWS.map(r => [r, []]));
  const rowEls = {};

  function buildGrid(){
    for(const r of ROWS){
      const el = document.querySelector(`.row[data-row="${r}"]`);
      rowEls[r] = el;
      el.innerHTML = "";
      stepEls[r] = [];
      for(let i=0;i<STEPS;i++){
        const d = document.createElement("div");
        d.className = "step";
        d.dataset.row = r;
        d.dataset.ix = String(i);
        d.setAttribute("role","button");
        d.setAttribute("aria-label", r + " step " + (i+1));
        d.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          const rr = d.dataset.row;
          const ii = Number(d.dataset.ix);
          pat[rr][ii] = pat[rr][ii] ? 0 : 1;
          d.classList.toggle("on", !!pat[rr][ii]);
          // audition
          if(ctx && ctx.state==="running"){
            fireRow(rr, ctx.currentTime + 0.002, 0.9);
          }
        }, {passive:false});
        el.appendChild(d);
        stepEls[r].push(d);
      }
    }
  }

  function refreshSeq(){
    for(const r of ROWS){
      for(let i=0;i<STEPS;i++){
        stepEls[r][i].classList.toggle("on", !!pat[r][i]);
      }
    }
  }

  let lastPlayIx = -1;
  function setPlayhead(ix){
    if(ix === lastPlayIx) return;
    if(lastPlayIx >= 0){
      for(const r of ROWS) stepEls[r][lastPlayIx].classList.remove("playing");
    }
    for(const r of ROWS) stepEls[r][ix].classList.add("playing");
    lastPlayIx = ix;
  }

  // ====== UI: Controls (drag) ======
  function bindControl(el){
    const key = el.dataset.param;
    let down = false;

    const updateFromY = (clientY) => {
      const r = el.getBoundingClientRect();
      const v = clamp01(1 - ((clientY - r.top) / Math.max(1, r.height)));
      C[key] = v;
      setCtrlFill(el, v);
      applyFX(false);
    };

    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      down = true;
      el.setPointerCapture(e.pointerId);
      updateFromY(e.clientY);
    }, {passive:false});

    el.addEventListener("pointermove", (e) => {
      if(!down) return;
      e.preventDefault();
      updateFromY(e.clientY);
    }, {passive:false});

    const up = (e) => {
      if(!down) return;
      down = false;
      try{ el.releasePointerCapture(e.pointerId); }catch(_){}
    };
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
  }

  // ====== Actions ======
  function rnd(p){ return Math.random() < p ? 1 : 0; }

  function randomize(){
    // A punchy 808-ish density, with some controlled chaos.
    for(let i=0;i<STEPS;i++){
      pat.kick[i]  = 0;
      pat.deep[i]  = 0;
      pat.snare[i] = 0;
      pat.ch[i]    = rnd(0.70);
      pat.oh[i]    = rnd(0.10);
      pat.clav[i]  = rnd(0.18);
    }
    // anchor
    pat.kick[0]=1; pat.kick[8]=1;
    if(rnd(0.45)) pat.kick[12]=1;
    if(rnd(0.35)) pat.deep[4]=1;
    if(rnd(0.45)) pat.deep[12]=1;

    pat.snare[4]=1; pat.snare[12]=1;
    if(rnd(0.20)) pat.snare[15]=1;

    // open hats near end
    if(rnd(0.65)) pat.oh[14]=1;

    refreshSeq();
  }

  function clearAll(){
    for(const r of ROWS) for(let i=0;i<STEPS;i++) pat[r][i]=0;
    refreshSeq();
  }

  randBtn.addEventListener("click", (e)=>{ e.preventDefault(); randomize(); }, {passive:false});
  clearBtn.addEventListener("click", (e)=>{ e.preventDefault(); clearAll(); }, {passive:false});

  runBtn.addEventListener("click", (e)=>{
    e.preventDefault();
    running = !running;
    runBtn.classList.toggle("on", running);
    runBtn.textContent = running ? "RUN" : "STOP";
    // Ensure gate opens when stopped
    if(ctx) stutGate.gain.setValueAtTime(1.0, ctx.currentTime);
  }, {passive:false});

  // ====== Start ======
  buildGrid();
  refreshCtrlFills();
  ctrlEls.forEach(bindControl);

  function go(){
    startScreen.style.display = "none";
    wrap.classList.add("on");
    buildAudio();
  }

  playBtn.addEventListener("click", async () => {
    try{
      if(!ctx) go();
      else if(ctx.state !== "running") await ctx.resume();
    }catch(_){}
  });

  // Safety: if user taps anywhere on start screen
  startScreen.addEventListener("pointerdown", (e)=>{
    if(e.target === playBtn) return;
    e.preventDefault();
    playBtn.click();
  }, {passive:false});
})();
</script>
</body>
</html>
