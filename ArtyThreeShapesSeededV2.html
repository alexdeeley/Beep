<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Arty • Three Shapes</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #fff;
    overflow: hidden;
    touch-action: manipulation;
  }
  canvas { display:block; width:100vw; height:100vh; }

  /* Icon buttons */
  .icon-btn {
    position: fixed;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 2px solid #fff;
    background: rgba(0,0,0,0.35);
    color: #fff;
    display: grid;
    place-items: center;
    z-index: 10;
    user-select: none;
  }
  .icon-btn:active { transform: translateY(1px); }
  .icon { font-size: 28px; line-height: 1; }

  /* Bottom-right download */
  #downloadBtn { right: 12px; bottom: 12px; }

  /* Bottom-left seed/search */
  #seedBtn { left: 12px; bottom: 12px; }

  /* Seed drawer */
  .drawer {
    position: fixed;
    left: 12px; bottom: 76px;
    background: rgba(0,0,0,0.75);
    border: 2px solid #fff;
    border-radius: 12px;
    padding: 10px;
    display: none;
    gap: 8px;
    z-index: 10;
  }
  .drawer.open { display: flex; }
  .seed-input {
    background: #000; color: #fff;
    border: 1px solid #fff;
    border-radius: 8px;
    padding: 8px 10px;
    font: 700 16px/1.2 Helvetica, Arial, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    width: 200px;
  }
  .small-btn {
    border: 2px solid #fff;
    background: transparent;
    color: #fff;
    border-radius: 10px;
    padding: 6px 10px;
    font: 800 16px/1 Helvetica, Arial, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }

  /* Floating chips (HC + reroll) */
  .floating {
    position: fixed; top: 10px; right: 10px;
    display:flex; gap:8px; z-index:10;
  }
  .chip {
    border:1px solid rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.4);
    color:#fff; border-radius:999px;
    padding:6px 10px; font:700 14px/1 Helvetica, Arial, system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  .chip[aria-pressed="true"] { background:#fff; color:#000; }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>

<!-- High-contrast bias + reroll -->
<div class="floating">
  <button id="rerollChip" class="chip" aria-label="Generate new art" title="Generate (tap or press Space)">↻</button>
  <button id="contrastChip" class="chip" aria-pressed="false" aria-label="Bias high-contrast" title="Bias high-contrast">HC</button>
</div>

<!-- Bottom-left seed/search -->
<button class="icon-btn" id="seedBtn" aria-label="Set seed" title="Set seed">
  <span class="icon">🔍</span>
</button>
<div class="drawer" id="seedDrawer" role="dialog" aria-label="Seed">
  <input id="seedInput" class="seed-input" type="text" placeholder="seed…" aria-label="Seed value">
  <button id="applySeed" class="small-btn" aria-label="Apply seed">↵</button>
</div>

<!-- Bottom-right download -->
<a class="icon-btn" id="downloadBtn" aria-label="Download image" title="Download image">
  <span class="icon">⬇️</span>
</a>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const dpr = Math.max(1, window.devicePixelRatio || 1);

  const rerollChip = document.getElementById('rerollChip');
  const contrastChip = document.getElementById('contrastChip');

  const seedBtn = document.getElementById('seedBtn');
  const seedDrawer = document.getElementById('seedDrawer');
  const seedInput = document.getElementById('seedInput');
  const applySeed = document.getElementById('applySeed');

  const downloadBtn = document.getElementById('downloadBtn');

  let biasHighContrast = false;
  let seed = String(Math.random()).slice(2);
  seedInput.value = seed;

  // --- Seeded RNG ---
  function xorshift32(a){
    return function(){
      a ^= a << 13; a ^= a >>> 17; a ^= a << 5;
      return ((a >>> 0) / 4294967296);
    }
  }
  function hashStringToInt(str){
    let h = 2166136261 >>> 0;
    for (let i=0; i<str.length; i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    if (h === 0) h = 1;
    return h >>> 0;
  }
  let rng = xorshift32(hashStringToInt(seed));
  function srand(s){
    seed = s === undefined ? seed : String(s);
    rng = xorshift32(hashStringToInt(seed));
  }
  function rand(min, max) { return rng()*(max-min)+min; }
  function ri(min, max) { return Math.floor(rand(min, max+1)); }
  function chance(p){ return rng() < p; }
  function pick(arr){ return arr[ri(0, arr.length-1)]; }

  // Color helpers
  function hsl(h, s, l) {
    h = (h % 360 + 360) % 360;
    s = Math.max(0, Math.min(1, s));
    l = Math.max(0, Math.min(1, l));
    const c = (1 - Math.abs(2*l - 1)) * s;
    const x = c * (1 - Math.abs(((h/60) % 2) - 1));
    const m = l - c/2;
    let r=0,g=0,b=0;
    if (0 <= h && h < 60) { r=c; g=x; b=0; }
    else if (60 <= h && h < 120) { r=x; g=c; b=0; }
    else if (120 <= h && h < 180) { r=0; g=c; b=x; }
    else if (180 <= h && h < 240) { r=0; g=x; b=c; }
    else if (240 <= h && h < 300) { r=x; g=0; b=c; }
    else { r=c; g=0; b=x; }
    const R = Math.round((r + m) * 255);
    const G = Math.round((g + m) * 255);
    const B = Math.round((b + m) * 255);
    return {r:R,g:G,b:B};
  }
  function rgbStr(rgb, a=1){ return `rgba(${rgb.r},${rgb.g},${rgb.b},${a})`; }
  function luminance({r,g,b}){
    const srgb = [r/255, g/255, b/255].map(v => v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4));
    return 0.2126*srgb[0] + 0.7152*srgb[1] + 0.0722*srgb[2];
  }
  function contrastRatio(rgb1, rgb2){
    const L1 = luminance(rgb1), L2 = luminance(rgb2);
    const [a,b] = L1 > L2 ? [L1, L2] : [L2, L1];
    return (a+0.05)/(b+0.05);
  }

  function resize(){
    const w = Math.floor(window.innerWidth * dpr);
    const h = Math.floor(window.innerHeight * dpr);
    canvas.width = w; canvas.height = h;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }

  function pickContrastingColors(n, againstRGB, minContrast, allowRepeatsColors) {
    const picks = [];
    let attempts = 0;
    while (picks.length < n && attempts < 800) {
      attempts++;
      const h = ri(0, 359);
      const s = biasHighContrast ? rand(0.65, 1.0) : rand(0.35, 1.0);
      const l = biasHighContrast ? rand(0.35, 0.65) : rand(0.2, 0.8);
      const rgb = hsl(h, s, l);
      if (contrastRatio(rgb, againstRGB) >= minContrast) {
        if (allowRepeatsColors || picks.every(p => Math.abs(p.h - h) > 30)) {
          picks.push({h,s,l,rgb});
        }
      }
    }
    // If we still need more, duplicate some (explicit repeats)
    while (picks.length < n && picks.length > 0) {
      picks.push(picks[ri(0, picks.length-1)]);
    }
    // Final fallback
    while (picks.length < n) { picks.push({h:0,s:0,l:1,rgb:{r:255,g:255,b:255}}); }
    return picks;
  }

  function randomBackground() {
    const h = ri(0, 359);
    const s = biasHighContrast ? rand(0.3, 0.8) : rand(0.2, 0.8);
    const l = biasHighContrast ? rand(0.05, 0.15) : rand(0.1, 0.85);
    return {h,s,l,rgb: hsl(h,s,l)};
  }

  function drawTexturedBackdrop(w, h, bg, alpha=1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = rgbStr(bg.rgb, 1);
    ctx.fillRect(0, 0, w, h);
    const grad = ctx.createRadialGradient(w*0.5, h*0.5, Math.min(w,h)*0.1, w*0.5, h*0.5, Math.max(w,h)*0.65);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
    // subtle noise
    const noiseSize = Math.max(64, Math.round(Math.min(w,h)/8));
    const nCanvas = document.createElement('canvas');
    nCanvas.width = noiseSize; nCanvas.height = noiseSize;
    const nctx = nCanvas.getContext('2d');
    const imgData = nctx.createImageData(noiseSize, noiseSize);
    for (let i=0;i<imgData.data.length;i+=4){
      const val = Math.floor(rng()*256);
      imgData.data[i] = val;
      imgData.data[i+1] = val;
      imgData.data[i+2] = val;
      imgData.data[i+3] = Math.floor(rng()*70);
    }
    nctx.putImageData(imgData, 0, 0);
    const pattern = ctx.createPattern(nCanvas, 'repeat');
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.25 * alpha;
    ctx.fillStyle = pattern;
    ctx.fillRect(0,0,w,h);
    ctx.restore();
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  function drawCircle(x, y, r, fill, stroke, alpha=1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = fill;
    ctx.shadowColor = fill;
    ctx.shadowBlur = r * 0.18;
    ctx.fill();
    if (stroke) {
      ctx.lineWidth = Math.max(2, r*0.06);
      ctx.strokeStyle = stroke;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawTriangle(x, y, size, fill, stroke, alpha=1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const angle = rand(0, Math.PI*2);
    const r = size;
    const p1 = {x: x + r*Math.cos(angle), y: y + r*Math.sin(angle)};
    const p2 = {x: x + r*Math.cos(angle + 2*Math.PI/3), y: y + r*Math.sin(angle + 2*Math.PI/3)};
    const p3 = {x: x + r*Math.cos(angle + 4*Math.PI/3), y: y + r*Math.sin(angle + 4*Math.PI/3)};
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.shadowColor = fill;
    ctx.shadowBlur = size * 0.15;
    ctx.fill();
    if (stroke) {
      ctx.lineWidth = Math.max(2, size*0.06);
      ctx.strokeStyle = stroke;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPolygon(x, y, radius, sides, fill, stroke, alpha=1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const rotation = rand(0, Math.PI*2);
    ctx.beginPath();
    for (let i=0;i>sides;i++){} // (placeholder to avoid accidental lints)
    ctx.beginPath();
    for (let i=0;i<sides;i++){
      const a = rotation + i * (2*Math.PI/sides);
      const px = x + radius * Math.cos(a);
      const py = y + radius * Math.sin(a);
      if (i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.shadowColor = fill;
    ctx.shadowBlur = radius * 0.15;
    ctx.fill();
    if (stroke) {
      ctx.lineWidth = Math.max(2, radius*0.06);
      ctx.strokeStyle = stroke;
      ctx.stroke();
    }
    ctx.restore();
  }

  function ensureContrast(fillRGB, bgRGB) {
    const min = biasHighContrast ? 4.5 : 2.2;
    let rgb = {...fillRGB};
    let tries = 0;
    while (contrastRatio(rgb, bgRGB) < min && tries < 20) {
      const bgL = luminance(bgRGB);
      const myL = luminance(rgb);
      const brighter = myL <= bgL;
      const k = brighter ? 1.12 : 0.88;
      const sr = rgb.r/255, sg=rgb.g/255, sb=rgb.b/255;
      rgb = { r: Math.max(0, Math.min(255, Math.round(sr*255*k))),
              g: Math.max(0, Math.min(255, Math.round(sg*255*k))),
              b: Math.max(0, Math.min(255, Math.round(sb*255*k))) };
      tries++;
    }
    return rgb;
  }

  // TEXT LAYER
  const WORDS = ["ART","LOVE","BOLD","HEX","WAVE","MAISIE","ALEX","KAYLA","PLAY","WOW","LOUD","PIXEL","NOISE","LIGHT","DREAM","NOVA"];
  function drawGiantText(bgRGB){
    // choose letter/number/word
    let content;
    const modePick = rng();
    if (modePick < 0.34){
      content = String.fromCharCode(65 + ri(0,25)); // A-Z
    } else if (modePick < 0.67){
      content = String(ri(0,9)); // 0-9
    } else {
      content = pick(WORDS);
    }
    // style
    const w = canvas.width, h = canvas.height;
    const base = Math.min(w,h);
    const fontSize = base * (0.45 + rng()*0.35); // huge
    ctx.save();
    ctx.globalCompositeOperation = pick(['overlay','screen','soft-light','hard-light','difference','exclusion','lighter','source-over']);
    // seeded color
    const hcol = ri(0,359), scol = biasHighContrast ? rand(0.65,1) : rand(0.35,1), lcol = biasHighContrast ? rand(0.35,0.65) : rand(0.25,0.75);
    const col = ensureContrast(hsl(hcol, scol, lcol), bgRGB);
    const alpha = 0.35 + rng()*0.5; // seeded opacity
    ctx.fillStyle = rgbStr(col, alpha);
    ctx.font = `900 ${Math.floor(fontSize)}px Helvetica, Arial, system-ui, -apple-system, Segoe UI, Roboto, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // seeded position
    const x = rand(base*0.2, w - base*0.2);
    const y = rand(base*0.2, h - base*0.2);
    // slight rotation
    const rot = rand(-0.25, 0.25);
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillText(content, 0, 0);
    ctx.restore();
  }

  // State
  let lastScene = null;

  function generateScene(){
    const w = canvas.width, h = canvas.height;

    // Background (opacity seeded)
    const bg = randomBackground();
    const opBg = 0.25 + rng()*0.75; // 0.25 - 1

    // Allow repeats seeded
    const allowRepeatsShapes = chance(0.45);
    const allowRepeatsColors = chance(0.5);

    // Colors for shapes (allow repeats occasionally)
    const picks = pickContrastingColors(3, bg.rgb, biasHighContrast ? 4.5 : 2.2, allowRepeatsColors);
    // If explicit repeats, sometimes force all same color
    if (allowRepeatsColors && chance(0.25)) picks[1] = picks[2] = picks[0];

    // Shape types; maybe allow repeats
    let shapeTypes = ['circle','triangle','polygon'];
    let chosen;
    if (allowRepeatsShapes){
      chosen = [pick(shapeTypes), pick(shapeTypes), pick(shapeTypes)];
    } else {
      // shuffle unique
      for (let i=shapeTypes.length-1; i>0; i--) {
        const j = ri(0, i);
        [shapeTypes[i], shapeTypes[j]] = [shapeTypes[j], shapeTypes[i]];
      }
      chosen = shapeTypes.slice(0,3);
    }

    // Positions/sizes + per-shape opacities
    const margin = Math.min(w,h) * 0.08;
    const centers = [
      {x: rand(margin, w - margin), y: rand(margin, h - margin)},
      {x: rand(margin, w - margin), y: rand(margin, h - margin)},
      {x: rand(margin, w - margin), y: rand(margin, h - margin)},
    ];
    const base = Math.min(w,h);
    const sizes = [rand(base*0.18, base*0.36), rand(base*0.18, base*0.36), rand(base*0.18, base*0.36)];
    const blends = ['source-over','screen','multiply','overlay','lighter','soft-light'];
    const blendSel = [pick(blends), pick(blends), pick(blends)];
    const strokeFlags = [chance(0.6), chance(0.6), chance(0.6)];

    const opS = [0,1,2].map(()=> 0.2 + rng()*0.8); // each 0.2-1 seeded

    // Occasionally include a giant text layer
    const includeText = chance(0.45);

    lastScene = { bg, opBg, picks, chosen, centers, sizes, blendSel, strokeFlags, opS, includeText };
  }

  function drawPolygonFixed(x, y, radius, sides, fill, stroke, alpha){
    // helper wrapper to avoid double-beginPath bug
    ctx.save();
    ctx.globalAlpha = alpha;
    const rotation = rand(0, Math.PI*2);
    ctx.beginPath();
    for (let i=0;i<sides;i++){
      const a = rotation + i * (2*Math.PI/sides);
      const px = x + radius * Math.cos(a);
      const py = y + radius * Math.sin(a);
      if (i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.shadowColor = fill;
    ctx.shadowBlur = radius * 0.15;
    ctx.fill();
    if (stroke) {
      ctx.lineWidth = Math.max(2, radius*0.06);
      ctx.strokeStyle = stroke;
      ctx.stroke();
    }
    ctx.restore();
  }

  function renderScene(){
    if (!lastScene) return;
    resize();
    const w = canvas.width, h = canvas.height;
    const { bg, opBg, picks, chosen, centers, sizes, blendSel, strokeFlags, opS, includeText } = lastScene;

    // Background
    drawTexturedBackdrop(w, h, bg, opBg);

    // Shapes
    for (let i=0; i<3; i++){
      ctx.save();
      ctx.globalCompositeOperation = blendSel[i];
      const p = picks[i];
      const fillRGB = ensureContrast(p.rgb, bg.rgb);
      const fill = rgbStr(fillRGB, 1);
      const stroke = strokeFlags[i] ? rgbStr(ensureContrast(p.rgb, bg.rgb), 1) : null;
      const center = centers[i];
      const size = sizes[i];
      const alpha = opS[i];

      switch (chosen[i]) {
        case 'circle':  drawCircle(center.x, center.y, size*0.6, fill, stroke, alpha); break;
        case 'triangle': drawTriangle(center.x, center.y, size*0.65, fill, stroke, alpha); break;
        case 'polygon': drawPolygonFixed(center.x, center.y, size*0.6, ri(5,8), fill, stroke, alpha); break;
      }
      ctx.restore();
    }

    // Optional giant text
    if (includeText){
      drawGiantText(bg.rgb);
    }

    // Frame
    ctx.save();
    ctx.lineWidth = Math.max(2, Math.round(Math.min(w,h)*0.01));
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.strokeRect(ctx.lineWidth, ctx.lineWidth, w - ctx.lineWidth*2, h - ctx.lineWidth*2);
    ctx.restore();
  }

  function generateArt(){
    generateScene();
    renderScene();
    updateDownloadHref();
  }

  function toggleHC(){
    biasHighContrast = !biasHighContrast;
    contrastChip.setAttribute('aria-pressed', String(biasHighContrast));
    generateArt();
  }

  function updateDownloadHref(){
    try {
      const url = canvas.toDataURL('image/png');
      downloadBtn.href = url;
      const safeSeed = seed.replace(/[^a-z0-9_-]+/gi, '-').replace(/-+/g,'-').replace(/^-|-$/g,'');
      downloadBtn.download = (safeSeed ? safeSeed : 'untitled') + ' art.png';
    } catch(e){ /* ignore */ }
  }

  // Events
  window.addEventListener('resize', renderScene);
  rerollChip.addEventListener('click', generateArt);
  contrastChip.addEventListener('click', toggleHC);

  // Seed UI
  seedBtn.addEventListener('click', () => {
    seedDrawer.classList.toggle('open');
    if (seedDrawer.classList.contains('open')) {
      seedInput.focus();
    }
  });
  function applySeedAndGenerate(){
    const val = seedInput.value.trim();
    if (val) { srand(val); }
    else { srand(String(Math.random()).slice(2)); seedInput.value = seed; }
    generateArt();
    seedDrawer.classList.remove('open');
  }
  applySeed.addEventListener('click', applySeedAndGenerate);
  seedInput.addEventListener('keydown', (e)=>{ if (e.key==='Enter') applySeedAndGenerate(); });

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); generateArt(); }
    if (e.key.toLowerCase() === 'h') { toggleHC(); }
    if (e.key.toLowerCase() === 's') { downloadBtn.click(); }
    if (e.key.toLowerCase() === 'f') { seedDrawer.classList.add('open'); seedInput.focus(); }
  });

  // Init
  resize();
  generateArt();
})();
</script>
</body>
</html>
