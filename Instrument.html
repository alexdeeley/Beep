<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Instrument — Deeley.org</title>
<link rel="stylesheet" href="instruments/styles/instruments.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  #root { height: 100%; }
  .im-missing { padding: 80px 20px; text-align: center; font: 600 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .im-missing a { color: #fff; }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="Instruments.html" aria-label="Back to Sound" title="Back to Sound">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>

<div id="root"></div>

<!-- One page for every instrument: Instrument.html?id=piano, ?id=kit-909 …
     The id is a registry id (instruments/core/registry.js); the page mounts
     that instrument on its own, with its own transport, the same way the
     Studio does inside a panel. -->
<script type="module">
  import { mountStandalone } from "./instruments/components/standalone.js";
  import { getManifest, listInstruments } from "./instruments/core/registry.js";
  const id = new URLSearchParams(location.search).get("id") || "";
  const root = document.getElementById("root");
  if (getManifest(id)) {
    mountStandalone(id, root);
  } else {
    document.title = "Instrument not found — Deeley.org";
    const names = listInstruments().map((m) => `<a href="Instrument.html?id=${m.id}">${m.icon} ${m.name}</a>`).join(" · ");
    root.innerHTML = `<div class="im-missing"><p>There is no instrument called “${id.replace(/[<>&]/g, "")}”.</p><p>Pick one: ${names}</p><p><a href="Instruments.html">Back to Sound</a></p></div>`;
  }
</script>
</body>
</html>
