    this.showCompassArrow = target && (!onScreen(target) || guidanceMode) && bestD > player.radius*3;
  }

  triggerFinale(){
    this.finaleTriggered = true;
    this.finaleZoomBoost = 1;
    this.ui.banner('FINAL CHOMP!', 2200);
    this.audio.milestoneSound();
  }

  eatFinale(){
    this.world.finale.alive = false;
    this.screenShake = 14;
    this.particles.burst(this.world.finale.x, this.world.finale.y, 60, {color:'#fff', life:1.0, size:12, speedMin:120, speedMax:420});
    this.audio.finaleChord();
    this.world.chapter.missions.forEach((m,i)=>{ if(m.type==='finale') this.missionCounts[i]++; });
    this.progress.markCombo(this.combo.best);
    this.progress.completeChapter(this.currentChapterIndex);
    this.audio.stopAmbient();
    this.audio.chapterCompleteMelody();
    setTimeout(()=> this.showChapterComplete(), 650);
    this.state = 'complete-pending';
  }

  trackPerf(dt){
    this.frameTimes.push(dt);
    if(this.frameTimes.length>60) this.frameTimes.shift();
    if(this.frameTimes.length===60){
      const avg = this.frameTimes.reduce((a,b)=>a+b,0)/60;
      if(avg > 1/40 && this.qualityParticleCap>180){ this.qualityParticleCap -= 40; }
      else if(avg < 1/58 && this.qualityParticleCap<420){ this.qualityParticleCap += 20; }
    }
  }

  // ---------------- Render ----------------
  render(){
    const ctx = this.ctx, W=this.W, H=this.H;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = this.world ? this.world.chapter.bg : '#000';
    ctx.fillRect(0,0,W,H);
    if(!this.world) return;

    const world = this.world, player = this.player;
    const shakeX = (Math.random()-0.5)*this.screenShake;
    const shakeY = (Math.random()-0.5)*this.screenShake;

    ctx.save();
    ctx.translate(W/2+shakeX, H/2+shakeY);
    ctx.scale(this.camera.zoom, this.camera.zoom);
    ctx.translate(-this.camera.x, -this.camera.y);

    world.drawPattern(ctx, this.camera.zoom);
    world.drawBorder(ctx, this.camera.zoom);

    // viewport culling margin
    const halfW = W/(2*this.camera.zoom)+200, halfH = H/(2*this.camera.zoom)+200;
    const inView = (x,y)=> Math.abs(x-this.camera.x)<halfW && Math.abs(y-this.camera.y)<halfH;

    for(const s of world.stars){ if(s.alive && inView(s.x,s.y)) world.drawStar(ctx,s); }

    for(const o of world.objects){
      if(!o.alive || !inView(o.x,o.y)) continue;
      world.drawObject(ctx, o, player.radius, player, this.showCompassArrow);
    }

    if(this.powerupObj && inView(this.powerupObj.x,this.powerupObj.y)){
      const p = this.powerupObj;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.scale(1+Math.sin(p.phase*3)*0.08, 1+Math.sin(p.phase*3)*0.08);
      ctx.shadowColor = p.type.color; ctx.shadowBlur = 26;
      ctx.font = `${p.radius*1.8}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(p.type.icon, 0, 0);
      ctx.shadowBlur=0;
      ctx.strokeStyle = p.type.color; ctx.lineWidth=5;
      ctx.beginPath(); ctx.arc(0,0,p.radius*1.15,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }

    if(world.finale.alive && inView(world.finale.x, world.finale.y)){
      world.drawFinale(ctx, world.finale, player.radius, world.chapter.accents);
    }

    this.particles.render(ctx, {x0:this.camera.x-halfW, x1:this.camera.x+halfW, y0:this.camera.y-halfH, y1:this.camera.y+halfH});

    player.draw(ctx, this.costume(), this.reducedMotion, this.trail);

    // rainbow compass — small ring around Maisie pointing toward guidance target
    if(this.showCompassArrow && this.compassTarget){
      const dx = this.compassTarget.x-player.x, dy=this.compassTarget.y-player.y;
      const ang = Math.atan2(dy,dx);
      const rr = player.displayRadius*1.9+18;
      ctx.save();
      ctx.translate(player.x + Math.cos(ang)*rr, player.y + Math.sin(ang)*rr);
      ctx.rotate(ang);
      ctx.fillStyle = this.compassTarget.kind==='finale' ? '#ffe600' : (this.compassTarget.kind==='star' ? '#ffe600' : '#39e6c8');
      ctx.beginPath();
      ctx.moveTo(14,0); ctx.lineTo(-8,-9); ctx.lineTo(-8,9); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.stroke();
      ctx.restore();
    }

    ctx.restore();
  }

  // ---------------- Main loop ----------------
  loop(now){
    let dt = Math.min(0.05, (now-this.lastTime)/1000);
    this.lastTime = now;
    this.update(dt);
    this.render();
    requestAnimationFrame(this.loop.bind(this));
  }

  // ---------------- Chapter complete / final ending ----------------
  showChapterComplete(){
    const idx = this.currentChapterIndex;
    const chapter = CHAPTERS[idx];
    const isLast = this.progress.data.universeComplete && idx===CHAPTERS.length-1;
    this.ui.hideMissions(); this.ui.hideCombo(); this.ui.hidePowerup();
    this.ui.el.completeTitle.textContent = isLast ? 'THE WHOLE UNIVERSE — EATEN!' : 'CHAPTER COMPLETE!';
    this.ui.el.completeStory.textContent = chapter.story;
    const missionsDone = this.world.chapter.missions.filter((m,i)=>this.missionCounts[i]>=m.target).length;
    this.ui.el.completeStats.innerHTML =
      '<div>⭐ '+this.starsThisChapter+'/10 stars</div>'+
      '<div>🔍 '+this.secretFoundThisChapter+'/3 secrets</div>'+
      '<div>🎵 best combo '+this.combo.best+'</div>'+
      '<div>🎯 '+missionsDone+'/3 missions</div>';
    this.ui.el.nextAdventureBtn.textContent = isLast ? 'SEE THE ENDING' : 'NEXT ADVENTURE';
    this.ui.hideAllScreens();
    this.ui.setHudVisible(false);
    this.ui.show('completeOverlay');
    this.state = 'complete';
    this._isLastCompletion = isLast;
  }

  handleNextAdventure(){
    if(this._isLastCompletion){
      this.playFinalEnding();
    } else {
      this.goToMap();
    }
  }

  playFinalEnding(){
    if(!this.progress.data.unlockedCostumes[COSTUMES.length-1]){
      this.progress.data.unlockedCostumes[COSTUMES.length-1] = true;
      this.progress.save();
    }
    this.ui.hideAllScreens();
    this.ui.show('finalOverlay');
    this.state = 'final';
    this.audio.finaleChord();
    const cv = this.ui.el.finalCanvas;
    const ctx = cv.getContext('2d');
    let start = performance.now();
    const draw = (now)=>{
      if(this.state!=='final') return;
      const t = (now-start)/1000;
      ctx.clearRect(0,0,300,300);
      ctx.save();
      ctx.translate(150,150);
      if(t<1){
        ctx.globalAlpha = clamp(1-t,0,1);
      } else {
        ctx.globalAlpha=1;
        const wob = Math.sin(t*4)*4;
        ctx.beginPath(); ctx.arc(0,wob,10,0,Math.PI*2); ctx.fillStyle='#ffe600'; ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
        if(!this.reducedMotion){
          for(let i=0;i<18;i++){
            const a = i*0.9+t*0.6;
            const r = 60+Math.sin(t*2+i)*20;
            ctx.fillStyle = CHAPTERS[i%CHAPTERS.length].accents[i%6];
            ctx.beginPath(); ctx.arc(Math.cos(a)*r, Math.sin(a)*r, 4,0,Math.PI*2); ctx.fill();
          }
        }
      }
      ctx.restore();
      requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
  }

  // ---------------- Pause ----------------
  pauseGame(){
    if(this.state!=='playing') return;
    this.state='paused';
    this.ui.show('pauseOverlay');
    this.audio.suspend();
  }
  resumeGame(){
    this.ui.hide('pauseOverlay');
    this.state='playing';
    this.lastTime = performance.now();
    this.audio.resume();
  }

  // ---------------- Wire up all DOM controls ----------------
  wireUI(){
    const ui = this.ui, el = ui.el;

    el.playBtn.addEventListener('click', ()=>{
      this.audio.ensure(); this.audio.resume();
      el.startOverlay.classList.remove('show');
      this.goToMap();
    });
    if(this.progress.hasProgress()){ el.continueBtn.style.display='inline-block'; }
    el.continueBtn.addEventListener('click', ()=>{
      this.audio.ensure(); this.audio.resume();
      el.startOverlay.classList.remove('show');
      this.goToMap();
    });

    el.introStartBtn.addEventListener('click', ()=> this.beginPlay());

    el.pauseBtn.addEventListener('click', ()=> this.pauseGame());
    el.resumeBtn.addEventListener('click', ()=> this.resumeGame());
    el.pauseMapBtn.addEventListener('click', ()=>{ this.ui.hide('pauseOverlay'); this.audio.stopAmbient(); this.goToMap(); });
    el.pauseSoundBtn.addEventListener('click', ()=>{
      this.audio.setEnabled(!this.audio.enabled);
      el.pauseSoundBtn.textContent = (this.audio.enabled?'🔊':'🔇') + ' SOUND';
    });
    el.pauseSettingsBtn.addEventListener('click', ()=>{ ui.renderSettings(); ui.show('settingsScreen'); });

    el.nextAdventureBtn.addEventListener('click', ()=> this.handleNextAdventure());
    el.finalMapBtn.addEventListener('click', ()=> this.goToMap());

    el.mapClosetBtn.addEventListener('click', ()=>{ ui.renderCostumes(); ui.hide('mapScreen'); ui.show('costumeScreen'); });
    el.mapStickerBtn.addEventListener('click', ()=>{ ui.renderStickers(); ui.hide('mapScreen'); ui.show('stickerScreen'); });
    el.mapSettingsBtn.addEventListener('click', ()=>{ ui.renderSettings(); ui.hide('mapScreen'); ui.show('settingsScreen'); });
    el.costumeCloseBtn.addEventListener('click', ()=>{ ui.hide('costumeScreen'); ui.show('mapScreen'); });
    el.stickerCloseBtn.addEventListener('click', ()=>{ ui.hide('stickerScreen'); ui.show('mapScreen'); });
    el.settingsCloseBtn.addEventListener('click', ()=>{
      ui.hide('settingsScreen');
      if(this.state==='paused'){ ui.show('pauseOverlay'); } else { ui.show('mapScreen'); }
    });

    const bindToggle = (toggleEl, getter, setter)=>{
      toggleEl.addEventListener('click', ()=>{
        const now = !getter();
        setter(now);
        ui.syncToggle(toggleEl, now);
      });
    };
    bindToggle(el.toggleSound,
      ()=>this.progress.data.settings.sound,
      (v)=>this.audio.setEnabled(v));
    bindToggle(el.toggleMotion,
      ()=>this.progress.data.settings.reducedMotion,
      (v)=>{ this.progress.data.settings.reducedMotion=v; this.reducedMotion=v; this.progress.save(); });
    bindToggle(el.toggleContrast,
      ()=>this.progress.data.settings.highContrast,
      (v)=>{ this.progress.data.settings.highContrast=v; this.highContrast=v; this.progress.save(); });
    bindToggle(el.toggleGuidance,
      ()=>this.progress.data.settings.extraGuidance,
      (v)=>{ this.progress.data.settings.extraGuidance=v; this.progress.save(); });

    el.resetProgressBtn.addEventListener('click', ()=>{
      const ok = window.confirm('Reset all stars, costumes, and stickers? This cannot be undone.');
      if(ok){
        this.progress.resetAll();
        ui.updateHudStars(0);
        ui.renderSettings();
        el.continueBtn.style.display='none';
      }
    });
  }
}

// bootstrap
window.addEventListener('load', ()=>{ new Game(); });

})();
</script>
</body>
</html>
