<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Instrument 01+</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      position: fixed; /* iOS rubber-band prevention */
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    canvas { display:block; width:100%; height:100%; cursor: crosshair; touch-action:none; }
    #splash {
      position: absolute; inset: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      cursor: pointer;
      touch-action: none;
    }
    .triangle {
      width: 0; height: 0;
      border-left: 60px solid transparent;
      border-right: 60px solid transparent;
      border-bottom: 95px solid #fff;
      transform: rotate(90deg);
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.35));
    }
    /* Minimal HUD (no labels) */
    #hud {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms ease;
      z-index: 5;
    }
    .pill {
      pointer-events: none;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 999px;
      padding: 10px 14px;
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.02em;
      font-size: 16px;
      line-height: 1;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      white-space: nowrap;
    }
    .pill.dim { border-color: rgba(255,255,255,0.35); color: rgba(255,255,255,0.65); }
  </style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


  <div id="splash" aria-label="Start"><div class="triangle"></div></div>
  <canvas id="canvas"></canvas>

  <!-- Minimal, text-light HUD. (No labels, just values) -->
  <div id="hud">
    <div class="pill" id="hudLeft">100</div>
    <div class="pill dim" id="hudMid">H</div>
    <div class="pill" id="hudRight">A4</div>
  </div>

<script>
(() => {
  const splash = document.getElementById('splash');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });

  const hud = document.getElementById('hud');
  const hudLeft = document.getElementById('hudLeft');  // BPM
  const hudMid  = document.getElementById('hudMid');   // mode glyph
  const hudRight= document.getElementById('hudRight'); // base pitch display-ish

  // --- State ---
  let audioCtx = null;
  let isRunning = false;

  const primes = [2, 3, 5, 7, 11, 13, 17];
  let active = [true, true, true, false, false, false, false];

  // Per-ring probability (density)
  const probs = [1, 1, 1, 0.75, 0.5, 0.5, 0.25];

  // Pulse animation data
  const pulse = primes.map(() => ({ t: 0, a: 0 }));

  // Motion/trail
  const trailLen = 16;
  const trail = primes.map(() => Array.from({ length: trailLen }, () => ({ x: 0, y: 0, a: 0 })));
  let trailIdx = 0;

  // Sequencing
  let step = 0;
  let nextStepTime = 0;
  let schedulerTimer = null;

  // Controls (gesture-driven)
  let bpm = 100;                 // two-finger horizontal drag
  let decay = 0.20;              // one-finger vertical drag
  let baseFreq = 220;            // one-finger horizontal drag
  let mode = 'harmonic';         // 'harmonic' or 'scale' (toggle gesture)

  // Interaction
  let dpr = 1;
  let W = 0, H = 0;
  let cx = 0, cy = 0;
  let lastTs = performance.now();

  // Pointer tracking
  const pointers = new Map(); // id -> {x,y,t0}
  let startOne = null;        // initial one-finger position/state
  let startTwo = null;        // initial two-finger midpoint/state

  // Long-press solo
  let longPressTimer = null;
  let soloIndex = -1;          // -1 = none
  let pressedIndex = -1;

  // Tap tracking (for mode toggle)
  let tapTimes = [];
  const TAP_WINDOW_MS = 420;

  // --- Helpers ---
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function hashFloat(n) {
    const x = Math.sin(n * 999.123) * 10000;
    return x - Math.floor(x);
  }

  // Frequency mapping
  const harmonicRatios = [1, 5/4, 3/2, 2, 9/4, 3, 4]; // musical-ish
  const scaleSemis = [0, 2, 3, 5, 7, 10, 12]; // minor pentatonic-ish + octave

  function freqForRing(i) {
    if (mode === 'harmonic') {
      return baseFreq * harmonicRatios[i % harmonicRatios.length];
    }
    const semi = scaleSemis[i % scaleSemis.length];
    return baseFreq * Math.pow(2, semi / 12);
  }

  // Note label-ish for hudRight (minimal text)
  const noteNames = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  function hzToNote(hz) {
    const a4 = 440;
    const n = Math.round(12 * Math.log2(hz / a4) + 69);
    const name = noteNames[(n + 1200) % 12];
    const oct = Math.floor(n / 12) - 1;
    return `${name}${oct}`;
  }

  // Canvas resize once (not every frame)
  function resize() {
    dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    canvas.width  = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in CSS pixels
    cx = W / 2;
    cy = H / 2;
  }

  function showHUD() { hud.style.opacity = "1"; }
  function hideHUDSoon() {
    clearTimeout(hideHUDSoon._t);
    hideHUDSoon._t = setTimeout(() => { hud.style.opacity = "0"; }, 1200);
  }

  function updateHUD() {
    hudLeft.textContent = String(Math.round(bpm));
    hudMid.textContent = (mode === 'harmonic') ? "H" : "S";
    hudRight.textContent = hzToNote(baseFreq);
  }

  // --- Audio graph ---
  let masterGain, masterFilter, masterDrive, masterOut;
  function makeWaveshaper(amount = 0.35) {
    const ws = audioCtx.createWaveShaper();
    const n = 1024;
    const curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      curve[i] = Math.tanh(x * (1 + amount * 10));
    }
    ws.curve = curve;
    ws.oversample = '4x';
    return ws;
  }

  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });

    masterFilter = audioCtx.createBiquadFilter();
    masterFilter.type = 'lowpass';
    masterFilter.frequency.setValueAtTime(6500, audioCtx.currentTime);
    masterFilter.Q.setValueAtTime(0.7, audioCtx.currentTime);

    masterDrive = makeWaveshaper(0.25);

    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.85, audioCtx.currentTime);

    masterOut = audioCtx.createGain();
    masterOut.gain.setValueAtTime(1.0, audioCtx.currentTime);

    masterFilter.connect(masterDrive);
    masterDrive.connect(masterGain);
    masterGain.connect(masterOut);
    masterOut.connect(audioCtx.destination);

    isRunning = true;
    splash.style.display = 'none';
    showHUD();
    updateHUD();
    nextStepTime = audioCtx.currentTime + 0.05;
    step = 0;

    schedulerTimer = setInterval(scheduler, 25);

    lastTs = performance.now();
    requestAnimationFrame(render);
  }

  function playTone(i, t, hitStrength = 1) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const pan = audioCtx.createStereoPanner();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freqForRing(i), t);

    const peak = 0.18 * hitStrength;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(peak, t + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + decay);

    const panVal = clamp((i - (primes.length - 1)/2) / ((primes.length - 1)/2), -1, 1) * 0.55;
    pan.pan.setValueAtTime(panVal, t);

    osc.connect(gain);
    gain.connect(pan);
    pan.connect(masterFilter);

    osc.start(t);
    osc.stop(t + decay + 0.03);
  }

  // --- Scheduling (lookahead) ---
  function stepIntervalSec() { return 60 / (bpm * 4); } // 16th-note feel

  function scheduler() {
    if (!isRunning || !audioCtx) return;
    const lookahead = 0.12;
    while (nextStepTime < audioCtx.currentTime + lookahead) {
      for (let i = 0; i < primes.length; i++) {
        if (!active[i]) continue;
        if (soloIndex !== -1 && soloIndex !== i) continue;
        const p = primes[i];
        if (step % p === 0) {
          const r = hashFloat(step * 97.31 + i * 13.7);
          if (r <= probs[i]) {
            playTone(i, nextStepTime, 1);
            pulse[i].t = 1;
            pulse[i].a = 1;
          }
        }
      }
      nextStepTime += stepIntervalSec();
      step++;
    }
  }

  // --- Hit testing / rings ---
  function ringRadius(i) { return 46 + i * 34; }

  function hitTestRing(x, y) {
    const dx = x - cx, dy = y - cy;
    const dist = Math.hypot(dx, dy);
    for (let i = 0; i < primes.length; i++) {
      const r = ringRadius(i);
      if (Math.abs(dist - r) < 16) return i;
    }
    return -1;
  }

  function inCenter(x, y) {
    const dx = x - cx, dy = y - cy;
    return (dx*dx + dy*dy) < (38*38);
  }

  // Cycle probability levels for a ring (two-finger tap)
  const probSteps = [1, 0.75, 0.5, 0.25, 0.1];
  function cycleProb(i) {
    const cur = probs[i];
    const idx = probSteps.findIndex(v => Math.abs(v - cur) < 0.001);
    probs[i] = probSteps[(idx + 1) % probSteps.length];
  }

  // --- Rendering ---
  function render(ts) {
    if (!isRunning) return;

    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;

    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.fillRect(0, 0, W, H);

    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fill();

    for (let i = 0; i < primes.length; i++) {
      const r = ringRadius(i);

      const pul = pulse[i];
      pul.t = Math.max(0, pul.t - dt * 2.7);
      pul.a = Math.max(0, pul.a - dt * 2.1);

      const on = active[i] && (soloIndex === -1 || soloIndex === i);
      const baseAlpha = on ? 0.95 : 0.18;
      const glow = pul.a * 0.65;

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.lineWidth = (on ? 3.2 : 1.2) + glow * 3.8;
      ctx.strokeStyle = `rgba(255,255,255,${Math.max(0, Math.min(1, baseAlpha + glow))})`;
      ctx.stroke();

      // probability arc indicator
      const pr = probs[i];
      if (pr < 0.999 && active[i]) {
        const arc = pr * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + arc);
        ctx.lineWidth = 2;
        ctx.strokeStyle = `rgba(255,255,255,${0.18 + (0.35 * pr)})`;
        ctx.stroke();
      }

      const p = primes[i];
      const phase = (step % p) / p;
      const angle = phase * Math.PI * 2 - Math.PI / 2;

      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;

      // trail buffer
      const tr = trail[i];
      tr[trailIdx].x = x;
      tr[trailIdx].y = y;
      tr[trailIdx].a = on ? 0.55 : 0.22;

      // draw trail
      for (let k = 0; k < tr.length; k++) {
        const idx = (trailIdx - k + tr.length) % tr.length;
        const tt = tr[idx];
        const a = tt.a * (1 - k / tr.length);
        if (a <= 0.01) continue;
        ctx.beginPath();
        ctx.arc(tt.x, tt.y, 2.2 + (1 - k / tr.length) * 1.6, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(x, y, on ? 5.1 : 3.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${on ? 0.95 : 0.35})`;
      ctx.fill();
    }
    trailIdx = (trailIdx + 1) % trailLen;

    requestAnimationFrame(render);
  }

  // --- Input / Gestures ---
  function onPointerDown(e) {
    if (!isRunning) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, t0: performance.now() });

    const count = pointers.size;

    if (count === 1) {
      startOne = { x: e.clientX, y: e.clientY, bpm, decay, baseFreq };
      pressedIndex = hitTestRing(e.clientX, e.clientY);

      // center tap tracking (double-tap toggles mode)
      if (inCenter(e.clientX, e.clientY)) {
        const now = performance.now();
        tapTimes = tapTimes.filter(t => now - t < TAP_WINDOW_MS);
        tapTimes.push(now);
        if (tapTimes.length >= 2 && (tapTimes[tapTimes.length - 1] - tapTimes[tapTimes.length - 2]) < 240) {
          mode = (mode === 'harmonic') ? 'scale' : 'harmonic';
          updateHUD();
        }
      }

      // Long press to solo ring
      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(() => {
        if (pressedIndex !== -1) {
          soloIndex = (soloIndex === pressedIndex) ? -1 : pressedIndex;
          showHUD(); updateHUD(); hideHUDSoon();
        }
      }, 420);

    } else if (count === 2) {
      clearTimeout(longPressTimer);
      const pts = Array.from(pointers.values());
      const mx = (pts[0].x + pts[1].x) / 2;
      const my = (pts[0].y + pts[1].y) / 2;
      const dx = pts[0].x - pts[1].x;
      const dy = pts[0].y - pts[1].y;
      startTwo = { mx, my, bpm, baseFreq, decay, dist: Math.hypot(dx, dy) };
    }

    showHUD(); updateHUD();
  }

  function onPointerMove(e) {
    if (!isRunning) return;
    if (!pointers.has(e.pointerId)) return;
    e.preventDefault();

    const p = pointers.get(e.pointerId);
    p.x = e.clientX;
    p.y = e.clientY;

    const count = pointers.size;

    // cancel long press on movement
    if (count === 1 && startOne) {
      const dx = e.clientX - startOne.x;
      const dy = e.clientY - startOne.y;
      if ((dx*dx + dy*dy) > 12*12) clearTimeout(longPressTimer);

      // One-finger: pitch + decay
      baseFreq = clamp(startOne.baseFreq * Math.pow(2, dx / 480), 55, 880);
      decay = clamp(startOne.decay + (-dy / 900), 0.05, 1.2);

      updateHUD();
      hideHUDSoon();
    }

    // Two-finger: tempo (horizontal midpoint)
    if (count === 2 && startTwo) {
      const pts = Array.from(pointers.values());
      const mx = (pts[0].x + pts[1].x) / 2;
      const dx = mx - startTwo.mx;
      bpm = clamp(startTwo.bpm + dx * 0.20, 20, 220);

      updateHUD();
      hideHUDSoon();
    }
  }

  function onPointerUp(e) {
    if (!isRunning) return;
    e.preventDefault();

    clearTimeout(longPressTimer);

    const wasCount = pointers.size;
    const p0 = pointers.get(e.pointerId);
    pointers.delete(e.pointerId);

    const nowCount = pointers.size;

    // Single-finger tap
    if (wasCount === 1 && p0 && startOne) {
      const dt = performance.now() - p0.t0;
      const moved = Math.hypot(p0.x - startOne.x, p0.y - startOne.y);

      if (dt < 260 && moved < 12) {
        const idx = hitTestRing(p0.x, p0.y);
        if (idx !== -1) {
          active[idx] = !active[idx];
          pulse[idx].t = 1; pulse[idx].a = 1;
        } else if (inCenter(p0.x, p0.y)) {
          step = 0;
          if (audioCtx) nextStepTime = audioCtx.currentTime + 0.03;
        }
      }
    }

    // Two-finger quick tap -> cycle probability at midpoint
    if (wasCount === 2 && startTwo) {
      const elapsed = performance.now() - (startTwo._t0 || 0);
      // If we didn't store _t0, approximate: if both pointers were very short, still okay.
      const midx = startTwo.mx, midy = startTwo.my;
      const idx = hitTestRing(midx, midy);
      // Only do this if the interaction was brief-ish: if user didn't drag much, startTwo stays near.
      // We'll detect based on how far bpm moved from start.
      if (Math.abs(bpm - startTwo.bpm) < 2.5 && idx !== -1) {
        cycleProb(idx);
        pulse[idx].t = 1; pulse[idx].a = 1;
      }
    }

    if (nowCount === 0) {
      startOne = null;
      startTwo = null;
      pressedIndex = -1;
      hideHUDSoon();
    } else if (nowCount === 1) {
      const only = Array.from(pointers.values())[0];
      startOne = { x: only.x, y: only.y, bpm, decay, baseFreq };
      pressedIndex = hitTestRing(only.x, only.y);
      startTwo = null;
    }
  }

  window.addEventListener('contextmenu', (e) => e.preventDefault());

  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  canvas.addEventListener('pointermove', onPointerMove, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp, { passive: false });
  canvas.addEventListener('pointercancel', onPointerUp, { passive: false });

  // Start
  splash.addEventListener('click', () => {
    resize();
    initAudio();
    hideHUDSoon();
  }, { passive: true });

  window.addEventListener('resize', resize, { passive: true });

  resize();
})();
</script>
</body>
</html>
