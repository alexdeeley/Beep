<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spotify setup — deeley.org</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #000;
    color: #f2f2f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 56px 24px 100px;
  }
  h1 {
    font-weight: 800;
    letter-spacing: -0.02em;
    font-size: 1.4rem;
    margin: 0 0 16px;
  }
  p { color: #9a9aa4; line-height: 1.6; }
  textarea {
    width: 100%;
    min-height: 90px;
    margin-top: 16px;
    padding: 12px;
    background: #111114;
    color: #f2f2f5;
    border: 1px solid #2a2a30;
    border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.85rem;
    resize: vertical;
  }
  .error { color: #ff6b6b; }
</style>
</head>
<body>
<main>
  <h1>Spotify authorization</h1>
  <div id="content"></div>
</main>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const error = params.get("error");
  const el = document.getElementById("content");

  function addP(text, className) {
    const p = document.createElement("p");
    if (className) p.className = className;
    p.textContent = text;
    el.appendChild(p);
  }

  if (error) {
    addP("Spotify returned an error: " + error, "error");
  } else if (code) {
    addP("Copy this authorization code and paste it back to finish setup. It's single-use and expires in a few minutes.");
    const textarea = document.createElement("textarea");
    textarea.readOnly = true;
    textarea.value = code;
    textarea.addEventListener("click", () => textarea.select());
    el.appendChild(textarea);
  } else {
    addP("No authorization code found in the URL. This page is only meant to be reached via the Spotify login redirect.");
  }
</script>
</body>
</html>
