<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>About — deeley.org</title>
<meta name="description" content="About deeley.org and where to find more." />
<meta name="theme-color" content="#000000" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="deeley.org" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #000;
    color: #f2f2f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 24px 100px;
  }
  header { margin-bottom: 24px; }
  h1 {
    font-weight: 800;
    letter-spacing: -0.02em;
    font-size: 0.95rem;
    text-transform: lowercase;
    color: #6b6b78;
    margin: 0 0 4px;
  }
  header p {
    color: #46464f;
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
  }
  .blurb {
    color: #9a9aa4;
    font-size: 0.95rem;
    line-height: 1.6;
    margin: 24px 0 8px;
  }
  .list-heading {
    color: #6b6b78;
    font-weight: 800;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 28px 0 4px;
  }
  a.link-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-decoration: none;
    color: #f2f2f5;
    padding: 16px 0;
    border-bottom: 1px solid #141416;
    transition: color 0.15s, padding-left 0.15s;
  }
  a.link-item:last-child { border-bottom: 0; }
  a.link-item:hover, a.link-item:active {
    color: #fff;
    padding-left: 12px;
  }
  a.link-item h2 {
    margin: 0;
    font-weight: 800;
    font-size: clamp(1.4rem, 5.5vw, 1.9rem);
    letter-spacing: -0.02em;
    line-height: 1.08;
  }
  a.link-item p {
    margin: 3px 0 0;
    color: #5c5c68;
    font-size: 0.66rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 700;
    line-height: 1.4;
    transition: color 0.15s;
  }
  a.link-item:hover p, a.link-item:active p { color: #8c8c9a; }
  a.link-item .arrow {
    flex: 0 0 auto;
    color: #46464f;
    font-size: 1.4rem;
    transition: color 0.15s;
  }
  a.link-item:hover .arrow, a.link-item:active .arrow { color: #8c8c9a; }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to deeley.org" title="Back to deeley.org">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>
<main>
  <header>
    <h1>about</h1>
    <p>deeley.org</p>
  </header>

  <p class="blurb">A small gallery of self-contained apps — games, art, and music tools, all built to play with right in the browser.</p>

  <div class="list-heading">Elsewhere</div>

  <a class="link-item" href="https://alexdeeley.substack.com" target="_blank" rel="noopener noreferrer">
    <div>
      <h2>Substack</h2>
      <p>@alexdeeley</p>
    </div>
    <span class="arrow">&#8599;</span>
  </a>

  <a class="link-item" href="https://www.instagram.com/_alexs_art_alt_/" target="_blank" rel="noopener noreferrer">
    <div>
      <h2>Instagram</h2>
      <p>@_alexs_art_alt_</p>
    </div>
    <span class="arrow">&#8599;</span>
  </a>
</main>
</body>
</html>
