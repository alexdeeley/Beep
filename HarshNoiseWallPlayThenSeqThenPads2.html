<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>HNW Play</title>
<style>
  :root{
    --bg:#000;
    --fg:#fff;
    --gap:10px;
    --pad:12px;
    --stroke:4px;
    --radius:12px;

    --seqStroke:3px;
    --seqRadius:10px;
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg);
    overflow:hidden;
    touch-action:none;
    position:fixed;
  }
  *{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }

  /* Start screen */
  #start{
    position:fixed; inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
  }
  #playBtn{
    width:min(56vmin, 340px);
    aspect-ratio:1/1;
    border: calc(var(--stroke) * 2) solid var(--fg);
    border-radius: 24px;
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    outline:none;
  }
  #playBtn:active{ transform:scale(0.995); }
  #playIcon{
    width:0; height:0;
    border-top: 52px solid transparent;
    border-bottom: 52px solid transparent;
    border-left: 86px solid var(--fg);
    transform: translateX(10px);
  }
  @media (max-width: 420px){
    #playIcon{
      border-top: 40px solid transparent;
      border-bottom: 40px solid transparent;
      border-left: 66px solid var(--fg);
      transform: translateX(8px);
    }
  }

  /* Main layout */
  #wrap{
    width:100vw; height:100vh;
    display:flex;
    flex-direction:column;
    gap:var(--gap);
    padding:var(--pad);
    background:var(--bg);
    opacity:0;
    pointer-events:none;
    transition: opacity 180ms linear;
  }
  #wrap.on{
    opacity:1;
    pointer-events:auto;
  }

  /* Sequencer */
  #seq{
    flex: 0 0 auto;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .row{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:8px;
  }
  .step{
    border:var(--seqStroke) solid var(--fg);
    border-radius:var(--seqRadius);
    background:var(--bg);
    height: clamp(34px, 6vh, 54px);
    position:relative;
    overflow:hidden;
    outline:none;
  }
  .step.on{ background:var(--fg); }
  .step.on::after{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(135deg, var(--bg) 0 2px, transparent 2px 10px);
    opacity:0.25;
    pointer-events:none;
  }
  .step.playing{
    box-shadow: 0 0 0 3px var(--fg) inset;
  }
  /* Each row has a subtly different pattern (no words) */
  .row[data-row="kick"] .step::before,
  .row[data-row="snare"] .step::before,
  .row[data-row="hat"] .step::before{
    content:"";
    position:absolute; inset:0;
    opacity:0.10;
    mix-blend-mode:difference;
    pointer-events:none;
  }
  .row[data-row="kick"] .step::before{ background:repeating-linear-gradient(0deg, var(--fg) 0 2px, transparent 2px 12px); }
  .row[data-row="snare"] .step::before{ background:repeating-linear-gradient(90deg, var(--fg) 0 2px, transparent 2px 12px); }
  .row[data-row="hat"]  .step::before{ background:repeating-linear-gradient(45deg, var(--fg) 0 2px, transparent 2px 12px); }

  /* Pads */
  #grid{
    flex: 1 1 auto;
    min-height: 0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:var(--gap);
  }
  .sq{
    border:var(--stroke) solid var(--fg);
    border-radius:var(--radius);
    background:var(--bg);
    position:relative;
    overflow:hidden;
    outline:none;
  }
  .fill{
    position:absolute; left:0; bottom:0; width:100%;
    height:0%;
    background:var(--fg);
  }
  .sq.armed{ background:var(--fg); }
  .sq.armed .fill{ background:var(--bg); }

  .sq::after{
    content:"";
    position:absolute; inset:0;
    opacity:0.12;
    background: repeating-linear-gradient(45deg, var(--fg) 0 2px, transparent 2px 12px);
    mix-blend-mode:difference;
    pointer-events:none;
  }
  .sq[data-ix="1"]::after{ background:repeating-linear-gradient(0deg, var(--fg) 0 2px, transparent 2px 12px); }
  .sq[data-ix="2"]::after{ background:repeating-linear-gradient(90deg, var(--fg) 0 2px, transparent 2px 12px); }
  .sq[data-ix="3"]::after{ background:repeating-linear-gradient(135deg, var(--fg) 0 2px, transparent 2px 14px); }
  .sq[data-ix="4"]::after{ background:repeating-linear-gradient(25deg, var(--fg) 0 2px, transparent 2px 10px); }
  .sq[data-ix="5"]::after{ background:repeating-linear-gradient(70deg, var(--fg) 0 2px, transparent 2px 16px); }
  .sq[data-ix="6"]::after{ background:repeating-linear-gradient(110deg, var(--fg) 0 2px, transparent 2px 13px); }
  .sq[data-ix="7"]::after{ background:repeating-linear-gradient(160deg, var(--fg) 0 2px, transparent 2px 11px); }
  .sq[data-ix="8"]::after{ background:repeating-linear-gradient(200deg, var(--fg) 0 2px, transparent 2px 15px); }

  /* Tighten for small heights */
  @media (max-height: 720px){
    :root{ --gap:8px; --pad:10px; --stroke:4px; }
    .row{ gap:7px; }
  }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


  <!-- Start -->
  <div id="start" aria-label="Start">
    <button id="playBtn" aria-label="Play">
      <div id="playIcon" aria-hidden="true"></div>
    </button>
  </div>

  <!-- Main -->
  <div id="wrap" aria-label="Harsh noise wall generator with sequencer">
    <!-- Sequencer first -->
    <div id="seq" aria-label="Step sequencer">
      <div class="row" data-row="kick" aria-label="Row 1"></div>
      <div class="row" data-row="snare" aria-label="Row 2"></div>
      <div class="row" data-row="hat" aria-label="Row 3"></div>
    </div>

    <!-- Pads second -->
    <div id="grid" aria-label="Pads">
      <div class="sq" data-ix="0" data-param="master" role="button" aria-label="Pad 1"><div class="fill"></div></div>
      <div class="sq" data-ix="1" data-param="noise"  role="button" aria-label="Pad 2"><div class="fill"></div></div>
      <div class="sq" data-ix="2" data-param="filter" role="button" aria-label="Pad 3"><div class="fill"></div></div>

      <div class="sq" data-ix="3" data-param="drive"  role="button" aria-label="Pad 4"><div class="fill"></div></div>
      <div class="sq" data-ix="4" data-param="oscMix" role="button" aria-label="Pad 5"><div class="fill"></div></div>
      <div class="sq" data-ix="5" data-param="oscPit" role="button" aria-label="Pad 6"><div class="fill"></div></div>

      <div class="sq" data-ix="6" data-param="crush"  role="button" aria-label="Pad 7"><div class="fill"></div></div>
      <div class="sq" data-ix="7" data-param="fb"     role="button" aria-label="Pad 8"><div class="fill"></div></div>
      <div class="sq" data-ix="8" data-param="motion" role="button" aria-label="Pad 9"><div class="fill"></div></div>
    </div>
  </div>

<script>
(() => {
  // ========= UI refs =========
  const startScreen = document.getElementById("start");
  const playBtn = document.getElementById("playBtn");
  const wrap = document.getElementById("wrap");

  // ========= Audio Engine =========
  let ctx = null;

  // Params are 0..1
  const P = {
    master: 0.40,   // start audible
    noise:  0.78,
    filter: 0.52,
    drive:  0.62,
    oscMix: 0.20,
    oscPit: 0.35,
    crush:  0.10,
    fb:     0.40,
    motion: 0.55
  };

  // Sequencer
  const STEPS = 8;
  const BPM = 128; // simple fixed tempo
  const stepDur = () => (60 / BPM) / 2; // 8th notes

  let stepIndex = 0;
  let nextStepTime = 0;
  let schedTimer = null;

  // Patterns (random on start)
  const pat = { kick:new Array(STEPS).fill(0), snare:new Array(STEPS).fill(0), hat:new Array(STEPS).fill(0) };

  // Nodes
  let masterGain, noiseGain, oscGain, preGain, shaper, comp, lp, hp;
  let delay, fbGain, wetGain, dryGain;
  let crushNode;
  let noise1, noise2, noise3;
  let osc1, osc2;
  let drumSum;

  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  function expMap(x, a=1.8){ return Math.pow(clamp01(x), a); }

  function makeNoiseBuffer(seconds=2.0){
    const sr = ctx.sampleRate;
    const len = Math.floor(seconds * sr);
    const buf = ctx.createBuffer(1, len, sr);
    const data = buf.getChannelData(0);
    let rw = 0;
    for(let i=0;i<len;i++){
      const w = (Math.random()*2-1);
      rw = 0.995*rw + 0.005*(Math.random()*2-1);
      data[i] = 0.85*w + 0.35*rw;
    }
    return buf;
  }

  function makeShaperCurve(amount){
    const k = 1 + amount * 220;
    const n = 44100;
    const curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i * 2 / (n - 1)) - 1;
      curve[i] = (1 + k) * x / (1 + k * Math.abs(x));
    }
    return curve;
  }

  function createBitCrusher(){
    const sp = ctx.createScriptProcessor(4096, 1, 1);
    let ph = 0;
    let last = 0;
    sp.onaudioprocess = (e) => {
      const input = e.inputBuffer.getChannelData(0);
      const output = e.outputBuffer.getChannelData(0);
      const c = clamp01(P.crush);
      const bits = 16 - Math.floor(c * 12);
      const step = Math.pow(0.5, bits);
      const rateDiv = 1 + Math.floor(c * 40);
      for(let i=0;i<input.length;i++){
        ph++;
        if(ph >= rateDiv){
          ph = 0;
          last = Math.round(input[i] / step) * step;
        }
        output[i] = last;
      }
    };
    return sp;
  }

  // ========= Drums =========
  function drumKick(time, vel=1){
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(140, time);
    o.frequency.exponentialRampToValueAtTime(40, time + 0.12);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.9 * vel, time + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.18);
    o.connect(g); g.connect(drumSum);
    o.start(time); o.stop(time + 0.22);
  }
  function drumSnare(time, vel=1){
    const b = ctx.createBufferSource();
    b.buffer = makeNoiseBuffer(0.25);
    const hpf = ctx.createBiquadFilter();
    hpf.type = "highpass"; hpf.frequency.setValueAtTime(900, time);
    const bpf = ctx.createBiquadFilter();
    bpf.type = "bandpass"; bpf.frequency.setValueAtTime(1800, time); bpf.Q.setValueAtTime(0.8, time);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.75 * vel, time + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.16);
    b.connect(hpf); hpf.connect(bpf); bpf.connect(g); g.connect(drumSum);
    b.start(time); b.stop(time + 0.18);

    const o = ctx.createOscillator();
    const tg = ctx.createGain();
    o.type = "triangle"; o.frequency.setValueAtTime(210, time);
    tg.gain.setValueAtTime(0.0001, time);
    tg.gain.exponentialRampToValueAtTime(0.25 * vel, time + 0.002);
    tg.gain.exponentialRampToValueAtTime(0.0001, time + 0.09);
    o.connect(tg); tg.connect(drumSum);
    o.start(time); o.stop(time + 0.11);
  }
  function drumHat(time, vel=1){
    const b = ctx.createBufferSource();
    b.buffer = makeNoiseBuffer(0.12);
    const hpf = ctx.createBiquadFilter();
    hpf.type = "highpass"; hpf.frequency.setValueAtTime(6500, time);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.35 * vel, time + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);
    b.connect(hpf); hpf.connect(g); g.connect(drumSum);
    b.start(time); b.stop(time + 0.08);
  }

  function build(){
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });

    masterGain = ctx.createGain();
    masterGain.gain.value = 0.0001;

    const noiseBuf = makeNoiseBuffer(2.0);
    function mkNoiseSource(playbackRate){
      const s = ctx.createBufferSource();
      s.buffer = noiseBuf;
      s.loop = true;
      s.playbackRate.value = playbackRate;
      return s;
    }
    noise1 = mkNoiseSource(0.95);
    noise2 = mkNoiseSource(1.00);
    noise3 = mkNoiseSource(1.05);

    noiseGain = ctx.createGain();
    noiseGain.gain.value = 0.0001;

    osc1 = ctx.createOscillator();
    osc2 = ctx.createOscillator();
    osc1.type = "sawtooth";
    osc2.type = "square";
    oscGain = ctx.createGain();
    oscGain.gain.value = 0.0001;

    drumSum = ctx.createGain();
    drumSum.gain.value = 1.0;

    preGain = ctx.createGain();
    preGain.gain.value = 1.0;

    shaper = ctx.createWaveShaper();
    shaper.oversample = "4x";

    crushNode = createBitCrusher();

    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -24;
    comp.knee.value = 24;
    comp.ratio.value = 12;
    comp.attack.value = 0.003;
    comp.release.value = 0.25;

    hp = ctx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 25;
    hp.Q.value = 0.7;

    lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 12000;
    lp.Q.value = 0.9;

    delay = ctx.createDelay(0.05);
    delay.delayTime.value = 0.012;

    fbGain = ctx.createGain();
    fbGain.gain.value = 0.0;

    wetGain = ctx.createGain();
    dryGain = ctx.createGain();

    // Routing
    noise1.connect(noiseGain);
    noise2.connect(noiseGain);
    noise3.connect(noiseGain);

    osc1.connect(oscGain);
    osc2.connect(oscGain);

    const sum = ctx.createGain();
    noiseGain.connect(sum);
    oscGain.connect(sum);
    drumSum.connect(sum);

    sum.connect(preGain);
    preGain.connect(shaper);
    shaper.connect(crushNode);
    crushNode.connect(comp);
    comp.connect(hp);
    hp.connect(lp);

    lp.connect(dryGain);
    dryGain.connect(masterGain);

    lp.connect(delay);
    delay.connect(wetGain);
    wetGain.connect(masterGain);

    delay.connect(fbGain);
    fbGain.connect(delay);

    masterGain.connect(ctx.destination);

    const now = ctx.currentTime + 0.01;
    osc1.frequency.setValueAtTime(110, now);
    osc2.frequency.setValueAtTime(110, now);
    osc1.start(now); osc2.start(now);
    noise1.start(now); noise2.start(now); noise3.start(now);

    applyAll(true);
    tick();

    // Sequencer
    stepIndex = 0;
    nextStepTime = ctx.currentTime + 0.06;
    startScheduler();
  }

  let raf = 0;
  function tick(){
    if(!ctx) return;
    const t = ctx.currentTime;
    const m = expMap(P.motion, 1.2);

    const lfo1 = Math.sin(t * (0.14 + m*0.9));
    const lfo2 = Math.sin(t * (0.37 + m*1.7) + 1.7);
    const lfo3 = Math.sin(t * (0.09 + m*0.6) + 0.4);

    const baseLP = 300 + expMap(P.filter, 2.2) * 17500;
    const wobLP  = baseLP * (1 + 0.12*m*lfo1);
    lp.frequency.setTargetAtTime(Math.max(120, Math.min(19000, wobLP)), t, 0.05);

    const baseDelay = 0.004 + expMap(P.noise, 1.6) * 0.020;
    const wobDelay  = baseDelay * (1 + 0.25*m*lfo2);
    delay.delayTime.setTargetAtTime(Math.max(0.001, Math.min(0.05, wobDelay)), t, 0.05);

    const baseHz = 28 + expMap(P.oscPit, 2.0) * 750;
    osc1.frequency.setTargetAtTime(baseHz, t, 0.05);
    osc2.frequency.setTargetAtTime(baseHz * (1.003 + 0.012*m*(0.5+0.5*lfo3)), t, 0.05);
    osc1.detune.setTargetAtTime((m*12)*lfo2, t, 0.05);
    osc2.detune.setTargetAtTime((-m*18)*lfo1, t, 0.05);

    raf = requestAnimationFrame(tick);
  }

  function applyAll(immediate=false){
    if(!ctx) return;
    const t = ctx.currentTime;
    const set = (param, v, tc=0.03) => {
      if(immediate) param.setValueAtTime(v, t);
      else param.setTargetAtTime(v, t, tc);
    };

    // Master: keep above tiny floor so it always passes audio
    const mg = Math.max(0.02, expMap(P.master, 2.0) * 0.9);
    set(masterGain.gain, mg, 0.06);

    const ng = 0.02 + expMap(P.noise, 1.3) * 0.98;
    set(noiseGain.gain, ng, 0.05);

    const pg = 1.0 + expMap(P.drive, 1.7) * 18.0;
    set(preGain.gain, pg, 0.06);

    shaper.curve = makeShaperCurve(expMap(P.drive, 1.2));

    const og = expMap(P.oscMix, 1.6) * 0.7;
    set(oscGain.gain, og, 0.05);

    const fbg = expMap(P.fb, 1.6) * 0.92;
    set(fbGain.gain, fbg, 0.08);

    const wet = 0.25 + expMap(P.noise, 1.4) * 0.55;
    set(wetGain.gain, wet, 0.08);
    set(dryGain.gain, 1.0 - wet*0.6, 0.08);

    const hpHz = 20 + expMap(P.drive, 1.5) * 120;
    set(hp.frequency, hpHz, 0.08);
  }

  // ========= Scheduler (more reliable than RAF only) =========
  const lookAhead = 0.18;  // seconds
  const timerInt = 20;     // ms

  function startScheduler(){
    if(schedTimer) clearInterval(schedTimer);
    schedTimer = setInterval(() => {
      if(!ctx || ctx.state !== "running") return;
      while(nextStepTime < ctx.currentTime + lookAhead){
        scheduleStep(stepIndex, nextStepTime);
        nextStepTime += stepDur();
        stepIndex = (stepIndex + 1) % STEPS;
      }
    }, timerInt);
  }

  function scheduleStep(ix, time){
    setPlayhead(ix);
    const vel = 1.0;
    if(pat.kick[ix])  drumKick(time, vel);
    if(pat.snare[ix]) drumSnare(time, vel);
    if(pat.hat[ix])   drumHat(time, vel);
  }

  // ========= Random pattern =========
  function rnd(p){ return Math.random() < p ? 1 : 0; }
  function randomize(){
    // Hat: mostly on, but with holes
    for(let i=0;i<STEPS;i++) pat.hat[i] = rnd(0.85);
    // Kick: anchor on 1 and 5, plus a couple extras
    for(let i=0;i<STEPS;i++) pat.kick[i] = 0;
    pat.kick[0] = 1; pat.kick[4] = 1;
    for(let i=0;i<STEPS;i++) if(!pat.kick[i]) pat.kick[i] = rnd(0.22);
    // Snare: usually on 3 and 7, plus maybe a ghost
    for(let i=0;i<STEPS;i++) pat.snare[i] = 0;
    pat.snare[2] = 1; pat.snare[6] = 1;
    for(let i=0;i<STEPS;i++) if(!pat.snare[i]) pat.snare[i] = rnd(0.10);

    // Ensure at least one hat, kick, snare
    if(pat.hat.reduce((a,b)=>a+b,0)===0) pat.hat[1]=1;
    if(pat.kick.reduce((a,b)=>a+b,0)===0) pat.kick[0]=1;
    if(pat.snare.reduce((a,b)=>a+b,0)===0) pat.snare[2]=1;

    refreshSeq();
  }

  // ========= Pads UI =========
  const pads = Array.from(document.querySelectorAll(".sq"));
  const padState = new Map();

  function setFill(el, v){
    el.querySelector(".fill").style.height = (clamp01(v) * 100).toFixed(2) + "%";
  }
  function refreshPads(){
    pads.forEach(el => setFill(el, P[el.dataset.param] ?? 0));
  }

  function padDown(e, el){
    e.preventDefault();
    if(!ctx) return;
    const p = el.dataset.param;
    const rect = el.getBoundingClientRect();
    const localY = e.clientY - rect.top;
    const v = 1 - (localY / rect.height);
    const newV = clamp01(0.7 * (P[p] ?? 0) + 0.3 * v);
    P[p] = newV;
    setFill(el, newV);
    el.classList.add("armed");
    applyAll(false);
    padState.set(e.pointerId, { el, p, lastMove: performance.now() });
    el.setPointerCapture(e.pointerId);
  }

  function padMove(e){
    const st = padState.get(e.pointerId);
    if(!st) return;
    e.preventDefault();
    const el = st.el;
    const p = st.p;
    const rect = el.getBoundingClientRect();
    const localY = e.clientY - rect.top;
    const v = 1 - (localY / rect.height);

    const now = performance.now();
    const dt = Math.max(1, now - st.lastMove);
    st.lastMove = now;
    const alpha = Math.min(1, dt / 32);

    P[p] = clamp01((1-alpha) * (P[p] ?? 0) + alpha * v);
    setFill(el, P[p]);
    applyAll(false);
  }

  function padUp(e){
    const st = padState.get(e.pointerId);
    if(!st) return;
    e.preventDefault();
    st.el.classList.remove("armed");
    padState.delete(e.pointerId);
  }

  pads.forEach(el => el.addEventListener("pointerdown", (e)=>padDown(e, el), {passive:false}));
  window.addEventListener("pointermove", padMove, {passive:false});
  window.addEventListener("pointerup", padUp, {passive:false});
  window.addEventListener("pointercancel", padUp, {passive:false});

  // ========= Sequencer UI =========
  const rows = Array.from(document.querySelectorAll(".row"));
  const stepEls = { kick: [], snare: [], hat: [] };

  function makeStep(rowName, ix){
    const d = document.createElement("div");
    d.className = "step";
    d.dataset.row = rowName;
    d.dataset.ix = String(ix);
    d.setAttribute("role", "button");
    d.setAttribute("aria-label", rowName + " step " + (ix+1));
    d.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if(!ctx) return;
      pat[rowName][ix] = pat[rowName][ix] ? 0 : 1;
      d.classList.toggle("on", !!pat[rowName][ix]);
      // Quick audition: tap = play that sound right now
      const t = ctx.currentTime + 0.002;
      if(rowName==="kick") drumKick(t, 1);
      if(rowName==="snare") drumSnare(t, 1);
      if(rowName==="hat") drumHat(t, 1);
    }, {passive:false});
    return d;
  }

  rows.forEach(r => {
    const name = r.dataset.row;
    for(let i=0;i<STEPS;i++){
      const s = makeStep(name, i);
      r.appendChild(s);
      stepEls[name].push(s);
    }
  });

  function refreshSeq(){
    for(const k of ["kick","snare","hat"]){
      for(let i=0;i<STEPS;i++){
        stepEls[k][i].classList.toggle("on", !!pat[k][i]);
      }
    }
  }

  function setPlayhead(ix){
    for(const k of ["kick","snare","hat"]){
      for(let i=0;i<STEPS;i++){
        stepEls[k][i].classList.toggle("playing", i===ix);
      }
    }
  }

  // ========= Start flow =========
  async function start(){
    // Build audio + ensure running
    if(!ctx) build();
    try { await ctx.resume(); } catch(_){}

    randomize();
    refreshPads();

    // Show UI
    startScreen.style.display = "none";
    wrap.classList.add("on");
  }

  playBtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    start();
  }, {passive:false});

  // Keep it alive: if iOS suspends, restart scheduler on resume gesture anywhere
  document.addEventListener("pointerdown", async () => {
    if(!ctx) return;
    if(ctx.state === "suspended"){
      try { await ctx.resume(); } catch(_){}
      startScheduler();
    }
  }, {passive:false});

  // Suspend when hidden
  document.addEventListener("visibilitychange", () => {
    if(!ctx) return;
    if(document.hidden){
      ctx.suspend();
    }
  });

})();
</script>
</body>
</html>
