<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>NEON CATCH — Icon Edition</title>
<style>
  html, body { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; touch-action:none; }
  .hud { position:fixed; left:0; top:0; width:100vw; display:flex; justify-content:space-between;
         font-family: system-ui, -apple-system, Helvetica, Arial, sans-serif; font-weight:800;
         letter-spacing:0.5px; color:#fff; padding:10px 14px; user-select:none; }
  .hud span { font-size:18px; }
  .hint { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
          color:#fff; font-family: system-ui, -apple-system, Helvetica, Arial, sans-serif;
          text-align:center; line-height:1.25; user-select:none; }
  .hint .title { font-size:28px; font-weight:900; margin-bottom:12px; }
  .hint .sub { font-size:14px; opacity:0.85; }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="game"></canvas>
<div class="hud" id="hud" aria-hidden="true">
  <span id="score">0</span>
  <span id="mult">x1</span>
</div>
<div class="hint" id="hint">
  <div class="title">NEON CATCH — Icon Edition</div>
  <div class="sub">
    Drag the <b>white circle</b> • Catch <b>white</b> • Dodge <b style="color:#ff2147">blinking red stars</b><br/>
    <b style="color:#39d0ff">Blue</b> powerups are magnetized toward you<br/><br/>
    <b>Tap to start</b>
  </div>
</div>
<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W=0, H=0;
  function resize(){
    W = Math.max(1, Math.floor(innerWidth));
    H = Math.max(1, Math.floor(innerHeight));
    canvas.width = W; canvas.height = H;
    player.y = Math.min(H*0.8, H-90);
    player.x = W*0.5;
    player.tx = player.x; player.ty = player.y;
  }
  addEventListener('resize', resize, {passive:true});

  // ----- Game State -----
  let running = false;
  let tms = 0;
  let lastSpawn = 0;
  let score = 0;
  let mult = 1, multTimer = 0;
  let best = 0;
  let objects = [];
  let particles = [];
  let slowMoUntil = 0;
  let widenUntil = 0;
  let shakeT = 0;

  const hudScore = document.getElementById('score');
  const hudMult  = document.getElementById('mult');
  const hint = document.getElementById('hint');

  // ----- Player (character icon) -----
  const player = {
    x: 0, y: 0, r: 26,
    tx: 0, ty: 0,
    vx: 0, vy: 0
  };

  // ----- Input -----
  function posFromEvent(e){
    const r = canvas.getBoundingClientRect();
    let cx,cy;
    if(e.touches && e.touches[0]){ cx=e.touches[0].clientX-r.left; cy=e.touches[0].clientY-r.top; }
    else { cx=e.clientX-r.left; cy=e.clientY-r.top; }
    return {x:cx, y:cy};
  }
  function down(e){
    e.preventDefault();
    const p = posFromEvent(e);
    if(!running){ startGame(); }
    player.tx = p.x; player.ty = p.y;
  }
  function move(e){
    if(!running) return;
    e.preventDefault();
    const p = posFromEvent(e);
    player.tx = p.x; player.ty = p.y;
  }
  function up(){}
  canvas.addEventListener('touchstart', down, {passive:false});
  addEventListener('touchmove', move, {passive:false});
  addEventListener('touchend', up, {passive:true});
  canvas.addEventListener('mousedown', down, {passive:false});
  addEventListener('mousemove', move, {passive:false});
  addEventListener('mouseup', up, {passive:true});

  // ----- Helpers -----
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function rand(a,b){ return a + Math.random()*(b-a); }
  function dist2(ax,ay,bx,by){ const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }

  // ----- Start/Reset -----
  function reset(){
    running=false; tms=0; lastSpawn=0; score=0; mult=1; multTimer=0;
    objects.length=0; particles.length=0;
    slowMoUntil=0; widenUntil=0; shakeT=0;
    hudScore.textContent='0'; hudMult.textContent='x1';
    hint.style.display='block';
  }
  function startGame(){
    running=true; tms=0; lastSpawn=0; score=0; mult=1; multTimer=0;
    objects.length=0; particles.length=0; slowMoUntil=0; widenUntil=0; shakeT=0;
    hint.style.display='none';
  }

  // ----- Spawning -----
  function spawn(){
    const secs = tms/1000;
    const baseRate = 700;
    const rate = Math.max(140, baseRate - secs*9);
    if (tms - lastSpawn < rate) return;
    lastSpawn = tms;

    // 0=good white, 1=hazard red star, 2=power blue homing
    const hazardBias = Math.min(0.5, secs*0.006);
    const powerBias  = Math.max(0.10, 0.18 - secs*0.0035);
    const r = Math.random();
    let type = 0;
    if (r < powerBias) type = 2;
    else if (r < powerBias + hazardBias) type = 1;
    else type = 0;

    const slowFactor = (tms < slowMoUntil) ? 0.55 : 1.0;
    const speed = (2.0 + Math.min(6.5, secs*0.08)) * slowFactor;

    const obj = {
      x: rand(30, W-30),
      y: -30,
      vy: speed,
      type,
      size: 20,
      rot: rand(0, Math.PI*2),
      vr: rand(-0.07, 0.07),
      blinkPhase: rand(0, Math.PI*2), // for hazards
      alive: true,
      ax: 0, ay: speed // for powerups we will override ay to vy
    };
    objects.push(obj);
  }

  // ----- Particles -----
  function burst(x,y,color,count=14){
    for(let i=0;i<count;i++){
      particles.push({
        x, y,
        vx: Math.cos(Math.random()*Math.PI*2) * rand(1,4),
        vy: Math.sin(Math.random()*Math.PI*2) * rand(1,4) - 0.5,
        life: rand(0.4, 1.0),
        color
      });
    }
  }

  // ----- Drawing helpers -----
  function drawStar(cx,cy,r,points=8, rot=0){
    const inner = r*0.45;
    ctx.beginPath();
    for(let i=0;i<points*2;i++){
      const a = rot + i * Math.PI/points;
      const rr = (i%2===0) ? r : inner;
      const x = cx + Math.cos(a)*rr;
      const y = cy + Math.sin(a)*rr;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
  }

  function drawPlayerIcon(){
    // White circle with thick ring and directional wedge
    ctx.save();
    ctx.translate(player.x, player.y);
    // outer ring
    ctx.beginPath();
    ctx.arc(0,0,player.r,0,Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    // cut inner to make ring
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(0,0,player.r*0.68,0,Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    // directional wedge showing movement
    const ang = Math.atan2(player.vy, player.vx);
    ctx.save();
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(player.r*0.2, 0);
    ctx.lineTo(player.r*0.85, -player.r*0.32);
    ctx.lineTo(player.r*0.85,  player.r*0.32);
    ctx.closePath();
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  // ----- Update & Render -----
  let last = performance.now();
  function step(now){
    const dt = Math.min(32, now-last); last = now;
    if(running) tms += dt;

    // Player easing
    const ease = 0.25;
    const ox = player.x, oy = player.y;
    player.x += (player.tx - player.x)*ease;
    player.y += (player.ty - player.y)*ease;
    player.x = clamp(player.x, player.r+6, W - player.r - 6);
    player.y = clamp(player.y, player.r+6, H - player.r - 6);
    player.vx = player.x - ox; player.vy = player.y - oy;

    // Spawn
    if(running) spawn();

    // Update objects
    const secs = tms/1000;
    const slow = (tms < slowMoUntil) ? 0.55 : 1.0;
    for(const o of objects){
      if (o.type === 2){
        // powerup homing
        const dx = player.x - o.x;
        const dy = player.y - o.y;
        const d  = Math.hypot(dx,dy) || 1;
        const mag = Math.min(0.12 + secs*0.0006, 0.22); // stronger later
        o.ax = dx/d * mag;
        o.ay = dy/d * mag + 0.02; // still falls
        o.vy += o.ay;
        o.x += dx/d * 0.6; // subtle drift toward player
        o.y += o.vy * slow;
      } else {
        o.y += o.vy * slow;
      }
      o.rot += o.vr;
    }

    // Collisions
    if(running){
      const pr2 = (player.r*0.95)*(player.r*0.95);
      for(const o of objects){
        if(!o.alive) continue;
        const d2 = dist2(o.x, o.y, player.x, player.y);
        const hit = d2 <= pr2 + (o.size*o.size);
        if(hit){
          o.alive = false;
          if(o.type === 0){
            score += 10 * mult;
            mult = Math.min(5, mult+1); multTimer = 1500;
            hudScore.textContent = String(score); hudMult.textContent = 'x'+mult;
            burst(o.x, o.y, '#fff', 18);
          } else if (o.type === 1){
            gameOver(); return;
          } else {
            // powerup: slow-mo, grow, or cleanse hazard
            const which = Math.random();
            if (which < 0.34) slowMoUntil = tms + 3500;
            else if (which < 0.68) widenUntil = tms + 4000; // widen visual radius effect
            else {
              // cleanse: remove first hazard
              const h = objects.find(k => k.alive && k.type===1);
              if (h){ h.alive=false; burst(h.x, h.y, '#39d0ff', 22); }
            }
            burst(o.x, o.y, '#39d0ff', 16);
            shakeT = 220;
          }
        }
      }
    }

    // Mult decay
    if (running && mult>1){
      multTimer -= dt;
      if (multTimer <= 0){ mult=1; hudMult.textContent='x1'; }
    }

    // Cleanup
    objects = objects.filter(o => o.alive && o.y < H+60 && o.x>-60 && o.x<W+60);

    // Particles
    for(const p of particles){
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.02;
    }
    particles = particles.filter(p => p.life>0);

    draw();
    requestAnimationFrame(step);
  }

  function gameOver(){
    running=false;
    best = Math.max(best, score);
    hint.innerHTML = '<div class="title">Game Over</div>' +
      '<div class="sub">Score: <b>'+score+'</b> • Best: <b>'+best+'</b><br/><br/><b>Tap to try again</b></div>';
    hint.style.display='block';
  }

  function draw(){
    // Screen shake
    if(shakeT>0) shakeT -= 16;
    const sx = (Math.random()-0.5)*(shakeT>0 ? 6 : 0);
    const sy = (Math.random()-0.5)*(shakeT>0 ? 6 : 0);

    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    ctx.translate(sx, sy);

    // faint scanlines
    ctx.globalAlpha=0.15; ctx.fillStyle='#fff';
    for(let y=0;y<H;y+=2) ctx.fillRect(0,y,W,1);
    ctx.globalAlpha=1;

    // draw objects
    for(const o of objects){
      if(o.type === 0){
        // good — white square
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.rotate(o.rot);
        ctx.fillStyle='#fff';
        ctx.fillRect(-o.size/2, -o.size/2, o.size, o.size);
        ctx.restore();
      } else if (o.type === 1){
        // hazard — blinking red star
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.rotate(o.rot);
        const alpha = 0.6 + 0.4*Math.sin(tms*0.01 + o.blinkPhase);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#ff2147';
        drawStar(0,0,o.size*0.8, 8, 0);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();
      } else {
        // powerup — blue circle (glowy)
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.fillStyle='#39d0ff';
        ctx.shadowColor='rgba(57,208,255,0.9)';
        ctx.shadowBlur=16;
        ctx.beginPath(); ctx.arc(0,0,o.size*0.55,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        ctx.restore();
      }
    }

    // widen aura when widened
    if (tms < widenUntil){
      ctx.save();
      const k = (widenUntil - tms)/4000;
      const rr = player.r * (1.0 + 0.4*k);
      const grad = ctx.createRadialGradient(player.x, player.y, rr*0.4, player.x, player.y, rr);
      grad.addColorStop(0,'rgba(255,255,255,0.12)');
      grad.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(player.x, player.y, rr, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // player
    drawPlayerIcon();

    // particles
    for(const p of particles){
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
    }
    ctx.globalAlpha=1;
  }

  // Init
  resize();
  reset();
  last = performance.now();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
