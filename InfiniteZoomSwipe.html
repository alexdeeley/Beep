  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha:false, desynchronized:true });

  let W=0, H=0, DPR=1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(1, Math.floor(window.innerWidth));
    H = Math.max(1, Math.floor(window.innerHeight));
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize, { passive:true });
  resize();

  // Load source image, then make a repeating pattern.
  const img = new Image();
  img.decoding = "async";
  img.src = IMG_SRC;

  // Motion state (trajectory)
  let velX = 40, velY = 0;          // px/s
  let tgtVX = velX, tgtVY = velY;   // smoothed target
  let posX = 0, posY = 0;

  // Gesture tracking (swipe to change trajectory)
  let down = false;
  let lastPX = 0, lastPY = 0;
  let lastT = 0;
  let swipeVX = 0, swipeVY = 0;

  function pointerDown(e) {
    down = true;
    const p = getPoint(e);
    lastPX = p.x; lastPY = p.y;
    lastT = performance.now();
    swipeVX = 0; swipeVY = 0;
  }
  function pointerMove(e) {
    if(!down) return;
    const p = getPoint(e);
    const now = performance.now();
    const dt = Math.max(0.001, (now - lastT) / 1000);
    const dx = p.x - lastPX;
    const dy = p.y - lastPY;
    // instantaneous swipe velocity (px/s)
    swipeVX = dx / dt;
    swipeVY = dy / dt;
    lastPX = p.x; lastPY = p.y;
    lastT = now;

    // Set target trajectory from swipe direction & speed
    const sp = Math.hypot(swipeVX, swipeVY);
    if (sp > 10) {
      // cap and gently bias to keep it moving
      const cap = 1400;
      const s2 = Math.min(cap, sp);
      const nx = swipeVX / (sp || 1);
      const ny = swipeVY / (sp || 1);
      tgtVX = nx * (80 + 0.35 * s2);
      tgtVY = ny * (80 + 0.35 * s2);
    }
  }
  function pointerUp() {
    down = false;
  }

  function getPoint(e) {
    if (e.touches && e.touches.length) {
      return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
  }

  canvas.addEventListener('pointerdown', pointerDown, { passive:true });
  canvas.addEventListener('pointermove', pointerMove, { passive:true });
  window.addEventListener('pointerup', pointerUp, { passive:true });
  window.addEventListener('pointercancel', pointerUp, { passive:true });
  window.addEventListener('blur', pointerUp, { passive:true });

  // Optional: touch fallback for older iOS pointer quirks
  canvas.addEventListener('touchstart', pointerDown, { passive:true });
  canvas.addEventListener('touchmove', pointerMove, { passive:true });
  window.addEventListener('touchend', pointerUp, { passive:true });

  // Zoom parameters (octaves per second)
  let t = 0;
  const zoomSpeed = 0.22;

  // Draw layers to fake infinite depth.
  const LAYERS = 14;

  function drawPatternLayer(pattern, scale, ox, oy, alpha) {
    if (alpha <= 0.001) return;

    ctx.save();
    ctx.globalAlpha = alpha;

    // Transform world -> texture space (scale) with offset.
    // We move the texture opposite the camera movement for a drift feel.
    const tx = ox;
    const ty = oy;

    // Place the origin at screen center for nicer motion.
    const cx = W * 0.5;
    const cy = H * 0.5;

    ctx.translate(cx + tx, cy + ty);
    ctx.scale(scale, scale);
    ctx.translate(-cx, -cy);

    ctx.fillStyle = pattern;

    // Big fill to cover screen even when transformed.
    // (Overdraw a bit to avoid edge gaps.)
    const pad = 2 * Math.max(W, H);
    ctx.fillRect(-pad, -pad, W + 2*pad, H + 2*pad);

    ctx.restore();
  }

  function vignette() {
    // Subtle center emphasis (still pure B/W output)
    const g = ctx.createRadialGradient(W*0.5, H*0.5, Math.min(W,H)*0.1, W*0.5, H*0.5, Math.max(W,H)*0.75);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(0,0,0,0.55)");

    ctx.fillRect(0,0,W,H);

    requestAnimationFrame(frame);

    posY += velY * dt;

    if (!pattern) return;

    // Multi-scale stack
    const mid = (LAYERS - 1) * 0.5;

    for (let i = 0; i < LAYERS; i++) {
      const p = i - mid;                 // negative=far, positive=near
      const s = base * Math.pow(2, p);   // spans many octaves
      // Alpha peaks near the middle layers
      const a = Math.exp(-Math.abs(p) * 0.55) * 0.95;

      // Parallax: deeper layers move less in screen-space
      const par = Math.pow(2, -p * 0.65);
      const ox = -posX * 0.015 * par;
      const oy = -posY * 0.015 * par;

      drawPatternLayer(pattern, s, ox, oy, a);
    }

    vignette();
  }

  img.onload = () => {
    // Make a crisp repeating pattern.
    ctx.imageSmoothingEnabled = false;
    pattern = ctx.createPattern(img, 'repeat');
    requestAnimationFrame(frame);
  };

  img.onerror = () => {
    // If the image fails, just start anyway (black screen).
    requestAnimationFrame(frame);
  };
})();
</script>
</body>
</html>
