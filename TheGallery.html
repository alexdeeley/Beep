<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>THE GALLERY</title>
<style>
  :root{
    --ink:#20221f; --cream:#efe9db; --brass:#a8955c; --panel:rgba(15,14,12,0.74); --panel-edge:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Georgia,'Iowan Old Style',serif;color:var(--cream);}
  canvas{display:block;}
  #c{position:fixed;inset:0;}
  .hidden{display:none !important;}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
    background:radial-gradient(ellipse at center, #1c1a16 0%, #030302 82%);z-index:50;text-align:center;color:var(--cream);}
  .title{font-size:min(9vw,68px);letter-spacing:0.22em;font-weight:400;margin:0 0 8px 0;color:#f4ecd8;}
  .subtitle{opacity:0.6;letter-spacing:0.06em;margin-bottom:40px;font-style:italic;}
  .menu-btns{display:flex;flex-direction:column;gap:12px;width:min(86vw,320px);}
  .btn{font-family:inherit;font-size:16px;letter-spacing:0.05em;background:var(--panel);border:1px solid var(--panel-edge);
    color:var(--cream);padding:14px 18px;border-radius:2px;cursor:pointer;transition:background .15s,transform .1s;}
  .btn:hover{background:rgba(255,255,255,0.1);}
  .btn:active{transform:scale(0.98);}
  .btn.primary{background:#4a4132;border-color:var(--brass);}
  .btn.primary:hover{background:#584d3b;}
  .btn:disabled{opacity:0.3;cursor:not-allowed;}
  .seedrow{display:flex;gap:8px;width:min(86vw,320px);}
  .seedrow input{flex:1;font-family:inherit;background:rgba(255,255,255,0.06);border:1px solid var(--panel-edge);
    color:var(--cream);padding:10px;border-radius:2px;font-size:14px;}
  #loadingScreen .step{opacity:0.55;font-size:12px;letter-spacing:0.2em;margin-top:18px;min-height:16px;text-transform:uppercase;}
  .loadbar{width:min(70vw,340px);height:2px;background:rgba(255,255,255,0.12);margin-top:10px;position:relative;overflow:hidden;}
  .loadbar > div{position:absolute;left:0;top:0;bottom:0;width:26%;background:var(--brass);animation:sweep 1.2s ease-in-out infinite;}
  @keyframes sweep{0%{left:-26%}100%{left:100%}}

  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;}
  #crosshair{position:absolute;top:50%;left:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;
    background:rgba(255,255,255,0.6);}
  #prompt{position:absolute;top:58%;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,0.45);
    padding:5px 12px;border-radius:2px;font-size:13px;letter-spacing:0.03em;white-space:nowrap;max-width:70vw;text-align:center;}
  #sector{position:absolute;top:16px;right:18px;font-size:11px;letter-spacing:0.14em;opacity:0.55;text-transform:uppercase;}
  #stats{position:absolute;bottom:16px;left:18px;font-size:11px;letter-spacing:0.1em;opacity:0.55;text-transform:uppercase;line-height:1.7;}
  #vignette{position:absolute;inset:0;box-shadow:inset 0 0 200px 60px rgba(0,0,0,0.5);}

  #placard{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);width:min(420px,88vw);background:var(--panel);
    border:1px solid var(--panel-edge);border-top:2px solid var(--brass);padding:18px 20px;z-index:35;pointer-events:auto;}
  #placard h3{margin:0 0 4px 0;font-weight:400;letter-spacing:0.04em;font-size:19px;color:#f4ecd8;}
  #placard .pmeta{font-style:italic;opacity:0.75;font-size:13px;margin-bottom:10px;}
  #placard .pnote{font-size:12.5px;opacity:0.65;line-height:1.5;}
  #placard .pclose{margin-top:12px;font-size:11px;opacity:0.5;letter-spacing:0.08em;text-transform:uppercase;}

  #pauseMenu{z-index:40;}
  #seedDisplay{opacity:0.55;font-size:11px;margin-top:22px;letter-spacing:0.05em;}

  #touchControls{position:fixed;inset:0;z-index:15;pointer-events:none;}
  #joyZone{position:absolute;left:0;bottom:0;width:45%;height:55%;pointer-events:auto;}
  #lookZone{position:absolute;right:0;bottom:0;width:55%;height:100%;pointer-events:auto;}
  #joyStick{position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.28);}
  #joyKnob{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.3);left:25px;top:25px;}
  .touchBtn{position:absolute;pointer-events:auto;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.28);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;text-align:center;text-transform:uppercase;letter-spacing:0.04em;}
  #btnInteractT{right:24px;bottom:110px;} #btnSprintT{right:100px;bottom:24px;}
</style>
</head>

<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>

<div id="startScreen" class="overlay">

  <div class="subtitle">the collection has no walls, and no end</div>
  <div class="menu-btns">
    <button class="btn primary" id="btnNewRandom">ENTER</button>

      <input id="seedInput" placeholder="custom seed (optional)" maxlength="24">
      <button class="btn" id="btnNewSeeded">VISIT</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================================
   THE GALLERY - infinite procedurally-generated museum, walked in first person
   Same engine/approach as CASTAWAY: Three.js r128 classic build (no bundler),
   seeded deterministic generation, chunked infinite world, procedural
   Web Audio sound design (no music), touch + gamepad + mouse/keyboard input.
   All artwork on the walls is generated at runtime from code (canvas 2D
   shapes/gradients) - nothing here is a reproduction of a real painting.
   ========================================================================= */
(function(){
"use strict";

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}

/* ---------- seeded RNG ---------- */
function mulberry32(seed){
  let a = seed>>>0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashSeed(str){
  str = String(str);
  let h = 1779033703 ^ str.length;
  for (let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = h << 13 | h >>> 19;
  }
  return (h>>>0);
}
function pick(r,arr){ return arr[Math.floor(r()*arr.length)]; }
let SEED = 'gallery';

/* ---------- grid constants ---------- */
const CELL = 10, WALL_H = 4.6, WALL_T = 0.22, DOOR_W = 3.6, VIEW_R = 4;

/* ---------- three.js core ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
if (renderer.outputEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
if (renderer.toneMapping !== undefined){ renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; }

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0c0a);
const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 200);
const fog = new THREE.Fog(0x0d0c0a, CELL*1.6, CELL*(VIEW_R+0.6));
scene.fog = fog;

const hemi = new THREE.HemisphereLight(0x2a2a30, 0x14120e, 0.55);
scene.add(hemi);
const overhead = new THREE.DirectionalLight(0xfff4de, 0.35);
overhead.position.set(10,40,6);
scene.add(overhead);

/* ---------- painting content banks ---------- */
const ADJ=['Silent','Drifting','Hollow','Golden','Quiet','Forgotten','Endless','Pale','Crimson','Wandering','Still','Fractured','Velvet','Distant','Hidden','Waning','Idle','Faded','Restless','Unnamed'];
const NOUN=['Horizon','Interior','Study','Reverie','Corridor','Garden','Tide','Fragment','Chamber','Echo','Field','Passage','Vessel','Threshold','Bloom','Room','Hour','Window','Figure','Season'];
const FIRST=['Elin','Mora','Tobias','Ines','Halvard','Corin','Saoirse','Anders','Liora','Petra','Osric','Nadia','Bram','Yseult','Feodor','Ilse','Rasmus','Noor','Casimir','Wren'];
const LAST=['Vance','Marlowe','Okonkwo','Fabre','Lindqvist','Solheim','Achebe','Dubois','Whitfield','Kastanek','Marsh','Renner','Toussaint','Ibarra','Solberg','Adeyemi','Voss','Carrington','Yun','Beaumont'];
const MEDIUMS=['Oil on canvas','Acrylic on panel','Mixed media','Tempera on wood','Oil on linen','Gouache on paper','Oil on board'];
const NOTES=['Donated anonymously.','On loan from a private collection.','Restored after water damage.','Provenance unknown.','Acquired at auction, lot number lost.','The artist left no other known works.','Purchased directly from the estate.','Previously mislabeled; attribution corrected.','Exhibited once, then not seen for decades.','Catalogued but never publicly explained.'];
const PALETTES = [
  ['#1b1f2a','#3a4a63','#8fa7c4','#d8c9a3','#e8e2d0'],
  ['#2a1810','#6b3f2a','#b5713f','#e0a868','#f2e0c0'],
  ['#101418','#333d45','#5c7a80','#a3c9c7','#e5ece8'],
  ['#3a0f14','#7a2130','#c25b4a','#e3a370','#f4e3c8'],
  ['#151515','#3d3d3d','#6e6e6e','#a8a8a8','#e0e0e0'],
  ['#0d2b1f','#1f5c45','#4f9c78','#a8d8b0','#eef5e6'],
  ['#241a2e','#4d3466','#8a6bb0','#c9a8d9','#efe2f4'],
];

function drawArt(ctx,w,h,pal,style,r){
  ctx.fillStyle = pal[0]; ctx.fillRect(0,0,w,h);
  if(style===0){
    const g = ctx.createLinearGradient(0,0,w*(0.3+r()*0.7),h);
    g.addColorStop(0,pal[1]); g.addColorStop(0.5,pal[2]); g.addColorStop(1,pal[3]);
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    for(let i=0;i<5;i++){
      ctx.globalAlpha=0.15+r()*0.2; ctx.fillStyle=pal[4];
      ctx.beginPath(); ctx.ellipse(r()*w,r()*h,20+r()*60,20+r()*60,0,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  } else if(style===1){
    for(let i=0;i<10;i++){
      ctx.fillStyle = pal[1+Math.floor(r()*3)];
      ctx.save(); ctx.translate(r()*w, r()*h); ctx.rotate(r()*Math.PI);
      const s=10+r()*w*0.4;
      if(r()>0.5) ctx.fillRect(-s/2,-s/2,s,s*(0.4+r()));
      else { ctx.beginPath(); ctx.arc(0,0,s/2,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    }
  } else if(style===2){
    for(let i=0;i<14;i++){
      ctx.strokeStyle = pal[1+Math.floor(r()*3)];
      ctx.lineWidth = 4+r()*16; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(r()*w,r()*h);
      ctx.quadraticCurveTo(r()*w,r()*h, r()*w, r()*h);
      ctx.globalAlpha=0.55+r()*0.4; ctx.stroke();
    }
    ctx.globalAlpha=1;
  } else if(style===3){
    let y=0; const bands=4+Math.floor(r()*4);
    for(let i=0;i<bands;i++){
      const bh = h/bands*(0.6+r()*0.8);
      ctx.fillStyle = pal[1+(i%3)];
      ctx.fillRect(0,y,w,bh); y+=bh;
    }
  } else {
    const g = ctx.createRadialGradient(w*0.5,h*0.4,10,w*0.5,h*0.45,h*0.5);
    g.addColorStop(0,pal[3]); g.addColorStop(1,pal[1]);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(w*0.5,h*0.42,w*0.28,h*0.35,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=pal[0];
    ctx.beginPath(); ctx.arc(w*0.42,h*0.36,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(w*0.58,h*0.36,3,0,Math.PI*2); ctx.fill();
  }
}

function makePainting(r, maxWidth){
  const portrait = r() > 0.45;
  const w = clamp(0.9+r()*1.3, 0.7, Math.max(0.7,maxWidth-0.6));
  const h = portrait ? w*1.25 : w*0.72;
  const cw = 200, ch = Math.round(cw*(h/w));
  const cnv = document.createElement('canvas'); cnv.width=cw; cnv.height=ch;
  const ctx = cnv.getContext('2d');
  const pal = pick(r,PALETTES);
  const style = Math.floor(r()*5);
  drawArt(ctx,cw,ch,pal,style,r);
  const tex = new THREE.CanvasTexture(cnv);
  if(tex.encoding!==undefined) tex.encoding = THREE.sRGBEncoding;
  const artPlane = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:tex}));

  const frameColor = r()>0.5 ? 0x241c14 : 0x9c8a56;
  const frame = new THREE.Mesh(new THREE.BoxGeometry(w+0.14,h+0.14,0.05), new THREE.MeshStandardMaterial({color:frameColor, roughness:0.55, metalness:0.25}));
  frame.position.z = -0.03;
  const group = new THREE.Group();
  group.add(frame); group.add(artPlane);

  const title = `${pick(r,ADJ)} ${pick(r,NOUN)}`;
  const artist = `${pick(r,FIRST)} ${pick(r,LAST)}`;
  const year = 1870+Math.floor(r()*150);
  const medium = pick(r,MEDIUMS);
  const note = pick(r,NOTES);

  const pc = document.createElement('canvas'); pc.width=320; pc.height=96;
  const pctx = pc.getContext('2d');
  pctx.fillStyle = '#f2ecd9'; pctx.fillRect(0,0,320,96);
  pctx.strokeStyle='#9c8a56'; pctx.lineWidth=3; pctx.strokeRect(2,2,316,92);
  pctx.fillStyle='#2b2116'; pctx.font='bold 20px Georgia'; pctx.fillText(title,14,32);
  pctx.font='italic 15px Georgia'; pctx.fillText(artist+', '+year,14,56);
  pctx.font='13px Georgia'; pctx.fillText(medium,14,78);
  const ptex = new THREE.CanvasTexture(pc);
  const plaque = new THREE.Mesh(new THREE.PlaneGeometry(0.46,0.14), new THREE.MeshBasicMaterial({map:ptex}));

  return {mesh:group, plaque, title, artist, year, medium, note};
}

/* ---------- wall / chunk building ---------- */
const wallMat = new THREE.MeshStandardMaterial({color:0xE9E4D8, roughness:0.9});
function buildWallSegment(cx,cz,length,axis,idBase){
  const group = new THREE.Group();
  const geo = axis==='z' ? new THREE.BoxGeometry(WALL_T, WALL_H, length) : new THREE.BoxGeometry(length, WALL_H, WALL_T);
  const wall = new THREE.Mesh(geo, wallMat);
  wall.position.set(cx, WALL_H/2, cz);
  group.add(wall);

  const normals = axis==='z' ? [{x:-1,z:0},{x:1,z:0}] : [{x:0,z:-1},{x:0,z:1}];
  const paintings = [];
  for(let f=0; f<2; f++){
    const r = mulberry32(hashSeed(SEED+'_p_'+idBase+'_'+f));
    if(r() > 0.8) continue;
    const art = makePainting(r, length);
    const n = normals[f];
    const yaw = Math.atan2(n.x, n.z);
    art.mesh.position.set(cx + n.x*(WALL_T/2+0.035), 1.9, cz + n.z*(WALL_T/2+0.035));
    art.mesh.rotation.y = yaw;
    group.add(art.mesh);
    art.plaque.position.set(cx + n.x*(WALL_T/2+0.03), 1.05, cz + n.z*(WALL_T/2+0.03));
    art.plaque.rotation.y = yaw;
    group.add(art.plaque);
    paintings.push({id:idBase+'_'+f, title:art.title, artist:art.artist, year:art.year, medium:art.medium, note:art.note, worldPos:art.mesh.position.clone()});
  }
  const box = axis==='z'
    ? {minX:cx-WALL_T/2-0.25, maxX:cx+WALL_T/2+0.25, minZ:cz-length/2, maxZ:cz+length/2}
    : {minX:cx-length/2, maxX:cx+length/2, minZ:cz-WALL_T/2-0.25, maxZ:cz+WALL_T/2+0.25};
  return {group, box, paintings};
}
function buildVerticalEdge(i,j){
  const xMid = i*CELL+CELL/2, zc=j*CELL;
  const segLen=(CELL-DOOR_W)/2;
  const z1=zc-(DOOR_W/2+segLen/2), z2=zc+(DOOR_W/2+segLen/2);
  const s1=buildWallSegment(xMid,z1,segLen,'z','v_'+i+'_'+j+'_a');
  const s2=buildWallSegment(xMid,z2,segLen,'z','v_'+i+'_'+j+'_b');
  const group = new THREE.Group(); group.add(s1.group); group.add(s2.group);
  scene.add(group);
  return {group, boxes:[s1.box,s2.box], paintings:s1.paintings.concat(s2.paintings)};
}
function buildHorizontalEdge(i,j){
  const zMid=j*CELL+CELL/2, xc=i*CELL;
  const segLen=(CELL-DOOR_W)/2;
  const x1=xc-(DOOR_W/2+segLen/2), x2=xc+(DOOR_W/2+segLen/2);
  const s1=buildWallSegment(x1,zMid,segLen,'x','h_'+i+'_'+j+'_a');
  const s2=buildWallSegment(x2,zMid,segLen,'x','h_'+i+'_'+j+'_b');
  const group = new THREE.Group(); group.add(s1.group); group.add(s2.group);
  scene.add(group);
  return {group, boxes:[s1.box,s2.box], paintings:s1.paintings.concat(s2.paintings)};
}
function buildCell(i,j){
  const r = mulberry32(hashSeed(SEED+'_cell_'+i+'_'+j));
  const t = 0.5+r()*0.18;
  const group = new THREE.Group();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(CELL,CELL), new THREE.MeshStandardMaterial({color:new THREE.Color(t*0.85,t*0.76,t*0.6), roughness:0.6}));
  floor.rotation.x=-Math.PI/2; floor.position.set(i*CELL,0,j*CELL);
  group.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(CELL,CELL), new THREE.MeshStandardMaterial({color:0xf2efe6, roughness:0.95}));
  ceil.rotation.x=Math.PI/2; ceil.position.set(i*CELL,WALL_H,j*CELL);
  group.add(ceil);
  const fixture = new THREE.Mesh(new THREE.PlaneGeometry(1.7,1.7), new THREE.MeshBasicMaterial({color:0xfff3da}));
  fixture.rotation.x=Math.PI/2; fixture.position.set(i*CELL,WALL_H-0.015,j*CELL);
  group.add(fixture);
  scene.add(group);
  return group;
}
function disposeGroup(g){
  g.traverse(obj=>{
    if(obj.geometry) obj.geometry.dispose();
    if(obj.material){
      const mats = Array.isArray(obj.material)?obj.material:[obj.material];
      for(const m of mats){ if(m.map) m.map.dispose(); m.dispose(); }
    }
  });
}

const builtCells = new Map(), builtEdgesV = new Map(), builtEdgesH = new Map();
let activeWallBoxes = [], activePaintings = [];
let curCell = {i:null,j:null};

function currentCellOf(x,z){ return {i:Math.round(x/CELL), j:Math.round(z/CELL)}; }
function updateChunks(force){
  const {i:ci,j:cj} = currentCellOf(player.pos.x, player.pos.z);
  if(!force && ci===curCell.i && cj===curCell.j) return;
  curCell = {i:ci,j:cj};

  const neededCells = new Set(), neededV = new Set(), neededH = new Set();
  for(let di=-VIEW_R; di<=VIEW_R; di++){
    for(let dj=-VIEW_R; dj<=VIEW_R; dj++){
      const i=ci+di, j=cj+dj;
      neededCells.add(i+'_'+j);
      neededV.add(i+'_'+j); neededV.add((i-1)+'_'+j);
      neededH.add(i+'_'+j); neededH.add(i+'_'+(j-1));
    }
  }
  for(const key of neededCells) if(!builtCells.has(key)){ const [i,j]=key.split('_').map(Number); builtCells.set(key, buildCell(i,j)); }
  for(const [key,grp] of Array.from(builtCells)) if(!neededCells.has(key)){ scene.remove(grp); disposeGroup(grp); builtCells.delete(key); }

  for(const key of neededV) if(!builtEdgesV.has(key)){ const [i,j]=key.split('_').map(Number); builtEdgesV.set(key, buildVerticalEdge(i,j)); }
  for(const [key,e] of Array.from(builtEdgesV)) if(!neededV.has(key)){ scene.remove(e.group); disposeGroup(e.group); builtEdgesV.delete(key); }

  for(const key of neededH) if(!builtEdgesH.has(key)){ const [i,j]=key.split('_').map(Number); builtEdgesH.set(key, buildHorizontalEdge(i,j)); }
  for(const [key,e] of Array.from(builtEdgesH)) if(!neededH.has(key)){ scene.remove(e.group); disposeGroup(e.group); builtEdgesH.delete(key); }

  activeWallBoxes = [];
  activePaintings = [];
  for(const e of builtEdgesV.values()){ activeWallBoxes.push(...e.boxes); activePaintings.push(...e.paintings); }
  for(const e of builtEdgesH.values()){ activeWallBoxes.push(...e.boxes); activePaintings.push(...e.paintings); }

  document.getElementById('sector').textContent = `SECTOR ${ci}, ${cj}`;
}

/* ---------- audio ---------- */
const AudioSys = (function(){
  let ctx=null, master=null, noiseBuf=null;
  const loops = {};
  function ensure(){
    if(ctx) return;
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value=0.6; master.connect(ctx.destination);
    const len = ctx.sampleRate*2;
    noiseBuf = ctx.createBuffer(1,len,ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  }
  function noiseLoop(freq,type,gainVal){
    const src = ctx.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const filt = ctx.createBiquadFilter(); filt.type=type||'lowpass'; filt.frequency.value=freq;
    const g = ctx.createGain(); g.gain.value=gainVal;
    src.connect(filt); filt.connect(g); g.connect(master); src.start();
    return {src,filt,gain:g};
  }
  function startAmbience(){ ensure(); if(loops.hum) return; loops.hum = noiseLoop(220,'lowpass',0.045); }
  function thump(dur,vol,freq){
    ensure();
    const src = ctx.createBufferSource(); src.buffer=noiseBuf;
    const filt = ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=freq||400;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    src.connect(filt); filt.connect(g); g.connect(master); src.start(); src.stop(ctx.currentTime+dur+0.02);
  }
  function blip(freq,dur,vol,glideTo){
    ensure();
    const o = ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(freq,ctx.currentTime);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, ctx.currentTime+dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(vol,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime+dur+0.02);
  }
  function footstep(){ thump(0.1,0.11,650); setTimeout(()=>thump(0.35,0.035,300), 90); }
  function open(){ blip(360,0.12,0.12,520); }
  function close(){ blip(300,0.1,0.1,220); }
  function distant(){ thump(0.9,0.05,150); }
  return {startAmbience, footstep, open, close, distant};
})();
let distantTimer = 30+Math.random()*40;

/* ---------- player ---------- */
const player = { pos:new THREE.Vector3(0,1.75,0), yaw:0, pitch:0, sprinting:false, distanceWalked:0 };
let footstepTimer=0;
let paintingsViewed = new Set();

/* ---------- desktop input ---------- */
let pointerLocked=false;
document.addEventListener('mousemove',(e)=>{
  if(!pointerLocked) return;
  player.yaw -= e.movementX*0.0022;
  player.pitch -= e.movementY*0.0022;
  player.pitch = clamp(player.pitch,-Math.PI/2+0.05,Math.PI/2-0.05);
});
canvas.addEventListener('click', ()=>{ if(gameState==='playing' && !pointerLocked && !isTouch) canvas.requestPointerLock(); });
document.addEventListener('pointerlockchange', ()=>{ pointerLocked = document.pointerLockElement===canvas; });

const keys = {};
window.addEventListener('keydown',(e)=>{
  keys[e.code]=true;
  if(gameState!=='playing' && gameState!=='placard') return;
  if(e.code==='Escape'){ if(gameState==='placard') closePlacard(); else togglePause(); }
  if(e.code==='KeyE'){ if(gameState==='placard') closePlacard(); else openNearestPlacard(); }
});
window.addEventListener('keyup',(e)=>{ keys[e.code]=false; });

/* ---------- touch ---------- */
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
let touchMove = {x:0,y:0,active:false};
let touchLook = {active:false,lastX:0,lastY:0};
let touchSprint=false;
function setupTouch(){
  document.getElementById('touchControls').classList.remove('hidden');
  const joyZone=document.getElementById('joyZone'), joyStick=document.getElementById('joyStick'), joyKnob=document.getElementById('joyKnob');
  let joyId=null, origin={x:0,y:0};
  joyZone.addEventListener('touchstart',(e)=>{
    const t=e.changedTouches[0]; joyId=t.identifier; origin={x:t.clientX,y:t.clientY};
    joyStick.style.left=(t.clientX-45)+'px'; joyStick.style.top=(t.clientY-45)+'px'; joyStick.classList.remove('hidden');
    touchMove.active=true;
  });
  joyZone.addEventListener('touchmove',(e)=>{
    for(const t of e.changedTouches){
      if(t.identifier!==joyId) continue;
      let dx=t.clientX-origin.x, dy=t.clientY-origin.y;
      const m=Math.hypot(dx,dy), max=45;
      if(m>max){ dx=dx/m*max; dy=dy/m*max; }
      joyKnob.style.left=(25+dx)+'px'; joyKnob.style.top=(25+dy)+'px';
      touchMove.x=dx/max; touchMove.y=dy/max;
    }
  });
  function joyEnd(e){ for(const t of e.changedTouches){ if(t.identifier===joyId){ joyId=null; touchMove={x:0,y:0,active:false}; joyStick.classList.add('hidden'); } } }
  joyZone.addEventListener('touchend',joyEnd); joyZone.addEventListener('touchcancel',joyEnd);

  const lookZone=document.getElementById('lookZone');
  let lookId=null;
  lookZone.addEventListener('touchstart',(e)=>{ const t=e.changedTouches[0]; lookId=t.identifier; touchLook={active:true,lastX:t.clientX,lastY:t.clientY}; });
  lookZone.addEventListener('touchmove',(e)=>{
    for(const t of e.changedTouches){
      if(t.identifier!==lookId) continue;
      const dx=t.clientX-touchLook.lastX, dy=t.clientY-touchLook.lastY;
      player.yaw -= dx*0.004; player.pitch -= dy*0.004;
      player.pitch = clamp(player.pitch,-Math.PI/2+0.05,Math.PI/2-0.05);
      touchLook.lastX=t.clientX; touchLook.lastY=t.clientY;
    }
  });
  function lookEnd(e){ for(const t of e.changedTouches){ if(t.identifier===lookId){ lookId=null; touchLook.active=false; } } }
  lookZone.addEventListener('touchend',lookEnd); lookZone.addEventListener('touchcancel',lookEnd);

  const bind=(id,fn)=>{ const el=document.getElementById(id); el.addEventListener('touchstart',(e)=>{e.preventDefault();fn();}); };
  bind('btnInteractT', ()=>{ if(gameState==='placard') closePlacard(); else openNearestPlacard(); });
  bind('btnSprintT', ()=>touchSprint=!touchSprint);
}

/* ---------- gamepad ---------- */
let gpMoveX=0, gpMoveY=0, gpSprintHeld=false, gpPrevPressed=[];
function pollGamepad(dt){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp=null; for(const p of pads){ if(p){ gp=p; break; } }
  if(!gp){ gpMoveX=0; gpMoveY=0; gpSprintHeld=false; return; }
  const dz=v=>Math.abs(v)<0.18?0:v;
  gpMoveX=dz(gp.axes[0]||0); gpMoveY=dz(gp.axes[1]||0);
  const lookX=dz(gp.axes[2]||0), lookY=dz(gp.axes[3]||0);
  player.yaw -= lookX*2.6*dt; player.pitch -= lookY*1.9*dt;
  player.pitch = clamp(player.pitch,-Math.PI/2+0.05,Math.PI/2-0.05);
  const pressed = gp.buttons.map(b=>!!b && (b.pressed||b.value>0.5));
  const edge = i => pressed[i] && !gpPrevPressed[i];
  gpSprintHeld = pressed[1];
  if(edge(2)){ if(gameState==='placard') closePlacard(); else openNearestPlacard(); }
  if(edge(9)) togglePause();
  gpPrevPressed = pressed;
}

/* ---------- collision ---------- */
function collidesAt(x,z){
  const r=0.32;
  for(const b of activeWallBoxes){ if(x+r>b.minX && x-r<b.maxX && z+r>b.minZ && z-r<b.maxZ) return true; }
  return false;
}

/* ---------- placard / interaction ---------- */
function nearestPainting(){
  let best=null, bestD=2.5;
  for(const p of activePaintings){
    const d = Math.hypot(player.pos.x-p.worldPos.x, player.pos.z-p.worldPos.z);
    if(d<bestD){ bestD=d; best=p; }
  }
  return best;
}
function openNearestPlacard(){
  const p = nearestPainting();
  if(!p) return;
  gameState='placard';
  document.getElementById('pTitle').textContent = p.title;
  document.getElementById('pMeta').textContent = `${p.artist}, ${p.year} — ${p.medium}`;
  document.getElementById('pNote').textContent = p.note;
  document.getElementById('placard').classList.remove('hidden');
  if(!paintingsViewed.has(p.id)){ paintingsViewed.add(p.id); }
  AudioSys.open();
  if(pointerLocked) document.exitPointerLock();
}
function closePlacard(){
  document.getElementById('placard').classList.add('hidden');
  gameState='playing';
  AudioSys.close();
  if(!isTouch) canvas.requestPointerLock();
}
function updatePrompt(){
  const el = document.getElementById('prompt');
  const p = nearestPainting();
  if(p){ el.textContent = `View "${p.title}"`; el.classList.remove('hidden'); }
  else el.classList.add('hidden');
}

/* ---------- movement ---------- */
const WALK=2.6, RUN=4.6;
function updatePlayer(dt){
  const forward = clamp((keys['KeyW']?1:0)-(keys['KeyS']?1:0) + (touchMove.active?-touchMove.y:0) + (-gpMoveY), -1, 1);
  const strafe = clamp((keys['KeyD']?1:0)-(keys['KeyA']?1:0) + (touchMove.active?touchMove.x:0) + gpMoveX, -1, 1);
  player.sprinting = (keys['ShiftLeft']||keys['ShiftRight']||touchSprint||gpSprintHeld) && (forward!==0||strafe!==0);

  const yawDir = new THREE.Vector3(Math.sin(player.yaw),0,Math.cos(player.yaw));
  const rightDir = new THREE.Vector3(Math.sin(player.yaw+Math.PI/2),0,Math.cos(player.yaw+Math.PI/2));
  const moveVec = new THREE.Vector3();
  moveVec.addScaledVector(yawDir,-forward);
  moveVec.addScaledVector(rightDir,strafe);
  if(moveVec.lengthSq()>0) moveVec.normalize();

  const speed = player.sprinting?RUN:WALK;
  const dx = moveVec.x*speed*dt, dz = moveVec.z*speed*dt;
  let nx = player.pos.x+dx, nz = player.pos.z;
  if(collidesAt(nx,nz)) nx = player.pos.x;
  nz = player.pos.z+dz;
  if(collidesAt(nx,nz)) nz = player.pos.z;
  const moved = Math.hypot(nx-player.pos.x, nz-player.pos.z);
  player.pos.x = nx; player.pos.z = nz;
  player.distanceWalked += moved;

  updateChunks(false);

  camera.position.set(player.pos.x, player.pos.y, player.pos.z);
  const bobActive = moved>0.0001;
  footstepTimer -= dt*(player.sprinting?1.7:1);
  let bobY=0;
  if(bobActive){
    bobY = Math.sin(elapsed*(player.sprinting?15:9))*0.035;
    if(footstepTimer<=0){ AudioSys.footstep(); footstepTimer = player.sprinting?0.3:0.46; }
  }
  camera.position.y += bobY;
  camera.rotation.order='YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
}

/* ---------- HUD ---------- */
function refreshStats(){
  document.getElementById('stats').innerHTML = `Paintings viewed: ${paintingsViewed.size}<br>Distance walked: ${Math.round(player.distanceWalked)}m`;
}

/* ---------- pause / save ---------- */
let gameState='menu';
function togglePause(){
  if(gameState==='playing'){ gameState='paused'; document.getElementById('pauseMenu').classList.remove('hidden'); document.getElementById('pauseSeed').textContent='Seed: '+SEED; if(pointerLocked) document.exitPointerLock(); }
  else if(gameState==='paused'){ gameState='playing'; document.getElementById('pauseMenu').classList.add('hidden'); if(!isTouch) canvas.requestPointerLock(); }
}
function saveGame(){
  try{
    localStorage.setItem('gallery_save_v1', JSON.stringify({
      seed:SEED, pos:[player.pos.x,player.pos.y,player.pos.z], yaw:player.yaw,
      distanceWalked:player.distanceWalked, viewed:Array.from(paintingsViewed)
    }));
  }catch(e){}
}
function hasSave(){ try{ return !!localStorage.getItem('gallery_save_v1'); }catch(e){ return false; } }

/* ---------- world start ---------- */
const LOAD_STEPS=['HANGING THE PAINTINGS','SWEEPING THE FLOORS','ADJUSTING THE LIGHTS','SEALING THE EXITS'];
function beginWorld(seedStr, savedData){
  SEED = seedStr;
  builtCells.clear(); builtEdgesV.clear(); builtEdgesH.clear();
  activeWallBoxes=[]; activePaintings=[];
  curCell = {i:null,j:null};
  if(savedData){
    player.pos.set(savedData.pos[0],savedData.pos[1],savedData.pos[2]);
    player.yaw = savedData.yaw||0;
    player.distanceWalked = savedData.distanceWalked||0;
    paintingsViewed = new Set(savedData.viewed||[]);
  } else {
    player.pos.set(0,1.75,0); player.yaw=0; player.distanceWalked=0; paintingsViewed=new Set();
  }
  updateChunks(true);
}
function runLoading(seedStr, savedData, cb){
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('loadingScreen').classList.remove('hidden');
  let i=0; const stepEl = document.getElementById('loadStep');
  function next(){
    if(i>=LOAD_STEPS.length){
      beginWorld(seedStr, savedData);
      document.getElementById('loadingScreen').classList.add('hidden');
      cb(); return;
    }
    stepEl.textContent = LOAD_STEPS[i]; i++;
    setTimeout(next, 200);
  }
  next();
}
function beginPlaying(){
  gameState='playing';
  document.getElementById('hud').classList.remove('hidden');
  if(isTouch) setupTouch(); else canvas.requestPointerLock();
  AudioSys.startAmbience();
  refreshStats();
}

document.getElementById('btnNewRandom').onclick = ()=>{ runLoading('gal-'+Math.floor(Math.random()*1e9), null, beginPlaying); };
document.getElementById('btnNewSeeded').onclick = ()=>{
  const v = document.getElementById('seedInput').value.trim();
  runLoading(v || ('gal-'+Math.floor(Math.random()*1e9)), null, beginPlaying);
};
document.getElementById('btnContinue').onclick = ()=>{
  try{ const data = JSON.parse(localStorage.getItem('gallery_save_v1')); runLoading(data.seed, data, beginPlaying); }catch(e){}
};
if(hasSave()) document.getElementById('btnContinue').disabled=false;
document.getElementById('btnResume').onclick = togglePause;
document.getElementById('btnSaveNow').onclick = saveGame;
document.getElementById('btnQuitMenu').onclick = ()=>{ saveGame(); location.reload(); };

window.addEventListener('beforeunload', ()=>{ if(gameState==='playing'||gameState==='paused') saveGame(); });
window.addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
renderer.setSize(innerWidth, innerHeight);

let autosaveTimer=120;
let elapsed=0;
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(),0.05);
  if(gameState==='playing'){
    elapsed += dt;
    pollGamepad(dt);
    updatePlayer(dt);
    updatePrompt();
    autosaveTimer -= dt;
    if(autosaveTimer<=0){ autosaveTimer=120; saveGame(); }
    distantTimer -= dt;
    if(distantTimer<=0){ distantTimer=40+Math.random()*70; AudioSys.distant(); }
    if(Math.floor(elapsed*2)%2===0) refreshStats();
  } else if(gameState==='placard'){
    pollGamepad(dt);
  }
  renderer.render(scene, camera);
}
animate();

})();
</script>
</body>
</html>
