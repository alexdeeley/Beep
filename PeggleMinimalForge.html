<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Peggle – Minimal Forge</title>
<style>
html,body{
  margin:0;
  padding:0;
  background:#000;
  overflow:hidden;
  touch-action:none;
}
canvas{
  display:block;
}
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let W,H,DPR;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth;
  H = innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W+"px";
  canvas.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize", resize);
resize();

let pegs = [];
let balls = [];
let sparks = [];
let bgLift = 0;

const spacing = 90;
for(let y=140;y<H-120;y+=spacing){
  for(let x=spacing/2;x<W;x+=spacing){
    if((x/spacing + y/spacing) % 2 < 1){
      pegs.push({
        x:x + Math.sin(y*0.02)*20,
        y:y,
        r:14
      });
    }
  }
}

function spawnBall(x){
  balls.push({
    x:x,
    y:20,
    vx:(Math.random()-0.5)*1.2,
    vy:0,
    r:18
  });
  bgLift = Math.min(bgLift + 0.04, 0.35);
}

function loop(){
  const shade = Math.floor(bgLift*255);
  ctx.fillStyle = `rgb(${shade},${shade},${shade})`;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = "#fff";
  for(const p of pegs){
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }

  for(const b of balls){
    b.vy += 0.18;
    b.x += b.vx;
    b.y += b.vy;

    if(b.x < b.r || b.x > W-b.r) b.vx *= -0.9;

    for(const p of pegs){
      const dx = b.x-p.x;
      const dy = b.y-p.y;
      const dist = Math.hypot(dx,dy);
      if(dist < b.r + p.r){
        const nx = dx/dist;
        const ny = dy/dist;
        const dot = b.vx*nx + b.vy*ny;
        b.vx -= 2*dot*nx;
        b.vy -= 2*dot*ny;
        b.vx *= 0.96;
        b.vy *= 0.96;

        for(let i=0;i<6;i++){
          sparks.push({
            x:p.x,
            y:p.y,
            vx:(Math.random()-0.5)*3,
            vy:(Math.random()-0.5)*3,
            life:20
          });
        }
      }
    }

    ctx.fillStyle="#000";
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="#fff";
    ctx.lineWidth=3;
    ctx.stroke();
  }

  for(let i=sparks.length-1;i>=0;i--){
    const s = sparks[i];
    s.x += s.vx;
    s.y += s.vy;
    s.life--;
    ctx.fillStyle = `rgba(255,255,255,${s.life/20})`;
    ctx.fillRect(s.x,s.y,2,2);
    if(s.life<=0) sparks.splice(i,1);
  }

  balls = balls.filter(b=>b.y < H+60);
  requestAnimationFrame(loop);
}
loop();

addEventListener("pointerdown", e=>{
  spawnBall(e.clientX);
});
</script>
</body>
</html>
