<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>99% Flip Checkerboard (100×100)</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
  }
  #topbar {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 4px solid #fff;
  }
  #title {
    color: #fff;
    font-weight: 900;
    letter-spacing: 0.08em;
    font-size: 16px;
    white-space: nowrap;
  }
  button, label {
    color: #000;
    background: #fff;
    border: 0;
    font-weight: 900;
    letter-spacing: 0.06em;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
  }
  label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  input[type="checkbox"]{
    width: 20px; height: 20px;
    accent-color: #000;
  }
  #canvas {
    flex: 1;
    display: block;
    width: 100%;
    height: calc(100% - 60px);
    background: #000;
  }
  #hint {
    margin-left: auto;
    color: #fff;
    font-weight: 800;
    font-size: 12px;
    opacity: 0.9;
    text-align: right;
  }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


  <div id="wrap">
    <div id="topbar">
      <div id="title">CHECKER FLIP 99%</div>
      <button id="resetBtn" aria-label="Reset">RESET</button>
      <label title="If ON: touch flips the touched square too (full 100%). If OFF: only adjacent squares start the wave.">
        <input id="includeCenter" type="checkbox" checked />
        TOUCH SQUARE
      </label>
      <div id="hint">Touch/drag.<br/>Wave: 99% → 0%</div>
    </div>
    <canvas id="canvas"></canvas>
  </div>

<script>
(() => {
  const N = 100; // 100x100
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

  let dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  let cellSize = 6;
  let offX = 0, offY = 0;

  // Grid stored as 0..255 grayscale (0=black, 255=white)
  const grid = new Uint8ClampedArray(N * N);

  // ImageData buffer (1 pixel per cell) we scale up with imageSmoothing disabled
  const bufCanvas = document.createElement('canvas');
  const bufCtx = bufCanvas.getContext('2d', { alpha: false });
  bufCanvas.width = N;
  bufCanvas.height = N;
  let imageData = bufCtx.createImageData(N, N);

  // Interaction state
  let pointerDown = false;
  let lastCell = -1;
  let needsDraw = true;

  function clamp01(x){ return x < 0 ? 0 : (x > 1 ? 1 : x); }

  function resetCheckerboard() {
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const idx = y * N + x;
        grid[idx] = ((x + y) & 1) ? 255 : 0;
      }
    }
    needsDraw = true;
    draw();
  }

  function resize() {
    dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    const w = Math.floor(window.innerWidth * dpr);
    const h = Math.floor((window.innerHeight - document.getElementById('topbar').offsetHeight) * dpr);

    canvas.width = Math.max(1, w);
    canvas.height = Math.max(1, h);

    cellSize = Math.floor(Math.min(canvas.width, canvas.height) / N);
    cellSize = Math.max(2, cellSize); // keep visible
    offX = Math.floor((canvas.width - cellSize * N) / 2);
    offY = Math.floor((canvas.height - cellSize * N) / 2);

    ctx.imageSmoothingEnabled = false;
    bufCtx.imageSmoothingEnabled = false;

    needsDraw = true;
    draw();
  }

  function gridFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const px = (e.clientX - rect.left) * dpr;
    const py = (e.clientY - rect.top) * dpr;

    const gx = Math.floor((px - offX) / cellSize);
    const gy = Math.floor((py - offY) / cellSize);

    if (gx < 0 || gy < 0 || gx >= N || gy >= N) return null;
    return { x: gx, y: gy, idx: gy * N + gx };
  }

  // Apply "flip toward opposite" by proportion p (0..1) on a single cell
  function flipCellBy(idx, p) {
    // v2 = v + (1 - 2v) * p  (moves toward 1-v)
    const v = grid[idx] / 255;
    const v2 = v + (1 - 2 * v) * p;
    grid[idx] = Math.max(0, Math.min(255, Math.round(v2 * 255)));
  }

  // Wave: center optionally 100%, then distance 1 => 99%, distance 2 => 98%, ... distance 99 => 1%, distance 100 => 0%
  // Uses 4-neighborhood (up/down/left/right).
  function waveFlip(cx, cy, includeCenter) {
    const maxDist = 100;

    // BFS queue
    const qx = new Int16Array(N * N);
    const qy = new Int16Array(N * N);
    const qd = new Uint16Array(N * N);
    const seen = new Uint8Array(N * N);

    let head = 0, tail = 0;

    function push(x, y, d) {
      const idx = y * N + x;
      if (seen[idx]) return;
      seen[idx] = 1;
      qx[tail] = x;
      qy[tail] = y;
      qd[tail] = d;
      tail++;
    }

    push(cx, cy, 0);

    while (head < tail) {
      const x = qx[head];
      const y = qy[head];
      const d = qd[head];
      head++;

      // determine p
      let p;
      if (d === 0) {
        if (!includeCenter) {
          // do nothing for center if excluded
        } else {
          p = 1.0;
          flipCellBy(y * N + x, p);
        }
      } else {
        p = clamp01(0.99 - (d - 1) * 0.01); // d=1 => .99, d=2 => .98 ... d=100 => 0
        if (p > 0) flipCellBy(y * N + x, p);
      }

      if (d >= maxDist) continue;

      // neighbors
      if (x > 0) push(x - 1, y, d + 1);
      if (x < N - 1) push(x + 1, y, d + 1);
      if (y > 0) push(x, y - 1, d + 1);
      if (y < N - 1) push(x, y + 1, d + 1);
    }

    needsDraw = true;
    requestAnimationFrame(draw);
  }

  function draw() {
    if (!needsDraw) return;
    needsDraw = false;

    // Fill imageData from grid
    const data = imageData.data;
    // each cell -> one pixel
    for (let i = 0, p = 0; i < grid.length; i++, p += 4) {
      const v = grid[i];
      data[p] = v;
      data[p+1] = v;
      data[p+2] = v;
      data[p+3] = 255;
    }
    bufCtx.putImageData(imageData, 0, 0);

    // Clear and draw scaled grid with crisp pixels
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Border
    ctx.fillStyle = '#fff';
    ctx.fillRect(offX - 6, offY - 6, cellSize * N + 12, cellSize * N + 12);

    // Inner background
    ctx.fillStyle = '#000';
    ctx.fillRect(offX - 2, offY - 2, cellSize * N + 4, cellSize * N + 4);

    // Draw the scaled image
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(bufCanvas, offX, offY, cellSize * N, cellSize * N);
  }

  function handlePointer(e) {
    const hit = gridFromEvent(e);
    if (!hit) return;
    if (hit.idx === lastCell) return;
    lastCell = hit.idx;
    waveFlip(hit.x, hit.y, document.getElementById('includeCenter').checked);
  }

  // Pointer events
  canvas.addEventListener('pointerdown', (e) => {
    pointerDown = true;
    canvas.setPointerCapture(e.pointerId);
    lastCell = -1;
    handlePointer(e);
  }, { passive: true });

  canvas.addEventListener('pointermove', (e) => {
    if (!pointerDown) return;
    handlePointer(e);
  }, { passive: true });

  canvas.addEventListener('pointerup', () => { pointerDown = false; lastCell = -1; }, { passive: true });
  canvas.addEventListener('pointercancel', () => { pointerDown = false; lastCell = -1; }, { passive: true });

  document.getElementById('resetBtn').addEventListener('click', resetCheckerboard);

  window.addEventListener('resize', resize);

  // Init
  resize();
  resetCheckerboard();
})();
</script>
</body>
</html>
