<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instruments — Deeley.org</title>
<link rel="stylesheet" href="instruments/styles/instruments.css">
<style>
  .im-landing-header {
    padding: 20px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .im-landing-title { font-size: 1.4rem; font-weight: 700; }
  .im-landing-sub { color: rgba(242, 242, 245, 0.7); font-size: 0.9rem; max-width: 640px; }
  .im-landing-cta {
    display: inline-block;
    align-self: flex-start;
    background: #4d7cff;
    color: #fff;
    border: none;
    text-decoration: none;
  }
  .im-landing-footer {
    padding: 24px 16px 40px;
    text-align: center;
  }
  .im-landing-footer a {
    color: rgba(242, 242, 245, 0.55);
    font-size: 0.8rem;
    text-decoration: underline;
  }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to deeley.org" title="Back to deeley.org">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>

<div class="im-landing-header">
  <div class="im-landing-title">Instruments</div>
  <div class="im-landing-sub">A small, expandable collection of browser-based instruments. Play one on its own, or open the workspace to combine up to four at once.</div>
  <a class="im-btn im-landing-cta" href="InstrumentsWorkspace.html">Open Workspace &rarr;</a>
</div>
<div id="root"></div>

<script type="module">
  import { createLibraryView } from "./instruments/components/library.js";

  const STANDALONE_PAGES = {
    "drum-machine": "InstrumentsDrumMachine.html",
    "acid-303": "InstrumentsAcid303.html",
  };

  const root = document.getElementById("root");
  const library = createLibraryView({
    hrefFor: (manifest) => STANDALONE_PAGES[manifest.id] || "InstrumentsWorkspace.html",
    actionLabel: "Open",
  });
  root.appendChild(library.el);
</script>

<div class="im-landing-footer">
  <a href="Classic.html">Looking for the classic collection of one-off toys?</a>
</div>
</body>
</html>
