<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="description" content="Sound on deeley.org: the fun little sound toys, newest first.">
<title>Sound — Deeley.org</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<style>
  /* Same page chrome as the home page: follows the system's light/dark setting. */
  :root {
    color-scheme: dark;
    --bg: #000; --ink: #f2f2f5; --ink-2: #b8b8c2; --muted: #8c8c9a; --faint: #5c5c68;
    --line: #1c1c20; --line-2: #2a2a30; --panel: #0c0c0e; --panel-2: #141418;
    --tile-shadow: rgba(0, 0, 0, 0.55);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #fff; --ink: #0c0c10; --ink-2: #3a3a44; --muted: #4a4a54; --faint: #6b6b78;
      --line: #e2e2e8; --line-2: #c8c8d2; --panel: #f4f4f7; --panel-2: #e8e8ee;
      --tile-shadow: rgba(0, 0, 0, 0.25);
    }
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 20px 20px 90px; }
  a { color: inherit; }

  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .back { width: 44px; height: 44px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--panel); border: 1px solid var(--line-2); text-decoration: none; font-size: 26px; line-height: 1; padding-bottom: 3px; }
  h1 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; }
  .topbar .crumb { color: var(--muted); font-weight: 700; font-size: 0.95rem; }
  .tagline { margin: 0 0 18px; color: var(--ink-2); font-size: 1.05rem; line-height: 1.4; max-width: 640px; }

  /* Eight big tabs: the fun little sound toys we open most, newest first.
     Two across on a phone, three or four on a wider screen. */
  .tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (min-width: 640px) { .tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
  @media (min-width: 900px) { .tabs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  a.tab {
    position: relative; display: flex; flex-direction: column; overflow: hidden; aspect-ratio: 4 / 5;
    text-decoration: none; color: var(--ink); background: var(--c); border: 3px solid var(--c); border-radius: 22px;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  a.tab:hover, a.tab:active { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 24px var(--tile-shadow); }
  a.tab:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  a.tab img { display: block; flex: 1 1 0; min-height: 0; width: 100%; object-fit: cover; object-position: top; background: rgba(0, 0, 0, 0.35); }
  a.tab .t-name { display: block; font-weight: 900; font-size: clamp(1.05rem, 3.6vw, 1.35rem); line-height: 1.05; letter-spacing: -0.01em; overflow-wrap: anywhere; padding: 10px 12px 3px; }
  a.tab .t-desc { display: block; font-size: 0.8rem; font-weight: 600; line-height: 1.25; opacity: 0.85; padding: 0 12px 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  a.tab .t-new { position: absolute; top: 10px; right: 10px; background: #000; color: #fff; border: 2px solid #fff; border-radius: 999px; font-size: 0.68rem; font-weight: 900; letter-spacing: 0.1em; padding: 3px 8px; }
  .classic { margin-top: 32px; padding: 14px 16px; border: 1px solid var(--line-2); border-radius: 14px; background: var(--panel); font-size: 0.92rem; color: var(--ink-2); }
  .classic a { font-weight: 800; }
  .empty { color: var(--muted); font-style: italic; }
  .site-footer { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--faint); font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <a class="back" href="index.html" aria-label="Back to deeley.org" title="Back to deeley.org">&#8249;</a>
    <div><h1>Sound</h1><div class="crumb">deeley.org</div></div>
  </div>
  <p class="tagline">The fun little sound toys, newest first. Each one opens on its own and works on a phone; most want your microphone, and headphones help.</p>

  <nav class="tabs" id="tabs" aria-label="Sound toys"></nav>

  <p class="classic">Everything older, from drum machines to noise walls, lives in <a href="Classic.html">the classic collection</a>.</p>
  <footer class="site-footer"><a href="index.html">deeley.org</a></footer>
</main>

<script>
  // Just the recent toys, newest first. Older instruments, drum machines and
  // the Studio workspace are set aside; they stay reachable from the classic
  // collection. Add a new toy at the top and drop the oldest to keep it eight.
  const TOYS = [
    { name: "Blox Board", description: "A meme soundboard: silly, brainrot, explosions, bass boosts and troll sounds, all synthesized, with a Kid Mode and a spot for your own clips.", path: "BloxBoard.html", thumbnail: "thumbnails/blox-board.jpg", added: "2026-11-03" },
    { name: "Vocal Synth", description: "Sing into the mic while you hold chords on a keyboard: a vocoder with robot, alien and dreamy presets.", path: "VocalSynth.html", thumbnail: "thumbnails/vocal-synth.jpg", added: "2026-10-30" },
    { name: "Dual Oscillator", description: "Two voices under two fingers, locked into ratios, drawn as waves, a Lissajous figure or a phase plot.", path: "DualOscillator.html", thumbnail: "thumbnails/dual-oscillator.jpg", added: "2026-10-16" },
    { name: "Time Microscope", description: "Record up to ten seconds, then slow it down: a steady drift, or halved every time you press.", path: "TimeMicroscope.html", thumbnail: "thumbnails/time-microscope.jpg", added: "2026-10-02" },
    { name: "Math Sounds", description: "Random functions drawn as graphs and turned into sound.", path: "SoundOfFunctions.html", thumbnail: "thumbnails/sound-of-functions.jpg", added: "2026-10-02" },
    { name: "Oscillon", description: "A Lissajous curve that speeds up into denser and denser patterns.", path: "Oscillon.html", thumbnail: "thumbnails/oscillon.jpg", added: "2026-10-02" },
    { name: "Neon Waveform", description: "Your mic as a scrolling neon waveform.", path: "OscillateScrollBars.html", thumbnail: "thumbnails/oscillate-scroll-bars.jpg", added: "2026-10-02" },
    { name: "Mic Echo", description: "Your mic as a scrolling waveform, with echo and reverb.", path: "NoiseMicVisualizer.html", thumbnail: "thumbnails/neo-noise-mic-visualizer.jpg", added: "2026-10-02" },
  ];
  const PALETTE = [["#18d4e8", "#000"], ["#ffd43b", "#000"], ["#ff8a1f", "#000"], ["#2bd97a", "#000"], ["#b24bff", "#000"], ["#ff3d5a", "#000"], ["#4d7cff", "#000"], ["#ff5fb0", "#000"]];
  const NEW_DAYS = 21;

  const el = document.getElementById("tabs");
  TOYS.forEach((t, i) => {
    const [bg, ink] = PALETTE[i % PALETTE.length];
    const a = document.createElement("a");
    a.className = "tab"; a.href = t.path; a.title = t.description;
    a.setAttribute("aria-label", `${t.name}. ${t.description}`);
    a.style.setProperty("--c", bg); a.style.setProperty("--ink", ink);
    const img = document.createElement("img"); img.src = t.thumbnail; img.alt = ""; img.loading = i < 4 ? "eager" : "lazy"; img.addEventListener("error", () => img.remove()); a.appendChild(img);
    if (Date.now() - Date.parse(t.added) < NEW_DAYS * 864e5) { const n = document.createElement("span"); n.className = "t-new"; n.textContent = "NEW"; a.appendChild(n); }
    const n = document.createElement("span"); n.className = "t-name"; n.textContent = t.name; a.appendChild(n);
    const d = document.createElement("span"); d.className = "t-desc"; d.textContent = t.description; a.appendChild(d);
    el.appendChild(a);
  });
  window.__sound = { toys: TOYS.length };
</script>
</body>
</html>
