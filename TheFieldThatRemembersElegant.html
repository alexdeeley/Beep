<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Field That Remembers</title>
<style>
html,body{
  margin:0;
  padding:0;
  background:#0a0a18;
  overflow:hidden;
  touch-action:none;
}
canvas{
  display:block;
}
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>

<script>
/*
THE FIELD THAT REMEMBERS - ELEGANT EDITION
Hypnotic, self-healing, oscillating system with moiré interference
Soft curves, glowing lines, organic rounded aesthetics
Dynamic iridescent coloring
No UI. No text. One loop.
*/

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let W, H, DPR;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize", resize);
resize();

// ---------------- MULTIPLE GRIDS FOR MOIRÉ ----------------
const COLS = 44;
const ROWS = 88;
const grids = [];

// Create 3 overlapping grids at different angles and scales
for(let g=0; g<3; g++){
  const nodes = [];
  const angle = g * Math.PI / 6.5; // Slightly different angles for smoother interference
  const scale = 1 + g * 0.06;

  for(let y=0; y<ROWS; y++){
    for(let x=0; x<COLS; x++){
      const px = (x/(COLS-1)) * W * scale;
      const py = (y/(ROWS-1)) * H * scale;

      // Center offset for rotation
      const cx = W/2;
      const cy = H/2;
      const dx = px - cx;
      const dy = py - cy;

      // Rotate around center
      const rx = dx * Math.cos(angle) - dy * Math.sin(angle) + cx;
      const ry = dx * Math.sin(angle) + dy * Math.cos(angle) + cy;

      nodes.push({
        ox:rx, oy:ry,
        x:rx, y:ry,
        vx:0, vy:0,
        phase:Math.random()*Math.PI*2
      });
    }
  }

  grids.push({
    nodes,
    angle,
    rotationSpeed: 0.00008 * (g+1) * (g%2 ? 1 : -1), // Slower counter-rotation
    opacity: 0.55 - g * 0.12,
    blur: 6 + g * 2, // Layered glow effect
    hue: g * 120, // Start hues: 0°(red), 120°(green), 240°(blue)
    saturation: 70 - g * 10 // Varying saturation for depth
  });
}

// ---------------- INTERACTION ----------------
let touches = [];

function addForce(x0,y0,x1,y1){
  const dx = x1-x0;
  const dy = y1-y0;
  const len = Math.hypot(dx,dy)+0.0001;
  const nx = -dy/len;
  const ny = dx/len;

  grids.forEach(grid=>{
    grid.nodes.forEach(n=>{
      const px = n.x-x0;
      const py = n.y-y0;
      const d = Math.abs(px*nx + py*ny);
      if(d<180){
        const fall = Math.pow(1-(d/180), 2.2); // Smooth rounded falloff
        n.vx += nx * fall * 20;
        n.vy += ny * fall * 20;
      }
    });
  });
}

canvas.addEventListener("pointerdown",e=>{
  touches=[{x:e.clientX,y:e.clientY}];
});
canvas.addEventListener("pointermove",e=>{
  if(touches.length){
    addForce(touches[0].x,touches[0].y,e.clientX,e.clientY);
    touches[0]={x:e.clientX,y:e.clientY};
  }
});
canvas.addEventListener("pointerup",()=>touches=[]);
canvas.addEventListener("pointercancel",()=>touches=[]);

// ---------------- LOOP ----------------
let t=0;
function loop(){
  t+=0.0032;

  // Softer fade for elegant trails
  ctx.fillStyle="rgba(10,10,24,0.09)";
  ctx.fillRect(0,0,W,H);

  // Oscillating memory strength with multiple harmonics for organic breathing
  const mem1 = 0.55 + 0.45*Math.sin(t*0.45);
  const mem2 = 0.55 + 0.45*Math.sin(t*0.62 + Math.PI/3);
  const strengthBase = 0.0016;

  // Draw each grid with layered glow
  grids.forEach((grid, gi)=>{
    const mem = gi === 0 ? mem1 : mem2;

    // Slowly rotate grid origin points for dynamic moiré
    grid.angle += grid.rotationSpeed;
    const cx = W/2;
    const cy = H/2;

    // Update nodes with smooth organic flow
    grid.nodes.forEach(n=>{
      // Rotate origin point
      const dx = n.ox - cx;
      const dy = n.oy - cy;
      const rotx = dx * Math.cos(grid.angle) - dy * Math.sin(grid.angle) + cx;
      const roty = dx * Math.sin(grid.angle) + dy * Math.cos(grid.angle) + cy;

      // Spring back to rotated origin
      const ddx = rotx - n.x;
      const ddy = roty - n.y;
      n.vx += ddx * strengthBase * mem;
      n.vy += ddy * strengthBase * mem;

      // Gentle wave interference with organic rhythm
      n.vx += Math.cos(t*1.1+n.phase+gi*0.7)*0.0035;
      n.vy += Math.sin(t*0.85+n.phase+gi*0.5)*0.0035;

      n.vx *= 0.984;
      n.vy *= 0.984;
      n.x += n.vx;
      n.y += n.vy;
    });

    // Dynamic color cycling for each grid layer
    const hueShift = (t * 15 + gi * 40) % 360;
    const baseHue = (grid.hue + hueShift) % 360;
    const sat = grid.saturation;
    const light = 55 + 10 * Math.sin(t * 0.8 + gi);

    // Interaction energy affects color intensity
    const avgSpeed = grid.nodes.reduce((sum, n) => sum + Math.hypot(n.vx, n.vy), 0) / grid.nodes.length;
    const energyBoost = Math.min(20, avgSpeed * 2);

    // Soft glow effect for each layer with dynamic color
    const glowColor = `hsla(${baseHue}, ${sat}%, ${light + energyBoost}%, ${grid.opacity * 0.5})`;
    const strokeColor = `hsla(${baseHue}, ${sat}%, ${light + energyBoost}%, ${grid.opacity})`;

    ctx.shadowBlur = grid.blur;
    ctx.shadowColor = glowColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth=1.2;
    ctx.lineCap="round";
    ctx.lineJoin="round";

    // Draw horizontal threads with smooth curves
    for(let y=0;y<ROWS;y++){
      ctx.beginPath();
      for(let x=0;x<COLS;x++){
        const n = grid.nodes[y*COLS+x];
        if(x===0) ctx.moveTo(n.x, n.y);
        else ctx.lineTo(n.x, n.y);
      }
      ctx.stroke();
    }

    // Draw vertical threads (lighter, more ethereal)
    ctx.globalAlpha=0.4;
    for(let x=0;x<COLS;x++){
      ctx.beginPath();
      for(let y=0;y<ROWS;y++){
        const n = grid.nodes[y*COLS+x];
        if(y===0) ctx.moveTo(n.x, n.y);
        else ctx.lineTo(n.x, n.y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  });

  // Reset shadow for next frame
  ctx.shadowBlur = 0;

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
