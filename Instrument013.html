<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Instrument 01.3</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body{
      margin:0; padding:0; width:100%; height:100%;
      background:#000; color:#fff; overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      touch-action:none; user-select:none;
    }
    canvas{ display:block; width:100vw; height:100vh; cursor:crosshair; }

    #splash{
      position:fixed; inset:0; background:#000;
      display:flex; justify-content:center; align-items:center;
      z-index:10; cursor:pointer;
    }
    .triangle{
      width:0; height:0;
      border-left:52px solid transparent;
      border-right:52px solid transparent;
      border-bottom:86px solid #fff;
      transform: rotate(90deg);
      filter: drop-shadow(0 0 14px rgba(255,255,255,0.35));
    }

    #ui-layer{
      position:fixed; right:10%;
      top:50%; transform:translateY(-50%);
      display:none; flex-direction:column; gap:12px;
      z-index:5; pointer-events:auto;
    }
    .note-btn{
      width:44px; height:44px; background:#000;
      border:2px solid #fff; color:#fff;
      font-size:26px; font-weight:800;
      display:flex; justify-content:center; align-items:center;
      cursor:pointer;
    }
    .note-btn:active{ background:#fff; color:#000; }

    #bottom-ui{
      position:fixed; left:50%; transform:translateX(-50%);
      bottom:22px; width:min(820px, 78vw);
      display:none; align-items:center; gap:14px;
      z-index:5; pointer-events:auto;
    }
    .glyph{ font-size:22px; font-weight:900; opacity:.9; width:22px; text-align:center; }
    .slider{ flex:1; display:flex; align-items:center; gap:10px; }
    input[type="range"]{
      width:100%;
      accent-color:#fff;
      cursor:pointer;
      height:2px;
    }
  </style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>



  <div id="splash" aria-label="Start audio">
    <div class="triangle" aria-hidden="true"></div>
  </div>

  <div id="ui-layer" aria-label="Pitch step buttons"></div>

  <div id="bottom-ui" aria-label="Controls">
    <div class="slider" aria-label="Tempo">
      <div class="glyph">&#9661;</div>
      <input type="range" id="tempo" min="20" max="250" value="100" />
      <div class="glyph">&#9651;</div>
    </div>

    <div class="slider" aria-label="Echo time">
      <div class="glyph">&#8635;</div>
      <input type="range" id="dtime" min="40" max="900" value="260" />
      <div class="glyph">&#8634;</div>
    </div>

    <div class="slider" aria-label="Echo amount">
      <div class="glyph">&#8901;</div>
      <input type="range" id="wet" min="0" max="100" value="22" />
      <div class="glyph">&#8902;</div>
    </div>

    <div class="slider" aria-label="Feedback">
      <div class="glyph">&#8734;</div>
      <input type="range" id="fb" min="0" max="92" value="34" />
      <div class="glyph">&#8734;</div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

<script>
(() => {
  const splash = document.getElementById('splash');
  const uiLayer = document.getElementById('ui-layer');
  const bottomUi = document.getElementById('bottom-ui');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha:false, desynchronized:true });

  const tempoSlider = document.getElementById('tempo');
  const dtimeSlider = document.getElementById('dtime');
  const wetSlider = document.getElementById('wet');
  const fbSlider = document.getElementById('fb');

  let audioCtx;

  const primes = [2, 3, 5, 7, 11, 13, 17];
  let activePrimes = [true, true, true, false, false, false, false];

  const scale = [110, 123.47, 130.81, 146.83, 164.81, 174.61, 196.00, 220, 246.94, 261.63, 293.66, 329.63, 392.00, 440];
  let currentNotes = [0, 2, 4, 6, 7, 9, 11];

  let step = 0;
  let nextStepTime = 0;
  let schedTimer = null;

  // Audio graph
  let master, comp;
  let delay, feedbackGain, wetGain, dryGain;

  // PAD (morphing chord)
  let padGain, padFilter, padOscs = [], padVoiceGains = [];
  let padLfo, padLfoGain;
  let padMorphTimer = null;
  let padOn = true;

  // note history so the pad "learns" what the pattern is doing
  const recentNotes = []; // array of {f, t}
  const NOTE_WINDOW = 6.0; // seconds

  function resizeCanvas(){
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    const w = Math.floor(window.innerWidth);
    const h = Math.floor(window.innerHeight);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function initAudio(){
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // master chain
    comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.knee.value = 18;
    comp.ratio.value = 4;
    comp.attack.value = 0.005;
    comp.release.value = 0.12;

    master = audioCtx.createGain();
    master.gain.value = 0.9;

    // dry/wet
    dryGain = audioCtx.createGain();
    wetGain = audioCtx.createGain();

    // echo
    delay = audioCtx.createDelay(2.0);
    feedbackGain = audioCtx.createGain();

    // feedback loop: delay -> feedback -> delay
    delay.connect(feedbackGain);
    feedbackGain.connect(delay);

    // route: dry + delay(wet) -> comp -> master -> destination
    dryGain.connect(comp);
    delay.connect(wetGain);
    wetGain.connect(comp);
    comp.connect(master);
    master.connect(audioCtx.destination);

    // PAD nodes
    padFilter = audioCtx.createBiquadFilter();
    padFilter.type = 'lowpass';
    padFilter.frequency.value = 900;
    padFilter.Q.value = 0.6;

    padGain = audioCtx.createGain();
    padGain.gain.value = 0.0;

    padFilter.connect(padGain);
    padGain.connect(dryGain);
    padGain.connect(delay);

    // slow LFO to sweep the filter
    padLfo = audioCtx.createOscillator();
    padLfo.type = 'sine';
    padLfo.frequency.value = 0.035; // ~28s cycle

    padLfoGain = audioCtx.createGain();
    padLfoGain.gain.value = 700; // added to base
    padLfo.connect(padLfoGain);
    padLfoGain.connect(padFilter.frequency);
    padLfo.start();

    // create pad voices (5 oscillators)
    for (let i = 0; i < 5; i++){
      const o = audioCtx.createOscillator();
      o.type = 'triangle';

      const g = audioCtx.createGain();
      g.gain.value = 0.0;

      // slight fixed stereo-ish movement by phase offsets through detune
      o.detune.value = (i - 2) * 6;

      o.connect(g);
      g.connect(padFilter);

      o.start();
      padOscs.push(o);
      padVoiceGains.push(g);
    }

    applyEchoParams();
    applyPadTarget(true); // set initial chord
    rampPad(true);        // fade in
    padMorphTimer = setInterval(() => applyPadTarget(false), 2200);
  }

  function applyEchoParams(){
    if (!audioCtx) return;
    const dt = Math.max(0.04, Math.min(0.9, (+dtimeSlider.value || 260) / 1000));
    const wet = Math.max(0, Math.min(1, (+wetSlider.value || 0) / 100));
    const fb = Math.max(0, Math.min(0.92, (+fbSlider.value || 0) / 100));

    const t = audioCtx.currentTime;
    delay.delayTime.setTargetAtTime(dt, t, 0.02);
    wetGain.gain.setTargetAtTime(wet, t, 0.03);
    feedbackGain.gain.setTargetAtTime(fb, t, 0.03);

    const dry = 1 - (wet * 0.55);
    dryGain.gain.setTargetAtTime(dry, t, 0.03);

    // make pad feel more "spacey" as you raise wet/feedback
    const padAmt = Math.min(1, wet * 0.65 + fb * 0.45);
    if (padLfoGain) padLfoGain.gain.setTargetAtTime(520 + padAmt * 820, t, 0.15);
    if (padFilter) padFilter.Q.setTargetAtTime(0.55 + padAmt * 0.7, t, 0.15);
  }

  function pruneRecent(){
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    while (recentNotes.length && (now - recentNotes[0].t) > NOTE_WINDOW) recentNotes.shift();
  }

  function getPadChordFrequencies(){
    pruneRecent();

    // Unique recent freqs (rounded) so we don't get duplicates
    const uniq = [];
    const seen = new Set();

    for (let i = recentNotes.length - 1; i >= 0; i--){
      const f = recentNotes[i].f;
      const key = Math.round(f * 10); // 0.1 Hz buckets
      if (!seen.has(key)){
        seen.add(key);
        uniq.push(f);
      }
      if (uniq.length >= 7) break;
    }

    // Fallback: active rings notes if history is sparse
    if (uniq.length < 3){
      for (let i = 0; i < primes.length; i++){
        if (activePrimes[i]) uniq.push(scale[currentNotes[i]]);
      }
    }

    // Final fallback: a stable base chord
    if (uniq.length < 3){
      uniq.push(110, 146.83, 196.00, 220);
    }

    // Pick 5 notes from the pool (wrap if needed)
    const basePool = uniq.slice().sort((a,b)=>a-b);
    const picked = [];
    for (let i = 0; i < 5; i++){
      picked.push(basePool[i % basePool.length]);
    }

    // Shape it into a chord spread: octave shifts + tiny detune
    const out = [];
    for (let i = 0; i < 5; i++){
      let f = picked[i];

      // spread voices across octaves for a pad-y chord
      const octaveShift =
        (i === 0) ? -1 :
        (i === 1) ? 0 :
        (i === 2) ? 0 :
        (i === 3) ? +1 : +1;

      f = f * Math.pow(2, octaveShift);

      // keep in a pleasant range
      while (f < 55) f *= 2;
      while (f > 880) f *= 0.5;

      // gentle random drift for morph feel
      const drift = 1 + ((Math.random() - 0.5) * 0.006);
      out.push(f * drift);
    }

    return out;
  }

  function rampPad(on){
    if (!audioCtx || !padGain) return;
    const t = audioCtx.currentTime;

    const wet = (+wetSlider.value || 0) / 100;
    const fb = (+fbSlider.value || 0) / 100;

    // base pad level scaled by space controls
    const target = on ? (0.06 + (wet * 0.05) + (fb * 0.04)) : 0.0;

    padGain.gain.cancelScheduledValues(t);
    padGain.gain.setTargetAtTime(target, t, 0.25);

    // per-voice levels (slightly different)
    for (let i = 0; i < padVoiceGains.length; i++){
      const g = padVoiceGains[i];
      const v = on ? (0.22 / padVoiceGains.length) * (0.9 + i * 0.05) : 0.0;
      g.gain.cancelScheduledValues(t);
      g.gain.setTargetAtTime(v, t, 0.35);
    }
  }

  function applyPadTarget(force){
    if (!audioCtx || !padOscs.length) return;
    if (!padOn) return;

    const chord = getPadChordFrequencies();
    const t = audioCtx.currentTime;

    // slow morph glide time (a bit randomized)
    const glide = force ? 0.12 : (0.6 + Math.random() * 0.9);

    for (let i = 0; i < padOscs.length; i++){
      const o = padOscs[i];
      const f = chord[i % chord.length];
      o.frequency.setTargetAtTime(f, t, glide);
    }

    // gently move filter base frequency as part of morph
    const base = 520 + Math.random() * 900;
    padFilter.frequency.setTargetAtTime(base, t, 0.8);

    // pad level updates with echo sliders
    rampPad(true);
  }

  function init(){
    initAudio();
    splash.style.display = 'none';
    uiLayer.style.display = 'flex';
    bottomUi.style.display = 'flex';

    uiLayer.innerHTML = '';
    primes.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.className = 'note-btn';
      btn.type = 'button';
      btn.textContent = '+';
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        currentNotes[i] = (currentNotes[i] + 1) % scale.length;
        playTone(scale[currentNotes[i]], 0.10, 0.05, true);
        // nudge pad to re-learn
        applyPadTarget(false);
      }, { passive:false });
      uiLayer.appendChild(btn);
    });

    [dtimeSlider, wetSlider, fbSlider].forEach(el => {
      el.addEventListener('input', () => { applyEchoParams(); applyPadTarget(false); }, { passive:true });
      el.addEventListener('change', () => { applyEchoParams(); applyPadTarget(false); }, { passive:true });
    });

    resizeCanvas();
    nextStepTime = audioCtx.currentTime + 0.05;
    scheduler();
    render();
  }

  function playTone(freq, decay, level, ping){
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});

    const t0 = audioCtx.currentTime;

    // store for pad learning
    recentNotes.push({ f: freq, t: t0 });
    pruneRecent();

    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t0);

    const g0 = (typeof level === 'number') ? level : 0.14;
    g.gain.setValueAtTime(g0, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + decay);

    osc.connect(g);
    g.connect(dryGain);
    g.connect(delay);

    osc.start(t0);
    osc.stop(t0 + decay);

    if (ping) lastPing = t0;
  }

  function secondsPerStep(){
    const bpm = Math.max(20, Math.min(250, +tempoSlider.value || 100));
    return 60 / (bpm * 4);
  }

  function scheduler(){
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});

    const lookAhead = 0.12;
    while (nextStepTime < audioCtx.currentTime + lookAhead) {
      primes.forEach((p, i) => {
        if (activePrimes[i] && (step % p === 0)) {
          playTone(scale[currentNotes[i]], 0.36, 0.14, false);
        }
      });
      nextStepTime += secondsPerStep();
      step++;
    }
    schedTimer = setTimeout(scheduler, 25);
  }

  let lastPing = 0;

  function render(){
    const w = window.innerWidth;
    const h = window.innerHeight;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);

    const cx = w / 2;
    const cy = h / 2;

    const wet = (+wetSlider.value || 0) / 100;
    const fb = (+fbSlider.value || 0) / 100;
    const glow = Math.min(1, wet * 0.9 + fb * 0.7);

    const now = audioCtx ? audioCtx.currentTime : 0;
    const pingAmt = Math.max(0, 1 - (now - lastPing) / 0.12);

    for (let i = 0; i < primes.length; i++){
      const p = primes[i];
      const radius = 60 + (i * 35);

      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);

      const on = activePrimes[i];
      ctx.strokeStyle = on ? `rgba(255,255,255,${0.85 + glow*0.15})` : '#222';
      ctx.lineWidth = on ? 2 : 1;
      ctx.stroke();

      if (on){
        const angle = (step % p) * (Math.PI * 2 / p) - Math.PI/2;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;

        ctx.beginPath();
        ctx.arc(x, y, 6 + pingAmt*1.5, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();

        // echo-ish trail
        if (glow > 0.02){
          const back = angle - (Math.PI * 2 / p) * (0.35 + glow*0.7);
          const tx = cx + Math.cos(back) * radius;
          const ty = cy + Math.sin(back) * radius;
          ctx.beginPath();
          ctx.arc(tx, ty, 5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${0.10 + glow*0.18})`;
          ctx.fill();
        }
      }
    }

    // pad aura in center (responds to wet/feedback)
    const aura = (padOn ? (0.10 + glow * 0.22) : 0.04);
    const pulse = 0.5 + 0.5 * Math.sin((now || 0) * 0.55);
    const r = 22 + pulse * (18 + glow * 26);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${aura})`;
    ctx.lineWidth = 2;
    ctx.stroke();

    requestAnimationFrame(render);
  }

  function toggleRingAt(x, y){
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const dist = Math.hypot(x - cx, y - cy);

    for (let i = 0; i < primes.length; i++){
      const radius = 60 + (i * 35);
      if (Math.abs(dist - radius) < 20){
        activePrimes[i] = !activePrimes[i];
        playTone(scale[currentNotes[i]], 0.10, activePrimes[i] ? 0.10 : 0.06, false);
        // pad morph reacts to structure changes
        applyPadTarget(false);
        break;
      }
    }
  }

  // Tap/drag around rings toggles them.
  // Tap the CENTER aura to toggle PAD on/off (no text UI).
  function handlePointerDown(e){
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left;
    const y = e.clientY - r.top;

    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const d = Math.hypot(x - cx, y - cy);

    if (d < 55){
      padOn = !padOn;
      if (padOn){
        rampPad(true);
        applyPadTarget(true);
      } else {
        rampPad(false);
      }
      return;
    }

    toggleRingAt(x, y);
  }

  canvas.addEventListener('pointerdown', handlePointerDown, { passive:false });

  splash.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    init();
  }, { passive:false });

  window.addEventListener('resize', resizeCanvas);

  document.addEventListener('visibilitychange', () => {
    if (!audioCtx) return;
    if (document.hidden){
      if (schedTimer) clearTimeout(schedTimer);
      schedTimer = null;
    } else {
      nextStepTime = audioCtx.currentTime + 0.05;
      scheduler();
    }
  });
})();
</script>
</body>
</html>
