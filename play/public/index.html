<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Play">
<title>Play</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a0f'/><circle cx='50' cy='50' r='28' fill='%23ff3d5a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-close" viewBox="0 0 48 48"><path d="M13 13l22 22M35 13L13 35" stroke="#fff" stroke-width="5" stroke-linecap="round"/></symbol>
    <symbol id="i-sound" viewBox="0 0 48 48"><path d="M8 19h8l10-8v26l-10-8H8z" fill="#fff" stroke="#fff" stroke-width="1"/><path d="M32 17c3 4 3 10 0 14M37 12c6 7 6 17 0 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 48 48"><path d="M8 19h8l10-8v26l-10-8H8z" fill="#fff" stroke="#fff" stroke-width="1"/><path d="M33 19l10 10M43 19L33 29" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/></symbol>
    <symbol id="i-invert" viewBox="0 0 48 48"><circle cx="24" cy="24" r="17" fill="none" stroke="#fff" stroke-width="3.2"/><path d="M24 7a17 17 0 0 1 0 34z" fill="#fff"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 48 48"><path d="M14 8h20v10a10 10 0 0 1-20 0z" fill="#ffd43b" stroke="#000" stroke-width="2"/><path d="M14 10H8a6 6 0 0 0 6 10M34 10h6a6 6 0 0 1-6 10" fill="none" stroke="#ffd43b" stroke-width="3" stroke-linecap="round"/><path d="M24 28v8M17 40h14M18 36h12v4H18z" fill="#ffd43b" stroke="#000" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 48 48"><rect x="16" y="16" width="24" height="24" rx="4" fill="none" stroke="#fff" stroke-width="3.2"/><path d="M32 16v-4a2 2 0 0 0-2-2H10a2 2 0 0 0-2 2v20a2 2 0 0 0 2 2h4" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"/></symbol>
    <symbol id="i-share" viewBox="0 0 48 48"><circle cx="36" cy="10" r="6" fill="none" stroke="#fff" stroke-width="3"/><circle cx="12" cy="24" r="6" fill="none" stroke="#fff" stroke-width="3"/><circle cx="36" cy="38" r="6" fill="none" stroke="#fff" stroke-width="3"/><path d="M17.3 21L30.7 13M17.3 27L30.7 35" stroke="#fff" stroke-width="3"/></symbol>
  </defs>
</svg>

<div id="app">

  <!-- HOME -->
  <section id="scr-home" class="screen home" aria-labelledby="logo">
    <div class="home-top">
      <button id="btn-a11y-home" class="btn small ghost a11y-btn" type="button" aria-pressed="false" aria-label="Invert colors for readability">
        <svg width="18" height="18" aria-hidden="true"><use href="#i-invert"/></svg>
      </button>
      <button id="btn-mute-home" class="btn small ghost btn-mute" type="button" aria-pressed="false" aria-label="Mute sounds">
        <svg width="18" height="18" aria-hidden="true"><use href="#i-sound"/></svg>
      </button>
    </div>
    <div class="home-mid">
      <h1 id="logo" class="logo"><span class="logo-play">PLAY</span><span class="logo-slash">/</span><span class="logo-domain">DEELEY.ORG</span></h1>
      <p class="tag">Fast, ridiculous mini-games. Everyone plays at once.</p>
      <div class="home-actions">
        <button id="btn-create" class="btn big red">CREATE GAME</button>
        <button id="btn-join" class="btn big blue">JOIN GAME</button>
      </div>
      <button id="btn-rejoin" class="btn small ghost" hidden></button>
    </div>
    <div class="home-stats" aria-label="Your local play history">
      <div class="stat-box"><span class="stat-n" id="stat-games">0</span><span class="stat-l">RECENT GAMES</span></div>
      <div class="stat-box"><span class="stat-n" id="stat-players">0</span><span class="stat-l">PLAYERS</span></div>
      <div class="stat-box"><span class="stat-n" id="stat-wins">0</span><span class="stat-l">WINS</span></div>
    </div>
  </section>

  <!-- CREATE -->
  <section id="scr-create" class="screen simple" hidden>
    <button class="btn icon back" data-go="home" aria-label="Back"><svg width="22" height="22"><use href="#i-close"/></svg></button>
    <h2 class="title">Your name</h2>
    <input id="in-name-c" class="name-input" type="text" maxlength="14" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="go" placeholder="Type your name">
    <p class="label">Choose your color <span class="optional">(optional)</span></p>
    <div class="swatches" id="swatches-c"></div>
    <p class="err" id="create-err" role="alert"></p>
    <button id="btn-create-go" class="btn big red wide">CREATE GAME</button>
  </section>

  <!-- JOIN -->
  <section id="scr-join" class="screen simple" hidden>
    <button class="btn icon back" data-go="home" aria-label="Back"><svg width="22" height="22"><use href="#i-close"/></svg></button>
    <h2 class="title">Game code</h2>
    <input id="in-code" class="code-input" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="next" placeholder="PLAY5">
    <p class="label">Your name</p>
    <input id="in-name-j" class="name-input" type="text" maxlength="14" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="go" placeholder="Type your name">
    <p class="err" id="join-err" role="alert"></p>
    <button id="btn-join-go" class="btn big blue wide">JOIN GAME</button>
  </section>

  <!-- ROOM (persistent while in a match: lobby -> intro -> playing -> result -> matchover) -->
  <section id="scr-room" class="screen room" hidden>

    <header id="room-hud" hidden>
      <div class="hud-left">
        <span class="hud-code" id="hud-code"></span>
        <span class="hud-round" id="hud-round"></span>
      </div>
      <div class="hud-strip" id="player-strip" role="list"></div>
      <div class="hud-right">
        <button id="btn-a11y-hud" class="btn small ghost a11y-btn" type="button" aria-pressed="false" aria-label="Invert colors for readability">
          <svg width="16" height="16" aria-hidden="true"><use href="#i-invert"/></svg>
        </button>
        <button id="btn-mute-hud" class="btn small ghost btn-mute" type="button" aria-pressed="false" aria-label="Mute sounds">
          <svg width="16" height="16" aria-hidden="true"><use href="#i-sound"/></svg>
        </button>
      </div>
    </header>

    <!-- LOBBY -->
    <div id="panel-lobby" class="panel">
      <p class="room-code-label">GAME CODE</p>
      <div class="room-code-row">
        <span class="room-code-big" id="lobby-code"></span>
        <button id="btn-copy" class="btn icon" aria-label="Copy game code"><svg width="18" height="18"><use href="#i-copy"/></svg></button>
        <button id="btn-share" class="btn icon" aria-label="Share game code" hidden><svg width="18" height="18"><use href="#i-share"/></svg></button>
      </div>
      <p class="lobby-count" id="lobby-count"></p>
      <ul class="player-list" id="lobby-players"></ul>
      <p class="lobby-status" id="lobby-status"></p>
      <button id="btn-ready" class="btn big green wide">I'M READY</button>
      <button id="btn-lobby-leave" class="btn small ghost">Leave game</button>
    </div>

    <!-- INTRO ("NEXT GAME" beat) -->
    <div id="panel-intro" class="panel intro-panel" hidden>
      <p class="intro-label" id="intro-round"></p>
      <h2 class="intro-name" id="intro-game-name"></h2>
      <div class="intro-count" id="intro-count"></div>
      <p class="intro-sub">GET READY</p>
    </div>

    <!-- PLAYING (mini-game mount point) -->
    <div id="panel-playing" class="panel playing-panel" hidden>
      <div id="game-mount"></div>
    </div>

    <!-- RESULT ("ROUND COMPLETE") -->
    <div id="panel-result" class="panel result-panel" hidden>
      <p class="result-label">ROUND COMPLETE</p>
      <p class="result-game-name" id="result-game-name"></p>
      <div class="result-trophy">🏆</div>
      <h2 class="result-winner" id="result-winner"></h2>
      <p class="result-note" id="result-note"></p>
      <p class="result-points" id="result-points"></p>
      <div class="result-scores" id="result-scores"></div>
      <p class="result-next">NEXT GAME…</p>
    </div>

    <!-- MATCH OVER -->
    <div id="panel-matchover" class="panel matchover-panel" hidden>
      <div class="over-trophy" id="over-trophy">🏆</div>
      <p class="over-label">MATCH OVER</p>
      <h2 class="over-winner" id="over-winner"></h2>
      <p class="over-points" id="over-points"></p>
      <div class="over-scores" id="over-scores"></div>
      <button id="btn-again" class="btn big red wide">PLAY AGAIN</button>
      <button id="btn-over-leave" class="btn small ghost">Leave game</button>
    </div>

  </section>

  <!-- Overlays -->
  <div id="ov-conn" class="overlay" hidden>
    <p id="conn-msg">Connecting…</p>
    <button id="btn-conn-home" class="btn small ghost" hidden>Back to home</button>
  </div>

  <div id="ov-confirm" class="overlay" hidden>
    <p id="confirm-msg"></p>
    <div class="overlay-actions">
      <button id="btn-yes" class="btn small red">Yes</button>
      <button id="btn-no" class="btn small ghost">Cancel</button>
    </div>
  </div>

  <div id="banner" class="banner" hidden></div>

</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
