<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hypnotic Spirals</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
        }
        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            position: fixed;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', {
    antialias: false,
    alpha: false,
    preserveDrawingBuffer: false
});

if (!gl) {
    document.body.innerHTML = '';
    throw new Error('WebGL not supported');
}

// Performance adaptive scaling
let qualityScale = 1.0;
let frameTimeSamples = [];
const TARGET_FRAME_TIME = 16.67;

// State
let time = 0;
let interactionForce = { x: 0, y: 0, strength: 0 };
let pulses = [];
let zoomLevel = 1.0;
let rotationBias = 0;
let slowTime = false;
let slowTimeBlend = 0;
let trailPersistence = 0.96;

// Touch/mouse tracking
let touches = [];
let lastTouchDist = 0;
let lastTouchAngle = 0;
let mouseDown = false;
let mousePos = { x: 0, y: 0 };
let lastMousePos = { x: 0, y: 0 };
let longPressTimer = null;

// Framebuffers for ping-pong feedback
let fbA, fbB, texA, texB;

// Resize handling
function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = Math.max(2, Math.floor(w * dpr * qualityScale));
    canvas.height = Math.max(2, Math.floor(h * dpr * qualityScale));
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    gl.viewport(0, 0, canvas.width, canvas.height);

    // Rebuild framebuffers
    setupFramebuffers();
}

// Shader compilation
function createShader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
    }
    return shader;
}

function createProgram(vertSource, fragSource) {
    const program = gl.createProgram();
    const vertShader = createShader(gl.VERTEX_SHADER, vertSource);
    const fragShader = createShader(gl.FRAGMENT_SHADER, fragSource);
    if (!vertShader || !fragShader) return null;
    gl.attachShader(program, vertShader);
    gl.attachShader(program, fragShader);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error(gl.getProgramInfoLog(program));
        return null;
    }
    return program;
}

// Vertex shader (fullscreen quad)
const vertexShaderSource = `
    attribute vec2 a_position;
    varying vec2 v_uv;
    void main() {
        v_uv = a_position * 0.5 + 0.5;
        gl_Position = vec4(a_position, 0.0, 1.0);
    }
`;

// Main spiral fragment shader
const fragmentShaderSource = `
    precision highp float;
    varying vec2 v_uv;
    uniform float u_time;
    uniform vec2 u_resolution;
    uniform sampler2D u_feedback;
    uniform vec2 u_forcePos;
    uniform float u_forceStrength;
    uniform float u_zoom;
    uniform float u_rotation;
    uniform float u_trailPersist;
    uniform float u_slowBlend;

    #define PI 3.14159265359
    #define TAU 6.28318530718

    // Noise functions
    float hash(vec2 p) {
        p = fract(p * vec2(443.897, 441.423));
        p += dot(p, p + 23.45);
        return fract(p.x * p.y);
    }

    float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }

    float fbm(vec2 p) {
        float value = 0.0;
        float amplitude = 0.5;
        for(int i = 0; i < 5; i++) {
            value += amplitude * noise(p);
            p *= 2.3;
            amplitude *= 0.5;
        }
        return value;
    }

    vec2 curl(vec2 p) {
        float eps = 0.01;
        float n1 = fbm(p + vec2(0.0, eps));
        float n2 = fbm(p - vec2(0.0, eps));
        float n3 = fbm(p + vec2(eps, 0.0));
        float n4 = fbm(p - vec2(eps, 0.0));
        return vec2(n1 - n2, n4 - n3) / (2.0 * eps);
    }

    // Spiral equation variants
    float spiralLog(vec2 p, float phase, float freq, float tight) {
        float r = length(p);
        float a = atan(p.y, p.x);
        float spiral = a - log(r + 0.1) * tight + phase;
        return cos(spiral * freq) * 0.5 + 0.5;
    }

    float spiralArch(vec2 p, float phase, float freq) {
        float r = length(p);
        float a = atan(p.y, p.x);
        float spiral = a - r * 0.3 + phase;
        return cos(spiral * freq) * 0.5 + 0.5;
    }

    float spiralLituus(vec2 p, float phase, float freq) {
        float r = length(p);
        float a = atan(p.y, p.x);
        float spiral = a * a - r * 0.5 + phase;
        return cos(spiral * freq) * 0.5 + 0.5;
    }

    void main() {
        vec2 uv = v_uv;
        vec2 coord = (uv - 0.5) * 2.0;
        coord.x *= u_resolution.x / u_resolution.y;
        coord *= u_zoom;

        // Apply rotation bias
        float ca = cos(u_rotation);
        float sa = sin(u_rotation);
        coord = vec2(ca * coord.x - sa * coord.y, sa * coord.x + ca * coord.y);

        // Domain warping with time
        vec2 warp1 = curl(coord * 0.8 + u_time * 0.05);
        vec2 warp2 = curl(coord * 1.3 - u_time * 0.07 + warp1 * 0.5);
        vec2 warpedCoord = coord + warp1 * 0.3 + warp2 * 0.2;

        // Force field influence
        vec2 toForce = coord - u_forcePos;
        float forceDist = length(toForce);
        float forceInfluence = exp(-forceDist * 2.0) * u_forceStrength;
        vec2 forceDir = normalize(toForce + 1e-6);
        warpedCoord += forceDir * forceInfluence * 0.5;
        warpedCoord += vec2(-forceDir.y, forceDir.x) * forceInfluence * 0.3; // curl

        // Multiple spiral layers with different parameters
        float breathe1 = sin(u_time * 0.3) * 0.5 + 0.5;
        float breathe2 = cos(u_time * 0.23) * 0.5 + 0.5;
        float breathe3 = sin(u_time * 0.17) * 0.5 + 0.5;

        // Primary spirals
        float s1 = spiralLog(
            warpedCoord + vec2(sin(u_time * 0.1), cos(u_time * 0.13)) * 0.5,
            u_time * 0.5 + breathe1 * TAU,
            8.0 + breathe1 * 3.0,
            3.0 + breathe1
        );

        float s2 = spiralArch(
            warpedCoord + vec2(cos(u_time * 0.15), sin(u_time * 0.11)) * 0.7,
            u_time * 0.3 + breathe2 * TAU,
            6.0 + breathe2 * 4.0
        );

        float s3 = spiralLituus(
            warpedCoord + vec2(sin(u_time * 0.09), -cos(u_time * 0.14)) * 0.4,
            u_time * 0.7 + breathe3 * TAU,
            5.0 + breathe3 * 2.0
        );

        // Interference pattern (moiré)
        float interference = s1 * s2 + s2 * s3 + s1 * s3;
        interference = pow(interference * 0.33, 1.5);

        // High frequency detail layer
        float microDetail = 0.0;
        for(int i = 0; i < 8; i++) {
            float fi = float(i);
            vec2 offset = vec2(cos(fi * 0.7 + u_time * 0.1), sin(fi * 0.8 - u_time * 0.12)) * 0.3;
            float detail = spiralLog(
                warpedCoord * (2.0 + fi * 0.3) + offset,
                u_time * (0.8 + fi * 0.1),
                12.0 + fi * 2.0,
                4.0
            );
            microDetail += detail * (1.0 / 8.0);
        }

        // Combine spiral layers
        float spiral = (s1 + s2 + s3) * 0.333 + interference * 0.2 + microDetail * 0.3;

        // Phase splitting (chromatic-like effect)
        float phaseShift = sin(u_time * 0.4) * 0.1;
        vec3 color;
        color.r = spiralLog(warpedCoord, u_time * 0.5 + phaseShift, 8.0, 3.0);
        color.g = spiral;
        color.b = spiralLog(warpedCoord, u_time * 0.5 - phaseShift, 8.0, 3.0);

        // Rare bloom event
        float bloomPhase = mod(u_time * 0.05, 1.0);
        float bloomTrigger = step(0.97, bloomPhase);
        float bloomIntensity = bloomTrigger * pow(1.0 - abs(bloomPhase - 0.985) / 0.015, 3.0);
        float bloomDist = length(warpedCoord);
        float bloom = exp(-bloomDist * bloomDist * 2.0) * bloomIntensity * 0.3;
        color += bloom;

        // Feedback trails
        vec4 feedbackColor = texture2D(u_feedback, uv);
        float persistence = mix(u_trailPersist, 0.99, u_slowBlend);
        color = mix(color, feedbackColor.rgb, persistence);

        // Contrast boost
        color = pow(color, vec3(1.2));
        color = smoothstep(0.0, 1.0, color);

        // Subtle dither to prevent banding
        float dither = (hash(uv * u_resolution + fract(u_time)) - 0.5) * 0.01;
        color += dither;

        gl_FragColor = vec4(color, 1.0);
    }
`;

// Compile programs
const mainProgram = createProgram(vertexShaderSource, fragmentShaderSource);
if (!mainProgram) throw new Error('Shader program failed to compile/link');

// Setup quad
const quadBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

function setupFramebuffers() {
    // Clean up old
    if (fbA) gl.deleteFramebuffer(fbA);
    if (fbB) gl.deleteFramebuffer(fbB);
    if (texA) gl.deleteTexture(texA);
    if (texB) gl.deleteTexture(texB);

    function makeTex() {
        const t = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, canvas.width, canvas.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return t;
    }

    texA = makeTex();
    texB = makeTex();

    fbA = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbA);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texA, 0);

    fbB = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbB);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texB, 0);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

// Get uniform locations
function getUniforms(program) {
    return {
        time: gl.getUniformLocation(program, 'u_time'),
        resolution: gl.getUniformLocation(program, 'u_resolution'),
        feedback: gl.getUniformLocation(program, 'u_feedback'),
        forcePos: gl.getUniformLocation(program, 'u_forcePos'),
        forceStrength: gl.getUniformLocation(program, 'u_forceStrength'),
        zoom: gl.getUniformLocation(program, 'u_zoom'),
        rotation: gl.getUniformLocation(program, 'u_rotation'),
        trailPersist: gl.getUniformLocation(program, 'u_trailPersist'),
        slowBlend: gl.getUniformLocation(program, 'u_slowBlend'),
    };
}

const mainUniforms = getUniforms(mainProgram);

// Initialize
resize();
window.addEventListener('resize', resize);

// Touch/Mouse handlers
function getEventPos(e) {
    const rect = canvas.getBoundingClientRect();
    if (e.touches) {
        return Array.from(e.touches).map(t => ({
            x: ((t.clientX - rect.left) / rect.width - 0.5) * 2 * (canvas.width / canvas.height),
            y: -((t.clientY - rect.top) / rect.height - 0.5) * 2
        }));
    } else {
        return [{
            x: ((e.clientX - rect.left) / rect.width - 0.5) * 2 * (canvas.width / canvas.height),
            y: -((e.clientY - rect.top) / rect.height - 0.5) * 2
        }];
    }
}

function handleStart(e) {
    e.preventDefault();
    const positions = getEventPos(e);
    touches = positions;

    if (positions.length === 1) {
        mouseDown = true;
        mousePos = positions[0];
        lastMousePos = positions[0];

        // Inject pulse (kept for future expansion)
        pulses.push({
            x: mousePos.x / zoomLevel,
            y: mousePos.y / zoomLevel,
            time: 0,
            strength: 1.0
        });

        // Long press detection (slow time)
        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => { slowTime = true; }, 500);
    } else if (positions.length === 2) {
        const dx = positions[1].x - positions[0].x;
        const dy = positions[1].y - positions[0].y;
        lastTouchDist = Math.sqrt(dx * dx + dy * dy);
        lastTouchAngle = Math.atan2(dy, dx);
    }
}

function handleMove(e) {
    e.preventDefault();
    const positions = getEventPos(e);

    if (positions.length === 1 && mouseDown) {
        lastMousePos = mousePos;
        mousePos = positions[0];

        // Apply force
        const dx = mousePos.x - lastMousePos.x;
        const dy = mousePos.y - lastMousePos.y;
        interactionForce = {
            x: mousePos.x / zoomLevel,
            y: mousePos.y / zoomLevel,
            strength: Math.sqrt(dx * dx + dy * dy) * 5.0
        };
    } else if (positions.length === 2) {
        const dx = positions[1].x - positions[0].x;
        const dy = positions[1].y - positions[0].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const angle = Math.atan2(dy, dx);

        // Pinch zoom
        if (lastTouchDist > 0) {
            const zoomDelta = dist / lastTouchDist;
            zoomLevel *= zoomDelta;
            zoomLevel = Math.max(0.5, Math.min(3.0, zoomLevel));
        }
        lastTouchDist = dist;

        // Rotation
        if (lastTouchAngle !== 0) {
            const angleDelta = angle - lastTouchAngle;
            rotationBias += angleDelta * 0.5;
        }
        lastTouchAngle = angle;
    }

    touches = positions;
}

function handleEnd(e) {
    e.preventDefault();
    mouseDown = false;
    touches = [];
    lastTouchDist = 0;
    lastTouchAngle = 0;
    clearTimeout(longPressTimer);
    slowTime = false;
}

function handleWheel(e) {
    e.preventDefault();
    const delta = e.deltaY * 0.001;
    zoomLevel *= Math.exp(-delta);
    zoomLevel = Math.max(0.5, Math.min(3.0, zoomLevel));
}

canvas.addEventListener('touchstart', handleStart, { passive: false });
canvas.addEventListener('touchmove', handleMove, { passive: false });
canvas.addEventListener('touchend', handleEnd, { passive: false });
canvas.addEventListener('touchcancel', handleEnd, { passive: false });

canvas.addEventListener('mousedown', handleStart);
canvas.addEventListener('mousemove', handleMove);
canvas.addEventListener('mouseup', handleEnd);
canvas.addEventListener('wheel', handleWheel, { passive: false });

// Right mouse for rotation (desktop)
canvas.addEventListener('contextmenu', e => e.preventDefault());
let rightMouseDown = false;
let lastRightMouseX = 0;

canvas.addEventListener('mousedown', e => {
    if (e.button === 2) {
        rightMouseDown = true;
        lastRightMouseX = e.clientX;
    }
});

canvas.addEventListener('mousemove', e => {
    if (rightMouseDown) {
        const dx = e.clientX - lastRightMouseX;
        rotationBias += dx * 0.01;
        lastRightMouseX = e.clientX;
    }
});

canvas.addEventListener('mouseup', e => {
    if (e.button === 2) rightMouseDown = false;
});

// Animation loop
let lastFrameTime = performance.now();
let pingPong = false;

function render() {
    const now = performance.now();
    const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
    lastFrameTime = now;

    // Performance monitoring
    const frameTime = dt * 1000;
    frameTimeSamples.push(frameTime);
    if (frameTimeSamples.length > 60) frameTimeSamples.shift();

    const avgFrameTime = frameTimeSamples.reduce((a, b) => a + b, 0) / frameTimeSamples.length;

    // Adaptive quality
    if (avgFrameTime > TARGET_FRAME_TIME * 1.5 && qualityScale > 0.5) {
        qualityScale *= 0.98;
        if (frameTimeSamples.length === 60) resize();
    } else if (avgFrameTime < TARGET_FRAME_TIME * 0.8 && qualityScale < 1.0) {
        qualityScale *= 1.01;
        qualityScale = Math.min(1.0, qualityScale);
        if (frameTimeSamples.length === 60) resize();
    }

    // Update time (with slow time effect)
    const timeScale = slowTime ? 0.2 : 1.0;
    slowTimeBlend += (((slowTime ? 1.0 : 0.0) - slowTimeBlend) * dt * 3.0);
    time += dt * timeScale;

    // Decay interaction force
    interactionForce.strength *= Math.exp(-dt * 5.0);

    // Update pulses
    pulses = pulses.filter(p => {
        p.time += dt;
        return p.time < 2.0;
    });

    // Trail persistence modulation
    trailPersistence = 0.96 + slowTimeBlend * 0.03;

    // Render to framebuffer (ping-pong)
    const readFB  = pingPong ? fbB : fbA;
    const readTex = pingPong ? texB : texA;
    const writeFB  = pingPong ? fbA : fbB;
    const writeTex = pingPong ? texA : texB;

    gl.useProgram(mainProgram);

    // Bind quad
    const posLoc = gl.getAttribLocation(mainProgram, 'a_position');
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    // Set uniforms
    gl.uniform1f(mainUniforms.time, time);
    gl.uniform2f(mainUniforms.resolution, canvas.width, canvas.height);
    gl.uniform2f(mainUniforms.forcePos, interactionForce.x, interactionForce.y);
    gl.uniform1f(mainUniforms.forceStrength, interactionForce.strength);
    gl.uniform1f(mainUniforms.zoom, zoomLevel);
    gl.uniform1f(mainUniforms.rotation, rotationBias);
    gl.uniform1f(mainUniforms.trailPersist, trailPersistence);
    gl.uniform1f(mainUniforms.slowBlend, slowTimeBlend);

    // Pass 1: draw into writeFB, sampling readTex as feedback
    gl.bindFramebuffer(gl.FRAMEBUFFER, writeFB);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, readTex);
    gl.uniform1i(mainUniforms.feedback, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // Pass 2: draw to screen, sampling the freshly rendered writeTex
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, writeTex);
    gl.uniform1i(mainUniforms.feedback, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // Flip ping-pong
    pingPong = !pingPong;

    requestAnimationFrame(render);
}

render();
</script>
</body>
