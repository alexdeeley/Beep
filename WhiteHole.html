<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>WHITE HOLE</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Helvetica,Arial,sans-serif;touch-action:none;user-select:none;}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;background:#000;}
  #score{position:fixed;left:18px;top:calc(12px + env(safe-area-inset-top));z-index:2;color:#fff;font:900 clamp(42px,12vw,86px)/.9 Helvetica,Arial,sans-serif;pointer-events:none;text-shadow:0 0 12px #000;}
  #help{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));z-index:2;color:#fff;text-align:center;font:900 clamp(22px,6vw,42px)/1 Helvetica,Arial,sans-serif;pointer-events:none;text-shadow:0 0 12px #000;}
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>
<div id="score">0</div>
<div id="help">DRAG ANYWHERE</div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var scoreEl=document.getElementById('score');
var help=document.getElementById('help');
var W=1,H=1,DPR=1,last=0,score=0;
var worldW=2600, worldH=2600;
var hole={x:1300,y:1300,r:44,vx:0,vy:0};
var target={x:1300,y:1300};
var cam={x:0,y:0};
var down=false, movedOnce=false;
var things=[];

function resize(){
  DPR=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  W=Math.max(1,window.innerWidth||document.documentElement.clientWidth||320);
  H=Math.max(1,window.innerHeight||document.documentElement.clientHeight||480);
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize,false); resize();

function rand(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function makeThing(){
  var type=Math.random(), size, shape;
  if(type<0.58){size=rand(18,34); shape=0;}
  else if(type<0.82){size=rand(36,58); shape=1;}
  else if(type<0.95){size=rand(60,90); shape=2;}
  else{size=rand(96,150); shape=3;}
  return {x:rand(90,worldW-90),y:rand(90,worldH-90),s:size,shape:shape};
}
function reset(){
  things=[]; score=0; hole.x=worldW/2; hole.y=worldH/2; hole.r=44; hole.vx=0; hole.vy=0; target.x=hole.x; target.y=hole.y;
  for(var i=0;i<210;i++)things.push(makeThing());
  scoreEl.textContent='0';
}
reset();

function updateCam(){
  cam.x=clamp(hole.x-W/2,0,Math.max(0,worldW-W));
  cam.y=clamp(hole.y-H/2,0,Math.max(0,worldH-H));
}
function setTarget(clientX,clientY){
  updateCam();
  target.x=clientX+cam.x; target.y=clientY+cam.y;
  movedOnce=true; help.style.display='none';
}
function pointerPoint(e){
  if(e.touches&&e.touches.length){return {x:e.touches[0].clientX,y:e.touches[0].clientY};}
  if(e.changedTouches&&e.changedTouches.length){return {x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};}
  return {x:e.clientX,y:e.clientY};
}
function startMove(e){var p=pointerPoint(e); down=true; setTarget(p.x,p.y); if(e.cancelable)e.preventDefault();}
function move(e){if(!down)return; var p=pointerPoint(e); setTarget(p.x,p.y); if(e.cancelable)e.preventDefault();}
function endMove(e){down=false; if(e&&e.cancelable)e.preventDefault();}

canvas.addEventListener('mousedown',startMove,false);
window.addEventListener('mousemove',move,false);
window.addEventListener('mouseup',endMove,false);
canvas.addEventListener('touchstart',startMove,{passive:false});
window.addEventListener('touchmove',move,{passive:false});
window.addEventListener('touchend',endMove,{passive:false});
canvas.addEventListener('pointerdown',startMove,false);
window.addEventListener('pointermove',move,false);
window.addEventListener('pointerup',endMove,false);

function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function eat(index){
  var t=things[index];
  score+=Math.max(1,Math.round(t.s/10));
  hole.r=Math.min(210,44+Math.sqrt(score)*7.5);
  scoreEl.textContent=String(score);
  things.splice(index,1);
  if(things.length<220){for(var k=0;k<4;k++)things.push(makeThing());}
}
function step(dt){
  dt=Math.min(dt,0.04);
  if(down||movedOnce){
    var dx=target.x-hole.x, dy=target.y-hole.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    var speed=clamp(330-hole.r*.75,150,300);
    if(d>5){hole.vx+=(dx/d*speed-hole.vx)*Math.min(1,dt*7); hole.vy+=(dy/d*speed-hole.vy)*Math.min(1,dt*7);} 
  }
  if(!down){hole.vx*=Math.pow(.12,dt); hole.vy*=Math.pow(.12,dt);}
  hole.x=clamp(hole.x+hole.vx*dt,hole.r+10,worldW-hole.r-10);
  hole.y=clamp(hole.y+hole.vy*dt,hole.r+10,worldH-hole.r-10);
  updateCam();
  for(var i=things.length-1;i>=0;i--){
    var t=things[i]; var dx=t.x-hole.x, dy=t.y-hole.y; var d=Math.sqrt(dx*dx+dy*dy);
    if(hole.r>t.s*.62 && d<hole.r+t.s*.30){eat(i);}
  }
}
function drawThing(t){
  var x=t.x-cam.x, y=t.y-cam.y, s=t.s;
  if(x<-170||y<-170||x>W+170||y>H+170)return;
  var edible=hole.r>t.s*.62;
  ctx.save(); ctx.translate(x,y); ctx.globalAlpha=edible?1:.5; ctx.lineWidth=edible?7:4; ctx.strokeStyle='#fff'; ctx.fillStyle=edible?'#fff':'#000';
  if(t.shape===0){ctx.beginPath(); ctx.arc(0,0,s*.45,0,Math.PI*2); edible?ctx.fill():ctx.stroke();}
  else if(t.shape===1){roundRect(-s*.45,-s*.45,s*.9,s*.9,10); edible?ctx.fill():ctx.stroke();}
  else if(t.shape===2){roundRect(-s*.75,-s*.25,s*1.5,s*.5,14); edible?ctx.fill():ctx.stroke();}
  else{ctx.beginPath(); ctx.moveTo(0,-s*.55); ctx.lineTo(s*.5,s*.35); ctx.lineTo(-s*.5,s*.35); ctx.closePath(); edible?ctx.fill():ctx.stroke();}
  ctx.restore();
}
function draw(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#fff'; ctx.globalAlpha=.13; ctx.lineWidth=2;
  var step=180, sx=Math.floor(cam.x/step)*step, sy=Math.floor(cam.y/step)*step;
  for(var gx=sx;gx<cam.x+W+step;gx+=step){ctx.beginPath();ctx.moveTo(gx-cam.x,0);ctx.lineTo(gx-cam.x,H);ctx.stroke();}
  for(var gy=sy;gy<cam.y+H+step;gy+=step){ctx.beginPath();ctx.moveTo(0,gy-cam.y);ctx.lineTo(W,gy-cam.y);ctx.stroke();}
  ctx.globalAlpha=1;
  ctx.strokeStyle='#fff'; ctx.lineWidth=8; ctx.strokeRect(8-cam.x,8-cam.y,worldW-16,worldH-16);
  things.sort(function(a,b){return a.s-b.s;});
  for(var i=0;i<things.length;i++)drawThing(things[i]);
  var hx=hole.x-cam.x, hy=hole.y-cam.y;
  ctx.save(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(hx,hy,hole.r+11,0,Math.PI*2); ctx.fill(); ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(hx,hy,hole.r,0,Math.PI*2); ctx.fill(); ctx.restore();
  ctx.strokeStyle='#fff'; ctx.lineWidth=8; ctx.beginPath(); ctx.arc(hx,hy,hole.r+6,0,Math.PI*2); ctx.stroke();
  ctx.globalAlpha=.45; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(hx,hy,hole.r+24,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1;
}
function loop(t){
  if(!last)last=t; var dt=(t-last)/1000; last=t; step(dt); draw(); window.requestAnimationFrame(loop);
}
window.requestAnimationFrame(loop);
})();
</script>
</body>
</html>
