<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>SPACE SHOOTER</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --accent: #0ff;
    --danger: #f44;
    --ok: #0f0;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    height: 100%;
    overflow: hidden;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: Helvetica, Arial, sans-serif;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  /* HUD lives are drawn on-canvas (no text). */
  /* End overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 24px;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .scoreText {
    font-family: Helvetica, Arial, sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    text-align: center;
    color: var(--fg);
    font-size: clamp(28px, 8vw, 64px);
  }
  .scoreText span {
    display: block;
    font-size: clamp(48px, 14vw, 120px);
    line-height: 1;
  }
  .btnRow {
    display: flex;
    gap: 16px;
  }
  .roundBtn {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 2px solid var(--fg);
    background: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .roundBtn:active { transform: scale(0.96); }
  .roundBtn svg { width: 44px; height: 44px; fill: var(--fg); }
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    padding: 10px 14px; border: 2px solid var(--fg);
    border-radius: 999px; background: rgba(255,255,255,0.02);
    color: var(--fg); font-weight: 700; font-family: Helvetica, Arial, sans-serif;
    letter-spacing: 1px;
    display: none;
  }
  .toast.show { display: block; }
  /* Minimal text anywhere must be CAPITAL BOLD HELVETICA */
  .scoreText, .toast { text-transform: uppercase; }
  /* Safe zone for iOS home bar */
  .safe {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: env(safe-area-inset-bottom);
    background: transparent; pointer-events: none;
  }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="game"></canvas>

<!-- END OVERLAY -->
<div class="overlay" id="end">
  <div class="scoreText" id="finalScore">SCORE <span>0</span></div>
  <div class="btnRow">
    <!-- SHARE -->
    <button class="roundBtn" id="shareBtn" aria-label="Share">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 8a3 3 0 1 0-2.816-4H14a1 1 0 0 0 0 2h1.184A3.002 3.002 0 0 0 18 8ZM6 14a3 3 0 1 0 2.816 4H10a1 1 0 1 0 0-2H8.816A3.002 3.002 0 0 0 6 14Zm0-10a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm12 6a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM8.2 8.4l7.6 3.2-.8 1.9L7.4 10.3l.8-1.9Zm0 7.2 7.6-3.2.8 1.9-7.6 3.2-.8-1.9Z"/>
      </svg>
    </button>
    <!-- REPLAY -->
    <button class="roundBtn" id="replayBtn" aria-label="Replay">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5V1L6 7l6 6V9a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8Z"/>
      </svg>
    </button>
  </div>
</div>

<div class="toast" id="toast">COPIED</div>
<div class="safe"></div>

<script>
(() => {
  const DPR = Math.min(2, window.devicePixelRatio || 1); // cap for perf
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  let W = 0, H = 0;
  const resize = () => {
    W = Math.floor(window.innerWidth * DPR);
    H = Math.floor(window.innerHeight * DPR);
    canvas.width = W; canvas.height = H;
    canvas.style.width = (W / DPR) + 'px';
    canvas.style.height = (H / DPR) + 'px';
  };
  resize();
  window.addEventListener('resize', resize);

  // Simple PRNG so runs are replayable if needed
  let seed = Date.now() & 0xffffffff;
  function rand() {
    seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
    return (seed >>> 0) / 4294967296;
  }

  // Input — virtual thumb move + tap fire (auto-fire on touch)
  const input = {
    active: false,
    x: 0, y: 0,
  };
  const onTouch = (e) => {
    const t = e.changedTouches[0];
    input.active = true;
    input.x = (t.clientX) * DPR;
    input.y = (t.clientY) * DPR;
  };
  const onMove = (e) => {
    if (!input.active) return;
    const t = e.changedTouches[0];
    input.x = (t.clientX) * DPR;
    input.y = (t.clientY) * DPR;
  };
  const onEnd = () => { input.active = false; };
  canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); onTouch(e); unlockAudio(); }, {passive:false});
  canvas.addEventListener('touchmove', (e)=>{ e.preventDefault(); onMove(e); }, {passive:false});
  canvas.addEventListener('touchend', (e)=>{ e.preventDefault(); onEnd(e); }, {passive:false});
  canvas.addEventListener('touchcancel', (e)=>{ e.preventDefault(); onEnd(e); }, {passive:false});

  // Audio (iOS requires user interaction to start)
  let audioCtx = null;
  function unlockAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.frequency.value = 1; g.gain.value = 0;
      o.connect(g).connect(audioCtx.destination); o.start();
      setTimeout(()=>{ o.stop(); }, 0);
    } catch(e) {
      audioCtx = null;
    }
  }
  function beep(type='shoot', t=0) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime + (t||0);
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    if (type==='shoot') o.frequency.setValueAtTime(880, now);
    if (type==='hit') o.frequency.setValueAtTime(120, now);
    if (type==='power') o.frequency.setValueAtTime(420, now);
    g.gain.setValueAtTime(0.001, now);
    g.gain.exponentialRampToValueAtTime(0.2, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now + 0.15);
  }

  // Entities
  const player = {
    x: W/2, y: H*0.8, r: Math.max(14*DPR, 12), vx:0, lives:3, inv:0
  };
  const bullets = [];
  const enemies = [];
  const particles = [];
  const powerups = [];
  let score = 0;
  let gameOver = false;
  let tick = 0;
  let autofireTimer = 0;
  let spawnTimer = 0;
  let level = 1;

  function reset() {
    bullets.length = 0;
    enemies.length = 0;
    particles.length = 0;
    powerups.length = 0;
    score = 0; gameOver = false; tick = 0; level = 1;
    player.x = W/2; player.y = H*0.8; player.vx=0; player.lives = 3; player.inv = 0;
    seed = (Date.now() ^ (Math.random()*1e9)|0) >>> 0;
    hideEnd();
    loop();
  }

  // Pools
  function addBullet(x,y,vy=-8*DPR) {
    bullets.push({x,y,vy,life: H});
  }
  function addEnemy() {
    const type = rand() < 0.7 ? 'drone' : 'rock';
    const x = (0.1 + 0.8*rand()) * W;
    const y = -20*DPR;
    const r = type==='drone' ? (10+rand()*10)*DPR : (14+rand()*18)*DPR;
    const vy = (1.2 + rand()*0.8 + level*0.02)*DPR;
    const vx = (rand()*2-1) * 0.6 * DPR;
    enemies.push({x,y,r,vy,vx,type,hp: type==='drone'?2:3, t:0});
  }
  function addParticles(x,y,amount=12, speed=2) {
    for (let i=0;i<amount;i++) {
      const a = rand()*Math.PI*2;
      const v = (0.5+rand()*speed)*DPR;
      particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life: 20 + rand()*20});
    }
  }
  function addPowerUp(x,y) {
    powerups.push({x,y,r:10*DPR, vy:1.2*DPR, type: 'spread', life: H});
  }

  // Collision helper
  function hit(a,b,rr) {
    const dx = a.x-b.x, dy=a.y-b.y;
    return (dx*dx + dy*dy) < rr*rr;
  }

  // Stars
  const stars = new Array(140).fill(0).map(()=>({x:rand(), y:rand(), z:rand()}));
  function drawStars() {
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#fff';
    for (const s of stars) {
      s.y += (0.3 + s.z*1.2) * DPR / 2;
      if (s.y > 1) s.y = 0, s.x = rand(), s.z = rand();
      const px = s.x * W, py = s.y * H;
      const size = (1 + s.z*2) * DPR * 0.5;
      ctx.fillRect(px, py, size, size);
    }
  }

  // Render player
  function drawPlayer() {
    const r = player.r;
    ctx.save();
    ctx.translate(player.x, player.y);
    const flicker = player.inv>0 && ((tick>>2)&1);
    ctx.strokeStyle = flicker ? '#333' : '#0ff';
    ctx.lineWidth = 2*DPR;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.lineTo(r*0.75, r);
    ctx.lineTo(0, r*0.4);
    ctx.lineTo(-r*0.75, r);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  function drawLives() {
    for (let i=0;i<player.lives;i++) {
      const x = 16*DPR + i*22*DPR;
      const y = 16*DPR;
      ctx.save();
      ctx.translate(x,y);
      ctx.strokeStyle = '#0ff';
      ctx.lineWidth = 2*DPR;
      ctx.beginPath();
      ctx.moveTo(0, -8*DPR);
      ctx.lineTo(6*DPR, 8*DPR);
      ctx.lineTo(-6*DPR, 8*DPR);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawScoreTiny() {
    // No text during play to stay minimal; draw small pips instead (every 500 points adds a pip)
    const pips = Math.min(6, Math.floor(score/500));
    for (let i=0;i<pips;i++) {
      ctx.fillStyle = '#fff';
      ctx.fillRect(W - (10+i*10)*DPR, 10*DPR, 6*DPR, 6*DPR);
    }
  }

  // Game loop
  let raf = 0;
  function loop() {
    if (gameOver) return;
    raf = requestAnimationFrame(loop);
    tick++;

    // Movement by touch
    if (input.active) {
      const targetX = input.x;
      const dx = targetX - player.x;
      player.vx = dx * 0.2;
    } else {
      player.vx *= 0.9;
    }
    player.x += player.vx;
    player.x = Math.max(player.r+6*DPR, Math.min(W - player.r-6*DPR, player.x));

    // Autofire
    autofireTimer--;
    if (autofireTimer <= 0) {
      addBullet(player.x, player.y - player.r - 6*DPR, -9*DPR);
      if (spreadTime>0) {
        addBullet(player.x - 10*DPR, player.y - player.r - 6*DPR, -8.5*DPR);
        addBullet(player.x + 10*DPR, player.y - player.r - 6*DPR, -8.5*DPR);
      }
      beep('shoot');
      autofireTimer = Math.max(6, 12 - level); // faster with levels
    }

    // Spawning
    spawnTimer--;
    if (spawnTimer <= 0) {
      for (let i=0;i<Math.min(1+Math.floor(level/3),3); i++) addEnemy();
      spawnTimer = Math.max(10, 40 - level*2);
    }
    if (tick % 600 === 0) level++;

    // Update bullets
    for (let i=bullets.length-1;i>=0;i--) {
      const b = bullets[i];
      b.y += b.vy;
      if (b.y < -20*DPR) bullets.splice(i,1);
    }

    // Update enemies
    for (let i=enemies.length-1;i>=0;i--) {
      const e = enemies[i];
      e.t += 1;
      e.x += e.vx + Math.sin((e.t+ i)*0.05) * (e.type==='drone'?0.8*DPR:0.3*DPR);
      e.y += e.vy;
      if (e.y > H + 40*DPR) { enemies.splice(i,1); loseLife(); continue; }
    }

    // Bullet hits
    for (let i=enemies.length-1;i>=0;i--) {
      const e = enemies[i];
      for (let j=bullets.length-1;j>=0;j--) {
        const b = bullets[j];
        if (hit(e,b, e.r)) {
          bullets.splice(j,1);
          e.hp -= 1;
          addParticles(b.x,b.y, 6, 2.6);
          if (e.hp<=0) {
            enemies.splice(i,1);
            score += e.type==='drone'?100:150;
            addParticles(e.x,e.y, 18, 3.2);
            if (Math.random() < 0.08) { addPowerUp(e.x,e.y); beep('power'); }
          }
          break;
        }
      }
    }

    // Powerups
    for (let i=powerups.length-1;i>=0;i--) {
      const p = powerups[i];
      p.y += p.vy;
      if (p.y > H + 30*DPR) { powerups.splice(i,1); continue; }
      if (hit(p, player, player.r + p.r)) {
        powerups.splice(i,1);
        spreadTime = 600; // ~10 seconds at 60fps
        addParticles(player.x, player.y - player.r, 14, 2.8);
        beep('power', 0);
      }
    }

    // Enemy hits player
    if (player.inv<=0) {
      for (let i=enemies.length-1;i>=0;i--) {
        const e = enemies[i];
        if (hit(e, player, e.r + player.r*0.8)) {
          enemies.splice(i,1);
          addParticles(player.x, player.y, 26, 3.5);
          loseLife();
          break;
        }
      }
    } else {
      player.inv--;
    }

    // Particles
    for (let i=particles.length-1;i>=0;i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life -= 1;
      if (p.life<=0) particles.splice(i,1);
    }

    // Draw
    drawStars();
    // powerups
    for (const p of powerups) {
      ctx.strokeStyle = '#0f0';
      ctx.lineWidth = 2*DPR;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.stroke();
      // icon: triple-bullet chevron
      ctx.beginPath();
      ctx.moveTo(p.x - p.r*0.6, p.y);
      ctx.lineTo(p.x + p.r*0.6, p.y);
      ctx.moveTo(p.x - p.r*0.6, p.y - p.r*0.35);
      ctx.lineTo(p.x + p.r*0.6, p.y - p.r*0.35);
      ctx.moveTo(p.x - p.r*0.6, p.y + p.r*0.35);
      ctx.lineTo(p.x + p.r*0.6, p.y + p.r*0.35);
      ctx.stroke();
    }
    // enemies
    for (const e of enemies) {
      if (e.type==='rock') {
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 2*DPR;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
        ctx.stroke();
      } else {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2*DPR;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y - e.r);
        ctx.lineTo(e.x + e.r*0.8, e.y + e.r);
        ctx.lineTo(e.x - e.r*0.8, e.y + e.r);
        ctx.closePath();
        ctx.stroke();
      }
    }
    // bullets
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2*DPR;
    for (const b of bullets) {
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x, b.y + 10*DPR);
      ctx.stroke();
    }
    // particles
    ctx.fillStyle = '#fff';
    for (const p of particles) ctx.fillRect(p.x, p.y, 2*DPR, 2*DPR);

    drawPlayer();
    drawLives();
    drawScoreTiny();
  }

  let spreadTime = 0;
  setInterval(()=>{ if (spreadTime>0) spreadTime--; }, 1000/60);

  function loseLife() {
    beep('hit');
    player.lives--;
    player.inv = 90;
    if (player.lives <= 0) {
      endGame();
    }
  }

  // Pause on hidden
  document.addEventListener('visibilitychange', ()=>{
    if (document.hidden) cancelAnimationFrame(raf);
    else if (!gameOver) loop();
  });

  // End overlay controls
  const endEl = document.getElementById('end');
  const finalScoreEl = document.getElementById('finalScore').querySelector('span');
  const toastEl = document.getElementById('toast');
  const shareBtn = document.getElementById('shareBtn');
  const replayBtn = document.getElementById('replayBtn');

  function endGame() {
    gameOver = true;
    cancelAnimationFrame(raf);
    finalScoreEl.textContent = String(score);
    endEl.classList.add('show');
  }
  function hideEnd() {
    endEl.classList.remove('show');
  }
  function showToast(msg='COPIED') {
    // Must stay uppercase per style
    toastEl.textContent = msg.toUpperCase();
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'), 1200);
  }

  shareBtn.addEventListener('click', async () => {
    const text = `SPACE SHOOTER — SCORE ${score}`;
    try {
      if (navigator.share) {
        await navigator.share({ title: 'SPACE SHOOTER', text });
      } else if (navigator.clipboard) {
        await navigator.clipboard.writeText(text);
        showToast('COPIED');
      } else {
        showToast('COPIED');
      }
    } catch(e) {
      showToast('COPIED');
    }
  });
  replayBtn.addEventListener('click', () => {
    reset();
  });

  // Start
  reset();

  // Prevent scroll bounce on iOS
  document.body.addEventListener('touchmove', (e)=>{ e.preventDefault(); }, {passive:false});
})();
</script>
</body>
</html>
