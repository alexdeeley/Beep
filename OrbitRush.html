<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Orbit Rush</title>
<meta name="theme-color" content="#000000" />
<style>
  :root{ color-scheme: dark; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden;
    touch-action:none; -webkit-user-select:none; user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  canvas{display:block; width:100vw; height:100vh;}

  .overlay{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.82);
    text-align:center; padding:24px; gap:18px;
    z-index:50;
  }
  .overlay.hidden{ display:none; }
  .titleText{
    font-size:clamp(30px,8vw,54px); font-weight:900; letter-spacing:0.06em;
    color:#fff; text-shadow:0 0 20px rgba(120,200,255,0.6), 0 0 50px rgba(120,80,255,0.35);
  }
  .sub{ font-size:clamp(13px,3.4vw,16px); color:rgba(255,255,255,0.7); max-width:420px; line-height:1.5; letter-spacing:0.02em; }
  .scoreLine{ font-size:clamp(16px,4vw,20px); color:#fff; font-weight:700; letter-spacing:0.04em; }
  .scoreLine b{ color:#7cf7ff; }
  .goBtn{
    margin-top:6px;
    border:2px solid #fff; border-radius:999px;
    padding:14px 40px;
    font-size:clamp(15px,4vw,19px); font-weight:800; letter-spacing:0.08em;
    color:#000; background:#fff;
    box-shadow:0 0 26px rgba(255,255,255,0.35);
  }
  .goBtn:active{ transform:scale(0.96); }

  #hud{
    position:fixed; top:0; left:0; width:100%;
    display:flex; justify-content:space-between;
    padding:16px 18px; padding-top:max(16px, env(safe-area-inset-top));
    padding-left:calc(52px + env(safe-area-inset-left)); /* clear the back button */
    pointer-events:none; z-index:5;
  }
  #hud .box{ color:#fff; font-weight:800; font-size:12px; letter-spacing:0.1em; opacity:0.85; text-align:left;}
  #hud .box.right{ text-align:right; }
  #hud .box span{ display:block; font-size:22px; margin-top:2px; }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Site" title="Back to Site">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>

<canvas id="c"></canvas>

<div id="hud">
  <div class="box">SCORE<span id="scoreVal">0</span></div>
  <div class="box right">BEST<span id="bestVal">0</span></div>
</div>

<div class="overlay" id="startOverlay">
  <div class="titleText">ORBIT RUSH</div>
  <div class="sub">Tap anywhere to switch lanes. Dodge the arcs as they spin in — stay on the open lane to survive and score. Yellow dots are free points.</div>
  <button class="goBtn" id="startBtn">TAP TO BEGIN</button>
</div>

<div class="overlay hidden" id="endOverlay">
  <div class="titleText" style="font-size:clamp(26px,7vw,42px);">WIPEOUT</div>
  <div class="scoreLine">SCORE: <b id="finalScore">0</b></div>
  <div class="scoreLine">BEST: <b id="finalBest">0</b></div>
  <button class="goBtn" id="retryBtn">TAP TO RETRY</button>
</div>

<script>
(function(){
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  var W=0,H=0,cx=0,cy=0,innerR=0,outerR=0;
  var stars=[];

  function buildStars(){
    stars=[];
    var count=70;
    for(var i=0;i<count;i++){
      stars.push({
        x: Math.random()*W, y: Math.random()*H,
        r: 0.6+Math.random()*1.4,
        phase: Math.random()*Math.PI*2,
        speed: 0.5+Math.random()*1.2
      });
    }
  }

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cx = W/2; cy = H/2;
    var base = Math.min(W,H);
    outerR = base*0.34;
    innerR = base*0.20;
    buildStars();
  }
  window.addEventListener('resize', resize, {passive:true});
  resize();

  var PLAYER_ANGLE = -Math.PI/2;
  function getLaneR(lane){ return lane===0 ? innerR : outerR; }

  // ---------------- Audio (procedural, no assets, no autoplay) ----------------
  var actx=null, master=null;
  function ensureAudio(){
    if(actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.55;
    var comp = actx.createDynamicsCompressor();
    master.connect(comp); comp.connect(actx.destination);
  }
  function tone(freq,dur,type,peak,t0,glideTo){
    if(!actx) return;
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t0);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,glideTo), t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(peak||0.2, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0+dur+0.03);
  }
  function noiseBurst(dur,peak,t0){
    if(!actx) return;
    var n=Math.floor(actx.sampleRate*dur);
    var buf=actx.createBuffer(1,n,actx.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    var src=actx.createBufferSource(); src.buffer=buf;
    var g=actx.createGain();
    g.gain.setValueAtTime(peak,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(g); g.connect(master);
    src.start(t0);
  }
  function sndSwitch(lane){ ensureAudio(); tone(lane===1?720:420, 0.09,'triangle',0.22,actx.currentTime); }
  function sndPass(){ if(!actx) return; tone(980,0.05,'sine',0.1,actx.currentTime); }
  function sndPickup(){ if(!actx) return; var t=actx.currentTime; tone(880,0.1,'square',0.16,t); tone(1320,0.12,'square',0.12,t+0.05); }
  function sndCrash(){ if(!actx) return; var t=actx.currentTime; tone(160,0.5,'sawtooth',0.22,t,40); noiseBurst(0.35,0.3,t); }

  // ---------------- Game state ----------------
  var state='start'; // start | playing | dead
  var lane=0, visualR=0;
  var worldRot=0, rotSpeed=1.15;
  var nextSpawnAt=0, spawnGap=1.15;
  var obstacles=[]; // {lane, arriveAt, passed}
  var pickups=[]; // {lane, arriveAt, taken}
  var score=0, best=0;
  var shake=0;
  var COLLISION_HALF = 0.30; // radians half-width of the danger window

  var BEST_KEY = 'orbitRush.best';
  try{ best = parseInt(localStorage.getItem(BEST_KEY)||'0',10) || 0; }catch(e){ best = 0; }

  var scoreEl=document.getElementById('scoreVal');
  var bestEl=document.getElementById('bestVal');
  var startOverlay=document.getElementById('startOverlay');
  var endOverlay=document.getElementById('endOverlay');
  var finalScoreEl=document.getElementById('finalScore');
  var finalBestEl=document.getElementById('finalBest');
  bestEl.textContent=String(best);

  function resetGame(){
    lane=0; visualR=getLaneR(0);
    worldRot=0; rotSpeed=1.15;
    nextSpawnAt=1.4; spawnGap=1.15;
    obstacles=[]; pickups=[];
    score=0; shake=0;
    scoreEl.textContent='0';
  }
  resetGame();

  function switchLane(){
    if(state!=='playing') return;
    lane = lane===0 ? 1 : 0;
    sndSwitch(lane);
  }

  function spawnWave(){
    var blockedLane = Math.random()<0.5 ? 0 : 1;
    obstacles.push({lane:blockedLane, arriveAt:nextSpawnAt, passed:false});
    if(Math.random()<0.35){
      pickups.push({lane: blockedLane===0?1:0, arriveAt: nextSpawnAt, taken:false});
    }
    nextSpawnAt += spawnGap;
  }

  var last = performance.now();
  function update(dt){
    if(state!=='playing') return;

    worldRot += rotSpeed*dt;
    rotSpeed = Math.min(2.7, rotSpeed + dt*0.012);
    spawnGap = Math.max(0.62, spawnGap - dt*0.006);

    while(nextSpawnAt < worldRot + 6.5) spawnWave();

    var i,o;
    for(i=0;i<obstacles.length;i++){
      o=obstacles[i];
      var diff = worldRot - o.arriveAt;
      if(!o.passed && Math.abs(diff) < COLLISION_HALF && o.lane===lane){
        die(); return;
      }
      if(!o.passed && diff > COLLISION_HALF){
        o.passed=true;
        score++; scoreEl.textContent=String(score);
        sndPass();
      }
    }
    obstacles = obstacles.filter(function(ob){ return worldRot - ob.arriveAt < 3.2; });

    var p;
    for(i=0;i<pickups.length;i++){
      p=pickups[i];
      var pd = worldRot - p.arriveAt;
      if(!p.taken && Math.abs(pd) < COLLISION_HALF && p.lane===lane){
        p.taken=true;
        score += 5; scoreEl.textContent=String(score);
        sndPickup();
      }
    }
    pickups = pickups.filter(function(pk){ return worldRot - pk.arriveAt < 3.2; });

    visualR += (getLaneR(lane)-visualR) * Math.min(1, dt*14);
    if(shake>0) shake*=0.9;
  }

  function die(){
    state='dead';
    shake=18;
    sndCrash();
    if(score>best){
      best=score;
      try{ localStorage.setItem(BEST_KEY,String(best)); }catch(e){}
    }
    finalScoreEl.textContent=String(score);
    finalBestEl.textContent=String(best);
    bestEl.textContent=String(best);
    setTimeout(function(){ endOverlay.classList.remove('hidden'); }, 550);
  }

  // ---------------- Rendering ----------------
  function angleOf(arriveAt){
    return PLAYER_ANGLE + (worldRot - arriveAt);
  }

  function drawArc(radius, angle, halfWidth, color, width){
    ctx.save();
    ctx.strokeStyle=color;
    ctx.lineWidth=width;
    ctx.lineCap='round';
    ctx.shadowColor=color;
    ctx.shadowBlur=18;
    ctx.beginPath();
    ctx.arc(cx,cy,radius, angle-halfWidth, angle+halfWidth);
    ctx.stroke();
    ctx.restore();
  }

  function render(now){
    var sx=(Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
    ctx.save();
    ctx.translate(sx,sy);

    ctx.fillStyle='#000';
    ctx.fillRect(-20,-20,W+40,H+40);

    for(var s=0;s<stars.length;s++){
      var st=stars[s];
      var a=0.25+0.55*(0.5+0.5*Math.sin(now*0.001*st.speed+st.phase));
      ctx.globalAlpha=a;
      ctx.fillStyle='#fff';
      ctx.beginPath();
      ctx.arc(st.x,st.y,st.r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;

    var g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.75);
    g.addColorStop(0,'rgba(40,20,70,0.35)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    ctx.strokeStyle='rgba(255,255,255,0.12)';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cx,cy,innerR,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,outerR,0,Math.PI*2); ctx.stroke();

    var pulse = 6+Math.sin(now*0.004)*3;
    var hue = (now*0.03)%360;
    ctx.beginPath();
    ctx.fillStyle='hsl('+hue+',90%,60%)';
    ctx.shadowColor='hsl('+hue+',90%,60%)';
    ctx.shadowBlur=24;
    ctx.arc(cx,cy,pulse,0,Math.PI*2);
    ctx.fill();

    if(state==='playing' || state==='dead'){
      obstacles.forEach(function(o){
        var a=angleOf(o.arriveAt);
        drawArc(getLaneR(o.lane), a, COLLISION_HALF*0.92, o.lane===0?'#ff3d7a':'#4fd6ff', 10);
      });
      pickups.forEach(function(p){
        if(p.taken) return;
        var a=angleOf(p.arriveAt);
        var px=cx+Math.cos(a)*getLaneR(p.lane), py=cy+Math.sin(a)*getLaneR(p.lane);
        ctx.beginPath();
        ctx.fillStyle='#ffe25a';
        ctx.shadowColor='#ffe25a'; ctx.shadowBlur=16;
        ctx.arc(px,py,5,0,Math.PI*2);
        ctx.fill();
      });
    }

    var pr = state==='start' ? getLaneR(0) : visualR;
    var px=cx+Math.cos(PLAYER_ANGLE)*pr, py=cy+Math.sin(PLAYER_ANGLE)*pr;
    ctx.save();
    ctx.translate(px,py);
    ctx.rotate(PLAYER_ANGLE+Math.PI/2);
    ctx.fillStyle='#fff';
    ctx.shadowColor='#fff'; ctx.shadowBlur=16;
    ctx.beginPath();
    ctx.moveTo(0,-11); ctx.lineTo(8,9); ctx.lineTo(-8,9); ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  function loop(now){
    var dt=Math.min(0.05,(now-last)/1000);
    last=now;
    update(dt);
    render(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------------- Input ----------------
  function pointerHandler(){
    if(state!=='playing') return;
    switchLane();
  }
  canvas.addEventListener('pointerdown', pointerHandler, {passive:true});
  window.addEventListener('keydown', function(e){
    if(e.code==='Space'||e.code==='ArrowUp'||e.code==='ArrowDown'){
      e.preventDefault();
      if(state==='playing') switchLane();
    }
  }, {passive:false});

  document.getElementById('startBtn').addEventListener('click', function(){
    ensureAudio();
    startOverlay.classList.add('hidden');
    resetGame();
    state='playing';
  });
  document.getElementById('retryBtn').addEventListener('click', function(){
    ensureAudio();
    endOverlay.classList.add('hidden');
    resetGame();
    state='playing';
  });

  document.addEventListener('visibilitychange', function(){
    if(document.hidden && actx && actx.state==='running') actx.suspend();
  });
})();
</script>
</body>
</html>
