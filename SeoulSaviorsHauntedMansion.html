<script>
'use strict';
// =====================================================================
//  SEOUL SAVIORS: THE HAUNTED MANSION  —  Chapter 1
//  Single-file HTML5 canvas game. All art is drawn procedurally as
//  pixel sprites; all audio is synthesized with WebAudio.
// =====================================================================

// ---------------- CORE ----------------
const W = 320, H = 180, TS = 16, HUD = 20, COLS = 20, ROWS = 10;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
function setXf() { ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.imageSmoothingEnabled = false; }
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const choice = a => a[Math.floor(Math.random() * a.length)];
function hash(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 1442695041) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
const FONT_T = 'Silkscreen, monospace', FONT_B = 'VT323, monospace';
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function txt(s, x, y, o = {}) {
  ctx.font = (o.size || 8) + 'px ' + (o.title ? FONT_T : FONT_B);
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = 'top';
  if (o.shadow !== false) { ctx.fillStyle = o.sh || '#05020c'; ctx.fillText(s, x + 0.5, y + 0.5); }
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 8; }
  ctx.fillStyle = o.color || '#f1e9ff'; ctx.fillText(s, x, y); ctx.shadowBlur = 0;
}
function wrap(s, maxW, size = 8, title = false) {
  ctx.font = size + 'px ' + (title ? FONT_T : FONT_B);
  const out = [];
  for (const para of String(s).split('\n')) {
    let line = '';
    for (const w of para.split(' ')) {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
    }
    out.push(line);
  }
  return out;
}
function fitText(s, maxW, size = 8) { ctx.font = size + 'px ' + FONT_B; if (ctx.measureText(s).width <= maxW) return s; while (s.length > 3 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1); return s + '…'; }

const settings = { music: 0.7, sfx: 0.8, shake: true, nums: true };
try { Object.assign(settings, JSON.parse(localStorage.getItem('ss_hm_settings') || '{}')); } catch (e) { }
function saveSettings() { try { localStorage.setItem('ss_hm_settings', JSON.stringify(settings)); } catch (e) { } }

// ---------------- AUDIO ----------------
const Snd = { ctx: null, on: false };
function audioInit() {
  if (Snd.ctx) { if (Snd.ctx.state === 'suspended') Snd.ctx.resume(); return; }
  try {
    const A = new (window.AudioContext || window.webkitAudioContext)();
    Snd.ctx = A;
    Snd.master = A.createGain(); Snd.master.connect(A.destination);
    Snd.music = A.createGain(); Snd.sfx = A.createGain();
    Snd.music.connect(Snd.master); Snd.sfx.connect(Snd.master);
    const d = A.createDelay(); d.delayTime.value = 0.23;
    const fb = A.createGain(); fb.gain.value = 0.32;
    const lp = A.createBiquadFilter(); lp.frequency.value = 2200;
    d.connect(lp); lp.connect(fb); fb.connect(d);
    Snd.echo = A.createGain(); Snd.echo.gain.value = 0.35; Snd.echo.connect(d); lp.connect(Snd.master);
    const len = A.sampleRate * 2, b = A.createBuffer(1, len, A.sampleRate), dd = b.getChannelData(0);
    for (let i = 0; i < len; i++) dd[i] = Math.random() * 2 - 1;
    Snd.noise = b; Snd.on = true;
    applyVolumes(); startAmbience();
    if (Music.track) Music.next = A.currentTime + 0.1;
  } catch (e) { Snd.on = false; }
}
function applyVolumes() { if (!Snd.ctx) return; Snd.music.gain.value = settings.music * 0.55; Snd.sfx.gain.value = settings.sfx * 0.8; }
function tone(f, dur, o = {}) {
  if (!Snd.on) return;
  const A = Snd.ctx, t = A.currentTime + (o.delay || 0);
  const os = A.createOscillator(); os.type = o.type || 'square';
  os.frequency.setValueAtTime(f, t);
  if (o.slide) os.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t + dur);
  const g = A.createGain(); const v = o.vol ?? 0.15;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + (o.att || 0.005));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let node = os;
  if (o.lp) { const f2 = A.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = o.lp; os.connect(f2); node = f2; }
  node.connect(g); g.connect(o.dest || Snd.sfx); if (o.echo) g.connect(Snd.echo);
  os.start(t); os.stop(t + dur + 0.05);
}
function noise(dur, o = {}) {
  if (!Snd.on) return;
  const A = Snd.ctx, t = A.currentTime + (o.delay || 0);
  const s = A.createBufferSource(); s.buffer = Snd.noise; s.loop = true;
  const f = A.createBiquadFilter(); f.type = o.ft || 'lowpass'; f.frequency.setValueAtTime(o.f || 1000, t); f.Q.value = o.q || 1;
  if (o.fs) f.frequency.exponentialRampToValueAtTime(o.fs, t + dur);
  const g = A.createGain(); const v = o.vol ?? 0.2;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.att || 0.005)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(o.dest || Snd.sfx); if (o.echo) g.connect(Snd.echo);
  s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
const sfx = {
  swing() { noise(0.12, { f: 3000, fs: 800, ft: 'bandpass', vol: 0.22 }); },
  hit() { tone(220, 0.1, { slide: 80, vol: 0.16 }); noise(0.06, { f: 1500, vol: 0.18 }); },
  hurt() { tone(300, 0.25, { type: 'sawtooth', slide: 90, vol: 0.2 }); },
  pick() { [0, 4, 7, 12].forEach((n, i) => tone(660 * 2 ** (n / 12), 0.15, { type: 'triangle', delay: i * 0.06, vol: 0.14, echo: 1 })); },
  door() { tone(95, 0.5, { type: 'sawtooth', slide: 60, vol: 0.1, lp: 500 }); noise(0.25, { f: 300, vol: 0.18 }); },
  slam() { noise(0.6, { f: 220, vol: 0.7 }); tone(55, 0.5, { type: 'sine', slide: 30, vol: 0.5 }); },
  thunder() { noise(2.4, { f: 420, fs: 70, vol: 0.55, att: 0.03 }); },
  whisper() { for (let i = 0; i < 3; i++) noise(0.5, { f: rnd(1500, 3500), ft: 'bandpass', q: 9, vol: 0.14, delay: i * 0.33, att: 0.15, echo: 1 }); },
  piano(n) { const f = 261.63 * 2 ** (n / 12); tone(f, 1.5, { type: 'triangle', vol: 0.22, echo: 1 }); tone(f * 2, 0.8, { type: 'sine', vol: 0.06 }); },
  scream() { tone(900, 1.2, { type: 'sawtooth', slide: 300, vol: 0.14, lp: 2500, echo: 1 }); tone(1250, 1, { type: 'sawtooth', slide: 520, vol: 0.08, echo: 1 }); noise(1, { f: 2000, ft: 'bandpass', vol: 0.2 }); },
  step() { noise(0.05, { f: 260, vol: 0.1 }); },
  magic() { [0, 7, 12, 19].forEach((n, i) => tone(440 * 2 ** (n / 12), 0.25, { type: 'sine', delay: i * 0.03, vol: 0.12, echo: 1 })); noise(0.3, { f: 5000, ft: 'highpass', vol: 0.07 }); },
  shoot() { tone(880, 0.1, { slide: 440, vol: 0.07 }); },
  dodge() { noise(0.15, { f: 1200, fs: 400, ft: 'bandpass', vol: 0.16 }); },
  die() { tone(400, 0.3, { slide: 60, vol: 0.12 }); noise(0.25, { f: 800, vol: 0.14 }); },
  levelup() { [0, 4, 7, 12, 16].forEach((n, i) => tone(523 * 2 ** (n / 12), 0.3, { delay: i * 0.08, vol: 0.09, lp: 3000, echo: 1 })); },
  ui() { tone(1200, 0.04, { vol: 0.05 }); },
  deny() { tone(160, 0.18, { vol: 0.1 }); },
  roar() { tone(80, 1.2, { type: 'sawtooth', slide: 40, vol: 0.3, lp: 600 }); noise(1.2, { f: 500, vol: 0.3 }); },
  caw() { tone(1400, 0.12, { type: 'sawtooth', slide: 700, vol: 0.08 }); tone(1300, 0.14, { type: 'sawtooth', slide: 600, vol: 0.08, delay: 0.18 }); },
  phone() { for (let i = 0; i < 2; i++) for (let k = 0; k < 8; k++) tone(k % 2 ? 640 : 480, 0.05, { vol: 0.05, delay: i * 0.6 + k * 0.05 }); },
  mbox() { [12, 16, 19, 24, 19, 16, 12].forEach((n, i) => tone(523 * 2 ** (n / 12), 0.5, { type: 'sine', delay: i * 0.22, vol: 0.07, echo: 1 })); },
  rumble() { noise(1.5, { f: 120, vol: 0.5 }); },
  coin() { tone(988, 0.07, { vol: 0.07 }); tone(1319, 0.2, { vol: 0.07, delay: 0.07 }); },
  heal() { [0, 5, 9].forEach((n, i) => tone(600 * 2 ** (n / 12), 0.2, { type: 'sine', delay: i * 0.05, vol: 0.1 })); },
  chime() { [0, 1.1, 2.2].forEach(d => { tone(392, 1.6, { type: 'sine', delay: d, vol: 0.18, echo: 1 }); tone(784, 1, { type: 'sine', delay: d, vol: 0.05 }); }); },
  tick() { tone(2200, 0.015, { vol: 0.03 }); },
  creak() { tone(140, 0.4, { type: 'sawtooth', slide: 110, vol: 0.06, lp: 900 }); },
};
function startAmbience() {
  const A = Snd.ctx;
  const src = A.createBufferSource(); src.buffer = Snd.noise; src.loop = true;
  const bp = A.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = 0.8;
  const lfo = A.createOscillator(); lfo.frequency.value = 0.13;
  const lg = A.createGain(); lg.gain.value = 300; lfo.connect(lg); lg.connect(bp.frequency);
  const g = A.createGain(); g.gain.value = 0;
  src.connect(bp); bp.connect(g); g.connect(Snd.sfx); src.start(); lfo.start(); Snd.wind = g;
  setWind(Snd.windTarget || 0.05);
}
function setWind(v) { Snd.windTarget = v; if (Snd.wind) Snd.wind.gain.setTargetAtTime(v, Snd.ctx.currentTime, 0.8); }

// ---------------- MUSIC (procedural sequencer) ----------------
const Music = { track: null, name: '', next: 0, step: 0 };
const mf = m => 440 * 2 ** ((m - 69) / 12);
const TRACKS = {
  title: { bpm: 70, bar: 16, chords: [[57, 60, 64], [53, 57, 60], [50, 53, 57], [52, 56, 59]], arp: [0, 1, 2, 1, 2, 1, 0, 1], arpOct: 12, drums: 0, lead: [76, null, 74, null, 72, null, 71, null, 72, null, null, null, 64, null, null, null], leadType: 'triangle' },
  explore: { bpm: 76, bar: 16, chords: [[50, 53, 57], [46, 50, 53], [43, 46, 50], [45, 49, 52]], arp: [0, 2, 1, 2], arpOct: 12, drums: 1, lead: [null, null, null, null, 69, null, 70, null, 69, null, 65, null, null, null, null, null, null, null, null, null, null, null, null, null, 62, null, 64, null, 65, null, 64, null], leadType: 'sine' },
  outside: { bpm: 64, bar: 16, chords: [[45, 48, 52], [41, 45, 48], [43, 47, 50], [40, 44, 47]], arp: [0, null, 2, null, 1, null, 2, null], arpOct: 12, drums: 0, lead: null },
  boss: { bpm: 140, bar: 16, chords: [[45, 48, 52], [41, 45, 48], [43, 47, 50], [44, 47, 52]], arp: [0, 1, 2, 1, 0, 2, 1, 2], arpOct: 24, drums: 2, lead: [69, null, 72, null, 76, null, 74, 72, null, null, 71, null, 72, null, 69, null], leadType: 'sawtooth' },
  waltz: { bpm: 110, bar: 12, chords: [[57, 60, 64], [52, 56, 59], [57, 60, 64], [50, 53, 57], [52, 56, 59], [45, 48, 52]], arp: [null, 1, 2, null, 1, 2], arpOct: 12, drums: 0, bassEvery: 6, lead: [76, null, 74, null, 72, null, 74, null, 79, null, null, null], leadType: 'sine' },
  victory: { bpm: 96, bar: 16, chords: [[48, 52, 55], [53, 57, 60], [55, 59, 62], [48, 52, 55]], arp: [0, 1, 2, 1], arpOct: 12, drums: 1, lead: [72, null, 76, null, 79, null, 84, null, 83, null, 79, null, 76, null, null, null], leadType: 'triangle' },
  silence: null,
};
function musicPlay(n) { if (Music.name === n) return; Music.name = n; Music.track = TRACKS[n]; Music.step = 0; if (Snd.on) Music.next = Snd.ctx.currentTime + 0.15; }
function musicTick() {
  if (!Snd.on || !Music.track) return;
  const A = Snd.ctx, tr = Music.track, spb = 60 / tr.bpm / 2;
  if (Music.next < A.currentTime) Music.next = A.currentTime + 0.05;
  while (Music.next < A.currentTime + 0.2) {
    const s = Music.step, o = { dest: Snd.music, delay: Music.next - A.currentTime };
    const ch = tr.chords[Math.floor(s / tr.bar) % tr.chords.length];
    const ai = tr.arp[s % tr.arp.length];
    if (ai != null) tone(mf(ch[ai] + tr.arpOct), spb * 1.6, { ...o, type: 'square', vol: 0.03, lp: 1500 });
    const be = tr.bassEvery || 8;
    if (s % be === 0) tone(mf(ch[0] - 12), spb * be * 0.9, { ...o, type: 'triangle', vol: 0.12 });
    if (s % tr.bar === 0) ch.forEach(n => tone(mf(n), spb * tr.bar * 0.95, { ...o, type: 'sine', vol: 0.022, att: 0.4 }));
    if (tr.lead) { const ln = tr.lead[s % tr.lead.length]; if (ln != null) tone(mf(ln), spb * 1.8, { ...o, type: tr.leadType, vol: 0.045, lp: 2400 }); }
    if (tr.drums) {
      if (s % 8 === 0 || (tr.drums > 1 && s % 4 === 0)) tone(110, 0.18, { ...o, type: 'sine', slide: 40, vol: 0.32 });
      if (s % 8 === 4) noise(0.12, { ...o, f: 1800, ft: 'bandpass', vol: 0.15 });
      if (s % 2 === 1) noise(0.03, { ...o, f: 7000, ft: 'highpass', vol: 0.04 });

// ---------------- INPUT ----------------
const keys = {}, pressed = {};
let clicks = [], uiHits = [];
const BIND = {
  up: ['ArrowUp', 'KeyW', 'V_up'], down: ['ArrowDown', 'KeyS', 'V_down'], left: ['ArrowLeft', 'KeyA', 'V_left'], right: ['ArrowRight', 'KeyD', 'V_right'],
  attack: ['Space', 'V_attack'], dodge: ['ShiftLeft', 'ShiftRight', 'V_dodge'], interact: ['KeyE', 'V_interact'], special: ['KeyQ', 'V_special'],
  inv: ['KeyI', 'V_inv'], journal: ['KeyJ', 'V_journal'], map: ['KeyM', 'V_map'], pause: ['Escape', 'KeyP', 'V_pause'],
  confirm: ['Enter', 'Space', 'KeyE', 'V_interact', 'V_attack'], back: ['Escape', 'Backspace', 'V_pause'],
  i1: ['Digit1', 'V_i1'], i2: ['Digit2', 'V_i2'], tabL: ['KeyQ', 'BracketLeft', 'PageUp', 'V_special'], tabR: ['KeyR', 'BracketRight', 'PageDown', 'Tab', 'V_dodge'],
};
const held = a => BIND[a].some(k => keys[k]);
const hit = a => BIND[a].some(k => pressed[k]);
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true; keys[e.code] = true; audioInit();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function vkey(k, down) { if (down && !keys[k]) pressed[k] = true; keys[k] = down; }
cv.addEventListener('pointerdown', e => {
  audioInit();
  const r = cv.getBoundingClientRect();
  clicks.push({ x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H });
});
(function setupTouch() {
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const el = document.getElementById('touch');
  if (!isTouch) return;
  el.style.display = 'block';
  el.querySelectorAll('.b').forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); audioInit(); vkey(k, true); b.style.background = '#ff4fb866'; };
    const off = e => { e.preventDefault(); vkey(k, false); b.style.background = ''; };
    b.addEventListener('touchstart', on, { passive: false }); b.addEventListener('touchend', off, { passive: false }); b.addEventListener('touchcancel', off, { passive: false });
    b.addEventListener('mousedown', on); b.addEventListener('mouseup', off); b.addEventListener('mouseleave', off);
  });
})();
function resize() {
  const s = Math.min(innerWidth / 640, innerHeight / 360);
  const sc = s >= 1 ? Math.floor(s) : s;
  cv.style.width = 640 * sc + 'px'; cv.style.height = 360 * sc + 'px';
}
addEventListener('resize', resize); resize();


// ---------------- PIXEL ART ----------------
const OUT = '#0a0514';
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shade(hex, amt) { const [r, g, b] = hexRgb(hex); const f = v => clamp(Math.round(v + amt), 0, 255); return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')'; }
function p(g, c, x, y, w = 1, h = 1) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function makeSprite(w, h, paint, outline = OUT) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); paint(g);
  if (outline) {
    const id = g.getImageData(0, 0, w, h), d = id.data, o = new Uint8ClampedArray(d);
    const [r, gg, b] = hexRgb(outline);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4; if (d[i + 3] > 0) continue;
      let n = false;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const X = x + dx, Y = y + dy;
        if (X >= 0 && Y >= 0 && X < w && Y < h && d[(Y * w + X) * 4 + 3] > 128) { n = true; break; }
      }
      if (n) { o[i] = r; o[i + 1] = gg; o[i + 2] = b; o[i + 3] = 255; }
    }
    id.data.set(o); g.putImageData(id, 0, 0);
  }

    for (const [tx, ty] of ex.tiles) { const d = dist(px, py, tx * 16 + 8, ty * 16 + 8); if (d < 22 && d < bd + 4) { bd = d; best = { exit: ex, x: tx * 16 + 8, y: ty * 16 + 8, label: ex.label || 'Inspect' }; } }

  rows.forEach(([k, v], i) => { txt(k, 132, 47 + i * 11, { size: 8, color: '#a99cff' }); txt('' + v, 298, 47 + i * 11, { size: 8, align: 'right' }); });
  txt('NEXT: CHAPTER 2 — THE DOLLMAKER\'S ATTIC', 160, 150, { size: 7, title: true, align: 'center', color: '#fff1a8' });
  if (vicT > 2) txt('Press E to return to the title  (your progress is saved)', 160, 164, { size: 7, align: 'center', color: '#e4c8ff' });
  hitArea(0, 0, W, H, () => { if (vicT > 2) { mode = 'title'; vicT = 0; P.victory = false; } });
}

// ---------------- MAIN LOOP ----------------
function updOverlay(dt) {
  switch (overlay) {
    case 'dialog': dialog.ch += dt * 70; if (hit('confirm') || hit('back')) advanceDialog(); break;
    case 'inv': updInv(); break;
    case 'journal': updJournal(); break;
    case 'map': if (hit('map') || hit('back') || hit('confirm')) overlay = null; break;
    case 'pause': updPause(); break;
    case 'settings': updSettings(); break;
    case 'controls': if (hit('back') || hit('confirm')) overlay = prevOverlay; break;
    case 'book': updBook(); break;
    case 'clock': updClock(); break;
    case 'piano': updPiano(dt); break;
    case 'cut': updCut(dt); break;
  }
}
function drawOverlay() {
  switch (overlay) {
    case 'dialog': drawDialog(); break;
    case 'inv': drawInv(); break;
    case 'journal': drawJournal(); break;
    case 'map': drawMap(); hitArea(0, 0, W, H, () => { overlay = null; }); break;
    case 'pause': drawPause(); break;
    case 'settings': drawSettings(); break;
    case 'controls': drawControls(); break;
    case 'book': drawBook(); break;
    case 'clock': drawClockUI(); break;
    case 'piano': drawPianoUI(); break;
  }
}
function updPlay(dt) {
  if (fade.dir) return;
  S.time += dt;
  if (hit('pause')) { overlay = 'pause'; pauseSel = 0; sfx.ui(); return; }
  if (hit('inv')) { openInv(); return; }
  if (hit('journal')) { overlay = 'journal'; sfx.creak(); return; }
  if (hit('map')) { overlay = 'map'; sfx.ui(); return; }
  updPlayer(dt); updEnemies(dt); updShots(dt); updFX(dt); updDrops(dt); updTimers(dt); roomTick(dt);
}
function update(dt) {
  if (mode === 'play' && S) {
    for (const t of toasts) t.t -= dt; toasts = toasts.filter(t => t.t > 0);
    banner.t -= dt; if (whisper) { whisper.t -= dt; if (whisper.t <= 0) whisper = null; }
    flashA = Math.max(0, flashA - dt * 2); shakeT -= dt; if (shakeT <= 0) shakeM = 0;
    for (const f of FOG) { f.x += f.vx * dt; if (f.x > 360) f.x = -40; if (f.x < -40) f.x = 360; }
  }
  if (titleMsg.t > 0) titleMsg.t -= dt;
  if (overlay) updOverlay(dt);
  else if (mode === 'title') updTitle();
  else if (mode === 'select') updSelect();
  else if (mode === 'play') updPlay(dt);
  else if (mode === 'gameover') updGameOver();
  else if (mode === 'victory') updVictory(dt);
  if (fade.dir) {
    fade.a += fade.dir * dt * 4;
    if (fade.dir > 0 && fade.a >= 1) { fade.a = 1; const cb = fade.cb; fade.cb = null; fade.dir = -1; if (cb) cb(); }
    else if (fade.dir < 0 && fade.a <= 0) { fade.a = 0; fade.dir = 0; }
  }
}
function draw() {
  setXf(); R(0, 0, W, H, '#05020c');
  if (mode === 'title') drawTitle();
  else if (mode === 'select') drawSelect();
  else if (mode === 'play' || mode === 'gameover') {
    drawWorld(); drawHUD();
    if (boss && boss.active && !boss.dead) drawBossBar();
    drawBanner(); drawWhisper();
    if (overlay === 'cut') drawCut();
    if (flashA > 0) { ctx.globalAlpha = flashA * 0.55; R(0, HUD, W, H - HUD, flashC); ctx.globalAlpha = 1; }
    if (mode === 'gameover') drawGameOver();
  } else if (mode === 'victory') drawVictory();
  if (overlay) drawOverlay();
  if (mode === 'play') drawToasts();
  if (fade.a > 0) { ctx.globalAlpha = fade.a; R(0, 0, W, H, '#000'); ctx.globalAlpha = 1; }
}
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.033, Math.max(0, (now - lastT) / 1000)); lastT = now; T += dt;
  try {
    update(dt);
    uiHits = []; draw();
    for (const c of clicks) { for (let i = uiHits.length - 1; i >= 0; i--) { const h = uiHits[i]; if (c.x >= h.x && c.x <= h.x + h.w && c.y >= h.y && c.y <= h.y + h.h) { h.fn(); break; } } }
  } catch (err) { console.error(err); }
  clicks = [];
  for (const k in pressed) delete pressed[k];
  musicTick();
  requestAnimationFrame(frame);
}
document.fonts && document.fonts.load('8px Silkscreen').catch(() => { });
document.fonts && document.fonts.load('8px VT323').catch(() => { });
requestAnimationFrame(frame);

</script>
