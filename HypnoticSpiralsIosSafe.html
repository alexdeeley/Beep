<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hypnotic Spirals — iOS Safe</title>
<style>
*{margin:0;padding:0;overflow:hidden;touch-action:none;}
body{background:#000;width:100vw;height:100vh;position:fixed;}
canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl",{antialias:false,alpha:false});

if(!gl){ alert("WebGL failed"); throw new Error("No WebGL"); }

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1,2);
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width  = Math.floor(w*dpr);
  canvas.height = Math.floor(h*dpr);
  canvas.style.width = w+"px";
  canvas.style.height = h+"px";
  gl.viewport(0,0,canvas.width,canvas.height);
}
resize();
window.addEventListener("resize",resize);

// ===== SHADERS (EXTREMELY SAFE FOR IOS) =====
const VS = `
attribute vec2 a_position;
varying vec2 v_uv;
void main(){
  v_uv = a_position*0.5+0.5;
  gl_Position = vec4(a_position,0.0,1.0);
}
`;

const FS = `
precision mediump float;   // IMPORTANT: mediump works more reliably on iOS
varying vec2 v_uv;
uniform float u_time;
uniform vec2  u_res;

#define TAU 6.28318530718

float spiral(vec2 p,float t){
  float r = length(p);
  float a = atan(p.y,p.x);
  float s = a - log(r+0.1)*3.0 + t;
  return cos(s*8.0)*0.5+0.5;
}

void main(){
  vec2 uv=v_uv;
  vec2 p=(uv-0.5)*2.0;
  p.x*=u_res.x/u_res.y;

  float t=u_time;

  float s1 = spiral(p + vec2(sin(t*0.1),cos(t*0.13))*0.5, t*0.5);
  float s2 = spiral(p + vec2(cos(t*0.15),sin(t*0.11))*0.7, t*0.3);
  float s3 = spiral(p + vec2(sin(t*0.09),-cos(t*0.14))*0.4, t*0.7);

  float c = (s1+s2+s3)/3.0;

  vec3 col;
  col.r = spiral(p,t*0.5+0.1);
  col.g = c;
  col.b = spiral(p,t*0.5-0.1);

  col = pow(col, vec3(1.2));
  gl_FragColor = vec4(col,1.0);
}
`;

function compile(type,src){
  const s = gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s));
    throw new Error("Shader compile failed");
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER,VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){
  console.error(gl.getProgramInfoLog(prog));
  throw new Error("Program link failed");
}

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,quad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);

const aPos = gl.getAttribLocation(prog,"a_position");
const uTime = gl.getUniformLocation(prog,"u_time");
const uRes  = gl.getUniformLocation(prog,"u_res");

let t=0;
let last=performance.now();

function loop(){
  const now=performance.now();
  const dt=(now-last)/1000;
  last=now;
  t+=dt;

  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER,quad);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);

  gl.uniform1f(uTime,t);
  gl.uniform2f(uRes,canvas.width,canvas.height);

  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
