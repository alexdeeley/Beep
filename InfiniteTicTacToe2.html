<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Infinite Tic-Tac-Toe</title>
  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --dim:rgba(255,255,255,0.35);
      --grid:rgba(255,255,255,0.22);
      --border:6px;
      --gap:14px;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{
      margin:0; padding:0;
      width:100%; height:100%;
      background:var(--bg); color:var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      overflow:hidden;
      position:fixed; /* iOS rubber-band prevention */
      touch-action: manipulation;
    }

    /* Layout */
    #wrap{
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:18px;
      padding:18px;
    }

    #status{
      width:min(92vw, 560px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:2px;
      font-size: clamp(18px, 3.6vw, 30px);
    }

    #status .left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 0;
    }

    .pill{
      border:3px solid var(--fg);
      padding:8px 12px;
      border-radius:999px;
      font-size: clamp(14px, 2.8vw, 18px);
      letter-spacing:1px;
      white-space:nowrap;
    }

    .btn{
      background:var(--bg);
      color:var(--fg);
      border:3px solid var(--fg);
      border-radius:14px;
      padding:10px 12px;
      font-weight:900;
      letter-spacing:1px;
      text-transform:uppercase;
      font-size: clamp(13px, 2.6vw, 16px);
      cursor:pointer;
      user-select:none;
      touch-action: manipulation;
    }
    .btn:active{ transform: translateY(1px); }

    #board{
      display:grid;
      gap:var(--gap);
      padding:var(--gap);
      border:var(--border) solid var(--fg);
      border-radius:22px;
      background: rgba(255,255,255,0.03);
      width: min(92vw, 560px);
      aspect-ratio: 1 / 1;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
    }

    .cell{
      position:relative;
      border:2px solid var(--grid);
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:1000;
      font-size: clamp(72px, 14vw, 120px);
      cursor:pointer;
      user-select:none;
      line-height:1;
      background: rgba(0,0,0,0.35);
      transition: transform 90ms ease, opacity 140ms ease;
    }
    .cell:active{ transform: scale(0.985); }

    .x-marker, .o-marker{ color: var(--fg); }

    /* Oldest piece per player */
    .fading{ opacity: 0.25; }

    /* Winner flash */
    .win{
      outline: 4px solid var(--fg);
      outline-offset: 3px;
      animation: pop 220ms ease-in-out infinite alternate;
    }
    @keyframes pop{
      from{ transform: scale(1); }
      to{ transform: scale(1.015); }
    }

    /* Splash to unlock audio on iOS */
    #splash{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,0.92);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:50;
    }
    #splashCard{
      width:min(92vw, 560px);
      border:6px solid var(--fg);
      border-radius:22px;
      padding:22px;
      display:flex;
      flex-direction:column;
      gap:14px;
      align-items:flex-start;
    }
    #splashTitle{
      font-weight:1000;
      letter-spacing:2px;
      text-transform:uppercase;
      font-size: clamp(22px, 5.5vw, 40px);
      line-height:1.05;
    }
    #splashText{
      color: var(--dim);
      font-weight:800;
      letter-spacing:1px;
      text-transform:uppercase;
      font-size: clamp(12px, 2.8vw, 16px);
      line-height:1.35;
    }
    #startBtn{
      margin-top:6px;
      width:100%;
      padding:14px 14px;
      border-radius:16px;
      border:6px solid var(--fg);
      background: var(--fg);
      color: var(--bg);
      font-weight:1000;
      letter-spacing:2px;
      text-transform:uppercase;
      font-size: clamp(14px, 3.5vw, 18px);
      cursor:pointer;
    }
    #startBtn:active{ transform: translateY(1px); }

    /* Tiny helper line */
    #hint{
      width:min(92vw, 560px);
      color: var(--dim);
      font-weight:800;
      letter-spacing:1px;
      text-transform:uppercase;
      font-size: clamp(11px, 2.6vw, 14px);
      text-align:left;
    }
  </style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


  <div id="splash" role="dialog" aria-modal="true">
    <div id="splashCard">
      <div id="splashTitle">Infinite Tic‑Tac‑Toe</div>
      <div id="splashText">
        Each player can only have 3 marks on the board.
        Your oldest mark fades… then disappears when you place a 4th.
      </div>
      <button id="startBtn">Tap to Begin</button>
    </div>
  </div>

  <div id="wrap" aria-label="Infinite Tic-Tac-Toe game">
    <div id="status">
      <div class="left">
        <div class="pill" id="turnPill">Player X</div>
        <div class="pill" id="statePill">Your Turn</div>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn" id="muteBtn" aria-pressed="false">Sound: On</button>
        <button class="btn" id="resetBtn">Reset</button>
      </div>
    </div>

    <div id="board" role="grid" aria-label="3 by 3 board"></div>
    <div id="hint">Tip: the faded mark is the one that will vanish next.</div>
  </div>

  <script>
    // ---------- State ----------
    let currentPlayer = 'X';
    let movesX = [];
    let movesO = [];
    let isLocked = false; // prevent input during win animation
    let soundOn = true;

    const boardEl = document.getElementById('board');
    const turnPill = document.getElementById('turnPill');
    const statePill = document.getElementById('statePill');
    const resetBtn = document.getElementById('resetBtn');
    const muteBtn = document.getElementById('muteBtn');

    // Build cells dynamically (keeps markup tidy)
    const cells = [];
    for(let i=0;i<9;i++){
      const c = document.createElement('div');
      c.className = 'cell';
      c.setAttribute('role','gridcell');
      c.setAttribute('aria-label', 'Cell ' + (i+1));
      c.addEventListener('click', () => makeMove(i));
      c.addEventListener('touchend', (e) => { e.preventDefault(); makeMove(i); }, {passive:false});
      boardEl.appendChild(c);
      cells.push(c);
    }

    // ---------- Audio (iOS-friendly unlock) ----------
    let audioCtx = null;

    function ensureAudio(){
      if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if(audioCtx.state === 'suspended'){
        audioCtx.resume();
      }
    }

    function blip(freq, dur=0.18){
      if(!soundOn) return;
      ensureAudio();
      const t = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1500, t);

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);

      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.16, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(t);
      osc.stop(t + dur + 0.02);
    }

    function chord(freqs, dur=0.22){
      if(!soundOn) return;
      ensureAudio();
      const t = audioCtx.currentTime;
      const out = audioCtx.createGain();
      out.gain.setValueAtTime(0.0001, t);
      out.gain.exponentialRampToValueAtTime(0.11, t + 0.01);
      out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      out.connect(audioCtx.destination);

      freqs.forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, t);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(1/(freqs.length*1.2), t);
        osc.connect(g);
        g.connect(out);
        osc.start(t + idx*0.006);
        osc.stop(t + dur + 0.02);
      });
    }

    // ---------- UI helpers ----------
    function setStatus(player, stateText){
      turnPill.textContent = `Player ${player}`;
      statePill.textContent = stateText;
    }

    function clearHighlights(){
      cells.forEach(c => c.classList.remove('win'));
    }

    function updateFades(){
      cells.forEach(c => c.classList.remove('fading'));
      if(movesX.length === 3) cells[movesX[0]].classList.add('fading');
      if(movesO.length === 3) cells[movesO[0]].classList.add('fading');
    }

    // ---------- Game logic ----------
    const winConditions = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    function markCell(i, player){
      const cell = cells[i];
      cell.textContent = player;
      cell.classList.remove('x-marker','o-marker');
      cell.classList.add(player === 'X' ? 'x-marker' : 'o-marker');
    }

    function unmarkCell(i){
      const cell = cells[i];
      cell.textContent = '';
      cell.classList.remove('x-marker','o-marker','fading','win');
    }

    function checkWinForPlayer(player){
      return winConditions.find(line => line.every(idx => cells[idx].textContent === player)) || null;
    }

    function makeMove(index){
      if(isLocked) return;
      if(cells[index].textContent !== '') return;

      const currentMoves = (currentPlayer === 'X') ? movesX : movesO;

      // Infinite mechanic: only 3 marks per player
      if(currentMoves.length === 3){
        const oldest = currentMoves.shift();
        unmarkCell(oldest);
      }

      currentMoves.push(index);
      markCell(index, currentPlayer);

      // Sound feedback
      if(currentPlayer === 'X') blip(392); // G4
      else blip(784); // G5

      updateFades();

      const winLine = checkWinForPlayer(currentPlayer);
      if(winLine){
        isLocked = true;
        clearHighlights();
        winLine.forEach(i => cells[i].classList.add('win'));
        setStatus(currentPlayer, 'Wins');
        chord(currentPlayer === 'X' ? [262, 330, 392] : [330, 392, 494], 0.30);

        // brief pause then reset
        setTimeout(() => resetGame(), 1200);
        return;
      }

      // Switch player
      currentPlayer = (currentPlayer === 'X') ? 'O' : 'X';
      setStatus(currentPlayer, 'Your Turn');
    }

    function resetGame(){
      isLocked = false;
      movesX = [];
      movesO = [];
      currentPlayer = 'X';
      cells.forEach((_,i) => unmarkCell(i));
      setStatus('X', 'Your Turn');
      updateFades();
    }

    // Buttons
    resetBtn.addEventListener('click', () => { blip(220, 0.12); resetGame(); });
    muteBtn.addEventListener('click', () => {
      soundOn = !soundOn;
      muteBtn.textContent = soundOn ? 'Sound: On' : 'Sound: Off';
      muteBtn.setAttribute('aria-pressed', soundOn ? 'false' : 'true');
      if(soundOn) blip(660, 0.10);
    });

    // Splash / audio unlock
    const splash = document.getElementById('splash');
    const startBtn = document.getElementById('startBtn');
    startBtn.addEventListener('click', () => {
      ensureAudio();
      blip(523.25, 0.10);
      splash.style.display = 'none';
    });
    startBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      ensureAudio();
      blip(523.25, 0.10);
      splash.style.display = 'none';
    }, {passive:false});

    // Keyboard accessibility (optional)
    window.addEventListener('keydown', (e) => {
      if(splash.style.display !== 'none'){
        if(e.key === 'Enter' || e.key === ' ') startBtn.click();
        return;
      }
      if(e.key === 'r' || e.key === 'R') resetGame();
      if(e.key === 'm' || e.key === 'M') muteBtn.click();
    });

    // Initialize
    resetGame();
  </script>
</body>
</html>
