<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>High-Contrast Kaleidoscope</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: fixed;
      bottom: 18px;
      left: 18px;
      right: 18px;
      color: #fff;
      font-family: Helvetica, Arial, sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 12px;
      opacity: 0.7;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


  <canvas id="canvas"></canvas>
  <div id="ui">DRAG TO SHIFT MIRRORS • TAP TO RESET</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = 0;
    let height = 0;
    let cx = 0;
    let cy = 0;
    let dpr = 1;

    let pointerX = window.innerWidth * 0.5;
    let pointerY = window.innerHeight * 0.5;
    let tick = 0;
    let sliceCount = 12;
    const lineWeight = 3;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      cx = width * 0.5;
      cy = height * 0.5;
    }

    function updateFromPointer(x, y) {
      pointerX = x;
      pointerY = y;
      sliceCount = Math.max(4, Math.min(24, Math.floor((pointerX / width) * 20) + 4));
    }

    window.addEventListener('resize', resize);
    resize();

    window.addEventListener('mousemove', (e) => {
      updateFromPointer(e.clientX, e.clientY);
    });

    window.addEventListener('mousedown', () => {
      tick = 0;
    });

    window.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      if (!t) return;
      updateFromPointer(t.clientX, t.clientY);
      tick = 0;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      if (!t) return;
      updateFromPointer(t.clientX, t.clientY);
      e.preventDefault();
    }, { passive: false });

    function drawShape(t) {
      const pulse = Math.sin(t * 0.02) * 50;
      const size = 90 + pulse;
      const wobble = Math.cos(t * 0.017) * 35;

      ctx.beginPath();
      ctx.moveTo(pulse, wobble);
      ctx.lineTo(size, 0);
      ctx.lineTo(size, size);
      ctx.lineTo(wobble, size * 0.35);
      ctx.closePath();
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(size * 0.5, size * 0.5, Math.max(8, Math.abs(pulse * 0.45)), 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(size * 0.7, size * 0.25);
      ctx.lineTo(size * 0.15, size * 0.85);
      ctx.stroke();
    }

    function render() {
      ctx.fillStyle = 'rgba(0,0,0,0.16)';
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = '#fff';
      ctx.lineWidth = lineWeight;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      tick++;

      const stretch = 0.35 + (pointerY / height) * 1.85;
      const spin = tick * 0.005;
      const radiusOffset = 20 + (pointerY / height) * 80;

      for (let i = 0; i < sliceCount; i++) {
        const angle = (Math.PI * 2 / sliceCount) * i;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle + spin);
        ctx.scale(stretch, stretch);
        ctx.translate(radiusOffset, 0);

        drawShape(tick);

        ctx.scale(1, -1);
        drawShape(tick);

        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
