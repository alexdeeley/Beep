<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>ARTSY v3.1 — Seeded Painter</title>
<style>
  :root { --bg:#000; --fg:#fff; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Helvetica,Arial,sans-serif;}
  .chrome{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;background:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,.35) 70%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20}
  .seedbox{display:flex;gap:8px;align-items:center;border:2px solid var(--fg);border-radius:999px;padding:8px 12px;max-width:520px;width:92%;background:rgba(0,0,0,.4)}
  .seedbox input{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font-size:18px;text-align:center;}
  .btn{width:44px;height:44px;border-radius:999px;border:2px solid var(--fg);display:grid;place-items:center;background:transparent;color:var(--fg);cursor:pointer;user-select:none;touch-action:manipulation;}
  .btn:active{transform:scale(.96)}
  .wrap{position:fixed;inset:0;display:grid;place-items:center;}
  canvas{width:100vw;height:100vh;display:block;image-rendering:auto;background:#000;}
  .visually-hidden{position:absolute!important;height:1px;width:1px;overflow:hidden;clip:rect(1px,1px,1px,1px);white-space:nowrap;border:0;padding:0;margin:-1px;}
  .error{position:fixed;inset:auto 0 0 0;background:#000c;color:#fff;padding:10px 12px;text-align:center;font-size:14px}
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


  <div class="chrome" role="group" aria-label="Controls">
    <div class="seedbox" role="group" aria-label="Seed input">
      <input id="seedInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="seed" aria-label="Seed" />
      <button id="genBtn" class="btn" title="Generate" aria-label="Generate">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 5v2.5a.5.5 0 0 0 .8.4l5-3.5a.5.5 0 0 0 0-.8l-5-3.5a.5.5 0 0 0-.8.4V3A9 9 0 1 0 21 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="saveBtn" class="btn" title="Share / Save" aria-label="Share or Save">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="wrap">
    <canvas id="c"></canvas>
  </div>

  <span class="visually-hidden" aria-live="polite" id="live"></span>
  <div id="err" class="error" style="display:none"></div>

<script>
// -------- PRNG --------
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}}
function cyrb128(str){let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;for(let i=0,k;i<str.length;i++){k=str.charCodeAt(i);h1=h2^Math.imul(h1^k,597399067);h2=h3^Math.imul(h2^k,2869860233);h3=h4^Math.imul(h3^k,951274213);h4=h1^Math.imul(h4^k,2716044179);}h1=Math.imul(h3^(h1>>>18),597399067);h2=Math.imul(h4^(h2>>>22),2869860233);h3=Math.imul(h1^(h3>>>17),951274213);h4=Math.imul(h2^(h4>>>19),2716044179);return[(h1^h2^h3^h4)>>>0,h1>>>0,h2>>>0,h3>>>0];}
function seededRandom(seed){const h=cyrb128(String(seed));return mulberry32(h[0]);}
function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

// -------- Noise --------
function ValueNoise(seed){
  const rand=seededRandom(seed+"_vn");
  const perm=new Uint8Array(512);
  for(let i=0;i<256;i++) perm[i]=i;
  for(let i=255;i>0;i--){const j=Math.floor(rand()*(i+1));const t=perm[i];perm[i]=perm[j];perm[j]=t;}
  for(let i=0;i<256;i++) perm[i+256]=perm[i];
  function fade(t){return t*t*t*(t*(t*6-15)+10);}
  function grad2(hash,x,y){switch(hash&3){case 0:return x+y;case 1:return x-y;case 2:return -x+y;default:return -x-y;}}
  this.noise=function(x,y){
    const X=Math.floor(x)&255, Y=Math.floor(y)&255;
    const xf=x-Math.floor(x), yf=y-Math.floor(y);
    const tl=perm[X+perm[Y]], tr=perm[X+1+perm[Y]], bl=perm[X+perm[Y+1]], br=perm[X+1+perm[Y+1]];
    const u=fade(xf), v=fade(yf);
    const n00=grad2(tl,xf,yf), n10=grad2(tr,xf-1,yf), n01=grad2(bl,xf,yf-1), n11=grad2(br,xf-1,yf-1);
    return lerp(lerp(n00,n10,u), lerp(n01,n11,u), v)*0.7071;
  }
}

// -------- Palette --------
function paletteFromSeed(seed){
  const rnd = seededRandom(seed+"_pal");
  const h = Math.floor(rnd()*360);
  const mode = rnd();
  const sat = 40 + rnd()*45;
  const light = 25 + rnd()*55;
  function hsl(hh,ss,ll,a=1){ return `hsla(${(hh%360+360)%360}, ${ss}%, ${ll}%, ${a})`; }
  if (mode < 0.33){
    return [hsl(h,sat,light), hsl(h+35,sat-10, clamp(light+10,0,100)), hsl(h-30,sat-15, clamp(light-10,0,100)), hsl(h+180,sat-20, clamp(light+5,0,100))];
  } else if (mode < 0.66){
    return [hsl(h,sat-5, light+10), hsl(h+15,sat, light-5), hsl(h-15,sat-10, light+20), hsl(h+195,sat-25, clamp(light-15,0,100))];
  } else {
    return [hsl(h,sat,light), hsl(h+120,sat-15, clamp(light+15,0,100)), hsl(h-120,sat-10, clamp(light-10,0,100)), hsl(h+60,sat-20, clamp(light+5,0,100))];
  }
}

// -------- Engines (no text/emojis/symbols) --------
const engines = {
  "velvet-fields": function(ctx, seed, W, H){
    const rnd = seededRandom(seed+"_vf");
    const vn  = new ValueNoise(seed+"_vf_noise");
    const pal = paletteFromSeed(seed);
    const cx = W*0.5 + (rnd()-0.5)*W*0.2;
    const cy = H*0.5 + (rnd()-0.5)*H*0.2;
    const R  = Math.hypot(W,H)*0.55;

    const base = ctx.createLinearGradient(0,0,W,H);
    base.addColorStop(0, pal[0]);
    base.addColorStop(1, pal[1]);
    ctx.fillStyle = base;
    ctx.fillRect(0,0,W,H);

    const layers = 8 + Math.floor(rnd()*6);
    for (let i=0;i<layers;i++){
      const gx = cx + (rnd()-0.5)*W*0.7;
      const gy = cy + (rnd()-0.5)*H*0.7;
      const g  = ctx.createRadialGradient(gx, gy, 0, gx, gy, R*(0.35 + 0.85*rnd()));
      const cA = pal[Math.floor(rnd()*pal.length)];
      const cB = pal[Math.floor(rnd()*pal.length)];
      g.addColorStop(0, cA);
      g.addColorStop(1, cB);

      ctx.globalAlpha = 0.18 + rnd()*0.2;
      ctx.globalCompositeOperation = (rnd()<0.5) ? "lighter" : "soft-light";
      // some Safari builds may not support soft-light in offscreen contexts
      if (!supportsComposite(ctx.globalCompositeOperation)) ctx.globalCompositeOperation = "lighter";

      ctx.fillStyle = g;
      ctx.beginPath();
      const x = cx + (rnd()-0.5)*W;
      const y = cy + (rnd()-0.5)*H;
      const r = R*(0.2 + rnd()*0.6);
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fill();

      // organic veil
      const steps = 220;
      ctx.globalAlpha = 0.05 + rnd()*0.1;
      ctx.globalCompositeOperation = "overlay";
      if (!supportsComposite("overlay")) ctx.globalCompositeOperation = "source-over";
      ctx.beginPath();
      let px = x, py = y;
      for (let s=0;s<steps;s++){
        const n = vn.noise(px*0.002, py*0.002);
        const ang = n * Math.PI*2;
        px += Math.cos(ang)*3;
        py += Math.sin(ang)*3;
        if (s===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.strokeStyle = pal[2];
      ctx.lineWidth = 1.2 + rnd()*2.2;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  },

  "silk-strokes": function(ctx, seed, W, H){
    const rnd = seededRandom(seed+"_ss");
    const vn  = new ValueNoise(seed+"_ss_noise");
    const pal = paletteFromSeed(seed);

    ctx.fillStyle = pal[3];
    ctx.fillRect(0,0,W,H);

    const strokes = 1900;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    for (let i=0;i<strokes;i++){
      const x0 = rnd()*W, y0 = rnd()*H;
      let x = x0, y = y0;
      const len = 40 + rnd()*160;
      const width = 0.7 + rnd()*2.8;
      ctx.beginPath();
      ctx.moveTo(x,y);
      for (let k=0;k<len;k++){
        const a = vn.noise(x*0.0025, y*0.0025) * Math.PI*2;
        x += Math.cos(a) * (1.6 + rnd()*2.8);
        y += Math.sin(a) * (1.6 + rnd()*2.8);
        ctx.lineTo(x,y);
      }
      ctx.globalAlpha = 0.06 + rnd()*0.18;
      ctx.strokeStyle = pal[Math.floor(rnd()*pal.length)];
      ctx.lineWidth = width;
      ctx.stroke();
    }

    // gentle glaze
    ctx.globalAlpha = 0.12;
    ctx.globalCompositeOperation = "soft-light";
    if (!supportsComposite("soft-light")) ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = pal[1];
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  },

  "aura-wash": function(ctx, seed, W, H){
    const rnd = seededRandom(seed+"_aw");
    const pal = paletteFromSeed(seed);

    const g = ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0, pal[0]);
    g.addColorStop(1, pal[2]);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    const forms = 6 + Math.floor(rnd()*6);
    for (let i=0;i<forms;i++){
      const cx = rnd()*W, cy = rnd()*H;
      const rx = (0.18 + rnd()*0.48) * W;
      const ry = (0.18 + rnd()*0.48) * H;
      const rot = rnd()*Math.PI;
      ctx.save();
      ctx.translate(cx,cy); ctx.rotate(rot);
      const grad = ctx.createRadialGradient(0,0,0, 0,0, Math.max(rx,ry));
      const ca = pal[Math.floor(rnd()*pal.length)];
      const cb = pal[Math.floor(rnd()*pal.length)];
      grad.addColorStop(0, ca);
      grad.addColorStop(1, cb.replace(/, 1\)$/, ", 0)"));
      ctx.globalAlpha = 0.20 + rnd()*0.28;
      ctx.fillStyle = grad;
      ctx.beginPath();
      for (let a=0;a<Math.PI*2;a+=Math.PI/64){
        const nx = Math.cos(a)*rx, ny = Math.sin(a)*ry;
        if (a===0) ctx.moveTo(nx,ny); else ctx.lineTo(nx,ny);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }
};

function supportsComposite(mode){
  const c = document.createElement('canvas').getContext('2d');
  try { c.globalCompositeOperation = mode; return c.globalCompositeOperation === mode; }
  catch(e){ return false; }
}

// -------- Canvas --------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { willReadFrequently:false });
let DPR = Math.max(1, Math.min(window.devicePixelRatio||1, 2));
function resize(){
  const W = Math.floor(window.innerWidth * DPR);
  const H = Math.floor(window.innerHeight * DPR);
  canvas.width = W; canvas.height = H;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
}
window.addEventListener('resize', ()=>{ resize(); drawCurrent(); }, {passive:true});

// -------- Render --------
const engineKeys = Object.keys(engines);
let currentSeed = "AR3-" + Math.random().toString(36).slice(2,8);
let currentEngineKey = engineKeys[0];

function pickEngine(seed){
  const r = seededRandom(seed+"_engine")();
  const idx = Math.floor(r * engineKeys.length) % engineKeys.length;
  return engineKeys[idx];
}

function render(seed){
  const err = document.getElementById('err');
  err.style.display = "none"; err.textContent = "";
  try{
    if (!seed) seed = currentSeed;
    currentSeed = seed;
    currentEngineKey = pickEngine(seed);
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "#000"; ctx.fillRect(0,0,W,H);
    engines[currentEngineKey](ctx, seed, W, H);
  }catch(e){
    err.textContent = "Render error: " + (e && e.message ? e.message : String(e));
    err.style.display = "block";
    console.error(e);
  }finally{
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }
}

function drawCurrent(){ render(currentSeed); }

// -------- Export --------
async function exportPNG(){
  try{
    const scale = 3;
    const W = Math.floor(window.innerWidth * scale);
    const H = Math.floor(window.innerHeight * scale);
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const octx = off.getContext('2d');
    octx.fillStyle = "#000"; octx.fillRect(0,0,W,H);
    engines[currentEngineKey](octx, currentSeed, W, H);
    const blob = await new Promise(res=> off.toBlob(res, "image/png", 0.98));

    const fileName = (currentSeed||"art") + "_ARTSY-V3.png";
    if (navigator.canShare && blob){
      const file = new File([blob], fileName, {type:"image/png"});
      try { await navigator.share({files:[file], title:fileName, text:"Artsy v3"}); announce("Shared image."); return; }
      catch(_) { /* fallthrough */ }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    URL.revokeObjectURL(a.href);
    a.remove();
    announce("Saved image.");
  }catch(e){
    announce("Save failed.");
    console.error(e);
  }
}

// -------- UI wiring --------
const seedInput = document.getElementById('seedInput');
const genBtn = document.getElementById('genBtn');
const saveBtn = document.getElementById('saveBtn');
const live = document.getElementById('live');
function announce(msg){ live.textContent = msg; }
function setSeedAndRender(v){ if (!v || !v.trim()) return; currentSeed = v.trim(); render(currentSeed); announce("Generated."); }

genBtn.addEventListener('click', ()=> setSeedAndRender(seedInput.value || currentSeed));
saveBtn.addEventListener('click', exportPNG);
seedInput.addEventListener('keydown', (e)=>{ if (e.key === 'Enter'){ e.preventDefault(); setSeedAndRender(seedInput.value || currentSeed); }});

// -------- Init --------
resize();
seedInput.value = currentSeed;
render(currentSeed);
</script>
</body>
</html>
