<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Art Toy — Pixel Cube (Gray + Shaded)</title>
<style>
  html,body{margin:0;height:100%;background:#2a2a2a;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>
<script>
(function(){
  var cnv = document.getElementById('c');
  var ctx = cnv.getContext('2d', {alpha:false, desynchronized:true});
  ctx.imageSmoothingEnabled = false;
  var dpr = Math.min(2, window.devicePixelRatio||1);
  function fit(){
    dpr = Math.min(2, window.devicePixelRatio||1);
    var w = Math.floor(innerWidth*dpr), h = Math.floor(innerHeight*dpr);
    if (cnv.width!==w || cnv.height!==h){ cnv.width=w; cnv.height=h; }
  }
  addEventListener('resize', fit, {passive:true}); fit();

  // RNG (mulberry32)
  function mulberry32(a){ return function(){ var t=a+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
  var seed=(Math.random()*1e9)|0; var rng=mulberry32(seed);
  var R = { rnd:function(){return rng();}, range:function(a,b){return a+(b-a)*rng();}, choice:function(arr){return arr[(rng()*arr.length)|0];} };

  // 3D helpers
  function rotX(p,a){ var s=Math.sin(a), c=Math.cos(a); return [p[0], c*p[1]-s*p[2], s*p[1]+c*p[2]]; }
  function rotY(p,a){ var s=Math.sin(a), c=Math.cos(a); return [c*p[0]+s*p[2], p[1], -s*p[0]+c*p[2]]; }
  function rotZ(p,a){ var s=Math.sin(a), c=Math.cos(a); return [c*p[0]-s*p[1], s*p[0]+c*p[1], p[2]]; }
  function normalize(v){ var m=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/m, v[1]/m, v[2]/m]; }
  function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }

  // build cube voxel faces
  var GRID = 18; // resolution (faces only for perf)
  var HALF = 1;
  var voxels = []; // {x,y,z,s,nx,ny,nz,alive}
  function buildCube(){
    voxels = [];
    var step=(2*HALF)/GRID;
    var s=step*0.9; // voxel world size
    for(var i=0;i<=GRID;i++){
      for(var j=0;j<=GRID;j++){
        var u = -HALF + i*step;
        var v = -HALF + j*step;
        voxels.push({x:u,y:v,z: HALF,s:s,nx:0,ny:0,nz:1,alive:true});
        voxels.push({x:u,y:v,z:-HALF,s:s,nx:0,ny:0,nz:-1,alive:true});
        voxels.push({x:u,y: HALF,z:v,s:s,nx:0,ny:1,nz:0,alive:true});
        voxels.push({x:u,y:-HALF,z:v,s:s,nx:0,ny:-1,nz:0,alive:true});
        voxels.push({x: HALF,y:u,z:v,s:s,nx:1,ny:0,nz:0,alive:true});
        voxels.push({x:-HALF,y:u,z:v,s:s,nx:-1,ny:0,nz:0,alive:true});
      }
    }
  }
  buildCube();

  // particles that fly off
  var parts = []; // {x,y,z,vx,vy,vz,size,age,max,shade}
  function spawnFromVoxel(v, n){
    for(var k=0;k<n;k++){
      var jitter=0.12;
      var x=v.x + R.range(-jitter,jitter);
      var y=v.y + R.range(-jitter,jitter);
      var z=v.z + R.range(-jitter,jitter);
      var out = normalize([x,y,z]);
      var speed = R.range(0.012, 0.03);
      var vx = out[0]*speed + R.range(-0.008,0.008);
      var vy = out[1]*speed + R.range(-0.008,0.008);
      var vz = out[2]*speed + R.range(-0.008,0.008);
      parts.push({x:x,y:y,z:z,vx:vx,vy:vy,vz:vz,size:R.range(0.07,0.12),age:0,max:R.range(8,16),shade:R.rnd()<0.25?0.7:0});
    }
  }

  // camera & projection
  var cam = {dist:3.6, fov:1.2}; // larger dist for bigger cube
  function project(p3){
    var x=p3[0], y=p3[1], z=p3[2];
    var d=(z + cam.dist);
    var k=cam.fov / d;
    var sx = cnv.width*0.5 + x*k*cnv.height*0.48;
    var sy = cnv.height*0.5 - y*k*cnv.height*0.48;
    var scale=Math.max(0.0001, k);
    return [sx, sy, scale];
  }

  // rotation/inertia (heavy feel)
  var ang=[R.range(0,Math.PI*2), R.range(0,Math.PI*2), R.range(0,Math.PI*2)];
  var av=[0,0,0];
  var damping = 0.995; // 20–30s
  var startTime = performance.now();
  var totalDisintegrate = 5 * 60 * 1000;
  var liveCount = voxels.length;

  // lighting
  var light = normalize([0.7, 0.9, 0.5]);

  // input
  var dragging=false, lastX=0,lastY=0,lastT=performance.now();
  function setPtr(e){ var t=(e.touches&&e.touches[0])||e; lastX=t.clientX; lastY=t.clientY; }
  function fling(e){
    var t=(e.touches&&e.touches[0])||e;
    var now=performance.now();
    var dt=Math.max(8, now-lastT);
    var dx=(t.clientX-lastX), dy=(t.clientY-lastY);
    lastX=t.clientX; lastY=t.clientY; lastT=now;
    var gain=0.0022;
    av[1] += -dx*gain;
    av[0] +=  dy*gain;
    av[2] += (dx-dy)*gain*0.25;
    if (Math.hypot(dx,dy) > 8){ peel(Math.min(30, 5 + (Math.hypot(dx,dy)/7|0))); }
  }
  cnv.addEventListener('pointerdown', function(e){ dragging=true; setPtr(e); });
  cnv.addEventListener('pointermove', function(e){ if(dragging) fling(e); });
  addEventListener('pointerup', function(){ dragging=false; });
  cnv.addEventListener('touchstart', function(e){ dragging=true; setPtr(e); }, {passive:true});
  cnv.addEventListener('touchmove', function(e){ if(dragging) fling(e); }, {passive:true});
  addEventListener('touchend', function(){ dragging=false; }, {passive:true});

  // peeling / schedule
  function disintegrateProgress(now){ return Math.min(1, (now - startTime)/totalDisintegrate); }
  function peel(n){
    for (var r=0;r<n;r++){
      // random index seek for a live voxel
      var tries=0, idx;
      do { idx = (R.rnd()*voxels.length)|0; tries++; if(tries>1000) return; } while(!voxels[idx].alive);
      var v = voxels[idx]; v.alive=false; liveCount--;
      spawnFromVoxel(v, 1 + (R.rnd()*2|0));
    }
  }
  function scheduledPeel(progress){
    var targetDead = Math.floor(voxels.length * progress);
    var currentDead = voxels.length - liveCount;
    var toRemove = targetDead - currentDead;
    if (toRemove>0) peel(Math.min(60, toRemove));
  }

  // draw voxel as square with lambert shading
  function drawVoxel(p3, n3, size){
    var pr = project(p3);
    var s = Math.max(1, size * pr[2] * cnv.height * 0.55);
    var l = Math.max(0.1, dot(n3, light)); // 0..1
    var shade = Math.floor(30 + l*180)|0; // gray ramp
    ctx.fillStyle = "rgb("+shade+","+shade+","+shade+")";
    ctx.fillRect(pr[0]-s/2, pr[1]-s/2, s, s);
  }

  function loop(now){
    fit();
    var w=cnv.width, h=cnv.height;
    // gray background
    ctx.fillStyle="#2a2a2a"; ctx.fillRect(0,0,w,h);

    // rotation with heavy damping
    ang[0]+=av[0]; ang[1]+=av[1]; ang[2]+=av[2];
    av[0]*=damping; av[1]*=damping; av[2]*=damping;

    // disintegration schedule
    var prog = disintegrateProgress(now);
    scheduledPeel(prog);

    // baseline slow spin (so it never stalls)
    var ax = ang[0] + 0.0006*now/16;
    var ay = ang[1] + 0.0007*now/16;
    var az = ang[2] + 0.0005*now/16;

    // draw particles (behind)
    for (var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.age += 0.016;
      p.vz += 0.00005; // gentle drift away
      p.vx *= 0.998; p.vy *= 0.998; p.vz *= 0.998;
      p.x += p.vx; p.y += p.vy; p.z += p.vz;
      if (p.age>p.max){ parts.splice(i,1); continue; }
      var pr = project([p.x, p.y, p.z]);
      var s = Math.max(1, p.size * pr[2] * h * 0.55);
      var sh = p.shade ? 200 : 0;
      ctx.fillStyle = sh ? "rgb("+sh+","+sh+","+sh+")" : "#000";
      ctx.fillRect(pr[0]-s/2, pr[1]-s/2, s, s);
    }

    // transform & draw live voxels sorted by depth
    var toDraw = [];
    for (var j=0;j<voxels.length;j++){
      var v = voxels[j]; if(!v.alive) continue;
      var p=[v.x,v.y,v.z];
      p = rotX(p,ax); p = rotY(p,ay); p = rotZ(p,az);
      var n=[v.nx,v.ny,v.nz];
      n = rotX(n,ax); n = rotY(n,ay); n = rotZ(n,az);
      toDraw.push({p:p,n:n,s:v.s});
    }
    toDraw.sort(function(a,b){ return a.p[2]-b.p[2]; });
    for (var k=0;k<toDraw.length;k++){
      var it=toDraw[k];
      drawVoxel(it.p, normalize(it.n), it.s);
    }

    // occasional natural shedding when spinning
    if ((Math.abs(av[0])+Math.abs(av[1])+Math.abs(av[2])) > 0.01 && R.rnd()<0.12){
      peel(1 + (R.rnd()*2|0));
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
