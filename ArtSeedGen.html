<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>ART — Seed</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; background:#000; color:#fff; overflow:hidden; }
  canvas { position:fixed; inset:0; display:block; width:100%; height:100%; }

  /* Seed splash */
  #splash {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #000; z-index: 10;
  }
  #seedWrap {
    display: flex; align-items: center; gap: 12px;
    width: min(92vw, 860px);
  }
  #seedInput {
    flex: 1 1 auto;
    background: #000;
    color: #fff;
    border: 3px solid #fff;
    border-radius: 16px;
    padding: 18px 20px;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    font-size: clamp(28px, 7vw, 96px);
    line-height: 1.1;
    outline: none;
  }
  #seedInput::placeholder { color: #fff; opacity: .5; }

  #goBtn {
    width: clamp(60px, 14vw, 120px);
    height: clamp(60px, 14vw, 120px);
    border-radius: 50%;
    border: 3px solid #fff;
    background: #000;
    display: grid; place-items: center;
    cursor: pointer;
    transition: transform .08s ease;
  }
  #goBtn:active { transform: scale(0.98); }

  /* SVG arrow inside go button */
  #goBtn svg { width: 48%; height: 48%; fill: #fff; }

  /* HUD icons (no text) */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 10px; pointer-events: none; z-index: 9;
  }
  .iconBtn {
    pointer-events: auto;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    background: rgba(0,0,0,.25);
    border: 2px solid #fff;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .08s ease;
  }
  .iconBtn:active { transform: scale(0.97); }
  .iconBtn svg { width: 62%; height: 62%; stroke: #fff; fill: none; stroke-width: 2.5; }

  /* Hide HUD initially */
  #hud { display: none; }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>

<!-- Top HUD: back (left), download (right) -->
<div id="hud">
  <div id="backBtn" class="iconBtn" aria-label="Back">
    <!-- left arrow -->
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M14 6 L8 12 L14 18"></path>
      <path d="M8 12 H20"></path>
    </svg>
  </div>
  <div id="dlBtn" class="iconBtn" aria-label="Download">
    <!-- download arrow -->
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 5 V15"></path>
      <path d="M8 11 L12 15 L16 11"></path>
      <path d="M5 19 H19"></path>
    </svg>
  </div>
</div>

<!-- Splash seed input -->
<div id="splash">
  <div id="seedWrap">
    <input id="seedInput" type="text" placeholder="seed" spellcheck="false" autocapitalize="none" autocomplete="off" />
    <button id="goBtn" aria-label="Go">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 5 L19 12 L8 19 Z"></path>
      </svg>
    </button>
  </div>
</div>

<script>
(()=>{
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha:false });

  let W=0, H=0;
  function resize(){
    const b = canvas.getBoundingClientRect();
    W = Math.floor(b.width * dpr);
    H = Math.floor(b.height * dpr);
    canvas.width = W; canvas.height = H;
  }
  resize(); addEventListener('resize', ()=>{ resize(); if(!onSplash) renderCurrent(); });

  // UI elements
  const splash = document.getElementById('splash');
  const seedInput = document.getElementById('seedInput');
  const goBtn = document.getElementById('goBtn');
  const hud = document.getElementById('hud');
  const backBtn = document.getElementById('backBtn');
  const dlBtn = document.getElementById('dlBtn');

  // Deterministic RNG
  function xfnv1a(str){ let h=2166136261>>>0; for(let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 16777619); } return ()=> (h>>>0); }
  function mulberry32(seed){ return function(){ let t = seed += 0x6D2B79F5; t = Math.imul(t ^ (t>>>15), t | 1); t ^= t + Math.imul(t ^ (t>>>7), t | 61); return ((t ^ (t>>>14))>>>0) / 4294967296; } }
  function rngFrom(str){ return mulberry32(xfnv1a(str)()); }
  function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function hsla(h,s,l,a=1){ return `hsla(${(h%360+360)%360},${clamp(s,0,100)}%,${clamp(l,0,100)}%,${clamp(a,0,1)})`; }

  // Genres (from previous build), no labels shown in UI
  const genres = [
    { key:'op', render: renderOpArt },
    { key:'destijl', render: renderDeStijl },
    { key:'bauhaus', render: renderBauhaus },
    { key:'suprematism', render: renderSuprematism },
    { key:'artdeco', render: renderArtDeco },
    { key:'pointillism', render: renderPointillism },
    { key:'pop', render: renderPopHalftone },
    { key:'outrun', render: renderOutrun }
  ];

  // State
  let currentSeed = 'seed';
  let currentGenreKey = 'op';
  let onSplash = true;

  function generateFromSeed(seed){
    currentSeed = (seed && seed.trim().length) ? seed.trim() : 'seed';
    const rng = rngFrom(currentSeed);
    const g = genres[Math.floor(rng()*genres.length)]; // seed determines genre pick too
    currentGenreKey = g.key;
    g.render(rng);
  }

  function renderCurrent(){
    const rng = rngFrom(currentSeed);
    const g = genres.find(x=>x.key===currentGenreKey) || genres[0];
    g.render(rng);
  }

  // Actions
  function startFromSeed(){
    generateFromSeed(seedInput.value);
    splash.style.display = 'none';
    hud.style.display = 'flex';
    onSplash = false;
  }

  // Event wiring
  goBtn.addEventListener('click', startFromSeed);
  seedInput.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') startFromSeed(); });

  backBtn.addEventListener('click', ()=>{
    splash.style.display = 'grid';
    hud.style.display = 'none';
    onSplash = true;
    seedInput.focus();
    seedInput.select();
  });

  dlBtn.addEventListener('click', ()=>{
    const a = document.createElement('a');
    a.download = `art-${currentGenreKey}-${currentSeed}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  });

  // ----- Renderers (same as previous app, compressed & tuned for contrast/perf) -----

  function renderOpArt(rng){
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
    const layers = 4 + Math.floor(rng()*3);
    for (let L=0; L<layers; L++){
      const ang = rng()*Math.PI*2;
      const dx = Math.cos(ang), dy = Math.sin(ang);
      const spacing = (8 + rng()*6) * dpr;
      const span = Math.hypot(W,H);
      const count = Math.ceil(span/spacing) + 2;
      ctx.lineWidth = Math.max(1.25, 1.25*dpr);
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rng()<0.5 ? '#ffffff22' : hsla(rng()*360, 90, 60, 0.2);
      for (let i=-count;i<count;i++){
        const ax = W/2 + (-span + i*spacing) * (-dy);
        const ay = H/2 + (-span + i*spacing) * ( dx);
        ctx.beginPath();
        for (let t=-span; t<=span; t+= 7*dpr){
          let x = ax + t*dx, y = ay + t*dy;
          const r1 = Math.hypot(x - W*0.35, y - H*0.42);
          const r2 = Math.hypot(x - W*0.68, y - H*0.58);
          const bend = Math.sin(r1*0.015) * 6 + Math.cos(r2*0.013) * 6;
          x += -dy * bend; y += dx * bend;
          if (t===-span) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function renderDeStijl(rng){
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
    ctx.lineWidth = Math.max(10, 10*dpr);
    ctx.strokeStyle = '#000';
    function splitRect(x,y,w,h,depth){
      if (depth<=0 || (w< W*0.12 && h< H*0.12)) { paintRect(x,y,w,h); return; }
      if (w>h){
        const cut = x + w*(0.3 + rng()*0.4);
        splitRect(x,y,cut-x,h,depth-1);
        splitRect(cut,y,x+w-cut,h,depth-1);
        drawLine(cut,y,cut,y+h);
      } else {
        const cut = y + h*(0.3 + rng()*0.4);
        splitRect(x,y,w,cut-y,depth-1);
        splitRect(x,cut,w,y+h-cut,depth-1);
        drawLine(x,cut,x+w,cut);
      }
    }
    function drawLine(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
    function paintRect(x,y,w,h){
      const fillChance = (w*h)/(W*H) < 0.18 ? 0.7 : 0.35;
      if (rng() < fillChance){
        const colors = ['#d81e2b', '#1b3de6', '#f1d100'];
        const c = rng()<0.15 ? '#000' : (rng()<0.82 ? colors[Math.floor(rng()*colors.length)] : '#fff');
        ctx.fillStyle = c;
        ctx.fillRect(x+ctx.lineWidth/2, y+ctx.lineWidth/2, w-ctx.lineWidth, h-ctx.lineWidth);
      }
    }
    splitRect(ctx.lineWidth/2, ctx.lineWidth/2, W-ctx.lineWidth, H-ctx.lineWidth, 4);
  }

  function renderBauhaus(rng){
    ctx.fillStyle = '#111'; ctx.fillRect(0,0,W,H);
    const palette = ['#e63946', '#457b9d', '#f1fa8c', '#ff9f1c', '#ffffff'];
    const n = 14 + Math.floor(rng()*8);
    for (let i=0;i<n;i++){
      const x = rng()*W, y = rng()*H;
      const s = (Math.pow(rng(),2)) * Math.min(W,H)*0.4 + 20*dpr;
      const rot = rng()*Math.PI*2;
      const col = palette[Math.floor(rng()*palette.length)];
      ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
      ctx.globalAlpha = 0.9; ctx.fillStyle = col;
      const type = rng();
      if (type < 0.33){ ctx.fillRect(-s*0.5,-s*0.5,s,s);
      } else if (type < 0.66){ ctx.beginPath(); ctx.arc(0,0,s*0.55,0,Math.PI*2); ctx.fill();
      } else { ctx.beginPath(); ctx.moveTo(-s*0.5, s*0.5); ctx.lineTo( s*0.5, s*0.5); ctx.lineTo( 0, -s*0.5); ctx.closePath(); ctx.fill(); }
      ctx.restore();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = Math.max(1, 1*dpr);
    for (let i=0;i<7;i++){ ctx.beginPath(); ctx.moveTo(rng()*W, rng()*H); ctx.lineTo(rng()*W, rng()*H); ctx.stroke(); }
  }

  function renderSuprematism(rng){
    ctx.fillStyle = '#f8f8f8'; ctx.fillRect(0,0,W,H);
    const shapes = 3 + Math.floor(rng()*3);
    for (let i=0;i<shapes;i++){
      const x = W*(0.2 + rng()*0.6), y = H*(0.2 + rng()*0.6);
      const w = (0.15 + rng()*0.5) * Math.min(W,H);
      const h = (0.03 + rng()*0.18) * Math.min(W,H);
      const rot = (rng()*Math.PI*0.7) - Math.PI*0.35;
      const col = rng()<0.3 ? '#000' : hsla(rng()*360, 80, 45);
      ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.fillStyle = col; ctx.fillRect(-w/2,-h/2,w,h); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(W*(0.2 + rng()*0.6), H*(0.2 + rng()*0.6), Math.min(W,H)*(0.05 + rng()*0.07), 0, Math.PI*2);
    ctx.fillStyle = hsla(rng()*360, 80, 40); ctx.fill();
  }

  function renderArtDeco(rng){
    ctx.fillStyle = '#0b0b0b'; ctx.fillRect(0,0,W,H);
    const cols = Math.ceil(Math.sqrt(W)/2) + 12, rows = Math.ceil(Math.sqrt(H)/2) + 12;
    const cellW = W/cols, cellH = H/rows;
    for (let y=0; y<rows; y++){
      for (let x=0; x<cols; x++){
        const cx = (x+0.5)*cellW, cy = (y+0.5)*cellH;
        const r = Math.min(cellW,cellH)*0.46;
        const rays = 10 + Math.floor(rng()*10);
        const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
        g.addColorStop(0, '#fff2b3'); g.addColorStop(0.4, '#ffd76a'); g.addColorStop(1, '#8e6b34');
        for (let i=0;i<rays;i++){ const a0=(i/rays)*Math.PI, a1=((i+0.5)/rays)*Math.PI;
          ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath(); ctx.fillStyle=g; ctx.fill(); }
        ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1*dpr;
        ctx.beginPath(); ctx.moveTo(cx-r, cy); ctx.lineTo(cx, cy-r); ctx.lineTo(cx+r, cy); ctx.stroke();
      }
    }
  }

  function renderPointillism(rng){
    ctx.fillStyle = '#101018'; ctx.fillRect(0,0,W,H);
    const hues = [rng()*360, rng()*360, rng()*360];
    const dots = Math.floor(6000 * (W*H/(1080*1920)));
    for (let i=0;i<dots;i++){
      const x = rng()*W, y = rng()*H;
      const r = Math.pow(rng(),2) * 6*dpr + 0.3*dpr;
      const h = hues[Math.floor(rng()*hues.length)];
      const s = 65 + rng()*25;
      const l = 50 + Math.sin(i)*8;
      ctx.fillStyle = hsla(h, s, l, 0.18 + rng()*0.6);
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    for (let i=0;i<400;i++){
      const x = rng()*W, y = rng()*H;
      const r = (1 + Math.pow(rng(),2)*16)*dpr;
      ctx.fillStyle = hsla(hues[Math.floor(rng()*hues.length)] + rng()*10, 80, 60, 0.35);
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
  }

  function renderPopHalftone(rng){
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
    const bands = 6 + Math.floor(rng()*5);
    for (let b=0;b<bands;b++){
      const y0 = (b/bands)*H, y1 = ((b+1)/bands)*H;
      const base = ['#ff1e2d','#1a5cff','#ffe400','#000'][Math.floor(rng()*4)];
      const step = 10*dpr;
      for (let y=y0; y<y1; y+= step){
        for (let x=0; x<W; x+= step){
          const t = (x/W) + Math.sin((y/H)*Math.PI*2 + b)*0.25;
          const rad = clamp((t*t)*step*0.6, 0.5*dpr, step*0.55);
          ctx.fillStyle = base;
          ctx.beginPath(); ctx.arc(x+step*0.5, y+step*0.5, rad, 0, Math.PI*2); ctx.fill();
        }
      }
    }
    ctx.strokeStyle = '#000'; ctx.lineWidth = Math.max(4,4*dpr);
    ctx.beginPath(); ctx.moveTo(W*0.05, H*0.8); ctx.bezierCurveTo(W*0.3,H*0.6, W*0.6,H*0.95, W*0.95,H*0.15); ctx.stroke();
  }

  function renderOutrun(rng){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#301960'); g.addColorStop(0.5, '#8930ff'); g.addColorStop(1, '#ff3e90');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    const sx = W*0.5, sy = H*0.42, sr = Math.min(W,H)*0.18;
    for (let i=0;i<12;i++){
      const y = sy - sr + (i/12)*sr*2;
      const bandH = sr*2/12 * 0.6;
      ctx.fillStyle = hsla(40 + i*2, 100, 60, 0.9);
      const half = Math.sqrt(Math.max(0, sr*sr - (y-sy)*(y-sy)));
      ctx.fillRect(sx - half, y, 2*half, bandH);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = Math.max(1,1*dpr);
    const rows = 28, cols = 18;
    for (let r=0;r<rows;r++){ const t = r/(rows-1); const y = H*0.55 + t*(H*0.5); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    for (let c=0;c<cols;c++){
      const t = (c/(cols-1) - 0.5); ctx.beginPath();
      ctx.moveTo(W*0.5 + t*W*0.06, H*0.55);
      ctx.lineTo(W*0.5 + t*W*(0.5 + Math.abs(t)*0.8), H);
      ctx.stroke();
    }
    if (rng()<0.7){
      ctx.fillStyle = '#05050a';
      for (let i=0;i<3;i++){
        const px = (0.2 + i*0.3 + rng()*0.05) * W; const py = H*0.55; const h = H*(0.25 + rng()*0.1);
        ctx.fillRect(px-3*dpr, py-h, 6*dpr, h);
        for (let k=0;k<10;k++){
          const a = -Math.PI/2 + (k-5)*0.2;
          ctx.beginPath(); ctx.moveTo(px, py-h); ctx.lineTo(px + Math.cos(a)*h*0.6, py-h + Math.sin(a)*h*0.6);
          ctx.strokeStyle = '#05050a'; ctx.lineWidth = Math.max(3,3*dpr); ctx.stroke();
        }
      }
    }
  }

})();</script>
</body>
</html>
