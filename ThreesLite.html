<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Threes-Lite (High Contrast)</title>
<style>
  :root{
    --bg:#000;
    --fg:#fff;
    --grid-size:4;
    --cell-size:min(20vw,120px);
    --radius:10px;
    --border:3px;
    --gap:8px; /* visual spacing outside border; cells themselves are pure black with white outline */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%; margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";}
  .wrap{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:16px;
    padding:12px;
  }
  .titlebar{
    width:100%;
    max-width: calc(var(--cell-size)*var(--grid-size) + var(--gap)*2 + var(--border)*2);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .btn{
    border:2px solid var(--fg);
    color:var(--fg);
    background:transparent;
    border-radius:12px;
    padding:10px 14px;
    font-size:16px;
  }
  .btn:active{transform:scale(0.98);}
  .score{
    font-variation-settings:'wght' 700;
    font-weight:700;
    font-size: clamp(18px, 4vw, 28px);
    letter-spacing: 0.5px;
  }
  .grid{
    position:relative;
    display:grid;
    grid-template-columns: repeat(var(--grid-size), var(--cell-size));
    grid-template-rows: repeat(var(--grid-size), var(--cell-size));
    gap: var(--gap);
    padding: var(--gap);
    border-radius: calc(var(--radius) + var(--gap));
    border: 2px solid var(--fg);
    user-select:none;
    touch-action: none; /* allow custom swipe */
  }
  .cell{
    width:var(--cell-size);
    height:var(--cell-size);
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000; /* pure black block */
    border: var(--border) solid var(--fg); /* white outline */
    border-radius: var(--radius);
    font-weight:800;
    color:var(--fg); /* white numbers */
    font-size: clamp(22px, 7vw, 44px);
    line-height:1;
  }
  .cell[data-v=""]{ /* empty */
    background:#000;
  }

  .footer{
    opacity:0.75;
    font-size:12px;
  }

  /* Focus ring for accessibility */
  .grid:focus-visible, .btn:focus-visible{outline:3px solid #fff; outline-offset:4px;}
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<div class="wrap">
  <div class="titlebar" aria-live="polite">
    <button class="btn" id="newGameBtn" title="New game">New</button>
    <div class="score" id="score" role="status" aria-live="polite">Score: 0</div>
    <button class="btn" id="undoBtn" title="Undo last move">Undo</button>
  </div>

  <div id="grid" class="grid" tabindex="0" role="application" aria-label="Threes-like board">
    <!-- 4x4 cells -->
  </div>

  <div class="footer">Swipe or use arrow keys / WASD</div>
</div>

<script>
(function(){
  const SIZE = 4;
  const START_TILES = 9; // generous start, like Threes vibe
  const gridEl = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const newBtn = document.getElementById('newGameBtn');
  const undoBtn = document.getElementById('undoBtn');

  // State
  let cells = []; // 2D array of numbers or 0
  let score = 0;
  let history = []; // stack of previous states for undo
  let rngSeed = Date.now() % 2147483647;

  function seedRand(){
    // simple LCG for deterministic new tile sequence per session
    rngSeed = (rngSeed * 48271) % 2147483647;
    return rngSeed / 2147483647;
  }
  function randomChoice(arr){ return arr[Math.floor(seedRand()*arr.length)] }

  function saveHistory(){
    history.push({cells: cells.map(r => r.slice()), score});
    if(history.length>40) history.shift();
  }

  function updateScore(val){
    score = val;
    scoreEl.textContent = "Score: " + score;
  }

  function emptyGrid(){
    cells = Array.from({length:SIZE}, ()=> Array(SIZE).fill(0));
  }

  function spawnInitial(){
    const pool = [1,2,3];
    let added = 0;
    while(added < START_TILES){
      const empties = getEmpty();
      if(!empties.length) break;
      const [r,c] = randomChoice(empties);
      cells[r][c] = randomChoice(pool);
      added++;
    }
  }

  function getEmpty(){
    const out=[];
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(cells[r][c]===0) out.push([r,c]);
    return out;
  }

  function draw(){
    gridEl.innerHTML = '';
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const d = document.createElement('div');
        d.className = 'cell';
        const v = cells[r][c];
        d.dataset.v = v?String(v):"";
        d.textContent = v?String(v):"";
        gridEl.appendChild(d);
      }
    }
  }

  function canMerge(a,b){
    if(a===0 || b===0) return false;
    if((a===1 && b===2) || (a===2 && b===1)) return true; // 1+2=3
    if(a>=3 && b>=3 && a===b) return true; // equal >=3
    return false;
  }
  function mergedValue(a,b){
    if((a===1 && b===2) || (a===2 && b===1)) return 3;
    if(a>=3 && b>=3 && a===b) return a+b;
    return null;
  }

  function slideLine(line){
    // line: array of length SIZE
    const filtered = line.filter(v=>v!==0);
    const out = [];
    let gained = 0;
    for(let i=0;i<filtered.length;i++){
      if(i<filtered.length-1 && canMerge(filtered[i], filtered[i+1])){
        const mv = mergedValue(filtered[i], filtered[i+1]);
        out.push(mv);
        gained += mv;
        i++; // skip next
      }else{
        out.push(filtered[i]);
      }
    }
    while(out.length<SIZE) out.push(0);
    return {line: out, gained};
  }

  function arraysEqual(a,b){
    if(a.length!==b.length) return false;
    for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return false;
    return true;
  }

  function move(dir){
    // dir: 'left','right','up','down'
    saveHistory();
    let moved = false;
    let gainedTotal = 0;
    if(dir==='left' || dir==='right'){
      for(let r=0;r<SIZE;r++){
        let row = cells[r].slice();
        if(dir==='right') row.reverse();
        const {line, gained} = slideLine(row);
        let newRow = (dir==='right')? line.slice().reverse() : line;
        if(!arraysEqual(newRow, cells[r])){
          moved = true;
          cells[r] = newRow;
          gainedTotal += gained;
        }
      }
    }else{ // up/down
      for(let c=0;c<SIZE;c++){
        let col = [];
        for(let r=0;r<SIZE;r++) col.push(cells[r][c]);
        if(dir==='down') col.reverse();
        const {line, gained} = slideLine(col);
        let newCol = (dir==='down')? line.slice().reverse() : line;
        for(let r=0;r<SIZE;r++){
          if(cells[r][c] !== newCol[r]) moved = true;
          cells[r][c] = newCol[r];
        }
        gainedTotal += gained;
      }
    }

    if(moved){
      updateScore(score + gainedTotal);
      spawnNewTile(dir);
      draw();
      if(isGameOver()){
        scoreEl.textContent = "Game Over – Score: " + score;
      }else{
        persist();
      }
    }else{
      // no change -> discard history push
      history.pop();
    }
  }

  function spawnNewTile(dir){
    const empties = getEmpty();
    if(!empties.length) return;
    // Threes adds new tile from entering edge; we approximate by biasing near the side opposite movement
    const candidates = empties.filter(([r,c])=>{
      if(dir==='left') return c===SIZE-1;
      if(dir==='right') return c===0;
      if(dir==='up') return r===SIZE-1;
      if(dir==='down') return r===0;
      return true;
    });
    const pool = [1,2,3,3]; // slightly favor 3s
    const spot = (candidates.length? randomChoice(candidates) : randomChoice(empties));
    const [r,c] = spot;
    cells[r][c] = randomChoice(pool);
  }

  function isGameOver(){
    if(getEmpty().length) return false;
    // any possible merge?
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const v = cells[r][c];
        if(r+1<SIZE && canMerge(v, cells[r+1][c])) return false;
        if(c+1<SIZE && canMerge(v, cells[r][c+1])) return false;
      }
    }
    return true;
  }

  function persist(){
    try{
      localStorage.setItem('threesLiteState', JSON.stringify({cells, score, rngSeed}));
    }catch(e){/* ignore */}
  }
  function restore(){
    try{
      const raw = localStorage.getItem('threesLiteState');
      if(!raw) return false;
      const st = JSON.parse(raw);
      if(!st || !st.cells) return false;
      cells = st.cells;
      score = st.score||0;
      rngSeed = st.rngSeed||rngSeed;
      updateScore(score);
      draw();
      return true;
    }catch(e){ return false; }
  }

  function newGame(){
    saveHistory(); // allow undo to go back
    emptyGrid();
    updateScore(0);
    spawnInitial();
    draw();
    persist();
  }

  function undo(){
    const prev = history.pop();
    if(!prev) return;
    cells = prev.cells.map(r=>r.slice());
    score = prev.score;
    updateScore(score);
    draw();
    persist();
  }

  // Controls
  function onKey(e){
    const k = e.key.toLowerCase();
    if(['arrowleft','a'].includes(k)){ e.preventDefault(); move('left'); }
    else if(['arrowright','d'].includes(k)){ e.preventDefault(); move('right'); }
    else if(['arrowup','w'].includes(k)){ e.preventDefault(); move('up'); }
    else if(['arrowdown','s'].includes(k)){ e.preventDefault(); move('down'); }
  }

  // touch / pointer swipe
  let startX=0, startY=0, tracking=false;
  function pointerDown(e){
    tracking = true;
    const p = e.touches? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
  }
  function pointerMove(e){
    // no-op; we only care about end
  }
  function pointerUp(e){
    if(!tracking) return;
    tracking=false;
    const p = e.changedTouches? e.changedTouches[0] : e;
    const dx = p.clientX - startX;
    const dy = p.clientY - startY;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    const thresh = 24; // px
    if(adx < thresh && ady < thresh) return;
    if(adx > ady){
      move(dx>0?'right':'left');
    }else{
      move(dy>0?'down':'up');
    }
  }

  // Hook up
  newBtn.addEventListener('click', newGame);
  undoBtn.addEventListener('click', undo);
  document.addEventListener('keydown', onKey, {passive:false});

  gridEl.addEventListener('pointerdown', pointerDown);
  gridEl.addEventListener('pointermove', pointerMove);
  gridEl.addEventListener('pointerup', pointerUp);
  gridEl.addEventListener('pointercancel', ()=>{tracking=false;});
  // iOS touch
  gridEl.addEventListener('touchstart', pointerDown, {passive:true});
  gridEl.addEventListener('touchmove', pointerMove, {passive:true});
  gridEl.addEventListener('touchend', pointerUp);
  gridEl.addEventListener('touchcancel', ()=>{tracking=false;});

  // Prepare grid cells for layout (static elements for fixed grid spacing)
  function buildGridSkeleton(){
    gridEl.innerHTML='';
    for(let i=0;i<SIZE*SIZE;i++){
      const cell = document.createElement('div');
      cell.className='cell';
      gridEl.appendChild(cell);
    }
  }

  // Init
  buildGridSkeleton();
  if(!restore()){
    newGame();
  }else{
    draw();
  }
  gridEl.focus();
})();
</script>
</body>
</html>
