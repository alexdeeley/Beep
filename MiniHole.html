<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Mini Hole</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --accent: #00e5ff;
    --good: #7CFC00;
    --warn: #ffdd00;
    --danger: #ff4060;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  #ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  #hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    gap: 8px;
    font-weight: 700;
    text-shadow: 0 0 6px rgba(0,0,0,.6);
    pointer-events: none;
  }
  #hud .pill {
    pointer-events: auto;
    border: 2px solid var(--fg);
    padding: 6px 10px;
    border-radius: 999px;
    font-size: clamp(12px, 2.3vw, 16px);
    background: rgba(255,255,255,.04);
  }
  #help {
    max-width: 720px;
    margin: 0 auto;
    padding: 8px 12px 14px;
    font-size: clamp(12px, 2.4vw, 16px);
    opacity: .9;
    text-align: center;
  }
  #help kbd {
    border: 1px solid var(--fg);
    border-bottom-width: 3px;
    border-radius: 6px;
    padding: 2px 6px;
    margin: 0 2px;
    font-weight: 800;
    display: inline-block;
    min-width: 1.2em;
  }
  #bigCenterMsg {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(28px, 8vw, 72px);
    letter-spacing: .02em;
    text-align: center;
    line-height: 1.1;
    font-weight: 900;
    text-shadow: 0 0 16px rgba(0,0,0,.7), 0 0 32px rgba(0,0,0,.5);
    pointer-events: none;
  }
  #controls {
    position: fixed;
    inset: auto 0 0 0;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 12px;
    padding: 12px;
    pointer-events: none;
  }
  #stick {
    pointer-events: auto;
    width: min(36vw, 180px);
    height: min(36vw, 180px);
    place-self: start start;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,.07), rgba(255,255,255,.03));
    border: 2px solid rgba(255,255,255,.35);
    position: relative;
    touch-action: none;
  }
  #nub {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 34%;
    height: 34%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(255,255,255,.12);
    border: 2px solid rgba(255,255,255,.6);
    box-shadow: 0 6px 18px rgba(0,0,0,.6) inset;
  }
  #buttons {
    pointer-events: auto;
    display: grid;
    grid-auto-flow: column;
    gap: 8px;
    justify-content: end;
    align-items: end;
  }
  button {
    pointer-events: auto;
    background: rgba(255,255,255,.06);
    color: var(--fg);
    border: 2px solid var(--fg);
    border-radius: 12px;
    font-weight: 800;
    font-size: clamp(12px, 2.6vw, 16px);
    padding: 10px 14px;
    min-width: 48px;
    min-height: 44px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  button:active { transform: translateY(1px); }
  canvas { display:block; width:100vw; height:100vh; }
  #sr { position:absolute; left:-10000px; top:auto; width:1px; height:1px; overflow:hidden; }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<div id="sr" aria-live="polite" aria-atomic="true"></div>
<canvas id="game" role="img" aria-label="Mini hole game canvas"></canvas>
<div id="ui">
  <div id="hud">
    <div class="pill" id="score">Size: 1.00×</div>
    <div class="pill" id="time">Time: 60</div>
    <div class="pill" id="fps">FPS</div>
  </div>
  <div id="help">
    <div><strong>Goal:</strong> Move the hole, swallow smaller objects, grow, and beat the clock.</div>
    <div><strong>Keyboard:</strong> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / Arrow keys to move, <kbd>R</kbd> restart, <kbd>P</kbd> pause.</div>
    <div><strong>Touch:</strong> Drag the joystick. Objects with a faint glow are edible.</div>
  </div>
  <div id="bigCenterMsg"></div>
  <div id="controls">
    <div id="stick" aria-label="Virtual joystick for movement">
      <div id="nub"></div>
    </div>
    <div id="buttons">
      <button id="btnPause" aria-pressed="false">Pause</button>
      <button id="btnRestart">Restart</button>
      <button id="btnMute" aria-pressed="false">Sound On</button>
    </div>
  </div>
</div>
<script>
(() => {
  // Canvas and sizing
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const uiScore = document.getElementById('score');
  const uiTime  = document.getElementById('time');
  const uiFps   = document.getElementById('fps');
  const bigMsg  = document.getElementById('bigCenterMsg');
  const sr      = document.getElementById('sr');

  function fit() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width  = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    scale = dpr;
  }
  let scale = 1;
  window.addEventListener('resize', fit, { passive: true });
  fit();

  // Audio (simple beeps)
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  let muted = false;
  function playBeep(freq = 400, dur = 0.06, type = 'sine', gainVal = 0.07) {
    if (muted) return;
    try {
      if (!audioCtx) audioCtx = new AudioCtx();
      const now = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, now);
      g.gain.setValueAtTime(gainVal, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(now);
      o.stop(now + dur);
    } catch {}
  }
  function haptic(ms = 12) {
    if (navigator.vibrate) navigator.vibrate(ms);
  }

  // World
  const world = {
    w: () => canvas.width,
    h: () => canvas.height,
    timeLeft: 60,
    running: true,
    level: 1,
  };

  // Player (hole)
  const player = {
    x: canvas.width/2,
    y: canvas.height/2,
    r: Math.min(canvas.width, canvas.height) * 0.03, // radius
    vx: 0, vy: 0,
    baseSpeed: 2.2,
    speed() { return this.baseSpeed + Math.max(0, 1.2 - this.r / 120) * 1.8; }, // larger = a bit slower
    grow(area) {
      const currentArea = Math.PI * this.r * this.r;
      const newArea = currentArea + area * 0.65; // not full area to keep balance
      this.r = Math.sqrt(newArea / Math.PI);
    }
  };

  // Objects
  const objs = [];
  function spawnObjects(n = 40) {
    objs.length = 0;
    for (let i=0;i<n;i++) {
      const size = randRange(8, 80);
      const edible = size < player.r * 0.95;
      const o = {
        x: randRange(30, world.w()-30),
        y: randRange(30, world.h()-30),
        r: size,
        color: edible ? 'rgba(124,252,0,0.9)' : 'rgba(255,255,255,0.85)',
        vx: randRange(-0.4, 0.4),
        vy: randRange(-0.4, 0.4),
        spin: randRange(-0.02, 0.02),
        a: Math.random()*Math.PI*2,
      };
      objs.push(o);
    }
  }
  spawnObjects(48);

  // Utility
  function randRange(a, b) { return a + Math.random()*(b-a); }
  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  // Controls: keyboard
  const keys = new Set();
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(k)) e.preventDefault();
    keys.add(k);
    // any key resumes audio
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }, { passive: false });
  window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

  // Controls: virtual joystick
  const stick = document.getElementById('stick');
  const nub   = document.getElementById('nub');
  let stickActive = false;
  let stickCx = 0, stickCy = 0, stickR = 0;
  function measureStick(){
    const r = stick.getBoundingClientRect();
    stickCx = r.left + r.width/2;
    stickCy = r.top  + r.height/2;
    stickR  = r.width/2;
  }
  new ResizeObserver(measureStick).observe(stick);
  measureStick();

  function handleStickMove(clientX, clientY){
    const dx = clientX - stickCx;
    const dy = clientY - stickCy;
    const dist = Math.hypot(dx, dy);
    const max = stickR * 0.9;
    const clamped = dist > max ? max : dist;
    const nx = dx / (max||1);
    const ny = dy / (max||1);
    nub.style.transform = `translate(${(nx*max)}px, ${(ny*max)}px)`;
    const mag = clamped / (max || 1);
    player.vx = nx * player.speed() * 2.0 * mag;
    player.vy = ny * player.speed() * 2.0 * mag;
  }

  stick.addEventListener('pointerdown', (e) => {
    stickActive = true;
    stick.setPointerCapture(e.pointerId);
    handleStickMove(e.clientX, e.clientY);
  });
  stick.addEventListener('pointermove', (e) => {
    if (!stickActive) return;
    handleStickMove(e.clientX, e.clientY);
  });
  stick.addEventListener('pointerup', (e) => {
    stickActive = false;
    nub.style.transform = 'translate(-50%, -50%)';
    player.vx = player.vy = 0;
  });
  stick.addEventListener('pointercancel', () => {
    stickActive = false;
    nub.style.transform = 'translate(-50%, -50%)';
    player.vx = player.vy = 0;
  });

  // Buttons
  const btnPause = document.getElementById('btnPause');
  const btnRestart = document.getElementById('btnRestart');
  const btnMute = document.getElementById('btnMute');

  btnPause.addEventListener('click', () => {
    world.running = !world.running;
    btnPause.textContent = world.running ? 'Pause' : 'Resume';
    btnPause.setAttribute('aria-pressed', (!world.running).toString());
    bigMsg.textContent = world.running ? '' : 'PAUSED';
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  });
  btnRestart.addEventListener('click', restart);
  btnMute.addEventListener('click', () => {
    muted = !muted;
    btnMute.textContent = muted ? 'Sound Off' : 'Sound On';
    btnMute.setAttribute('aria-pressed', muted.toString());
  });

  // Restart / Level
  function restart() {
    world.timeLeft = 60;
    world.level = 1;
    player.r = Math.min(canvas.width, canvas.height) * 0.03;
    player.x = canvas.width/2;
    player.y = canvas.height/2;
    player.vx = player.vy = 0;
    spawnObjects(48);
    bigMsg.textContent = '';
    world.running = true;
  }

  // Drawing helpers
  function drawHole(x, y, r) {
    // glow rim
    const g = ctx.createRadialGradient(x, y, r*0.95, x, y, r*1.4);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(0.85, 'rgba(0,0,0,1)');
    g.addColorStop(0.9, 'rgba(0,229,255,0.25)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r*1.4, 0, Math.PI*2);
    ctx.fill();

    // inner black hole
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();

    // checkerboard distortion ring for flair
    const tiles = 12;
    const outer = r * 1.15;
    const inner = r * 0.8;
    for (let i=0;i<tiles;i++) {
      const a0 = (i/tiles)*Math.PI*2;
      const a1 = ((i+1)/tiles)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a0)*inner, y + Math.sin(a0)*inner);
      ctx.lineTo(x + Math.cos(a0)*outer, y + Math.sin(a0)*outer);
      ctx.lineTo(x + Math.cos(a1)*outer, y + Math.sin(a1)*outer);
      ctx.lineTo(x + Math.cos(a1)*inner, y + Math.sin(a1)*inner);
      ctx.closePath();
      ctx.fillStyle = (i%2===0) ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
      ctx.fill();
    }
  }

  function drawObj(o){
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(o.a);
    // outline
    ctx.fillStyle = o.color;
    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.lineWidth = Math.max(1, o.r * 0.12);
    // shape: rounded square
    const rr = o.r;
    const k = rr * 0.35;
    ctx.beginPath();
    ctx.moveTo(-rr, -rr + k);
    ctx.quadraticCurveTo(-rr, -rr, -rr + k, -rr);
    ctx.lineTo(rr - k, -rr);
    ctx.quadraticCurveTo(rr, -rr, rr, -rr + k);
    ctx.lineTo(rr, rr - k);
    ctx.quadraticCurveTo(rr, rr, rr - k, rr);
    ctx.lineTo(-rr + k, rr);
    ctx.quadraticCurveTo(-rr, rr, -rr, rr - k);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // center checker cross for readability
    ctx.lineWidth = Math.max(1, rr * 0.08);
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.moveTo(-rr*0.6, 0); ctx.lineTo(rr*0.6, 0);
    ctx.moveTo(0, -rr*0.6); ctx.lineTo(0, rr*0.6);
    ctx.stroke();

    ctx.restore();
  }

  // Game loop
  let last = performance.now();
  let fpsAvg = 60;
  function step(t){
    const dt = Math.min(0.06, (t - last)/1000);
    last = t;
    fpsAvg = fpsAvg * 0.9 + (1/dt) * 0.1;

    if (world.running) {
      // input -> velocity for keyboard
      let ax=0, ay=0;
      if (keys.has('arrowleft') || keys.has('a')) ax -= 1;
      if (keys.has('arrowright')|| keys.has('d')) ax += 1;
      if (keys.has('arrowup')   || keys.has('w')) ay -= 1;
      if (keys.has('arrowdown') || keys.has('s')) ay += 1;
      const mag = Math.hypot(ax, ay) || 1;
      const spd = player.speed();
      if (!stickActive) {
        player.vx = (ax/mag) * spd * 2;
        player.vy = (ay/mag) * spd * 2;
      }

      // move player
      player.x = clamp(player.x + player.vx * scale, player.r, world.w() - player.r);
      player.y = clamp(player.y + player.vy * scale, player.r, world.h() - player.r);

      // move objects
      for (const o of objs) {
        o.x += o.vx * scale;
        o.y += o.vy * scale;
        o.a += o.spin;
        // bounce walls
        if (o.x - o.r < 0 && o.vx < 0) o.vx *= -1;
        if (o.x + o.r > world.w() && o.vx > 0) o.vx *= -1;
        if (o.y - o.r < 0 && o.vy < 0) o.vy *= -1;
        if (o.y + o.r > world.h() && o.vy > 0) o.vy *= -1;
      }

      // eat logic
      for (let i=objs.length-1;i>=0;i--) {
        const o = objs[i];
        const dx = o.x - player.x;
        const dy = o.y - player.y;
        const dist = Math.hypot(dx, dy);
        const edible = o.r <= player.r * 0.92;
        // gravity pull effect for edible
        if (edible && dist < player.r * 4) {
          const pull = clamp((player.r*4 - dist) / (player.r*4), 0, 1) * 0.8;
          o.x -= (dx / (dist || 1)) * pull * scale * 2.2;
          o.y -= (dy / (dist || 1)) * pull * scale * 2.2;
        }
        if (edible && dist < player.r) {
          // Swallow it
          player.grow(Math.PI * o.r * o.r);
          objs.splice(i, 1);
          playBeep(180 + Math.random()*90, 0.05, 'triangle', 0.08);
          haptic(8);
        }
      }

      // timer
      world.timeLeft -= dt;
      if (world.timeLeft <= 0) {
        world.timeLeft = 0;
        world.running = false;
        bigMsg.textContent = `TIME UP\nSize ×${(player.r / (Math.min(canvas.width, canvas.height) * 0.03)).toFixed(2)}`;
        sr.textContent = 'Time up!';
      }

      // level-up: if objects low, spawn stronger wave
      if (world.running && objs.length < 16) {
        world.level += 1;
        const add = 20 + Math.floor(world.level * 4);
        spawnMore(add);
        world.timeLeft = Math.min(99, world.timeLeft + 8); // reward
        bigFlash(`Level ${world.level}`);
        playBeep(320, 0.08, 'sawtooth', 0.09);
        setTimeout(() => playBeep(420, 0.09, 'sawtooth', 0.09), 60);
        setTimeout(() => playBeep(540, 0.11, 'sawtooth', 0.09), 120);
      }
    }

    // draw
    ctx.fillStyle = '#000000';
    ctx.fillRect(0,0,canvas.width, canvas.height);

    // subtle grid for depth
    ctx.save();
    ctx.globalAlpha = 0.08;
    const grid = 64 * scale;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x=0;x<canvas.width;x+=grid) { ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); }
    for (let y=0;y<canvas.height;y+=grid) { ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); }
    ctx.stroke();
    ctx.restore();

    // edible glow preview
    for (const o of objs) {
      if (o.r <= player.r * 0.92) {
        ctx.save();
        const g = ctx.createRadialGradient(o.x, o.y, o.r*0.6, o.x, o.y, o.r*1.6);
        g.addColorStop(0, 'rgba(124,252,0,0.06)');
        g.addColorStop(1, 'rgba(124,252,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r*1.6, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    }

    // draw objects
    for (const o of objs) drawObj(o);

    // draw hole on top
    drawHole(player.x, player.y, player.r);

    // HUD update
    const sizeFactor = (player.r / (Math.min(canvas.width, canvas.height) * 0.03));
    uiScore.textContent = `Size: ${sizeFactor.toFixed(2)}×`;
    uiTime.textContent = `Time: ${Math.ceil(world.timeLeft).toString().padStart(2,'0')}`;
    uiFps.textContent = `${Math.round(fpsAvg)} FPS`;

    requestAnimationFrame(step);
  }

  function spawnMore(n) {
    for (let i=0;i<n;i++) {
      const base = player.r * randRange(0.4, 1.6); // mix of edible / not
      const size = clamp(base, 10, Math.min(140, player.r * 1.8));
      const edible = size < player.r * 0.95;
      const o = {
        x: randRange(30, world.w()-30),
        y: randRange(30, world.h()-30),
        r: size,
        color: edible ? 'rgba(124,252,0,0.9)' : 'rgba(255,255,255,0.85)',
        vx: randRange(-0.6, 0.6),
        vy: randRange(-0.6, 0.6),
        spin: randRange(-0.03, 0.03),
        a: Math.random()*Math.PI*2,
      };
      objs.push(o);
    }
  }

  function bigFlash(text) {
    bigMsg.textContent = text;
    bigMsg.style.opacity = '1';
    bigMsg.animate([{opacity:1},{opacity:0}], { duration: 1200, fill: 'forwards' });
  }

  // Pause/Restart keys
  window.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'p') btnPause.click();
    if (e.key.toLowerCase() === 'r') restart();
  });

  // Start
  bigFlash('Mini Hole');
  requestAnimationFrame(step);

  // Accessibility: resume audio on first interaction (required on iOS)
  window.addEventListener('pointerdown', () => {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }, { once: true, passive: true });

})();</script>
</body>
</html>
