<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Symphonic Noise</title>
<meta name="description" content="A generative wall of orchestral-style sound for study or art. Never repeats." />
<meta name="theme-color" content="#0a0a12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon.svg" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(ellipse at 50% 20%, #171426 0%, #0a0a12 60%, #050508 100%);
    color: #e8e6f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  h1 {
    font-weight: 300;
    letter-spacing: 0.08em;
    font-size: 1.6rem;
    margin: 0 0 8px;
  }
  p.tagline {
    color: #9c98b4;
    font-size: 0.9rem;
    line-height: 1.5;
    margin: 0 0 40px;
  }
  #begin {
    appearance: none;
    border: 1px solid #4a4670;
    background: linear-gradient(180deg, #2a2650, #1a1735);
    color: #e8e6f0;
    font-size: 1rem;
    letter-spacing: 0.04em;
    padding: 16px 48px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.1s;
  }
  #begin:hover { border-color: #8a82c8; }
  #begin:active { transform: scale(0.98); }
  #begin:disabled { opacity: 0.5; cursor: wait; }
  .controls {
    margin-top: 40px;
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
  }
  .controls label {
    font-size: 0.8rem;
    color: #9c98b4;
    width: 60px;
    text-align: right;
  }
  input[type="range"] {
    flex: 1;
    max-width: 200px;
    accent-color: #8a82c8;
  }
  #status {
    margin-top: 28px;
    min-height: 1.2em;
    font-size: 0.8rem;
    color: #6f6b8a;
  }
</style>
</head>
<body>
<main>
  <h1>SYMPHONIC NOISE</h1>
  <p class="tagline">
    A generative wall of orchestral-style sound. Every listen is different —
    slow-shifting chords, layered voices, no loop. Built for study or for
    listening on its own terms.
  </p>

  <button id="begin" type="button">Begin</button>

  <div class="controls">
    <label for="volume">Volume</label>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" />
  </div>

  <p id="status">Tap Begin to start. Headphones or speakers recommended.</p>
</main>

<script src="./lib/Tone.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
