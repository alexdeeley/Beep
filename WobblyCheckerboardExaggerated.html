<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Wobbly Checkerboard — Exaggerated</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let dpr = Math.max(1, window.devicePixelRatio || 1);

  // Offscreen for post-processing
  const off = document.createElement('canvas');
  const octx = off.getContext('2d', { alpha: false });

  // Grid config (auto scales)
  let cols = 28, rows = 20;

  // Impulse system: each tap adds an impulse decaying over ~3s
  const TAU = 3000; // ms decay constant to approximate 3s settle each impulse
  let impulses = []; // {t0, mag, dir:[dx,dy]}
  let phase = 0;

  // Track last swipe vector for directional waves
  let lastDir = [0,0];

  function resize(){
    dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width  = Math.floor(window.innerWidth  * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    off.width = canvas.width;
    off.height = canvas.height;
    cols = Math.max(16, Math.floor(canvas.width/(30*dpr)));
    rows = Math.max(12, Math.floor(canvas.height/(30*dpr)));
  }
  window.addEventListener('resize', resize);
  resize();

  function impulseFromGesture(dx, dy){
    const mag = Math.hypot(dx, dy);
    if (mag < 2) return;
    const nx = dx / mag, ny = dy / mag;
    lastDir = [nx, ny];
    // magnitude scales with gesture distance but capped, each tap adds up
    const m = Math.min(2.0, mag / 100);
    impulses.push({ t0: performance.now(), mag: m, dir: [nx, ny] });
  }

  // Pointer handling
  let dragging = false, x0=0, y0=0;
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    dragging = true; x0 = t.clientX; y0 = t.clientY;
  }, {passive:false});
  canvas.addEventListener('touchmove', e => { e.preventDefault(); }, {passive:false});
  canvas.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    if (!dragging) return;
    dragging=false;
    impulseFromGesture(t.clientX - x0, t.clientY - y0);
  });
  // Also count taps (no movement) as a tiny impulse
  canvas.addEventListener('touchcancel', ()=>{dragging=false;});

  // Mouse
  canvas.addEventListener('mousedown', e => { dragging=true; x0=e.clientX; y0=e.clientY; });
  window.addEventListener('mouseup', e => {
    if (!dragging) return; dragging=false;
    impulseFromGesture(e.clientX - x0, e.clientY - y0);
  });

  // Click/tap without drag -> add a standard impulse
  canvas.addEventListener('click', e => { impulseFromGesture(0.001, 0.001); });

  // Utility
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function easeOutCubic(x){ return 1 - Math.pow(1-x,3); }

  function currentEnergy(now){
    // Sum decayed magnitudes; remove stale (older than ~8s to keep list small)
    let E = 0;
    const keep = [];
    for (const im of impulses){
      const dt = now - im.t0;
      if (dt < 8000){
        const w = Math.exp(-dt/TAU);
        E += im.mag * w;
        keep.push(im);
      }
    }
    impulses = keep;
    return E;
  }

  function currentDirection(now){
    // Weighted average of directions of active impulses
    let sx=0, sy=0;
    for (const im of impulses){
      const w = Math.exp(-(now - im.t0)/TAU);
      sx += im.dir[0]*w;
      sy += im.dir[1]*w;
    }
    const m = Math.hypot(sx,sy);
    if (m>1e-4) return [sx/m, sy/m];
    return lastDir;
  }

  function drawBasePattern(targetCtx, width, height, E, dir){
    targetCtx.clearRect(0,0,width,height);
    targetCtx.save();
    targetCtx.scale(dpr, dpr);
    const cw = width/(cols*dpr), ch = height/(rows*dpr);

    // Strength grows nonlinearly with energy -> dramatic after many taps
    const strength = Math.min(2.5, 0.6*E + 0.2*E*E);

    // Flow speed also increases with E
    phase += 0.03 + clamp(0.15*E, 0, 0.6);

    for (let j=0; j<rows; j++){
      for (let i=0; i<cols; i++){
        const x0 = i/cols,     y0 = j/rows;
        const x1 = (i+1)/cols, y1 = (j+1)/rows;
        function warp(x,y){
          const swirl1 = Math.sin((y*8 + phase*1.1))*0.015;
          const swirl2 = Math.sin((x*8 + phase*0.9))*0.015;
          const dWave  = (Math.sin((x*12 + y*11) + phase*1.6)*dir[0] +
                          Math.cos((x*11 - y*12) + phase*1.3)*dir[1]) * (0.15*strength);
          const chaos  = Math.sin((x*50 + y*47) + Math.sin(phase*0.7)*5) * (0.002*strength*strength);
          const dx = swirl1 + dWave*0.6 + chaos;
          const dy = swirl2 + dWave*0.6 - chaos;
          return [x+dx, y+dy];
        }
        const p0 = warp(x0,y0), p1=warp(x1,y0), p2=warp(x1,y1), p3=warp(x0,y1);
        const ax=p0[0]*width/dpr, ay=p0[1]*height/dpr;
        const bx=p1[0]*width/dpr, by=p1[1]*height/dpr;
        const cx=p2[0]*width/dpr, cy=p2[1]*height/dpr;
        const dx2=p3[0]*width/dpr, dy2=p3[1]*height/dpr;

        targetCtx.beginPath();
        targetCtx.moveTo(ax,ay); targetCtx.lineTo(bx,by);
        targetCtx.lineTo(cx,cy); targetCtx.lineTo(dx2,dy2); targetCtx.closePath();
        targetCtx.fillStyle = ((i+j)&1)===0 ? '#fff' : '#000';
        targetCtx.fill();
        // crisp grid borders
        targetCtx.lineWidth = 1.5;
        targetCtx.strokeStyle = '#000';
        targetCtx.stroke();
      }
    }
    targetCtx.restore();
  }

  function drawMoireOverlay(targetCtx, width, height, E){
    if (E < 1.0) return;
    targetCtx.save();
    targetCtx.globalAlpha = clamp(0.05*E, 0, 0.35);
    targetCtx.translate(width/2, height/2);
    const angle = 0.15*E;
    targetCtx.rotate(angle);
    targetCtx.fillStyle = '#fff';
    // draw thin stripes to create interference
    const stripeW = Math.max(1, Math.floor(3 - 1.5*Math.tanh(E-1)));
    for (let x=-width; x<width; x+= stripeW*3){
      targetCtx.fillRect(x, -height, stripeW, height*2);
    }
    targetCtx.rotate(-angle*1.9); // second set at a slightly different angle
    for (let x=-width; x<width; x+= stripeW*3){
      targetCtx.fillRect(x, -height, stripeW, height*2);
    }
    targetCtx.restore();
  }

  function render(){
    const W = canvas.width, H = canvas.height;
    const now = performance.now();
    const E = currentEnergy(now);
    const dir = currentDirection(now);

    // Base pattern to offscreen first
    drawBasePattern(octx, W, H, E, dir);

    // Pixelation factor grows with energy
    const pix = 1 + Math.floor( clamp( (E*E)*12, 0, 200 ) );
    if (pix > 1){
      // Scale down then up with image smoothing disabled
      const tmp = document.createElement('canvas');
      tmp.width = Math.max(1, Math.floor(W / pix));
      tmp.height = Math.max(1, Math.floor(H / pix));
      const tctx = tmp.getContext('2d', { alpha: false });
      tctx.imageSmoothingEnabled = false;
      tctx.drawImage(off, 0,0, tmp.width, tmp.height);

      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0,0,W,H);
      ctx.drawImage(tmp, 0,0, tmp.width, tmp.height, 0,0, W, H);
    } else {
      ctx.clearRect(0,0,W,H);
      ctx.drawImage(off, 0, 0);
    }

    // Add moiré-style interference at higher energy
    if (E > 0.8){
      drawMoireOverlay(ctx, W, H, E);
    }

    requestAnimationFrame(render);
  }
  render();

  // Help: first auto-impulse so there's motion on load
  setTimeout(()=>impulses.push({t0:performance.now(), mag:0.6, dir:[0.7,0.3]}), 300);

})();
</script>
</body>
</html>
