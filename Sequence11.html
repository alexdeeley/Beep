    this.drawPixelText(ctx, "START", cx, by + bh / 2 + 2, 40, PALETTE.white, "center");
    ctx.restore();
    this.buttons.push({ x: cx - bw / 2, y: by, w: bw, h: bh, onClick: () => this.startGame() });

    this.drawPixelText(ctx, "HIGH SCORE " + this.save.highScore, cx, by + bh + 34, 13, PALETTE.goldYellow, "center");

    // small, unobtrusive secondary link
    const linkY = this.LOGICAL_H - 46;
    this.drawPixelText(ctx, "HOW TO PLAY", cx, linkY, 13, PALETTE.gray, "center");
    this.buttons.push({ x: cx - 70, y: linkY - 16, w: 140, h: 32, onClick: () => { this.state = STATE.HOWTO; } });
  }

  drawHowTo(ctx) {
    const cx = this.LOGICAL_W / 2;
    this.drawPixelText(ctx, "HOW TO PLAY", cx, 60, 22, PALETTE.paleYellow, "center");
    const lines = [
      "DRAG TO AIM, RELEASE TO FIRE.",
      "DRAG DOWN TO THE BOTTOM EDGE TO CANCEL.",
      "YOU START WITH 10 BALLS.",
      "CLEAR BLOCKS BEFORE THEY REACH THE",
      "DANGER LINE. GREEN TOKENS = MORE BALLS.",
      "",
      "FUSE SQUARES EXPLODE ON DESTRUCTION.",
      "LASER SQUARES FIRE BEAMS IN ALL 4",
      "DIRECTIONS, CLEARING THEIR PATH.",
      "WATCH FOR L, T AND GIANT SQUARE",
      "SHAPES. CLEAR THE WHOLE SCREEN FOR",
      "A BIG BONUS.",
      "",
      "SQUARE TOKENS GRANT FIREBALL, SPLIT,",
      "RICOCHET, BOMB, FREEZE, REWIND OR",
      "HOMING BALLS. THE STAR GIVES DOUBLE",
      "STRENGTH; THE ROUND TOKEN GIVES",
      "GIANT 3X-DAMAGE BALLS. THE FIERY",
      "BOTTOM-ROW PICKUP DOUBLES EVERY HIT",
      "FOR 3 TURNS.",
      "",
      "REACH THE DANGER LINE AND YOU GET",
      "ONE SECOND CHANCE THAT CLEARS THE",
      "BOTTOM 3 ROWS. LINES CLEARED SHOW",
      "AT THE TOP OF THE SCREEN.",
      "",
      "THE GUIDE PREDICTS THE FIRST BALL --",
      "DESTROYED BLOCKS MAY CHANGE LATER",
      "PATHS.",
      "",
      "ARROWS AIM \u2022 SPACE FIRES \u2022 P PAUSES",
      "F FAST-FORWARDS \u2022 M MUTES"
    ];
    let y = 70;
    for (const l of lines) {
      this.drawPixelText(ctx, l, cx, y, 10.5, PALETTE.lightGray, "center");
      y += 17;
    }
    this.button(ctx, cx - 90, this.LOGICAL_H - 54, 180, 40, "BACK", () => { this.state = STATE.TITLE; }, { size: 16 });
  }

  drawBoardFrame(ctx) {
    const b = this.board;
    ctx.fillStyle = PALETTE.navyDeep;
    ctx.fillRect(b.x - 6, b.y - 6, b.w + 12, b.h + 12);
    ctx.strokeStyle = PALETTE.deepBlue;
    ctx.lineWidth = 4;
    ctx.strokeRect(b.x - 4, b.y - 4, b.w + 8, b.h + 8);
    // playfield bg
    ctx.fillStyle = "#0c1120";
    ctx.fillRect(b.x, b.y, b.w, b.h);

    // subtle grid (only across the actual brick rows, not the ceiling gap)
    ctx.strokeStyle = "rgba(255,255,255,0.035)";
    ctx.lineWidth = 1;
    for (let c = 1; c < CONFIG.COLS; c++) {
      ctx.beginPath(); ctx.moveTo(b.x + c * CONFIG.CELL, b.gridY); ctx.lineTo(b.x + c * CONFIG.CELL, b.y + b.h); ctx.stroke();
    }
    for (let r = 0; r < CONFIG.VISIBLE_ROWS; r++) {
      ctx.beginPath(); ctx.moveTo(b.x, b.gridY + r * CONFIG.CELL); ctx.lineTo(b.x + b.w, b.gridY + r * CONFIG.CELL); ctx.stroke();
    }

    // ceiling headroom marker -- a soft dashed line showing where bricks start,
    // so it reads clearly as open space for bank shots off the ceiling
    ctx.save();
    ctx.strokeStyle = "rgba(63,224,255,0.25)";
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(b.x, b.gridY); ctx.lineTo(b.x + b.w, b.gridY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // danger line: a chase-light pattern scrolling right-to-left, rather
    // than a flashing on/off line. It speeds up as the nearest block gets
    // closer to the danger row.
    const dy = b.gridY + (CONFIG.VISIBLE_ROWS - 1) * CONFIG.CELL;

    let closestDist = Infinity;
    for (const bl of b.aliveBlocks()) {
      const d = (CONFIG.VISIBLE_ROWS - 1) - (Math.round(bl.row) + (bl.height - 1));
      if (d < closestDist) closestDist = d;
    }
    const proximity = closestDist === Infinity ? 0 : Math.max(0, Math.min(1, 1 - closestDist / (CONFIG.VISIBLE_ROWS - 1)));
    const speed = 28 + proximity * 260 + (this.dangerFlash > 0 ? 90 : 0); // logical px/sec

    // dim base line, always visible
    ctx.strokeStyle = "rgba(180,40,50,0.4)";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(b.x, dy); ctx.lineTo(b.x + b.w, dy); ctx.stroke();

    // bright lights chasing right to left along the line
    const dashLen = 16, gapLen = 14, period = dashLen + gapLen;
    const t = performance.now() / 1000;
    const scroll = (t * speed) % period;
    ctx.save();
    ctx.strokeStyle = PALETTE.hotRed;
    ctx.lineWidth = 5;
    ctx.shadowColor = PALETTE.hotRed;
    ctx.shadowBlur = 5 + proximity * 12;
    ctx.beginPath();
    for (let x = b.x + b.w - scroll; x > b.x - dashLen; x -= period) {
      const x1 = Math.max(b.x, x - dashLen);
      const x2 = Math.min(b.x + b.w, x);
      if (x2 > x1) { ctx.moveTo(x2, dy); ctx.lineTo(x1, dy); }
    }
    ctx.stroke();
    ctx.restore();
  }

  drawBoard(ctx) {
    for (const tk of this.board.tokens) {
      if (tk.collected) continue;
      const c = tk.center(this.board);
      const pulse = 1 + Math.sin(performance.now() / 220 + tk.phase) * 0.12;
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = tk.value >= 3 ? PALETTE.magenta : PALETTE.brightGreen;
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = PALETTE.white;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      this.drawPixelText(ctx, "+" + tk.value, c.x, c.y, 13, PALETTE.navyDeep, "center");
    }

    for (const pk of this.board.powerTokens) {
      if (pk.collected) continue;
      const c = pk.center(this.board);
      const info = POWER_INFO[pk.power];
      const pulse = 1 + Math.sin(performance.now() / 180 + pk.phase) * 0.14;
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = info.color;
      ctx.strokeStyle = PALETTE.white;
      ctx.lineWidth = 2;
      if (pk.power === "giant") {
        // Giant Balls: a round pickup instead of the usual diamond, so its
        // shape itself signals "bigger balls" at a glance
        ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else {
        ctx.rotate(Math.PI / 4);
        ctx.fillRect(-12, -12, 24, 24);
        ctx.strokeRect(-12, -12, 24, 24);
      }
      ctx.restore();
      this.drawPixelText(ctx, info.icon, c.x, c.y, 15, PALETTE.navyDeep, "center");
    }

    for (const bl of this.board.blocks) {
      if (bl.destroyed) continue;
      this.drawBlock(ctx, bl);
    }

    // explosive-ball pickup: sits fixed in the bottom row
    const ep = this.board.explosivePickup;
    if (ep) {
      const cx = this.board.x + (ep.col + 0.5) * CONFIG.CELL;
      const cy = this.board.gridY + (this.board.bottomRowIndex() + 0.5) * CONFIG.CELL;
      const pulse = 1 + Math.sin(performance.now() / 140) * 0.16;
      const spin = performance.now() / 500;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(spin);
      ctx.scale(pulse, pulse);
      const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, 16);
      grad.addColorStop(0, PALETTE.paleYellow);
      grad.addColorStop(0.5, PALETTE.orange);
      grad.addColorStop(1, PALETTE.hotRed);
      ctx.fillStyle = grad;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        const r = i % 2 === 0 ? 15 : 8;
        const px = Math.cos(a) * r, py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = PALETTE.white;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
      this.drawPixelText(ctx, "2\u00D7", cx, cy, 12, PALETTE.navyDeep, "center");
    }
  }

  drawBeamFlashes(ctx) {
    for (const bf of this.beamFlashes) {
      const a = Math.max(0, bf.life / bf.maxLife);
      ctx.save();
      ctx.globalAlpha = a * 0.9;
      ctx.strokeStyle = PALETTE.white;
      ctx.lineWidth = 6 * a + 1;
      ctx.beginPath();
      ctx.moveTo(bf.x1, bf.y1);
      ctx.lineTo(bf.x2, bf.y2);
      ctx.stroke();
      ctx.globalAlpha = a * 0.6;
      ctx.strokeStyle = PALETTE.electricBlue;
      ctx.lineWidth = 12 * a + 2;
      ctx.stroke();
      ctx.restore();
    }
  }

  drawSecondChanceBanner(ctx) {
    const t = this.secondChanceBannerT;
    const fadeIn = Math.min(1, (2.2 - t) / 0.3);
    const fadeOut = Math.min(1, t / 0.5);
    const alpha = Math.min(fadeIn, fadeOut);
    const y = this.board.gridY + this.board.h * 0.32;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = PALETTE.goldYellow;
    ctx.shadowBlur = 16;
    this.drawPixelText(ctx, "SECOND CHANCE!", this.LOGICAL_W / 2, y, 24, PALETTE.paleYellow, "center");
    ctx.shadowBlur = 0;
    this.drawPixelText(ctx, "3 LINES CLEARED", this.LOGICAL_W / 2, y + 30, 15, PALETTE.goldYellow, "center");
    ctx.restore();
  }

  drawBlock(ctx, bl) {
    const board = this.board;
    const rect = bl.boundingRect(board);
    const band = bl.strengthBand(this.turn);
    let fill = PALETTE.cyan, edge = PALETTE.white;
    if (band === "moderate") { fill = PALETTE.electricBlue; edge = PALETTE.goldYellow; }
    else if (band === "strong") { fill = PALETTE.orange; edge = PALETTE.paleYellow; }
    else if (band === "extreme") {
      const flick = Math.floor(performance.now() / 160) % 2 === 0;
      fill = flick ? PALETTE.hotRed : PALETTE.magenta; edge = PALETTE.white;
    }

    let fillColor;
    if (bl.hitFlash > 0.4) fillColor = PALETTE.white;
    else if (bl.isBomb) { const flick = Math.floor(performance.now() / 140) % 2 === 0; fillColor = flick ? PALETTE.hotRed : PALETTE.burgundy; }
    else if (bl.isLaser) { const flick = Math.floor(performance.now() / 150) % 2 === 0; fillColor = flick ? PALETTE.electricBlue : PALETTE.deepBlue; }
    else fillColor = fill;

    const recoil = bl.recoil > 0 ? bl.recoil * 2 : 0;
    const pad = CONFIG.BLOCK_PAD;
    const coords = bl.cellCoords();
    const coordSet = new Set(coords.map(c => c.row + "," + c.col));

    // fill every occupied cell, with the padding dropped on any edge that
    // touches another cell of the SAME block so multi-cell shapes (L, T,
    // giant squares) read as one seamless piece rather than a checkerboard
    ctx.fillStyle = fillColor;
    for (const c of coords) {
      const padT = coordSet.has((c.row - 1) + "," + c.col) ? 0 : pad;
      const padB = coordSet.has((c.row + 1) + "," + c.col) ? 0 : pad;
      const padL = coordSet.has(c.row + "," + (c.col - 1)) ? 0 : pad;
      const padR = coordSet.has(c.row + "," + (c.col + 1)) ? 0 : pad;
      const cx0 = board.x + c.col * CONFIG.CELL + padL + recoil * 0.4;
      const cy0 = board.gridY + c.row * CONFIG.CELL + padT + recoil * 0.4;
      const cw0 = CONFIG.CELL - padL - padR - recoil * 0.8;
      const ch0 = CONFIG.CELL - padT - padB - recoil * 0.8;
      ctx.fillRect(cx0, cy0, cw0, ch0);
    }

    const rx = rect.x + recoil * 0.4, ry = rect.y + recoil * 0.4;
    const rw = rect.w - recoil * 0.8, rh = rect.h - recoil * 0.8;

    if (bl.isBomb && bl.hitFlash <= 0.4) {
      // exploding square: checkerboard pattern + fuse spark
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = PALETTE.navyDeep;
      const cs = 6;
      for (let yy = 0; yy < rh; yy += cs) {
        for (let xx = 0; xx < rw; xx += cs) {
          if (((Math.round(xx / cs) + Math.round(yy / cs)) % 2) === 0) {
            ctx.fillRect(rx + xx, ry + yy, cs, cs);
          }
        }
      }
      ctx.restore();
      const sparkT = performance.now() / 120;
      ctx.fillStyle = PALETTE.goldYellow;
      ctx.beginPath();
      ctx.arc(rx + rw / 2, ry + 4, 2 + Math.abs(Math.sin(sparkT)) * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    if (bl.isLaser && bl.hitFlash <= 0.4) {
      // laser blaster: bright crosshair signaling the beam will fire in
      // all four directions when this block is destroyed
      ctx.save();
      ctx.strokeStyle = PALETTE.cyan;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.85 + Math.sin(performance.now() / 130) * 0.15;
      ctx.beginPath();
      ctx.moveTo(rx + rw / 2, ry + 3); ctx.lineTo(rx + rw / 2, ry + rh - 3);
      ctx.moveTo(rx + 3, ry + rh / 2); ctx.lineTo(rx + rw - 3, ry + rh / 2);
      ctx.stroke();
      ctx.fillStyle = PALETTE.white;
      ctx.beginPath();
      ctx.arc(rx + rw / 2, ry + rh / 2, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // health-level line: drains slowly downward as the block takes hits,
    // like a fluid level, so remaining strength reads at a glance
    const level = Math.max(0, Math.min(1, bl.fillLevel));
    const drainedH = rh * (1 - level);
    if (drainedH > 0.5) {
      ctx.save();
      ctx.fillStyle = "rgba(4,6,14,0.55)";
      ctx.fillRect(rx, ry, rw, drainedH);
      ctx.restore();
    }
    if (level < 0.999 && level > 0.001) {
      const lineY = ry + drainedH;
      ctx.save();
      ctx.strokeStyle = PALETTE.white;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.moveTo(rx + 1, lineY);
      ctx.lineTo(rx + rw - 1, lineY);
      ctx.stroke();
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = PALETTE.cyan;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(rx + 1, lineY);
      ctx.lineTo(rx + rw - 1, lineY);
      ctx.stroke();
      ctx.restore();
    }

    // 1px highlight/shadow bevel across the whole shape's bounding box
    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.lineWidth = 1;
    ctx.strokeRect(rx + 0.5, ry + 0.5, rw - 1, 0);
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.strokeRect(rx + 0.5, ry + rh - 0.5, rw - 1, 0);

    // outer silhouette: only trace edges that don't touch another cell of
    // the same block, so L/T pieces read as their true shape, not a box
    ctx.save();
    ctx.strokeStyle = bl.isBomb ? PALETTE.goldYellow : (bl.isLaser ? PALETTE.white : edge);
    ctx.lineWidth = (band === "extreme" || bl.isBomb || bl.isLaser) ? 3 : 2;
    ctx.beginPath();
    for (const c of coords) {
      const cx0 = board.x + c.col * CONFIG.CELL;
      const cy0 = board.gridY + c.row * CONFIG.CELL;
      if (!coordSet.has((c.row - 1) + "," + c.col)) { ctx.moveTo(cx0 + 1, cy0 + 1); ctx.lineTo(cx0 + CONFIG.CELL - 1, cy0 + 1); }
      if (!coordSet.has((c.row + 1) + "," + c.col)) { ctx.moveTo(cx0 + 1, cy0 + CONFIG.CELL - 1); ctx.lineTo(cx0 + CONFIG.CELL - 1, cy0 + CONFIG.CELL - 1); }
      if (!coordSet.has(c.row + "," + (c.col - 1))) { ctx.moveTo(cx0 + 1, cy0 + 1); ctx.lineTo(cx0 + 1, cy0 + CONFIG.CELL - 1); }
      if (!coordSet.has(c.row + "," + (c.col + 1))) { ctx.moveTo(cx0 + CONFIG.CELL - 1, cy0 + 1); ctx.lineTo(cx0 + CONFIG.CELL - 1, cy0 + CONFIG.CELL - 1); }
    }
    ctx.stroke();
    ctx.restore();

    const fontSize = Math.min(26, rect.w / (String(bl.hp).length * 0.7), rect.h * 0.5);
    this.drawPixelText(ctx, String(bl.hp), rect.x + rect.w / 2, rect.y + rect.h / 2 + 1, fontSize, PALETTE.white, "center");
  }

  drawLaunchArea(ctx) {
    const b = this.board;
    const areaY = b.y + b.h;
    ctx.fillStyle = "#0a0d18";
    ctx.fillRect(b.x, areaY, b.w, CONFIG.LAUNCH_AREA_H);

    if (this.landingMarkerT > 0 && this.landingMarker != null) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.landingMarkerT);
      ctx.strokeStyle = PALETTE.cyan;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(this.landingMarker - 14, this.launcherY);
      ctx.lineTo(this.landingMarker + 14, this.launcherY);
      ctx.stroke();
      ctx.restore();
    }

    if (this.state === STATE.AIMING) {
      if (this.aiming && this.aimCancelled) {
        // cancel-zone feedback: dim the reticle red and label the strip
        ctx.save();
        ctx.globalAlpha = 0.16 + Math.abs(Math.sin(performance.now() / 220)) * 0.1;
        ctx.fillStyle = PALETTE.hotRed;
        const stripY = this.LOGICAL_H - CONFIG.CANCEL_ZONE_H;
        ctx.fillRect(b.x, stripY, b.w, this.LOGICAL_H - stripY);
        ctx.restore();
        this.drawPixelText(ctx, "RELEASE TO CANCEL", b.x + b.w / 2, this.LOGICAL_H - 18, 12, PALETTE.hotRed, "center");
        ctx.save();
        ctx.strokeStyle = PALETTE.hotRed;
        ctx.lineWidth = 3;
        const r = 10;
        ctx.beginPath();
        ctx.moveTo(this.aimPointerX - r, this.aimPointerY - r);
        ctx.lineTo(this.aimPointerX + r, this.aimPointerY + r);
        ctx.moveTo(this.aimPointerX + r, this.aimPointerY - r);
        ctx.lineTo(this.aimPointerX - r, this.aimPointerY + r);
        ctx.stroke();
        ctx.restore();
      }

      // launcher pixel arrow / reticle
      const cancelled = this.aiming && this.aimCancelled;
      const pulse = 0.6 + Math.abs(Math.sin(performance.now() / 300)) * 0.4;
      ctx.save();
      ctx.globalAlpha = cancelled ? 0.35 : pulse;
      ctx.fillStyle = cancelled ? PALETTE.hotRed : PALETTE.paleYellow;
      ctx.beginPath();
      ctx.moveTo(this.launcherX, this.launcherY - 22);
      ctx.lineTo(this.launcherX - 9, this.launcherY - 6);
      ctx.lineTo(this.launcherX + 9, this.launcherY - 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = cancelled ? PALETTE.hotRed : PALETTE.white;
      ctx.beginPath();
      ctx.arc(this.launcherX, this.launcherY, 6, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.balls.length === 0) {
      ctx.fillStyle = PALETTE.white;
      ctx.beginPath();
      ctx.arc(this.launcherX, this.launcherY, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  drawTrajectory(ctx) {
    const pts = this.getPreviewPoints();
    if (pts.length < 2) return;
    let segIndex = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const dist = Math.hypot(b.x - a.x, b.y - a.y);
      const dotSpacing = 9;
      const steps = Math.max(1, Math.floor(dist / dotSpacing));
      const fadeFactor = Math.max(0.18, 1 - i * 0.07);
      for (let s = 0; s <= steps; s++) {
        const tt = s / steps;
        const x = a.x + (b.x - a.x) * tt;
        const y = a.y + (b.y - a.y) * tt;
        const dim = (segIndex % 3 === 2);
        segIndex++;
        ctx.globalAlpha = fadeFactor * (dim ? 0.45 : 0.95);
        ctx.fillStyle = i === 0 ? PALETTE.white : PALETTE.cyan;
        const r = i === 0 ? 2.2 : 1.8;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      if (i > 0 && a.impact) {
        ctx.globalAlpha = fadeFactor;
        ctx.fillStyle = PALETTE.goldYellow;
        ctx.fillRect(a.x - 3, a.y - 3, 6, 6);
      }
    }
    ctx.globalAlpha = 1;
  }

  drawBalls(ctx) {
    const explosive = this.explosiveTurnsLeft > 0;
    const doubled = this.volleyDouble;
    for (const ball of this.balls) {
      if (ball.returned) continue;
      const giant = ball.radius > CONFIG.BALL_RADIUS + 0.1;
      const trailColor = explosive ? PALETTE.hotRed : (giant ? PALETTE.brightGreen : (doubled ? PALETTE.goldYellow : PALETTE.cyan));
      const coreColor = explosive ? PALETTE.orange : (giant ? PALETTE.brightGreen : (doubled ? PALETTE.paleYellow : PALETTE.white));
      const ringColor = explosive ? PALETTE.hotRed : (giant ? PALETTE.white : (doubled ? PALETTE.goldYellow : PALETTE.cyan));
      for (let i = 0; i < ball.trailPts.length; i++) {
        const p = ball.trailPts[i];
        ctx.globalAlpha = (i / ball.trailPts.length) * 0.35;
        ctx.fillStyle = trailColor;
        ctx.beginPath(); ctx.arc(p.x, p.y, ball.radius * 0.7, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = coreColor;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = ringColor;
      ctx.lineWidth = (explosive || doubled || giant) ? 2 : 1.5;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  drawHUD(ctx) {
    const large = this.save.largeUI;
    ctx.fillStyle = PALETTE.navyDeep;
    ctx.fillRect(0, 0, this.LOGICAL_W, CONFIG.BORDER + CONFIG.HUD_H);
    ctx.strokeStyle = PALETTE.deepBlue;
    ctx.beginPath();
    ctx.moveTo(0, CONFIG.BORDER + CONFIG.HUD_H);
    ctx.lineTo(this.LOGICAL_W, CONFIG.BORDER + CONFIG.HUD_H);
    ctx.stroke();

    // lines-cleared readout: a big, always-visible counter across the top
    const linesY = CONFIG.BORDER + 17;
    this.drawPixelText(ctx, "LINES CLEARED", this.LOGICAL_W / 2, linesY - 11, 11, PALETTE.gray, "center");
    const lcPulse = this.linesCleared > 0 ? 1 + Math.sin(performance.now() / 220) * 0.04 : 1;
    ctx.save();
    ctx.translate(this.LOGICAL_W / 2, linesY + 12);
    ctx.scale(lcPulse, lcPulse);
    this.drawPixelText(ctx, String(this.linesCleared), 0, 0, 33, this.linesCleared > 0 ? PALETTE.goldYellow : PALETTE.deepBlue, "center");
    ctx.restore();

    const statsY = CONFIG.BORDER + 60;
    this.drawPixelText(ctx, "SCORE", CONFIG.BORDER + 4, statsY - 12, 11, PALETTE.gray, "left");
    this.drawPixelText(ctx, String(this.score), CONFIG.BORDER + 4, statsY + 8, large ? 24 : 20, PALETTE.paleYellow, "left");
    this.drawPixelText(ctx, "BEST " + Math.max(this.save.highScore, this.score), CONFIG.BORDER + 4, statsY + 24, 10, PALETTE.gray, "left");

    this.drawPixelText(ctx, "TURN " + this.turn, this.LOGICAL_W / 2, statsY - 12, 12, PALETTE.gray, "center");
    this.drawPixelText(ctx, "\u00D7" + this.ballCount, this.LOGICAL_W / 2, statsY + 10, large ? 24 : 20, PALETTE.brightGreen, "center");

    // multi-square bonus readout, shown while a shot is landing hits on
    // more than one distinct block
    if (this.state === STATE.LAUNCHING && this.volleyVariety >= 2) {
      const mult = this.getVarietyMultiplier();
      const flash = 1 + Math.sin(performance.now() / 130) * 0.06;
      ctx.save();
      ctx.translate(this.LOGICAL_W / 2, statsY + 24);
      ctx.scale(flash, flash);
      this.drawPixelText(ctx, "MULTI \u00D7" + mult.toFixed(1), 0, 0, 13, PALETTE.goldYellow, "center");
      ctx.restore();
    }

    // sound toggle button top-right
    const btnSize = 34;
    this.button(ctx, this.LOGICAL_W - CONFIG.BORDER - btnSize, CONFIG.BORDER + (CONFIG.HUD_H - btnSize) / 2, btnSize, btnSize,
      this.save.soundOn ? "\u266A" : "X", () => this.toggleSound(),
      { size: 16, fill: PALETTE.navy, stroke: PALETTE.gray });
    this.button(ctx, this.LOGICAL_W - CONFIG.BORDER - btnSize * 2 - 6, CONFIG.BORDER + (CONFIG.HUD_H - btnSize) / 2, btnSize, btnSize,
      "II", () => this.togglePause(),
      { size: 14, fill: PALETTE.navy, stroke: PALETTE.gray });

    if (this.state === STATE.LAUNCHING && this.showFastForward) {
      const fx = this.LOGICAL_W - CONFIG.BORDER - 60;
      const fy = this.LOGICAL_H - 56;
      this.button(ctx, fx, fy, 60, 40, this.fastForward ? "\u25B6\u25B6 ON" : "\u25B6\u25B6",
        () => this.toggleFastForward(), { size: 13, fill: this.fastForward ? PALETTE.darkGreen : PALETTE.deepBlue });
    }

    // consolidated power-up bar: bigger badges, all active effects shown
    // together along the bottom of the screen instead of scattered around
    if (this.state === STATE.AIMING || this.state === STATE.LAUNCHING) {
      const items = [];
      if (this.explosiveTurnsLeft > 0) {
        items.push({ color: PALETTE.hotRed, icon: "2\u00D7", label: String(this.explosiveTurnsLeft) + "T" });
      }
      if (this.doubleCharges > 0 || this.volleyDouble) {
        const remaining = this.volleyDouble ? this.doubleCharges + 1 : this.doubleCharges;
        items.push({ color: POWER_INFO.double.color, icon: POWER_INFO.double.icon, label: "x" + remaining });
      }
      const activePower = this.volleyPower || this.queuedPower;
      if (activePower) {
        const info = POWER_INFO[activePower];
        items.push({ color: info.color, icon: info.icon, label: info.label.split(" ")[0] });
      }
      if (this.rewindCharges > 0) {
        items.push({ color: PALETTE.purple, icon: POWER_INFO.rewind.icon, label: String(this.rewindCharges), onClick: () => this.useRewind() });
      }

      if (items.length > 0) {
        const size = 46, gap = 8;
        const totalW = items.length * size + (items.length - 1) * gap;
        const barY = this.LOGICAL_H - 62;
        let x = this.LOGICAL_W / 2 - totalW / 2;
        for (const item of items) {
          const pulse = 1 + Math.sin(performance.now() / 170) * 0.06;
          ctx.save();
          ctx.translate(x + size / 2, barY + size / 2);
          ctx.scale(pulse, pulse);
          ctx.fillStyle = item.color;
          ctx.fillRect(-size / 2, -size / 2, size, size);
          ctx.strokeStyle = PALETTE.white;
          ctx.lineWidth = 3;
          ctx.strokeRect(-size / 2, -size / 2, size, size);
          ctx.restore();
          this.drawPixelText(ctx, item.icon, x + size / 2, barY + size / 2 - 6, 20, PALETTE.navyDeep, "center");
          this.drawPixelText(ctx, item.label, x + size / 2, barY + size - 9, 11, PALETTE.navyDeep, "center");
          if (item.onClick) this.buttons.push({ x, y: barY, w: size, h: size, onClick: item.onClick });
          x += size + gap;
        }
      }
    }
  }

  drawPauseMenu(ctx) {
    ctx.fillStyle = "rgba(4,6,12,0.86)";
    ctx.fillRect(0, 0, this.LOGICAL_W, this.LOGICAL_H);
    const cx = this.LOGICAL_W / 2;
    this.drawPixelText(ctx, "PAUSED", cx, 70, 26, PALETTE.paleYellow, "center");

    let y = 116;
    const bw = 240, bh = 42, gap = 10;
    this.button(ctx, cx - bw / 2, y, bw, bh, "RESUME", () => this.togglePause(), { fill: PALETTE.darkGreen, stroke: PALETTE.brightGreen });
    y += bh + gap;
    this.button(ctx, cx - bw / 2, y, bw, bh, "RESTART", () => { this.state = STATE.AIMING; this.startGame(); });
    y += bh + gap;
    this.button(ctx, cx - bw / 2, y, bw, bh, "SOUND: " + (this.save.soundOn ? "ON" : "OFF"), () => this.toggleSound(), { size: 15 });
    y += bh + gap;
    this.button(ctx, cx - bw / 2, y, bw, bh, "SCREEN SHAKE: " + (this.save.screenShake ? "ON" : "OFF"), () => {
      this.save.screenShake = !this.save.screenShake; SaveManager.save(this.save);
    }, { size: 14 });
    y += bh + gap;
    const tl = this.save.trajectoryLength.toUpperCase();
    this.button(ctx, cx - bw / 2, y, bw, bh, "TRAJECTORY: " + tl, () => {
      const order = ["standard", "long", "max"];
      const idx = (order.indexOf(this.save.trajectoryLength) + 1) % order.length;
      this.save.trajectoryLength = order[idx];
      SaveManager.save(this.save);
    }, { size: 14 });
    y += bh + gap;
    this.button(ctx, cx - bw / 2, y, bw, bh, "LARGE UI: " + (this.save.largeUI ? "ON" : "OFF"), () => {
      this.save.largeUI = !this.save.largeUI; SaveManager.save(this.save);
    }, { size: 15 });
    y += bh + gap;
    this.button(ctx, cx - bw / 2, y, bw, bh, "HOW TO PLAY", () => { this.prevState = STATE.PAUSED; this.state = STATE.HOWTO; });
    y += bh + gap;
    this.button(ctx, cx - bw / 2, y, bw, bh, "RETURN TO TITLE", () => { this.state = STATE.TITLE; }, { size: 15 });
  }

  drawGameOver(ctx) {
    const t = Math.min(1, this.gameOverAnimT / 0.5);
    ctx.fillStyle = "rgba(6,3,8,0.9)";
    ctx.fillRect(0, 0, this.LOGICAL_W, this.LOGICAL_H);
    const cx = this.LOGICAL_W / 2;
    ctx.save();
    ctx.globalAlpha = t;
    this.drawPixelText(ctx, "GAME OVER", cx, 110 - (1 - t) * 20, 30, PALETTE.hotRed, "center");
    ctx.restore();
    const s = this.finalStats || { score: this.score, turn: this.turn, best: this.save.highScore, destroyed: this.blocksDestroyed, seed: this.seed };
    let y = 172;
    this.drawPixelText(ctx, "FINAL SCORE  " + s.score, cx, y, 18, PALETTE.white, "center"); y += 28;
    this.drawPixelText(ctx, "TURN REACHED  " + s.turn, cx, y, 15, PALETTE.lightGray, "center"); y += 24;
    this.drawPixelText(ctx, "LINES CLEARED  " + this.linesCleared, cx, y, 15, PALETTE.goldYellow, "center"); y += 24;
    this.drawPixelText(ctx, "BEST SCORE  " + s.best, cx, y, 15, PALETTE.goldYellow, "center"); y += 24;
    this.drawPixelText(ctx, "BLOCKS DESTROYED  " + s.destroyed, cx, y, 15, PALETTE.lightGray, "center"); y += 24;
    this.drawPixelText(ctx, "SEED  " + s.seed, cx, y, 11, PALETTE.gray, "center"); y += 40;

    const bw = 220, bh = 50;
    this.button(ctx, cx - bw / 2, y, bw, bh, "PLAY AGAIN", () => this.startGame(), { fill: PALETTE.darkGreen, stroke: PALETTE.brightGreen, size: 20 });
    y += bh + 12;
    this.button(ctx, cx - 100, y, 200, 38, "REPLAY SEED", () => this.startGame(s.seed), { size: 14 });
    y += 46;
    this.button(ctx, cx - 90, y, 180, 38, "TITLE", () => { this.state = STATE.TITLE; }, { size: 15 });
  }
}

   BOOT
   ========================================================= */
window.addEventListener("load", () => {
  const canvas = document.getElementById("game");
  const game = new Game(canvas);
  window.__ricochetGame = game; // debug hook
});

})();
</script>
