<script>
(function(){
"use strict";

/* =========================================================
   CONFIG
   ========================================================= */
const CONFIG = {
  TITLE: "RICOCHET 8-BIT",
  COLS: 7,
  VISIBLE_ROWS: 9,
  CELL: 48,
  CEILING_GAP: 48,                 // empty headroom above the top block row for ceiling bank shots
  BORDER: 16,
  HUD_H: 92,
  LAUNCH_AREA_H: 104,
  BLOCK_PAD: 3,
  BALL_RADIUS: 6,
  GIANT_RADIUS_MULT: 1.9,
  GIANT_DAMAGE_MULT: 3,
  BALL_SPEED: 660,               // logical px / sec
  LAUNCH_INTERVAL_MIN: 55,
  LAUNCH_INTERVAL_MAX: 85,
  STARTING_BALLS: 10,
  MIN_AIM_DEG: 12,                // minimum degrees above horizontal
  CANCEL_ZONE_H: 64,              // drag your finger this close to the bottom edge to cancel the shot
  MAX_PREVIEW_COLLISIONS: 18,
  PREVIEW_MAX_DIST_MULT: 34,
  MAX_COLLISIONS_PER_FRAME: 10,
  ROW_ADVANCE_PAUSE_MS: 300,
  ROW_ADVANCE_ANIM_MS: 220,
  AUDIO_VOLUME_DEFAULT: 0.6,
  FASTFORWARD_MULT: 2.6,
  FASTFORWARD_SHOW_AFTER_MS: 2600,
};

const PALETTE = {
  navy:        "#0a0e1a",
  navyDeep:    "#060912",
  deepBlue:    "#132449",
  electricBlue:"#2f5dff",
  cyan:        "#3fe0ff",
  white:       "#f5f8ff",
  paleYellow:  "#fff1a8",
  goldYellow:  "#ffd23f",
  orange:      "#ff8c1a",
  hotRed:      "#ff2d55",
  magenta:     "#ff2df0",
  purple:      "#8b2dff",
  darkGreen:   "#0e6b3a",
  brightGreen: "#3dff8c",
  gray:        "#7f8aa3",
  lightGray:   "#c7cfe0",
  burgundy:    "#4a0f1f",
};

/* =========================================================
   RNG (seeded)
   ========================================================= */
function makeRng(seed) {
  // state is exposed on .s so game snapshots (for the rewind power-up)
  // can capture and restore it exactly.
  return {
    s: seed >>> 0,
    next() {
      let a = this.s | 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      this.s = a;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
  };
}
function makeSeed() {
  return (Math.floor(Math.random() * 0xffffffff)) >>> 0;
}

/* =========================================================
   SAVE MANAGER
   ========================================================= */
const SaveManager = {
  KEY: "ricochet8bit_save_v1",
  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (!raw) return this.defaults();
      const data = JSON.parse(raw);
      return Object.assign(this.defaults(), data);
    } catch (e) { return this.defaults(); }
  },
  defaults() {
    return {
      highScore: 0,
      bestTurn: 0,
      soundOn: true,
      volume: CONFIG.AUDIO_VOLUME_DEFAULT,
      screenShake: true,
      reducedMotion: false,
      largeUI: false,
      trajectoryLength: "max", // 'standard' | 'long' | 'max'
      lastSeed: null,
    };
  },
  save(data) {
    try { localStorage.setItem(this.KEY, JSON.stringify(data)); } catch (e) {}
  }
};

/* =========================================================
   AUDIO ENGINE
   ========================================================= */
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.enabled = true;
    this.volume = CONFIG.AUDIO_VOLUME_DEFAULT;
    this._lastImpactAt = 0;
    this._impactBurst = 0;
    this._unlocked = false;
  }
  unlock() {
    if (this._unlocked) return;
    this._unlocked = true;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    this.ctx = new Ctx();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.volume;
    this.master.connect(this.ctx.destination);
    if (this.ctx.state === "suspended") this.ctx.resume();
  }
  setVolume(v) { this.volume = v; if (this.master) this.master.gain.value = v; }
  setEnabled(v) { this.enabled = v; }

  _env(gainNode, t0, attack, hold, decay, peak) {
    const g = gainNode.gain;
    g.cancelScheduledValues(t0);
    g.setValueAtTime(0.0001, t0);
    g.linearRampToValueAtTime(peak, t0 + attack);
    g.setValueAtTime(peak, t0 + attack + hold);
    g.exponentialRampToValueAtTime(0.0001, t0 + attack + hold + decay);
  }

  _osc(type, freq0, freq1, dur, gainPeak, t0, extra) {
    if (!this.enabled || !this.ctx) return;
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq0, t0);
    if (freq1 !== undefined && freq1 !== freq0) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq1), t0 + dur);
    }
    this._env(gain, t0, 0.004, dur * 0.15, dur * 0.85, gainPeak);
    osc.connect(gain);
    gain.connect(this.master);
    if (extra) extra(osc, gain);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  _noise(dur, gainPeak, t0, filterFreq) {
    if (!this.enabled || !this.ctx) return;
    const ctx = this.ctx;
    const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const gain = ctx.createGain();
    this._env(gain, t0, 0.002, dur * 0.1, dur * 0.9, gainPeak);
    let node = src;
    if (filterFreq) {
      const filt = ctx.createBiquadFilter();
      filt.type = "bandpass";
      filt.frequency.value = filterFreq;
      node.connect(filt);
      node = filt;
    }
    node.connect(gain);
    gain.connect(this.master);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  }

  now() { return this.ctx ? this.ctx.currentTime : 0; }

  // Low sine "thump" layered under bigger sounds for extra weight/depth.
  _sub(freq, dur, gainPeak, t0) {
    if (!this.enabled || !this.ctx) return;
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(18, freq * 0.35), t0 + dur);
    this._env(gain, t0, 0.006, dur * 0.15, dur * 0.85, gainPeak);
    osc.connect(gain);
    gain.connect(this.master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  aimStart() { if (!this.ctx) return; this._osc("triangle", 220, 260, 0.06, 0.12, this.now()); }
  shotRelease() { if (!this.ctx) return; const t = this.now(); this._osc("square", 520, 780, 0.08, 0.16, t); this._sub(90, 0.1, 0.1, t); }
  ballLaunch(index) {
    if (!this.ctx) return;
    const t = this.now();
    this._osc("square", 700 + (index % 5) * 12, 900, 0.035, 0.08, t);
  }
  wallBounce() {
    if (!this.ctx) return;
    this._osc("triangle", 300, 220, 0.045, 0.09, this.now());
  }
  ceilingBounce() {
    if (!this.ctx) return;
    this._osc("triangle", 380, 260, 0.045, 0.1, this.now());
  }
  blockHit(strength, streak) {
    if (!this.ctx) return;
    const t = this.now();
    const now = performance.now();
    // rate-limit / thicken rapid impacts
    if (now - this._lastImpactAt < 16) { this._impactBurst++; if (this._impactBurst % 2 !== 0) return; }
    else { this._impactBurst = 0; }
    this._lastImpactAt = now;
    // each successive ball landing on the SAME square this shot nudges the
    // pitch up a little further, so a block taking repeated hits "sings"
    const streakMult = 1 + Math.min(Math.max(streak || 1, 1) - 1, 12) * 0.045;
    const base = (340 + (strength || 0) * 22 + Math.random() * 30) * streakMult;
    this._osc("square", base, base * 0.6, 0.05, 0.14, t);
    this._sub(70 + (strength || 0) * 2, 0.07, 0.07, t);
  }
  blockDestroy(comboLevel) {
    if (!this.ctx) return;
    const t = this.now();
    const pitch = 1 + Math.min(comboLevel || 0, 8) * 0.06;
    this._osc("sawtooth", 260 * pitch, 60, 0.22, 0.16, t);
    this._noise(0.16, 0.12, t, 1800);
    this._sub(120 * pitch, 0.3, 0.15, t);
  }
  bonusCollect() {
    if (!this.ctx) return;
    const t = this.now();
    this._osc("square", 520, 1180, 0.18, 0.14, t);
    this._osc("square", 780, 1560, 0.16, 0.09, t + 0.03);
  }
  laserFire() {
    if (!this.ctx) return;
    const t = this.now();
    this._osc("sawtooth", 1800, 220, 0.22, 0.15, t);
    this._noise(0.14, 0.08, t, 3200);
    this._sub(65, 0.28, 0.16, t + 0.04);
  }
  explosivePickup() {
    if (!this.ctx) return;
    const t = this.now();
    this._osc("sawtooth", 300, 900, 0.22, 0.16, t);
    this._noise(0.18, 0.1, t + 0.02, 900);
    this._sub(80, 0.24, 0.14, t);
  }
  secondChance() {
    if (!this.ctx) return;
    const t = this.now();
    this._osc("square", 440, 440, 0.14, 0.14, t);
    this._osc("square", 660, 660, 0.14, 0.14, t + 0.12);
    this._osc("square", 880, 880, 0.28, 0.16, t + 0.24);
    this._noise(0.3, 0.08, t + 0.24, 1400);
    this._sub(100, 0.4, 0.16, t);
    this._sub(140, 0.35, 0.16, t + 0.24);
  }
  boardCleared() {
    if (!this.ctx) return;
    const t = this.now();
    this._osc("square", 520, 520, 0.16, 0.15, t);
    this._osc("square", 780, 780, 0.16, 0.15, t + 0.14);
    this._osc("square", 1040, 1560, 0.34, 0.17, t + 0.28);
    this._noise(0.4, 0.1, t + 0.28, 2000);
    this._sub(90, 0.5, 0.2, t);
    this._sub(150, 0.4, 0.18, t + 0.28);
  }
  comboUp() {
    if (!this.ctx) return;
    this._osc("triangle", 900, 1200, 0.12, 0.12, this.now());
  }
  rowDescend() {
    if (!this.ctx) return;
    const t = this.now();
    this._osc("triangle", 160, 100, 0.2, 0.1, t);
    this._sub(55, 0.22, 0.09, t);
  }
  dangerWarn() {
    if (!this.ctx) return;
    const t = this.now();
    this._osc("square", 200, 160, 0.16, 0.14, t);
    this._osc("square", 200, 160, 0.16, 0.14, t + 0.18);
  }
  fastForward() {
    if (!this.ctx) return;
    this._osc("square", 500, 1000, 0.1, 0.1, this.now());
  }
  gameOver() {
    if (!this.ctx) return;
    const t = this.now();
    this._osc("sawtooth", 400, 40, 0.9, 0.16, t);
    this._noise(0.5, 0.12, t + 0.05, 600);
    this._sub(85, 0.8, 0.18, t + 0.05);
  }
  restart() {
    if (!this.ctx) return;
    this._osc("square", 300, 620, 0.14, 0.13, this.now());
  }
  uiTap() {
    if (!this.ctx) return;
    this._osc("square", 440, 440, 0.03, 0.08, this.now());
  }
}

/* =========================================================
   GEOMETRY / PHYSICS HELPERS (shared by live sim + predictor)
   ========================================================= */
const Physics = {
  // Swept circle vs axis-aligned rect. Returns {t, nx, ny} or null.
  // cx,cy = circle start; dx,dy = direction (unit); maxDist = distance budget
  sweptCircleRect(cx, cy, dx, dy, maxDist, rect, radius) {
    // Expand rect by radius (Minkowski sum), slab test for the rectangular
    // core, then patch corner regions with true circle-vs-point tests.
    const left = rect.x - radius, right = rect.x + rect.w + radius;
    const top = rect.y - radius, bottom = rect.y + rect.h + radius;

    let tmin = 0, tmax = maxDist;
    let nx = 0, ny = 0;

    // X slab
    if (Math.abs(dx) < 1e-9) {
      if (cx < left || cx > right) return null;
    } else {
      let t1 = (left - cx) / dx, t2 = (right - cx) / dx;
      let sign = -1;
      if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; sign = 1; }
      if (t1 > tmin) { tmin = t1; nx = sign; ny = 0; }
      if (t2 < tmax) tmax = t2;
      if (tmin > tmax) return null;
    }
    // Y slab
    if (Math.abs(dy) < 1e-9) {
      if (cy < top || cy > bottom) return null;
    } else {
      let t1 = (top - cy) / dy, t2 = (bottom - cy) / dy;
      let sign = -1;
      if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; sign = 1; }
      if (t1 > tmin) { tmin = t1; nx = 0; ny = sign; }
      if (t2 < tmax) tmax = t2;
      if (tmin > tmax) return null;
    }
    if (tmin < 0 || tmin > maxDist) return null;

    // Corner correction: if the hit point's projected coordinate lies
    // outside the true rect on the axis that wasn't the limiting one,
    // it's actually a corner hit -- redo as circle-vs-point.
    const hx = cx + dx * tmin, hy = cy + dy * tmin;
    let cornerX = null, cornerY = null;
    if (hx < rect.x) cornerX = rect.x; else if (hx > rect.x + rect.w) cornerX = rect.x + rect.w;
    if (hy < rect.y) cornerY = rect.y; else if (hy > rect.y + rect.h) cornerY = rect.y + rect.h;
    if (cornerX !== null && cornerY !== null) {
      const t = Physics.circleVsPoint(cx, cy, dx, dy, maxDist, cornerX, cornerY, radius);
      if (!t) return null;
      return t;
    }
    return { t: tmin, nx, ny };
  },

  circleVsPoint(cx, cy, dx, dy, maxDist, px, py, radius) {
    // Solve |P + D*t - C|^2 = r^2 for smallest t >= 0
    const ox = cx - px, oy = cy - py;
    const a = dx * dx + dy * dy;
    const b = 2 * (ox * dx + oy * dy);
    const c = ox * ox + oy * oy - radius * radius;
    const disc = b * b - 4 * a * c;
    if (disc < 0) return null;
    const sq = Math.sqrt(disc);
    const t1 = (-b - sq) / (2 * a);
    let t = t1;
    if (t < 0) {
      const t2 = (-b + sq) / (2 * a);
      t = t2;
    }
    if (t < 0 || t > maxDist) return null;
    const hx = cx + dx * t, hy = cy + dy * t;
    let nx = hx - px, ny = hy - py;
    const len = Math.hypot(nx, ny) || 1;
    nx /= len; ny /= len;
    return { t, nx, ny };
  },

  reflect(dx, dy, nx, ny) {
    const dot = dx * nx + dy * ny;
    return { x: dx - 2 * dot * nx, y: dy - 2 * dot * ny };
  }
};

/* =========================================================
   BOARD
   ========================================================= */
class Block {
  constructor(row, col, hp, isBomb, isLaser, cells) {
    this.row = row;           // float row (top-left anchor cell, top = 0)
    this.col = col;           // leftmost anchor column
    this.cells = (cells && cells.length) ? cells : [{ dr: 0, dc: 0 }]; // shape as offsets from (row,col)
    this.hp = hp;
    this.maxHp = hp;
    this.isBomb = !!isBomb;   // exploding square: splash-damages neighbors on destroy
    this.isLaser = !!isLaser; // laser blaster: fires beams in all 4 directions on destroy
    this.destroyed = false;
    this.hitFlash = 0;
    this.recoil = 0;
    this.fillLevel = 1;       // animated 0..1 "remaining health" level, drops smoothly on hits
    this.hitStreak = 0;       // consecutive hits landed on this block within the current shot
    this.hitThisVolley = false; // whether this block has been hit at least once this shot
    this.dangerOutlinePhase = Math.random() * Math.PI * 2;
  }
  get width() { return Math.max(...this.cells.map(c => c.dc)) + 1; }
  get height() { return Math.max(...this.cells.map(c => c.dr)) + 1; }
  // absolute {row,col} of every cell this shape occupies right now
  cellCoords() {
    const r0 = Math.round(this.row);
    return this.cells.map(c => ({ row: r0 + c.dr, col: this.col + c.dc }));
  }
  // one collision rect per occupied cell -- used for physics and rendering
  rects(board) {
    const pad = CONFIG.BLOCK_PAD;
    return this.cells.map(c => ({
      x: board.x + (this.col + c.dc) * CONFIG.CELL + pad,
      y: board.gridY + (this.row + c.dr) * CONFIG.CELL + pad,
      w: CONFIG.CELL - pad * 2,
      h: CONFIG.CELL - pad * 2
    }));
  }
  // the shape's outer bounding box -- used for particle/text placement
  boundingRect(board) {
    const pad = CONFIG.BLOCK_PAD;
    const x = board.x + this.col * CONFIG.CELL + pad;
    const y = board.gridY + this.row * CONFIG.CELL + pad;
    const w = this.width * CONFIG.CELL - pad * 2;
    const h = this.height * CONFIG.CELL - pad * 2;
    return { x, y, w, h };
  }
  strengthBand(turn) {
    const ratio = this.maxHp / Math.max(1, turn);
    if (ratio >= 1.8) return "extreme";
    if (ratio >= 1.35) return "strong";
    if (ratio >= 0.9) return "moderate";
    return "weak";
  }
}

class Token {
  constructor(row, col, value) {
    this.row = row;
    this.col = col;
    this.value = value; // 1 or 3
    this.collected = false;
    this.phase = Math.random() * Math.PI * 2;
  }
  center(board) {
    return {
      x: board.x + (this.col + 0.5) * CONFIG.CELL,
      y: board.gridY + (this.row + 0.5) * CONFIG.CELL
    };
  }
}

class PowerToken {
  constructor(row, col, power) {
    this.row = row;
    this.col = col;
    this.power = power;
    this.collected = false;
    this.phase = Math.random() * Math.PI * 2;
  }
  center(board) {
    return {
      x: board.x + (this.col + 0.5) * CONFIG.CELL,
      y: board.gridY + (this.row + 0.5) * CONFIG.CELL
    };
  }
}

const POWER_TYPES = ["fireball", "split", "ricochet", "bomb", "freeze", "rewind", "double", "giant", "homing"];
const POWER_INFO = {
  fireball: { label: "FIREBALL", color: PALETTE.orange, icon: "F" },
  split:    { label: "SPLIT BALL", color: PALETTE.cyan, icon: "S" },
  ricochet: { label: "RICOCHET", color: PALETTE.magenta, icon: "R" },
  bomb:     { label: "BOMB", color: PALETTE.hotRed, icon: "X" },
  freeze:   { label: "FREEZE", color: PALETTE.electricBlue, icon: "Z" },
  rewind:   { label: "REWIND", color: PALETTE.purple, icon: "\u21BA" },
  double:   { label: "DOUBLE DMG", color: PALETTE.goldYellow, icon: "\u2605" },
  giant:    { label: "GIANT BALLS", color: PALETTE.brightGreen, icon: "\u25CF" },
  homing:   { label: "HOMING", color: PALETTE.paleYellow, icon: "\u25CE" },
};

class Board {
  constructor(x, y, seed) {
    this.x = x; this.y = y;
    this.gridY = y + CONFIG.CEILING_GAP; // top-of-blocks line; leaves headroom above for ceiling bank shots
    this.w = CONFIG.COLS * CONFIG.CELL;
    this.h = CONFIG.CEILING_GAP + CONFIG.VISIBLE_ROWS * CONFIG.CELL;
    this.blocks = [];
    this.tokens = [];
    this.powerTokens = [];
    this.explosivePickup = null; // {col} -- sits fixed in the bottom row, doesn't scroll
    this.lastExplosiveTurn = -99;
    this.rng = makeRng(seed);
    this.seed = seed;
    this.lastTokenTurn = -99;
    this.lastPowerTurn = -99;
    this.rowAnimT = 0; // 0..1 during row-advance animation
    this.animating = false;
  }

  reset(seed) {
    this.rng = makeRng(seed);
    this.seed = seed;
    this.blocks = [];
    this.tokens = [];
    this.powerTokens = [];
    this.explosivePickup = null;
    this.lastExplosiveTurn = -99;
    this.lastTokenTurn = -99;
    this.lastPowerTurn = -99;
  }

  // the bottom-most visible row, where the explosive-ball pickup lives
  bottomRowIndex() { return CONFIG.VISIBLE_ROWS - 1; }

  wallRect() {
    return { left: this.x, right: this.x + this.w, top: this.y, bottom: this.y + this.h };
  }

  aliveBlocks() { return this.blocks.filter(b => !b.destroyed); }

  blockAt(row, col) {
    for (const b of this.blocks) {
      if (b.destroyed) continue;
      if (b.cellCoords().some(c => c.row === row && c.col === col)) return b;
    }
    return null;
  }

  occupancyForRow(rowIndex) {
    const occ = new Array(CONFIG.COLS).fill(false);
    for (const b of this.blocks) {
      if (b.destroyed) continue;
      for (const c of b.cellCoords()) if (c.row === rowIndex) occ[c.col] = true;
    }
    for (const t of this.tokens) {
      if (t.collected) continue;
      if (Math.round(t.row) !== rowIndex) continue;
      occ[t.col] = true;
    }
    for (const t of this.powerTokens) {
      if (t.collected) continue;
      if (Math.round(t.row) !== rowIndex) continue;
      occ[t.col] = true;
    }
    return occ;
  }

  // Shape library for the big multi-row specials: 2x2/3x3/4x4 giant squares
  // plus classic L and T pieces (each 2 rows tall).
  bigShapeCandidates(turn) {
    const shapes = [];
    if (turn >= 6) {
      shapes.push({ name: "L", cells: [{ dr: 0, dc: 0 }, { dr: 1, dc: 0 }, { dr: 1, dc: 1 }, { dr: 1, dc: 2 }] });
      shapes.push({ name: "T", cells: [{ dr: 0, dc: 0 }, { dr: 0, dc: 1 }, { dr: 0, dc: 2 }, { dr: 1, dc: 1 }] });
      shapes.push({ name: "giant2", cells: [{ dr: 0, dc: 0 }, { dr: 0, dc: 1 }, { dr: 1, dc: 0 }, { dr: 1, dc: 1 }] });
    }
    if (turn >= 10) {
      const g3 = [];
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) g3.push({ dr: r, dc: c });
      shapes.push({ name: "giant3", cells: g3 });
    }
    if (turn >= 15) {
      const g4 = [];
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) g4.push({ dr: r, dc: c });
      shapes.push({ name: "giant4", cells: g4 });
    }
    return shapes;
  }

  // Occasionally tries to drop a big multi-row shape anchored at row 0,
  // checked against whatever's already sitting in the rows below it.
  // Returns {col, cells, hp} or null.
  tryPlaceBigShape(turn) {
    const shapes = this.bigShapeCandidates(turn);
    if (!shapes.length) return null;
    if (this.rng.next() > 0.14) return null;
    const shape = shapes[Math.floor(this.rng.next() * shapes.length)];
    const wSpan = Math.max(...shape.cells.map(c => c.dc)) + 1;
    for (let attempt = 0; attempt < 14; attempt++) {
      const col = Math.floor(this.rng.next() * (CONFIG.COLS - wSpan + 1));
      let clear = true;
      for (const c of shape.cells) {
        const r = c.dr, cc = col + c.dc;
        if (this.blockAt(r, cc)) { clear = false; break; }
        if (this.tokens.some(t => !t.collected && Math.round(t.row) === r && t.col === cc)) { clear = false; break; }
        if (this.powerTokens.some(t => !t.collected && Math.round(t.row) === r && t.col === cc)) { clear = false; break; }
      }
      if (clear) {
        const cellCount = shape.cells.length;
        const hp = Math.max(1, Math.round(this.rollHp(turn) * (1 + (cellCount - 1) * 0.25)));
        return { col, cells: shape.cells, hp };
      }
    }
    return null;
  }

  // Generate a fair new row for the given turn number. Returns list of
  // {col,cells,hp,isBomb,isLaser} block specs, {col,value} token specs, and
  // {col,power} power-token specs (row = 0). reservedCols marks columns
  // already claimed by a big shape placed this turn.
  generateRow(turn, guaranteeToken, guaranteePower, reservedCols) {
    reservedCols = reservedCols || new Set();
    for (let attempt = 0; attempt < 30; attempt++) {
      const occ = new Array(CONFIG.COLS).fill(false);
      for (const rc of reservedCols) occ[rc] = true;
      const blockSpecs = [];
      const tokenSpecs = [];
      const powerSpecs = [];
      let openLanes = 0;
      let col = 0;
      const fillChance = Math.min(0.62, 0.34 + turn * 0.012);
      while (col < CONFIG.COLS) {
        if (occ[col]) { col++; continue; } // reserved by a big shape this turn
        const r = this.rng.next();
        if (r > fillChance) {
          occ[col] = false; openLanes++; col++;
          continue;
        }
        // occasional 2-wide rectangular block
        const canWide = col <= CONFIG.COLS - 2 && !occ[col + 1] && this.rng.next() < 0.22;
        const width = canWide ? 2 : 1;
        const hp = this.rollHp(turn);
        const isBomb = turn >= 3 && this.rng.next() < 0.07;
        const isLaser = !isBomb && turn >= 4 && this.rng.next() < 0.05;
        const cells = Array.from({ length: width }, (_, i) => ({ dr: 0, dc: i }));
        blockSpecs.push({ col, cells, hp, isBomb, isLaser });
        for (let k = 0; k < width; k++) occ[col + k] = true;
        col += width;
      }
      if (openLanes === 0) continue; // must have at least one open lane
      // fully solid guard (shouldn't happen given above, but double check)
      if (occ.every(v => v)) continue;

      const openCols = [];
      for (let c = 0; c < CONFIG.COLS; c++) if (!occ[c]) openCols.push(c);

      // +1/+3 ball token
      let placeToken = guaranteeToken || (this.rng.next() < 0.30);
      if (placeToken && openCols.length > 0) {
        const idx = Math.floor(this.rng.next() * openCols.length);
        const c = openCols.splice(idx, 1)[0];
        const isBig = turn > 12 && this.rng.next() < 0.08;
        tokenSpecs.push({ col: c, value: isBig ? 3 : 1 });
      } else if (guaranteeToken && openCols.length === 0) {
        continue; // retry: need an open cell for guaranteed token
      }

      // power-up token (separate from the ball token, rarer)
      let placePower = guaranteePower || (turn >= 2 && this.rng.next() < 0.16);
      if (placePower && openCols.length > 0) {
        const idx = Math.floor(this.rng.next() * openCols.length);
        const c = openCols.splice(idx, 1)[0];
        const type = POWER_TYPES[Math.floor(this.rng.next() * POWER_TYPES.length)];
        powerSpecs.push({ col: c, power: type });
      } else if (guaranteePower && openCols.length === 0) {
        continue;
      }

      return { blockSpecs, tokenSpecs, powerSpecs };
    }
    // Fallback: guaranteed-safe simple row
    const mid = Math.floor(CONFIG.COLS / 2);
    return { blockSpecs: [{ col: 0, cells: [{ dr: 0, dc: 0 }], hp: this.rollHp(turn), isBomb: false, isLaser: false }], tokenSpecs: [{ col: mid, value: 1 }], powerSpecs: [] };
  }

  rollHp(turn) {
    const r = this.rng.next();
    let ratio;
    if (r < 0.12) ratio = 0.35 + this.rng.next() * 0.3;          // weak
    else if (r < 0.85) ratio = 0.7 + this.rng.next() * 0.6;       // common 0.7-1.3
    else ratio = 1.8 + this.rng.next() * 0.4;                     // armored 1.8-2.2
    return Math.max(1, Math.round(ratio * Math.max(1, turn)));
  }

  addRowAtTop(spec) {
    for (const bs of spec.blockSpecs) {
      this.blocks.push(new Block(0, bs.col, bs.hp, bs.isBomb, bs.isLaser, bs.cells));
    }
    for (const ts of spec.tokenSpecs) {
      this.tokens.push(new Token(0, ts.col, ts.value));
    }
    for (const ps of (spec.powerSpecs || [])) {
      this.powerTokens.push(new PowerToken(0, ps.col, ps.power));
    }
  }

  // returns true if a block crossed the danger line (uses each block's
  // lowest occupied row, since tall shapes can hang well below their anchor)
  shiftDown() {
    for (const b of this.blocks) b.row += 1;
    for (const t of this.tokens) t.row += 1;
    for (const p of this.powerTokens) p.row += 1;
    // purge tokens that fell fully out (safety)
    this.tokens = this.tokens.filter(t => t.row < CONFIG.VISIBLE_ROWS + 1);
    this.powerTokens = this.powerTokens.filter(p => p.row < CONFIG.VISIBLE_ROWS + 1);
    let danger = false;
    for (const b of this.blocks) {
      if (b.destroyed) continue;
      const maxRow = Math.round(b.row) + (b.height - 1);
      if (maxRow >= CONFIG.VISIBLE_ROWS - 1) danger = true;
    }
    return danger;
  }

  isRowFull(rowIndex) {
    const occ = this.occupancyForRow(rowIndex);
    return occ.every(v => v);
  }
}

class Ball {
  constructor(x, y, dirX, dirY) {
    this.x = x; this.y = y;
    this.dx = dirX; this.dy = dirY;
    this.speed = CONFIG.BALL_SPEED;
    this.active = true;
    this.returned = false;
    this.trailPts = [];
    this.launched = false;
    this.stuckTimer = 0;
    this.wallBounces = 0;
    this.radius = CONFIG.BALL_RADIUS; // overridden per-ball by the Giant Balls power-up
    // one-shot power-up charges, applied only to the first ball of a volley
    this.fireballCharge = false;
    this.splitCharge = false;
    this.bombCharge = false;
  }
}

/* =========================================================
   PARTICLE SYSTEM
   ========================================================= */
class ParticleSystem {
  constructor() { this.particles = []; this.popups = []; this.pops = []; }
  reset() { this.particles.length = 0; this.popups.length = 0; this.pops.length = 0; }

  hitBurst(x, y, color) {
    const n = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 90;
      this.particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.22, age: 0, size: 2 + Math.random() * 2, color
      });
    }
  }

  explosion(x, y, color) {
    const dirs = 8;
    for (let i = 0; i < dirs; i++) {
      const a = (i / dirs) * Math.PI * 2 + Math.random() * 0.2;
      const sp = 110 + Math.random() * 140;
      this.particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.38, age: 0, size: 3 + Math.random() * 3, color
      });
    }
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * 60;
      this.particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.22, age: 0, size: 4, color: PALETTE.white
      });
    }
  }

  starburst(x, y) {
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      const sp = 90 + Math.random() * 70;
      this.particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.32, age: 0, size: 2.5, color: PALETTE.goldYellow
      });
    }
  }

  scorePopup(x, y, text, color) {
    this.popups.push({ x, y, text, color, age: 0, life: 0.9 });
  }

  // A quick expanding, fading ring of color -- extra visual "pop" layered
  // on top of the particle burst whenever a block is destroyed.
  pop(x, y, color) {
    this.pops.push({ x, y, color, age: 0, life: 0.45 });
  }

  update(dt) {
    for (const p of this.particles) {
      p.age += dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92;
    }
    this.particles = this.particles.filter(p => p.age < p.life);
    for (const s of this.popups) { s.age += dt; s.y -= dt * 26; }
    this.popups = this.popups.filter(s => s.age < s.life);
    for (const r of this.pops) r.age += dt;
    this.pops = this.pops.filter(r => r.age < r.life);
  }

  draw(ctx) {
    for (const r of this.pops) {
      const t = r.age / r.life;
      const radius = 4 + t * 34;
      ctx.save();
      ctx.globalAlpha = Math.max(0, (1 - t) * 0.85);
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 4 * (1 - t) + 1;
      ctx.beginPath();
      ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      if (t < 0.3) {
        ctx.globalAlpha = Math.max(0, (0.3 - t) / 0.3) * 0.6;
        ctx.fillStyle = PALETTE.white;
        ctx.beginPath();
        ctx.arc(r.x, r.y, 8 * (1 - t / 0.3), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    for (const p of this.particles) {
      const a = 1 - p.age / p.life;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = p.color;
      const s = p.size;
      ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), Math.round(s), Math.round(s));
    }
    ctx.globalAlpha = 1;
    ctx.font = "bold 13px Helvetica, Arial, sans-serif";
    ctx.textAlign = "center";
    for (const s of this.popups) {
      const a = 1 - s.age / s.life;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = s.color;
      ctx.fillText(s.text, s.x, s.y);
    }
    ctx.globalAlpha = 1;
  }
}

/* =========================================================
   TRAJECTORY PREDICTOR
   ========================================================= */
const TrajectoryPredictor = {
  // Returns array of points [{x,y,impact:bool}] representing the path.
  predict(startX, startY, dirX, dirY, board, radius, maxCollisions, maxDist) {
    const points = [{ x: startX, y: startY, impact: false }];
    let cx = startX, cy = startY, dx = dirX, dy = dirY;
    let remaining = maxDist;
    const wall = board.wallRect();
    const blockRects = board.aliveBlocks().flatMap(b => b.rects(board));

    for (let i = 0; i < maxCollisions && remaining > 0; i++) {
      const hit = findNearestCollision(cx, cy, dx, dy, remaining, wall, blockRects, radius);
      if (!hit) {
        points.push({ x: cx + dx * remaining, y: cy + dy * remaining, impact: false });
        break;
      }
      const hx = cx + dx * hit.t, hy = cy + dy * hit.t;
      points.push({ x: hx, y: hy, impact: true });
      const r = Physics.reflect(dx, dy, hit.nx, hit.ny);
      dx = r.x; dy = r.y;
      // nudge off surface to avoid re-hitting same point
      cx = hx + dx * 0.05; cy = hy + dy * 0.05;
      remaining -= hit.t;
      // stop preview once it would exit through the bottom (returned)
      if (cy > board.y + board.h + radius * 2 && dy > 0) break;
    }
    return points;
  }
};

function findNearestCollision(cx, cy, dx, dy, maxDist, wall, blockRects, radius) {
  let best = null;
  // left wall
  if (dx < 0) {
    const t = (wall.left + radius - cx) / dx;
    if (t >= 0 && t <= maxDist) { if (!best || t < best.t) best = { t, nx: -1, ny: 0 }; }
  }
  // right wall
  if (dx > 0) {
    const t = (wall.right - radius - cx) / dx;
    if (t >= 0 && t <= maxDist) { if (!best || t < best.t) best = { t, nx: 1, ny: 0 }; }
  }
  // ceiling
  if (dy < 0) {
    const t = (wall.top + radius - cy) / dy;
    if (t >= 0 && t <= maxDist) { if (!best || t < best.t) best = { t, nx: 0, ny: -1 }; }
  }
  // blocks
  for (const rect of blockRects) {
    const res = Physics.sweptCircleRect(cx, cy, dx, dy, best ? best.t : maxDist, rect, radius);
    if (res && (!best || res.t < best.t)) best = { t: res.t, nx: res.nx, ny: res.ny, rect };
  }
  return best;
}

/* =========================================================
   INPUT MANAGER
   ========================================================= */
class InputManager {
  constructor(canvas, game) {
    this.canvas = canvas;
    this.game = game;
    this.pointerId = null;
    this._bind();
  }
  _toLocal(clientX, clientY) {
    const rect = this.canvas.getBoundingClientRect();
    // Use the dpr the canvas buffer was actually sized with (captured by the
    // game's last _resize()), not a fresh devicePixelRatio read -- iOS Safari
    // can transiently report a different value mid-gesture/chrome-animation,
    // which is exactly what causes taps to land offset from the visible button.
    const dpr = this.game.dpr || window.devicePixelRatio || 1;
    const scaleX = this.canvas.width / rect.width / dpr;
    const scaleY = this.canvas.height / rect.height / dpr;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }
  _bind() {
    const c = this.canvas;
    const onDown = (e) => {
      e.preventDefault();
      this.game.audio.unlock();
      this.pointerId = e.pointerId;
      const p = this._toLocal(e.clientX, e.clientY);
      this.game.onPointerDown(p.x, p.y);
    };
    const onMove = (e) => {
      if (this.pointerId !== null && e.pointerId !== this.pointerId) return;
      e.preventDefault();
      const p = this._toLocal(e.clientX, e.clientY);
      this.game.onPointerMove(p.x, p.y);
    };
    const onUp = (e) => {
      if (this.pointerId !== null && e.pointerId !== this.pointerId) return;
      e.preventDefault();
      const p = this._toLocal(e.clientX, e.clientY);
      this.game.onPointerUp(p.x, p.y);
      this.pointerId = null;
    };
    c.addEventListener("pointerdown", onDown, { passive: false });
    c.addEventListener("pointermove", onMove, { passive: false });
    window.addEventListener("pointerup", onUp, { passive: false });
    window.addEventListener("pointercancel", onUp, { passive: false });

    document.addEventListener("touchmove", (e) => { e.preventDefault(); }, { passive: false });
    document.addEventListener("gesturestart", (e) => { e.preventDefault(); });

    window.addEventListener("keydown", (e) => this.game.onKeyDown(e));
  }
}

/* =========================================================
   GAME
   ========================================================= */
const STATE = {
  SPLASH: "splash", TITLE: "title", HOWTO: "howto", AIMING: "aiming", LAUNCHING: "launching",
  ROW_ADVANCE: "rowadvance", PAUSED: "paused", GAMEOVER: "gameover"
};

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.audio = new AudioEngine();
    this.particles = new ParticleSystem();
    this.save = SaveManager.load();

    this.LOGICAL_W = CONFIG.BORDER * 2 + CONFIG.COLS * CONFIG.CELL;
    this.LOGICAL_H = CONFIG.BORDER * 2 + CONFIG.HUD_H + CONFIG.CEILING_GAP + CONFIG.VISIBLE_ROWS * CONFIG.CELL + CONFIG.LAUNCH_AREA_H;

    const boardX = CONFIG.BORDER;
    const boardY = CONFIG.BORDER + CONFIG.HUD_H;
    this.seed = this.save.lastSeed != null ? this.save.lastSeed : makeSeed();
    this.board = new Board(boardX, boardY, this.seed);

    this.launcherX = boardX + this.board.w / 2;
    this.launcherY = boardY + this.board.h + CONFIG.LAUNCH_AREA_H * 0.5;
    this.nextLauncherX = this.launcherX;

    this.state = STATE.SPLASH;
    this.splashT = 0;
    this.prevState = null;
    this.balls = [];
    this.ballCount = CONFIG.STARTING_BALLS;
    this.turn = 1;
    this.score = 0;
    this.blocksDestroyed = 0;
    this.combo = 0;
    this.comboTimer = 0;
    this.launchQueueRemaining = 0;
    this.launchTimer = 0;
    this.volleyTime = 0;
    this.showFastForward = false;
    this.fastForward = false;
    this.rowAdvanceT = 0;
    this.rowAdvancePhase = "pause"; // pause -> anim -> spawn
    this.aiming = false;
    this.aimCancelled = false; // true once the drag has been pulled down into the cancel zone
    this.aimDX = 0; this.aimDY = -1;
    this.aimPointerX = 0; this.aimPointerY = 0;
    this.landingMarker = null;
    this.landingMarkerT = 0;
    this.shakeAmt = 0;
    this.dangerFlash = 0;
    this.buttons = [];
    this.keyAimAngle = 0; // radians offset for keyboard aim
    this.keyboardAiming = false;
    this.gameOverAnimT = 0;
    this.finalStats = null;
    // power-up state
    this.queuedPower = null;       // power waiting to be applied to the next volley/turn
    this.volleyPower = null;       // power locked in for the volley currently in flight
    this.volleyRicochet = false;
    this.doubleCharges = 0;        // remaining shots with double-strength balls
    this.volleyDouble = false;     // whether the volley in flight has double damage
    this.volleyGiant = false;      // whether the volley in flight has giant, 3x-damage balls
    this.volleyHoming = false;     // whether the volley in flight homes on the toughest block
    this.volleyVariety = 0;        // count of distinct blocks hit so far this shot (drives the multi-square bonus)
    this.ballsLaunchedThisVolley = 0;
    this.rewindCharges = 0;
    this.previousTurnSnapshot = null;
    this._frozenThisTurn = false;
    this.explosiveTurnsLeft = 0;   // explosive-ball mode: turns remaining with guaranteed double damage
    this.beamFlashes = [];         // transient laser-blaster beam visuals
    this.linesCleared = 0;         // rows cleared via the second-chance save
    this.secondChanceUsed = false; // one second chance per run
    this.secondChanceBannerT = 0;  // seconds remaining to show the big banner
    this._clearBonusAwarded = false; // guards against re-awarding the board-clear bonus

    this._resize = this._resize.bind(this);
    window.addEventListener("resize", this._resize);
    window.addEventListener("orientationchange", this._resize);
    window.addEventListener("pageshow", this._resize);
    if (window.visualViewport) {
      // iOS Safari animates its address/toolbar chrome in and out without
      // always firing a window "resize" -- visualViewport does, and is also
      // the more accurate source for the actually-visible/tappable area.
      window.visualViewport.addEventListener("resize", this._resize);
      window.visualViewport.addEventListener("scroll", this._resize);
    }
    document.addEventListener("visibilitychange", () => {
      this.tabHidden = document.hidden;
      if (!document.hidden) this._resize();
    });
    this._resize();
    // Safari's chrome can still settle a little after first paint (and right
    // after the very first touch); re-measure a couple of times so the
    // canvas's on-screen box -- and therefore tap mapping -- stays accurate.
    setTimeout(this._resize, 60);
    setTimeout(this._resize, 350);

    this.input = new InputManager(canvas, this);
    this.audio.setEnabled(this.save.soundOn);
    this.audio.setVolume(this.save.volume);

    this.last = performance.now();
    this.acc = 0;
    this.FIXED_DT = 1 / 120;
    requestAnimationFrame((t) => this.loop(t));

    this._initFirstBoard();
  }

  _initFirstBoard() {
    // gentle opening rows, guaranteeing a token within first two turns
    this.board.reset(this.seed);
    for (let r = 0; r < 3; r++) {
      const guarantee = r === 1;
      const spec = this.board.generateRow(1, guarantee);
      this.board.addRowAtTop(spec);
      this.board.blocks.forEach(b => { if (b.row === 0) b.row = CONFIG.VISIBLE_ROWS - 6 + r; });
      this.board.tokens.forEach(t => { if (t.row === 0) t.row = CONFIG.VISIBLE_ROWS - 6 + r; });
    }
  }

  _resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const vv = window.visualViewport;
    // visualViewport reflects the actually-visible/tappable area (excludes
    // collapsing browser chrome); window.innerWidth/Height can lag behind it
    // on iOS Safari, which is the classic cause of "button is drawn here but
    // I have to tap somewhere else" on mobile canvases.
    const availW = vv ? vv.width : window.innerWidth;
    const availH = vv ? vv.height : window.innerHeight;
    const scale = Math.min(availW / this.LOGICAL_W, availH / this.LOGICAL_H);
    const cssW = Math.floor(this.LOGICAL_W * scale);
    const cssH = Math.floor(this.LOGICAL_H * scale);
    this.canvas.style.width = cssW + "px";
    this.canvas.style.height = cssH + "px";
    this.canvas.width = Math.round(this.LOGICAL_W * dpr);
    this.canvas.height = Math.round(this.LOGICAL_H * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.dpr = dpr;
  }

  persist() {
    this.save.highScore = Math.max(this.save.highScore, this.score);
    this.save.bestTurn = Math.max(this.save.bestTurn, this.turn);
    this.save.lastSeed = this.seed;
    SaveManager.save(this.save);
  }

  /* ---------------- Reset / Start ---------------- */
  startGame(newSeed) {
    this.seed = newSeed != null ? newSeed : makeSeed();
    this.board.reset(this.seed);
    this._initFirstBoard();
    this.balls = [];
    this.ballCount = CONFIG.STARTING_BALLS;
    this.turn = 1;
    this.score = 0;
    this.blocksDestroyed = 0;
    this.combo = 0;
    this.launcherX = this.board.x + this.board.w / 2;
    this.nextLauncherX = this.launcherX;
    this.state = STATE.AIMING;
    this.gameOverAnimT = 0;
    this.queuedPower = null;
    this.volleyPower = null;
    this.volleyRicochet = false;
    this.doubleCharges = 0;
    this.volleyDouble = false;
    this.volleyGiant = false;
    this.volleyHoming = false;
    this.rewindCharges = 0;
    this._frozenThisTurn = false;
    this.explosiveTurnsLeft = 0;
    this.beamFlashes = [];
    this.linesCleared = 0;
    this.secondChanceUsed = false;
    this.secondChanceBannerT = 0;
    this._clearBonusAwarded = false;
    this.audio.restart();
    this.previousTurnSnapshot = this._takeSnapshot();
    this.persist();
  }

  /* ---------------- Snapshot / rewind ---------------- */
  _takeSnapshot() {
    return {
      turn: this.turn,
      score: this.score,
      ballCount: this.ballCount,
      blocksDestroyed: this.blocksDestroyed,
      launcherX: this.launcherX,
      nextLauncherX: this.nextLauncherX,
      rngState: this.board.rng.s,
      lastTokenTurn: this.board.lastTokenTurn,
      lastPowerTurn: this.board.lastPowerTurn,
      doubleCharges: this.doubleCharges,
      explosiveTurnsLeft: this.explosiveTurnsLeft,
      linesCleared: this.linesCleared,
      secondChanceUsed: this.secondChanceUsed,
      lastExplosiveTurn: this.board.lastExplosiveTurn,
      explosivePickup: this.board.explosivePickup ? { col: this.board.explosivePickup.col } : null,
      blocks: this.board.blocks.filter(b => !b.destroyed).map(b => ({ row: b.row, col: b.col, cells: b.cells, hp: b.hp, maxHp: b.maxHp, isBomb: b.isBomb, isLaser: b.isLaser })),
      tokens: this.board.tokens.filter(t => !t.collected).map(t => ({ row: t.row, col: t.col, value: t.value })),
      powerTokens: this.board.powerTokens.filter(p => !p.collected).map(p => ({ row: p.row, col: p.col, power: p.power })),
    };
  }

  _restoreSnapshot(snap) {
    if (!snap) return;
    this.turn = snap.turn;
    this.score = snap.score;
    this.ballCount = snap.ballCount;
    this.blocksDestroyed = snap.blocksDestroyed;
    this.launcherX = snap.launcherX;
    this.nextLauncherX = snap.nextLauncherX;
    this.board.rng.s = snap.rngState;
    this.board.lastTokenTurn = snap.lastTokenTurn;
    this.board.lastPowerTurn = snap.lastPowerTurn;
    this.doubleCharges = snap.doubleCharges || 0;
    this.explosiveTurnsLeft = snap.explosiveTurnsLeft || 0;
    this.linesCleared = snap.linesCleared || 0;
    this.secondChanceUsed = !!snap.secondChanceUsed;
    this.board.lastExplosiveTurn = snap.lastExplosiveTurn != null ? snap.lastExplosiveTurn : -99;
    this.board.explosivePickup = snap.explosivePickup ? { col: snap.explosivePickup.col } : null;
    this.board.blocks = snap.blocks.map(s => {
      const b = new Block(s.row, s.col, s.hp, s.isBomb, s.isLaser, s.cells);
      b.maxHp = s.maxHp;
      return b;
    });
    this.board.tokens = snap.tokens.map(s => new Token(s.row, s.col, s.value));
    this.board.powerTokens = snap.powerTokens.map(s => new PowerToken(s.row, s.col, s.power));
    this.balls = [];
    this.queuedPower = null;
    this.volleyPower = null;
    this.volleyDouble = false;
    this.volleyGiant = false;
    this.volleyHoming = false;
    this.state = STATE.AIMING;
  }

  useRewind() {
    if (this.rewindCharges <= 0 || this.state !== STATE.AIMING) return;
    this._restoreSnapshot(this.previousTurnSnapshot);
    this.rewindCharges--;
    this.audio.restart();
    this.particles.scorePopup(this.LOGICAL_W / 2, this.launcherY - 30, "REWOUND", PALETTE.purple);
  }

  /* ---------------- Input handlers ---------------- */
  onPointerDown(x, y) {
    if (this.state === STATE.SPLASH) { this.audio.unlock(); this.state = STATE.TITLE; return; }
    if (this._hitButtons(x, y)) return;
    if (this.state === STATE.AIMING) {
      this.aiming = true;
      this.aimCancelled = false;
      this.aimPointerX = x; this.aimPointerY = y;
      this.audio.aimStart();
      this._updateAimDir(x, y);
    }
  }
  onPointerMove(x, y) {
    if (this.aiming) {
      this.aimPointerX = x; this.aimPointerY = y;
      // Drag all the way down to the bottom edge to cancel the shot --
      // release there and nothing fires.
      const wasCancelled = this.aimCancelled;
      this.aimCancelled = y > this.LOGICAL_H - CONFIG.CANCEL_ZONE_H;
      if (this.aimCancelled && !wasCancelled) this.audio.uiTap();
      if (!this.aimCancelled) this._updateAimDir(x, y);
    }
  }
  onPointerUp(x, y) {
    if (this.aiming) {
      this.aiming = false;
      if (!this.aimCancelled) this.launchVolley();
      this.aimCancelled = false;
    }
  }
  _hitButtons(x, y) {
    const pad = 6; // small forgiveness margin around each hit box
    for (const b of this.buttons) {
      if (x >= b.x - pad && x <= b.x + b.w + pad && y >= b.y - pad && y <= b.y + b.h + pad) {
        this.audio.unlock();
        this.audio.uiTap();
        b.onClick();
        return true;
      }
    }
    return false;
  }

  _updateAimDir(px, py) {
    let dx = px - this.launcherX;
    let dy = py - this.launcherY;
    let angle = Math.atan2(dx, -dy); // 0 = straight up, +right, -left
    const maxAngle = (90 - CONFIG.MIN_AIM_DEG) * Math.PI / 180;
    if (angle > maxAngle) angle = maxAngle;
    if (angle < -maxAngle) angle = -maxAngle;
    this.aimDX = Math.sin(angle);
    this.aimDY = -Math.cos(angle);
  }

  onKeyDown(e) {
    const controlKeys = ["ArrowLeft", "ArrowRight", "Space", "Enter", "Escape", "KeyP", "KeyM", "KeyF", "KeyR"];
    if (controlKeys.indexOf(e.code) !== -1) e.preventDefault();
    if (e.code === "Escape" || e.code === "KeyP") {
      this.togglePause();
      return;
    }
    if (e.code === "KeyM") { this.toggleSound(); return; }
    if (e.code === "KeyF") { this.toggleFastForward(); return; }
    if (e.code === "KeyR") { if (this.state === STATE.GAMEOVER) this.startGame(); return; }

    if (this.state === STATE.AIMING) {
      const step = e.shiftKey ? 0.02 : 0.06;
      if (e.code === "ArrowLeft") {
        this.keyboardAiming = true;
        this.keyAimAngle = Math.max(-1, this.keyAimAngle - step);
        this._applyKeyAim();
      } else if (e.code === "ArrowRight") {
        this.keyboardAiming = true;
        this.keyAimAngle = Math.min(1, this.keyAimAngle + step);
        this._applyKeyAim();
      } else if (e.code === "Space" || e.code === "Enter") {
        if (this.keyboardAiming) this.launchVolley();
      }
    }
  }
  _applyKeyAim() {
    const maxAngle = (90 - CONFIG.MIN_AIM_DEG) * Math.PI / 180;
    const angle = this.keyAimAngle * maxAngle;
    this.aimDX = Math.sin(angle);
    this.aimDY = -Math.cos(angle);
  }

  togglePause() {
    if (this.state === STATE.PAUSED) {
      this.state = this.prevState || STATE.AIMING;
    } else if (this.state === STATE.AIMING || this.state === STATE.LAUNCHING || this.state === STATE.ROW_ADVANCE) {
      this.prevState = this.state;
      this.state = STATE.PAUSED;
    }
  }
  toggleSound() {
    this.save.soundOn = !this.save.soundOn;
    this.audio.setEnabled(this.save.soundOn);
    SaveManager.save(this.save);
  }
  toggleFastForward() {
    if (this.state !== STATE.LAUNCHING) return;
    this.fastForward = !this.fastForward;
    if (this.fastForward) this.audio.fastForward();
  }

  /* ---------------- Launch ---------------- */
  launchVolley() {
    if (this.state !== STATE.AIMING) return;
    this.keyboardAiming = false;
    this.audio.shotRelease();
    this.state = STATE.LAUNCHING;
    this.launchQueueRemaining = this.ballCount;
    this.launchTimer = 0;
    this.volleyTime = 0;
    this.fastForward = false;
    this.showFastForward = false;
    this.balls = [];
    this.ballsLaunchedThisVolley = 0;
    // lock in whichever power-up (if any) was queued for this shot
    this.volleyPower = this.queuedPower;
    this.volleyRicochet = (this.queuedPower === "ricochet");
    this.volleyGiant = (this.queuedPower === "giant");
    this.volleyHoming = (this.queuedPower === "homing");
    this.queuedPower = null;
    // double-strength balls: consumes one of the banked charges per shot
    this.volleyDouble = this.doubleCharges > 0;
    if (this.volleyDouble) this.doubleCharges--;
    // reset per-shot hit tracking used for the pitch-rise and multi-square bonus
    this.volleyVariety = 0;
    for (const bl of this.board.blocks) {
      bl.hitStreak = 0;
      bl.hitThisVolley = false;
    }
  }

  spawnBall() {
    const b = new Ball(this.launcherX, this.launcherY, this.aimDX, this.aimDY);
    const isFirst = this.ballsLaunchedThisVolley === 0;
    if (isFirst) {
      if (this.volleyPower === "fireball") b.fireballCharge = true;
      if (this.volleyPower === "split") b.splitCharge = true;
      if (this.volleyPower === "bomb") b.bombCharge = true;
    }
    // Giant Balls applies to every ball in the volley, not just the first
    if (this.volleyGiant) b.radius = CONFIG.BALL_RADIUS * CONFIG.GIANT_RADIUS_MULT;
    this.balls.push(b);
    this.ballsLaunchedThisVolley++;
    this.audio.ballLaunch(this.ballCount - this.launchQueueRemaining);
  }

  /* ---------------- Update ---------------- */
  loop(t) {
    let dt = (t - this.last) / 1000;
    this.last = t;
    if (dt > 0.05) dt = 0.05;
    if (!this.tabHidden) this.update(dt);
    this.render();
    requestAnimationFrame((tt) => this.loop(tt));
  }

  update(dt) {
    if (this.state === STATE.PAUSED) return;
    if (this.state === STATE.SPLASH) {
      this.splashT += dt;
      if (this.splashT > 2.0) this.state = STATE.TITLE;
      return;
    }

    this.particles.update(dt);
    if (this.shakeAmt > 0) this.shakeAmt = Math.max(0, this.shakeAmt - dt * 12);
    if (this.dangerFlash > 0) this.dangerFlash -= dt;
    if (this.secondChanceBannerT > 0) this.secondChanceBannerT -= dt;
    if (this.beamFlashes.length) {
      for (const bf of this.beamFlashes) bf.life -= dt;
      this.beamFlashes = this.beamFlashes.filter(bf => bf.life > 0);
    }

    if (this.state === STATE.LAUNCHING) this.updateLaunching(dt);
    else if (this.state === STATE.ROW_ADVANCE) this.updateRowAdvance(dt);

    for (const bl of this.board.blocks) {
      if (bl.hitFlash > 0) bl.hitFlash -= dt * 6;
      if (bl.recoil > 0) bl.recoil -= dt * 8;
      // slowly drain the health-level line toward the block's true remaining HP
      const targetFill = bl.destroyed ? 0 : bl.hp / bl.maxHp;
      bl.fillLevel += (targetFill - bl.fillLevel) * Math.min(1, dt * 4.5);
      if (Math.abs(bl.fillLevel - targetFill) < 0.002) bl.fillLevel = targetFill;
    }
    if (this.landingMarkerT > 0) this.landingMarkerT -= dt;
    if (this.comboTimer > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) this.combo = 0;
    }
    if (this.state === STATE.GAMEOVER) this.gameOverAnimT += dt;
  }

  updateLaunching(dt) {
    this.volleyTime += dt;
    if (!this.showFastForward && this.volleyTime * 1000 > CONFIG.FASTFORWARD_SHOW_AFTER_MS) {
      this.showFastForward = true;
    }
    const speedMult = this.fastForward ? CONFIG.FASTFORWARD_MULT : 1;
    const steps = this.fastForward ? 3 : 1;
    const subDt = (dt * speedMult) / steps;

    // launch queue
    this.launchTimer -= dt * 1000 * speedMult;
    if (this.launchQueueRemaining > 0 && this.launchTimer <= 0) {
      this.spawnBall();
      this.launchQueueRemaining--;
      this.launchTimer = CONFIG.LAUNCH_INTERVAL_MIN + Math.random() * (CONFIG.LAUNCH_INTERVAL_MAX - CONFIG.LAUNCH_INTERVAL_MIN);
    }

    for (let s = 0; s < steps; s++) this.stepBalls(subDt);

    const allReturned = this.launchQueueRemaining === 0 && this.balls.every(b => b.returned);
    if (allReturned && this.balls.length > 0) {
      this.state = STATE.ROW_ADVANCE;
      this.rowAdvancePhase = "pause";
      this.rowAdvanceT = 0;
      this.launcherX = this.nextLauncherX;
    }
  }

  stepBalls(dt) {
    const wall = this.board.wallRect();
    // Live, shared block list for this step -- mutated in place as blocks
    // are destroyed so every ball (and every collision within a ball's
    // path this step) sees an up-to-date board. Multi-cell shapes (L/T/
    // giant squares) contribute one rect per cell, all pointing back at
    // the same Block so a hit anywhere on the shape damages the whole thing.
    const blockRects = [];
    const blockRefs = [];
    for (const b of this.board.blocks) {
      if (b.destroyed) continue;
      for (const r of b.rects(this.board)) {
        blockRects.push(r);
        blockRefs.push(b);
      }
    }

    for (const ball of this.balls) {
      if (ball.returned) continue;
      if (this.volleyHoming) this.applyHoming(ball, dt);
      let remaining = ball.speed * dt;
      let collisions = 0;
      while (remaining > 1e-6 && collisions < CONFIG.MAX_COLLISIONS_PER_FRAME) {
        const hit = findNearestCollision(ball.x, ball.y, ball.dx, ball.dy, remaining, wall, blockRects, ball.radius);
        if (!hit) {
          ball.x += ball.dx * remaining;
          ball.y += ball.dy * remaining;
          remaining = 0;
          break;
        }
        ball.x += ball.dx * hit.t;
        ball.y += ball.dy * hit.t;
        remaining -= hit.t;
        collisions++;

        if (hit.rect) {
          const idx = blockRects.indexOf(hit.rect);
          const blk = blockRefs[idx];
          const passThrough = ball.fireballCharge;
          if (passThrough) {
            // Fireball: no reflection -- burn straight through the first block.
            ball.x += ball.dx * 0.6; ball.y += ball.dy * 0.6;
            ball.fireballCharge = false;
          } else {
            const r = Physics.reflect(ball.dx, ball.dy, hit.nx, hit.ny);
            ball.dx = r.x; ball.dy = r.y;
            ball.x += ball.dx * 0.4; ball.y += ball.dy * 0.4;
          }
          const dmg = (this.volleyRicochet ? (1 + ball.wallBounces) : 1) * (this.volleyDouble ? 2 : 1) * (this.explosiveTurnsLeft > 0 ? 2 : 1) * (this.volleyGiant ? CONFIG.GIANT_DAMAGE_MULT : 1);
          this.onBlockHit(blk, ball.x, ball.y, dmg);
          if (ball.bombCharge) {
            this.explodeAt(blk, ball.x, ball.y);
            ball.bombCharge = false;
          }
          if (ball.splitCharge) {
            this._splitBall(ball);
            ball.splitCharge = false;
          }
          if (blk.destroyed && idx >= 0) {
            for (let i = blockRects.length - 1; i >= 0; i--) {
              if (blockRefs[i] === blk) { blockRects.splice(i, 1); blockRefs.splice(i, 1); }
            }
          }
        } else {
          const r = Physics.reflect(ball.dx, ball.dy, hit.nx, hit.ny);
          ball.dx = r.x; ball.dy = r.y;
          ball.x += ball.dx * 0.4; ball.y += ball.dy * 0.4;
          if (hit.nx !== 0) {
            ball.wallBounces++;
            this.audio.wallBounce();
          } else {
            this.audio.ceilingBounce();
          }
          if (ball.splitCharge) {
            this._splitBall(ball);
            ball.splitCharge = false;
          }
        }
      }
      // token collection check along updated position
      this.checkTokenCollision(ball);

      // return check
      if (!ball.returned && ball.dy > 0 && ball.y > this.board.y + this.board.h + ball.radius) {
        ball.returned = true;
        if (!ball.setLauncher) {
          const clampedX = Math.max(this.board.x + 14, Math.min(this.board.x + this.board.w - 14, ball.x));
          this.nextLauncherX = clampedX;
          this.landingMarker = clampedX;
          this.landingMarkerT = 1.2;
          ball.setLauncher = true;
          this._firstReturnSet = true;
        }
      }
      ball.trailPts.push({ x: ball.x, y: ball.y });
      if (ball.trailPts.length > 5) ball.trailPts.shift();
    }
  }

  // Score multiplier that grows with how many *different* blocks have been
  // hit so far this shot -- rewards spreading a volley across the board
  // rather than dumping every ball into one square.
  getVarietyMultiplier() {
    return 1 + Math.min(Math.max(this.volleyVariety - 1, 0), 8) * 0.15;
  }

  onBlockHit(blk, x, y, dmg) {
    if (blk.destroyed) return;
    dmg = dmg || 1;
    blk.hp -= dmg;
    blk.hitFlash = 1;
    blk.recoil = 1;
    // pitch rises with each successive ball landing on this same square this shot
    blk.hitStreak++;

    if (!blk.hitThisVolley) {
      blk.hitThisVolley = true;
      this.volleyVariety++;
      if (this.volleyVariety >= 2) {
        const mult = this.getVarietyMultiplier();
        this.particles.scorePopup(x, y - 18, "MULTI \u00D7" + mult.toFixed(1), PALETTE.goldYellow);
        this.audio.comboUp();
      }
    }
    const mult = this.getVarietyMultiplier();

    this.score += Math.round(5 * dmg * mult);
    this.particles.hitBurst(x, y, this.blockColor(blk));
    this.audio.blockHit(blk.maxHp, blk.hitStreak);
    if (this.save.screenShake) this.shakeAmt = Math.min(this.shakeAmt + 0.5, 3);
    if (blk.hp <= 0) {
      blk.destroyed = true;
      this.blocksDestroyed++;
      this.combo++;
      this.comboTimer = 0.9;
      const rect = blk.boundingRect(this.board);
      const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
      const bcolor = this.blockColor(blk);
      this.particles.explosion(cx, cy, bcolor);
      this.particles.pop(cx, cy, bcolor);
      this.audio.blockDestroy(this.combo);
      if (this.save.screenShake) this.shakeAmt = Math.min(this.shakeAmt + 1.4, 5);
      const pts = Math.round((25 + blk.maxHp * 2) * mult);
      this.score += pts;
      this.particles.scorePopup(cx, cy, "+" + pts, PALETTE.paleYellow);
      if (this.combo >= 3 && this.combo % 1 === 0) {
        this.particles.scorePopup(cx, cy - 16, "CHAIN " + this.combo, PALETTE.hotRed);
        this.audio.comboUp();
      }
      // exploding squares: destroying a bomb block splash-damages its
      // orthogonal neighbors, which can chain into further bomb blocks.
      if (blk.isBomb) this.explodeAt(blk, cx, cy);
      // laser blaster: destroying it fires beams down its full row and
      // column, instantly destroying every block in their path.
      if (blk.isLaser) this.fireLaser(blk);
      this.checkFullClear();
    }
  }

  // Board-clear bonus: a big reward for wiping every block off the screen
  // in one go, however it happened (direct hits, bomb/laser chains, etc).
  checkFullClear() {
    if (this._clearBonusAwarded) return;
    if (this.board.aliveBlocks().length > 0) return;
    this._clearBonusAwarded = true;
    const bonus = 400 + this.turn * 40;
    this.score += bonus;
    const cx = this.LOGICAL_W / 2, cy = this.board.gridY + this.board.h / 2;
    this.particles.scorePopup(cx, cy, "BOARD CLEARED! +" + bonus, PALETTE.brightGreen);
    this.particles.explosion(cx, cy, PALETTE.brightGreen);
    this.particles.pop(cx, cy, PALETTE.brightGreen);
    this.audio.boardCleared();
    if (this.save.screenShake) this.shakeAmt = Math.min(this.shakeAmt + 3, 7);
  }

  // Instantly destroys a block (no per-hit damage step) -- used by laser
  // beams and, in future, other "clears everything in its path" effects.
  // Awards a smaller flat bonus than a normal destroy since it's free.
  destroyBlockInstant(blk, colorOverride) {
    if (blk.destroyed) return;
    blk.hp = 0;
    blk.destroyed = true;
    blk.fillLevel = 0;
    this.blocksDestroyed++;
    const rect = blk.boundingRect(this.board);
    const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
    const bcolor = colorOverride || this.blockColor(blk);
    this.particles.explosion(cx, cy, bcolor);
    this.particles.pop(cx, cy, bcolor);
    const pts = Math.round((15 + blk.maxHp) * this.getVarietyMultiplier());
    this.score += pts;
    this.particles.scorePopup(cx, cy, "+" + pts, PALETTE.cyan);
    this.checkFullClear();
  }

  // Laser blaster: fires a beam along the block's full row and every column
  // of its footprint, instantly destroying everything in the beam's path.
  // Chains into any other bomb/laser blocks it catches along the way.
  fireLaser(blk, visited) {
    visited = visited || new Set();
    const key = Math.round(blk.row) + "," + blk.col;
    if (visited.has(key)) return;
    visited.add(key);

    const footprint = blk.cellCoords();
    const rows = new Set(footprint.map(f => f.row));
    const cols = new Set(footprint.map(f => f.col));

    for (const row of rows) {
      const rowY = this.board.gridY + (row + 0.5) * CONFIG.CELL;
      this.beamFlashes.push({ x1: this.board.x, y1: rowY, x2: this.board.x + this.board.w, y2: rowY, life: 0.32, maxLife: 0.32 });
    }
    for (const col of cols) {
      const colX = this.board.x + (col + 0.5) * CONFIG.CELL;
      this.beamFlashes.push({ x1: colX, y1: this.board.gridY, x2: colX, y2: this.board.gridY + CONFIG.VISIBLE_ROWS * CONFIG.CELL, life: 0.32, maxLife: 0.32 });
    }

    this.audio.laserFire();
    if (this.save.screenShake) this.shakeAmt = Math.min(this.shakeAmt + 2.5, 7);

    const hitOther = (nb) => {
      if (!nb || nb.destroyed || nb === blk) return;
      this.destroyBlockInstant(nb, PALETTE.cyan);
      if (nb.isBomb) { const r = nb.boundingRect(this.board); this.explodeAt(nb, r.x, r.y); }
      if (nb.isLaser) this.fireLaser(nb, visited);
    };

    for (const other of this.board.blocks) {
      if (other.destroyed || other === blk) continue;
      const oc = other.cellCoords();
      if (oc.some(c => rows.has(c.row) || cols.has(c.col))) hitOther(other);
    }
  }

  // Splash-damages every block orthogonally adjacent to blk's footprint by 1.
  // Used both by built-in exploding-square blocks and the Bomb power-up.
  // `visited` guards against infinite chains between adjacent bomb blocks.
  explodeAt(blk, x, y, visited) {
    visited = visited || new Set();
    const key = Math.round(blk.row) + "," + blk.col;
    if (visited.has(key)) return;
    visited.add(key);

    const footprint = blk.cellCoords();
    const footprintSet = new Set(footprint.map(f => f.row + "," + f.col));
    const neighbors = new Set();
    for (const f of footprint) {
      for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
        const nr = f.row + dr, nc = f.col + dc;
        if (nr < 0 || nr >= CONFIG.VISIBLE_ROWS || nc < 0 || nc >= CONFIG.COLS) continue;
        const nk = nr + "," + nc;
        if (footprintSet.has(nk)) continue;
        neighbors.add(nk);
      }
    }

    this.particles.explosion(x, y, PALETTE.hotRed);
    this.audio.blockDestroy(2);
    if (this.save.screenShake) this.shakeAmt = Math.min(this.shakeAmt + 2, 6);

    for (const k of neighbors) {
      const [nr, nc] = k.split(",").map(Number);
      const nb = this.board.blockAt(nr, nc);
      if (nb && !nb.destroyed) {
        const rect = nb.boundingRect(this.board);
        this.onBlockHit(nb, rect.x + rect.w / 2, rect.y + rect.h / 2, 1);
        // onBlockHit already chains through isBomb neighbors on destroy,
        // but guard a direct re-trigger too in case dmg>1 skipped it above.
        if (nb.destroyed && nb.isBomb && !visited.has(Math.round(nb.row) + "," + nb.col)) {
          this.explodeAt(nb, rect.x + rect.w / 2, rect.y + rect.h / 2, visited);
        }
      }
    }
  }

  blockColor(blk) {
    if (blk.isBomb) return PALETTE.hotRed;
    if (blk.isLaser) return PALETTE.electricBlue;
    const band = blk.strengthBand(this.turn);
    if (band === "weak") return PALETTE.cyan;
    if (band === "moderate") return PALETTE.goldYellow;
    if (band === "strong") return PALETTE.orange;
    return PALETTE.hotRed;
  }

  _splitBall(ball) {
    const clone = new Ball(ball.x, ball.y, -ball.dx, ball.dy);
    clone.wallBounces = ball.wallBounces;
    this.balls.push(clone);
    this.particles.starburst(ball.x, ball.y);
  }

  // Homing power-up: gently steers a ball toward whichever alive block
  // currently has the most HP left, re-evaluated continuously so it keeps
  // adjusting if that target gets destroyed mid-volley.
  _homingTarget() {
    let best = null;
    for (const b of this.board.aliveBlocks()) {
      if (!best || b.hp > best.hp) best = b;
    }
    return best;
  }
  applyHoming(ball, dt) {
    const target = this._homingTarget();
    if (!target) return;
    const rect = target.boundingRect(this.board);
    const tx = rect.x + rect.w / 2, ty = rect.y + rect.h / 2;
    const dxT = tx - ball.x, dyT = ty - ball.y;
    const len = Math.hypot(dxT, dyT) || 1;
    const desAngle = Math.atan2(dyT / len, dxT / len);
    const curAngle = Math.atan2(ball.dy, ball.dx);
    let diff = desAngle - curAngle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    const maxStep = 3.4 * dt; // radians/sec turn rate
    const step = Math.max(-maxStep, Math.min(maxStep, diff));
    const newAngle = curAngle + step;
    ball.dx = Math.cos(newAngle);
    ball.dy = Math.sin(newAngle);
  }

  checkTokenCollision(ball) {
    for (const tk of this.board.tokens) {
      if (tk.collected) continue;
      const c = tk.center(this.board);
      const dist = Math.hypot(ball.x - c.x, ball.y - c.y);
      if (dist < ball.radius + 14) {
        tk.collected = true;
        this.ballCount += tk.value;
        this.score += 15 * tk.value;
        this.particles.starburst(c.x, c.y);
        this.particles.scorePopup(c.x, c.y, "+" + tk.value + " BALL", PALETTE.brightGreen);
        this.audio.bonusCollect();
      }
    }
    for (const pk of this.board.powerTokens) {
      if (pk.collected) continue;
      const c = pk.center(this.board);
      const dist = Math.hypot(ball.x - c.x, ball.y - c.y);
      if (dist < ball.radius + 14) {
        pk.collected = true;
        const info = POWER_INFO[pk.power];
        this.score += 30;
        this.particles.starburst(c.x, c.y);
        this.particles.scorePopup(c.x, c.y, info.label, info.color);
        this.audio.bonusCollect();
        if (pk.power === "rewind") {
          this.rewindCharges = Math.min(2, this.rewindCharges + 1);
        } else if (pk.power === "double") {
          // Double-strength balls: banks up to 3 charges, one consumed per shot.
          this.doubleCharges = Math.min(3, this.doubleCharges + 3);
        } else {
          this.queuedPower = pk.power; // replaces any previously queued power
        }
      }
    }

    // explosive-ball pickup: fixed in the bottom row until a ball reaches it
    const ep = this.board.explosivePickup;
    if (ep) {
      const cx = this.board.x + (ep.col + 0.5) * CONFIG.CELL;
      const cy = this.board.gridY + (this.board.bottomRowIndex() + 0.5) * CONFIG.CELL;
      const dist = Math.hypot(ball.x - cx, ball.y - cy);
      if (dist < ball.radius + 14) {
        this.board.explosivePickup = null;
        this.explosiveTurnsLeft = 3;
        this.score += 40;
        this.particles.explosion(cx, cy, PALETTE.hotRed);
        this.particles.starburst(cx, cy);
        this.particles.scorePopup(cx, cy, "EXPLOSIVE!", PALETTE.hotRed);
        this.audio.explosivePickup();
      }
    }
  }

  updateRowAdvance(dt) {
    this.rowAdvanceT += dt * 1000;
    if (this.rowAdvancePhase === "pause") {
      if (this.rowAdvanceT >= CONFIG.ROW_ADVANCE_PAUSE_MS) {
        this.rowAdvancePhase = "anim";
        this.rowAdvanceT = 0;
        // Freeze power-up: skip the descent entirely for this turn.
        this._frozenThisTurn = (this.volleyPower === "freeze");
        if (this._frozenThisTurn) {
          this._dangerAfterShift = false;
          this.particles.scorePopup(this.LOGICAL_W / 2, this.board.y + 40, "FROZEN", POWER_INFO.freeze.color);
        } else {
          this._dangerAfterShift = this.board.shiftDown();
          this.audio.rowDescend();
        }
      }
    } else if (this.rowAdvancePhase === "anim") {
      if (this.rowAdvanceT >= CONFIG.ROW_ADVANCE_ANIM_MS) {
        this.rowAdvancePhase = "spawn";
        this.rowAdvanceT = 0;
        if (this._dangerAfterShift) {
          if (!this.secondChanceUsed) {
            this.secondChanceUsed = true;
            this.triggerSecondChance();
          } else {
            this.triggerGameOver();
            return;
          }
        }
        this.turn++;
        if (this.explosiveTurnsLeft > 0) this.explosiveTurnsLeft--;
        if (!this._frozenThisTurn) {
          // occasionally drop a big multi-row shape (L, T, or a giant square)
          // before filling the rest of the row normally around it
          const bigShape = this.board.tryPlaceBigShape(this.turn);
          let reservedCols = null;
          if (bigShape) {
            const blk = new Block(0, bigShape.col, bigShape.hp, false, false, bigShape.cells);
            this.board.blocks.push(blk);
            reservedCols = new Set();
            for (const c of bigShape.cells) if (c.dr === 0) reservedCols.add(bigShape.col + c.dc);
          }
          const sinceToken = this.turn - this.board.lastTokenTurn;
          const guaranteeToken = sinceToken >= 4;
          const sincePower = this.turn - this.board.lastPowerTurn;
          const guaranteePower = sincePower >= 6;
          const spec = this.board.generateRow(this.turn, guaranteeToken, guaranteePower, reservedCols);
          this.board.addRowAtTop(spec);
          if (spec.tokenSpecs.length > 0) this.board.lastTokenTurn = this.turn;
          if (spec.powerSpecs.length > 0) this.board.lastPowerTurn = this.turn;
          this._clearBonusAwarded = false;
        }
        // explosive-ball pickup: occasionally spawns fixed in the bottom row
        if (!this.board.explosivePickup && this.explosiveTurnsLeft === 0 &&
            (this.turn - this.board.lastExplosiveTurn) >= 5 && this.board.rng.next() < 0.35) {
          const occ = this.board.occupancyForRow(this.board.bottomRowIndex());
          const openCols = [];
          for (let c = 0; c < CONFIG.COLS; c++) if (!occ[c]) openCols.push(c);
          if (openCols.length > 0) {
            const col = openCols[Math.floor(this.board.rng.next() * openCols.length)];
            this.board.explosivePickup = { col };
            this.board.lastExplosiveTurn = this.turn;
          }
        }
        this.volleyPower = null;
        this.volleyRicochet = false;
        this.volleyDouble = false;
        this.volleyGiant = false;
        this.volleyHoming = false;
        // check imminent danger for warning flash
        let closeDanger = false;
        for (const b of this.board.aliveBlocks()) if (Math.round(b.row) + (b.height - 1) >= CONFIG.VISIBLE_ROWS - 2) closeDanger = true;
        if (closeDanger) { this.dangerFlash = 0.6; this.audio.dangerWarn(); }
      }
    } else if (this.rowAdvancePhase === "spawn") {
      if (this.rowAdvanceT >= 120) {
        this.state = STATE.AIMING;
        this.balls = [];
        this.previousTurnSnapshot = this._takeSnapshot();
      }
    }
  }

  triggerGameOver() {
    this.state = STATE.GAMEOVER;
    this.gameOverAnimT = 0;
    this.audio.gameOver();
    this.finalStats = {
      score: this.score, turn: this.turn, best: Math.max(this.save.highScore, this.score),
      destroyed: this.blocksDestroyed, seed: this.seed
    };
    this.persist();
  }

  // One-time save: the first time a block crosses the danger line, instead
  // of ending the run, clear the bottom three rows and keep playing.
  triggerSecondChance() {
    const bottomIdx = this.board.bottomRowIndex();
    for (const b of this.board.blocks) {
      if (b.destroyed) continue;
      if (b.cellCoords().some(c => c.row >= bottomIdx - 2 && c.row <= bottomIdx)) {
        this.destroyBlockInstant(b, PALETTE.goldYellow);
      }
    }
    this.linesCleared += 3;
    this.secondChanceBannerT = 2.2;
    this.audio.secondChance();
    if (this.save.screenShake) this.shakeAmt = Math.min(this.shakeAmt + 4, 8);
  }

  /* ---------------- Trajectory preview ---------------- */
  getPreviewPoints() {
    const lenSetting = this.save.trajectoryLength;
    let maxCollisions = CONFIG.MAX_PREVIEW_COLLISIONS;
    if (lenSetting === "standard") maxCollisions = 6;
    else if (lenSetting === "long") maxCollisions = 12;
    const maxDist = CONFIG.CELL * CONFIG.PREVIEW_MAX_DIST_MULT;
    // if Giant Balls is queued for the next shot, preview at its true
    // (larger) collision radius so the bounce points read accurately
    const radius = this.queuedPower === "giant" ? CONFIG.BALL_RADIUS * CONFIG.GIANT_RADIUS_MULT : CONFIG.BALL_RADIUS;
    return TrajectoryPredictor.predict(
      this.launcherX, this.launcherY - radius - 2, this.aimDX, this.aimDY,
      this.board, radius, maxCollisions, maxDist
    );
  }

  /* ---------------- Render ---------------- */
  render() {
    const ctx = this.ctx;
    ctx.save();
    ctx.clearRect(0, 0, this.LOGICAL_W, this.LOGICAL_H);

    let shakeX = 0, shakeY = 0;
    if (this.shakeAmt > 0) {
      shakeX = (Math.random() - 0.5) * this.shakeAmt;
      shakeY = (Math.random() - 0.5) * this.shakeAmt;
    }
    ctx.translate(shakeX, shakeY);

    this.drawBackground(ctx);
    this.buttons = [];

    if (this.state === STATE.SPLASH) { this.drawSplash(ctx); }
    else if (this.state === STATE.TITLE) { this.drawTitle(ctx); }
    else if (this.state === STATE.HOWTO) { this.drawHowTo(ctx); }
    else {
      this.drawBoardFrame(ctx);
      this.drawBoard(ctx);
      this.drawBeamFlashes(ctx);
      this.drawLaunchArea(ctx);
      if (this.state === STATE.AIMING && this.aiming && !this.aimCancelled) this.drawTrajectory(ctx);
      this.drawBalls(ctx);
      this.particles.draw(ctx);
      this.drawHUD(ctx);
      if (this.secondChanceBannerT > 0) this.drawSecondChanceBanner(ctx);
      if (this.state === STATE.PAUSED) this.drawPauseMenu(ctx);
      if (this.state === STATE.GAMEOVER) this.drawGameOver(ctx);
      this.drawScanlines(ctx);
    }

    ctx.restore();
  }

  drawBackground(ctx) {
    ctx.fillStyle = PALETTE.navyDeep;
    ctx.fillRect(0, 0, this.LOGICAL_W, this.LOGICAL_H);
    // overscan border
    ctx.fillStyle = PALETTE.navy;
    ctx.fillRect(0, 0, this.LOGICAL_W, this.LOGICAL_H);
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    for (let i = 0; i < 4; i++) {
      ctx.strokeRect(2 + i, 2 + i, this.LOGICAL_W - 4 - i * 2, this.LOGICAL_H - 4 - i * 2);
    }
  }

  drawScanlines(ctx) {
    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = "#000000";
    for (let y = 0; y < this.LOGICAL_H; y += 2) {
      ctx.fillRect(0, y, this.LOGICAL_W, 1);
    }
    ctx.restore();
    // vignette
    const grad = ctx.createRadialGradient(
      this.LOGICAL_W / 2, this.LOGICAL_H / 2, this.LOGICAL_H * 0.35,
      this.LOGICAL_W / 2, this.LOGICAL_H / 2, this.LOGICAL_H * 0.75
    );
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(1, "rgba(0,0,0,0.35)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, this.LOGICAL_W, this.LOGICAL_H);
  }

  drawPixelText(ctx, text, x, y, size, color, align) {
    ctx.font = "bold " + size + "px Helvetica, Arial, sans-serif";
    ctx.textAlign = align || "left";
    ctx.textBaseline = "middle";
    ctx.fillStyle = color;
    ctx.fillText(text, Math.round(x), Math.round(y));
  }

  button(ctx, x, y, w, h, label, onClick, opts) {
    opts = opts || {};
    const large = this.save.largeUI;
    ctx.fillStyle = opts.fill || PALETTE.deepBlue;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = opts.stroke || PALETTE.electricBlue;
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
    this.drawPixelText(ctx, label, x + w / 2, y + h / 2 + 1, opts.size || (large ? 20 : 17), opts.color || PALETTE.white, "center");
    this.buttons.push({ x, y, w, h, onClick });
  }

  drawSplash(ctx) {
    const cx = this.LOGICAL_W / 2, cy = this.LOGICAL_H / 2;
    const t = this.splashT;
    const fadeIn = Math.min(1, t / 0.5);
    const fadeOut = t > 1.5 ? Math.max(0, 1 - (t - 1.5) / 0.5) : 1;
    const alpha = Math.min(fadeIn, fadeOut);
    const scale = 0.85 + Math.min(1, t / 0.6) * 0.15;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.shadowColor = PALETTE.cyan;
    ctx.shadowBlur = 22;
    this.drawPixelText(ctx, "SEQUENCE", 0, 0, 40, PALETTE.white, "center");
    ctx.shadowBlur = 0;
    this.drawPixelText(ctx, "SEQUENCE", 0, 0, 40, PALETTE.paleYellow, "center");
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha * 0.8;
    this.drawPixelText(ctx, "A N E S - S T Y L E   G A M E", cx, cy + 40, 11, PALETTE.gray, "center");
    ctx.restore();

    if (t > 0.7) {
      const pulse = 0.5 + Math.abs(Math.sin(performance.now() / 400)) * 0.5;
      ctx.save();
      ctx.globalAlpha = alpha * pulse;
      this.drawPixelText(ctx, "TAP TO CONTINUE", cx, this.LOGICAL_H - 60, 12, PALETTE.lightGray, "center");
      ctx.restore();
    }
  }

  drawTitle(ctx) {
    const cx = this.LOGICAL_W / 2;

    this.drawPixelText(ctx, CONFIG.TITLE, cx, 110, 28, PALETTE.paleYellow, "center");
    ctx.save();
    ctx.shadowColor = PALETTE.cyan;
    ctx.shadowBlur = 14;
    this.drawPixelText(ctx, CONFIG.TITLE, cx, 110, 28, PALETTE.white, "center");
    ctx.restore();

    // small animated demo trajectory, kept out of the way of the button
    const demoY = 210;
    const t = performance.now() / 1000;
    const bx = cx + Math.sin(t * 0.6) * 46;
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.setLineDash([4, 5]);
    ctx.strokeStyle = PALETTE.cyan;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, demoY + 60);
    ctx.lineTo(bx, demoY);
    ctx.lineTo(cx - (bx - cx), demoY - 50);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PALETTE.white;
    ctx.beginPath(); ctx.arc(bx, demoY, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // one big, simple, unmissable START button dominates the screen
    const bw = Math.min(300, this.LOGICAL_W - CONFIG.BORDER * 2 - 24);
    const bh = 96;
    const by = this.LOGICAL_H / 2 + 10;
    ctx.save();
    const pulse = 1 + Math.sin(performance.now() / 260) * 0.02;
    ctx.translate(cx, by + bh / 2);
    ctx.scale(pulse, pulse);
    ctx.translate(-cx, -(by + bh / 2));
    ctx.shadowColor = PALETTE.brightGreen;
    ctx.shadowBlur = 18;
    ctx.fillStyle = PALETTE.darkGreen;
    ctx.fillRect(cx - bw / 2, by, bw, bh);
    ctx.strokeStyle = PALETTE.brightGreen;
    ctx.lineWidth = 4;
    ctx.strokeRect(cx - bw / 2 + 2, by + 2, bw - 4, bh - 4);
    ctx.shadowBlur = 0;
