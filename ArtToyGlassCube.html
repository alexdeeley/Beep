<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Art Toy — Glass Cube (Spin = Break Rate)</title>
<style>
  html,body{margin:0;height:100%;background:#1e1e1e;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>
<script>
(function(){
  const cnv = document.getElementById('c');
  const ctx = cnv.getContext('2d', {alpha:false, desynchronized:true});
  ctx.imageSmoothingEnabled = false;
  let dpr = Math.min(2, window.devicePixelRatio||1);
  function fit(){
    dpr = Math.min(2, window.devicePixelRatio||1);
    const w = Math.floor(innerWidth*dpr), h = Math.floor(innerHeight*dpr);
    if (cnv.width!==w || cnv.height!==h){ cnv.width=w; cnv.height=h; }
  }
  addEventListener('resize', fit, {passive:true}); fit();

  // RNG
  function mulberry32(a){ return function(){ var t=a+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; } }
  let seed=(Math.random()*1e9)|0; let rng=mulberry32(seed);
  const R = { rnd(){return rng();}, range(a,b){return a+(b-a)*rng();}, choice(arr){return arr[(rng()*arr.length)|0];} };

  // 3D helpers
  function rotX(p,a){ const s=Math.sin(a), c=Math.cos(a); return [p[0], c*p[1]-s*p[2], s*p[1]+c*p[2]]; }
  function rotY(p,a){ const s=Math.sin(a), c=Math.cos(a); return [c*p[0]+s*p[2], p[1], -s*p[0]+c*p[2]]; }
  function rotZ(p,a){ const s=Math.sin(a), c=Math.cos(a); return [c*p[0]-s*p[1], s*p[0]+c*p[1], p[2]]; }
  function normalize(v){ const m=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/m,v[1]/m,v[2]/m]; }
  function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }

  // Cube voxels (faces only)
  const GRID = 18;
  const HALF = 1;
  let voxels=[]; // {x,y,z,s,nx,ny,nz,alive}
  function buildCube(){
    voxels=[];
    const step=(2*HALF)/GRID;
    const s=step*0.9;
    for(let i=0;i<=GRID;i++){
      for(let j=0;j<=GRID;j++){
        const u = -HALF + i*step;
        const v = -HALF + j*step;
        voxels.push({x:u,y:v,z: HALF,s:s,nx:0,ny:0,nz:1,alive:true});
        voxels.push({x:u,y:v,z:-HALF,s:s,nx:0,ny:0,nz:-1,alive:true});
        voxels.push({x:u,y: HALF,z:v,s:s,nx:0,ny:1,nz:0,alive:true});
        voxels.push({x:u,y:-HALF,z:v,s:s,nx:0,ny:-1,nz:0,alive:true});
        voxels.push({x: HALF,y:u,z:v,s:s,nx:1,ny:0,nz:0,alive:true});
        voxels.push({x:-HALF,y:u,z:v,s:s,nx:-1,ny:0,nz:0,alive:true});
      }
    }
  }
  buildCube();

  // Particles (glass shards)
  let parts=[]; // {x,y,z,vx,vy,vz,size,age,max,alpha,glint}
  function spawnFromVoxel(v, n){
    for(let k=0;k<n;k++){
      const jitter=0.12;
      const x=v.x + R.range(-jitter,jitter);
      const y=v.y + R.range(-jitter,jitter);
      const z=v.z + R.range(-jitter,jitter);
      const out = normalize([x,y,z]);
      const speed = R.range(0.012, 0.04);
      const vx = out[0]*speed + R.range(-0.012,0.012);
      const vy = out[1]*speed + R.range(-0.012,0.012);
      const vz = out[2]*speed + R.range(-0.012,0.012);
      parts.push({x,y,z,vx,vy,vz,size:R.range(0.07,0.12),age:0,max:R.range(8,16),alpha:R.range(0.35,0.7),glint:R.rnd()<0.3});
    }
  }

  // Camera
  const cam={dist:3.6,fov:1.2};
  function project(p3){
    const [x,y,z]=p3;
    const d=(z+cam.dist);
    const k=cam.fov/d;
    const sx = cnv.width*0.5 + x*k*cnv.height*0.48;
    const sy = cnv.height*0.5 - y*k*cnv.height*0.48;
    const scale=Math.max(0.0001,k);
    return [sx,sy,scale];
  }

  // Rotation inertia
  let ang=[R.range(0,Math.PI*2), R.range(0,Math.PI*2), R.range(0,Math.PI*2)];
  let av=[0,0,0];
  const damping = 0.995; // ~20–30s
  const light = normalize([0.6, 0.8, 0.9]); // cool glassy light

  // Disintegration schedule (~5 minutes baseline)
  const totalDisintegrate = 5*60*1000;
  let startTime=performance.now();
  let liveCount=voxels.length;
  function disintegrateProgress(now){ return Math.min(1,(now-startTime)/totalDisintegrate); }

  // Input
  let dragging=false,lastX=0,lastY=0,lastT=performance.now();
  function setPtr(e){ const t=(e.touches&&e.touches[0])||e; lastX=t.clientX; lastY=t.clientY; }
  function fling(e){
    const t=(e.touches&&e.touches[0])||e;
    const now=performance.now();
    const dx=(t.clientX-lastX), dy=(t.clientY-lastY);
    lastX=t.clientX; lastY=t.clientY; lastT=now;
    const gain=0.0024;
    av[1] += -dx*gain;
    av[0] +=  dy*gain;
    av[2] += (dx-dy)*gain*0.25;
    // immediate fracture on hard swipe
    const impulse = Math.hypot(dx,dy);
    if (impulse>8) peel(Math.min(60, 6 + (impulse/6|0)));
  }
  cnv.addEventListener('pointerdown', e=>{ dragging=true; setPtr(e); });
  cnv.addEventListener('pointermove', e=>{ if(dragging) fling(e); });
  addEventListener('pointerup', ()=>{ dragging=false; });
  cnv.addEventListener('touchstart', e=>{ dragging=true; setPtr(e); }, {passive:true});
  cnv.addEventListener('touchmove',  e=>{ if(dragging) fling(e); }, {passive:true});
  addEventListener('touchend', ()=>{ dragging=false; }, {passive:true});

  // Peel helpers
  function peel(n){
    for(let r=0;r<n;r++){
      // choose a live voxel from outermost first (so surface flakes first)
      let idx, tries=0;
      do { idx=(R.rnd()*voxels.length)|0; tries++; if(tries>2000) return; } while(!voxels[idx].alive);
      const v=voxels[idx]; v.alive=false; liveCount--;
      spawnFromVoxel(v, 1 + (R.rnd()*2|0));
    }
  }
  function scheduledPeel(progress, spinMag){
    // base: fulfill disintegration over time
    const targetDead = Math.floor(voxels.length * progress);
    const currentDead = voxels.length - liveCount;
    let toRemove = targetDead - currentDead;
    // extra: proportional to spin magnitude
    const extra = Math.min(140, Math.floor(spinMag * 240)); // faster spin -> more breakage
    toRemove += extra;
    if (toRemove>0) peel(toRemove);
  }

  // Glass voxel draw: translucent cool gray with specular highlight (lighter composite), edge brightening
  function drawGlassVoxel(p3, n3, size, t){
    const pr = project(p3);
    const s = Math.max(1, size * pr[2] * cnv.height * 0.55);
    const l = Math.max(0.05, dot(n3, light)); // 0..1
    const base = 180 + Math.floor(l*60); // light bluish-gray
    const alpha = 0.25 + 0.5*l;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(${base},${base+10},${base+20},${alpha.toFixed(3)})`;
    ctx.fillRect(pr[0]-s/2, pr[1]-s/2, s, s);
    // edge highlight
    ctx.globalCompositeOperation = 'lighter';
    const e = Math.max(1, s*0.12);
    ctx.fillStyle = `rgba(255,255,255,${(0.10+0.25*l).toFixed(3)})`;
    ctx.fillRect(pr[0]-s/2, pr[1]-s/2, s, e);
    ctx.fillRect(pr[0]-s/2, pr[1]+s/2-e, s, e);
    ctx.fillRect(pr[0]-s/2, pr[1]-s/2, e, s);
    ctx.fillRect(pr[0]+s/2-e, pr[1]-s/2, e, s);
    ctx.globalCompositeOperation = 'source-over';
  }

  function loop(now){
    fit();
    const w=cnv.width, h=cnv.height;
    // background vignette for depth
    const grd = ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*0.2, w/2,h/2, Math.hypot(w,h)*0.6);
    grd.addColorStop(0,'#2a2a2a'); grd.addColorStop(1,'#121212');
    ctx.fillStyle = grd; ctx.fillRect(0,0,w,h);

    // integrate rotation
    ang[0]+=av[0]; ang[1]+=av[1]; ang[2]+=av[2];
    av[0]*=damping; av[1]*=damping; av[2]*=damping;
    const spinMag = Math.abs(av[0])+Math.abs(av[1])+Math.abs(av[2]);

    // schedule breakage from time + spin
    const prog = disintegrateProgress(now);
    scheduledPeel(prog, spinMag);

    // base slow auto-spin
    const ax = ang[0] + 0.0005*now/16;
    const ay = ang[1] + 0.0006*now/16;
    const az = ang[2] + 0.0004*now/16;

    // update/draw particles (glass shards)
    for (let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.age += 0.016;
      p.vz += 0.00005; // drift away
      p.vx *= 0.998; p.vy *= 0.998; p.vz *= 0.998;
      p.x += p.vx; p.y += p.vy; p.z += p.vz;
      if (p.age > p.max){ parts.splice(i,1); continue; }
      const pr = project([p.x,p.y,p.z]);
      const s = Math.max(1, p.size * pr[2] * h * 0.55);
      ctx.globalCompositeOperation = p.glint ? 'lighter' : 'source-over';
      ctx.fillStyle = `rgba(220,230,255,${p.alpha.toFixed(3)})`;
      ctx.fillRect(pr[0]-s/2, pr[1]-s/2, s, s);
      ctx.globalCompositeOperation = 'source-over';
    }

    // draw remaining glass voxels (back-to-front)
    let toDraw=[];
    for (const v of voxels){
      if (!v.alive) continue;
      let p=[v.x,v.y,v.z];
      p = rotX(p,ax); p = rotY(p,ay); p = rotZ(p,az);
      let n=[v.nx,v.ny,v.nz];
      n = rotX(n,ax); n = rotY(n,ay); n = rotZ(n,az);
      toDraw.push({p:p,n:n,s:v.s});
    }
    toDraw.sort((a,b)=> a.p[2]-b.p[2]);
    for (const it of toDraw){
      drawGlassVoxel(it.p, normalize(it.n), it.s, now*0.001);
    }

    // occasional spin-shedding even without swipe
    if (spinMag > 0.01 && R.rnd() < Math.min(0.25, spinMag*35)){
      peel(1 + (R.rnd()*3|0));
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
