<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>BitCrusher Worklet Demo</title>
<style>
  :root{ --bg:#000; --fg:#fff; --dim:rgba(255,255,255,.6); --b:3px; --r:16px; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--fg); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; gap:14px; padding:14px; }
  .card{ border:var(--b) solid var(--fg); border-radius:var(--r); padding:14px; background:rgba(255,255,255,.04); }
  button{ all:unset; display:flex; justify-content:center; align-items:center; border:var(--b) solid var(--fg);
    border-radius:var(--r); padding:16px 14px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
    cursor:pointer; user-select:none; background:rgba(255,255,255,.06);
  }
  button:active{ transform:scale(.99); background:rgba(255,255,255,.12); }
  .row{ display:flex; gap:12px; align-items:center; }
  .label{ width:110px; color:var(--dim); font-size:12px; letter-spacing:1px; text-transform:uppercase; }
  input[type="range"]{ width:100%; height:44px; background:transparent; }
  input[type="range"]::-webkit-slider-runnable-track{ height:8px; background:var(--fg); border-radius:999px; }
  input[type="range"]::-webkit-slider-thumb{ -webkit-appearance:none; width:28px; height:28px; margin-top:-10px; border-radius:999px; background:var(--bg); border:var(--b) solid var(--fg); }
  .value{ width:54px; text-align:right; font-variant-numeric: tabular-nums; }
  .hint{ color:var(--dim); font-size:12px; line-height:1.4; }
  .footer{ margin-top:auto; color:var(--dim); font-size:12px; text-align:center; }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Beep" title="Back to Beep">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>

<div id="app">
  <div class="card">
    <button id="startBtn">Enable Audio</button>
    <div class="hint" style="margin-top:10px">
      Tap once to start. Then adjust the two sliders. (iOS requires a user gesture.)
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="label">Bit Depth</div>
      <input id="bitDepth" type="range" min="1" max="16" step="1" value="8" />
      <div class="value" id="bitDepthVal">8</div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="label">SR Reduce</div>
      <input id="srReduce" type="range" min="1" max="32" step="1" value="4" />
      <div class="value" id="srReduceVal">4</div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="label">Tone</div>
      <input id="freq" type="range" min="60" max="1200" step="1" value="220" />
      <div class="value" id="freqVal">220</div>
    </div>
    <div class="hint" style="margin-top:10px">
      Demo signal is a simple sine oscillator routed through the worklet node.
    </div>
  </div>

  <div class="footer">BitCrusher Worklet Demo — single-file HTML</div>
</div>

<script>
/* ========= AudioWorklet BitCrusher (single registration per AudioContext) ========= */

let audioCtx = null;
let crusherNode = null;
let osc = null;

let bitCrusherRegistered = false;
let registeredCtx = null;

async function registerBitCrusherOnce(ctx){
  if (bitCrusherRegistered && registeredCtx === ctx) return;

  const workletCode = `
    class BitCrusherProcessor extends AudioWorkletProcessor {
      static get parameterDescriptors() {
        return [
          { name: "bitDepth", defaultValue: 8, minValue: 1, maxValue: 16, automationRate: "k-rate" },
          { name: "sampleRateReduction", defaultValue: 4, minValue: 1, maxValue: 32, automationRate: "k-rate" }
        ];
      }

      constructor() {
        super();
        this._phase = 0;
        this._last = 0;
      }

      process(inputs, outputs, parameters) {
        const input = inputs[0];
        const output = outputs[0];
        if (!input || !input[0] || !output || !output[0]) return true;

        const inCh = input[0];
        const outCh = output[0];

        const bitDepthArr = parameters.bitDepth;
        const srArr = parameters.sampleRateReduction;

        // k-rate params (typically length 1)
        const bits = bitDepthArr.length > 0 ? bitDepthArr[0] : 8;
        const sr = srArr.length > 0 ? srArr[0] : 4;

        const step = Math.pow(0.5, bits);

        for (let i = 0; i < inCh.length; i++) {
          this._phase += sr;
          if (this._phase >= 1) {
            this._phase -= 1;
            const x = inCh[i];
            this._last = step * Math.floor(x / step + 0.5);
          }
          outCh[i] = this._last;
        }
        return true;
      }
    }

    registerProcessor("bit-crusher", BitCrusherProcessor);
  `;

  const blob = new Blob([workletCode], { type: "application/javascript" });
  const url = URL.createObjectURL(blob);
  await ctx.audioWorklet.addModule(url);

  bitCrusherRegistered = true;
  registeredCtx = ctx;
  // Leaving URL unreclaimed is safest across browsers; revoking can break some Safari flows.
}

/* ========= UI ========= */

const startBtn = document.getElementById("startBtn");

const bitDepth = document.getElementById("bitDepth");
const srReduce  = document.getElementById("srReduce");
const freq      = document.getElementById("freq");

const bitDepthVal = document.getElementById("bitDepthVal");
const srReduceVal = document.getElementById("srReduceVal");
const freqVal = document.getElementById("freqVal");

function updateLabels(){
  bitDepthVal.textContent = bitDepth.value;
  srReduceVal.textContent = srReduce.value;
  freqVal.textContent = freq.value;
}
updateLabels();

bitDepth.addEventListener("input", ()=>{
  updateLabels();
  if (crusherNode){
    crusherNode.parameters.get("bitDepth").setValueAtTime(+bitDepth.value, audioCtx.currentTime);
  }
});
srReduce.addEventListener("input", ()=>{
  updateLabels();
  if (crusherNode){
    crusherNode.parameters.get("sampleRateReduction").setValueAtTime(+srReduce.value, audioCtx.currentTime);
  }
});
freq.addEventListener("input", ()=>{
  updateLabels();
  if (osc){
    osc.frequency.setValueAtTime(+freq.value, audioCtx.currentTime);
  }
});

async function enableAudio(){
  if (audioCtx && audioCtx.state !== "closed"){
    if (audioCtx.state === "suspended") await audioCtx.resume();
    return;
  }

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  await registerBitCrusherOnce(audioCtx);

  crusherNode = new AudioWorkletNode(audioCtx, "bit-crusher", {
    numberOfInputs: 1,
    numberOfOutputs: 1,
    outputChannelCount: [1]
  });

  crusherNode.parameters.get("bitDepth").setValueAtTime(+bitDepth.value, audioCtx.currentTime);
  crusherNode.parameters.get("sampleRateReduction").setValueAtTime(+srReduce.value, audioCtx.currentTime);

  osc = audioCtx.createOscillator();
  osc.type = "sine";
  osc.frequency.value = +freq.value;

  const gain = audioCtx.createGain();
  gain.gain.value = 0.15;

  osc.connect(crusherNode);
  crusherNode.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  startBtn.textContent = "Audio Enabled";
}

startBtn.addEventListener("click", enableAudio, { passive:true });
startBtn.addEventListener("touchstart", (e)=>{ e.preventDefault(); enableAudio(); }, { passive:false });
</script>
</body>
</html>
