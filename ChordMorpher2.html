<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chord Morph • Maj7 / min7 (Sine)</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    display: grid;
    place-items: center;
    height: 100%;
    gap: 1rem;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  h1 {
    font-size: clamp(1.2rem, 3.5vw, 2rem);
    margin: 0.2rem 0;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .btn {
    display: inline-block;
    padding: 1.25rem 2rem;
    font-size: clamp(1.2rem, 5vw, 2.2rem);
    font-weight: 800;
    background: #111;
    color: #fff;
    border: 2px solid #fff;
    border-radius: 12px;
    outline: none;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.2s ease, color 0.2s ease;
    width: min(90vw, 26rem);
  }
  .btn:active { transform: scale(0.98); }
  .note {
    font-size: clamp(1rem, 3vw, 1.25rem);
    opacity: 0.9;
  }
  .footer {
    opacity: 0.7;
    font-size: 0.9rem;
  }
  .kbd { border: 1px solid #555; padding: 0 .3rem; border-radius: 6px; }
  /* High-contrast focus ring */
  .btn:focus-visible { outline: 4px solid #0ff; outline-offset: 3px; }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


  <div class="wrap" id="surface" role="button" aria-label="Tap to morph to a new chord">
    <h1 id="title" aria-live="polite">Tap to start • Chord Morph</h1>
    <button class="btn" id="toggle" aria-live="polite">Tap to Start / Morph</button>
    <div class="note" id="chordLabel">—</div>
    <div class="footer">
      Plays randomized <strong>maj7</strong> / <strong>min7</strong> chords as pure sine waves. 
      Tap screen, button, or press <span class="kbd">Space</span>/<span class="kbd">Enter</span> to morph.
    </div>
  </div>

<script>
(() => {
  // ===== Utilities =====
  const A4 = 440;
  const SEMITONE = Math.pow(2, 1/12);
  const NOTE_TO_SEMITONES = {
    'C': -9,  'C#': -8, 'D': -7, 'D#': -6, 'E': -5, 'F': -4,
    'F#': -3, 'G': -2, 'G#': -1, 'A': 0,  'A#': 1, 'B': 2
  };
  function freqFor(noteName, octave=4) {
    // noteName like "C", "C#", ..., "B"
    const n = NOTE_TO_SEMITONES[noteName];
    // A4 is octave 4; distance in semitones from A4:
    const semisFromA4 = (octave - 4) * 12 + n;
    return A4 * Math.pow(SEMITONE, semisFromA4);
  }
  function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }

  // ===== Chord Definitions =====
  // Intervals (in semitones) for maj7 and min7
  const MAJ7 = [0, 4, 7, 11];
  const MIN7 = [0, 3, 7, 10];

  const ROOTS = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

  const CHORDS = [];
  // Build majors
  for (const r of ROOTS) CHORDS.push({ name: r + "maj7", type: "maj7", root: r, intervals: MAJ7 });
  // Build the relative minors per pair list (strictly matching user's series)
  // Cmaj7–Amin7, C#maj7–A#m7, Dmaj7–Bmin7, D#maj7–Cm7, Emaj7–C#m7, Fmaj7–Dmin7,
  // F#maj7–D#m7, Gmaj7–Emin7, G#maj7–Fmin7, Amaj7–F#m7, A#maj7–Gm7, Bmaj7–G#m7
  const REL_MINORS = {
    "C":"A", "C#":"A#", "D":"B", "D#":"C", "E":"C#", "F":"D",
    "F#":"D#", "G":"E", "G#":"F", "A":"F#", "A#":"G", "B":"G#"
  };
  for (const r of ROOTS) {
    const m = REL_MINORS[r];
    CHORDS.push({ name: m + "m7", type: "min7", root: m, intervals: MIN7 });
  }

  // ===== Audio Engine =====
  let ctx = null;
  let master = null;
  let currentNodes = []; // {osc, gain}
  let currentChord = null;
  let started = false;

  const CROSSFADE_SEC = 2.5; // smooth morph
  const MASTER_GAIN = 0.18;  // overall volume cap (safe for mobile)
  const VOICE_GAIN = 0.18;   // per-osc in chord; will be scaled down

  function ensureCtx() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.0001; // start muted
      master.connect(ctx.destination);
      // gentle ramp up master on first start
      const now = ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(master.gain.value, now);
      master.gain.linearRampToValueAtTime(MASTER_GAIN, now + 0.5);
    }
    if (ctx.state === "suspended") ctx.resume();
  }

  function chordFrequencies(chord) {
    // Create a pleasant voicing across registers.
    // We'll center around octave 4, but spread tones slightly.
    const baseOct = 4;
    const freq = [];
    chord.intervals.forEach((iv, i) => {
      const semis = iv;
      const noteIndex = (ROOTS.indexOf(chord.root) + semis) % 12;
      const noteName = ROOTS[noteIndex];
      const octaveOffset = Math.floor((ROOTS.indexOf(chord.root) + semis) / 12);
      let oct = baseOct + octaveOffset;
      // Spread: lower the root one octave, lift the 7th up one
      if (i === 0) oct = baseOct - 1;
      if (i === 3) oct = baseOct + 1;
      freq.push(freqFor(noteName, oct));
    });
    return freq;
  }

  function playChord(chord, fadeInSec=1.2) {
    ensureCtx();
    const now = ctx.currentTime;
    const freqs = chordFrequencies(chord);
    const nodes = [];
    const perVoice = clamp(VOICE_GAIN / Math.max(4, freqs.length), 0.01, 0.08);

    freqs.forEach(f => {
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = f;

      const g = ctx.createGain();
      g.gain.value = 0.000001; // start silent

      osc.connect(g).connect(master);
      osc.start();

      // smooth fade in
      g.gain.cancelScheduledValues(now);
      g.gain.setValueAtTime(g.gain.value, now);
      g.gain.linearRampToValueAtTime(perVoice, now + fadeInSec);

      nodes.push({osc, gain: g});
    });

    return nodes;
  }

  function stopChord(nodes, fadeOutSec=1.8) {
    if (!ctx) return;
    const now = ctx.currentTime;
    nodes.forEach(({osc, gain}) => {
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.linearRampToValueAtTime(0.000001, now + fadeOutSec);
      // stop a bit after fade
      osc.stop(now + fadeOutSec + 0.05);
    });
  }

  function pickRandomChord(excludeName=null) {
    let c;
    for (let tries = 0; tries < 8; tries++) {
      c = CHORDS[(Math.random() * CHORDS.length) | 0];
      if (!excludeName || c.name !== excludeName) break;
    }
    return c;
  }

  function morphToNewChord() {
    const next = pickRandomChord(currentChord?.name || null);
    label.textContent = next.name;
    title.textContent = "Morphing to " + next.name;

    const incoming = playChord(next, CROSSFADE_SEC * 0.6);
    // Crossfade: fade out current while fading in new
    if (currentNodes.length) stopChord(currentNodes, CROSSFADE_SEC);

    currentNodes = incoming;
    currentChord = next;
  }

  // ===== UI Wiring =====
  const surface = document.getElementById("surface");
  const btn = document.getElementById("toggle");
  const label = document.getElementById("chordLabel");
  const title = document.getElementById("title");

  function handleTap() {
    if (!started) {
      started = true;
      title.textContent = "Playing… Tap to Morph";
      morphToNewChord();
    } else {
      morphToNewChord();
    }
  }

  surface.addEventListener("click", (e) => { e.preventDefault(); handleTap(); });
  btn.addEventListener("click", (e) => { e.preventDefault(); handleTap(); });

  // Touchstart for iOS immediate unlock
  surface.addEventListener("touchstart", () => { ensureCtx(); }, {passive: true});
  btn.addEventListener("touchstart", () => { ensureCtx(); }, {passive: true});

  // Keyboard support
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "Enter") {
      e.preventDefault();
      handleTap();
    }
  });

  // Suspend/resume on page visibility to save battery
  document.addEventListener("visibilitychange", () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend();
    else ctx.resume();
  });
})();
</script>
</body>
</html>
