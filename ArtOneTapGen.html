<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>ART — One‑Tap Generative Gallery</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; background:#000; color:#fff; overflow:hidden; }
  canvas { position:fixed; inset:0; display:block; width:100%; height:100%; }
  /* Big circle button */
  #artBtn {
    position: fixed; inset: 0; margin:auto;
    width: 36vmin; height: 36vmin; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #222, #000);
    border: 2px solid #666;
    display:flex; align-items:center; justify-content:center;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase;
    font-size: 5vmin; color:#fff;
    box-shadow: 0 0 24px rgba(255,255,255,0.08), inset 0 0 18px rgba(255,255,255,0.06);
    cursor: pointer; user-select:none;
    transition: transform .12s ease, box-shadow .3s ease, opacity .4s ease;
    z-index: 10;
  }
  #artBtn:active { transform: scale(0.98); box-shadow: 0 0 6px rgba(255,255,255,0.1), inset 0 0 4px rgba(255,255,255,0.06); }
  #hud {
    position: fixed; top: 10px; left: 10px; right: 10px;
    display:flex; align-items:center; gap:8px; z-index: 11; pointer-events: none;
  }
  .badge {
    pointer-events:auto;
    background: rgba(0,0,0,.58); border: 1px solid #333; border-radius: 999px;
    padding: 6px 10px; font: 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    color:#ddd; backdrop-filter: blur(8px);
  }
  #saveBtn, #againBtn {
    pointer-events:auto; cursor:pointer;
  }
  #genreBadge { opacity:.9; }
  #picker {
    position: fixed; bottom: 10px; left: 10px; right:10px;
    display:none; flex-wrap: wrap; gap:8px; z-index:12;
  }
  #picker button {
    background:#0b0b0b; border:1px solid #333; color:#eee;
    padding:6px 10px; border-radius:10px; font: 12px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    cursor:pointer;
  }
  #toast {
    position: fixed; right: 12px; bottom: 12px;
    background: rgba(0,0,0,.72); border:1px solid #333; color:#eee;
    font:12px system-ui,-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    padding:8px 10px; border-radius: 10px; opacity:0; transform: translateY(8px);
    transition: opacity .25s, transform .25s; z-index: 13;
  }
  #toast.show { opacity:1; transform: translateY(0); }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>
<div id="artBtn" title="Tap to create art">ART</div>

<div id="hud" aria-live="polite" style="display:none;">
  <div id="genreBadge" class="badge">Genre: <strong id="gname">—</strong></div>
  <div id="againBtn" class="badge" title="Generate another (random)">⟳ Again</div>
  <div id="saveBtn" class="badge" title="Save PNG">⬇ Save</div>
  <div class="badge" title="Long‑press screen to pick a genre">ℹ Long‑press to pick genre</div>
</div>

<div id="picker"></div>
<div id="toast"></div>

<script>
(()=>{
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha:false });
  let W=0, H=0;
  function resize(){
    const b = canvas.getBoundingClientRect();
    W = Math.floor(b.width * dpr);
    H = Math.floor(b.height * dpr);
    canvas.width = W; canvas.height = H;
  }
  resize(); addEventListener('resize', resize);

  const hud = document.getElementById('hud');
  const gnameEl = document.getElementById('gname');
  const artBtn = document.getElementById('artBtn');
  const picker = document.getElementById('picker');
  const toast = document.getElementById('toast');
  const saveBtn = document.getElementById('saveBtn');
  const againBtn = document.getElementById('againBtn');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toast.classList.remove('show'), 1400);
  }

  // Deterministic RNG
  function xfnv1a(str){
    let h=2166136261>>>0;
    for (let i=0;i<str.length;i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return ()=> (h>>>0);
  }
  function mulberry32(seed){
    return function(){
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ (t>>>15), t | 1);
      t ^= t + Math.imul(t ^ (t>>>7), t | 61);
      return ((t ^ (t>>>14))>>>0) / 4294967296;
    }
  }
  function rngFrom(str){ return mulberry32(xfnv1a(str)()); }

  // Utility
  function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function hsla(h,s,l,a=1){ return `hsla(${(h%360+360)%360},${clamp(s,0,100)}%,${clamp(l,0,100)}%,${clamp(a,0,1)})`; }

  // Genre renderers (researched movements, simplified for procedural generation)
  const genres = [
    { key:'op', name:'Op Art', render: renderOpArt },
    { key:'destijl', name:'De Stijl', render: renderDeStijl },
    { key:'bauhaus', name:'Bauhaus Geometric', render: renderBauhaus },
    { key:'suprematism', name:'Suprematism/Minimal', render: renderSuprematism },
    { key:'artdeco', name:'Art Deco Pattern', render: renderArtDeco },
    { key:'pointillism', name:'Pointillism', render: renderPointillism },
    { key:'pop', name:'Pop Art Halftone', render: renderPopHalftone },
    { key:'outrun', name:'Vaporwave/Outrun', render: renderOutrun }
  ];

  // Build picker UI (hidden; open via long-press)
  genres.forEach(g=>{
    const b = document.createElement('button');
    b.textContent = g.name;
    b.addEventListener('click', ()=>{ generate(g.key); picker.style.display='none'; });
    picker.appendChild(b);
  });

  let lpTimer=null;
  canvas.addEventListener('pointerdown', ()=>{
    clearTimeout(lpTimer);
    lpTimer = setTimeout(()=>{
      picker.style.display = picker.style.display==='none' ? 'flex' : 'none';
      if (picker.style.display==='flex') showToast('Genre picker opened');
    }, 550);
  }, {passive:true});
  addEventListener('pointerup', ()=>clearTimeout(lpTimer), {passive:true});
  addEventListener('pointercancel', ()=>clearTimeout(lpTimer), {passive:true});

  saveBtn.addEventListener('click', ()=>{
    const a = document.createElement('a');
    const dt = new Date();
    const pad = n=>String(n).padStart(2,'0');
    a.download = `art-${currentGenre}-${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}-${pad(dt.getHours())}${pad(dt.getMinutes())}${pad(dt.getSeconds())}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
    showToast('Saved PNG');
  });
  againBtn.addEventListener('click', ()=>generate());

  // First interaction
  artBtn.addEventListener('click', ()=>{
    artBtn.style.opacity = '0';
    setTimeout(()=>{ artBtn.style.display='none'; }, 350);
    generate();
  });

  let currentGenre = 'op';

  function generate(lockKey){
    resize();
    hud.style.display = 'flex';
    const seed = 'alex-' + Math.random().toString(36).slice(2,10);
    const rng = rngFrom(seed);
    const g = lockKey ? genres.find(x=>x.key===lockKey) : pick(rng, genres);
    currentGenre = g.key;
    gnameEl.textContent = g.name;
    g.render(rng);
  }

  // ----- Renderers -----

  // 1) Op Art: moiré/optical stripes and waves (inspired by mid‑century op art)
  function renderOpArt(rng){
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
    // parameters
    const layers = 4 + Math.floor(rng()*3);
    for (let L=0; L<layers; L++){
      const ang = rng()*Math.PI*2;
      const dx = Math.cos(ang), dy = Math.sin(ang);
      const spacing = (8 + rng()*6) * dpr;
      const span = Math.hypot(W,H);
      const count = Math.ceil(span/spacing) + 2;
      ctx.lineWidth = Math.max(1.25, 1.25*dpr);
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rng()<0.66 ? hsla(0,0,100,0.14) : hsla(rng()*360, 80, 60, 0.15);
      for (let i=-count;i<count;i++){
        // base anchor
        const ax = W/2 + (-span + i*spacing) * (-dy);
        const ay = H/2 + (-span + i*spacing) * ( dx);
        ctx.beginPath();
        for (let t=-span; t<=span; t+= 7*dpr){
          let x = ax + t*dx, y = ay + t*dy;
          // two interfering radials for moiré
          const r1 = Math.hypot(x - W*0.35, y - H*0.42);
          const r2 = Math.hypot(x - W*0.68, y - H*0.58);
          const bend = Math.sin(r1*0.015) * 6 + Math.cos(r2*0.013) * 6;
          x += -dy * bend; y += dx * bend;
          if (t===-span) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // 2) De Stijl (Mondrian‑style grid with primaries)
  function renderDeStijl(rng){
    // white field
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
    ctx.lineWidth = Math.max(10, 10*dpr);
    ctx.strokeStyle = '#000';

    // recursive grid partition
    function splitRect(x,y,w,h,depth){
      if (depth<=0 || (w< W*0.12 && h< H*0.12)) { paintRect(x,y,w,h); return; }
      if (w>h){
        const cut = x + w*(0.3 + rng()*0.4);
        splitRect(x,y,cut-x,h,depth-1);
        splitRect(cut,y,x+w-cut,h,depth-1);
        drawLine(cut,y,cut,y+h);
      } else {
        const cut = y + h*(0.3 + rng()*0.4);
        splitRect(x,y,w,cut-y,depth-1);
        splitRect(x,cut,w,y+h-cut,depth-1);
        drawLine(x,cut,x+w,cut);
      }
    }
    function drawLine(x1,y1,x2,y2){
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }
    function paintRect(x,y,w,h){
      const fillChance = (w*h)/(W*H) < 0.18 ? 0.7 : 0.35;
      if (rng() < fillChance){
        const colors = ['#d81e2b', '#1b3de6', '#f1d100']; // red, blue, yellow
        const c = rng()<0.15 ? '#000' : (rng()<0.82 ? colors[Math.floor(rng()*colors.length)] : '#fff');
        ctx.fillStyle = c;
        ctx.fillRect(x+ctx.lineWidth/2, y+ctx.lineWidth/2, w-ctx.lineWidth, h-ctx.lineWidth);
      }
    }
    splitRect(ctx.lineWidth/2, ctx.lineWidth/2, W-ctx.lineWidth, H-ctx.lineWidth, 4);
  }

  // 3) Bauhaus geometric: balanced simple shapes, limited palette
  function renderBauhaus(rng){
    ctx.fillStyle = '#111'; ctx.fillRect(0,0,W,H);
    const palette = ['#e63946', '#457b9d', '#f1fa8c', '#ff9f1c', '#ffffff'];
    const n = 14 + Math.floor(rng()*8);
    for (let i=0;i<n;i++){
      const x = rng()*W, y = rng()*H;
      const s = (Math.pow(rng(),2)) * Math.min(W,H)*0.4 + 20*dpr;
      const rot = rng()*Math.PI*2;
      const col = palette[Math.floor(rng()*palette.length)];
      ctx.save();
      ctx.translate(x,y); ctx.rotate(rot);
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = col;
      const type = rng();
      if (type < 0.33){
        ctx.fillRect(-s*0.5,-s*0.5,s,s);
      } else if (type < 0.66){
        ctx.beginPath(); ctx.arc(0,0,s*0.55,0,Math.PI*2); ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(-s*0.5, s*0.5);
        ctx.lineTo( s*0.5, s*0.5);
        ctx.lineTo( 0, -s*0.5);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    // thin lines to tie composition
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = Math.max(1, 1*dpr);
    for (let i=0;i<7;i++){
      ctx.beginPath();
      ctx.moveTo(rng()*W, rng()*H);
      ctx.lineTo(rng()*W, rng()*H);
      ctx.stroke();
    }
  }

  // 4) Suprematism / Minimal: few rotated rects + circle, lots of negative space
  function renderSuprematism(rng){
    ctx.fillStyle = '#f8f8f8'; ctx.fillRect(0,0,W,H);
    const shapes = 3 + Math.floor(rng()*3);
    for (let i=0;i<shapes;i++){
      const x = W*(0.2 + rng()*0.6);
      const y = H*(0.2 + rng()*0.6);
      const w = (0.15 + rng()*0.5) * Math.min(W,H);
      const h = (0.03 + rng()*0.18) * Math.min(W,H);
      const rot = (rng()*Math.PI*0.7) - Math.PI*0.35;
      const col = rng()<0.3 ? '#000' : hsla(rng()*360, 80, 45);
      ctx.save();
      ctx.translate(x,y); ctx.rotate(rot);
      ctx.fillStyle = col;
      ctx.fillRect(-w/2,-h/2,w,h);
      ctx.restore();
    }
    // circle accent
    ctx.beginPath();
    ctx.arc(W* (0.2 + rng()*0.6), H*(0.2 + rng()*0.6), Math.min(W,H)*(0.05 + rng()*0.07), 0, Math.PI*2);
    ctx.fillStyle = hsla(rng()*360, 80, 40);
    ctx.fill();
  }

  // 5) Art Deco pattern: fan/sunburst tile across surface
  function renderArtDeco(rng){
    ctx.fillStyle = '#0b0b0b'; ctx.fillRect(0,0,W,H);
    const cols = Math.ceil(Math.sqrt(W)/2) + 12;
    const rows = Math.ceil(Math.sqrt(H)/2) + 12;
    const cellW = W/cols, cellH = H/rows;
    for (let y=0; y<rows; y++){
      for (let x=0; x<cols; x++){
        const cx = (x+0.5)*cellW, cy = (y+0.5)*cellH;
        const r = Math.min(cellW,cellH)*0.46;
        const rays = 10 + Math.floor(rng()*10);
        // metallic gold gradient
        const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
        g.addColorStop(0, '#fff2b3');
        g.addColorStop(0.4, '#ffd76a');
        g.addColorStop(1, '#8e6b34');
        for (let i=0;i<rays;i++){
          const a0 = (i/rays)*Math.PI;
          const a1 = ((i+0.5)/rays)*Math.PI;
          ctx.beginPath();
          ctx.moveTo(cx,cy);
          ctx.arc(cx,cy,r,a0,a1);
          ctx.closePath();
          ctx.fillStyle = g;
          ctx.fill();
        }
        // chevron divider
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1*dpr;
        ctx.beginPath();
        ctx.moveTo(cx-r, cy);
        ctx.lineTo(cx, cy-r);
        ctx.lineTo(cx+r, cy);
        ctx.stroke();
      }
    }
  }

  // 6) Pointillism: millions of dots layering to abstract color field
  function renderPointillism(rng){
    // soft light background
    ctx.fillStyle = '#101018'; ctx.fillRect(0,0,W,H);
    const hues = [rng()*360, rng()*360, rng()*360];
    const dots = Math.floor(6000 * (W*H/(1080*1920)));
    for (let i=0;i<dots;i++){
      const x = rng()*W, y = rng()*H;
      const r = Math.pow(rng(),2) * 6*dpr + 0.3*dpr;
      const h = pick(rng, hues);
      const s = 65 + rng()*25;
      const l = 50 + Math.sin(i)*8;
      ctx.fillStyle = hsla(h, s, l, 0.18 + rng()*0.6);
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    // add a hint of emergent structure with larger dabs
    for (let i=0;i<400;i++){
      const x = rng()*W, y = rng()*H;
      const r = (1 + Math.pow(rng(),2)*16)*dpr;
      ctx.fillStyle = hsla(pick(rng,hues)+rng()*10, 80, 60, 0.35);
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
  }

  // 7) Pop Art (Ben‑Day‑like) halftone bands
  function renderPopHalftone(rng){
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
    const bands = 6 + Math.floor(rng()*5);
    for (let b=0;b<bands;b++){
      const y0 = (b/bands)*H, y1 = ((b+1)/bands)*H;
      const base = ['#ff1e2d','#1a5cff','#ffe400','#000'][Math.floor(rng()*4)];
      // halftone grid
      const step = 10*dpr;
      for (let y=y0; y<y1; y+= step){
        for (let x=0; x<W; x+= step){
          const t = (x/W) + Math.sin((y/H)*Math.PI*2 + b)*0.25;
          const rad = clamp((t*t)*step*0.6, 0.5*dpr, step*0.55);
          ctx.fillStyle = base;
          ctx.beginPath(); ctx.arc(x+step*0.5, y+step*0.5, rad, 0, Math.PI*2); ctx.fill();
        }
      }
    }
    // bold comic lines overlay
    ctx.strokeStyle = '#000'; ctx.lineWidth = Math.max(4,4*dpr);
    ctx.beginPath();
    ctx.moveTo(W*0.05, H*0.8); ctx.bezierCurveTo(W*0.3,H*0.6, W*0.6,H*0.95, W*0.95,H*0.15);
    ctx.stroke();
  }

  // 8) Vaporwave / Outrun: sunset + grid
  function renderOutrun(rng){
    // sky gradient
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#301960');
    g.addColorStop(0.5, '#8930ff');
    g.addColorStop(1, '#ff3e90');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    // sun
    const sx = W*0.5, sy = H*0.42, sr = Math.min(W,H)*0.18;
    for (let i=0;i<12;i++){
      const y = sy - sr + (i/12)*sr*2;
      const bandH = sr*2/12 * 0.6;
      ctx.fillStyle = hsla(40 + i*2, 100, 60, 0.9);
      ctx.fillRect(sx - Math.sqrt(sr*sr - (y-sy)*(y-sy)), y, 2*Math.sqrt(sr*sr - (y-sy)*(y-sy)), bandH);
    }
    // grid floor
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = Math.max(1,1*dpr);
    const rows = 28, cols = 18;
    for (let r=0;r<rows;r++){
      const t = r/(rows-1);
      const y = H*0.55 + t*(H*0.5);
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    for (let c=0;c<cols;c++){
      const t = (c/(cols-1) - 0.5);
      ctx.beginPath();
      ctx.moveTo(W*0.5 + t*W*0.06, H*0.55);
      ctx.lineTo(W*0.5 + t*W*(0.5 + Math.abs(t)*0.8), H);
      ctx.stroke();
    }
    // palm silhouettes (optional)
    if (rng()<0.7){
      ctx.fillStyle = '#05050a';
      for (let i=0;i<3;i++){
        const px = (0.2 + i*0.3 + rng()*0.05) * W;
        const py = H*0.55;
        const h = H*(0.25 + rng()*0.1);
        ctx.fillRect(px-3*dpr, py-h, 6*dpr, h);
        for (let k=0;k<10;k++){
          const a = -Math.PI/2 + (k-5)*0.2;
          ctx.beginPath();
          ctx.moveTo(px, py-h);
          ctx.lineTo(px + Math.cos(a)*h*0.6, py-h + Math.sin(a)*h*0.6);
          ctx.strokeStyle = '#05050a'; ctx.lineWidth = Math.max(3,3*dpr); ctx.stroke();
        }
      }
    }
  }

  // Expose: none. It’s a tiny self‑contained gallery.

})();</script>
</body>
</html>
