<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Oscillon</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; touch-action:none;}
  canvas{position:fixed; inset:0; width:100%; height:100%; display:block; background:#000;}

  #hzDisplay{
    position:fixed; left:0; right:0;
    text-align:center; color:#fff; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:700; font-size:14px; letter-spacing:-0.01em; line-height:1;
    font-variant-numeric:tabular-nums; z-index:10; pointer-events:none;
  }

  #controls{
    position:fixed; left:0; right:0; bottom:calc(22px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; gap:14px; z-index:10;
  }
  button{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:14px; font-weight:600; letter-spacing:0.3px;
    padding:14px 26px; border-radius:30px; cursor:pointer; user-select:none;
    background:rgba(255,255,255,0.06); color:#fff; border:1px solid rgba(255,255,255,0.35);
    -webkit-appearance:none; appearance:none;
  }
  button:active{background:rgba(255,255,255,0.18);}
  button.on{background:#fff; color:#000; border-color:#fff;}
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to deeley.org" title="Back to deeley.org">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>

<canvas id="cv"></canvas>

<div id="hzDisplay">1.00 Hz</div>

<div id="controls">
  <button id="startBtn">Start</button>
  <button id="soundBtn">Sound</button>
</div>

<script>
(function(){
"use strict";

const TAU = Math.PI*2;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

let DPR=1, W=0, H=0;
const hzDisplay = document.getElementById('hzDisplay');
function positionHzDisplay(){
  const r = Math.min(W,H)*0.36;
  const circleBottom = H/2 + r;
  hzDisplay.style.top = Math.round(circleBottom + 6) + 'px';
}
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  positionHzDisplay();
}
window.addEventListener('resize', resize);
resize();

/* automatic state */
let running = false;
let paused = false;
let freqA = 1;               // starts at 1 Hz
const FREQ_B = 1;            // fixed second oscillator
const GROWTH_PER_SEC = Math.pow(1.02, 1000/900); // 2x the previous pace
const FREQ_MAX = 40;
const SAMPLES = 2200;
const CYCLES = 18;

function drawPattern(){
  const cx = W/2, cy = H/2;
  const r = Math.min(W,H)*0.36;
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  for(let i=0;i<=SAMPLES;i++){
    const th = (i/SAMPLES)*TAU*CYCLES;
    const x = Math.sin(freqA*th) * r;
    const y = Math.sin(FREQ_B*th + Math.PI/2) * r;
    const px = cx+x, py = cy+y;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.stroke();
}

const TARGET_FPS = 20;
const FRAME_INTERVAL = 1000/TARGET_FPS;
let lastDraw = 0;
let lastGrowT = null;
function loop(now){
  if(running && (now-lastDraw) >= FRAME_INTERVAL){
    const dt = lastGrowT===null ? 0 : (now-lastGrowT)/1000;
    lastGrowT = now;
    lastDraw = now;
    if(!paused){
      freqA = Math.min(FREQ_MAX, freqA * Math.pow(GROWTH_PER_SEC, dt));
    }
    drawPattern();
    updateAudioFreq();
    hzDisplay.textContent = freqA.toFixed(2) + ' Hz';
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
drawPattern();

/* ---- sound: a single tone tracking the pattern, fully automatic ---- */
let actx=null, osc=null, gain=null, soundOn=false;
function initAudio(){
  if(actx) return;
  actx = new (window.AudioContext||window.webkitAudioContext)();
  osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = 90;
  gain = actx.createGain();
  gain.gain.value = 0;
  osc.connect(gain); gain.connect(actx.destination);
  osc.start();
}
function updateAudioFreq(){
  if(!actx || !osc) return;
  const f = 90 + freqA*22;
  osc.frequency.setTargetAtTime(f, actx.currentTime, 0.08);
}
function setSound(on){
  soundOn = on;
  document.getElementById('soundBtn').classList.toggle('on', on);
  initAudio();
  if(actx.state==='suspended') actx.resume();
  gain.gain.setTargetAtTime(on?0.14:0, actx.currentTime, 0.08);
}

/* ---- controls ---- */
const startBtn = document.getElementById('startBtn');
startBtn.addEventListener('click', ()=>{
  freqA = 1;
  paused = false;
  running = true;
  lastGrowT = null;
  startBtn.classList.add('on');
  startBtn.textContent = 'Restart';
  hzDisplay.textContent = freqA.toFixed(2) + ' Hz';
});
document.getElementById('soundBtn').addEventListener('click', ()=>{
  setSound(!soundOn);
});

/* tapping the pattern itself pauses it right where it is; tap again to resume */
cv.addEventListener('click', ()=>{
  if(!running) return;
  paused = !paused;
});

})();
</script>
</body>
</html>
