<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beep</title>
<meta name="description" content="A small gallery of self-contained apps — music tools, games, art." />
<meta name="theme-color" content="#000000" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Beep" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #000;
    color: #f2f2f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 72px 28px 120px;
  }
  header { margin-bottom: 44px; }
  h1 {
    font-weight: 300;
    letter-spacing: 0.14em;
    font-size: 1rem;
    text-transform: lowercase;
    color: #6b6b78;
    margin: 0 0 6px;
  }
  header p {
    color: #46464f;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0;
  }
  #appList {
    display: flex;
    flex-direction: column;
  }
  a.app-item {
    display: block;
    text-decoration: none;
    color: #f2f2f5;
    padding: 16px 0;
    border-bottom: 1px solid #141416;
    transition: color 0.15s, transform 0.15s, padding-left 0.15s;
  }
  a.app-item:last-child { border-bottom: 0; }
  a.app-item:hover, a.app-item:active {
    color: #fff;
    padding-left: 14px;
  }
  a.app-item h2 {
    margin: 0;
    font-weight: 300;
    font-size: clamp(1.7rem, 6.5vw, 2.5rem);
    text-transform: lowercase;
    letter-spacing: 0.01em;
    line-height: 1.15;
  }
  a.app-item p {
    margin: 5px 0 0;
    color: #5c5c68;
    font-size: 0.7rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    line-height: 1.5;
    transition: color 0.15s;
  }
  a.app-item:hover p, a.app-item:active p { color: #8c8c9a; }
  .empty {
    color: #46464f;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>beep</h1>
    <p>tap a name to open it</p>
  </header>
  <div id="appList"></div>
</main>

<script>
async function main() {
  const res = await fetch("./apps.json");
  const apps = await res.json();

  const listEl = document.getElementById("appList");

  if (apps.length === 0) {
    listEl.innerHTML = '<p class="empty">Nothing here yet.</p>';
    return;
  }

  const sorted = [...apps].sort((a, b) =>
    a.name.localeCompare(b.name, undefined, { sensitivity: "base" })
  );

  for (const app of sorted) {
    listEl.appendChild(buildItem(app));
  }
}

function buildItem(app) {
  const item = document.createElement("a");
  item.className = "app-item";
  item.href = app.path;
  // Same-window navigation (no target="_blank") so tapping an app stays
  // inside the installed standalone PWA instead of kicking out to a new
  // browser tab, which would show Safari/Chrome chrome again.

  const title = document.createElement("h2");
  title.textContent = app.name;

  const desc = document.createElement("p");
  desc.textContent = app.description;

  item.appendChild(title);
  item.appendChild(desc);
  return item;
}

main();
</script>
</body>
</html>
