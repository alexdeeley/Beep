<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Artcade</title>
<meta name="description" content="A small gallery of self-contained apps — games and art." />
<meta name="theme-color" content="#000000" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Artcade" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #000;
    color: #f2f2f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 24px 100px;
  }
  header { margin-bottom: 24px; }
  h1 {
    font-weight: 800;
    letter-spacing: -0.02em;
    font-size: 0.95rem;
    text-transform: lowercase;
    color: #6b6b78;
    margin: 0 0 4px;
  }
  header p {
    color: #46464f;
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
  }
  #dailySection { margin-bottom: 28px; }
  #dailySection h3 {
    color: #6b6b78;
    font-weight: 800;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0 0 4px;
  }
  #tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
    border-bottom: 1px solid #1c1c20;
  }
  .tab {
    appearance: none;
    background: none;
    border: 0;
    color: #4a4a54;
    font-family: inherit;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-size: clamp(1.3rem, 5vw, 1.8rem);
    text-transform: lowercase;
    padding: 6px 4px 12px;
    margin-right: 22px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab.active {
    color: #fff;
    border-bottom-color: #fff;
  }
  .tab:hover { color: #b8b8c2; }
  #appList {
    display: flex;
    flex-direction: column;
  }
  a.app-item {
    display: block;
    text-decoration: none;
    color: #f2f2f5;
    padding: 12px 0;
    border-bottom: 1px solid #141416;
    transition: color 0.15s, padding-left 0.15s;
  }
  a.app-item:last-child { border-bottom: 0; }
  a.app-item:hover, a.app-item:active {
    color: #fff;
    padding-left: 12px;
  }
  a.app-item h2 {
    margin: 0;
    font-weight: 800;
    font-size: clamp(1.6rem, 6vw, 2.3rem);
    text-transform: lowercase;
    letter-spacing: -0.02em;
    line-height: 1.08;
  }
  a.app-item p {
    margin: 3px 0 0;
    color: #5c5c68;
    font-size: 0.66rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 700;
    line-height: 1.4;
    transition: color 0.15s;
  }
  a.app-item:hover p, a.app-item:active p { color: #8c8c9a; }
  .empty {
    color: #46464f;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>artcade</h1>
    <p>tap a name to open it</p>
  </header>
  <div id="dailySection"></div>
  <div id="tabs"></div>
  <div id="appList"></div>
</main>

<script>
const TABS = ["Games", "Art"];
// Music Tools apps fold into the Art tab — both are non-game, creative/generative.
// Daily apps are pinned in their own section above the tabs, not folded into either.
const TAB_FOR_CATEGORY = { Games: "Games", Art: "Art", "Music Tools": "Art" };

let apps = [];
let activeTab = "Games";

async function main() {
  const res = await fetch("./apps.json");
  apps = await res.json();

  if (apps.length === 0) {
    document.getElementById("appList").innerHTML = '<p class="empty">Nothing here yet.</p>';
    return;
  }

  renderDaily();
  buildTabs();
  renderList();
}

function renderDaily() {
  const dailyEl = document.getElementById("dailySection");
  const daily = apps.filter((app) => app.category === "Daily");
  if (daily.length === 0) return;

  const heading = document.createElement("h3");
  heading.textContent = "Daily";
  dailyEl.appendChild(heading);
  for (const app of daily) {
    dailyEl.appendChild(buildItem(app));
  }
}

function buildTabs() {
  const tabsEl = document.getElementById("tabs");
  for (const tab of TABS) {
    const btn = document.createElement("button");
    btn.className = "tab" + (tab === activeTab ? " active" : "");
    btn.textContent = tab;
    btn.dataset.tab = tab;
    btn.addEventListener("click", () => {
      activeTab = tab;
      [...tabsEl.children].forEach((el) => el.classList.toggle("active", el.dataset.tab === tab));
      renderList();
    });
    tabsEl.appendChild(btn);
  }
}

function renderList() {
  const listEl = document.getElementById("appList");
  listEl.innerHTML = "";

  const filtered = apps.filter((app) => TAB_FOR_CATEGORY[app.category] === activeTab);
  const sorted = filtered.sort((a, b) =>
    a.name.localeCompare(b.name, undefined, { sensitivity: "base" })
  );

  if (sorted.length === 0) {
    listEl.innerHTML = '<p class="empty">Nothing here yet.</p>';
    return;
  }

  for (const app of sorted) {
    listEl.appendChild(buildItem(app));
  }
}

function buildItem(app) {
  const item = document.createElement("a");
  item.className = "app-item";
  item.href = app.path;
  // Same-window navigation (no target="_blank") so tapping an app stays
  // inside the installed standalone PWA instead of kicking out to a new
  // browser tab, which would show Safari/Chrome chrome again.

  const title = document.createElement("h2");
  title.textContent = app.name;

  const desc = document.createElement("p");
  desc.textContent = app.description;

  item.appendChild(title);
  item.appendChild(desc);
  return item;
}

main();
</script>
</body>
</html>
