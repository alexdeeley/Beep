<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>NEON SKEE — Flick to Score</title>
<style>
  html, body { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; touch-action:none; }
  .hud { position:fixed; left:0; top:0; width:100vw; display:flex; justify-content:space-between;
         font-family: system-ui, -apple-system, Helvetica, Arial, sans-serif; font-weight:900;
         letter-spacing:0.5px; color:#fff; padding:10px 14px; user-select:none; }
  .hud span { font-size:18px; text-shadow:0 0 10px #00eaff; }
  .overlay {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    color:#fff; font-family: system-ui, -apple-system, Helvetica, Arial, sans-serif;
    text-align:center; line-height:1.25; user-select:none; padding:16px 18px;
    border:2px solid #ff2aa8; box-shadow:0 0 30px #ff2aa8; border-radius:10px;
    background:rgba(0,0,0,0.7); display:none;
  }
  .overlay .title { font-size:28px; font-weight:900; margin-bottom:12px; color:#ff2aa8; text-shadow:0 0 14px #ff2aa8; }
  .overlay .sub { font-size:14px; opacity:0.9; }
  .btn {
    display:inline-block; margin-top:12px; padding:10px 16px; font-weight:900; color:#000;
    background:#ff2aa8; border-radius:8px; box-shadow:0 0 18px #ff2aa8; text-decoration:none;
  }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="game" aria-label="Neon Skee Ball"></canvas>
<div class="hud" id="hud" aria-hidden="true">
  <span id="score">Score: 0</span>
  <span id="shots">Shots: 10</span>
</div>
<div class="overlay" id="overlay">
  <div class="title">Game Over</div>
  <div class="sub" id="summary">Final Score: 0</div>
  <a href="#" id="shareBtn" class="btn">Share</a>
  <a href="#" id="againBtn" class="btn" style="margin-left:8px;">Play Again</a>
</div>
<script>
(function(){
  // Canvas
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W=0, H=0;
  function resize(){
    W = Math.max(320, Math.floor(innerWidth));
    H = Math.max(480, Math.floor(innerHeight));
    canvas.width = W; canvas.height = H;
    layout();
    resetBall();
  }
  addEventListener('resize', resize, {passive:true});

  // Neon palette
  const PINK = '#ff2aa8';
  const CYAN = '#39d0ff';
  const LIME = '#8aff00';
  const VIO  = '#a855ff';
  const YELL = '#fffa65';
  const ORNG = '#ff7a2f';

  // Board geometry
  const board = { x:0, y:0, w:0, h:0 };
  const ramp = { x:0, y:0, w:0, h:0 }; // visual only
  let holes = []; // {x,y,r,score}
  let LAUNCH_Y = 0;
  function layout(){
    board.w = Math.min(W*0.9, 420);
    board.h = Math.min(H*0.92, 800);
    board.x = Math.floor((W - board.w)/2);
    board.y = Math.floor(H - board.h - 10);

    // ramp occupies bottom 35%
    ramp.x = board.x + board.w*0.15;
    ramp.w = board.w*0.7;
    ramp.h = board.h*0.35;
    ramp.y = board.y + board.h - ramp.h;

    LAUNCH_Y = ramp.y + ramp.h*0.35; // only allow swipes starting here or below

    // Hole layout at the top 35% of board
    const topAreaY = board.y + board.h*0.12;
    const cx = board.x + board.w/2;
    const spread = board.w*0.28;
    const bigR = 26, medR = 22, smlR = 18;
    holes = [
      {x:cx,            y:topAreaY+20, r:bigR, score:10, color:'#ffffff'},
      {x:cx-spread*0.5, y:topAreaY+40, r:medR, score:20, color:CYAN},
      {x:cx+spread*0.5, y:topAreaY+40, r:medR, score:20, color:CYAN},
      {x:cx-spread*0.9, y:topAreaY+80, r:smlR, score:30, color:LIME},
      {x:cx+spread*0.9, y:topAreaY+80, r:smlR, score:30, color:LIME},
      {x:cx,            y:topAreaY-20, r:smlR*0.9, score:50, color:YELL},
      {x:cx-spread*1.1, y:topAreaY-10, r:smlR*0.8, score:100, color:ORNG},
      {x:cx+spread*1.1, y:topAreaY-10, r:smlR*0.8, score:100, color:ORNG}
    ];
  }

  // Ball
  const ball = { x:0, y:0, r:10, vx:0, vy:0, flying:false, active:true };
  function resetBall(){
    ball.x = board.x + board.w/2;
    ball.y = board.y + board.h - 24;
    ball.vx = 0; ball.vy = 0;
    ball.flying = false; ball.active = true;
  }

  // Game state
  let score = 0;
  let shots = 10;
  const hudScore = document.getElementById('score');
  const hudShots = document.getElementById('shots');
  const overlay = document.getElementById('overlay');
  const summary = document.getElementById('summary');
  const shareBtn = document.getElementById('shareBtn');
  const againBtn = document.getElementById('againBtn');

  shareBtn.addEventListener('click', async (e)=>{
    e.preventDefault();
    const text = `I scored ${score} in NEON SKEE!`;
    if (navigator.share){ try{ await navigator.share({ text, title:'Neon Skee' }); }catch(err){} }
    else { alert(text); }
  });
  againBtn.addEventListener('click', (e)=>{
    e.preventDefault();
    score = 0; shots = 10; hudScore.textContent = 'Score: 0'; hudShots.textContent = 'Shots: 10';
    overlay.style.display = 'none';
    resetBall();
  });

  function endShot(){
    shots--;
    hudShots.textContent = 'Shots: ' + shots;
    if (shots <= 0){
      // game over
      summary.textContent = 'Final Score: ' + score;
      overlay.style.display = 'block';
    }else{
      resetBall();
    }
  }

  // Input (flick)
  let dragStart=null, dragLast=null, dragTime=0;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    let cx,cy;
    if(e.touches && e.touches[0]){ cx=e.touches[0].clientX - r.left; cy=e.touches[0].clientY - r.top; }
    else { cx=e.clientX - r.left; cy=e.clientY - r.top; }
    return {x:cx, y:cy, t:performance.now()};
  }
  function down(e){
    e.preventDefault();
    if (!ball.active) return;
    const p = pos(e);
    if (p.y >= LAUNCH_Y){
      dragStart = p; dragLast = p;
    }
  }
  function move(e){
    if (!dragStart) return;
    e.preventDefault();
    dragLast = pos(e);
  }
  function up(e){
    if (!dragStart) return;
    const end = dragLast || pos(e);
    // upward flick required
    const dy = end.y - dragStart.y;
    if (dy < -8){
      const dt = Math.max(16, end.t - dragStart.t);
      const vx = (end.x - dragStart.x) / dt * 12; // scale
      const vy = (end.y - dragStart.y) / dt * 12;
      ball.vx = vx;
      ball.vy = vy; // negative (upward)
      ball.flying = true;
    }
    dragStart = null; dragLast = null;
  }
  canvas.addEventListener('touchstart', down, {passive:false});
  addEventListener('touchmove', move, {passive:false});
  addEventListener('touchend', up, {passive:true});
  canvas.addEventListener('mousedown', down, {passive:false});
  addEventListener('mousemove', move, {passive:false});
  addEventListener('mouseup', up, {passive:true});

  // Particles (fireworks)
  let particles = [];
  function fireworks(x,y,color){
    for(let i=0;i<20;i++){
      particles.push({
        x, y,
        vx: Math.cos(Math.random()*Math.PI*2) * (1+Math.random()*3),
        vy: Math.sin(Math.random()*Math.PI*2) * (1+Math.random()*3),
        life: 1.0, color
      });
    }
  }

  // Physics helpers
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function dist2(ax,ay,bx,by){ const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }

  // Main loop
  let last = performance.now();
  function step(now){
    const dt = Math.min(32, now - last); last = now;
    update(dt);
    draw();
    requestAnimationFrame(step);
  }

  let scoredAnim = 0;
  function update(dt){
    // Move ball
    if (ball.flying){
      // gravity
      ball.vy += 0.35;
      // slight friction
      ball.vx *= 0.995;
      // walls (board interior)
      const leftWall = board.x + board.w*0.05 + ball.r;
      const rightWall = board.x + board.w - board.w*0.05 - ball.r;
      if (ball.x < leftWall){ ball.x = leftWall; ball.vx *= -0.85; }
      if (ball.x > rightWall){ ball.x = rightWall; ball.vx *= -0.85; }

      // ramp visual "lip" near top of ramp gives upward kick once when crossing
      if (!ball._boosted && ball.y < ramp.y + ramp.h*0.15 && ball.y > ramp.y - 6 && ball.vy < 0){
        ball.vy -= 3.2; ball._boosted = true;
      }

      ball.x += ball.vx;
      ball.y += ball.vy;

      // check for hole collisions
      for(const h of holes){
        const r = h.r;
        if (dist2(ball.x, ball.y, h.x, h.y) <= (r-2)*(r-2)){
          score += h.score;
          hudScore.textContent = 'Score: ' + score;
          ball.flying = false; ball.active = false;
          scoredAnim = 1.0;
          fireworks(h.x, h.y, h.color);
          // sink ball animation then end shot
          setTimeout(endShot, 700);
          break;
        }
      }

      // out of bounds (past top or bottom)
      if (ball.y < board.y - 60 || ball.y > board.y + board.h + 40){
        ball.flying = false; ball.active = false;
        setTimeout(endShot, 400);
      }
    }

    // particles
    for(const p of particles){
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.985; p.vy *= 0.985;
      p.life -= 0.02;
    }
    particles = particles.filter(p => p.life > 0);

    if (scoredAnim > 0) scoredAnim *= 0.9;
  }

  // Draw helpers
  function neonCircle(x,y,r,strokeCol,glow=12){
    ctx.save();
    ctx.strokeStyle = strokeCol; ctx.lineWidth = 3;
    ctx.shadowColor = strokeCol; ctx.shadowBlur = glow;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  function draw(){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,W,H);

    // neon background
    const g = ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0, '#041018');
    g.addColorStop(1, '#0b0014');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    // board outline
    ctx.fillStyle = '#0b0b0f';
    ctx.fillRect(board.x, board.y, board.w, board.h);
    // borders
    ctx.fillStyle = CYAN; ctx.fillRect(board.x-2, board.y, 2, board.h);
    ctx.fillStyle = PINK; ctx.fillRect(board.x+board.w, board.y, 2, board.h);

    // ramp
    ctx.save();
    ctx.beginPath();
    const rx = ramp.x, ry = ramp.y, rw = ramp.w, rh = ramp.h;
    ctx.moveTo(rx, ry+rh);
    ctx.lineTo(rx, ry+rh*0.45);
    ctx.quadraticCurveTo(rx+rw*0.5, ry+rh*0.05, rx+rw, ry+rh*0.45);
    ctx.lineTo(rx+rw, ry+rh);
    ctx.closePath();
    ctx.fillStyle = '#15151c';
    ctx.fill();
    // neon edge
    ctx.strokeStyle = CYAN; ctx.lineWidth = 2; ctx.shadowColor=CYAN; ctx.shadowBlur=10;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();

    // holes
    for(const h of holes){
      // outer glow ring
      neonCircle(h.x, h.y, h.r+5, h.color, 14);
      // inner ring
      neonCircle(h.x, h.y, h.r, '#ffffff', 6);
      // score label
      ctx.save();
      ctx.fillStyle = h.color; ctx.shadowColor=h.color; ctx.shadowBlur=10;
      ctx.font = 'bold 12px system-ui, -apple-system, Helvetica, Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('+'+h.score, h.x, h.y);
      ctx.restore();
    }

    // ball
    if (ball.active || ball.flying){
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = PINK; ctx.lineWidth = 2; ctx.shadowColor=PINK; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r*0.7, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // scored pulse
    if (scoredAnim > 0){
      ctx.globalAlpha = scoredAnim*0.6;
      ctx.fillStyle = '#fff';
      ctx.fillRect(board.x, board.y, board.w, board.h);
      ctx.globalAlpha = 1;
    }

    // particles
    for(const p of particles){
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
    }
    ctx.globalAlpha = 1;
  }

  // Init
  resize();
  // HUD
  hudScore.textContent = 'Score: 0'; hudShots.textContent = 'Shots: 10';
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
