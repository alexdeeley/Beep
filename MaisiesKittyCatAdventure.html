<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Maisie's Kitty Cat Adventure</title>
<style>
  @font-face {
    font-family: 'Baloo';
    src: local('Arial');
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#150826;
    font-family: 'Fredoka', 'Baloo 2', 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
    touch-action: none;
  }
  #gameCanvas {
    display:block;
    width:100%; height:100%;
    touch-action:none;
  }

  /* ---------- HUD ---------- */
  #hud {
    position:fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:10;
  }
  #titleBar {
    position:absolute; top: max(14px, env(safe-area-inset-top)); left:0; width:100%;
    display:flex; flex-direction:column; align-items:center;
    gap:6px;
  }
  #gameTitle {
    font-size: 22px;
    letter-spacing: 1px;
    color:#fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.6), 0 3px 0 rgba(0,0,0,0.25);
    font-weight: 800;
    opacity:0.92;
  }
  #pawMeter {
    display:flex; align-items:center; gap:10px;
    background: rgba(20,8,40,0.55);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 999px;
    padding: 6px 18px 6px 10px;
    backdrop-filter: blur(4px);
  }
  #pawIcon { font-size:22px; filter: drop-shadow(0 0 6px rgba(255,255,255,0.5)); }
  #meterTrack {
    width: 140px; height:14px;
    background: rgba(255,255,255,0.18);
    border-radius: 999px;
    overflow:hidden;
    position:relative;
  }
  #meterFill {
    height:100%;
    width:0%;
    border-radius:999px;
    background: linear-gradient(90deg,#ff3d9a,#ff9a3d,#ffd23d,#3dd6ff);
    transition: width 0.35s ease-out;
  }
  #levelLabel {
    font-size: 14px; color:#ffd23d; font-weight:800; min-width: 64px; text-align:left;
    text-shadow: 0 0 8px rgba(255,210,61,0.6);
  }

  #goalBanner {
    position:absolute; top: 86px; left:50%; transform: translateX(-50%);
    background: rgba(20,8,40,0.55);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 14px;
    padding: 6px 16px;
    font-size: 13px;
    color:#fff;
    opacity:0.85;
    white-space:nowrap;
  }

  /* ---------- Start / Win overlays ---------- */
  .overlay {
    position:fixed; top:0; left:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 30%, #2d1457 0%, #150826 70%);
    z-index:50;
    flex-direction:column;
    text-align:center;
    padding: 24px;
  }
  .hidden { display:none !important; }

  .bigTitle {
    font-size: clamp(30px, 9vw, 54px);
    color:#fff;
    line-height:1.15;
    text-shadow: 0 0 18px rgba(255,255,255,0.55), 0 4px 0 rgba(0,0,0,0.3);
    font-weight:800;
    margin-bottom: 6px;
  }
  .bigTitle .pop1 { color:#ff3d9a; }
  .bigTitle .pop2 { color:#ffd23d; }
  .bigTitle .pop3 { color:#3dd6ff; }
  .subTitle {
    font-size: clamp(14px, 4vw, 18px);
    color: rgba(255,255,255,0.85);
    margin-bottom: 28px;
    max-width: 480px;
  }
  .startKitty {
    font-size: 90px;
    margin-bottom: 12px;
    animation: floaty 2.2s ease-in-out infinite;
    filter: drop-shadow(0 0 24px rgba(255, 61, 154, 0.45));
  }
  @keyframes floaty {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-14px) rotate(3deg); }
  }
  .playBtn {
    font-size: clamp(20px, 5.5vw, 28px);
    font-weight:800;
    color:#150826;
    background: linear-gradient(135deg,#ffd23d,#ff9a3d);
    border:none;
    border-radius: 999px;
    padding: 16px 52px;
    cursor:pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25), 0 0 30px rgba(255,210,61,0.5);
    letter-spacing: 1px;
    pointer-events:all;
    transition: transform 0.12s ease;
  }
  .playBtn:active { transform: scale(0.94) translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.25); }

  .legendRow {
    display:flex; gap:18px; margin-top: 26px; font-size: 30px;
    flex-wrap: wrap; justify-content:center; max-width: 420px;
  }
  .legendRow span { filter: drop-shadow(0 0 8px rgba(255,255,255,0.3)); }

  #winEmoji { font-size: 100px; animation: spinpop 1.4s ease-in-out infinite; }
  @keyframes spinpop {
    0%,100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.15) rotate(8deg); }
  }

  /* ---------- floating popup text (score gulps) ---------- */
  .floatText {
    position:absolute;
    font-weight:800;
    pointer-events:none;
    z-index:20;
    text-shadow: 0 0 8px rgba(0,0,0,0.4);
    will-change: transform, opacity;
  }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Beep" title="Back to Beep">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div id="titleBar">
    <div id="pawMeter">
      <div id="pawIcon">🐾</div>
      <div id="meterTrack"><div id="meterFill"></div></div>
      <div id="levelLabel">Tiny</div>
    </div>
  </div>
  <div id="goalBanner">Drag the kitty to gobble treats!</div>
</div>

<div id="startScreen" class="overlay">
  <div class="startKitty">🐱</div>
  <div class="bigTitle">Maisie's <span class="pop1">Kitty Cat</span><br><span class="pop2">Adventure</span></div>
  <div class="subTitle">Part One: The Adventure Into the City — become the <b>BIGGEST KITTY</b> the world has ever seen!</div>
  <button class="playBtn" id="playBtn">▶ PLAY</button>
  <div class="legendRow">
    <span>🍔</span><span>🥤</span><span>✨</span><span>🌈</span><span>🎩</span><span>🦄</span><span>🐶</span>
  </div>
</div>

<div id="winScreen" class="overlay hidden">
  <div id="winEmoji">🐱👑</div>
  <div class="bigTitle"><span class="pop3">YOU DID IT!</span></div>
  <div class="subTitle" id="winText">Maisie's kitty is now the BIGGEST KITTY in the whole city! The whole world is one big treat!</div>
  <button class="playBtn" id="playAgainBtn">PLAY AGAIN</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W, H;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ============ WORLD SETUP ============
  const WORLD_SIZE = 3400; // square world, kitty starts in middle
  const world = { w: WORLD_SIZE, h: WORLD_SIZE };

  // Levels / size thresholds - kitty grows through named stages
  const LEVELS = [
    { name: 'Tiny',     size: 22,  needed: 0    },
    { name: 'Little',   size: 30,  needed: 12   },
    { name: 'Growing',  size: 40,  needed: 30   },
    { name: 'Big',      size: 54,  needed: 60   },
    { name: 'Huge',     size: 70,  needed: 105  },
    { name: 'Giant',    size: 90,  needed: 165  },
    { name: 'Colossal', size: 115, needed: 240  },
    { name: 'MEGA',     size: 145, needed: 330  },
    { name: 'WORLD',    size: 185, needed: 440  },
  ];
  const WIN_SCORE = 560;

  // ============ CAT STATE ============
  const cat = {
    x: world.w/2, y: world.h/2,
    vx: 0, vy: 0,
    size: LEVELS[0].size,
    targetSize: LEVELS[0].size,
    levelIdx: 0,
    score: 0,
    bob: 0,
    squish: 1,
    squishVel: 0,
    facing: 1,
    sparkleTrail: false,
    rainbowTimer: 0,
    hatTimer: 0,
    trailParticles: [],
  };

  // ============ INPUT (drag/swipe) ============
  let pointerActive = false;
  let pointer = { x: 0, y: 0 };
  let catScreenPos = { x: 0, y: 0 }; // updated each frame

  function getPointerPos(e) {
    const t = e.touches ? e.touches[0] : e;
    const rect = canvas.getBoundingClientRect();
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  canvas.addEventListener('pointerdown', (e) => {
    pointerActive = true;
    pointer = getPointerPos(e);
  });
  window.addEventListener('pointermove', (e) => {
    if (!pointerActive) return;
    pointer = getPointerPos(e);
  });
  window.addEventListener('pointerup', () => { pointerActive = false; });
  window.addEventListener('pointercancel', () => { pointerActive = false; });

  // ============ CAMERA ============
  const camera = { x: 0, y: 0 };

  // ============ CITY DECORATION (background buildings, fixed) ============
  const buildings = [];
  (function genCity() {
    let rng = mulberry32(1337);
    const gridSize = 220;
    for (let gx = -1; gx * gridSize < world.w + gridSize; gx++) {
      for (let gy = -1; gy * gridSize < world.h + gridSize; gy++) {
        if (rng() < 0.55) {
          const bx = gx * gridSize + rng() * 60 - 30;
          const by = gy * gridSize + rng() * 60 - 30;
          const w = 70 + rng() * 90;
          const h = 70 + rng() * 90;
          const hue = [ '#3a1f63','#241048','#4a2a78','#2c1554','#33186a' ][Math.floor(rng()*5)];
          const glow = rng() < 0.35;
          buildings.push({ x: bx, y: by, w, h, color: hue, glow,
            glowColor: ['#ff3d9a','#3dd6ff','#ffd23d','#9b5cff'][Math.floor(rng()*4)],
            windows: Math.floor(2 + rng()*3) });
        }
      }
    }
  })();

  function mulberry32(seed) {
    return function() {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ============ STARS / AMBIENT TWINKLES (fixed in world) ============
  const ambientSparkles = [];
  {
    let rng = mulberry32(99);
    for (let i = 0; i < 220; i++) {
      ambientSparkles.push({
        x: rng() * world.w, y: rng() * world.h,
        r: 1 + rng() * 2,
        phase: rng() * Math.PI * 2,
        speed: 0.5 + rng() * 1.5,
      });
    }
  }

  // ============ COLLECTIBLES ============
  // types: treat (small generic), burger, milkshake, sparkle, rainbow, tophat, cat, dog, unicorn
  const ITEM_TYPES = {
    burger:   { emoji:'🍔', value: 3,  r: 16 },
    milkshake:{ emoji:'🥤', value: 3,  r: 16 },
    sparkle:  { emoji:'✨', value: 2,  r: 13 },
    rainbow:  { emoji:'🌈', value: 8,  r: 20, special:'rainbow' },
    tophat:   { emoji:'🎩', value: 5,  r: 16, special:'hat' },
    cat:      { emoji:'🐱', value: 4,  r: 15 },
    dog:      { emoji:'🐶', value: 4,  r: 15 },
    unicorn:  { emoji:'🦄', value: 10, r: 19 },
    treat:    { emoji:'🍪', value: 1,  r: 11 },
  };
  const TYPE_KEYS = Object.keys(ITEM_TYPES);
  const TYPE_WEIGHTS = { treat:30, burger:14, milkshake:14, sparkle:18, cat:8, dog:8, unicorn:5, rainbow:3, tophat:6 };

  let items = [];
  const MAX_ITEMS = 140;

  function weightedRandomType() {
    let total = 0;
    for (const k of TYPE_KEYS) total += TYPE_WEIGHTS[k];
    let r = Math.random() * total;
    for (const k of TYPE_KEYS) {
      r -= TYPE_WEIGHTS[k];
      if (r <= 0) return k;
    }
    return 'treat';
  }

  function spawnItem(near) {
    let x, y;
    if (near) {
      // spawn somewhere within view-ish distance of cat, but not too close
      const ang = Math.random() * Math.PI * 2;
      const dist = 400 + Math.random() * 900;
      x = cat.x + Math.cos(ang) * dist;
      y = cat.y + Math.sin(ang) * dist;
    } else {
      x = Math.random() * world.w;
      y = Math.random() * world.h;
    }
    x = Math.max(20, Math.min(world.w - 20, x));
    y = Math.max(20, Math.min(world.h - 20, y));
    const type = weightedRandomType();
    items.push({
      x, y, type,
      bob: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.02,
      scale: 1,
      eaten: false,
    });
  }

  for (let i = 0; i < MAX_ITEMS; i++) spawnItem(false);

  // ============ PARTICLES (confetti / gulp pop / sparkle trail) ============
  let particles = [];
  function burstConfetti(x, y, count, colors) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 2 + Math.random() * 5;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 1,
        life: 1,
        decay: 0.012 + Math.random() * 0.012,
        size: 4 + Math.random() * 6,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*Math.PI*2,
        vrot: (Math.random()-0.5)*0.3,
        type:'confetti'
      });
    }
  }
  function spawnGulpPop(x, y) {
    particles.push({ x, y, life:1, decay:0.05, size: 10, type:'pop' });
  }

  // ============ FLOATING SCORE TEXT (DOM) ============
  function showFloatText(screenX, screenY, text, color) {
    const el = document.createElement('div');
    el.className = 'floatText';
    el.textContent = text;
    el.style.left = screenX + 'px';
    el.style.top = screenY + 'px';
    el.style.fontSize = '20px';
    el.style.color = color || '#fff';
    document.body.appendChild(el);
    let t = 0;
    function anim() {
      t += 1;
      el.style.transform = `translate(-50%, ${-t*1.4}px)`;
      el.style.opacity = String(1 - t/40);
      if (t < 40) requestAnimationFrame(anim);
      else el.remove();
    }
    anim();
  }

  // ============ AUDIO (simple WebAudio blips, no external files) ============
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }
  function playGulp(pitch) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(pitch * 0.6, t0);
    osc.frequency.exponentialRampToValueAtTime(pitch * 1.4, t0 + 0.09);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.16, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + 0.18);
  }
  function playLevelUp() {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = f;
      const start = t0 + i * 0.09;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(start); osc.stop(start + 0.24);
    });
  }
  function playWin() {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 1046.5];
    notes.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      const start = t0 + i * 0.1;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.2, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(start); osc.stop(start + 0.32);
    });
  }

  // ============ SCREEN SHAKE / FLASH ============
  let screenShake = 0;
  let flashAlpha = 0;
  let flashColor = '255,255,255';

  // ============ GAME STATE ============
  let gameRunning = false;
  let gameWon = false;

  function getCurrentLevel() {
    let idx = 0;
    for (let i = 0; i < LEVELS.length; i++) {
      if (cat.score >= LEVELS[i].needed) idx = i;
    }
    return idx;
  }

  function updateMeterUI() {
    const lvl = LEVELS[cat.levelIdx];
    const nextNeeded = (cat.levelIdx + 1 < LEVELS.length) ? LEVELS[cat.levelIdx+1].needed : WIN_SCORE;
    const prevNeeded = lvl.needed;
    let pct = (cat.score - prevNeeded) / Math.max(1, (nextNeeded - prevNeeded));
    pct = Math.max(0, Math.min(1, pct));
    document.getElementById('meterFill').style.width = (pct*100) + '%';
    document.getElementById('levelLabel').textContent = lvl.name;
  }

  function eatItem(item, idx) {
    item.eaten = true;
    const def = ITEM_TYPES[item.type];
    cat.score += def.value;

    // visual feedback
    const sx = catScreenPos.x;
    const sy = catScreenPos.y - cat.size - 10;
    showFloatText(sx, sy, '+' + def.value, '#fff');
    spawnGulpPop(item.x, item.y);
    burstConfetti(item.x, item.y, 6, ['#ff3d9a','#ffd23d','#3dd6ff','#ff9a3d']);
    playGulp(380 + def.value * 18);

    cat.squishVel = -0.18; // squish on gulp

    if (def.special === 'rainbow') {
      cat.rainbowTimer = 5.0; // seconds of rainbow trail
      flashAlpha = 0.5; flashColor = '255,255,255';
    }
    if (def.special === 'hat') {
      cat.hatTimer = 9999; // hat is permanent once first collected (cosmetic delight)
      cat.gotHat = true;
    }

    // remove and respawn elsewhere
    items.splice(idx, 1);
    spawnItem(true);

    // check level up
    const newLevelIdx = getCurrentLevel();
    if (newLevelIdx > cat.levelIdx) {
      cat.levelIdx = newLevelIdx;
      cat.targetSize = LEVELS[newLevelIdx].size;
      screenShake = 14;
      flashAlpha = 0.65; flashColor = '255,210,61';
      burstConfetti(cat.x, cat.y, 50, ['#ff3d9a','#ffd23d','#3dd6ff','#ff9a3d','#9b5cff','#5cffa3']);
      cat.sparkleTrail = true;
      playLevelUp();
      const banner = document.getElementById('goalBanner');
      banner.textContent = LEVELS[newLevelIdx].name + ' kitty! Keep going!';
      banner.style.transform = 'translateX(-50%) scale(1.15)';
      setTimeout(()=> banner.style.transform = 'translateX(-50%) scale(1)', 200);
    }

    if (cat.score >= WIN_SCORE && !gameWon) {
      triggerWin();
    }
    updateMeterUI();
  }

  function triggerWin() {
    gameWon = true;
    gameRunning = false;
    playWin();
    burstConfetti(cat.x, cat.y, 120, ['#ff3d9a','#ffd23d','#3dd6ff','#ff9a3d','#9b5cff','#5cffa3','#fff']);
    setTimeout(() => {
      document.getElementById('winScreen').classList.remove('hidden');
    }, 700);
  }

  // ============ MAIN UPDATE ============
  let lastTime = performance.now();

  function update(dt) {
    if (!gameRunning) return;

    // --- movement: drag toward pointer ---
    if (pointerActive) {
      const dx = pointer.x - catScreenPos.x;
      const dy = pointer.y - catScreenPos.y;
      const dist = Math.hypot(dx, dy);
      const maxSpeed = 5.6 + cat.size * 0.018;
      if (dist > 4) {
        const pull = Math.min(1, dist / 140);
        cat.vx += (dx/dist) * maxSpeed * pull * 0.22;
        cat.vy += (dy/dist) * maxSpeed * pull * 0.22;
        if (Math.abs(dx) > 2) cat.facing = dx > 0 ? 1 : -1;
      }
    }
    // friction
    cat.vx *= 0.86;
    cat.vy *= 0.86;
    // clamp speed
    const sp = Math.hypot(cat.vx, cat.vy);
    const maxSpeed2 = 6.5 + cat.size * 0.02;
    if (sp > maxSpeed2) {
      cat.vx = cat.vx / sp * maxSpeed2;
      cat.vy = cat.vy / sp * maxSpeed2;
    }
    cat.x += cat.vx;
    cat.y += cat.vy;
    cat.x = Math.max(cat.size, Math.min(world.w - cat.size, cat.x));
    cat.y = Math.max(cat.size, Math.min(world.h - cat.size, cat.y));

    // bob & squish animation
    cat.bob += dt * 0.005 * (1 + sp*0.4);
    cat.squishVel += (1 - cat.squish) * 0.02;
    cat.squishVel *= 0.78;
    cat.squish += cat.squishVel;
    cat.size += (cat.targetSize - cat.size) * 0.06;

    if (cat.rainbowTimer > 0) cat.rainbowTimer -= dt/1000;

    // sparkle trail particles
    if (cat.sparkleTrail && Math.random() < 0.6) {
      particles.push({
        x: cat.x + (Math.random()-0.5)*cat.size,
        y: cat.y + (Math.random()-0.5)*cat.size,
        life: 1, decay: 0.02 + Math.random()*0.02,
        size: 3 + Math.random()*4,
        color: ['#ff3d9a','#ffd23d','#3dd6ff','#9b5cff'][Math.floor(Math.random()*4)],
        vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5 - 0.3,
        type:'trail'
      });
    }

    // camera follows cat (centered)
    camera.x = cat.x - W/2;
    camera.y = cat.y - H/2;
    camera.x = Math.max(0, Math.min(world.w - W, camera.x));
    camera.y = Math.max(0, Math.min(world.h - H, camera.y));

    catScreenPos.x = cat.x - camera.x;
    catScreenPos.y = cat.y - camera.y;

    // collisions with items
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      const def = ITEM_TYPES[it.type];
      const dx = it.x - cat.x, dy = it.y - cat.y;
      const dist = Math.hypot(dx, dy);
      if (dist < cat.size * 0.85 + def.r * 0.5) {
        eatItem(it, i);
      }
    }

    // maintain item count
    while (items.length < MAX_ITEMS) spawnItem(true);

    // update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= p.decay;
      if (p.vx !== undefined) { p.x += p.vx; p.y += p.vy; p.vy += 0.06; }
      if (p.rot !== undefined) p.rot += p.vrot;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (screenShake > 0) screenShake *= 0.88;
    if (screenShake < 0.3) screenShake = 0;
    if (flashAlpha > 0) flashAlpha -= dt * 0.0022;
    if (flashAlpha < 0) flashAlpha = 0;
  }

  // ============ DRAW ============
  function worldToScreen(x, y) {
    return { x: x - camera.x, y: y - camera.y };
  }

  function drawBackground() {
    // sky gradient
    const grad = ctx.createRadialGradient(W/2, H*0.35, 60, W/2, H*0.5, Math.max(W,H)*0.9);
    grad.addColorStop(0, '#2d1457');
    grad.addColorStop(0.55, '#1d0c3d');
    grad.addColorStop(1, '#0f0620');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);
  }

  function drawCity(time) {
    for (const b of buildings) {
      const sx = b.x - camera.x;
      const sy = b.y - camera.y;
      if (sx + b.w < -50 || sx > W + 50 || sy + b.h < -50 || sy > H + 50) continue;
      ctx.fillStyle = b.color;
      roundRect(sx, sy, b.w, b.h, 8);
      ctx.fill();
      // windows
      const rows = b.windows;
      const cols = Math.max(1, Math.floor(b.w / 22));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const wx = sx + 10 + c * (b.w-20)/Math.max(1,cols-1||1);
          const wy = sy + 14 + r * (b.h - 28)/Math.max(1,rows-1||1);
          const flick = (Math.sin(time*0.001 + r*3 + c*5 + b.x) + 1)/2;
          if (b.glow) {
            ctx.fillStyle = b.glowColor;
            ctx.globalAlpha = 0.35 + flick*0.5;
          } else {
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = 0.06 + flick*0.08;
          }
          ctx.fillRect(wx-3, wy-3, 6, 6);
        }
      }
      ctx.globalAlpha = 1;
    }
  }

  function roundRect(x,y,w,h,r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawAmbientSparkles(time) {
    for (const s of ambientSparkles) {
      const sp = worldToScreen(s.x, s.y);
      if (sp.x < -10 || sp.x > W+10 || sp.y < -10 || sp.y > H+10) continue;
      const tw = (Math.sin(time*0.001*s.speed + s.phase) + 1)/2;
      ctx.globalAlpha = 0.15 + tw*0.5;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawItems(time) {
    for (const it of items) {
      const sp = worldToScreen(it.x, it.y);
      if (sp.x < -40 || sp.x > W+40 || sp.y < -40 || sp.y > H+40) continue;
      const def = ITEM_TYPES[it.type];
      const bobY = Math.sin(time*0.003 + it.bob) * 4;
      const scale = 1 + Math.sin(time*0.004 + it.bob)*0.06;
      ctx.save();
      ctx.translate(sp.x, sp.y + bobY);
      ctx.scale(scale, scale);
      // soft glow circle behind special items
      if (def.special) {
        const g = ctx.createRadialGradient(0,0,0,0,0,def.r*2.2);
        g.addColorStop(0, 'rgba(255,255,255,0.35)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0,0,def.r*2.2,0,Math.PI*2); ctx.fill();
      }
      ctx.font = (def.r*2) + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(def.emoji, 0, 2);
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      const sp = worldToScreen(p.x, p.y);
      ctx.globalAlpha = Math.max(0, p.life);
      if (p.type === 'pop') {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, (1-p.life)*30, 0, Math.PI*2);
        ctx.stroke();
      } else if (p.type === 'confetti') {
        ctx.save();
        ctx.translate(sp.x, sp.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
        ctx.restore();
      } else if (p.type === 'trail') {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, p.size*p.life, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawCat(time) {
    const sp = catScreenPos;
    ctx.save();
    ctx.translate(sp.x, sp.y);

    const bobY = Math.sin(cat.bob*10) * 3;
    ctx.translate(0, bobY);

    const sx = cat.facing;
    ctx.scale(sx, 1);

    const sizeX = cat.size * (2 - cat.squish);
    const sizeY = cat.size * cat.squish;

    // rainbow trail ring when rainbow powerup active
    if (cat.rainbowTimer > 0) {
      const hue = (time * 0.2) % 360;
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = `hsl(${hue},90%,65%)`;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(0, 0, cat.size*1.25, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    // shadow
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(0, cat.size*0.95, cat.size*0.8, cat.size*0.22, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // body
    const bodyColor = '#ff9ec4';
    const bodyDark = '#e0689f';
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.ellipse(0, 0, sizeX*0.5, sizeY*0.5, 0, 0, Math.PI*2);
    ctx.fill();

    // ears
    ctx.fillStyle = bodyColor;
    const earSize = cat.size * 0.42;
    ctx.beginPath();
    ctx.moveTo(-sizeX*0.32, -sizeY*0.38);
    ctx.lineTo(-sizeX*0.5, -sizeY*0.38 - earSize);
    ctx.lineTo(-sizeX*0.08, -sizeY*0.55);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sizeX*0.32, -sizeY*0.38);
    ctx.lineTo(sizeX*0.5, -sizeY*0.38 - earSize);
    ctx.lineTo(sizeX*0.08, -sizeY*0.55);
    ctx.closePath(); ctx.fill();
    // inner ears
    ctx.fillStyle = '#ffd4e6';
    ctx.beginPath();
    ctx.moveTo(-sizeX*0.30, -sizeY*0.40);
    ctx.lineTo(-sizeX*0.40, -sizeY*0.40 - earSize*0.55);
    ctx.lineTo(-sizeX*0.16, -sizeY*0.50);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sizeX*0.30, -sizeY*0.40);
    ctx.lineTo(sizeX*0.40, -sizeY*0.40 - earSize*0.55);
    ctx.lineTo(sizeX*0.16, -sizeY*0.50);
    ctx.closePath(); ctx.fill();

    // cheeks/face shading
    ctx.fillStyle = bodyDark;
    ctx.globalAlpha = 0.25;
    ctx.beginPath();
    ctx.ellipse(0, sizeY*0.18, sizeX*0.42, sizeY*0.28, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // eyes
    const eyeY = -sizeY*0.06;
    const eyeSpace = sizeX*0.19;
    ctx.fillStyle = '#2a1438';
    ctx.beginPath(); ctx.arc(-eyeSpace, eyeY, cat.size*0.085, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(eyeSpace, eyeY, cat.size*0.085, 0, Math.PI*2); ctx.fill();
    // eye shine
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-eyeSpace+cat.size*0.03, eyeY-cat.size*0.03, cat.size*0.03, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(eyeSpace+cat.size*0.03, eyeY-cat.size*0.03, cat.size*0.03, 0, Math.PI*2); ctx.fill();

    // nose
    ctx.fillStyle = '#ff5c93';
    ctx.beginPath();
    ctx.moveTo(0, eyeY + cat.size*0.13);
    ctx.lineTo(-cat.size*0.05, eyeY + cat.size*0.2);
    ctx.lineTo(cat.size*0.05, eyeY + cat.size*0.2);
    ctx.closePath(); ctx.fill();

    // mouth
    ctx.strokeStyle = '#2a1438';
    ctx.lineWidth = Math.max(1.5, cat.size*0.025);
    ctx.beginPath();
    ctx.moveTo(0, eyeY + cat.size*0.2);
    ctx.quadraticCurveTo(-cat.size*0.12, eyeY + cat.size*0.32, -cat.size*0.2, eyeY + cat.size*0.2);
    ctx.moveTo(0, eyeY + cat.size*0.2);
    ctx.quadraticCurveTo(cat.size*0.12, eyeY + cat.size*0.32, cat.size*0.2, eyeY + cat.size*0.2);
    ctx.stroke();

    // whiskers
    ctx.lineWidth = Math.max(1, cat.size*0.018);
    ctx.globalAlpha = 0.7;
    [-1,1].forEach(side=>{
      for (let w=0; w<3; w++) {
        ctx.beginPath();
        const yOff = eyeY + cat.size*0.12 + w*cat.size*0.07;
        ctx.moveTo(side*sizeX*0.28, yOff);
        ctx.lineTo(side*sizeX*0.55, yOff - cat.size*0.05 + w*cat.size*0.04);
        ctx.stroke();
      }
    });
    ctx.globalAlpha = 1;

    // tail
    ctx.strokeStyle = bodyColor;
    ctx.lineWidth = cat.size*0.22;
    ctx.lineCap = 'round';
    ctx.beginPath();
    const tailWag = Math.sin(time*0.004) * cat.size*0.2;
    ctx.moveTo(sizeX*0.42, sizeY*0.2);
    ctx.quadraticCurveTo(sizeX*0.75 + tailWag*0.3, sizeY*0.1, sizeX*0.7+tailWag, -sizeY*0.35);
    ctx.stroke();

    // top hat (cosmetic, once earned)
    if (cat.gotHat) {
      ctx.save();
      ctx.translate(0, -sizeY*0.62);
      ctx.fillStyle = '#1a0f2e';
      ctx.fillRect(-cat.size*0.26, -cat.size*0.36, cat.size*0.52, cat.size*0.34);
      ctx.beginPath();
      ctx.ellipse(0, 0, cat.size*0.34, cat.size*0.09, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#9b5cff';
      ctx.fillRect(-cat.size*0.26, -cat.size*0.08, cat.size*0.52, cat.size*0.07);
      // little sparkle on hat
      ctx.fillStyle = '#ffd23d';
      ctx.font = (cat.size*0.18)+'px serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('✨', cat.size*0.2, -cat.size*0.2);
      ctx.restore();
    }

    ctx.restore();
  }

  function drawVignette() {
    const grad = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.72);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(8,3,18,0.55)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);
  }

  function render(time) {
    ctx.save();
    if (screenShake > 0.3) {
      ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
    }
    drawBackground();
    drawCity(time);
    drawAmbientSparkles(time);
    drawItems(time);
    drawParticles();
    if (gameRunning || gameWon) drawCat(time);
    drawVignette();
    ctx.restore();

    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(${flashColor},${flashAlpha})`;
      ctx.fillRect(0,0,W,H);
    }
  }

  // ============ LOOP ============
  function loop(now) {
    const dt = Math.min(40, now - lastTime);
    lastTime = now;
    update(dt);
    render(now);
    requestAnimationFrame(loop);
  }

  // ============ START / RESET ============
  function resetGame() {
    cat.x = world.w/2; cat.y = world.h/2;
    cat.vx = 0; cat.vy = 0;
    cat.size = LEVELS[0].size;
    cat.targetSize = LEVELS[0].size;
    cat.levelIdx = 0;
    cat.score = 0;
    cat.squish = 1; cat.squishVel = 0;
    cat.sparkleTrail = false;
    cat.rainbowTimer = 0;
    cat.gotHat = false;
    particles = [];
    items = [];
    for (let i = 0; i < MAX_ITEMS; i++) spawnItem(false);
    camera.x = cat.x - W/2; camera.y = cat.y - H/2;
    catScreenPos.x = W/2; catScreenPos.y = H/2;
    document.getElementById('goalBanner').textContent = 'Drag the kitty to gobble treats!';
    updateMeterUI();
  }

  document.getElementById('playBtn').addEventListener('click', () => {
    ensureAudio();
    resetGame();
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('winScreen').classList.add('hidden');
    gameRunning = true;
    gameWon = false;
  });
  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio();
    resetGame();
    document.getElementById('winScreen').classList.add('hidden');
    gameRunning = true;
    gameWon = false;
  });

  // init camera/screen pos before first frame
  camera.x = cat.x - W/2; camera.y = cat.y - H/2;
  catScreenPos.x = W/2; catScreenPos.y = H/2;
  updateMeterUI();

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
