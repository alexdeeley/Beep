name: Newswire

# The festival-poster finder: each cycle searches the web, worldwide, for major music festivals that
# have JUST announced their lineup/poster, independently re-verifies each candidate
# (2-corroborating-source rule), and posts the festival's own official poster image for each one that
# clears the bar. There is no wall-clock-sensitive "posting hours" gate (unlike the pipeline this
# replaced) - a cycle just checks and posts whatever it finds, so a plain fixed-UTC cron is fine; no
# DST-hedge cron pairing is needed.
#
# The concurrency group below is load-bearing, not just an overlap-prevention nicety: it's what keeps
# concurrent runs of this workflow from racing each other's read-modify-write of the shared R2-hosted
# story database (which here only remembers which festival editions have already posted).
#
# PAUSED 2026-09-20 at the account owner's request ("technical issues") - schedule commented out below,
# not deleted, so resuming is just uncommenting these lines. workflow_dispatch stays active so a run
# can still be triggered manually while paused.
on:
  # schedule:
  #   - cron: "0 14 * * *" # ~once in the morning, UTC
  #   - cron: "0 2 * * *" # ~once in the evening, UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: run for real but never publish or persist story database changes (same as news:preview)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: on-this-day-newswire
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # better-sqlite3's native binary requires Node >=22 (see package.json's engines field) -
          # Node 20 caused a segfault (exit code 139) opening the downloaded SQLite database.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run newswire cycle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="news:preview"
          else
            CMD="news:publish"
          fi
          echo "Running: npm run $CMD"
          npm run $CMD

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newswire-run-${{ github.run_id }}
          path: runs/news/
          retention-days: 14
          if-no-files-found: ignore
