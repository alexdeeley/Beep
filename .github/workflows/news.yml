name: Newswire

# The gig-poster finder: each cycle searches the web, worldwide, for notable music events - festivals,
# but equally an individual artist's tour, a one-off gig, or a residency - that have JUST announced their
# poster, independently re-verifies each candidate (2-corroborating-source rule), and posts the event's
# own official poster image for each one that clears the bar. There is no wall-clock-sensitive "posting
# hours" gate (unlike the pipeline this replaced) - a cycle just checks and posts whatever it finds, so a
# plain fixed-UTC cron is fine; no DST-hedge cron pairing is needed.
#
# A separate weekly "Throwback Thursday" cycle (the third cron entry below, detected at runtime via
# github.event.schedule) runs the opposite search: one real, historically notable festival poster from
# ANY past year, with the same verification rigor but no freshness requirement at all - see
# festivalPosters/postThrowbackPoster.ts.
#
# The concurrency group below is load-bearing, not just an overlap-prevention nicety: it's what keeps
# concurrent runs of this workflow from racing each other's read-modify-write of the shared R2-hosted
# story database (which here only remembers which festival editions have already posted).
#
on:
  schedule:
    - cron: "0 14 * * *" # ~once in the morning, UTC
    - cron: "0 2 * * *" # ~once in the evening, UTC
    - cron: "0 16 * * 4" # Throwback Thursday: once a week, UTC Thursday afternoon - see github.event.schedule check below
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: run for real but never publish or persist story database changes (same as news:preview / news:throwback-preview)"
        required: false
        type: boolean
        default: false
      throwback:
        description: "Run a Throwback Thursday cycle (one historical festival poster from any past year) instead of a normal just-announced cycle"
        required: false
        type: boolean
        default: false
      confirm_delete_all_posts:
        description: 'DESTRUCTIVE, IRREVERSIBLE: type exactly "yes-delete-everything" to permanently delete every post on the account instead of running a normal cycle. Leave blank for a normal run.'
        required: false
        type: string
        default: ""
      sample_festival_file:
        description: "Path to a committed samples/festivals/*.json file to post via news:post-sample (bypasses discovery/verification for a manually-curated demo post). Leave blank for a normal run."
        required: false
        type: string
        default: ""
      sample_festival_dir:
        description: "Path to a committed directory of samples/festivals/*.json files to post via news:post-sample-batch, back-to-back in one run (e.g. a festival's whole retrospective series). Leave blank for a normal run."
        required: false
        type: string
        default: ""
      remove_post_uri:
        description: "at:// URI of a single wrongly-published post to correct via news:remove-post (e.g. extraction matched an unrelated photo, not the real poster). Requires remove_post_festival_name too. Leave blank for a normal run."
        required: false
        type: string
        default: ""
      remove_post_festival_name:
        description: "The exact festivalName this pipeline recorded for the post being removed (see its alt text's header line, with any trailing year stripped) - needed to find and clear its dedup row."
        required: false
        type: string
        default: ""
      remove_post_event_year:
        description: "The event year recorded for the post being removed, if any. Leave blank if the post had no year."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: on-this-day-newswire
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    # 30 rather than a tighter cap specifically to give news:post-sample-batch headroom - a large
    # one-off retrospective batch (dozens of items, each a real network fetch/upload plus a persisted
    # DB upload after every successful post) can run considerably longer than a normal cycle.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # better-sqlite3's native binary requires Node >=22 (see package.json's engines field) -
          # Node 20 caused a segfault (exit code 139) opening the downloaded SQLite database.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run newswire cycle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          CONFIRM_DELETE_ALL_POSTS: ${{ inputs.confirm_delete_all_posts }}
          SAMPLE_FESTIVAL_FILE: ${{ inputs.sample_festival_file }}
          SAMPLE_FESTIVAL_DIR: ${{ inputs.sample_festival_dir }}
          REMOVE_POST_URI: ${{ inputs.remove_post_uri }}
          REMOVE_POST_FESTIVAL_NAME: ${{ inputs.remove_post_festival_name }}
          REMOVE_POST_EVENT_YEAR: ${{ inputs.remove_post_event_year }}
        run: |
          if [ "${{ inputs.confirm_delete_all_posts }}" = "yes-delete-everything" ]; then
            CMD="news:delete-all-posts"
          elif [ -n "$REMOVE_POST_URI" ]; then
            CMD="news:remove-post"
            ARGS="-- --uri \"$REMOVE_POST_URI\" --festival-name \"$REMOVE_POST_FESTIVAL_NAME\""
            if [ -n "$REMOVE_POST_EVENT_YEAR" ]; then
              ARGS="$ARGS --event-year $REMOVE_POST_EVENT_YEAR"
            fi
          elif [ -n "$SAMPLE_FESTIVAL_FILE" ]; then
            CMD="news:post-sample"
            ARGS="-- --file $SAMPLE_FESTIVAL_FILE"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
          elif [ -n "$SAMPLE_FESTIVAL_DIR" ]; then
            CMD="news:post-sample-batch"
            ARGS="-- --dir $SAMPLE_FESTIVAL_DIR"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
          elif [ "${{ github.event.schedule }}" = "0 16 * * 4" ] || [ "${{ inputs.throwback }}" = "true" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              CMD="news:throwback-preview"
            else
              CMD="news:throwback-publish"
            fi
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="news:preview"
          else
            CMD="news:publish"
          fi
          echo "Running: npm run $CMD $ARGS"
          # eval (not a plain unquoted expansion) because the news:remove-post branch embeds its own
          # double-quotes in $ARGS to safely carry a --festival-name value that can contain spaces -
          # a plain `npm run $CMD $ARGS` would word-split that apart instead of honoring the quoting.
          eval "npm run $CMD $ARGS"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newswire-run-${{ github.run_id }}
          path: runs/news/
          retention-days: 14
          if-no-files-found: ignore
