name: Daily On This Day post

# RETIRED FROM SCHEDULE: the account's primary hourly posting cadence is
# now the newswire pipeline (see news.yml) - this workflow's `schedule`
# trigger has been removed so it no longer fires automatically. The full
# pipeline (runDaily.ts and everything under src/research, src/verification,
# src/selection, src/art, src/render, src/qa, src/caption) is intentionally
# left in place, unscheduled, and still runnable via workflow_dispatch below
# for manual/archival use.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Override publish date (YYYY-MM-DD). Leave blank to use today in APP_TIMEZONE."
        required: false
        type: string
      dry_run:
        description: "Run the full pipeline but never actually publish to Bluesky"
        required: false
        type: boolean
        default: false
      fixture:
        description: "Use the bundled August 29 test fixture instead of calling OpenAI (for pipeline testing only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: on-this-day-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # better-sqlite3's native binary requires Node >=22 (see package.json's engines field) -
          # src/cli/index.ts statically imports the newswire module tree (including
          # better-sqlite3) regardless of which command runs, so every workflow needs this bump.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run daily pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          APP_TIMEZONE: ${{ vars.APP_TIMEZONE }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.fixture }}" = "true" ]; then ARGS="$ARGS --fixture"; fi
          echo "Running: npm run daily -- $ARGS"
          npm run daily -- $ARGS

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: on-this-day-run-${{ github.run_id }}
          path: runs/
          retention-days: 30
