name: Deploy Cloudflare Workers

# Manual: Actions → "Deploy Cloudflare Workers" → Run workflow → pick an app.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   (or CLOUDFLARE_API, which wins if both exist) an API token from the "Edit Cloudflare Workers" template,
#                          limited to the deeley.org zone
#   CLOUDFLARE_ACCOUNT_ID  optional if the token can see only one account
# The token stays in GitHub; nothing in the repo or in any chat ever holds it.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to deploy
        type: choice
        options: [arkanoid-duel, gallery, both, diagnose]
        default: arkanoid-duel

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  arkanoid-duel:
    if: inputs.app == 'arkanoid-duel' || inputs.app == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: arkanoid-duel
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arkanoid-duel/package-lock.json
      - name: Check the token is there
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret first"; exit 1; }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - name: Deploy
        run: npx wrangler deploy
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS https://duel.deeley.org/health && exit 0
            sleep 10
          done
          echo "::warning::Deployed, but https://duel.deeley.org/health did not answer yet (a new custom domain can take a few minutes)"

  gallery:
    if: inputs.app == 'gallery' || inputs.app == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gallery
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the token is there
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret first"; exit 1; }
      - run: npm install
      - run: npm test
      - name: Deploy
        run: npx wrangler deploy

  # Read-only checks: what can the token actually do? Prints results only, never the token.
  diagnose:
    if: inputs.app == 'diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the token against the account and the zone
        run: |
          api() { curl -sS -m 25 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          show() { python3 -c "import sys,json; d=json.load(sys.stdin); print('  success:', d.get('success'), '| errors:', [(e.get('code'), e.get('message')) for e in d.get('errors') or []])"; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "No CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "No CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          echo "1. Token type: account-owned (cfat_) or user (cfut_)?"; echo "  prefix: ${CLOUDFLARE_API_TOKEN:0:5}"
          echo "2. Account-owned token verify:"; api "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or {}; print('  success:', d.get('success'), '| status:', r.get('status'), '| expires:', r.get('expires_on'), '| errors:', [(e.get('code'), e.get('message')) for e in d.get('errors') or []])"
          echo "3. User token verify (id and expiry are not secret; match the id to your token in the dashboard):"; api "/user/tokens/verify" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or {}; print('  success:', d.get('success'), '| token id:', r.get('id'), '| status:', r.get('status'), '| expires:', r.get('expires_on'), '| errors:', [(e.get('code'), e.get('message')) for e in d.get('errors') or []])"
          echo "3b. The exact call that fails during deploy (Workers Scripts needs EDIT for this one). Authorised = 'script not found'; not authorised = 'no access':"; api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/arkanoid-duel/secrets" | show
          echo "4. Can it read this account?"; api "/accounts/$CLOUDFLARE_ACCOUNT_ID" | python3 -c "import sys,json; d=json.load(sys.stdin); print('  success:', d.get('success'), '| account name:', (d.get('result') or {}).get('name'), '| errors:', [(e.get('code'), e.get('message')) for e in d.get('errors') or []])"
          echo "5. Can it list Workers scripts on this account? (needs Workers Scripts)"; api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | python3 -c "import sys,json; d=json.load(sys.stdin); print('  success:', d.get('success'), '| scripts:', [x.get('id') for x in d.get('result') or []], '| errors:', [(e.get('code'), e.get('message')) for e in d.get('errors') or []])"
          echo "6. Can it see the deeley.org zone, and is the zone in THIS account?"; api "/zones?name=deeley.org" | python3 -c "import os,sys,json; d=json.load(sys.stdin); z=d.get('result') or []; mine=os.environ['CLOUDFLARE_ACCOUNT_ID']; print('  success:', d.get('success'), '| zones found:', len(z), '| zone is in the account from the secret:', [x['account']['id']==mine for x in z], '| zone account name:', [x['account'].get('name') for x in z], '| errors:', [(e.get('code'), e.get('message')) for e in d.get('errors') or []])"
          echo "7. Which accounts can the token see at all?"; api "/accounts" | python3 -c "import sys,json,os; d=json.load(sys.stdin); mine=os.environ['CLOUDFLARE_ACCOUNT_ID']; print('  success:', d.get('success'), '| accounts:', [(a.get('name'), a['id']==mine) for a in d.get('result') or []], '| errors:', [(e.get('code'), e.get('message')) for e in d.get('errors') or []])"
