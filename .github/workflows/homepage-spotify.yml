name: Homepage Spotify recent tracks

# Refreshes recent-tracks.json (the Home tab's "recently played" widget)
# from Spotify's recently-played endpoint. Needs SPOTIFY_CLIENT_ID,
# SPOTIFY_CLIENT_SECRET, and SPOTIFY_REFRESH_TOKEN as repo secrets - see
# src/homepage/fetchRecentTracks.ts for what each is used for. Without
# SPOTIFY_REFRESH_TOKEN specifically (a one-time manual login, unlike the
# other two which are also used by the newswire pipeline's Client
# Credentials flow), the script no-ops and this workflow is a silent
# no-op push-nothing run.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: homepage-spotify
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch recent tracks
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: npm run homepage:spotify-recent

      - name: Commit and push if changed
        run: |
          # git diff alone misses this on the very first run, when the file
          # is new and untracked rather than modified - status catches both.
          if [ -z "$(git status --porcelain -- recent-tracks.json)" ]; then
            echo "No change to recent-tracks.json - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recent-tracks.json
          git commit -m "Refresh recent-tracks.json"
          git push
