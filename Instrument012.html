<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Instrument 01.2</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; background:#000; overflow:hidden; touch-action:none; }
  canvas { display:block; width:100vw; height:100vh; cursor:crosshair; }
  #conductor {
    position: fixed; left:0; width:100%; height:2px; background:#fff;
    top:50%; opacity:0.95; pointer-events:none; mix-blend-mode:screen;
  }
  #overlay{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#000; z-index:10; cursor:pointer;
  }
  .tri{
    width:0; height:0;
    border-left:34px solid transparent;
    border-right:34px solid transparent;
    border-bottom:60px solid #fff;
    transform: rotate(90deg);
    opacity:0.95;
  }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


  <div id="conductor"></div>
  <div id="overlay" aria-label="Start audio">
    <div class="tri"></div>
  </div>
  <canvas id="visual"></canvas>

<script>
(() => {
  // -----------------------------
  // Canvas
  // -----------------------------
  const canvas = document.getElementById('visual');
  const ctx = canvas.getContext('2d', { alpha: false });

  function resize() {
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    // draw in CSS pixels
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize, { passive: true });
  resize();

  const conductorEl = document.getElementById('conductor');
  const overlay = document.getElementById('overlay');

  // -----------------------------
  // Audio
  // -----------------------------
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContext();

  // Master bus
  const master = audioCtx.createGain();
  master.gain.value = 0.9;

  // Dry / Wet
  const dry = audioCtx.createGain();
  const wet = audioCtx.createGain();
  dry.gain.value = 0.8;
  wet.gain.value = 0.35;

  // Delay (echo)
  const delay = audioCtx.createDelay(2.0);
  delay.delayTime.value = 0.22;

  const feedback = audioCtx.createGain();
  feedback.gain.value = 0.42;

  const delayHP = audioCtx.createBiquadFilter();
  delayHP.type = 'highpass';
  delayHP.frequency.value = 180;

  const delayLP = audioCtx.createBiquadFilter();
  delayLP.type = 'lowpass';
  delayLP.frequency.value = 4200;

  // Reverb (generated impulse)
  const convolver = audioCtx.createConvolver();
  convolver.buffer = makeImpulse(audioCtx, 2.8, 2.5); // length, decay

  const reverbPre = audioCtx.createBiquadFilter();
  reverbPre.type = 'highpass';
  reverbPre.frequency.value = 120;

  // Limiter-ish (soft clip)
  const shaper = audioCtx.createWaveShaper();
  shaper.curve = makeSoftClipCurve(0.85);
  shaper.oversample = '2x';

  // Routing:
  // voices -> voiceBus -> dry -> master
  // voices -> voiceBus -> wet -> delay -> filters -> convolver -> master
  const voiceBus = audioCtx.createGain();
  voiceBus.gain.value = 1.0;

  voiceBus.connect(dry);
  dry.connect(master);

  voiceBus.connect(wet);

  wet.connect(delay);
  delay.connect(delayHP);
  delayHP.connect(delayLP);
  delayLP.connect(convolver);
  convolver.connect(master);

  // feedback loop (post filters)
  delayLP.connect(feedback);
  feedback.connect(delay);

  // Output
  master.connect(shaper);
  shaper.connect(audioCtx.destination);

  function makeImpulse(ctx, seconds, decay) {
    const rate = ctx.sampleRate;
    const length = Math.max(1, Math.floor(rate * seconds));
    const impulse = ctx.createBuffer(2, length, rate);
    for (let ch = 0; ch < 2; ch++) {
      const data = impulse.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        const t = i / length;
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * (ch ? 0.95 : 1);
      }
    }
    return impulse;
  }

  function makeSoftClipCurve(amount) {
    const n = 1024;
    const curve = new Float32Array(n);
    const k = 2 + amount * 18;
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      curve[i] = Math.tanh(k * x) / Math.tanh(k);
    }
    return curve;
  }

  // -----------------------------
  // Musical helpers
  // -----------------------------
  // A = "anchor", B = "spark"
  let currentSequence = "A";
  let growthSpeed = 2400;          // ms between growth steps
  let running = false;

  // Map the pattern into a small pitch set (F minor-ish flavor)
  const scale = [0, 3, 5, 7, 10];  // 1, b3, 4, 5, b7
  const rootHz = 174.61;          // F3-ish anchor root
  function hzFromDegree(deg, octave = 0) {
    const idx = ((deg % scale.length) + scale.length) % scale.length;
    const semis = scale[idx] + (12 * octave);
    return rootHz * Math.pow(2, semis / 12);
  }

  // -----------------------------
  // Voices
  // -----------------------------
  function createAnchor(freq, intensity = 1) {
    const now = audioCtx.currentTime;

    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(420, now);
    filter.Q.setValueAtTime(0.8, now);

    [0, 1.2, -1.2].forEach((d) => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq + d, now);
      const drift = (Math.random() * 0.8 + 0.2) * (Math.random() < 0.5 ? -1 : 1);
      osc.detune.setValueAtTime(drift * 4, now);
      osc.connect(filter);
      osc.start(now);
      osc.stop(now + 4.6);
    });

    gain.gain.setValueAtTime(0.0, now);
    gain.gain.linearRampToValueAtTime(0.22 * intensity, now + 0.9);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 4.6);

    filter.connect(gain);
    gain.connect(voiceBus);
  }

  function triggerSpark(freq, intensity = 1) {
    const now = audioCtx.currentTime;

    const gain = audioCtx.createGain();
    const osc = audioCtx.createOscillator();
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(freq * 1.25, now);
    bp.Q.setValueAtTime(8.0, now);

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq + (Math.random() * 16 - 8), now);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.18 * intensity, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);

    osc.connect(bp);
    bp.connect(gain);
    gain.connect(voiceBus);

    osc.start(now);
    osc.stop(now + 0.85);
  }

  // Morphing pad: chord derived from recent pattern
  const padState = {
    on: true,
    nextAt: 0,
    lastChord: null,
    morphRate: 0.06, // cycles per second (slow)
    voice: null
  };

  function startPadVoice() {
    const now = audioCtx.currentTime;

    const padGain = audioCtx.createGain();
    padGain.gain.setValueAtTime(0.0001, now);
    padGain.gain.linearRampToValueAtTime(0.12, now + 2.5);

    const padLP = audioCtx.createBiquadFilter();
    padLP.type = 'lowpass';
    padLP.frequency.setValueAtTime(520, now);
    padLP.Q.setValueAtTime(0.7, now);

    const panner = audioCtx.createStereoPanner();
    panner.pan.setValueAtTime(0, now);

    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.type = 'sine';
    lfo.frequency.setValueAtTime(0.04, now); // very slow
    lfoGain.gain.setValueAtTime(0.55, now);
    lfo.connect(lfoGain);
    lfoGain.connect(panner.pan);
    lfo.start(now);

    padLP.connect(panner);
    panner.connect(padGain);
    padGain.connect(voiceBus);

    const oscs = [];
    for (let i = 0; i < 5; i++) {
      const o = audioCtx.createOscillator();
      o.type = i < 2 ? 'sine' : 'triangle';
      o.frequency.setValueAtTime(220, now);
      o.connect(padLP);
      o.start(now);
      oscs.push(o);
    }

    return { padGain, padLP, panner, lfo, oscs };
  }

  function stopPadVoice(v) {
    if (!v) return;
    const now = audioCtx.currentTime;
    try {
      v.padGain.gain.cancelScheduledValues(now);
      v.padGain.gain.setValueAtTime(v.padGain.gain.value, now);
      v.padGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);
      v.oscs.forEach(o => o.stop(now + 2.2));
      v.lfo.stop(now + 2.2);
    } catch (e) {}
  }

  function chordFromSequence(seq) {
    const tail = seq.slice(-24);
    const a = (tail.match(/A/g) || []).length;
    const b = tail.length - a;
    const bias = (b - a) / Math.max(1, tail.length); // -1..1

    if (bias > 0.20) return [0, 2, 3, 4];   // Fm add4 + b7
    if (bias > -0.10) return [0, 1, 3, 4];  // Fm add5 + b7
    return [0, 1, 3];                       // triad-ish
  }

  function setPadChord(v, degrees, morph = 0) {
    if (!v) return;
    const now = audioCtx.currentTime;

    const invA = degrees.map((d, i) => ({ d, oct: i === 0 ? -1 : 0 }));
    const invB = degrees.map((d, i) => ({ d, oct: (i % 2 === 0) ? 0 : 1 }));

    v.oscs.forEach((osc, i) => {
      const a = invA[i % invA.length];
      const b = invB[i % invB.length];
      const fA = hzFromDegree(a.d, a.oct);
      const fB = hzFromDegree(b.d, b.oct);
      const f = fA + (fB - fA) * morph;
      osc.frequency.setTargetAtTime(f, now, 0.18);
    });

    const base = 380 + degrees.length * 90;
    const wobble = 90 * Math.sin(now * 0.35);
    v.padLP.frequency.setTargetAtTime(base + wobble, now, 0.55);
  }

  // -----------------------------
  // Visual particles + ribbon
  // -----------------------------
  const sparks = [];
  function addSpark(x, y, bright = 1) {
    const n = Math.floor(8 + bright * 10);
    for (let i = 0; i < n; i++) {
      sparks.push({
        x, y,
        vx: (Math.random() * 2 - 1) * (1.4 + bright * 2.2),
        vy: (Math.random() * 2 - 1) * (1.4 + bright * 2.2),
        life: 1.0,
        decay: 0.012 + Math.random() * 0.02
      });
    }
  }

  function drawRibbon(seq, y) {
    const w = innerWidth;
    const block = Math.max(6, Math.min(18, Math.floor(w / 60)));
    const len = Math.min(seq.length, Math.floor(w / block));
    const startX = (w - len * block) / 2;

    for (let i = 0; i < len; i++) {
      const ch = seq[seq.length - len + i];
      const x = startX + i * block;
      if (ch === 'A') {
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = '#fff';
        ctx.fillRect(x, y - 10, block - 2, 20);
      } else {
        ctx.globalAlpha = 0.95;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, y - 10, block - 4, 20);
      }
    }
    ctx.globalAlpha = 1;
  }

  // -----------------------------
  // Controls
  // -----------------------------
  let pointerDown = false;
  let lastTap = 0;

  function setControlsFromXY(x, y) {
    // Y: speed (top fast)
    growthSpeed = (y / innerHeight) * 5200 + 220;
    conductorEl.style.top = y + 'px';

    // X: space (more right => more echo + reverb)
    const t = Math.min(1, Math.max(0, x / innerWidth)); // 0..1
    const now = audioCtx.currentTime;

    delay.delayTime.setTargetAtTime(0.08 + t * 0.47, now, 0.08);
    feedback.gain.setTargetAtTime(0.12 + t * 0.60, now, 0.12);

    dry.gain.setTargetAtTime(0.95 - t * 0.55, now, 0.10);
    wet.gain.setTargetAtTime(0.18 + t * 0.62, now, 0.10);

    reverbPre.frequency.setTargetAtTime(80 + (1 - t) * 160, now, 0.25);
  }

  addEventListener('pointerdown', (e) => {
    pointerDown = true;
    setControlsFromXY(e.clientX, e.clientY);

    const now = performance.now();
    if (now - lastTap < 320) {
      padState.on = !padState.on;
      if (!padState.on) stopPadVoice(padState.voice);
      else padState.voice = startPadVoice();
    }
    lastTap = now;
  }, { passive: true });

  addEventListener('pointermove', (e) => {
    if (!pointerDown) return;
    setControlsFromXY(e.clientX, e.clientY);
  }, { passive: true });

  addEventListener('pointerup', () => { pointerDown = false; }, { passive: true });
  addEventListener('pointercancel', () => { pointerDown = false; }, { passive: true });

  // -----------------------------
  // Growth engine
  // -----------------------------
  let lastGrowAt = 0;

  function growStep() {
    let next = "";
    for (let char of currentSequence) {
      next += (char === "A") ? "AB" : "A";
    }
    if (next.length > 72) next = next.slice(next.length - 72);
    currentSequence = next;

    const aCount = (currentSequence.match(/A/g) || []).length;
    const bCount = currentSequence.length - aCount;

    const aDensity = aCount / Math.max(1, currentSequence.length);
    const bDensity = bCount / Math.max(1, currentSequence.length);

    const anchorFreq = hzFromDegree(0, aDensity > 0.55 ? -1 : 0);
    const fifthFreq  = hzFromDegree(3, 0);

    createAnchor((aCount % 2 === 0) ? anchorFreq : fifthFreq, 0.9 + aDensity * 0.8);

    const deg = (bCount + currentSequence.length) % scale.length;
    triggerSpark(hzFromDegree(deg, 1), 0.55 + bDensity * 0.85);

    const y = parseFloat(conductorEl.style.top) || innerHeight * 0.5;
    addSpark(innerWidth * (0.15 + Math.random() * 0.7), y, 0.7 + bDensity);

    ctx.globalAlpha = 0.08 + bDensity * 0.12;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, innerWidth, innerHeight);
    ctx.globalAlpha = 1;

    const now = audioCtx.currentTime;
    if (padState.on && padState.voice && now >= padState.nextAt) {
      padState.nextAt = now + 1.6;
      padState.lastChord = chordFromSequence(currentSequence);
    }
  }

  function tick(ts) {
    requestAnimationFrame(tick);

    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(0, 0, innerWidth, innerHeight);

    const y = parseFloat(conductorEl.style.top) || innerHeight * 0.5;
    drawRibbon(currentSequence, y);

    ctx.fillStyle = '#fff';
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.life -= p.decay;

      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillRect(p.x, p.y, 2, 2);
    }
    ctx.globalAlpha = 1;

    if (running) {
      if (!lastGrowAt) lastGrowAt = ts;
      if (ts - lastGrowAt >= growthSpeed) {
        lastGrowAt = ts;
        growStep();
      }
    }

    if (padState.on && padState.voice && padState.lastChord) {
      const t = audioCtx.currentTime;
      const m = (Math.sin(t * padState.morphRate * Math.PI * 2) + 1) * 0.5;
      setPadChord(padState.voice, padState.lastChord, m);
    }
  }

  // -----------------------------
  // Start
  // -----------------------------
  function start() {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    setControlsFromXY(innerWidth * 0.55, innerHeight * 0.5);
    padState.voice = startPadVoice();
    running = true;

    overlay.style.display = 'none';
    requestAnimationFrame(tick);
  }

  overlay.addEventListener('click', start, { once: true });
  overlay.addEventListener('touchstart', (e) => {
    e.preventDefault();
    start();
  }, { once: true, passive: false });

})();
</script>
</body>
</html>
