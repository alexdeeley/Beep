<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Seed / Pattern / Future — MORE</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; }
  #ui {
    position: fixed;
    top: env(safe-area-inset-top, 1.2rem);
    left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: .6rem;
    filter: drop-shadow(0 0 6px rgba(255,255,255,.35));
  }
  #seedBox {
    width: min(64vw, 520px);
    padding: .7rem 1rem;
    background: rgba(0,0,0,.6);
    border: 1px solid #fff;
    color: #fff;
    font: 800 20px/1.1 system-ui, -apple-system, Helvetica, Arial, sans-serif;
    letter-spacing: .08em;
    text-align: center;
    border-radius: 14px;
    backdrop-filter: blur(2px);
  }
  #generate {
    width: 50px; height: 50px; border-radius: 50%;
    border: 1px solid #fff;
    background: rgba(255,255,255,.08);
    color:#fff; font-size: 20px; font-weight: 900; cursor: pointer;
    backdrop-filter: blur(3px);
  }
  #generate:active { background: rgba(255,255,255,.28); }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="c"></canvas>
<div id="ui">
  <input id="seedBox" type="text" placeholder="…seed" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
  <button id="generate">▶︎</button>
</div>
<script>
(() => {
  // ---------- Deterministic PRNG from seed ----------
  function cyrb128(str) {
    let h1 = 1779033703, h2 = 3144134277,
        h3 = 1013904242, h4 = 2773480762;
    for (let i = 0, k; i < str.length; i++) {
      k = str.charCodeAt(i);
      h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
      h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
      h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
      h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
    }
    h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
    h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
    h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
    h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
    return [(h1^h2^h3^h4)>>>0, h2>>>0, h3>>>0, h4>>>0];
  }
  function mulberry32(a) {
    return function() {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function rngFromSeed(seedStr) {
    const h = cyrb128(seedStr);
    return mulberry32(h[0]^h[1]^h[2]^h[3]);
  }

  // ---------- Canvas ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha:false, desynchronized:true });
  let DPR = Math.min(2.5, Math.max(1, devicePixelRatio || 1));
  function resize(){
    const w = Math.round(innerWidth * DPR);
    const h = Math.round(innerHeight * DPR);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
    }
  }
  resize(); addEventListener('resize', ()=>{DPR = Math.min(2.5, Math.max(1, devicePixelRatio || 1)); resize();});

  // ---------- Value noise ----------
  function makeValueNoise(rng){
    const p = new Uint8Array(512);
    for(let i=0;i<256;i++) p[i]=i;
    for(let i=255;i>0;i--){ const j=(rng()*(i+1))|0; const t=p[i]; p[i]=p[j]; p[j]=t; }
    for(let i=0;i<256;i++) p[i+256]=p[i];
    const fade=t=>t*t*(3-2*t);
    const lerp=(a,b,t)=>a+(b-a)*t;
    function hash(ix,iy){ return p[(ix + p[iy&255]) & 255] / 255; }
    return (x,y)=>{
      const xi = Math.floor(x)&255, yi=Math.floor(y)&255;
      const xf = x-Math.floor(x), yf=y-Math.floor(y);
      const tl=hash(xi,yi), tr=hash(xi+1,yi), bl=hash(xi,yi+1), br=hash(xi+1,yi+1);
      const u=fade(xf), v=fade(yf);
      return lerp(lerp(tl,tr,u), lerp(bl,br,u), v)*2-1; // [-1,1]
    };
  }

  // ---------- State ----------
  const seedBox = document.getElementById('seedBox');
  const btn = document.getElementById('generate');
  let seed = 'future';
  let rng = rngFromSeed(seed);
  let noise = makeValueNoise(rng);
  let t0 = performance.now();
  let energy = 0;         // swipe/impact energy
  let lastInteract = t0;
  let comp = null;
  const swipes = [];

  function randRange(a,b){ return a + (b-a)*rng(); }
  function choose(...arr){ return arr[(rng()*arr.length)|0]; }

  function composeFromSeed(s){
    seed = (s||'').trim() || 'future';
    rng = rngFromSeed(seed);
    noise = makeValueNoise(rng);
    const layers = 8 + ((rng()*8)|0);              // 8..15
    const grain  = randRange(0.001, 0.0032);
    const swirl  = randRange(-Math.PI, Math.PI);
    const drift  = randRange(0.2, 0.55);
    const ribbon = randRange(0.18, 0.42);
    const symmetry = choose('vertical','vertical','radial','vertical','horizontal'); // bias vertical
    const strokeAlpha = randRange(0.06, 0.12);
    const fillAlpha   = randRange(0.03, 0.10);
    const lineWeight  = randRange(0.8, 2.6);
    const sparks      = 600 + ((rng()*800)|0);    // stipple density
    comp = {layers, grain, swirl, drift, ribbon, symmetry, strokeAlpha, fillAlpha, lineWeight, sparks};
    energy = 0; // reset energy so it can build again
  }

  composeFromSeed(seed);

  // ---------- Interactions ----------
  function pointerPos(ev){
    const r = canvas.getBoundingClientRect();
    return { x:(ev.clientX - r.left)*DPR, y:(ev.clientY - r.top)*DPR };
  }
  let down=false;
  canvas.addEventListener('pointerdown', (e)=>{
    down=true; const p=pointerPos(e);
    swipes.push({x:p.x,y:p.y,t:performance.now(),life:1,strength:1.8});
    energy = Math.min(1.4, energy + 0.5);
    lastInteract = performance.now();
  });
  canvas.addEventListener('pointermove', (e)=>{
    if(!down) return; const p=pointerPos(e);
    swipes.push({x:p.x,y:p.y,t:performance.now(),life:1,strength:0.9});
    energy = Math.min(1.6, energy + 0.08);
    lastInteract = performance.now();
  });
  addEventListener('pointerup', ()=>{down=false;});
  addEventListener('pointercancel', ()=>{down=false;});

  btn.addEventListener('click', ()=> composeFromSeed(seedBox.value));
  seedBox.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ composeFromSeed(e.target.value); seedBox.blur(); } });
  seedBox.addEventListener('input', (e)=>{ if(e.target.value.length===0) composeFromSeed(''); });

  // ---------- Fields ----------
  function rippleField(x,y,t){
    const { grain, drift } = comp;
    let v = 0;
    const nx = x*grain, ny=y*grain;
    v += 40 * noise(nx + Math.sin(t*0.09), ny + Math.cos(t*0.06));
    v += 30 * Math.sin((nx+ny) * 0.9 + t*0.27 + comp.swirl*0.2);
    // swipe ripples
    for(let i=swipes.length-1;i>=0;i--){
      const s=swipes[i];
      const age = (performance.now()-s.t)/1000;
      s.life = Math.max(0, 1.0 - age*0.9);
      if(s.life<=0){ swipes.splice(i,1); continue; }
      const dx=x-s.x, dy=y-s.y;
      const d2 = dx*dx + dy*dy + 4000;
      v += s.strength * 2200 * s.life / d2;
    }
    // energy amplifies turbulence; decays when idle — "settles back"
    const idle = (performance.now() - lastInteract)/1000;
    energy = Math.max(0, energy - 0.12*(1+idle*0.2));
    const settle = Math.max(0.2, 1.0 - idle*0.2);
    return v * drift * (0.6 + energy) * settle;
  }

  // ---------- Rendering ----------
  function clear(){
    // Subtle trail for glow instead of hard clear
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  function setStroke(a,w){
    ctx.strokeStyle = `rgba(255,255,255,${a})`;
    ctx.lineWidth = w; ctx.lineCap='round'; ctx.lineJoin='round';
  }
  function setFill(a){ ctx.fillStyle = `rgba(255,255,255,${a})`; }

  function drawSymmetry(drawOne){
    // vertical (default) draw + mirror
    if (comp.symmetry === 'vertical') {
      drawOne();
      ctx.save(); ctx.translate(canvas.width,0); ctx.scale(-1,1); drawOne(); ctx.restore();
    } else if (comp.symmetry === 'horizontal') {
      drawOne();
      ctx.save(); ctx.translate(0,canvas.height); ctx.scale(1,-1); drawOne(); ctx.restore();
    } else { // radial: 4-way
      for(let i=0;i<4;i++){
        ctx.save();
        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.rotate(i * Math.PI/2);
        ctx.translate(-canvas.width/2, -canvas.height/2);
        drawOne();
        ctx.restore();
      }
    }
  }

  function drawLayer(t, i){
    const W=canvas.width, H=canvas.height, cx=W/2, cy=H/2;
    const baseR = Math.min(W,H)*(0.18 + i*0.05);
    const step = 200;
    const amp = baseR * comp.ribbon;
    setStroke(comp.strokeAlpha*(0.8 + i*0.05), comp.lineWeight + i*0.3);

    drawSymmetry(()=>{
      ctx.beginPath();
      for(let k=0;k<=step;k++){
        const u = k/step;
        const a = -Math.PI/2 + u*Math.PI; // sweep half
        const bx = cx + Math.cos(a+comp.swirl*0.05)*baseR*(0.9 + 0.08*Math.sin(t*0.3+i));
        const by = cy + Math.sin(a+comp.swirl*0.05)*baseR*(0.9 + 0.08*Math.cos(t*0.25-i));
        const disp = rippleField(bx,by,t);
        const px = bx + Math.cos(a*2.1 + t*0.45)*amp*0.2 + disp*0.28;
        const py = by + Math.sin(a*1.7 - t*0.38)*amp*0.18 + disp*0.18;
        if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.stroke();
    });

    // Concentric pulses for structure
    const rings = 3 + ((i*37)%5);
    for(let r=0;r<rings;r++){
      const rr = baseR*(0.4 + r*0.13);
      ctx.beginPath();
      ctx.ellipse(cx,cy, rr*(1+0.02*Math.sin(t*0.5+r+i)), rr*(0.62+0.06*Math.cos(t*0.33+r-i)), 0, 0, Math.PI*2);
      setStroke(comp.strokeAlpha*0.8, Math.max(0.6, (comp.lineWeight-0.4)));
      ctx.stroke();
    }

    // Spark stipple — additive glow
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const dots = (comp.sparks / (1+i*0.12))|0;
    for(let d=0; d<dots; d++){
      const ang = d/dots * Math.PI*2;
      const rr = baseR*(0.1 + (d%11)*0.022);
      const x = cx + Math.cos(ang) * rr;
      const y = cy + Math.sin(ang) * rr;
      const disp = rippleField(x,y,t)*0.06;
      const size = 0.5 + (d%3)*0.45;
      const alpha = 0.018 + (d%7)*0.004;
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath(); ctx.arc(x+disp,y+disp,size,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function frame(now){
    const t = (now - t0)/1000;
    clear();

    // Vignette base to deepen contrast
    const W=canvas.width, H=canvas.height;
    const grd = ctx.createRadialGradient(W/2,H/2, Math.min(W,H)*0.2, W/2,H/2, Math.max(W,H)*0.7);
    grd.addColorStop(0,'rgba(0,0,0,0)');
    grd.addColorStop(1,'rgba(0,0,0,0.6)');
    ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);

    // Multi-layer composition
    for(let i=0;i<comp.layers;i++) drawLayer(t + i*0.07, i);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Prevent pull-to-refresh
  let lastTouchY=0;
  addEventListener('touchstart',(e)=>{lastTouchY=e.touches[0].clientY;},{passive:false});
  addEventListener('touchmove',(e)=>{
    const y=e.touches[0].clientY; if(Math.abs(y-lastTouchY)>2) e.preventDefault(); lastTouchY=y;
  },{passive:false});
})();
</script>
</body>
</html>
