<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Snake — One-Hand (v3)</title>
<style>
  html, body { margin:0; height:100%; background:#000; }
  canvas { display:block; width:100vw; height:100vh; background:#000; touch-action:none; }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<canvas id="cv"></canvas>
<script>
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d', { alpha:false });
  let dpr = 1, W = 0, H = 0;

  // Grid settings
  let cols = 32, rows = 48;
  let cw = 20, ch = 20;   // cell size in CSS px (computed)

  // Game state
  let snake = [];
  let dir = {x:1, y:0};
  let nextDir = {x:1, y:0};
  let food = null;
  let score = 0;
  let high = parseInt(localStorage.getItem('snake_high') || '0', 10);
  let running = false;
  let gameOver = false;
  let tick = 120;       // ms per step
  let last = 0;

  // Overlay buttons (canvas UI)
  const buttons = {
    replay: {x:0,y:0,w:0,h:0, label:'REPLAY'},
    share:  {x:0,y:0,w:0,h:0, label:'SHARE'}
  };

  function vibrate(ms){ if (navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

  function fit() {
    const w = Math.max(1, window.innerWidth);
    const h = Math.max(1, window.innerHeight);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    cv.width = Math.floor(w * dpr);
    cv.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = w; H = h;

    // Choose cell count for a comfortable size (~22px per cell)
    const target = 22;
    cols = Math.max(16, Math.floor(W / target));
    rows = Math.max(16, Math.floor(H / target));
    cw = W / cols;
    ch = H / rows;
  }

  function reset() {
    running = true; gameOver = false; score = 0; tick = 120;
    snake = [];
    const sx = Math.floor(cols/2) - 2;
    const sy = Math.floor(rows/2);
    for (let i=0;i<4;i++) snake.push({x:sx+i, y:sy});
    dir = {x:1, y:0}; nextDir = {x:1, y:0};
    food = randomEmpty();
    last = 0;
    draw(); // initial frame
    requestAnimationFrame(loop);
  }

  function randomEmpty() {
    for (let tries=0; tries<5000; tries++) {
      const x = Math.floor(Math.random()*cols);
      const y = Math.floor(Math.random()*rows);
      if (!snake.some(s=>s.x===x&&s.y===y)) return {x,y};
    }
    return {x:1,y:1};
  }

  function loop(ts){
    if (!running) { draw(); return; }
    if (!last) last = ts;
    if (ts - last < tick) { requestAnimationFrame(loop); return; }
    last = ts;

    // apply nextDir if not reversing
    if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) dir = nextDir;

    const head = snake[snake.length-1];
    let nx = head.x + dir.x;
    let ny = head.y + dir.y;

    // Wrap-around edges (toroid)
    if (nx < 0) nx = cols-1;
    else if (nx >= cols) nx = 0;
    if (ny < 0) ny = rows-1;
    else if (ny >= rows) ny = 0;

    // Self collision?
    const hitSelf = snake.some(s => s.x===nx && s.y===ny);
    if (hitSelf) {
      running = false; gameOver = true;
      endGame();
      draw();
      return;
    }

    snake.push({x:nx, y:ny});

    // Eat food?
    if (food && nx === food.x && ny === food.y) {
      score += 10;
      food = randomEmpty();
      if (tick > 60) tick -= 1;
      vibrate(20);
    } else {
      snake.shift();
    }

    draw();
    requestAnimationFrame(loop);
  }

  function endGame(){
    vibrate([0,40,40,80]);
    high = Math.max(high, score);
    localStorage.setItem('snake_high', String(high));
  }

  function draw() {
    // background
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,W,H);

    // If not started yet, draw Play circle with triangle
    if (!running && !gameOver) {
      drawStart();
      return;
    }

    // Food
    if (food) {
      ctx.fillStyle = '#0f0';
      ctx.fillRect(food.x*cw, food.y*ch, cw, ch);
    }

    // Snake
    ctx.fillStyle = '#fff';
    for (let i=0;i<snake.length;i++) {
      const s = snake[i];
      ctx.fillRect(s.x*cw, s.y*ch, cw, ch);
    }

    // Game Over overlay
    if (gameOver) {
      drawGameOver();
    }
  }

  function drawStart(){
    // big circle
    const r = Math.min(W,H)*0.14;
    const cx = W/2, cy = H/2;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(4, r*0.06);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();

    // triangle
    ctx.fillStyle = '#fff';
    const tR = r*0.6;
    ctx.beginPath();
    ctx.moveTo(cx - tR*0.4, cy - tR*0.7);
    ctx.lineTo(cx - tR*0.4, cy + tR*0.7);
    ctx.lineTo(cx + tR*0.8, cy);
    ctx.closePath();
    ctx.fill();

    // tiny hint (optional)
    ctx.fillStyle = '#888'; ctx.font = '14px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Tap to start • Swipe to turn', cx, cy + r + 24);
  }

  function drawGameOver(){
    // dim
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0,0,W,H);

    // big score
    ctx.fillStyle = '#fff';
    const big = Math.min(W, H) * 0.16;
    ctx.font = `bold ${Math.max(48, Math.floor(big))}px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(score), W/2, H*0.35);

    // high score
    ctx.fillStyle = '#0f0';
    ctx.font = `bold ${Math.max(16, Math.floor(big*0.25))}px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial`;
    ctx.fillText('HIGH ' + String(high), W/2, H*0.45);

    // buttons
    const bw = Math.min(280, Math.floor(W*0.6));
    const bh = Math.max(48, Math.floor(H*0.07));
    const gap = Math.max(12, Math.floor(W*0.04));
    const startY = H*0.58;

    drawButton(W/2 - bw - gap/2, startY, bw, bh, '#0f0', 'REPLAY', buttons.replay);
    drawButton(W/2 + gap/2,      startY, bw, bh, '#fff', 'SHARE',  buttons.share);
  }

  function drawButton(x,y,w,h,color,label, store){
    // outline rect
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.fillStyle = 'rgba(0,0,0,0)';
    const r = Math.min(16, h*0.3);
    roundRect(ctx, x,y,w,h,r, true);
    // label
    ctx.fillStyle = color;
    ctx.font = `bold ${Math.floor(h*0.45)}px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x + w/2, y + h/2);
    // store hitbox
    store.x = x; store.y = y; store.w = w; store.h = h;
  }

  function roundRect(ctx, x,y,w,h,r, strokeOnly){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
    if (strokeOnly) ctx.stroke(); else ctx.fill();
  }

  // Share
  async function shareScore(){
    const text = `I scored ${score} in One-Hand Snake!`;
    const url = new URL(location.href);
    url.searchParams.set('snake_score', String(score));
    if (navigator.share) {
      try { await navigator.share({ title:'Snake — One-Hand', text, url: url.toString() }); }
      catch(e){}
    } else {
      try { await navigator.clipboard.writeText(`${text} ${url.toString()}`); alert('Share link copied!'); }
      catch(e){ alert('Copy this link:\\n' + url.toString()); }
    }
  }

  // Input: swipe + keyboard + taps
  let touchStart = null;
  function txy(e){ return e.changedTouches ? e.changedTouches[0] : e; }
  function onTouchStart(e){ const t=txy(e); touchStart={x:t.clientX,y:t.clientY}; if (!running && !gameOver) { startGame(); } e.preventDefault(); }
  function onTouchMove(e){
    if(!touchStart) return;
    const t=txy(e); const dx=t.clientX - touchStart.x; const dy=t.clientY - touchStart.y;
    const th = 18;
    if (Math.abs(dx)<th && Math.abs(dy)<th) return;
    if (Math.abs(dx) > Math.abs(dy)) nextDir = {x: dx>0 ? 1 : -1, y:0};
    else nextDir = {x:0, y: dy>0 ? 1 : -1};
    touchStart = {x:t.clientX, y:t.clientY};
    e.preventDefault();
  }
  function onTouchEnd(e){
    // If game over, check button taps
    if (gameOver) {
      const t=txy(e); const x=t.clientX, y=t.clientY;
      if (hit(buttons.replay, x,y)) { replay(); }
      else if (hit(buttons.share, x,y)) { shareScore(); }
    }
    touchStart = null;
    e.preventDefault();
  }

  function hit(btn,x,y){ return x>=btn.x && x<=btn.x+btn.w && y>=btn.y && y<=btn.y+btn.h; }

  function startGame(){ if (!running && !gameOver) reset(); }
  function replay(){ gameOver=false; reset(); }

  // Keyboard
  window.addEventListener('keydown', (e)=>{
    if (!running && !gameOver && (e.key===' '||e.key==='Enter')) { startGame(); }
    if (e.key==='ArrowUp') nextDir = {x:0,y:-1};
    else if (e.key==='ArrowDown') nextDir = {x:0,y:1};
    else if (e.key==='ArrowLeft') nextDir = {x:-1,y:0};
    else if (e.key==='ArrowRight') nextDir = {x:1,y:0};
    else if (gameOver && (e.key===' '||e.key==='Enter')) replay();
  });

  // Touch listeners
  cv.addEventListener('touchstart', onTouchStart, {passive:false});
  cv.addEventListener('touchmove', onTouchMove, {passive:false});
  cv.addEventListener('touchend', onTouchEnd, {passive:false});
  document.addEventListener('touchmove', (e)=>{ if (running) e.preventDefault(); }, {passive:false});

  // Sizing
  window.addEventListener('resize', ()=>{ fit(); draw(); });
  fit();
  drawStart();

  // Expose for debug
  window.__snake_debug = { get cols(){return cols}, get rows(){return rows} };
})();
</script>
</body>
</html>
