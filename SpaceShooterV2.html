<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>SPACE BLAST — Alex Edition</title>
<style>
  :root { 
    color-scheme: dark;
    --bg: #000;
    --fg: #fff;
    --accent: #0ff;
    --accent2: #0f0;
    --danger: #f33;
    --hud: #999;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    height: 100%;
    overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, -apple-system, system-ui, sans-serif;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-rows: 1fr auto;
    background: var(--bg);
  }
  canvas {
    width: 100vw;
    height: 100vh;
    display: block;
    touch-action: none; /* important for iOS Safari drag control */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #hudBar {
    position: fixed;
    top: env(safe-area-inset-top, 0);
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    pointer-events: none;
    mix-blend-mode: normal;
  }
  #healthOuter {
    flex: 1 1 auto;
    height: 18px;
    border: 2px solid var(--fg);
    margin-right: 12px;
    background: #111;
  }
  #healthFill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #0f0, #7fff00);
  }
  #score {
    font-size: clamp(18px, 4vw, 32px);
  }

  /* Overlays */
  #overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(0,0,0,0.85);
    color: var(--fg);
    text-align: center;
    padding: 24px;
  }
  #overlay.hidden { display: none; }
  .title {
    font-weight: 900;
    font-size: clamp(44px, 9vw, 100px);
    line-height: 1;
    margin: 0 0 8px 0;
  }
  .subtitle {
    font-size: clamp(16px, 4vw, 24px);
    color: #aaa;
    margin: 0 0 20px 0;
  }
  .bigscore {
    font-weight: 900;
    font-size: 72px; /* requested ~72 point look */
    line-height: 1;
    margin: 0 0 24px 0;
  }
  .buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    appearance: none;
    border: 2px solid var(--fg);
    background: #111;
    color: var(--fg);
    padding: 12px 18px;
    letter-spacing: 0.5px;
    font-weight: 800;
    text-transform: uppercase;
    border-radius: 8px;
    cursor: pointer;
    pointer-events: auto;
  }
  .btn:hover { background: #1a1a1a; }
  .sr {
    position:absolute; width:1px; height:1px; margin:-1px; border:0; padding:0; clip:rect(0 0 0 0); overflow:hidden;
  }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<div id="wrap" aria-live="polite">
  <canvas id="game" role="img" aria-label="Pixel space shooter game canvas"></canvas>
  <div id="hudBar" aria-hidden="true">
    <div id="healthOuter" aria-hidden="true"><div id="healthFill"></div></div>
    <div id="score" style="font-weight:900">SCORE: <span id="scoreVal">0</span></div>
  </div>

  <!-- Single overlay is reused for start and game-over; content swapped dynamically -->
  <div id="overlay" class="">
    <div id="overlayContent"></div>
  </div>

  <div class="sr" id="live" aria-live="assertive"></div>
</div>

<script>
(() => {
  'use strict';

  // ===== Pixel Canvas Setup (virtual low-res canvas scaled up) =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;

  // Logical pixel resolution
  const LOGICAL_W_BASE = 256; // NES-ish width
  let W = LOGICAL_W_BASE, H = 144;
  let SCALE = 1;

  function resize() {
    const ww = window.innerWidth;
    const wh = window.innerHeight;
    SCALE = Math.max(1, Math.floor(Math.min(ww / W, wh / H)));
    H = Math.round(wh / SCALE);
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = (W * SCALE) + 'px';
    canvas.style.height = (H * SCALE) + 'px';
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // ===== Random helper =====
  const R = {
    r() { return Math.random(); },
    i(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); },
    f(a, b) { return a + Math.random() * (b - a); },
    pick(arr) { return arr[(Math.random() * arr.length) | 0]; },
    chance(p) { return Math.random() < p; }
  };

  // ===== Sound (WebAudio minimal synth) =====
  let audioCtx = null;
  let masterGain = null;
  let soundOn = false;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.25;
    masterGain.connect(audioCtx.destination);
  }

  function beep({ freq=440, type='square', dur=0.08, vol=0.6, slide=0, attack=0.005, decay=0.02 }) {
    if (!audioCtx || !soundOn) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq*slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(attack + decay, dur));
    o.connect(g);
    g.connect(masterGain);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  }

  const SFX = {
    shoot() { beep({ freq: R.i(420,520), type: 'square', dur: 0.06, vol: 0.5, slide: 0.4, attack:0.001 }); },
    boom()  { beep({ freq: 80, type: 'sawtooth', dur: 0.2, vol: 0.8, slide: 0.3, attack:0.001 }); 
              beep({ freq: 50, type: 'triangle', dur: 0.25, vol: 0.6, slide: 0.25, attack:0.001 }); },
    hit()   { beep({ freq: 180, type: 'square', dur: 0.07, vol: 0.4 }); },
    pow()   { beep({ freq: 720, type: 'sine', dur: 0.12, vol: 0.6 }); },
    enemy() { beep({ freq: R.i(240, 320), type: 'sawtooth', dur: 0.15, vol: 0.45, slide: 0.6 }); }
  };

  // ===== Input =====
  let pointerDown = false;
  let pointerY = H/2;

  function setPointerFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    let clientY = e.touches ? e.touches[0].clientY : e.clientY;
    pointerY = Math.max(0, Math.min(H, ((clientY - rect.top) / SCALE)));
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    setPointerFromEvent(e);
    pointerDown = true;
    liveText('Firing; drag to fly.');
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }, { passive: false });

  window.addEventListener('pointermove', (e) => {
    if (!pointerDown) return;
    setPointerFromEvent(e);
  }, { passive: true });

  window.addEventListener('pointerup', () => {
    pointerDown = false;
    liveText('Stopped firing.');
  }, { passive: true });

  document.body.addEventListener('touchmove', (e) => {
    if (pointerDown) e.preventDefault();
  }, { passive: false });

  // ===== Entities =====
  const bullets = [];
  const enemies = [];
  const eBullets = [];
  const orbs = []; // power-ups
  const sparks = [];

  // ===== Player =====
  const player = {
    x: 20,
    y: H/2,
    vy: 0,
    fireCd: 0,
    hp: 120,
    hpMax: 120,
    alive: true,
    // Permanent stacking power levels (no decay)
    pow: { rapid: 0, spread: 0, shield: 0, mega: 0, side: 0 },
    score: 0
  };

  // ===== Drawing: pixel art helpers =====
  function pRect(x,y,w,h,color) {
    ctx.fillStyle = color;
    ctx.fillRect(x|0, y|0, w|0, h|0);
  }
  function pCircle(x,y,r,color) {
    ctx.fillStyle = color;
    const rr = r|0;
    for (let dy=-rr; dy<=rr; dy++) {
      const lx = Math.floor(Math.sqrt(rr*rr - dy*dy));
      ctx.fillRect((x - lx)|0, (y + dy)|0, (2*lx+1)|0, 1);
    }
  }

  // Bigger ship (about 36x24)
  function drawShip(sx, sy, flash=0) {
    const base = flash ? '#fff' : '#0ff';
    const core = flash ? '#fff' : '#08c';
    // Body
    pRect(sx, sy-9, 28, 18, base);
    pRect(sx+6, sy-6, 20, 12, core);
    // Nose
    pRect(sx+28, sy-4, 8, 8, flash ? '#fff' : '#6cf');
    // Fins
    pRect(sx+3, sy-12, 4, 6, '#0aa');
    pRect(sx+3, sy+6, 4, 6, '#0aa');
    // Engine glow
    pRect(sx-4, sy-4, 4, 8, '#ff0');
    if (player.pow.shield>0 && (frame & 3) < 2) {
      pCircle(sx+14, sy, 16, 'rgba(0,255,255,0.35)');
    }
  }

  function drawEnemy(e) {
    // Color twinkle green<->red
    const body = (Math.floor(e.t/18)%2===0) ? '#0f0' : '#f33';
    const eye  = '#fff';
    switch (e.kind) {
      case 'blob':
        pCircle(e.x, e.y, 18, body);
        pRect(e.x-6, e.y-3, 12, 6, eye);
        pRect(e.x+9, e.y-2, 4, 4, '#000');
        break;
      case 'eye':
        pCircle(e.x, e.y, 16, body);
        pCircle(e.x, e.y, 9, '#000');
        pRect(e.x-3, e.y-3, 6, 6, eye);
        break;
      case 'crab':
        pRect(e.x-18, e.y-12, 36, 24, body);
        pRect(e.x-22, e.y-9, 6, 18, body);
        pRect(e.x+16, e.y-9, 6, 18, body);
        pRect(e.x-9, e.y-4, 18, 8, '#000');
        pRect(e.x-3, e.y-3, 6, 6, eye);
        break;
      case 'ufo':
        pRect(e.x-20, e.y-8, 40, 16, body);
        pRect(e.x-9, e.y-12, 18, 8, '#0a0');
        pRect(e.x-3, e.y-14, 6, 3, eye);
        break;
    }
    if (e.flash > 0 && (frame & 1) === 0) {
      pRect(e.x-22, e.y-18, 44, 36, 'rgba(255,255,255,0.4)');
    }
    // Health bar
    const hw = 28;
    const hh = 3;
    const frac = Math.max(0, e.hp / e.maxhp);
    pRect(e.x - hw/2, e.y - 22, hw, hh, '#222');
    pRect(e.x - hw/2, e.y - 22, hw*frac, hh, '#0f0');
  }

  function drawOrb(o) {
    const base = {
      rapid: '#0ff',
      spread: '#ff0',
      shield: '#6ff',
      heal: '#0f0',
      mega: '#f0f',
      side: '#f80'
    }[o.type] || '#fff';
    pCircle(o.x, o.y, 7, 'rgba(255,255,255,0.10)');
    pCircle(o.x, o.y, 6, 'rgba(255,255,255,0.15)');
    pCircle(o.x, o.y, 5, base);
    pCircle(o.x, o.y, 3, '#fff');
  }

  // Beefed-up starfield with twinkles
  const starsA = new Array(160).fill(0).map((_,i)=>({x: R.i(0,LOGICAL_W_BASE), y: R.i(0, H), s: 0.5+R.r(), tw: R.i(0,60)}));
  const starsB = new Array(90).fill(0).map((_,i)=>({x: R.i(0,LOGICAL_W_BASE), y: R.i(0, H), s: 1+R.r(), tw: R.i(0,40)}));
  function drawStarfield() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,W,H);
    // Layer A
    for (const st of starsA) {
      st.x -= 0.3*st.s; if (st.x < -2) st.x += W+2;
      st.tw = (st.tw+1)%60;
      const tw = st.tw<30 ? 1 : 0; // simple twinkle
      pRect(st.x, st.y, 1+tw, 1, '#666');
    }
    // Layer B (brighter, parallax)
    for (const st of starsB) {
      st.x -= 0.8*st.s; if (st.x < -2) st.x += W+2;
      st.tw = (st.tw+1)%40;
      const tw = st.tw<15 ? 1 : 0;
      pRect(st.x, st.y, 2, 1+tw, '#aaa');
    }
  }

  // ===== Spawning =====
  function spawnBullet(x,y,vx,vy,life,color,r=3) {
    bullets.push({ x, y, vx, vy, life, color, r });
  }
  function spawnEBullet(x,y,vx,vy,life) {
    eBullets.push({ x, y, vx, vy, life, r: 5 });
  }
  function difficultyFactor() {
    // ramps with score
    return 1 + Math.min(3, player.score / 1500);
  }
  function spawnEnemy() {
    const y = R.i(26, H-26);
    const d = difficultyFactor();
    const spd = R.f(0.7, 1.4) * d;
    const hp = Math.round(R.f(4, 8) * d);
    const kind = R.pick(['blob','eye','crab','ufo']);
    enemies.push({
      x: W + 12, y, vx: -spd, vy: R.f(-0.35,0.35),
      t: 0, hp, maxhp: hp, kind, shootCd: R.i(50/d, 90/d)|0,
      flash: 0
    });
  }
  function spawnOrb(x,y) {
    const type = R.pick(['rapid','spread','shield','heal','mega','side']);
    orbs.push({ x, y, vx: -0.6, vy: 0, r: 5, type, t: 0 });
  }

  // ===== Game Loop =====
  let frame = 0;
  let spawnTimer = 0;
  let orbTimer = 240;
  let playing = false;
  let gameOver = false;
  let rafId = null;

  function update() {
    frame++;

    // Smoothly move player toward pointer when held
    if (pointerDown) {
      const targetY = pointerY|0;
      player.vy += (targetY - player.y) * 0.12;
    }
    player.vy *= 0.82;
    player.y += player.vy;
    player.y = Math.max(20, Math.min(H-20, player.y));

    // Auto-fire when held; power levels stack
    if (pointerDown && player.alive) {
      if (player.fireCd <= 0) {
        const baseV = 3 + Math.min(4, player.pow.rapid*0.6); // faster with rapid levels
        SFX.shoot();
        // Main/mega beam
        const megaShots = 1 + Math.min(3, player.pow.mega);
        for (let m=0; m<megaShots; m++) {
          const off = (m - (megaShots-1)/2) * 2;
          spawnBullet(player.x+26, player.y+off, baseV+1, 0, 46, '#fff', 3+Math.min(3, player.pow.mega));
        }
        // Side drones scale with level
        const sides = Math.min(4, player.pow.side);
        for (let s=0; s<sides; s++) {
          const yy = (s%2===0 ? -12 : 12) + (s>1 ? (s-1)*4 : 0);
          spawnBullet(player.x+20, player.y+yy, baseV*0.95, (yy>0?0.2:-0.2), 44, '#ff8', 3);
        }
        // Spread arcs scale with level
        const spread = player.pow.spread;
        for (let k=1; k<=spread; k++) {
          const vy = 0.5 + k*0.25;
          spawnBullet(player.x+22, player.y, baseV, -vy, 40, '#ff0', 2);
          spawnBullet(player.x+22, player.y, baseV, +vy, 40, '#ff0', 2);
        }
        player.fireCd = Math.max(3, 12 - player.pow.rapid*2);
      } else {
        player.fireCd--;
      }
    } else {
      player.fireCd = Math.max(0, player.fireCd-1);
    }

    // Update bullets
    for (let i=bullets.length-1; i>=0; i--) {
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy;
      if (--b.life <= 0 || b.x>W+10 || b.y< -12 || b.y>H+12) bullets.splice(i,1);
    }

    // Spawn enemies
    spawnTimer--;
    if (spawnTimer<=0) {
      spawnEnemy();
      const d = difficultyFactor();
      spawnTimer = Math.max(14, (R.i(26, 46) / d)|0);
    }

    // Update enemies
    for (let i=enemies.length-1; i>=0; i--) {
      const e = enemies[i];
      e.x += e.vx;
      e.y += e.vy;
      e.t++;
      if (e.y<22 || e.y>H-22) e.vy *= -1;
      // Shoot (bigger orbs)
      if (--e.shootCd<=0) {
        const d = difficultyFactor();
        e.shootCd = (R.i(60, 110) / d)|0;
        const spd = R.f(1.3, 2.1) * d;
        const dy = player.y - e.y;
        const dist = Math.max(1, Math.hypot((player.x - e.x), dy));
        const vx = -spd;
        const vy = spd * (dy/dist);
        spawnEBullet(e.x-12, e.y, vx, vy, 170);
        SFX.enemy();
      }
      if (e.x < -36) { enemies.splice(i,1); continue; }
      e.flash = Math.max(0, e.flash-1);
    }

    // Enemy bullets
    for (let i=eBullets.length-1; i>=0; i--) {
      const eb = eBullets[i];
      eb.x += eb.vx; eb.y += eb.vy;
      if (--eb.life<=0 || eb.x<-24 || eb.y<-24 || eb.y>H+24) eBullets.splice(i,1);
    }

    // Collisions: bullets vs enemies
    for (let i=enemies.length-1; i>=0; i--) {
      const e = enemies[i];
      const er = 18; // enlarged
      for (let j=bullets.length-1; j>=0; j--) {
        const b = bullets[j];
        const dx = e.x - b.x, dy = e.y - b.y;
        if (dx*dx + dy*dy < (er + b.r)*(er + b.r)) {
          bullets.splice(j,1);
          const dmg = 1 + player.pow.mega; // mega levels add damage
          e.hp -= dmg;
          e.flash = 6;
          if (e.hp <= 0) {
            explode(e.x, e.y);
            player.score += Math.round(80 * difficultyFactor());
            if (R.chance(0.7)) spawnOrb(e.x, e.y);
            enemies.splice(i,1);
            SFX.boom();
          } else {
            SFX.hit();
          }
          break;
        }
      }
    }

    // Collisions: enemy bullets & enemies with player
    if (player.alive) {
      for (let i=eBullets.length-1; i>=0; i--) {
        const eb = eBullets[i];
        if (circleRectCollision(eb.x, eb.y, eb.r, player.x, player.y-14, 36, 28)) {
          eBullets.splice(i,1);
          hurtPlayer(12);
        }
      }
      for (let i=enemies.length-1; i>=0; i--) {
        const e = enemies[i];
        if (circleRectCollision(e.x, e.y, 18, player.x, player.y-14, 36, 28)) {
          enemies.splice(i,1);
          explode(e.x, e.y);
          hurtPlayer(28);
        }
      }
    }

    // Orbs (magnetic homing)
    orbTimer--;
    if (orbTimer<=0) {
      spawnOrb(W-12, R.i(24, H-24));
      orbTimer = R.i(200, 280);
    }
    for (let i=orbs.length-1; i>=0; i--) {
      const o = orbs[i];
      o.t++;
      // steer toward player slightly
      const dx = player.x - o.x;
      const dy = player.y - o.y;
      const dist = Math.hypot(dx, dy);
      const steer = 0.06; // gentle magnetism; can still miss
      o.vx += (dx / (dist||1)) * steer;
      o.vy += (dy / (dist||1)) * steer;
      // dampen speed
      o.vx = Math.max(-2, Math.min(2, o.vx));
      o.vy = Math.max(-2, Math.min(2, o.vy));
      o.x += o.vx;
      o.y += o.vy;
      if (o.x<-24) { orbs.splice(i,1); continue; }
      // pickup
      if (circleRectCollision(o.x, o.y, o.r, player.x, player.y-14, 36, 28)) {
        applyPower(o.type);
        orbs.splice(i,1);
        SFX.pow();
        player.score += 35;
      }
    }

    // Score over time
    if (player.alive) player.score++;

    // Health UI
    const frac = Math.max(0, player.hp / player.hpMax);
    healthFill.style.width = (frac*100).toFixed(1) + '%';
    healthFill.style.background = frac>0.5 ? 'linear-gradient(90deg,#0f0,#7fff00)' :
                                 frac>0.25 ? 'linear-gradient(90deg,#ff0,#ffa500)' :
                                             'linear-gradient(90deg,#f33,#f66)';
    scoreVal.textContent = player.score.toString();
  }

  function render() {
    drawStarfield();

    // Bullets behind ship for visibility? Keep in front:
    // Player ship
    drawShip(player.x, player.y, (!player.alive) ? 1 : 0);

    // Bullets
    for (const b of bullets) {
      pCircle(b.x, b.y, b.r, b.color || '#fff');
    }

    // Enemies
    for (const e of enemies) drawEnemy(e);

    // Enemy bullets (big orbs)
    for (const eb of eBullets) {
      pCircle(eb.x, eb.y, eb.r+2, 'rgba(255,255,255,0.1)');
      pCircle(eb.x, eb.y, eb.r, '#f44');
      pCircle(eb.x, eb.y, eb.r-2, '#faa');
    }

    // Power-up orbs
    for (const o of orbs) drawOrb(o);

    // Sparks
    drawSparks();
  }

  function explode(x,y) {
    for (let i=0;i<30;i++) {
      const a = Math.random()*Math.PI*2;
      const s = Math.random()*2+0.5;
      sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life: R.i(24,44)});
    }
  }
  function updateSparks() {
    for (let i=sparks.length-1; i>=0; i--) {
      const p = sparks[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.98; p.vy *= 0.98; p.vy += 0.01;
      if (--p.life<=0) sparks.splice(i,1);
    }
  }
  function drawSparks() {
    for (const p of sparks) {
      const c = p.life>20 ? '#fff' : '#ff0';
      pRect(p.x, p.y, 2, 2, c);
    }
  }

  // Collision helper
  function circleRectCollision(cx, cy, cr, rx, ry, rw, rh) {
    const testX = Math.max(rx, Math.min(cx, rx+rw));
    const testY = Math.max(ry, Math.min(cy, ry+rh));
    const dx = cx - testX;
    const dy = cy - testY;
    return (dx*dx + dy*dy) <= cr*cr;
  }

  function effectiveDamage(dmg) {
    // Shield level gives 10% reduction per level up to 80%
    const reduction = Math.min(0.8, player.pow.shield * 0.10);
    return Math.max(1, Math.round(dmg * (1 - reduction)));
  }

  function hurtPlayer(dmg) {
    const d = effectiveDamage(dmg);
    player.hp -= d;
    SFX.hit();
    if (player.hp <= 0) {
      player.hp = 0;
      player.alive = false;
      endGame();
    }
  }

  // Permanent stacking powers
  function applyPower(type) {
    switch(type) {
      case 'rapid': player.pow.rapid++; break;
      case 'spread': player.pow.spread++; break;
      case 'shield': player.pow.shield++; break;
      case 'heal': player.hp = Math.min(player.hpMax, player.hp + 30); break;
      case 'mega': player.pow.mega++; break;
      case 'side': player.pow.side++; break;
    }
  }

  function loop() {
    if (!playing) return;
    update();
    updateSparks();
    render();
    rafId = requestAnimationFrame(loop);
  }

  function startGame() {
    bullets.length = 0;
    enemies.length = 0;
    eBullets.length = 0;
    orbs.length = 0;
    sparks.length = 0;
    player.x = 20;
    player.y = H/2;
    player.vy = 0;
    player.hp = player.hpMax;
    player.alive = true;
    player.score = 0;
    // Keep power levels persistent across runs? We'll reset for fresh run:
    player.pow = { rapid:0, spread:0, shield:0, mega:0, side:0 };
    spawnTimer = 10;
    orbTimer = 200;
    frame = 0;
    playing = true;
    gameOver = false;
    hideOverlay();
    loop();
  }

  function endGame() {
    playing = false;
    cancelAnimationFrame(rafId);
    gameOver = true;
    showGameOverOverlay();
    liveText('Game over. Score ' + player.score);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && playing) {
      playing = false;
      cancelAnimationFrame(rafId);
    } else if (!document.hidden && overlay.classList.contains('hidden') && !gameOver) {
      playing = true;
      loop();
    }
  });

  // ===== HUD / Overlay controls =====
  const healthFill = document.getElementById('healthFill');
  const scoreVal = document.getElementById('scoreVal');
  const overlay = document.getElementById('overlay');
  const overlayContent = document.getElementById('overlayContent');

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function showOverlay() { overlay.classList.remove('hidden'); }
  function hideOverlay() { overlay.classList.add('hidden'); }

  function button(txt, handler) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = txt;
    b.addEventListener('click', handler);
    return b;
  }

  function showStartOverlay() {
    clear(overlayContent);
    const title = document.createElement('h1');
    title.className = 'title';
    title.textContent = 'SPACE BLAST';
    const sub = document.createElement('p');
    sub.className = 'subtitle';
    sub.textContent = 'Hold to fire. Drag up/down to fly.';
    const buttons = document.createElement('div');
    buttons.className = 'buttons';
    const playBtn = button('Play', startGame);
    const soundBtn = button('Sound: Off', () => {
      if (!audioCtx) initAudio();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      soundOn = !soundOn;
      soundBtn.textContent = 'Sound: ' + (soundOn ? 'On' : 'Off');
    });
    buttons.appendChild(playBtn);
    buttons.appendChild(soundBtn);
    overlayContent.appendChild(title);
    overlayContent.appendChild(sub);
    overlayContent.appendChild(buttons);
    showOverlay();
  }

  function showGameOverOverlay() {
    clear(overlayContent);
    // ONLY: big score + replay + share
    const scoreEl = document.createElement('div');
    scoreEl.className = 'bigscore';
    scoreEl.style.fontFamily = 'Helvetica, Arial, sans-serif';
    scoreEl.textContent = player.score.toString();
    const buttons = document.createElement('div');
    buttons.className = 'buttons';
    const replay = button('Replay', startGame);
    const share = button('Share', shareScore);
    buttons.appendChild(replay);
    buttons.appendChild(share);
    overlayContent.appendChild(scoreEl);
    overlayContent.appendChild(buttons);
    showOverlay();
  }

  function shareScore() {
    const text = `SPACE BLAST — Score: ${player.score}`;
    if (navigator.share) {
      navigator.share({ text, title: 'Space Blast Score' }).catch(()=>{});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        alert('Score copied to clipboard!');
      }, ()=>{ alert(text); });
    } else {
      alert(text);
    }
  }

  // Screen reader live region updates
  const live = document.getElementById('live');
  function liveText(t) { live.textContent = t; }

  // Initial screen
  showStartOverlay();

  // Draw something initially behind overlay
  drawStarfield();
  ctx.fillStyle = '#fff';
  ctx.font = '900 18px Helvetica, Arial, sans-serif';
  ctx.fillText('Big-pixel space shooter ready.', 10, 24);
})();
</script>
</body>
</html>
