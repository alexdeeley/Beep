<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bent Square</title>
<style>
  :root{ --bg:#000; --fg:#fff; --dim:rgba(255,255,255,.55); color-scheme:dark; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Helvetica,Arial,sans-serif;touch-action:none;user-select:none;}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;background:var(--bg);}
  #hud{position:fixed;right:max(16px,env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));z-index:2;display:flex;gap:18px;pointer-events:none;font-variant-numeric:tabular-nums;}
  .stat{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .stat b{font:900 clamp(20px,5vw,30px)/1 Helvetica,Arial,sans-serif;}
  .stat span{font:700 10px/1 Helvetica,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
  #reset{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:2;background:transparent;color:var(--fg);border:1px solid var(--dim);border-radius:999px;padding:9px 20px;font:700 12px/1 Helvetica,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;touch-action:manipulation;}
  #reset:hover{border-color:var(--fg);}
  #reset:focus-visible{outline:2px solid var(--fg);outline-offset:3px;}
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to deeley.org" title="Back to deeley.org">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>

<canvas id="c"></canvas>
<div id="hud">
  <div class="stat"><b id="hits">0</b><span>Hits</span></div>
  <div class="stat"><b id="speed">1.00×</b><span>Speed</span></div>
  <div class="stat"><b id="pieces">4</b><span>Pieces</span></div>
</div>
<button id="reset" type="button">Reset</button>
<script>
(function(){
'use strict';

// World units: the square starts 600 wide, centred on the origin.
var HALF = 300;
var BALL_R = 9;
var BASE_SPEED = 320;      // world units per second
var SPEED_UP = 1.01;       // +1% per wall hit
var BEND = 7;              // how far a hit pushes the wall outward
var SNAP = 3;              // hits closer than this to a joint bend that joint instead of splitting

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var hitsEl = document.getElementById('hits');
var speedEl = document.getElementById('speed');
var piecesEl = document.getElementById('pieces');

var pts, ball, hits, flashes, view, W, H, dpr;

function reset(){
  pts = [{x:-HALF,y:-HALF},{x:HALF,y:-HALF},{x:HALF,y:HALF},{x:-HALF,y:HALF}];
  var a = Math.random()*Math.PI*2;
  // avoid starting perfectly axis-aligned
  if (Math.abs(Math.cos(a)) < .2 || Math.abs(Math.sin(a)) < .2) a += .6;
  ball = {x:0, y:0, vx:Math.cos(a)*BASE_SPEED, vy:Math.sin(a)*BASE_SPEED};
  hits = 0;
  flashes = [];
  view = null;
  updateHud();
}

function updateHud(){
  hitsEl.textContent = hits;
  var m = Math.pow(SPEED_UP, hits);
  speedEl.textContent = (m < 100 ? m.toFixed(2) : Math.round(m)) + '×';
  piecesEl.textContent = pts.length;
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
}

// Closest point on segment ab to p, with t in [0,1].
function closest(p, a, b){
  var dx = b.x-a.x, dy = b.y-a.y;
  var len2 = dx*dx + dy*dy;
  var t = len2 ? ((p.x-a.x)*dx + (p.y-a.y)*dy)/len2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return {x:a.x+dx*t, y:a.y+dy*t, t:t};
}

function collide(){
  var best = null, bestD = BALL_R, n = pts.length;
  for (var i = 0; i < n; i++){
    var a = pts[i], b = pts[(i+1)%n];
    var q = closest(ball, a, b);
    var dx = q.x-ball.x, dy = q.y-ball.y;
    var d = Math.sqrt(dx*dx + dy*dy);
    if (d < bestD && d > 1e-9){
      var nx = dx/d, ny = dy/d;
      // only count it if the ball is moving into the wall
      if (ball.vx*nx + ball.vy*ny > 0){ bestD = d; best = {i:i, q:q, nx:nx, ny:ny}; }
    }
  }
  if (!best) return;

  // Bounce: reflect velocity across the wall's surface, then speed up 1%.
  var dot = ball.vx*best.nx + ball.vy*best.ny;
  ball.vx = (ball.vx - 2*dot*best.nx) * SPEED_UP;
  ball.vy = (ball.vy - 2*dot*best.ny) * SPEED_UP;
  ball.x = best.q.x - best.nx*(BALL_R+0.01);
  ball.y = best.q.y - best.ny*(BALL_R+0.01);

  // Break the wall at the exact contact point and bend it outward there.
  var i = best.i, a = pts[i], b = pts[(i+1)%n];
  var segLen = Math.hypot(b.x-a.x, b.y-a.y);
  var joint;
  if (best.q.t*segLen < SNAP) joint = a;
  else if ((1-best.q.t)*segLen < SNAP) joint = b;
  else { joint = {x:best.q.x, y:best.q.y}; pts.splice(i+1, 0, joint); }
  joint.x += best.nx*BEND;
  joint.y += best.ny*BEND;

  hits++;
  flashes.push({x:best.q.x, y:best.q.y, life:1});
  updateHud();
}

function step(dt){
  var sp = Math.hypot(ball.vx, ball.vy);
  // Sub-step so the ball never moves more than a third of its radius at once.
  var steps = Math.min(2000, Math.max(1, Math.ceil(sp*dt/(BALL_R/3))));
  var h = dt/steps;
  for (var s = 0; s < steps; s++){
    ball.x += ball.vx*h; ball.y += ball.vy*h;
    collide();
  }
  // Safety net: if the ball ever escapes the shape's bounds, put it back in the middle.
  var bb = bounds();
  if (ball.x < bb.x0-50 || ball.x > bb.x1+50 || ball.y < bb.y0-50 || ball.y > bb.y1+50){
    var c = centroid(); ball.x = c.x; ball.y = c.y;
  }
  for (var k = flashes.length-1; k >= 0; k--){
    flashes[k].life -= dt*2.2;
    if (flashes[k].life <= 0) flashes.splice(k,1);
  }
}

function bounds(){
  var x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for (var i=0;i<pts.length;i++){
    var p=pts[i];
    if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y;
  }
  return {x0:x0,y0:y0,x1:x1,y1:y1};
}
function centroid(){
  var x=0,y=0;
  for (var i=0;i<pts.length;i++){ x+=pts[i].x; y+=pts[i].y; }
  return {x:x/pts.length, y:y/pts.length};
}

// Camera starts with the square at half size and slowly zooms in until it
// fills the screen. If the shape grows past the edge it zooms out quickly.
var ZOOM_IN_TIME = 8;      // seconds (time constant of the slow zoom in)
function updateView(dt){
  var bb = bounds();
  var cx = (bb.x0+bb.x1)/2, cy = (bb.y0+bb.y1)/2;
  var pad = Math.min(W,H) < 500 ? 24 : 70;
  var topPad = pad + 40;
  var scale = Math.min((W-pad*2)/(bb.x1-bb.x0), (H-topPad-pad-40)/(bb.y1-bb.y0));
  var target = {cx:cx, cy:cy, s:scale};
  if (!view) view = {cx:cx, cy:cy, s:scale*0.5};
  else {
    view.cx += (target.cx-view.cx)*.08;
    view.cy += (target.cy-view.cy)*.08;
    if (target.s < view.s) view.s += (target.s-view.s)*.08;
    else view.s += (target.s-view.s)*(1-Math.exp(-dt/ZOOM_IN_TIME));
  }
  view.oy = (topPad - 40)/2;
}

function draw(dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);
  updateView(dt);
  var s = view.s;
  ctx.setTransform(dpr*s,0,0,dpr*s, dpr*(W/2 - view.cx*s), dpr*(H/2 + view.oy - view.cy*s));

  // Each piece is drawn on its own with a hairline gap, so every break shows.
  var n = pts.length, gap = 1.6/s;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3/s;
  ctx.lineCap = 'butt';
  ctx.beginPath();
  for (var i = 0; i < n; i++){
    var a = pts[i], b = pts[(i+1)%n];
    var len = Math.hypot(b.x-a.x, b.y-a.y);
    if (len <= gap*2) continue;
    var ux = (b.x-a.x)/len, uy = (b.y-a.y)/len;
    ctx.moveTo(a.x+ux*gap, a.y+uy*gap);
    ctx.lineTo(b.x-ux*gap, b.y-uy*gap);
  }
  ctx.stroke();

  for (var k = 0; k < flashes.length; k++){
    var f = flashes[k];
    ctx.strokeStyle = 'rgba(255,255,255,'+(f.life*.8)+')';
    ctx.lineWidth = 1.5/s;
    ctx.beginPath();
    ctx.arc(f.x, f.y, (1-f.life)*30 + 4, 0, Math.PI*2);
    ctx.stroke();
  }

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
  ctx.fill();
}

var last = 0;
function frame(t){
  var dt = last ? Math.min(.05, (t-last)/1000) : 0;
  last = t;
  step(dt);
  draw(dt);
  requestAnimationFrame(frame);
}

document.getElementById('reset').addEventListener('click', reset);
window.addEventListener('resize', resize);
resize();
reset();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
