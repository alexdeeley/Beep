<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Maisie Eats Everything 2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #000;
    overflow:hidden;
    width:100%; height:100%;
    touch-action:none;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  canvas { display:block; background:#000; }

  #hud {
    position:fixed; top:0; left:0; width:100%;
    padding:18px 20px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none;
    z-index:10;
  }
  .hudBox {
    color:#fff;
    font-size:clamp(28px, 6vw, 46px);
    font-weight:900;
    letter-spacing:2px;
    line-height:1;
  }
  .hudLabel {
    font-size:clamp(14px, 3vw, 18px);
    letter-spacing:4px;
    color:#fff;
    opacity:0.9;
    margin-bottom:4px;
    font-weight:700;
  }

  #barWrap {
    position:fixed;
    top:0; left:0; width:100%;
    height:16px;
    background:#000;
    border-bottom:4px solid #fff;
    z-index:10;
  }
  #barFill {
    height:100%;
    width:0%;
    background: linear-gradient(90deg, #ff2e6d, #ff9d1f, #ffe600, #29e07a, #1fb8ff, #b04dff);
    transition: width 0.25s ease-out;
  }

  #msgOverlay {
    position:fixed; inset:0;
    background: #000;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:100;
    text-align:center;
    padding:20px;
  }
  #msgOverlay.show { display:flex; }
  #msgTitle {
    color:#fff;
    font-size:clamp(40px, 10vw, 90px);
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:24px;
    border: 6px solid #fff;
    padding: 20px 40px;
    border-radius: 24px;
  }
  #msgSub {
    color:#fff;
    font-size:clamp(20px,5vw,28px);
    margin-bottom:40px;
    font-weight:700;
    letter-spacing:2px;
  }
  .bigBtn {
    background: #fff;
    color:#000;
    border: 5px solid #fff;
    font-size:clamp(24px,5vw,32px);
    font-weight:900;
    letter-spacing:3px;
    padding:22px 50px;
    border-radius:100px;
    cursor:pointer;
    box-shadow: 0 0 0 4px #000, 0 0 0 8px #fff;
  }
  .bigBtn:active { background:#ddd; }

  #startOverlay {
    position:fixed; inset:0;
    background: #000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:200;
    padding:24px;
    text-align:center;
  }
  #startTitle {
    color:#fff;
    font-size:clamp(44px, 12vw, 110px);
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:10px;
  }
  #startSub {
    color:#fff;
    font-size:clamp(18px,4.5vw,26px);
    font-weight:700;
    letter-spacing:1px;
    margin-bottom:40px;
    max-width:600px;
    line-height:1.5;
  }

  #levelToast {
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.9);
    color:#000;
    background:#fff;
    font-size:clamp(26px,5.5vw,48px);
    font-weight:900;
    letter-spacing:2px;
    padding:24px 44px;
    border-radius:24px;
    border: 5px solid #000;
    z-index:150;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  #storyLine {
    display:block;
    margin-top:10px;
    font-size:clamp(15px,3.5vw,23px);
    line-height:1.25;
    letter-spacing:1px;
    color:#54116f;
  }
  #levelToast.show {
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }

  #controlsHint {
    position:fixed;
    bottom:16px;
    left:0; width:100%;
    text-align:center;
    color:#fff;
    font-size:clamp(14px,3.5vw,18px);
    font-weight:700;
    letter-spacing:2px;
    opacity:0.9;
    z-index:10;
    pointer-events:none;
  }
</style>
</head>

<div id="startOverlay">
  <div id="startTitle">MAISIE EATS EVERYTHING 2</div>
  <div id="startSub">THE GREAT EMOJI PARADE HAS SCATTERED ACROSS THE RAINBOW KINGDOM!<br>HELP MAISIE GOBBLE EVERY LAST FRIEND—NOTHING CAN HIDE IN A CORNER! 🌈🦄✨</div>

<div id="hud">
  <div class="hudBox">
    <div class="hudLabel">SIZE</div>

    <div id="eatVal">0 / 0</div>

</div>

<div id="levelToast"></div>

<div id="controlsHint">DRAG TO STEER • RAINBOW EDGES ARE MAGIC DOORS!</div>

<canvas id="c"></canvas>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Audio ----------
  let actx = null;
  function ensureAudio(){
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  }
  function eatSound(radius){
    if(!actx) return;
    const now = actx.currentTime;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    const freq = Math.max(80, 900 - radius*6);
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq*0.5, now+0.12);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.35, now+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+0.18);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(now); osc.stop(now+0.2);
  }
  function milestoneSound(){
    if(!actx) return;
    const now = actx.currentTime;
    [0,0.09,0.18].forEach((t,i)=>{
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type='triangle';
      osc.frequency.setValueAtTime(220*(i+2), now+t);
      gain.gain.setValueAtTime(0.0001, now+t);
      gain.gain.exponentialRampToValueAtTime(0.3, now+t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+t+0.25);
      osc.connect(gain); gain.connect(actx.destination);
      osc.start(now+t); osc.stop(now+t+0.3);
    });
  }

  // ---------- World / Levels ----------
  let WORLD = 3600;
  let player, objects, eatenCount, totalCount, running, screenShake, lastMilestone;
  let currentLevel = 0;

  function rand(a,b){ return a + Math.random()*(b-a); }
  const KINDS = ['heart','star','flower','gem','cupcake','bow','butterfly','bee','kitty','rainbow','strawberry','cookie','daisy','moon','crown','penguin','dinosaur','ladybug','mermaid','castle','unicorn','puppy','bunny','frog','octopus','whale','dolphin','turtle','snail','mushroom','watermelon','donut','icecream','lollipop','balloon','gift','sparkles','sun','planet','rocket','fairy','dragon','panda','koala','lion','pizza','cherry','apple','carrot','music'];
  const EMOJIS = {
    butterfly:'🦋', bee:'🐝', kitty:'🐱', rainbow:'🌈', strawberry:'🍓',
    cookie:'🍪', daisy:'🌼', moon:'🌙', crown:'👑', penguin:'🐧',
    dinosaur:'🦕', ladybug:'🐞', mermaid:'🧜‍♀️', castle:'🏰',
    unicorn:'🦄', puppy:'🐶', bunny:'🐰', frog:'🐸', octopus:'🐙',
    whale:'🐳', dolphin:'🐬', turtle:'🐢', snail:'🐌', mushroom:'🍄',
    watermelon:'🍉', donut:'🍩', icecream:'🍦', lollipop:'🍭', balloon:'🎈',
    gift:'🎁', sparkles:'✨', sun:'🌞', planet:'🪐', rocket:'🚀', fairy:'🧚‍♀️',
    dragon:'🐲', panda:'🐼', koala:'🐨', lion:'🦁', pizza:'🍕', cherry:'🍒',
    apple:'🍎', carrot:'🥕', music:'🎵'
  };
  const CANDY_COLORS = ['#ff2e6d','#ff9d1f','#ffe600','#29e07a','#1fb8ff','#b04dff','#ff5fa2','#00e0c0'];
  function randKind(){ return KINDS[Math.floor(Math.random()*KINDS.length)]; }
  function randColor(){ return CANDY_COLORS[Math.floor(Math.random()*CANDY_COLORS.length)]; }
  function mkObj(x,y,r){ return {x,y,radius:r, kind:randKind(), color:randColor(), alive:true, rot: rand(0,Math.PI*2)}; }

  function farEnough(list, x, y, minDist){
    for(const o of list){ if(Math.hypot(o.x-x,o.y-y) < minDist) return false; }
    return true;
  }

  // guarantees a handful of small easy objects near spawn so every level is playable from size 22
  function addStarters(list, world, spawnX, spawnY){
    let placed = 0, tries = 0;
    while(placed < 8 && tries < 400){
      tries++;
      const a = rand(0,Math.PI*2), d = rand(140,320);
      const x = spawnX + Math.cos(a)*d, y = spawnY + Math.sin(a)*d;
      if(x < 30 || y < 30 || x > world-30 || y > world-30) continue;
      const r = rand(8,15);
      if(!farEnough(list, x, y, r+30)) continue;
      list.push(mkObj(x,y,r));
      placed++;
    }
  }

  const LEVELS = [
    { name:'THE LOST MEADOW', story:'Wake the flowers and find Daisy the Bee!', pattern:'meadow', world:3200, build(list, world, spawn){
      const N = 90;
      for(let i=0;i<N;i++){
        let r; const roll = Math.random();
        if(roll<0.55) r = rand(9,20); else if(roll<0.85) r = rand(20,42); else r = rand(42,90);
        let x,y,tries=0;
        do{ x=rand(r+20,world-r-20); y=rand(r+20,world-r-20); tries++; }
        while(Math.hypot(x-spawn.x,y-spawn.y)<220 && tries<20);
        list.push(mkObj(x,y,r));
      }
    }},
    { name:'RAINBOW RIVER', story:'Follow the rings across the singing river!', pattern:'rings', world:3400, build(list, world, spawn){
      const cx=world/2, cy=world/2;
      for(let ring=0; ring<6; ring++){
        const rad = 260 + ring*280;
        const count = 8 + ring*3;
        const size = rand(10,20) + ring*10;
        for(let i=0;i<count;i++){
          const a = (i/count)*Math.PI*2 + rand(-0.15,0.15);
          const x = cx + Math.cos(a)*rad, y = cy + Math.sin(a)*rad;
          if(x<30||y<30||x>world-30||y>world-30) continue;
          list.push(mkObj(x,y, Math.max(8,size+rand(-6,6))));
        }
      }
    }},
    { name:'CANDY PATCHWORK', story:'Mend the giant candy quilt!', pattern:'checker', world:3400, build(list, world, spawn){
      const half = world/2;
      const quads = [
        {x0:0,y0:0, min:9,max:18, n:26},
        {x0:half,y0:0, min:22,max:44, n:18},
        {x0:0,y0:half, min:50,max:95, n:9},
        {x0:half,y0:half, min:12,max:60, n:16}
      ];
      for(const q of quads){
        for(let i=0;i<q.n;i++){
          const x = rand(q.x0+40, q.x0+half-40);
          const y = rand(q.y0+40, q.y0+half-40);
          list.push(mkObj(x,y, rand(q.min,q.max)));
        }
      }
    }},
    { name:'BUTTERFLY WHIRL', story:'Dance through the glitter spiral!', pattern:'spiral', world:3600, build(list, world, spawn){
      const cx=world/2, cy=world/2;
      const turns = 4.5;
      const steps = 70;
      for(let i=0;i<steps;i++){
        const t = i/steps;
        const angle = t*Math.PI*2*turns;
        const rad = 100 + t*(world*0.42);
        const x = cx + Math.cos(angle)*rad, y = cy + Math.sin(angle)*rad;
        if(x<30||y<30||x>world-30||y>world-30) continue;
        const size = 10 + t*70 + rand(-6,6);
        list.push(mkObj(x,y, Math.max(8,size)));
      }
    }},
    { name:'KITTY CUPCAKE PICNIC', story:'The kitties need treats for their picnic!', pattern:'polka', world:3600, build(list, world, spawn){
      const clusterCount = 7;
      for(let c=0;c<clusterCount;c++){
        const ccx = rand(300, world-300), ccy = rand(300, world-300);
        if(Math.hypot(ccx-spawn.x,ccy-spawn.y) < 260) continue;
        const sizeBase = rand(12,70);
        const n = Math.floor(rand(8,16));
        for(let i=0;i<n;i++){
          const a = rand(0,Math.PI*2), d = rand(20,150);
          const x = ccx + Math.cos(a)*d, y = ccy + Math.sin(a)*d;
          if(x<30||y<30||x>world-30||y>world-30) continue;
          list.push(mkObj(x,y, Math.max(8,sizeBase+rand(-8,8))));
        }
      }
    }},
    { name:'MOONLIGHT GARDEN', story:'Light every star before bedtime!', pattern:'stars', world:3600, build(list, world, spawn){
      const spacing = 280;
      for(let x=spacing; x<world-spacing/2; x+=spacing){
        for(let y=spacing; y<world-spacing/2; y+=spacing){
          if(Math.random() < 0.22) continue;
          if(Math.hypot(x-spawn.x,y-spawn.y) < 200) continue;
          const jx = x+rand(-40,40), jy = y+rand(-40,40);
          const distFromCenter = Math.hypot(x-world/2,y-world/2);
          const size = 12 + distFromCenter*0.02 + rand(-8,8);
          list.push(mkObj(jx,jy, Math.max(8,size)));
        }
      }
    }},
    { name:'RAINBOW ROAD', story:'Race the penguins along six ribbon roads!', pattern:'lanes', world:3400, build(list, world, spawn){
      const lanes = 6;
      for(let l=0; l<lanes; l++){
        const y = 220 + l*((world-440)/(lanes-1));
        const size = 10 + l*16;
        const n = 12;
        for(let i=0;i<n;i++){
          const x = 150 + i*((world-300)/(n-1)) + rand(-20,20);
          list.push(mkObj(x, y+rand(-20,20), Math.max(8,size+rand(-6,6))));
        }
      }
    }},
    { name:'MERMAID CROSSING', story:'Carry the magic bows across the sea!', pattern:'waves', world:3400, build(list, world, spawn){
      const cx=world/2, cy=world/2, band=260;
      for(let i=0;i<45;i++){
        const x = rand(60, world-60);
        const y = cy + rand(-band,band);
        list.push(mkObj(x,y, rand(10,55)));
      }
      for(let i=0;i<45;i++){
        const y = rand(60, world-60);
        const x = cx + rand(-band,band);
        list.push(mkObj(x,y, rand(10,55)));
      }
    }},
    { name:'DRAGON GEM CASTLE', story:'Gather the gems and wake the friendly dragon!', pattern:'diamonds', world:3600, build(list, world, spawn){
      const cx=world/2, cy=world/2;
      for(let i=0;i<20;i++){
        const a = rand(0,Math.PI*2), d = rand(0,260);
        list.push(mkObj(cx+Math.cos(a)*d, cy+Math.sin(a)*d, rand(60,110)));
      }
      for(let i=0;i<70;i++){
        const a = rand(0,Math.PI*2), d = rand(600,world*0.46);
        const x = cx+Math.cos(a)*d, y = cy+Math.sin(a)*d;
        if(x<30||y<30||x>world-30||y>world-30) continue;
        list.push(mkObj(x,y, rand(9,22)));
      }
    }},
    { name:'QUEEN MAISIE’S PARTY', story:'Save the whole rainbow kingdom—then celebrate!', pattern:'confetti', world:4200, build(list, world, spawn){
      const N = 170;
      for(let i=0;i<N;i++){
        let x,y,tries=0;
        do{ x=rand(40,world-40); y=rand(40,world-40); tries++; }
        while(Math.hypot(x-spawn.x,y-spawn.y)<220 && tries<20);
        list.push(mkObj(x,y, rand(8,140)));
      }
    }}
  ];

  function buildLevel(index){
    const def = LEVELS[index];
    WORLD = def.world;
    const spawn = { x: WORLD/2, y: WORLD/2 };
    const list = [];
    def.build(list, WORLD, spawn);
    addStarters(list, WORLD, spawn.x, spawn.y);
    // CORNER-GUARD: every collectible is pulled fully into an easy-to-reach
    // play lane. Its own size is included, so even giant emoji stay available.
    for(const o of list){
      const safe = Math.max(150, o.radius + 90);
      o.x = Math.max(safe, Math.min(WORLD-safe, o.x));
      o.y = Math.max(safe, Math.min(WORLD-safe, o.y));
    }
    return { list, spawn };
  }

  function showLevelToast(){
    const t = document.getElementById('levelToast');
    t.innerHTML = 'CHAPTER ' + (currentLevel+1) + ': ' + LEVELS[currentLevel].name + '<span id="storyLine">' + LEVELS[currentLevel].story + '</span>';
    t.classList.add('show');
    setTimeout(()=>{ t.classList.remove('show'); }, 2600);
  }

  function initGame(levelIndex){
    if(typeof levelIndex === 'number') currentLevel = levelIndex;
    const { list, spawn } = buildLevel(currentLevel);
    player = { x: spawn.x, y: spawn.y, radius: 22, targetX: spawn.x, targetY: spawn.y };
    objects = list;
    camX = spawn.x; camY = spawn.y;
    eatenCount = 0;
    totalCount = objects.length;
    running = true;
    screenShake = 0;
    lastMilestone = 0;
    trail = [];
    updateHUD();
    document.getElementById('msgOverlay').classList.remove('show');
    showLevelToast();
  }

  function updateHUD(){
    document.getElementById('sizeVal').textContent = Math.round(player.radius);
    document.getElementById('eatVal').textContent = eatenCount + ' / ' + totalCount;
    document.getElementById('levelVal').textContent = (currentLevel+1) + ' / ' + LEVELS.length;
    document.getElementById('barFill').style.width = (eatenCount/totalCount*100)+'%';
  }

  // ---------- Input ----------
  let pointerActive = false;
  function setTargetFromScreen(px,py, camX, camY, zoom){
    player.targetX = camX + (px - W/2)/zoom;
    player.targetY = camY + (py - H/2)/zoom;
  }
  let lastPointerScreen = null;

  canvas.addEventListener('pointerdown', e=>{
    ensureAudio();
    pointerActive = true;
    lastPointerScreen = {x:e.clientX,y:e.clientY};
  });
  canvas.addEventListener('pointermove', e=>{
    lastPointerScreen = {x:e.clientX,y:e.clientY};
  });
  window.addEventListener('pointerup', ()=>{ pointerActive = false; });

  const keys = {};
  window.addEventListener('keydown', e=>{
    ensureAudio();
    keys[e.key.toLowerCase()] = true;
  });
  window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

  // ---------- Game loop ----------
  let camX = WORLD/2, camY = WORLD/2;

  function zoomForRadius(r){
    // zoom out gently as player grows, clamped so things stay visible
    const z = 11 / (r*0.5 + 11);
    return Math.max(0.42, Math.min(1.15, z));
  }

  function update(dt){
    if(!running) return;

    let zoom = zoomForRadius(player.radius);

    // keyboard movement (direct velocity)
    let kx=0, ky=0;
    if(keys['arrowup']||keys['w']) ky -= 1;
    if(keys['arrowdown']||keys['s']) ky += 1;
    if(keys['arrowleft']||keys['a']) kx -= 1;
    if(keys['arrowright']||keys['d']) kx += 1;

    const speed = Math.min(900, 140 + player.radius*4.5);

    if(kx !== 0 || ky !== 0){
      const len = Math.hypot(kx,ky) || 1;
      player.x += (kx/len) * speed * dt;
      player.y += (ky/len) * speed * dt;
    } else if(pointerActive && lastPointerScreen){
      setTargetFromScreen(lastPointerScreen.x, lastPointerScreen.y, camX, camY, zoom);
      const dx = player.targetX - player.x;
      const dy = player.targetY - player.y;
      const dist = Math.hypot(dx,dy);
      if(dist > 4){
        const step = Math.min(dist, speed*dt);
        player.x += dx/dist * step;
        player.y += dy/dist * step;
      }
    }

    // Rainbow-door wrapping removes hard corners entirely. Snap the camera too,
    // so crossing an edge feels instant instead of dragging across the world.
    let warped = false;
    const edge = Math.max(12, player.radius * 0.35);
    if(player.x < edge){ player.x = WORLD-edge; warped = true; }
    else if(player.x > WORLD-edge){ player.x = edge; warped = true; }
    if(player.y < edge){ player.y = WORLD-edge; warped = true; }
    else if(player.y > WORLD-edge){ player.y = edge; warped = true; }
    if(warped){
      camX = player.x; camY = player.y;
      player.targetX = player.x; player.targetY = player.y;
      trail = [];
      milestoneSound();
    }

    camX += (player.x - camX) * Math.min(1, dt*6);
    camY += (player.y - camY) * Math.min(1, dt*6);

    trail.unshift({x:player.x, y:player.y});
    if(trail.length > 16) trail.pop();

    // collisions
    for(const o of objects){
      if(!o.alive) continue;
      // A gentle accessible-edge current guarantees that no object can remain
      // wedged against a side or corner, even after unusual screen resizing.
      const safe = Math.max(150, o.radius + player.radius*0.35 + 35);
      if(o.x < safe) o.x = Math.min(safe, o.x + 260*dt);
      if(o.x > WORLD-safe) o.x = Math.max(WORLD-safe, o.x - 260*dt);
      if(o.y < safe) o.y = Math.min(safe, o.y + 260*dt);
      if(o.y > WORLD-safe) o.y = Math.max(WORLD-safe, o.y - 260*dt);
      const d = Math.hypot(o.x-player.x, o.y-player.y);
      if(d < player.radius + o.radius*0.5){
        if(player.radius > o.radius * 1.08){
          o.alive = false;
          eatenCount++;
          const area = Math.PI*player.radius*player.radius + Math.PI*o.radius*o.radius*0.55;
          player.radius = Math.sqrt(area/Math.PI);
          screenShake = Math.min(14, 3 + o.radius*0.15);
          eatSound(o.radius);
          updateHUD();

          const pct = eatenCount/totalCount;
          if(pct >= 0.25 && lastMilestone < 1){ lastMilestone=1; milestoneSound(); }
          if(pct >= 0.5 && lastMilestone < 2){ lastMilestone=2; milestoneSound(); }
          if(pct >= 0.75 && lastMilestone < 3){ lastMilestone=3; milestoneSound(); }

          if(eatenCount >= totalCount){
            running = false;
            showEnd(true);
          }
        } else {
          // push player back slightly from too-big object
          const dx = player.x - o.x, dy = player.y - o.y;
          const dd = Math.hypot(dx,dy) || 1;
          const overlap = (player.radius + o.radius*0.5) - d;
          player.x += (dx/dd) * overlap * 0.5;
          player.y += (dy/dd) * overlap * 0.5;
        }
      }
    }

    if(screenShake > 0) screenShake *= 0.85;
  }

  function drawShape(o, screenX, screenY, screenR, danger){
    ctx.save();
    ctx.translate(screenX, screenY);
    ctx.rotate(o.rot);
    ctx.fillStyle = o.color;
    ctx.strokeStyle = danger ? '#ff2b5e' : '#ffffff';
    ctx.lineWidth = danger ? 6 : 3;

    const s = screenR;

    if(EMOJIS[o.kind]){
      ctx.rotate(-o.rot);
      ctx.shadowColor = danger ? '#ff2b5e' : o.color;
      ctx.shadowBlur = Math.max(10, s*0.42);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `${Math.max(34, s*2.35)}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
      ctx.fillText(EMOJIS[o.kind], 0, s*0.06);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = danger ? '#ff2b5e' : '#ffffff';
      ctx.lineWidth = Math.max(4, s*0.10);
      ctx.beginPath(); ctx.arc(0,0,s*1.17,0,Math.PI*2); ctx.stroke();
      ctx.restore();
      return;
    }

    if(o.kind === 'heart'){
      const h = s*1.3;
      ctx.beginPath();
      ctx.moveTo(0, h*0.35);
      ctx.bezierCurveTo(h*0.9, -h*0.3, h*0.55, -h*0.95, 0, -h*0.25);
      ctx.bezierCurveTo(-h*0.55, -h*0.95, -h*0.9, -h*0.3, 0, h*0.35);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if(o.kind === 'star'){
      const spikes = 5, outer = s*1.15, inner = s*0.5;
      ctx.beginPath();
      for(let i=0;i<spikes*2;i++){
        const rad = i%2===0 ? outer : inner;
        const a = (Math.PI/spikes)*i - Math.PI/2;
        ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if(o.kind === 'flower'){
      const petals = 5, pr = s*0.55;
      for(let i=0;i<petals;i++){
        const a = (Math.PI*2/petals)*i;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a)*pr, Math.sin(a)*pr, pr*0.75, pr*0.45, a, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(0,0,s*0.4,0,Math.PI*2);
      ctx.fillStyle = '#ffe600';
      ctx.fill();
      ctx.strokeStyle = danger ? '#ff2b5e' : '#ffffff';
      ctx.beginPath(); ctx.arc(0,0,s*1.15,0,Math.PI*2); ctx.stroke();
    } else if(o.kind === 'gem'){
      const w = s*1.1, h = s*1.3;
      ctx.beginPath();
      ctx.moveTo(0,-h*0.6);
      ctx.lineTo(w*0.6,-h*0.1);
      ctx.lineTo(w*0.35,h*0.6);
      ctx.lineTo(-w*0.35,h*0.6);
      ctx.lineTo(-w*0.6,-h*0.1);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if(o.kind === 'cupcake'){
      const w = s*1.3, h = s*1.3;
      // wrapper
      ctx.fillStyle = o.color;
      ctx.beginPath();
      ctx.moveTo(-w*0.5, h*0.1);
      ctx.lineTo(w*0.5, h*0.1);
      ctx.lineTo(w*0.32, h*0.6);
      ctx.lineTo(-w*0.32, h*0.6);
      ctx.closePath();
      ctx.fill();
      // frosting swirl
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0,-h*0.05, w*0.5, Math.PI, 0);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0,-h*0.35, w*0.32, 0, Math.PI*2);
      ctx.fill();
      // cherry
      ctx.fillStyle = '#ff2e6d';
      ctx.beginPath();
      ctx.arc(0,-h*0.6, w*0.14, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = danger ? '#ff2b5e' : '#ffffff';
      ctx.beginPath(); ctx.arc(0,0,s*1.2,0,Math.PI*2); ctx.stroke();
    } else { // bow
      const w = s*1.2, h = s*0.85;
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.lineTo(-w,-h); ctx.lineTo(-w,h); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.lineTo(w,-h); ctx.lineTo(w,h); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0,0,s*0.28,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = danger ? '#ff2b5e' : '#ffffff';
      ctx.beginPath(); ctx.arc(0,0,s*1.3,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }

  let trail = [];

  function drawWorldPattern(zoom){
    const type = LEVELS[currentLevel].pattern;
    const colors = ['#ff4fa3','#ff9f1c','#ffe14d','#39e68c','#39bfff','#a96bff'];
    ctx.save();
    ctx.globalAlpha = 0.17;
    ctx.lineWidth = 10/zoom;
    if(type === 'checker'){
      const s=260;
      for(let y=0;y<WORLD;y+=s) for(let x=0;x<WORLD;x+=s){
        ctx.fillStyle=colors[((x/s)+(y/s))%colors.length]; ctx.fillRect(x,y,s,s);
      }
    } else if(type === 'rings' || type === 'spiral'){
      const cx=WORLD/2, cy=WORLD/2;
      for(let r=180,i=0;r<WORLD*.72;r+=190,i++){
        ctx.strokeStyle=colors[i%colors.length]; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
      }
    } else if(type === 'lanes'){
      colors.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(0,140+i*(WORLD-280)/6,WORLD,125);});
    } else if(type === 'waves'){
      for(let y=100,i=0;y<WORLD;y+=190,i++){
        ctx.strokeStyle=colors[i%colors.length];ctx.beginPath();
        for(let x=0;x<=WORLD;x+=40) ctx.lineTo(x,y+Math.sin(x/85)*55);
        ctx.stroke();
      }
    } else if(type === 'diamonds'){
      for(let y=120;y<WORLD;y+=300) for(let x=120;x<WORLD;x+=300){
        ctx.strokeStyle=colors[((x+y)/300)%colors.length|0];ctx.strokeRect(x-55,y-55,110,110);
      }
    } else {
      for(let y=100;y<WORLD;y+=240) for(let x=100;x<WORLD;x+=240){
        const i=((x+y)/240)|0; ctx.fillStyle=colors[i%colors.length];
        ctx.beginPath();ctx.arc(x+(i%2)*65,y, type==='polka'?70:24,0,Math.PI*2);ctx.fill();
      }
    }
    ctx.restore();
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,W,H);

    const zoom = zoomForRadius(player.radius);
    const shakeX = (Math.random()-0.5) * screenShake;
    const shakeY = (Math.random()-0.5) * screenShake;

    ctx.save();
    ctx.translate(W/2 + shakeX, H/2 + shakeY);
    ctx.scale(zoom, zoom);
    ctx.translate(-camX, -camY);

    drawWorldPattern(zoom);

    // World border: animated-looking rainbow doors, not solid walls.
    const stripeColors = ['#ff2e6d','#ff9d1f','#ffe600','#29e07a','#1fb8ff','#b04dff'];
    stripeColors.forEach((col,i)=>{
      ctx.strokeStyle = col;
      ctx.lineWidth = 10 / zoom;
      ctx.strokeRect(5 + i*(11/zoom), 5 + i*(11/zoom), WORLD-10-i*(22/zoom), WORLD-10-i*(22/zoom));
    });
    ctx.save();
    ctx.font = `${72/zoom}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let p=180;p<WORLD;p+=360){
      ctx.fillText('🌈',p,42/zoom); ctx.fillText('🌈',p,WORLD-42/zoom);
      ctx.fillText('🌈',42/zoom,p); ctx.fillText('🌈',WORLD-42/zoom,p);
    }
    ctx.restore();

    // rainbow trail behind the unicorn - bright and saturated for visibility
    for(let i=0;i<trail.length;i++){
      const t = trail[i];
      const hue = (i*22) % 360;
      const alpha = i/trail.length * 0.85;
      ctx.fillStyle = `hsla(${hue},100%,60%,${alpha})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, player.radius*0.4*(i/trail.length+0.2), 0, Math.PI*2);
      ctx.fill();
    }

    // objects
    for(const o of objects){
      if(!o.alive) continue;
      const danger = o.radius > player.radius * 0.92;
      drawShape(o, o.x, o.y, o.radius, danger);
    }

    // Player halo makes Maisie easy to find against every colorful pattern.
    const r = player.radius;
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.fillStyle='rgba(255,45,184,.22)';
    ctx.beginPath();ctx.arc(0,0,r*1.55,0,Math.PI*2);ctx.fill();

    // body - solid white with thick black outline for max contrast on black
    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = Math.max(4, r*0.1);
    ctx.strokeStyle = '#000000';
    ctx.stroke();

    // rainbow mane arcs along one side - fully saturated
    const maneColors = ['#ff2e6d','#ff9d1f','#ffe600','#29e07a','#1fb8ff','#b04dff'];
    maneColors.forEach((col,i)=>{
      ctx.beginPath();
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(3, r*0.1);
      ctx.arc(0,0, r*(0.55 + i*0.07), Math.PI*0.55, Math.PI*1.15);
      ctx.stroke();
    });

    // ears
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = Math.max(2, r*0.05);
    ctx.beginPath();
    ctx.moveTo(-r*0.35,-r*0.85); ctx.lineTo(-r*0.55,-r*1.3); ctx.lineTo(-r*0.12,-r*0.95); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(r*0.35,-r*0.85); ctx.lineTo(r*0.55,-r*1.3); ctx.lineTo(r*0.12,-r*0.95); ctx.closePath();
    ctx.fill(); ctx.stroke();

    // horn - bright gold with black outline
    ctx.fillStyle = '#ffe600';
    ctx.beginPath();
    ctx.moveTo(0,-r*1.9);
    ctx.lineTo(r*0.22,-r*0.85);
    ctx.lineTo(-r*0.22,-r*0.85);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = Math.max(2, r*0.045);
    ctx.stroke();

    // eyes - solid black for max contrast
    ctx.fillStyle = '#000000';
    ctx.beginPath(); ctx.arc(-r*0.32,-r*0.05, Math.max(2.5,r*0.1), 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.32,-r*0.05, Math.max(2.5,r*0.1), 0, Math.PI*2); ctx.fill();

    ctx.restore();
    ctx.restore();
  }

  function showEnd(won){
    const overlay = document.getElementById('msgOverlay');
    const btn = document.getElementById('restartBtn');
    const isLastLevel = currentLevel >= LEVELS.length - 1;
    document.getElementById('msgTitle').textContent = won
      ? (isLastLevel ? 'RAINBOW KINGDOM SAVED! 🌈👑' : 'CHAPTER COMPLETE! ✨')
      : 'GAME OVER';
    document.getElementById('msgSub').textContent = won
      ? (isLastLevel ? 'QUEEN MAISIE’S BIG COLOR PARTY IS READY!' : LEVELS[currentLevel].story + '  FINAL SIZE: ' + Math.round(player.radius))
      : '';
    if(won && !isLastLevel){
      btn.textContent = 'NEXT LEVEL';
      btn.dataset.action = 'next';
    } else {
      btn.textContent = 'PLAY AGAIN';
      btn.dataset.action = 'restart';
    }
    overlay.classList.add('show');
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05,(now-last)/1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  document.getElementById('startBtn').addEventListener('click', ()=>{
    ensureAudio();
    document.getElementById('startOverlay').style.display = 'none';
    initGame(0);
  });
  document.getElementById('restartBtn').addEventListener('click', (e)=>{
    const action = e.target.dataset.action;
    if(action === 'next'){
      initGame(currentLevel + 1);
    } else {
      initGame(0);
    }
  });

  initGame(0);
  running = false; // wait for start button
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
