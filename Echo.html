<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Echo</title>
<style>
  body {background:black;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}
  button {
    width:100px;height:100px;border-radius:50%;border:none;
    background:white;box-shadow:0 0 20px white;outline:none;
  }
</style>
</head>
<body>
<!-- beep-back-button -->
<a id="beep-back" href="index.html" aria-label="Back to Artcade" title="Back to Artcade">&#8249;</a>
<style>
#beep-back{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:max(8px, env(safe-area-inset-left));
  z-index:2147483647;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(10,10,18,0.62);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#beep-back:active{ transform:scale(0.92); }
</style>
<script>
(function(){
  var b = document.getElementById('beep-back');
  if(!b) return;
  var go = function(e){
    e.preventDefault();
    e.stopPropagation();
    window.location.href = b.getAttribute('href');
  };
  b.addEventListener('click', go, {capture:true});
  b.addEventListener('touchstart', go, {capture:true, passive:false});
})();
</script>


<button id="btn"></button>
<script>
const btn = document.getElementById('btn');
let ctx, mic, delay, feedback, gain;

btn.addEventListener('click', async () => {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mic = ctx.createMediaStreamSource(stream);
    delay = ctx.createDelay(2.0);
    feedback = ctx.createGain();
    gain = ctx.createGain();

    delay.delayTime.value = 0.3; // echo delay time (seconds)
    feedback.gain.value = 0.4;   // echo feedback intensity
    gain.gain.value = 1.0;

    // routing: mic → delay → feedback → delay (loop) → output
    mic.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(gain);
    gain.connect(ctx.destination);
  }
  // resume context if suspended
  if (ctx.state === 'suspended') await ctx.resume();
});
</script>
</body>
</html>
